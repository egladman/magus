# An engineered zone: a path whose complexity a measurement licenses. reason is
# spec, performance or security; evidence names the files that license it;
# budgets are the anchors the zone holds in place of the strict ones, stated
# below today's outliers. An item already past its anchor may not grow, in a
# zone or out of one. A path with no zone gets the strict budgets. No rule
# reads zones yet: the size and growth rules will.
zones:
  - path: libs/gopherbuzz/**
    reason: spec
    evidence:
      - libs/gopherbuzz/conformance_test.go
      - libs/gopherbuzz/README.md#upstream-parity
      - libs/gopherbuzz/benchmarks/upstream/upstream_test.go
      - libs/gopherbuzz/benchmarks/comparison/comparison_test.go
    # magus.yaml's knowledge.conformance.exclude and the .golangci.yml path
    # exclusion still hold this until a rule reads the zone.
    budgets:
      conformance: excluded
  - path: internal/guard/**
    reason: security
    # Built by the guard-security-zone job; until those files exist the claim is
    # unproven and the strict budgets apply.
    evidence:
      - docs/design/guard-threat-model.md
      - internal/guard/*_fuzz_test.go
      - internal/guard/testdata/bypass/
    # The anchors this zone holds in place of the strict 167 and 1500, set below
    # today's outliers (Judge at 957 lines, lease.go at 4407) so neither becomes
    # legal: a function or file already past its anchor still may not grow.
    # Assumed values, for Eli to set.
    budgets:
      func-lines: 250
      file-lines: 2500
