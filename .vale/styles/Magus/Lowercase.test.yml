- name: "sentence case"
  format: commit
  input: "# Add a vale spell\n"
  contains: "Magus.Lowercase"
- name: "a conventional prefix then sentence case"
  format: commit
  input: "# feat: Add a vale spell\n"
  contains: "Magus.Lowercase"
- name: "an identifier may open it"
  format: commit
  input: "# fix(cache): README names the key\n"
  absent: ["Magus.Lowercase"]
