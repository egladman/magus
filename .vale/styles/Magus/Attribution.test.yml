- name: "a co-author trailer"
  format: commit
  input: "# add a vale spell\n\nCo-Authored-By: someone <someone@example.com>\n"
  contains: "Magus.Attribution"
- name: "a generated-with line"
  format: commit
  input: "Generated with some tool\n"
  contains: "Magus.Attribution"
- name: "no attribution"
  format: commit
  input: "# add a vale spell\n"
  absent: ["Magus.Attribution"]
