# magus workspace config. Most settings use built-in defaults; only what this
# repo overrides is listed here.

# Charms applied to every `magus run` / `magus x` by default. The ci anchor
# still strips rw, and `--no-default-charms` ignores them for a single run.
default_charms:
  - rw

sandbox:
  # The tools this repo pins run through mise, which no spell owns: its installs and
  # shims run, its cache is written, its trust store is only read. Each entry sits
  # where mise itself would look, its variable first. The toolchains' own caches (Go's,
  # pnpm's, buf's) come from the spells that drive them.
  allow:
    - name: mise-installs
      env: MISE_DATA_DIR
      base: xdgData
      path: mise
      mode: rx
    - name: mise-cache
      env: MISE_CACHE_DIR
      base: userCache
      path: mise
      mode: rw
    - name: mise-state
      env: MISE_STATE_DIR
      base: xdgState
      path: mise
      mode: ro
  env:
    passthrough:
      # The tools this repo pins run through mise. Without its trust list a sandboxed
      # child refuses a checkout's mise.toml, and without MISE_SAFE a pull request's
      # mise.toml could run its own hooks inside the merge queue's candidates. The
      # queue gives each candidate a home of its own and points mise's data and config
      # back at the runner's, which its shims find the installed tools by. Named, not
      # MISE_*, which would carry MISE_GITHUB_TOKEN too.
      - MISE_TRUSTED_CONFIG_PATHS
      - MISE_SAFE
      - MISE_DATA_DIR
      - MISE_CONFIG_DIR

cache:
  remote:
    # Trust set for the shared remote cache (wired via magus.cache.remote in the
    # magusfile). A remote artifact is replayed only if signed by one of these
    # Ed25519 public keys. The matching secret seed lives in CI as the
    # MAGUS_CACHE_SIGNING_KEY secret (only trusted pushes hold it), so a developer
    # laptop or a fork PR cannot publish artifacts that replay here. Keep prior
    # keys listed during a rotation (overlap, then drop the old one).
    #
    # The same value must be set as the MAGUS_CACHE_PUBLIC_KEY repository variable:
    # ci.yaml hands it to MAGUS_CACHE_REMOTE_TRUSTED_KEYS, which REPLACES this list
    # rather than adding to it, and it is also what wires the backend at all. The two
    # disagreeing means CI and a laptop trust different keys, silently.
    trusted_keys:
      - "4VhfiMjDLmoVolYdjgPHwpHjw9+aGnoHe87P6V3inAk="

# The oldest magus that can load this workspace.
#
# 0.4.0 because magusfile.buzz and docs/render.buzz call str.indexOf(needle, from:), which
# no release carries yet. An older binary does not reject the extra argument, it IGNORES
# it - so the glossary linker's "find the next match" loop never advances and the render
# HANGS. A hang is the worst way for a version mismatch to present: no output, no exit
# code, nothing naming the cause. The floor turns it into MGS1021, which says which build
# is running and what it needs.
#
# Naming a release that does not exist yet is deliberate and safe: the ward exempts dev
# builds, and a source build is compiled FROM the workspace it runs, so it cannot lack a
# feature that workspace uses. The binary this catches is a shipped release built
# somewhere else - which is the only kind that can actually be too old.
#
# WHEN TO RAISE IT, because the answer is not "whenever you use something new". While
# this names an UNRELEASED version, every capability added lands in that same version, so
# the floor stays true for free - `Secret` was added after this line was written and
# needed no change. It rots on exactly one event: the named version SHIPS, and a later
# change starts using something the shipped one lacks. That is the only trigger.
#
# The reason to state it: that trigger depends on somebody noticing a release boundary,
# and when they do not, the failure is a DEADLOCK rather than a warning - every magus
# command fails at workspace load, including the one that would build a newer binary.
# ward.ExplainStaleBinary is the backstop for when this goes stale anyway; it cannot
# prevent the failure, only name it. Keeping this line current is what prevents it.
#
# It does NOT catch a binary older than required_version itself, which simply does not
# know the key: v0.3.1 warns "field required_version not found" and then fails on whatever
# it hits first. A floor is only enforceable by a binary that has heard of floors. That is
# why requireIndexOfFrom() in docs/render.buzz stays - a capability probe runs on every
# binary, and it is what turns the hang into a sentence on the ones this cannot reach.
required_version: ">= 0.4.4"

# The workspace's human-authored notes, and the git history the graph needs to tell when
# prose has fallen behind what it describes.
#
# notes.path is DECLARED rather than assumed because magus judges writes to it: a deny
# fired on a guessed location would block work in a workspace that never opted in. It must
# stay inside the checkout - that is what makes git attribute a note to whoever wrote it,
# and what keeps the @notes shard safe to share.
#
# vcs.enabled is what makes staleness measurable at all. Without it there are no author
# nodes and no last-modified dates, so prose staleness is unmeasured (which ranks as
# neutral, never as fresh).
knowledge:
  notes:
    shared: notes
  vcs:
    enabled: true
  # This repository loads its own Claude Code sessions with the adapter it ships, the
  # same way it wires the guard template it ships rather than keeping a private copy. If
  # the recipe breaks for a reader, it broke here first.
  #
  # The script resolves ./magus by walking up to the magusfile, so nothing here names a
  # binary; from a worktree with no ./magus it falls through to PATH and says so on
  # stderr. It carries its own byte offsets per transcript, so `graph build` running it
  # every time costs a stat and a tail once the first load is done.
  sessions:
    adapters:
      - host: claude-code
        command: ["sh", "docs/guides/integrations/agents/magus-session-load-claude-code.sh"]
