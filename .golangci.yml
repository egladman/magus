version: "2"

linters:
  default: none
  enable:
    # --- Core correctness ---
    - govet           # standard go vet (shadow, printf, composite literals, ...)
    - staticcheck     # SA/ST static analysis: bugs, deprecated usage, simplifications
    - errcheck        # unchecked errors: every non-blank error return must be handled
    - errorlint       # enforce %w wrapping; forbid == / type-assert on errors
    - nilerr          # catch "return nil, err" when err is nil
    - nilnil          # catch functions returning (nil, nil) — callers can't distinguish
    - wastedassign    # assignments whose result is never used
    - unused          # unused vars, consts, types, funcs (catches dead code package-wide)
    # A malformed compiler directive is not a syntax error - it is a COMMENT, so the
    # compiler ignores it silently and the constraint you thought you wrote never
    # applies. `// go:build linux` (one stray space) compiles a linux-only file on
    # every platform. This tree carries ~52 build-tagged files (io_uring, the stat and
    # topology variants, the unix/windows server detach pair), so that failure would be
    # both easy to introduce and slow to attribute. Zero findings when adopted: it is a
    # ratchet, not a cleanup.
    - gocheckcompilerdirectives # //go: directives are well-formed and actually apply

    # --- HTTP safety ---
    - bodyclose       # HTTP response bodies must be closed (OTLP exporter)

    # --- Type safety ---
    - forcetypeassert # forbid unchecked type assertions (x.(T) without ok guard)
    - musttag         # every field of a marshaled struct must carry a json tag
    # json.Marshal panics on nothing but silently drops or errors on an unsupported
    # field (chan, func, complex, a cyclic map) - so a call site that proved the
    # error unreachable and started ignoring it (body, _ := json.Marshal(v)) has
    # that proof go stale the moment someone adds one of those fields back to v.
    # musttag above catches a missing json tag on the way in; this catches the
    # marshal call itself losing the error-safety invariant its blank identifier
    # depends on. Zero findings when adopted: it is a ratchet, not a cleanup.
    - errchkjson
    - unconvert       # remove redundant type conversions
    - durationcheck   # catch time.Duration multiplication bugs

    # --- Code quality ---
    - gocritic        # broad set: performance, style, diagnostic checks
    - unparam         # report unused function parameters
    - prealloc        # suggest slice pre-allocations
    # prealloc above tells you to preallocate a slice's capacity; it says nothing
    # about length. make([]T, n) followed by append(...) keeps that half of the
    # mistake legal - the slice grows past its n zero-valued elements instead of
    # filling them, so the result carries n silent zeros ahead of every real
    # value. makezero is the length half of what prealloc only checks the
    # capacity half of. Zero findings when adopted: it is a ratchet, not a cleanup.
    - makezero
    # A bidirectional override (U+202E and its family) reorders how a line RENDERS while
    # leaving the bytes the compiler reads untouched, so a reviewer and the toolchain can be
    # made to disagree about what a line says. Nothing in Go's own tooling reports one, and
    # this tree is read in review: a deception it failed to notice in its own source is one
    # it would then render to somebody else. Zero findings when adopted: it is a ratchet, not
    # a cleanup. The renderer half of this lives in internal/diff.SanitizeBidi, which is what
    # protects code magus DISPLAYS rather than code it ships.
    - bidichk
    - gosec           # security: subprocess safety, path traversal, etc.

    # --- Secret safety ---
    # slog's *Context variants are what carry the run's secret resolver, so a
    # context-less slog.Info/Error redacts against NOTHING and does it silently. That
    # is not hypothetical: five separate credential leaks on this codebase were all
    # "one call site forgot". Fixing the existing ones by hand does not hold the line;
    # this does. Scoped by the exclusions below to the packages a resolved secret can
    # actually reach - see the note there for why the CLI's own startup is exempt.
    - sloglint

    # --- Style ---
    # godoc conventions revive's `exported` rule does NOT catch: a doc comment whose
    # leading name drifted away from the symbol after a rename (three real cases when
    # this was enabled - "Clean" over func Delete, "GC" over func Evict, "Package
    # depgraph" over package dependency), and a file header sitting flush against the
    # package clause, which Go silently reads as a SECOND package doc. Both mislead a
    # reader who has every reason to trust the comment.
    - godoclint       # godoc practice: doc starts with its symbol, one package doc
    # Doc comments are the ones that get RENDERED - pkg.go.dev, editor hovers - as
    # prose, so one trailing off unpunctuated reads as truncated. Left at the default
    # `declarations` scope on purpose: that covers exactly the rendered comments and
    # leaves inline commentary alone, which is where a period rule would just be
    # noise. Do NOT set `scope: all` - godot v1.5.6 PANICS on this tree (index out of
    # range in checkPeriod, package codec), and the crash is swallowed as "0 findings".
    - godot           # doc comments end in a period
    - revive          # idiomatic naming, exported comments, error-string casing
    - misspell        # common English spelling mistakes in comments and strings
    - nolintlint      # enforce that //nolint directives include a reason
    - whitespace      # flag unnecessary blank lines inside functions/blocks

    # --- In-repo linters (see libs/testlayout/.custom-gcl.yml) ---
    # testpair reports every X_test.go with no X.go beside it, with no exemptions:
    # no conventional names, no allow list, no marker, no exclusion below. It is a
    # linter of its own so the //nolint:testlayout an import cycle earns cannot
    # silence it, and hack/lint/testlayout-pairing-has-no-exemptions.buzz refuses
    # any directive or exclusion that would. testlayout reports a test file outside
    # its package and a _unix file name. The reasoning is in libs/testlayout/readme.md.
    #
    # These only exist in .magus/custom-gcl. The stock golangci-lint on PATH
    # cannot read this config while the lines below are present - it exits with
    # `plugin("testlayout") not found`. That is the price of golangci-lint having
    # no runtime plugin loading, and it is why `magus run lint` builds the binary.
    - testlayout
    - testpair

    # This repo's own rules over Go source, one linter each, from libs/conventions
    # (its readme.md says what each reports). They were tree-walking tests in
    # conventions_test.go; the policy (paths, word lists, ceilings) lives below.
    - hostagnostic
    - hostvocab
    - ruletext
    - asciistrings
    - importceiling
    - stutter
    - filenames
    - nameoutput
    - testisolation
    - providerio
    - fieldwise
    - diagmsg
    - errmsg

    # A NoError that continues past a failure reads a nil result and panics, burying
    # the error that explains it; go-require keeps require's FailNow off goroutines.
    - testifylint

    # types is the near-leaf domain package; see the rule below.
    - depguard

  settings:
    depguard:
      rules:
        # types/doc.go's contract: no filesystem, VCS, or process execution. What it
        # forbids is REACHING THE WORLD; string work over paths and host:port stays
        # legal, which is why path/filepath and net are not here. Of magus it may
        # import only the four packages allowed below. internal/json is one because
        # every package that encodes JSON must use it.
        #
        # Every deny ends in `$` because depguard matches prefixes, and `os` would
        # otherwise ban os/signal too. The magus prefix has no `$` on purpose.
        types-pure-domain:
          list-mode: lax
          files:
            - "${base-path}/types/*.go"
            - "!$test"
          allow:
            - github.com/egladman/magus/spells$
            - github.com/egladman/magus/libs/diagnostics$
            - github.com/egladman/magus/internal/json$
            - github.com/egladman/magus/types/enum$
          deny:
            - pkg: os$
              desc: types is the near-leaf domain package and may not reach the world
            - pkg: os/exec$
              desc: types is the near-leaf domain package and may not reach the world
            - pkg: io/fs$
              desc: types is the near-leaf domain package and may not reach the world
            - pkg: net/http$
              desc: types is the near-leaf domain package and may not reach the world
            - pkg: database/sql$
              desc: types is the near-leaf domain package and may not reach the world
            - pkg: os/user$
              desc: types is the near-leaf domain package and may not reach the world
            - pkg: github.com/egladman/magus/
              desc: types may depend on spells, libs/diagnostics, internal/json and types/enum, nothing else in magus

        # libs/conventions and libs/testlayout are magus-repo policy, never shipped.
        root-imports-no-repo-policy:
          list-mode: lax
          files:
            - $all
            - "!$test"
          deny:
            - pkg: github.com/egladman/magus/libs/conventions
              desc: the conventions are magus-repo policy and never ship in the root module
            - pkg: github.com/egladman/magus/libs/testlayout
              desc: the conventions are magus-repo policy and never ship in the root module


    custom:
      testlayout:
        type: module
        description: reports a test file outside its package, or named for unix
        original-url: github.com/egladman/magus/libs/testlayout
        settings:
          # Name the platforms (X_linux.go, X_darwin.go, X_other.go), never unix.
          report-unix-suffix: true

      # No settings block: testpair takes none, and refuses one at config load.
      testpair:
        type: module
        description: reports a test file with no source file of the same name
        original-url: github.com/egladman/magus/libs/testlayout

      hostagnostic:
        type: module
        description: reports Go source naming an agent host outside a filesystem path
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          # Generated output, and the packages that embed documentation checked
          # elsewhere. Each must name a directory holding Go files; the go tool
          # never builds dot directories or testdata, so they need no entry. The
          # prose judge is skipped too: its attribution rule names the tools whose
          # credit it refuses, which is this repository's policy, not magus naming a host.
          skip-dirs: [gen, docs, schema, prose]
          hosts: [claude, opencode, codex, aider, windsurf]
          # Cursor is a terminal position and a pagination token far more often
          # than the host, so only the shapes that mean the host are matched: the
          # proper noun in parentheses, its machinery, and a comparison against
          # the host label. A bare `case "cursor":` is not matched, since no
          # line-level pattern separates it from a diff-session or memory op.
          host-patterns:
            - '\(Cursor\)'
            - '(?i)\bcursor (hooks?|ide|editor|rules)\b'
            - '(?i)[!=]=\s*"cursor"'
          hint: magus names a host only in a path such as .claude/skills

      hostvocab:
        type: module
        description: reports a host's tool name spelled as a string literal in guard code
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          # The only code that sees a host's hook payload. Tree-wide, "Read" and
          # "Task" are ordinary words and would report hundreds of times.
          files:
            - internal/guard/*.go
            - cmd/magus/shell*.go
            - guard.go
            - internal/agent/*.go
          # magus's own labels (hookToolCommand, hookToolWrite, hookToolRead in
          # internal/guard/guard.go) are deliberately none of these.
          words: [Read, Write, Edit, MultiEdit, NotebookEdit, Glob, Grep, Bash, Task, TodoWrite,
                  WebFetch, WebSearch, ExitPlanMode, read_file, write_file, edit_file, list_dir,
                  apply_patch, run_terminal_cmd, str_replace_editor, codebase_search, shell]
          hint: >-
            record magus's own label (hookToolCommand, hookToolWrite, hookToolRead) and let
            the wrapper in the reader's config map to it by which flag it passes

      ruletext:
        type: module
        description: reports guard rule text in the guard's CLI half
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          files: [cmd/magus/shell.go]
          prefix: "magus workspace:"
          hint: the guard is internal/guard, and `magus session ls` replays its rules

      # A message magus prints is a verdict, one next command and a ref for the
      # rationale. The sites below build one; a rationale field beside a verdict
      # (ShellVerdict's Why) is left out on purpose and never judged.
      diagmsg:
        type: module
        description: judges the messages magus prints by the prose message rules
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          max-runes: 160
          calls:
            - {func: github.com/egladman/magus/types.DiagnosticErrorf, arg: 1, format: true}
            - {func: github.com/egladman/magus/types.WrapDiagnostic, arg: 2, format: true}
            - {func: github.com/egladman/magus/types.FormatDiagnostic, arg: 1}
            - {func: "(*github.com/egladman/magus/libs/diagnostics.Domain).Errorf", arg: 1, format: true}
            - {func: "(*github.com/egladman/magus/libs/diagnostics.Domain).Wrapf", arg: 2, format: true}
            - {func: "(*github.com/egladman/magus/libs/diagnostics.Domain).Format", arg: 1}
            - {func: github.com/egladman/magus/internal/hint.breadcrumb, arg: 2}
          fields:
            - {type: github.com/egladman/magus/internal/hint.Next, field: Why}
            - {type: github.com/egladman/magus/internal/guard.ShellVerdict, field: Deny}
            - {type: github.com/egladman/magus/internal/guard.ShellVerdict, field: Lead}
            - {type: github.com/egladman/magus/types.RuleDoc, field: Catches}
          prefixes: ["magus workspace:"]
          # A log record names what logged it with a component attribute
          # (internal/logattr), never a tag in its text. The allow list below
          # never exempts a slog message.
          slog: true
          hint: a message is the verdict, one next command and a ref; the rationale goes behind the ref
          # A RATCHET: every file holding a finding on 2026-10-09 (173 findings in 54
          # files: 87 message-length, 56 message-rationale, 24 message-tag, 6
          # message-commands), exempt until the terse-output rewrites land. Delete an
          # entry once its file is clean; never add one.
          allow:
            - {file: cmd/magus/gate_redundancy.go, reason: staged}
            - {file: cmd/magus/spell.go, reason: staged}
            - {file: cmd/magus/stale_index.go, reason: staged}
            - {file: describe.go, reason: staged}
            - {file: internal/auth/share.go, reason: staged}
            - {file: internal/auth/store.go, reason: staged}
            - {file: internal/auth/token.go, reason: staged}
            - {file: internal/cache/deadlock.go, reason: staged}
            - {file: internal/cache/machine_gate.go, reason: staged}
            - {file: internal/cache/mutation.go, reason: staged}
            - {file: internal/cache/order.go, reason: staged}
            - {file: internal/handler/token/service.go, reason: staged}
            - {file: internal/hint/schema.go, reason: staged}
            - {file: internal/interp/bindings/buzz.go, reason: staged}
            - {file: internal/interp/bindings/imports.go, reason: staged}
            - {file: internal/interp/bindings/skills.go, reason: staged}
            - {file: internal/interp/runtime.go, reason: staged}
            - {file: internal/interp/transform/transform.go, reason: staged}
            - {file: internal/job/checkout.go, reason: staged}
            - {file: internal/job/claim.go, reason: staged}
            - {file: internal/queue/apply.go, reason: staged}
            - {file: internal/spell/remote/imports.go, reason: staged}
            - {file: internal/ward/shadow.go, reason: staged}
            - {file: internal/ward/version.go, reason: staged}
            - {file: internal/ward/ward.go, reason: staged}
            - {file: internal/workspace/provider.go, reason: staged}
            - {file: lock.go, reason: staged}
            - {file: magus.go, reason: staged}
            - {file: pipe.go, reason: staged}
            - {file: run.go, reason: staged}
            - {file: std/fs.go, reason: staged}
            - {file: std/magus.go, reason: staged}
            - {file: symbol.go, reason: staged}
            - {file: types/secret.go, reason: staged}
            - {file: watchdog.go, reason: staged}

      # A plain Go error is a fragment its callers chain context onto with ": ".
      # diagmsg judges what magus prints; this judges errors.New and fmt.Errorf,
      # including one built only to wrap inside a coded diagnostic. With module
      # set, the same block judges a lib module's packages when its run enables
      # this linter; libs/gopherbuzz is excluded below.
      errmsg:
        type: module
        description: 'judges error text (errors.New, fmt.Errorf, Error methods) as a fragment chained with ": "'
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          allow:
            - {file: libs/diagnostics/diagnostics.go, rule: error-newline, reason: "a coded diagnostic renders its see: line for a person; diagmsg judges it"}

      asciistrings:
        type: module
        description: reports typographic glyphs in user-facing string literals
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          # Exactly the files the ASCII sweep fixed, not whole packages: cmd/magus,
          # status.go's pool display and internal/cache/log.go keep drawing glyphs on
          # purpose, and files the sweep never touched may carry drift it was not
          # scoped to fix. Reverting any one fix here still fails.
          files:
            - types/describe.go
            - internal/render/target_graph.go
            - cmd/magus-docs/main.go
            - internal/observability/otlp/provider.go
            - internal/handler/mcp/registry.go
            - cmd/magus/query.go
            - internal/guard/shell.go
            - internal/guard/write.go
            - cmd/magus/config_console.go
            - internal/doctor/checks.go
            - cmd/magus/init.go
            - internal/config/load.go
            - internal/config/validate.go
            - internal/interp/repl.go
            - internal/interp/bindings/pry.go
            - std/platform.go
            - std/env.go
            - std/markdown.go
            - std/buzz_stdlib.go
            - std/archive.go
            - std/buzz_signature.go
            - internal/cache/output.go

      importceiling:
        type: module
        description: holds a package's imports under a prefix at or below a ceiling
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          rules:
            # A RATCHET on cmd/magus's internal/ imports: it may fall, never rise.
            # It was 25 in May, 36 in July, 48 in August and 63 in September, while
            # cmd/magus's references to the root package rose 71 -> 189; the
            # concurrency clamp exists in both cmd/magus/main.go and magus.go. 67
            # since the merge queue's packages moved from libs/mergequeue to
            # internal/queue, 68 since refs --rename imports internal/edit, 70
            # since the MCP workers re-exec into internal/interp/mcpclient and
            # internal/interp/transform before the CLI starts, 71 since
            # internal/gcpolicy is a dependency-free leaf imported first so its
            # init runs early, 73 since internal/log/attr names a log record's
            # parts and internal/log/audience filters the display for its reader.
            # Raising it is a sentence in the commit message.
            - package: github.com/egladman/magus/cmd/magus
              prefix: github.com/egladman/magus/internal/
              max: 73

      stutter:
        type: module
        description: reports exported names that repeat their package's name
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          # Package names, as their package clauses spell them, whose exported
          # names repeat the package name on purpose, each with a reason.
          allow: []

      filenames:
        type: module
        description: reports a Go file name that mashes two words together
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          # The go tool never builds dot directories or testdata, so the walk skips
          # them without an entry here.
          skip-dirs: [gen]
          suffixes: [test, linux, darwin, windows, unix, other, amd64, arm64, js, wasm, freebsd,
                     openbsd, netbsd]
          # Segments that are one established word. Adding one says "this is a
          # word"; it is not a place to park a name nobody wanted to think about.
          allow:
            - runtime   # Go's own term
            - stdlib
            - keyring
            - jsonv2    # names the GOEXPERIMENT
            - libproc   # the Darwin API
            - vmstat    # the Darwin tool
            - jobserver # GNU make's name for the token protocol internal/proc/run implements

      nameoutput:
        type: module
        description: requires every name-format switch arm to render through an emitter
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          package: github.com/egladman/magus/cmd/magus
          case-ident: outputName
          emitters: [emitNames, emitItemNames, outputDst]
          hint: >-
            the destination is --tee's; a single value is emitNames([]string{v}), a slice of
            records is emitItemNames(records, func(r T) string { return r.Field })

      testisolation:
        type: module
        description: requires an isolating TestMain in every test binary that links the runtime dir
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          # Where magus resolves the per-user runtime directory the broker and the
          # server listen in. libs/testkit points a test process somewhere private.
          module: github.com/egladman/magus
          package: github.com/egladman/magus/internal/proc/sockdir
          calls: [testkit.Main, testkit.Isolated]
          hint: >-
            unisolated, its tests can reach the person's real runtime directory, dial their
            broker, and bind a pool beside their server

      # A CI or VCS provider (GitHub, GitLab, ...) is reached only by a Buzz op magus
      # invokes - a provider spell, a queue provider script, a hack/ driver script -
      # which names the act and reports host and elapsed on the line. Go opens no
      # provider socket; it invokes the Buzz op through bindings instead (see
      # internal/interp/bindings/review_spell.go for the shape). This governs the
      # packages nearest that boundary and nearest a "quick fetch" landing in Go by
      # accident; magus's own remote services elsewhere (internal/oci, internal/proc,
      # internal/httpx, internal/server, internal/selfupdate, std/http.go, ...) are not
      # governed at all, so they carry no entry here. docs/doctrine.md, "provider I/O
      # is Buzz".
      providerio:
        type: module
        description: reports Go source outside an allowlist that reaches toward a CI/VCS provider
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          module: github.com/egladman/magus
          dirs: [internal/queue, internal/job, internal/handler, internal/service, cmd/magus]
          hint: >-
            magus reaches a provider only by a Buzz op it invokes (docs/doctrine.md, "provider
            I/O is Buzz"); an allow entry below is for magus's own remote services
          # Known CI/VCS provider client SDKs. None is a dependency today (go.mod has
          # none of these); the entry stands so the day one is added, this is what
          # refuses it rather than a review catching it by eye.
          provider-imports:
            - google/go-github
            - xanzy/go-gitlab
            - gitlab.com/gitlab-org/api/client-go
            - ktrysmt/go-bitbucket
            - shurcooL/githubv4
          allow:
            # Loopback to magus's OWN server, not a provider: the diff bridge and the
            # MCP readiness probe.
            - file: cmd/magus/diff.go
              reason: talks to magus's own local diff-bridge server over loopback
            - file: cmd/magus/graph.go
              reason: probes magus's own local graph bridge over loopback
            - file: cmd/magus/notes.go
              reason: talks to magus's own local diff-bridge server over loopback
            - file: cmd/magus/probe.go
              reason: probes magus's own local MCP server's /readyz over loopback
            # magus's own remote services, reached from cmd/magus's CLI wiring.
            - file: cmd/magus/graph_registry.go
              reason: the OCI registry the graph publishes to and pulls from
            - file: cmd/magus/spell.go
              reason: the OCI registry a spell pulls from
            - file: cmd/magus/self_update.go
              reason: downloads magus's own release artifacts from GitHub Releases; distribution, not provider I/O
            # internal/queue/provider/host.go implements mergequeue\request, the Go
            # binding a provider spell's Buzz calls to reach a host - the same shape as
            # std/http.go, not an exception to the rule the rule is checking.
            - file: internal/queue/provider/host.go
              reason: the Go binding behind the mergequeue Buzz host module, the queue provider script's own primitive
            # The next two are genuine exceptions, not the intended pattern, kept here
            # with the plan (inflight-view-2026-09-27.md sec 3) named rather than moved
            # silently: report them, do not pretend they are clean.
            - file: internal/queue/cache.go
              reason: proxies GitHub Actions cache reads on loopback so the runner's write-capable token never reaches Buzz; a deliberate exception, not yet a spell
            - file: internal/queue/artifacts.go
              reason: downloads a validation run's CI artifacts by the URL a Buzz provider listing returns; a pre-existing exception, not yet a spell
            - file: cmd/magus/queue.go
              reason: CLI wiring for internal/queue/artifacts.go's client; see that entry

      # A test that pins a struct field by field still passes when the struct grows one.
      fieldwise:
        type: module
        description: reports a test asserting a struct one field at a time
        original-url: github.com/egladman/magus/libs/conventions
        settings:
          report-partial: true

    testifylint:
      disable-all: true
      enable:
        - require-error
        - go-require
      require-error:
        # NoError only: the other error assertions are often the expected outcome.
        fn-pattern: ^NoErrorf?$

    sloglint:
      # all, not scope: EVERY slog call must take a context. `scope` would only catch a
      # function that already holds one, which leaves the more dangerous case standing -
      # a context-free helper on the run path that quietly cannot redact, and that the
      # next caller assumes is safe. Requiring it everywhere makes the absence of a
      # context a compile-time-visible design decision instead of an accident.
      #
      # The rest of sloglint's opinions (key naming, static messages) stay off: this
      # rule is about the leak, not a style sweep.
      context: all

    # musttag only sees marshal calls whose argument has a concrete type, so out of
    # the box it is blind to magus's actual output path: every `-o json|yaml` arm
    # funnels through emitFormatted(opts, v any), and an `any` parameter erases the
    # type before the encoder is reached. Registering the funnel itself as a marshal
    # function restores that view, so a command's output model is checked for json
    # tags AT THE CALL SITE, where the concrete type is still known.
    #
    # This is the guard for a bug that is invisible from the code: a struct with only
    # yaml tags marshals to JSON under its GO FIELD NAMES, so `config view -o json`
    # silently emitted "MaxShards" and "HistoryPath" where every other magus output
    # says max_shards and history_path.
    musttag:
      functions:
        - name: github.com/egladman/magus/cmd/magus.emitFormatted
          tag: json
          arg-pos: 1
        - name: github.com/egladman/magus/cmd/magus.writeFormatted
          tag: json
          arg-pos: 2
        - name: github.com/egladman/magus/internal/json.Marshal
          tag: json
          arg-pos: 0
        - name: github.com/egladman/magus/internal/json.MarshalIndent
          tag: json
          arg-pos: 0
        - name: github.com/egladman/magus/internal/json.Unmarshal
          tag: json
          arg-pos: 1

    # govet runs its default analyzer set. The 'shadow' pass is intentionally NOT
    # enabled: it flags 100+ idiomatic `if err := f(); err != nil` re-declarations
    # of err across the tree (all benign), which is pure noise. Re-enable only
    # behind a per-site review.
    revive:
      rules:
        - name: var-naming
        - name: receiver-naming
        - name: context-as-argument
        - name: exported
          arguments:
            - "disableStutteringCheck"
        - name: error-return
        - name: error-strings
        - name: unhandled-error
          arguments:
            - "fmt.Print"
            - "fmt.Println"
            - "fmt.Printf"
            - "fmt.Fprintf"
            - "fmt.Fprint"
            - "fmt.Fprintln"
            - "bytes.Buffer.Write"
            - "bytes.Buffer.WriteByte"
            - "bytes.Buffer.WriteString"
            - "strings.Builder.Write"
            - "strings.Builder.WriteByte"
            - "strings.Builder.WriteString"
            - "strings.Builder.WriteRune"
            - "os.File.Close"
            - "io.Closer.Close"
            - "compress/gzip.Reader.Close"
        - name: unused-parameter
        # unused-receiver intentionally disabled: ~50 interface-implementation
        # methods in the interp engines legitimately ignore their receiver, and
        # renaming each to _ is churn with no correctness benefit.
        # bare-return intentionally disabled: the archive/tar helpers use named
        # returns with a deferred close-error wrap, where a bare return is the
        # idiomatic form and explicit returns would only add churn.
        - name: early-return
          arguments:
            - preserveScope: true
        # confusing-naming intentionally disabled: it flags idiomatic
        # exported-wrapper/unexported-impl and build-tagged pairs (NewZstdWriter/
        # newZstdWriter, Midpoint/midpoint, Probe/probe) that are deliberate.

    errcheck:
      check-blank: false
      check-type-assertions: false
      exclude-functions:
        - "(*os.File).Close"
        - "(io.Closer).Close"

    gocritic:
      enabled-tags:
        - diagnostic
      disabled-checks:
        - appendAssign
        - ifElseChain

    gosec:
      # G204: subprocess with variable — intentional in CLI tools (runx, VCS runner).
      # G304: file path from variable — intentional in cache/snapshot path building.
      # G306: file permissions 0644 — fine for non-secret cache manifests.
      # G115: integer overflow on conversion — every hit is a kernel-bounded
      #       syscall/size conversion (fd, inotify wd, io_uring/landlock fields,
      #       line numbers). It is gosec's noisiest check and false-positives here.
      # G703/G706: experimental taint analysis (path traversal / log injection)
      #       on trusted local config paths and filenames in a CLI — false positives
      #       (the G304 rationale above applies to the taint variant too).
      # G122: WalkDir TOCTOU on paths under our own cache/workspace dir; not a
      #       threat for a local build cache.
      excludes:
        - G204
        - G304
        - G306
        - G115
        - G703
        - G706
        - G122

    unparam:
      check-exported: false

  exclusions:
    # Restore the default exclusion set golangci-lint v1 applied automatically
    # (v2 ships it off by default). Without this the codebase drowns in the
    # standard fmt.Print/os.Setenv errcheck and gosec false positives.
    #
    # The `legacy` preset is deliberately NOT here, and the gosec rule below is
    # what replaces it. legacy's only effect on this tree was 91 gosec findings
    # (G301/G302/G104, restored verbatim below) plus one thing nobody wanted:
    # EXC0005 silences staticcheck's SA4011 unconditionally, on the reasoning
    # that "developers tend to write in C-style with an explicit break in a
    # switch, so it's ok to ignore".
    #
    # That is not ok here. SA4011 catches a `break` inside a `switch` inside a
    # `for` that exits only the switch - and this tree shipped exactly that in
    # project/insight.go's Complexity(), where it silently counted every interior
    # space as indentation and corrupted every FileHotspots score. staticcheck
    # found it; the preset threw the finding away. Measured after the fix: zero
    # SA4011 findings tree-wide, so re-enabling it is a ratchet, not a cleanup.
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # The gosec half of the `legacy` preset, kept verbatim so dropping legacy
      # changes nothing but SA4011. G301/G302 want 0750-or-tighter directory and
      # chmod modes, which this tree deliberately does not use for ordinary
      # output dirs; G104 is the unhandled-error check errcheck already owns.
      - linters:
          - gosec
        text: "(G301|G302|G104)"
      # Test files: relax naming/comment/wrapping rules, plus security/perf/style
      # checks (gosec, gocritic, prealloc, bodyclose, misspell) that are noise in
      # test fixtures (synthetic responses, deliberate typo fixtures).
      - path: _test\.go
        linters: [revive, unparam, errcheck, forcetypeassert, nilnil, gosec, gocritic, prealloc, bodyclose, misspell]

      # stdversion cannot model GOEXPERIMENT. internal/json/json_v2.go sits behind
      # //go:build goexperiment.jsonv2, where encoding/json/v2 IS available on the
      # go 1.26 this module declares, but the analyzer only reads the go directive
      # and the std API table compiled into the linter, so it calls all 25 symbols
      # go1.27-only.
      #
      # It appeared when lint moved to .magus/custom-gcl and nowhere else. The released
      # binary aqua pins was built with go1.26.2 and its table says nothing here;
      # `golangci-lint custom` compiles with whichever go leads PATH (1.26.5) and
      # carries a newer one. Same linter version, same config, opposite verdict -
      # which is the toolchain-mismatch hazard the lint target's comment describes,
      # showing up as findings rather than the panic it caused last time.
      - path: ^internal/json/
        linters: [govet]
        text: stdversion

      # Magefile targets use exec and intentional subprocess patterns.
      - path: magefile/
        linters: [gosec]
        text: "subprocess"

      # sloglint's context rule is scoped to where a resolved secret can actually
      # travel. These paths are exempt because no run context exists to pass:
      #
      #   cmd/magus       - argument parsing, version, and the final mapExitCode line all
      #                     run outside any workspace Open, so there is no resolver to
      #                     reach. A run error is redacted at the SDK boundary instead
      #                     (Magus.redactError), which is why that line is safe without
      #                     a context.
      #   internal/config - loads before a workspace exists, by definition.
      #   internal/report - renders an already-captured result; the bytes it prints
      #                     were redacted by the capture tap upstream.
      #
      # Everything else - run.go, the interp bindings that execute a magusfile, std's
      # host modules, the sandbox - is on the path a credential travels and is NOT
      # exempt. Do not add a package here to silence a finding; thread the context.
      - path: ^cmd/magus/
        linters: [sloglint]
      - path: ^internal/config/
        linters: [sloglint]
      - path: ^internal/report/
        linters: [sloglint]

      # report-unix-suffix's backlog: each entry is a _unix file to rename after the
      # platforms it serves, and the fix deletes the entry, so the list only shrinks.
      # Exact names rather than globs, so a new offender in the same directory still
      # fails the gate. rusage_unix.go is excluded from darwin builds, so only a linux
      # run reports it. Pairing is testpair's, so nothing here can hide an unpaired
      # test file.
      - path: ^broker/(activation_unix|activation_unix_test)\.go$
        linters: [testlayout]
      - path: ^cmd/magus/(bootstrap_exec_unix|detach_unix)\.go$
        linters: [testlayout]
      - path: ^internal/audit/inode_unix\.go$
        linters: [testlayout]
      - path: ^internal/file/identity_unix\.go$
        linters: [testlayout]
      - path: ^internal/job/store_unix_test\.go$
        linters: [testlayout]
      - path: ^internal/proc/run/(jobserver_unix|jobserver_unix_test|pty_unix|reap_unix|reap_unix_test|run_unix|rusage_unix)\.go$
        linters: [testlayout]
      - path: ^internal/proc/sockdir/(sockdir_unix|sockdir_unix_test)\.go$
        linters: [testlayout]
      - path: ^internal/sandbox/owner_unix\.go$
        linters: [testlayout]
      - path: ^internal/sessions/adapter_unix\.go$
        linters: [testlayout]
      - path: ^internal/textindex/mmap_unix\.go$
        linters: [testlayout]

      # filenames' backlog: concatenations already in the tree when the rule
      # landed. Each is a rename waiting for a session with room for it, not an
      # exemption; a rename touches every importer. No path, since the rule is
      # by segment wherever it appears.
      - linters: [filenames]
        # magusfile names magusfile.buzz, so it may be right; lockfile is the
        # standard term for a dependency lock file.
        text: ^(magusfile|lockfile|eventstream|hostmodules|promptcache|selfupdate|toolref) mashes

      # stutter's backlog, in testlayout's shape above: each entry is a rename to
      # make, and the fix deletes it. The rule was a test that read the symbol graph
      # and skipped whenever the index was empty, which in the test run was always,
      # so these 40 names reached main unseen. Each rule names its symbols, so a new
      # stutter in the same file still fails.
      - path: ^internal/agent/catalog\.go$
        linters: [stutter]
        text: ^agent\.(AgentsFile|AgentSkill) stutters
      - path: ^internal/ci/forecast/forecast\.go$
        linters: [stutter]
        text: ^forecast\.Forecaster stutters
      - path: ^internal/file/diff/diff\.go$
        linters: [stutter]
        text: ^diff\.DiffContent stutters
      - path: ^internal/file/watch/watch\.go$
        linters: [stutter]
        text: ^watch\.Watcher stutters
      - path: ^internal/handler/graph/handler\.go$
        linters: [stutter]
        text: ^graph\.GraphHandler stutters
      - path: ^internal/handler/mcp/describe\.go$
        linters: [stutter]
        text: ^mcp\.(MCPToolDefinition|MCPToolEntry|MCPToolsOutput) stutters
      - path: ^internal/render/render\.go$
        linters: [stutter]
        text: ^render\.RenderOption stutters
      - path: ^internal/service/registry\.go$
        linters: [stutter]
        text: ^service\.ServiceStatus stutters
      - path: ^internal/spell/target\.go$
        linters: [stutter]
        text: ^spell\.(SpellModulePath|SpellModuleSource) stutters
      - path: ^internal/workspace/registry\.go$
        linters: [stutter]
        text: ^workspace\.(WorkspaceRegistry|WorkspaceRegistryFromContext) stutters
      - path: ^project/insight\.go$
        linters: [stutter]
        text: ^project\.(ProjectStat|ProjectStats) stutters
      # The lib modules, linted from their own directories; paths stay root-relative.
      - path: ^libs/gopherbuzz/token/token\.go$
        linters: [stutter]
        text: ^token\.Tokenize stutters
      # gopherbuzz's error text follows upstream Buzz's, not Go's convention.
      - path: ^libs/gopherbuzz/
        linters: [errmsg]
      - path: ^std/encoding/[a-z0-9]+/[a-z0-9]+\.go$
        linters: [stutter]
        text: ^(base64\.Base64(URL)?(Encode|Decode)|csv\.CSV(Parse|Stringify)|hex\.Hex(Encode|Decode)|ini\.INI(Parse|Stringify)|json\.JSON(Parse|Stringify)|toml\.TOML(Parse|Stringify)|url\.URL(Encode|Decode|Parse|Build)|xml\.XML(Element|Render|Parse)|yaml\.YAML(Parse|Stringify)) stutters

# Formatting is gated HERE, not by the format target, because `gofmt -l` cannot fail: it
# reports on stdout and exits 0, and magus reads an op's verdict from the exit code alone.
# The format target keeps it as the local reporter (rw flips it to -w).
# Zero findings when adopted: a ratchet, not a cleanup.
formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      # simplify: false to match what `format:rw` actually applies. golangci-lint defaults
      # it ON (gofmt -s), but the go-fmt op runs plain `gofmt -w`, so leaving it on makes
      # the gate demand a rewrite the formatter will not perform - lint failing on
      # something format cannot fix. Adopting -s is a separate decision; it belongs in the
      # spell's op first, so the two stay in agreement.
      simplify: false

# Report every finding. golangci-lint defaults to max-issues-per-linter: 50 and
# max-same-issues: 3, which silently hides repeated findings (e.g. a pervasive
# pattern shows only its first 3 hits). Disabling the caps keeps CI honest — the
# count you see locally is the count CI enforces.
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
