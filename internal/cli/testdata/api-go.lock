github.com/egladman/magus/types.DuplicationDefinition const untyped string = "Duplication ranks pairs of functions that call the same workspace symbols in the same proportions, weighting each shared callee by how rare it is, which is what copied logic looks like from the call graph. It reads the SCIP-backed knowledge graph, so it compares every indexed language the same way and parses no source. It sees only calls to symbols this workspace DEFINES: logic duplicated entirely in standard-library or dependency calls leaves both functions with empty call sets and is invisible here. A measurement, not a verdict - two functions can share a shape on purpose, so read both before folding them."
