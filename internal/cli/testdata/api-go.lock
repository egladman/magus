github.com/egladman/magus/types.KnowledgeGraphDiffDefinition const untyped string = "graph diff reports how the knowledge graph changed between a base revision and the working tree: the nodes and edges added, removed, or (for nodes) changed. It is the PR-review blast-radius artifact - what a change did to the domain's shape - emitted as json or markdown, never rendered. Edge diffs are structural: an edge is identified by (source, target, relation), so a re-scored or re-provenanced edge that keeps those three is not reported as changed."
