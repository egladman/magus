github.com/egladman/magus/types.InsightDefinition const untyped string = "Insight shows where a codebase's attention and risk concentrate. Four lenses read VCS history: hotspots (churn x complexity, the prime refactoring targets), affinity (projects that change together, and whether a dependency edge explains it), ownership (author concentration and bus factor), and trend (rising vs cooling activity). A fifth lens, volatility, reads run-outcome history instead: targets whose pass/fail record flaps (a Wilson-scored flakiness signal). A sixth, unreferenced, reads the knowledge graph: code symbols nothing else in the workspace names. A model-tier lens reads job history: what each model tier achieved on each kind of job."
