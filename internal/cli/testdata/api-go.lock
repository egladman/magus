github.com/egladman/magus/types.KnowledgeDefinitionsDefinition const untyped string = "refs --definition prints where an ingested code symbol is defined as path:start-end, the exact lines its body occupies, from the SCIP index's enclosing range. Each range is checked against the file on disk: verified when the file predates its index, changed when the symbol's name has left the start line, unverified when the name is there but the file was edited since. With --source it prints those lines."
