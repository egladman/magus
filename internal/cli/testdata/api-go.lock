github.com/egladman/magus/types.FileDefinition const untyped string = "Describe file classifies paths against the workspace's declared globs: the project that owns each path, whether it is a declared output (generated: regenerate it, never hand-edit), a declared source (it feeds cache keys and the affected set), or one magus maintains itself outside any target, and which projects claim it either way. It answers \"can I disregard this changed file\" from the workspace's own declarations, and - over several paths in one call - which single declaration covers more than one of them."
