github.com/egladman/magus/types.KnowledgeStatsDefinition const untyped string = "Graph stats reads the knowledge graph to show where the workspace concentrates and where it is neglected: god nodes (the most connected spells, modules, and targets - the structural risk), connectivity (how fragmented the graph is - components and isolated nodes the builder never linked), orphans (isolated nodes and spells nothing uses), and doc coverage (the share of diagnostics, spells, and modules that have a doc). It is the structural companion to insight's git-history lenses."
