# mockery generates testify mocks for the interfaces we want faked.
# Docs: https://vektra.github.io/mockery/. Run via `go tool mockery` (pinned in go.mod
# tool block) - the mocks_generate magusfile target wires it into `magus run generate`.
#
# Two places a mock lands, by who imports it:
#
#  - A mock other packages import lands in a gen/<pkg>test/ subdir of the interface's own
#    package, in package <pkg>test: the standard library's httptest idiom, so an importer
#    writes spellstest.NewMockDriver(t) and needs no alias. Files are named for the
#    interface in snake_case (driver.go), no redundant mock_ prefix. Two packages are
#    named types, so internal/queue/types sets its own: queuetest.
#  - A mock only the interface's own package uses lands beside it in mocks_test.go, in
#    that package: mockery's own default. It never imports the package, so the package's
#    tests can use it without an import cycle, it never ships in a build, and an
#    unexported interface needs no exported mock name. types does both for the two
#    interfaces its own tests mock.
#
# Two reasons an interface belongs on this list:
#
#  1. OUR tests need to inject a fake. Judgement still applies - a narrow test is better
#     served by the embedded-interface idiom (`struct{ WorkspaceRepository }`, overriding
#     only the called method) than by a generated mock. Reach for a mock when the test
#     asserts on the CALL - that it happened, with what arguments, how many times - which
#     is the part testify adds and a hand-written stub does not.
#
#  2. It is PUBLIC and someone building on magus would have to fake it: the spell driver,
#     the symbol store and the std callback. A downstream consumer cannot import
#     internal/, so a mock there serves nobody outside this repo, and publishing a mock
#     is part of the package API, not test scaffolding.
#
# types' mocks are the exception to the subdir rule: they land in internal/gen/typestest,
# out of the public API. Every package of this module may import internal/, and a
# consumer fakes a types interface with the embedded-interface idiom.
#
# Mocks carry the canonical `Code generated by ...` marker, so
# hack/magusfile/coverage.buzz strips them from the profile and they cannot pad the
# coverage number. hack/lint holds every generated package to a clause of its own.
template: testify
dir: "{{.InterfaceDir}}/gen/{{.SrcPackageName}}test"
pkgname: "{{.SrcPackageName}}test"
filename: "{{.InterfaceName | snakecase}}.go"
packages:
  # Internal doubles of the domain interfaces: VCSDriver plus the capability probes a
  # driver may optionally satisfy, and the read interfaces.
  github.com/egladman/magus/types:
    config:
      dir: internal/gen/typestest
    interfaces:
      Observer:
        configs:
          - {}
          - &own-package
            dir: "{{.InterfaceDir}}"
            pkgname: "{{.SrcPackageName}}"
            filename: mocks_test.go
      VCSDriver:
      CacheBackend:
      MergeDriverInstaller:
      RefreshHookInstaller:
      RemoteReporter:
      RevTimeReporter:
      DefaultRefReporter:
      TrackedFileReporter:
      IgnoredFileReporter:
      ChurnReporter:
      ConflictResolver:
      RevisionExporter:
      MergeStarter:
      DepGraphRepository:
        configs:
          - {}
          - *own-package
      WorkspaceReader:
      TargetExpander:
      AffectedComputer:
      Inspector:
      WorkspaceRepository:
  # Public: the spell driver extension point.
  github.com/egladman/magus/spells:
    interfaces:
      Driver:
  # Public: the symbol index a consumer swaps out.
  github.com/egladman/magus/project/impact:
    interfaces:
      SymbolStore:
  # Public: the Buzz host callback a std member invokes.
  github.com/egladman/magus/std:
    interfaces:
      Callback:
  # Internal, imported across packages: the merge queue's contract, the telemetry seam
  # whose callers assert on the metric recorded, and the service runner.
  github.com/egladman/magus/internal/queue/types:
    config:
      dir: "{{.InterfaceDir}}/gen/queuetest"
      pkgname: queuetest
    interfaces:
      Provider:
      Gate:
      BuildFacts:
      VerdictSource:
      ArtifactLister:
  github.com/egladman/magus/internal/observability:
    interfaces:
      Provider:
  github.com/egladman/magus/internal/service:
    interfaces:
      Runner:
  # Internal, used only by the package's own tests.
  github.com/egladman/magus/internal/dry:
    config: *own-package
    interfaces:
      SpellCatalog:
  github.com/egladman/magus/internal/sandbox:
    config: *own-package
    interfaces:
      MetricsRecorder:
  github.com/egladman/magus/internal/cache:
    config: *own-package
    interfaces:
      Tracer:
  github.com/egladman/magus/internal/ci:
    config: *own-package
    interfaces:
      Forecaster:
  github.com/egladman/magus/internal/handler/diff:
    config: *own-package
    interfaces:
      # mockery's own name for an unexported interface's mock is mockpatchSource.
      patchSource:
        config:
          structname: mockPatchSource
  github.com/egladman/magus/internal/handler/mcp:
    config: *own-package
    interfaces:
      workspaceSource:
        config:
          structname: mockWorkspaceSource
  github.com/egladman/magus/internal/handler/tool:
    config: *own-package
    interfaces:
      lifecycleSource:
        config:
          structname: mockLifecycleSource
