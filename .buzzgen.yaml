# The Go types and host modules that cross into Buzz. libs/gopherbuzz/buzzgen
# reads it; ADR 0035 records the design. Settings layer: the top level,
# then a package's config, then a type's config.
version: v1alpha1
packages:
  github.com/egladman/magus/spells:
    types:
      CoverageFormat: {config: {cases: {"go-coverprofile": goProfile}}}
      DiscoveryRole: {}
      External: {config: {cases: {"reads-external": reads, "mutates-external": mutates}}}
      PatchOpKind: {}
      SandboxAccess: {}
      SymbolFormat: {}
      VersionComponent: {}
  github.com/egladman/magus/types/image:
    types:
      Architecture: {}
      EntryKind: {}
      MediaType: {config: {module: image, zeroCase: ""}}
      ModePolicy: {}
      OS: {}
      SymlinkPolicy: {}
      Variant: {}
  github.com/egladman/magus/types:
