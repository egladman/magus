# Pinned versions for reproducible benchmarks.
# bench.sh warns (but does not fail) if installed versions differ.
# Set BENCH_SKIP_VERSION_CHECK=1 to suppress.
#
# These are intent. What a run actually measured is probed at aggregation time
# and published under "Tool versions (observed)" in BENCHMARKS.md.
#
# make: GNU Make. macOS ships 3.81 as `make`, so a mac run needs MAKE_BIN=gmake
# to reach the pinned 4.4.1. make is the only tool with published numbers today,
# so leaving it unpinned left the whole table unanchored.
# magus: the release line, not the build. bench.sh compares the x.y.z it finds.
hyperfine=1.19.0
magus=0.4.3
make=4.4.1
node=22.22.2
pnpm=10.33.0
turbo=2.9.14
nx=22.7.3
lage=2.15.12
moon=2.2.5
bazel=7.6.1
