[env]
GOEXPERIMENT = "jsonv2"

[shell_alias]
mgs = "go run ./cmd/magus"

[tools]
go = "1.26.5"
node = "24"
pnpm = "10.33.0"
"npm:markdownlint-cli" = "0.49.0"
"npm:esbuild" = "0.25.5"
"aqua:crate-ci/typos" = "1.28.4"
# Lints the POSIX sh guard templates in docs/guides/integrations/agents. Pinned so
# the gate is the same everywhere rather than whatever a developer happens to have.
"aqua:koalaman/shellcheck" = "0.11.0"
tinygo = "0.41.1"
"aqua:WebAssembly/binaryen" = "129"
"aqua:bufbuild/buf" = "1.58.0"
"go:github.com/scip-code/scip-go/cmd/scip-go" = "0.2.7"
"npm:@sourcegraph/scip-typescript" = "0.4.0"
