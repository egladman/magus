[env]
GOEXPERIMENT = "jsonv2"

[shell_alias]
mgs = "go run ./cmd/magus"

[tools]
go = "1.26.5"
node = "24"
pnpm = "10.33.0"
"npm:markdownlint-cli" = "0.49.0"
"npm:esbuild" = "0.25.5"
"aqua:crate-ci/typos" = "1.28.4"
# Lints the POSIX sh guard templates in docs/guides/integrations/agents. Pinned so
# the gate is the same everywhere rather than whatever a developer happens to have.
"aqua:koalaman/shellcheck" = "0.11.0"
# Dockerfile linter driven by the docker spell's hadolint op. Pinned because it was
# previously whatever happened to be on PATH: an upgrade changes which Dockerfiles
# lint clean, and unlike the `go tool` plugins it is bound to no module graph, so
# nothing else would have caught the drift.
"aqua:hadolint/hadolint" = "2.14.0"
# Go linter and vuln scanner driven by the root lint target. Pinned here rather than via
# go.mod's tool block: neither generates code, so they have none of the generator/runtime
# lockstep that keeps protoc-gen-go on `go tool`. They used to run via
# `go tool -modfile=go.tool.mod`, which COMPILES them with whichever go leads PATH - that is
# how CI ended up building the linter with a different toolchain than it analyzed with, and
# panicking. A pinned prebuilt binary has no toolchain to drift against.
"aqua:golangci/golangci-lint" = "2.12.2"
# Signs every pushed image digest, driven by the cosign spell from image_build. It was
# never pinned here despite cd.yaml claiming it came from mise, and no GitHub runner
# image ships it - the signing step was relying on a tool nothing installed.
#
# Held on the 2.x line deliberately. cosign 3 makes the Sigstore bundle the default
# on-registry signature format, and while a v3 client reads v2 layouts, a v2 client
# CANNOT verify a v3 signature. Taking v3 would silently break the `cosign verify`
# command documented in docs/guides/download/container-image.md for every user who has
# not upgraded, including against `latest`, which they did not re-pull to opt in.
# Upstream still ships 2.x releases alongside 3.x. Moving to v3 is an announced,
# documented change, not a pin bump.
"aqua:sigstore/cosign" = "2.6.4"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"
tinygo = "0.41.1"
"aqua:WebAssembly/binaryen" = "129"
"aqua:bufbuild/buf" = "1.58.0"
"go:github.com/scip-code/scip-go/cmd/scip-go" = "0.2.7"
"npm:@sourcegraph/scip-typescript" = "0.4.0"
