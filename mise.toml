[env]
GOEXPERIMENT = "jsonv2"
# The workspace's own magus, in front of whatever is installed globally.
#
# This repository is the one that dogfoods magus, so `magus` here has to mean the binary
# built from this tree and not the released one on PATH, which sits below this workspace's
# required_version floor and cannot load it at all. Every OTHER repository wants a plain
# `magus`, and the committed hook config is copied by readers, so the config says `magus`
# and resolution is left to the environment, which is what PATH is for.
#
# The workspace ROOT rather than a bin/ directory, because `magus run build .` has always
# written ./magus there. The cost is that anything else executable at the root joins PATH
# for a shell in this tree; there are two such files today and both are deliberate.
_.path = ["{{config_root}}"]

[tools]
go = "1.26.6"
node = "24"
pnpm = "10.33.0"
"npm:markdownlint-cli" = "0.49.0"
"npm:esbuild" = "0.25.5"
"aqua:crate-ci/typos" = "1.28.4"
"aqua:dprint/dprint" = "0.55.2"
"aqua:koalaman/shellcheck" = "0.11.0"
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:hadolint/hadolint" = "2.14.0"
"aqua:golangci/golangci-lint" = "2.12.2"
"aqua:sigstore/cosign" = "3.1.2"
"aqua:aquasecurity/trivy" = "0.73.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.3.0"
"aqua:WebAssembly/binaryen" = "129"
"aqua:bufbuild/buf" = "1.58.0"
"go:github.com/scip-code/scip-go/cmd/scip-go" = "0.2.7"
"npm:@sourcegraph/scip-typescript" = "0.4.0"
