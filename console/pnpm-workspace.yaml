# pnpm settings for the console app's build-only deps. NOT a workspace: there is no
# `packages:` key and this is one package. pnpm 10.16+ reads settings here that older
# versions read from .npmrc, and this file replaced that one.

# In MINUTES; 14400 = 10 days. Supply-chain guard: never install a version published less
# than 10 days ago, so a compromised release has time to be caught before it enters a build.
minimumReleaseAge: 14400
