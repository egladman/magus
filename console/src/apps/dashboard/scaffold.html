<main class="console-dashboard-main" id="dash-main">
    <h1 class="pf-v6-screen-reader">Dashboard</h1>
    <div class="console-dashboard-related" role="group" aria-label="Dashboard navigation" data-control-size="default">
      <button type="button" id="dash-jobs-back" class="pf-v6-c-button pf-m-link pf-m-inline" hidden><span class="pf-v6-c-button__text">Back to dashboard</span></button>
      <button type="button" class="pf-v6-c-button pf-m-link pf-m-inline" data-open-app="diff"><span class="pf-v6-c-button__text">Review the diff</span></button>
    </div>
    <div id="dash-overview">
      <!-- Live panels (hidden until the first status frame arrives). Every tile inside is
           built in TypeScript (tiles/*) and mounted here by main.ts - the tile owns its own DOM
           subtree, so adding a metric family is a new tile module, not new markup. This
           container is intentionally empty. -->
      <div id="dash-panels" hidden></div>

      <!-- Connect state: the dashboard's front door, shown until a live status frame arrives. Its title,
           body and ways are painted by main.ts through the console's shared server empty state
           (connectPrompt.ts), so they match every other app. The address itself is edited in
           Settings only. -->
      <div class="pf-v6-c-empty-state" id="dash-connect" data-dash-connect>
        <div class="pf-v6-c-empty-state__content">
          <div class="pf-v6-c-empty-state__icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/>
            </svg>
          </div>
          <h2 class="pf-v6-c-empty-state__title-text" id="dash-connect-title"></h2>
          <div class="pf-v6-c-empty-state__body">
            <p id="dash-connect-message"></p>
            <div class="pf-v6-c-empty-state__actions" id="dash-connect-actions" data-empty-ways></div>
          </div>
        </div>
      </div>
    </div>
    <section id="dash-jobs-host" aria-label="Jobs" hidden></section>
  </main>
