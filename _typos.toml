# typos config: corrections-based prose spell-check, wired into the md spell as
# `md.typos` / `md.typos:rw` (the -w charm autofixes in place).
#
# This is NOT a dictionary. `typos` only flags KNOWN misspellings from its curated
# typo->fix map, so domain terms (gopherbuzz, magusfile, TinyGo, ...) never trip
# it and there is essentially nothing to babysit here. Keep this file lean.

[default]
# Without a locale, `typos` accepts every English variant, so "artefacts" sat in the
# canonical target table indefinitely - correct British, not a typo. Pinning en-us makes
# one spelling the workspace's spelling, which is the only way a prose gate stays useful.
locale = "en-us"

[default.extend-words]
# "mis" is a real prefix in this tree ("mis-highlighted", "mis-scope"), and typos reads a
# hyphenated prefix as a standalone word. Mapping it to itself accepts it rather than
# rewriting correct prose into "miss-scope".
mis = "mis"
# Identifiers and domain terms typos "corrects" into something wrong. Both were caught by
# running the autofix for the first time: `nd` (a local in docs/site/development.buzz)
# became the Buzz KEYWORD `and` and stopped the docs project compiling, and "ANDed" (a
# boolean-query term in the search help text) became "ANDead".
nd = "nd"
# typos splits "ANDed" and flags the "Ded" tail, so the accepted word is that fragment.
Ded = "Ded"
# The generated skill docs embed a content hash (docs/reference/skills/*.md's
# `skill-content` row) so a magus upgrade proves drift rather than asserting it; typos
# splits hex on digit/letter boundaries, and this hash happened to contain "ba" at one.
# A future hash rotation could hit it again, so accept the fragment rather than the value.
ba = "ba"
# Yarn PnP (Plug'n'Play) is a product name the nx guide names. typos splits it on the
# case boundary and "corrects" the leading fragment to "On", which would rename the
# feature; the accepted word is that fragment, as with "Ded" above.
Pn = "Pn"
# Lage is Microsoft's build tool, named beside turbo/nx/moon/bazel in the benchmark
# harness. typos reads it as a misspelt "large".
lage = "lage"
# DELIBERATE near-misses in tests, where the value being wrong IS the test. Correcting them does
# not fix a typo, it inverts the assertion: `parseHTTPRetry({"attemps": 3})` proves an unknown key
# is REJECTED, and "attempts" makes it prove a valid key is rejected instead. Every one of these
# was corrupted by the first autofix run over code, and each broke its test silently-looking (the
# failure names the assertion, never the cause).
bui = "bui"
buil = "buil"
abd = "abd"
auther = "auther"
staus = "staus"
mport = "mport"
attemps = "attemps"
dcoker = "dcoker"
# A git-describe fixture's abbreviated hash. typos reads hex as words and turned ga899daa3 into
# ga899data3 - not a spelling at all, and the kind of edit no reviewer would catch in a diff.
daa = "daa"
# From "ancestor-descendant", which typos splits on the hyphen and flags the head of.
anc = "anc"

[files]
# Skip generated / vendored trees and lockfiles - nothing to fix inside them, and
# they carry byte-identical text `typos` would otherwise re-scan every run.
extend-exclude = [
  # One glob, not a path list: generated output lives in a `gen/` dir by convention, and
  # naming each one is how this list went stale (it still pointed at website/gen after the
  # docs reorg). Generated trees are also the worst false-positive source - the protobuf
  # TS descriptors are base64 blobs that read as hundreds of misspelled words.
  "**/gen/**",
  # The whole gopherbuzz tree, not just its testdata. It is a separate module that must match
  # upstream Buzz behaviour, so its identifiers are upstream's - `ot` (an objectType local), `fo`,
  # `mone` in a session test. Correcting them would either diverge from upstream or fight every
  # sync, and neither is worth a spelling. This is a parity boundary, not an exemption we chose
  # for our own prose.
  "libs/gopherbuzz/**",
  "**/*.min.*",
  "**/*.wasm",
  "go.sum",
  "pnpm-lock.yaml",
  "package-lock.json",
]

# extend-words / extend-identifiers are deliberately empty - add an entry only
# when `typos` false-flags a real word (e.g. a deliberate abbreviation), never
# for domain jargon that isn't in typos' typo->fix map to begin with.

# Code IS checked. It was not until 2026-08-21: every code type was off, and the 507 hits
# behind that were nearly all British spellings in comments. One spelling for the whole
# tree is the point of pinning a locale, and a gate that stops at the file extension only
# moves where the drift accumulates.
