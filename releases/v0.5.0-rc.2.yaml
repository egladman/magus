    changed:
        - |-
          **The advice action links the console instead of posting a Mermaid fence.** The
          blast-radius section links the hosted console, which draws the graph in the browser from
          the link's URL fragment, which is never sent to a server. The new `console-base` input
          points the link at a console of your own.
        - |-
          **The agent guard hook no longer loads the workspace.** `magus shell` reads its rules
          from the root magusfile alone, and loads the committed copy only while a file that
          load read is uncommitted. Measured here: about 120ms per call, down from about 1.6s.
        - |-
          **Breaking: `magus agent install` prunes the skills the catalog dropped; `--prune` is
          removed.** A stamped skill directory that is no longer shipped is deleted after the
          install writes, and each removal prints on stdout. An unstamped skill is never touched.
          `--dry-run` lists what would go, and `magus agent harness install` prints its removals the
          same way.
        - |-
          **The agent surface stops promising a checkpoint restore.** A checkpoint records a
          digest, not the patch; magus-vcs-hygiene covers recovering work.
        - |-
          **`aggressive` now claims memory, not just cores.** `balanced` and `conservative`
          still reserve a quarter of memory for everything else on the machine; `aggressive`
          takes every usable megabyte down to a fixed 512 MiB floor for the kernel.
        - '**An ambiguous output ref prints a count and three examples.**'
        - |-
          **An analyzer directory setting that matches no Go files fails the linter load.**
          This covers `providerio`'s `dirs` and the `skip-dirs` of `filenames` and
          `hostagnostic`, so a stale entry can no longer turn a rule off silently.
        - |-
          **BREAKING: analyzer settings are renamed.** `nameoutput` `case` is `case-ident`;
          `coldread` `wrapped` is `report-wrapped`; `testlayout` `no-unix-suffix` and
          `no-main-tests` are `report-unix-suffix` and `report-main-tests`.
        - |-
          **Every `/api/` error carries a reason code.** Validation, not-found, conflict and
          internal failures answer in the auth refusals' JSON envelope instead of plain text:
          MGS9023 invalid request, MGS9024 not found, MGS9025 state conflict, MGS9026 no
          workspace, MGS9027 internal failure, MGS9028 streaming unsupported, MGS9029 review host
          failed. Statuses are unchanged; an internal failure keeps its cause in the server log.
        - |-
          **A `BAGGAGE` lease claim ranks below every record.** `magus shell --lease` no longer
          defaults to it, so the subagent's spawn record and the checkout's `magus job exec`
          binding answer first, for magusfile job writes and attention requests too. Verdicts,
          activity events, target results and attention requests record `lease_from`: `flag`,
          `agent`, `marker`, `env` or `contested`; the console's session lineage shows it.
        - |-
          **A fresh checkout bootstraps in one command.** `GOEXPERIMENT=jsonv2 go run -trimpath
          ./cmd/magus run go-build --no-cache .` compiles magus and runs its real `go-build`
          target, so the first `./magus` is built like every later one. `--no-cache` skips the
          magus cache for that target; Go's build cache stays on. Every hint that taught the old
          two-step build names it.
        - |-
          **BREAKING: the activity wire's `actor` is a rendered label, and `actors` filters by
          field.** `actor` was a kind (`agent`, `operator`); it is now the origin rendered for a row
          head. An `actors` entry matches one origin field exactly (user, host, agent, credential,
          entry point), never the label. The review-remark telemetry label `human` is now
          `unattributed`.
        - |-
          **Breaking for SDK callers: a shared service crosses the broker wire as a
