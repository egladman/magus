          declared it removes `magus.lock` instead of writing a header and `version: 1`.
        - |-
          **Built-in spells ship as their Buzz source, not bytecode.** The binary embeds each
          `spells/<dir>` and compiles the built-ins at startup, offering only `magus/spell`,
          `magus/charm` and `magus/lint`. A spell importing anything else ships as source only:
          `endoflife-date`, `onepassword` and `system-keychain`. The committed `.bo` files and
          the `magus-utils spells` generator are gone.
        - |-
          **`go-test` and `go-vet` pass `-trimpath`.** Matching `go-build`, so a run in one
          worktree can share its compile and result cache with another worktree at the
          same content, regardless of either one's absolute path.
        - |-
          **A stale-index search refusal says why the index fell behind.** When the guard refuses
          a symbol search because the symbol index is older than the tree, the refusal now adds
          what magus observed (no server running, a sync in progress, a hook whose binary is
          missing) and the command that keeps the index current.
        - |-
          **A missing or stale symbol index says why.** `magus refs` and the guard's stale-graph
          advice name the cause they can observe, with its remedy: no server running, a refresh
          hook whose binary (such as `./magus`) is missing, no refresh hook installed, a server on
          another build, or a sync running now. `magus job run sync-graph` records what each
          request did.
        - |-
          **Breaking for SDK callers: `ServiceHost.Acquire` and `Client.AcquireService` also
          return whether the broker owns the service.** A service with neither `command` nor
          `start`, or with both, fails to load.
        - |-
          **`stutter` reads the package clause.** It skips `package main`, and
          `min-package-len` (was `min-package`) defaults to 3.
        - |-
          **A symbol query ranks from a names index.** `query --kind symbol` used to decode every
          symbol shard. It now ranks matches from a compact index of node names and decodes only
          the shards its answer's neighborhood touches, with the same output.
        - |-
          **A target's `std\print` is captured with its output.** It is withheld, streamed and
          stored under the target's ref like a subprocess's output, instead of bypassing both.
        - |-
          **One tool renders the terminal SVGs.** `cmd/magus-termshots` is now the
          `shots` subcommand of `cmd/magus-termcast`, and `termshots-generate` runs
          `magus-termcast shots`. Its outputs are unchanged. A word other than `shots`
          in the subcommand position is an error instead of being ignored.
        - |-
          **BREAKING: every Go test file pairs with a source file of the same name.** The
          new `testpair` linter reports each `X_test.go` with no `X.go` or platform family
          beside it, with no exemptions. It runs on every module, reads build-tagged files,
          and `//nolint:testlayout` does not reach it. `testlayout` drops `allow`,
          `report-unpaired`, `honor-marker` and `pair-benchmarks`.
        - |-
          **The toolchain's violation flag and window text come from the server.** `ListTools`
          returns `violation` and the spell, workspace and effective windows per tool, rendered by
          the same code as `magus describe tools`, so the console and the CLI agree. The CLI text
          table prints a verdict as "too old"; JSON keeps `too_old`.
        - |-
          **Tool-version probes for go, golangci-lint, buf and `pnpm exec tsc` are cached.** The
          key is the resolved binary's identity plus what picks its version (for go, the toolchain
          lines of go.work and go.mod, GOENV and GOTOOLCHAIN), not the project directory, so
          projects with the same inputs share one answer and one fork. A failed probe is cached
          for ten minutes.
        - |-
          **A tool that runs but cannot say which build it is now fails the run as MGS3035.** The
          cache key used to record `UNPROBED` for it. An absent tool still keys as `UNPROBED` with
          a warning. Graph reads do not fail: `magus status` reports that project's symbol index
          as `unvouched`, with the reason.
        - |-
          **A toolchain upgrade with no source change keeps a symbol index reading current.** It
          stays current until the next `magus graph build`.
        - |-
          **The trail names the credential, not "operator", and drops `actor`.** Each event records
          `credential` (the verified token's class, id, name and grant, never its secret) and the
          MCP client as `host`; the wire's `actor` is a label rendered from them. Console review
          comments are `unattributed`, not `human`.
        - |-
          **Breaking: the typed graph returns use camelCase keys.** `node_count` is `nodeCount`,
          `match_count` is `matchCount`, `schema_version` is `schemaVersion`, `file_count` and
          `ref_count` are `fileCount` and `refCount`, `blast_radius` is `blastRadius`, `docs_url`
          is `docsURL`, and `duration_ms` is `durationMs`. An old key reads as null rather than
          raising, so a script that read one needs the new name.
        - |-
          **Breaking: `magus\explain(node, to:)` is gone.** A path between two nodes is
          `magus\path(node, to:)`.
        - |-
          **`magus\query`, `explain`, `path`, `refs`, `stats`, and `output` return typed
          objects.** Annotate them `> QueryResult`, `> ExplainResult`, `> PathResult`,
          `> RefsResult`, `> KnowledgeStats`, and `> OutputRecord`.
        - |-
          **`types.DoctorCheck` is `types.Check`, and `DoctorCheckStatus` is `CheckStatus`** (with
          `CheckOK`, `CheckFail` and `CheckAdvice`): a conformance finding is the same record. Go
          names only; JSON keys and proto messages are unchanged. `magus\diff` gains `opts.from`,
          reading a saved review, so `magus diff --impact`'s advisors share one diff.
        - |-
          **Breaking: the typescript spell's `dev-server` op takes the server command from
          the caller.** It no longer runs the `dev` script in `package.json`: pass the command
          the way `esbuild` takes its args, `typescript["dev-server"](ctx, {"args": ["vite"]})`
          runs `pnpm exec vite`. A call with no command fails with that call spelled out.
        - |-
          **Breaking: an unknown key in `magus.yaml` fails the load.** MGS1040 reports each as
          `file:line` with the nearest known key; a second YAML document in a file is rejected.
        - '**Upstream-wait messages back off** (15s, 30s, 1m, 2m, …) and name both targets.'
        - |-
          **Breaking: `vcs\base` is declared as raising.** It raises only for a `dir` that does
          not exist, but a caller outside a raising function must now catch it.
        - |-
          **`vcs\history` takes `paths` and `first_parent`, and each commit carries `files`.**
          It reads any number of commits in one VCS call on git, hg, sl and jj, and `limit: 0`
          returns them all. A merge is judged by its diff against the first parent. The docs site
          reads its page history this way and no longer shells out to git.
        - |-
          **Breaking for SDK implementers: `VCSDriver.Preserve` is required.** Every backend
          captures and restores the working copy, untracked files included.
        - |-
          **A workspace load reports every broken magusfile and every shadowed spell at once.**
          `ls`, `doctor` and every other command name them all instead of stopping at the first.
        - |-
          **Breaking: MGS3018: a job's write paths name files.** `magus job fork`
          and `magus\job.put` refuse every existing directory, `.` and a sub-project root such
          as `console` included, since a root overlaps every other job. A path the job creates
          passes. A glob ending in wildcards (`dir/**`) is judged as its directory.
        - |-
          **Writes to host guard wiring are denied under a bound lease.** Every verdict names the
          lease it was graded under; an unknown lease id is a deny.
