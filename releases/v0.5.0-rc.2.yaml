    fixed:
        - |-
          **The bootstrap builds without mise.** It is now
          `GOEXPERIMENT=jsonv2 go run -trimpath ./cmd/magus run go-build --no-cache .`; magus
          does not compile without that experiment, and the old command worked only where the
          mise shim set it. The `raw-tool` rule exempts this exact line; any other spelling is
          refused and served it.
        - |-
          **Breaking for SDK callers: `magus clean` keeps outputs the VCS tracks.** It
          deleted committed generated files, with or without `--cache`, and left the tree
          dirty. `CleanOutputs` returns `CleanedOutputs`, listing removed and kept paths.
        - |-
          **A broken working tree no longer switches off the approved spawn rule.** The committed
          `magus\guard.spawn` rule runs on every spawn whatever the working tree holds; resolving
          it too slowly denies. A skipped rule says what applied. A workspace advise joins a
          built-in one, and the idle clock follows the agent's id.
        - |-
          **The broker adopts a supervisor's socket bound past the 107-byte path limit.** A socket
          bound through its directory reported a closed file descriptor's name, so the broker
          refused it; it now asks the kernel which file the socket is bound to.
        - |-
          **Status, doctor and the console see both background processes.** The liveness probe
          asks the configured server rather than whichever socket a run inherited; doctor's
          `sockets` check reports `broker.sock` and `server.sock` by name; the compact status line
          names each; and the dashboard gains broker and server tiles. `MAGUS_*` settings now
          apply in a workspace with no `magus.yaml`.
        - |-
          **A claim released while a restarted broker was taking it back is released there.** A
          step finishing during the moment its claim moved to the new broker left the claim
          counted, so the broker admitted less work until that process exited.
        - |-
          **A claim released while its holder reconnects no longer stays on the new broker.** A
          release that landed after the new broker recorded the re-asserted claim, but before
          the client finished reconnecting, was dropped, so the broker counted that memory
          until the holder's process exited. The client now hands such a claim back as soon
          as it reconnects.
        - |-
          **A broker reply that arrives just before the connection closes is no longer lost.**
          `magus broker stop` could report `connection closed during shutdown` after the broker
          had answered and stopped.
        - |-
          **A run killed outright releases its claims and services at once.** Claims and
          service references ride the run's one broker connection, so the kernel closing it
          releases them; this replaces pid polling and the 24-hour cap. When the broker
          restarts under running steps, they re-assert their claims on the new one.
        - |-
          **The server keeps the knowledge graph and symbol indexes current with MCP off.**
          Graph watching and symbol indexing belonged to the MCP listener, so `mcp.enabled:
          false` quietly stopped both; they now run for as long as the server does.
        - |-
          **`magus broker units` fits the broker's drain and SIGHUP.** Each unit pins
          `shutdown_grace` and waits that long plus 60s before SIGKILL, where systemd waited 90s.
          systemd sends SIGTERM to the broker alone and `reload` sends SIGHUP; the launchd broker
          logs through `--log` so SIGHUP reopens it. Reinstall printed units.
        - |-
          **The Buzz checker rejects four programs upstream Buzz refuses.** Each used to pass
          `magus buzz --check` and fail at run time with no line, or run with a wrong answer:
          `std.print(...)` (upstream-strict sessions only), an unknown method on a list, map or
          string, `len(xs)`, and `return null` from a function declared `> int`. Each error names
          the fix.
        - |-
          **A diagnostic inside an interpolated string points at the expression.** Every error
          in `"{...}"` reported line 1, column 1.
        - |-
          **A module's private object or enum stays its own when the importer declares one of
          the same name.** A script declaring `object Node` that imported `magus/figure` made
          figure build its internal nodes from the script's `Node`, so every figure refused to
          draw. Private objects and enums now get per-module keys, as private vars and functions
          already did, matching upstream Buzz.
        - |-
          **A long-running magus no longer grows with every magusfile evaluation.** Each Buzz
          session kept about 0.5 MB alive forever, so the daemon and benchmarks grew without
          bound. A session now releases its heap values when it closes; under `-race`, a value
          read after its session closed panics instead of reading another object.
        - |-
          **Buzz `s[i]` indexes bytes, as upstream Buzz does.** It indexed runes, so on a
          non-ASCII string it disagreed with `len()`, `sub()` and `foreach`: `"aé—b".len()` is 7,
          yet `"aé—b"[5]` failed as out of range. Each index now yields a one-byte `str`, and one
          past the end fails with upstream's "Out of bound str access".
        - |-
          **Buzz subscript errors use upstream's wording.** A list index out of range, read or
          assigned, fails with "Out of bound list access", and a negative `str` index with "Out
          of bound string access", in place of "list index N out of range". Each still names the
          index and the length.
        - |-
          **Buzz type tests and qualified literals tell same-named types apart.** `is`, `as?`, a
          typed `catch` and a `<Node>` match arm match the object or enum in scope, so another
          module's private `Node` no longer passes `is Node`. A script's own declarations no
          longer replace an import's export, and `ns\Node{...}` builds the `Node` that `ns`
          exports. Matches upstream Buzz.
        - |-
          **Breaking: a Buzz annotation naming an undeclared type is BZZ1002.** `fun f(r: Nope)`
          and `fun f(r: magus\Nope)` accepted any argument; now they fail, as upstream Buzz
          does. `ns\T` resolves through the namespace `ns`, host types reach aliased imports,
          and `serialize\Boxed` is declared.
        - |-
          **A namespace a module never imported is BZZ1009.** `magus\Context` without
          `import "magus";` named the wrong cure, `magus self update`; now the error says no
          import binds `magus` and names the line to add. Hints suggesting a target now carry
          that import.
        - |-
          **A call to a member an untyped value lacks names the member and the line.** It raised
          `null is not callable` with no position; it now raises
          `<file>:<line>: unknown method push on list`.
        - |-
          **The first run after a change is cached.** A composer's skip_cache generators run once
          its dependencies finish and before its key, on a miss as well as a hit, once per
          invocation however many composers reach them. Their own members cache as steps, as
          under an uncached composer.
        - |-
          **"Cannot check byte-stability" is recorded.** It fails the gate, and a `-o jsonl` run
          now carries it as `race.determinism_unchecked` with its error.
        - |-
          **A catch-all lease no longer turns every word of a shell line into a path.**
          Under a `**` declaration only a redirect target or a file-shaped word is graded,
          so `python3 -c 'print(1)'` and `echo hi` pass beside it.
        - |-
          **A failure cause no longer clips MGS3011's log path.** Under a long `TMPDIR`, the
          240-character excerpt used to cut mid-path, leaving `captured output: ...` unopenable.
          The excerpt now trims the prose ahead of the path instead, so the path always prints
          whole.
        - |-
          **Clones of an hg, jj or Sapling repository share one state store.** Identity is read
          from each backend's config without running it. jj is covered when colocated with git.
        - |-
          **A target reached through `ctx.needs` runs under its own sandbox declaration.** Only
          the target a run schedules got its `sandbox` grants; one it composed ran under its
          caller's policy. `ci` composing `test` left `test` without its `/proc` read. Each
          composed target now gets its own declaration, not the union with its caller's.
        - |-
          **Concurrent fetches into one repository no longer fail.** Two `git fetch` runs read
          each other's refs mid-update and failed with "bad object"; magus now fetches into a
          repository one at a time.
        - |-
          **Config values given as flags are validated.** `--log-level bogus` ran with a value the
          same setting in `magus.yaml` or the environment is refused for.
        - |-
          **The console dashboard connects on the daemon's own origin.** The token exchange sends
          an expiry the daemon accepts, and a page from an older console build asks for a reload.
        - |-
          **Console failures are always shown.** Every failed daemon call, stream or undecodable
          frame raises a notification, and the console lint rejects a swallowed catch. A page with
          no token shows one sign-in state with the command that opens it signed in, and a 401
          returns there.
        - |-
          **Console links carry a runnable command.** `magus job fork`, `ls jobs` and the other
          console hints print `open "<url>#token=$(magus config token print)"`, and
          the `console` MCP tool returns it as `open`. The job hint names a daemon running a
          different build instead of claiming nothing serves the console.
        - |-
          **Security: cached guard-rule bytecode is authenticated.** Every chunk under
          `<user cache>/magus/buzz-bytecode` carries an HMAC keyed by a secret in
          `<user state>/magus/buzz-bytecode.key`. A chunk that does not verify, planted or moved
          from another key, is compiled over rather than run.
        - |-
          **A top-level raising call in `magus buzz` names the fix.** BZZ1006 says to put
          the call in `fun main(args: [str]) > void !> any { ... }`, which `magus buzz` calls
          after the top level, and which `-e` takes too.
        - |-
          **`MAGUS_OFFLINE` refuses every `http\` request a script sends,** by name and before
          it leaves the process, as it already did for remote-spell fetches; `http\serve`, which
          only listens on localhost, is unaffected. `http` no longer claims its requests are
          audited: they are not recorded.
        - |-
          **The merge queue gates the change's projects.** It appended them after the gate
          line's `--`, so `run ci:gha -- --inherited=fatal <projects>` forwarded them as
          arguments, selected every project, and failed `security`'s argument check. The
          units now go ahead of the line's first `--`.
        - |-
          **`magus --root <dir> buzz` runs the script as if started in `<dir>`.** Its `vcs\`
          calls, execs and relative paths used the process's working directory, so a script
          pointed at another checkout read and branched the one it was started in.
        - |-
          **The root project declares its dependency on `proto`.** Its handlers import
          `proto/gen/go`, so a `.proto` edit now reaches the root's affected set, and a lease
          focused on the root can read `proto`.
        - |-
          **A coverage record is no longer refused after a squash merge.** Its commit is
          provenance only; per-file digests keep it honest.
        - |-
          **Cursor gates Grep, Glob, and Read before they run.** The hook restates
          them as shell and denies on `preToolUse`; `postToolUse` still advises.
          This workspace refuses a read of a run log or task capture, and creating
          or reading a directory named `terminals`.
        - |-
          **`affected --plan` advice names `--max-shards`, the plan's own flag, instead of
          `--ci-max-shards`.** The GitHub Actions guide no longer tells shard jobs to run a
          nonexistent `affected --shard` with a `matrix.total` the plan never emits; they run
          `run ci:gha ${{ matrix.projects }}`.
        - |-
          **A cache hit no longer restores a nested project's generated files.** An output glob
          such as `**/gen/mocks/*.go` stops at a nested project's directory unless rooted there,
          in the snapshot, replay, drift gate and `--race=replay` alike. MGS3001 now judges a
          directly selected step's replay, catches a file replaced with its mtime kept, and
          names the likely writer.
        - |-
          **`magus describe harness` prints what a current harness wires.** Text output lists each
          managed hook's matcher and command, and `-o json` carries them under `wired`, whether or
          not anything is left to merge.
        - |-
          **Go code inside a string or comment no longer reads as a declaration.** The golang diff
          driver took `var i = 0;` in Buzz held by a Go raw string for a Go declaration, in both
          git's change regions and magus's hunk placement. Lines inside a Go string literal or
          block comment now stay with the declaration around them.
        - |-
          **`magus diff` names the declarations a change touched in test files and build-tagged
          files.** A test function has no referents, so the filter dropping unreferenced locals
          dropped it; a touched declaration is now listed regardless. A Go file the symbol index
          leaves out, such as one under an unsatisfied build tag, has its declarations read from
          its own syntax.
        - |-
          **`magus doctor` fails when the hook interpreter is another build.** `guard-binary`
          runs `version` on the magus a hook would run and fails, naming both binaries, when
          it differs from the doctor's own or prints none.
        - |-
          **Whole-tree generation no longer traverses pre-existing untracked directories.** The
          drift gate now treats VCS-collapsed directories as opaque, so a local `node_modules/`
          tree cannot exhaust the host's file descriptors while unrelated generators run. New or
          removed directories are still reported as generated-file drift.
        - |-
          **The playground and `--dry-run` check a script as the engine does.** `proc`, `http`,
          `vcs` and the other host modules are typed there too, so a body the engine refuses no
          longer passes a dry run.
        - |-
          **Every git call magus makes is hardened the same way.** `GIT_DIR`, `GIT_REPLACE_REF_BASE`,
          `GIT_ATTR_SOURCE`, the shallow and pathspec variables and injected config never reach
          git, including the shallow-clone deepening fetch, which re-added them. git never prompts
          for credentials, and no signing, rerere or signature line changes what magus reads.
        - |-
          **Generated docs examples read the same wherever they are regenerated.** The
          examples generator runs magus in `testkit.Environ`, so no `MAGUS_*` variable, cache or
          state dir it inherits leaks run history into the captured `magus explain` output.
        - |-
          **A command magus runs leaves no process behind.** On Linux, macOS and the BSDs,
          whatever of a target's process group outlives its command is killed when the command
          exits, before it is reaped, so a background process it started stops there and no
          longer holds the run open for five seconds on its output.
        - '**A failed remote-cache exchange names the step that failed.**'
        - |-
          **A failed spell import names its magusfile.** A workspace failure located no file for
          an import error, and an error built without a relative path rendered `magusfile: exec :`.
        - |-
          **A failed version probe quotes the tool's own reason** instead of a bare exit
          status.
        - |-
          **A failing remote store reads as failed, not missed.** Both shipped cache spells throw
          on a failed request; `false` means not stored (get) or already stored (put).
        - |-
          **A failed target's cause line keeps its reason.** A long log path no longer crowds
          the statement out, so a timeout still says the target exceeded its declared ceiling
          when TMPDIR is deep.
        - |-
          **A fresh checkout can build its first binary.** With no `magus` in the checkout root,
          the `raw-tool` rule serves `GOEXPERIMENT=jsonv2 go run -trimpath ./cmd/magus run
          go-build --no-cache .` for every raw `go` command, and denies it once one exists.
          `go -C <dir> <verb>` and `go <verb> -C <dir>` reach one verdict; a bare `cd <dir>`
          passes the `cd` rule.
        - |-
          **Generated output no longer depends on the build.** magus requires
          `GOEXPERIMENT=jsonv2` and refuses to build without it.
        - |-
          **A cache replay no longer removes an output before restoring it.** Bytes already
          current are left alone; anything else is staged and renamed over, so a sibling
          compiling a go:embed of the tree never finds a file missing. A declared read whose
          literal prefix names a pruned dir such as `gen/` is now hashed, and MGS4008 sees it.
        - |-
          **A hand-maintained file among generated ones merges as text again.** `.gitattributes`
          lists each declared output glob as written, then names every tracked file an output's
          exclusion carves out with `!merge !linguist-generated`, so git's own merge handles it
          and review shows its diff. A slashless output glob is now anchored at the root.
        - |-
          **The GitHub Actions remote tier stores what it uploads.** The spell read the signed
          URLs under their lowerCamel names while the service answers `signed_upload_url`, and took
          the empty URL for an existing entry: every upload reported success, nothing was stored,
          and every lookup missed. It reads either name.
        - |-
          **The GitHub provider no longer offers a merge method a ruleset refuses.** `describe`
          intersected repository settings alone; it now narrows `methods` to what every active
          ruleset rule targeting the base branch also allows, drops `merge` under a required
          linear history, and errors when nothing is left in common.
        - |-
          **`go::go-clean` accepts forwarded flags.** `-cache`, `-testcache`, `-modcache`, and
          `-fuzzcache` always landed alongside `./...`, which go refuses in any order. A new
          `Command.TrailingArgs` slot drops the package pattern the moment any flag is
          forwarded; a bare `go::go-clean` still cleans `./...`.
        - |-
          **A sandboxed `go` can write the checksum database's state.** The go spell grants
          `$GOPATH/pkg/sumdb` (or `~/go/pkg/sumdb`), where go records the tree head it
          verifies a module against. Without it, `golangci-lint custom`'s `go mod tidy`
          failed under landlock whenever `GOMODCACHE` pointed elsewhere, as in the merge
          queue's candidates.
        - |-
          **The graph links a target to a workspace spell imported without an alias.**
          `import "spells/acme";`, the form BZZ1008 requires, produced no target-to-op edges, so
          `magus path` and `magus explain` missed every op it runs.
        - |-
          **Guard advisories no longer fire on paths outside the workspace.** A command whose every
          path lies outside the root, or a write into a scratch directory, is advised nothing, and
          scripted-rewrite no longer refuses a script whose every named path is outside it.
        - |-
          **A checkout that cannot load its own sources can be relinked by an agent.** When the
          workspace fails to load with MGS1021, the raw-tool rule allows the relink MGS1021 prints
          (`go build [-trimpath] -o magus ./cmd/magus`) and the generators the `*_generate`
          targets run, alone on their line. Everything else stays denied, and denied again once
          the workspace loads.
        - |-
          **A workspace command rule's deny holds on a line the guard asks about.** A built-in
          ask, such as an ungated push, skipped `magus\guard.command`, so approving the push
          also ran what the workspace denies on the same line, such as a chained
          `gh pr merge --admin`.
        - |-
          **A read-only interpreter program is no longer refused as a cache-dir write.** An
          inline program such as `python3 - <<EOF` is judged on the destinations of its writes,
          and on nothing when it writes nothing. One that deletes, moves or shells out, or writes
          somewhere the guard cannot follow, is still judged on every path it names.
        - |-
          **A spawn brief is judged as the worker's fresh tree meets it.** The bootstrap command
          alone on its line is no longer refused (it is the one go command a tree with no binary
          may run), and a single backticked word in prose (`cat`, `grep`) is not graded as a
          command the brief teaches.
        - |-
          **Every guard verdict names its rule.** A lease, focus, hook-wiring, notes or
          cache-dir refusal, an undeclared lease, and five advisories recorded no rule. Each now
          carries a catalogued name: `lease-write`, `lease-undeclared`, `lease-gate`,
          `lease-vcs`, `lease-rebind`, `lease-harness`, `focus-read`, `hook-wiring-write`,
          `lease-state`, `dependency-update`, `dependency-install`, `echo-on-success` and
          `timed-magus`, each listed by `magus describe rules`.
        - |-
          **A deny path naming one declaration denies only edits to it.** A job forked with
          `--deny-paths 'run.go#A'` had all of `run.go` denied. The guard now denies an edit only
          when it changes `A`, and `magus job wait` grades the footprint the same way. A write it
          cannot place, and a file or glob deny path, deny the whole file.
        - |-
          **The guard judges a `for` loop over literal words one iteration at a time.**
          `for b in x y; do git worktree remove /w/$b; done` passes when each worktree is
          safe to remove, and a dirty one is named in the denial. Lists needing expansion,
          other loops, conditionals and functions stay refused.
        - |-
          **Global options no longer hide a VCS command from the guard.** `git -C . reset --hard`,
          `hg -R . purge` and `jj --at-op @ abandon` reach the rule their subcommand triggers.
          An inline alias such as `git -c alias.x=...` is refused under the new `inline-alias`
          rule.
        - |-
          **The guard lets a tool's help through.** `go clean --help`, `gofmt -h` and
          `magus run --help | grep charm` pass the rules that route work through magus. A help
          flag handed to a program, as in `go run main.go --help`, is still work, and the
          credential and destructive-command rules still refuse.
        - |-
          **The agent guard judges a Buzz script's writes, and leaves scratch files alone.**
          `magus buzz` replacing a file the workspace already has through `fs` is refused like
          the same write from python. `sed -i` or a scripted rewrite whose files all lie outside
          the workspace passes, including after a `cd` into a scratch directory.
        - |-
          **A worker in its own worktree can write inside its lease.** A leased write is graded
          against the checkout the lease was taken in, and a write into another magus checkout
          is denied. A subagent's first call registers its checkout only when the host reports
          the call's directory; otherwise `magus job exec` does.
        - |-
          **The guard no longer refuses a search in favor of a stale graph.** While a
          merge, rebase, cherry-pick or revert is underway, or the guard index was built
          at another revision, symbol-search, grep-reader and search-translation advise
          that the graph is stale and name `magus graph build`. An index from another
          revision now reads as stale for every kind.
        - |-
          **A guard verdict ref resolves from a linked worktree.** A hook run from the primary
          checkout stores a repeated deny's full verdict in that checkout's activity trail, so
          `magus query output grd...` in the worktree failed with MGS8001. It now reads the
          primary checkout's trail when its own has no such payload, and a miss names every cache
          directory searched.
        - |-
          **The magus-buzz-lang skill's examples run.** They import `encoding/json`, list a
          directory with `fs\listDir` and raise from an exported `main`, and the module list
          names the `encoding/` modules by their import paths. `flags\parse` says a flag is
          declared with its dashes.
        - |-
          **`magus describe harness` retires only the host entries a harness spell marked as its own.**
          A hook entry is magus's when it runs a shipped template or its command ends in
          `# magus:harness`; a harness spell declaring any other entry is refused. Every other
          hook stays yours, whatever it mentions.
        - |-
          **A harness probe that runs out of time reports `unprobed`, not `uncovered`.** On a
          machine under memory pressure, a guard that answers in a second can miss the 10s probe
          deadline, and `magus agent harness verify` and doctor then called a wired config
          uncovered. A probe that misses its deadline or cannot start now reports `unprobed` and
          names the deadline.
        - |-
          **Mercurial no longer sends every conflicted file to the magus merge tool.** With no
          `ui.merge` set, hand-written files fell back to it and stayed conflicted. The tool is
          now registered with `disabled = True`, so only `[merge-patterns]` routes declared
          outputs to it, in Sapling too. A hand file an output's exclusion carves out gets
          Mercurial's `:merge`.
        - |-
          **The hook glue runs the magus of the checkout a call runs in.** It looks for `./magus`
          from the event's `cwd` first, so a subagent in its own worktree is judged by that
          tree's binary rather than the session's or an older one on PATH. `HOST_CWD_PATH`
          renames the field.
        - |-
          **Imported cache files are 0644, and a running target's crash record survives the same
          target running twice at once.** Stale inflight temp files and staging directories are
          collected.
        - |-
          **Installs of magus-managed git, hg and Sapling sections are atomic.** They are
          serialized per repository and leave a hook executable. A torn section marker is an error.
        - |-
          **`magus job fork` refuses a deny path no footprint can grade (MGS3031).** A
          declaration deny on a file with no diff driver, on a pattern, or with nothing after
          the `#` is refused, as the same write path already was.
        - |-
          **A goal's `expect` is optional in the job schema.** The decoder already filled it in
          (`passed` for a check, `changed` for paths and symbols); `magus job fork --schema` now
          agrees and states the default.
        - |-
          **`magus\job.list` measures overlap footprints.** It left every footprint empty, while
          `magus ls jobs -o json` measured them. Both now measure them the same way.
        - |-
          **A job row no longer stores `"no_default_charms": false`.** A check that does not opt
          out of the default charms leaves the field out, as it did before the field existed, and
          the job schema reads a field tagged `omitzero` as optional.
        - |-
          **The guard's "installed skill" advice no longer fires on a skill's source.** It reads
          the `source: magus` stamp from the frontmatter only, so editing
          `internal/agent/skills/*/SKILL.md` is not mistaken for editing an installed copy.
        - |-
          **The job store judges a job by what it declares.** A job queued on a live dependency
          is no longer ended as stale; its clock starts when the dependency ends. A re-fork is
          ordered by its new depends_on, a put adding a directory write path is refused
          (MGS3018), and an abbreviated checkpoint no longer reads as a diverged base.
        - |-
          **`magus job wait` accepts a check's own run.** A check resolves against the workspace's
          `default_charms` as `magus run` does, so with default `rw`, `magus run test .` records
          `test:rw` and satisfies a `test .` check. A run of another target, project or charm set
          is still rejected. A check declaring `no_default_charms: true` is satisfied only by a
          `--no-default-charms` run.
        - |-
          **`magus job wait` accepts a run recorded in the same second as the job was
          declared.** The declaration time is stored in whole seconds, and the comparison
          rounded it up to the end of its second, so a check run straight after `job fork` or
          `job apply` was rejected as older than the job.
        - |-
          **Knowledge shards on the remote tier are signed and verified,** and a run that may not
          write the remote tier stores none.
        - |-
          **A lease's read paths widen its write paths instead of replacing them.** A job
          declaring `--read-paths` lost read access to the projects it was leased to edit, so
          the guard's `focus-read` rule denied a worker its own files. The guard now reads the
          same boundary the job store checks: the write paths plus the read paths.
        - |-
          **`lease-vcs` graded a parentless row as the orchestrator's.** A worker forked without
          `--parent` could push. A lease now counts as a worker when its row has a parent, when
          a subagent holds it, or when its caller names no session. Only a root session holding
          a parentless row is the root.
        - |-
          **`log.level` is honored.** It was overwritten at startup by the level `-v` and `-q`
          imply, so `log.level: debug` in `magus.yaml`, `MAGUS_LOG_LEVEL` and `--log-level` left the
          process at `info`. A verbosity flag still wins when given.
        - |-
          **`magus affected` rebuilds the project a renamed file left.** Under `diff.renames`,
          git's default, only the new path was reported. Branch-change notices list both too.
        - |-
          **`magus bisect` names the culprit on current git.** Newer git writes
          `# first 'bad' commit:` in the bisect log, which the parser did not read.
        - |-
          **`magus\cmd`, `magus\run` and `magus\describe` honor `opts.allow_failure`.** A
          non-zero exit returns the result instead of raising, as `proc\exec` does.
        - '**`magus doctor` reports an unregistered merge driver from an explicit boolean.**'
        - '**`magus doctor` sees the checkpoint hook template again** (template revision 11).'
        - |-
          **`MAGUS.md` routing indexes are byte-identical on every machine.** Example columns rank
          by the repository's own edges, not the binary's spell catalog; gitignored sources are
          skipped; and the drift gate now catches an output a composed step writes, which let
          five library indexes go stale.
        - |-
          **`magus session dispose` refuses without an interactive terminal and is denied to
          agents.** Disposing an attention request records that a PERSON answered it. Outside a
          terminal the CLI exits 2 with the `--ack` sentence, and the guard rule `agent-sign-off`
          (widened from `read-ack`) denies every spelling on every agent channel.
        - |-
          **One magus can pipe into another that needs the same project, even through `jq` or
          `tee`.** The reader, proven from the kernel on linux and macOS, waits until the
          upstream is done with its projects, draining the pipe; before, the stage that lost
          the race exited 75. Different projects still stream. A looping pipe is MGS3023.
        - |-
          **Every `magus\` type a script names is declared and buildable.** `magus\Context` and
          `magus\Exec` are typed, so a misspelled ctx member fails the check. `magus\DirsOptions{...}`
          and every other record and enum construct at run time, including through an aliased import.
          Callback parameters are typed, so `fs\walk`, `os\withEnv` and the `magus\guard` rules
          refuse a callback of the wrong shape.
        - |-
          **A `MAGUS_*` value that does not parse stops the load.** A bad number or duration was
          ignored, and `magus.Open` skipped validating the environment at all.
        - |-
          **`magus vcs resolve --against` works in a linked worktree, and paths stage literally.**
          A conflicted merge there read as one that never started, and a file named `*.txt`
          staged every `.txt` file. A merge already underway is now refused.
        - |-
          **`magus mcp --help` and `magus status` stop naming an HTTP `/mcp` that is off.** With
          `mcp.http: false` they say so and name stdio and the server socket, and
          `--probe=mcp` fails with that note instead of reporting `serving`.
        - |-
          **`mcp.insecure_bind` binds the address it names.** The listener used to bind
          `127.0.0.1` whatever `mcp.address` said, so `0.0.0.0:7391` listened on loopback only. It
          now listens on exactly that address, exposing `/mcp` over plaintext HTTP with a bearer
          token as its only guard; the startup log names the bound address and warns. The operator
          token is still refused from any non-loopback peer.
        - |-
          **magus reads no longer take `index.lock`.** Every git call runs with
          `GIT_OPTIONAL_LOCKS=0`, so a status from a guard hook, the daemon or the merge driver
          never rewrites the index while your own `git add`, `commit` or `merge` needs it, which
          failed with "index.lock: File exists".
        - |-
          **A target reached through `ctx.needs` runs at `--concurrency 1`.** A needed target
          that ran an install or a child magus waited for the slot its own pool worker held, so
          `magus --concurrency 1 run test` hung until `--target-timeout`. Needed targets and
          per-spell fan-outs now show on the MGS3013 deadlock check, so a pool they wedge is
          refused within seconds.
        - |-
          **A nested magus aimed at another workspace runs there.** `magus --root <other> ...` run
          inside `magus run` was handed to the outer run, whose own lock refused it with MGS3007.
          The outer run now declines a run from another workspace, so the nested magus runs it
          under that workspace's locks. A nested run into the same workspace is still refused.
        - |-
          **`describe job` and `job wait` no longer panic on a job with goals.** A command that
          loaded the workspace under `--root` as given and again under the path it resolves to
          hit the one-workspace check; both spellings now name one load.
        - |-
          **Go ops key their cache on the platform they build for.** The go spell's build, vet,
          test and lint ops fold `GOOS`, `GOARCH`, `GOARM` and `GOAMD64` into their cache keys,
          so a run for another platform no longer replays the host's result.
        - |-
          **The `output-pipe`/`output-redirect` exemption for `magus query output` and
          `magus refs --text` now sees past a global flag.** It anchored on the first argument
          after `magus`, so `magus --root <dir> query output <ref> | grep x` was wrongly denied;
          the check now reads argv the same way the read-ack rule does, ignoring where a global
          flag sits.
        - |-
          **A missing tool costs one probe and one warning, not one per invocation.** With no
          `node_modules`, every magus call forked `pnpm exec tsc --version` and warned each time.
          The probe cache now records an absent tool like a version, keyed on the lockfile,
          install stamps, `node_modules/.bin/tsc` and the `typescript` link. The warning names the
          cause and the fix.
        - |-
          **The `proc\exec` warning about the magus binary fires only when a typed member answers
          the invocation, and names it** (`call magus\run instead`). `magus job exec`,
          `magus queue ls` and other invocations with no member no longer warn.
        - |-
          **The push gate grades the checkout a push runs in.** `git -C <dir> push`, `hg -R`,
          `jj -R` and a leading `cd <dir> &&` are graded by that checkout's revision and gate
          record, not the hook's, and a single refspec grades the revision it names. A directory
          only the shell can resolve keeps the advisory.
        - |-
          **The queue merges a gated candidate whose only regeneration was a settled conflict.**
          When validation's regeneration wrote nothing, apply kicked the change with
          `KICK_REGENERATION`; it now merges its own rebuild once that rebuild is the commit
          validation gated, still running none of the change's code.
        - |-
          **The merge queue no longer kicks a change back for a red it inherited.** A red
          candidate whose base is red on the same projects waits with `WAIT_BASE_RED`, keeps
          its place and gets no comment. The base is gated once a run, however many changes it
          reddens.
        - |-
          **Queue candidates are dated from the commits they merge.** They carried a fixed
          2000-01-01 date, so a build that reads HEAD's date as "now" dropped every dated post.
          The plan records the newest date among its base and admitted heads, so the same queue
          still builds the same candidates.
        - |-
          **The queue dashboard renders and edits its issue.** It read 100 merged pull requests
          with their checks, which timed out GitHub every run; it reads 40. `--issue` is now
          required, and `--preview` writes only the file, so an unset issue variable fails the job
          instead of passing green with no issue edited.
        - |-
          **`magus queue describe --app` works for a private GitHub App.** It reads the App ID
          from an organization's installations where an owner's token lists them; elsewhere it
          names the app's settings page and prints the rerun with `--app <slug>:<id>`. The printed
          key step reads no stdin and deletes the download even when storing fails.
        - |-
          **The merge queue starts a validation run only when no unfinished one covers the
          change.** On merge intent, and when CI finishes on a queued head, it skips if a run on
          main is pending or planned later, so triggers no longer cancel each other's pending
          runs. Each decision is a named notice.
        - |-
          **The merge queue's gate replays main's cache.** It ran `ci` while main's shards
          stored entries under `ci:gha`, and charms key every step, so an unchanged base
          missed every entry. The gate now runs `ci:gha`, and a test holds its keys equal to
          the shards'.
        - |-
          **A queue hook's sandbox carries the base's target grants.** It already took the grants
          of every spell the base resolved; it now adds each target's own `sandbox` declaration.
          The gate stacks a target's sandbox on the hook's, so a grant the hook lacked, like this
          repo's test target reading `/proc`, was unusable.
        - |-
          **The merge queue no longer asks the remote for blobs its own merges wrote.** In a
          partial clone, git fetched them as missing and the remote refused, failing the
          candidate as a machine error. `queue validate` and `queue apply` now refuse a partial
          clone, and the queue workflows check out full clones.
        - |-
          **A quiet `magus\cmd` that fails carries the child's stderr in its error.** The
          Workflows pass `secrets.GITHUB_TOKEN` as `GITHUB_TOKEN`, which `gh` and the github
          queue provider both read, in place of `GH_TOKEN`.
        - |-
          **The agent guard no longer refuses every `node` command.** A spell now names the args
          that select an op from its program's other uses, through the new optional
          `mgs_getModeArgs()`, and `typescript` declares `--test` for `node-test`. `node --test` is
          refused while `node -e` and `node script.mjs` run. Single-purpose tools such as
          `govulncheck` stay refused in every spelling.
        - |-
          **`interpreter-rewrite` judges what a script writes, not what it mentions.** A
          script that carries tracked paths as data and writes its report to scratch or
          stdout runs; only a write's destination is checked against the tree.
        - |-
          **The refresh hook's `./magus` is looked for where git runs the hook.** The not-indexed
          diagnosis resolved a relative hook binary against the magus workspace root; it now uses
          the repository's top level, which differs when the workspace sits below it.
        - |-
          **Symbol lookups finish in workspaces with nested checkouts.** `magus refs`
          skips linked checkouts when checking a missing symbol against workspace text.
          Default text searches classify only files with matches, reducing work in large
          repositories.
        - |-
          **`refs` refuses a name several definitions share.** It used to answer for whichever one
          ranked first. It now exits 2 and lists `magus refs '<id>'` for each candidate.
        - |-
          **`magus refs <symbol> --rename <new> --dry-run` records nothing.** Grading each file
          through the guard spent the session's once-only advisories, added to its touched
          projects, recorded the policy, registered the acting lease's base and appended
          activity lines. The dry run now reaches the same verdict from a discarded copy of that
          state and writes none of it.
        - |-
          **`magus self update` never picks a release candidate on its own.** The release
          index lists candidates apart from stable releases, so no shipped binary moves to
          one, and `--version v0.5.0-rc.1` still installs it by name. Cutting a candidate
          records its notes without consuming the changelog fragments the final release
          needs.
        - |-
          **A remote hit is one `cache.hit` record, counted once its replay succeeds.** A local
          replay that fails tries the remote tier before rebuilding.
        - |-
          **A remote-tier miss is visible.** Each prints `<project> not in the remote cache
          (out...)` with the producing run's ref, the end-of-run line counts misses, and `-v`
          adds a digest per key-input class.
        - |-
          **Replaying a fully cached run is fast again.** Tool probes run concurrently and skip
          tools no selected target drives. Cache keys are unchanged.
        - |-
          **`--root` from another directory no longer loads that directory's modules.** A
          magusfile's imports resolve against its project, then the workspace root.
        - |-
          **`magus run test . -- -run X` runs only the selected tests.** The workspace's `test`
          target passed explicit arguments to `go test`, which replaced the forwarded ones, so every
          narrowed run executed the whole suite. It now appends its forwarded args and skips the
          coverage floor when narrowed; the spell docs show the `+ args` idiom.
        - |-
          **Args after `--` reach only the target you name.** A cached replay's gates and the
          settle step no longer receive them, so `magus run test . -- -run X` stops failing in
          its generate step with `flag provided but not defined: -run`.
        - |-
          **A run the machine's build budget refuses says so.** It exited 75 with nothing after
          the header; it now prints `[fail] <project> <target> (not started)` with the MGS3009
          cause naming the holder, and `-o jsonl` emits the `run.target.result` and
          `run.diagnostic` records.
        - |-
          **Two runs of one step recorded in the same millisecond resolve to the later one.**
          A bare output ref and `--attempts` broke that tie by a random attempt hash, so they
          could answer with the older run. Each record now stores when it was persisted, and
          that decides the tie.
        - |-
          **A sandboxed tool can create its declared cache directory.** The kernel sandbox skipped
          a granted path that did not exist yet, so buf on a fresh machine was denied its cache. A
          missing path a spell or `sandbox.allow` declares writable is now created; a missing
          workspace is still reported.
        - |-
          **Sandboxed `go generate` and `go run` work again.** The sandbox grants the Go build cache
          execute as well as read and write: since Go 1.24, `go run` and `go tool` exec the binaries
          they cache there, so every `go run` generator failed with `permission denied`.
        - |-
          **A sandboxed child's git runs again on Linux.** Under landlock git died reading the
          unreachable `~/.gitconfig`. Children now get `GIT_CONFIG_GLOBAL=/dev/null` unless
          `GIT_CONFIG_GLOBAL` is passed through, so a commit takes its identity from
          `GIT_AUTHOR_*` and `GIT_COMMITTER_*`. MGS3002 now shows what git said.
        - |-
          **`self update` refusals hand back flags that exist.** Downgrade, reinstall and
          unversioned-build errors named `--uf.Force` / `--uf.Yes`, which are struct fields,
          not flags; they now say `--force` and `--yes`/`-y`. A declined install exits nonzero
          instead of 0. The confirmation prompt names the host the release index came from.
        - |-
          **`magus` means the checkout's build in a session and under magus.** A new
          `SessionStart` entry puts the session root first on PATH for the agent's Bash tool
          commands, and every child magus starts gets the running binary's directory first on
          PATH.
        - |-
          **Share and wrong-method failures answer in the refusal shape.** `/api/v1/share` and a
          wrong method on any `/api/` route send AIP-193 JSON (MGS9012-MGS9014); the console shows
          its message and Help link. Health reports down when every workspace failed, and the
          Windows sign-in line is PowerShell's `Start-Process`.
        - |-
          **A shared step no longer inherits one caller's timeout.** It runs under the
          invocation's cancellation. MGS3012 lists what was still admitted.
        - |-
          **`diagrams-generate docs` no longer replays stale figures after a rebuild.** It
          keys on the digest of the `magus/figure` source the running binary embeds, which
          `magus version -o json` now reports as `embedded.figure_sha256`, so an engine
          change misses the cache without `--no-cache`.
        - |-
          **A worker in its own worktree is graded under its job.** A spawn titled
          `<parent>/<role> <job>` now binds the child's agent id beside the job store, so its
          hooks resolve the lease from any checkout, and its first call records that checkout's
          base. A title's `<job>` also matches `<parent>/<job>`.
        - |-
          **`config cache` verbs reach a spell-backed remote tier.** `export` and `import
          --remote`, `prune --remote`, and `query output` publishing and remote lookup now carry
          the workspace's secret resolver, so a backend spell that reads its token through
          `magus\secret` no longer fails with "no secret resolver on this run".
        - |-
          **A spell cache restore builds cold when the store cannot answer.** A timeout or
          failed fetch logs the backend, key and elapsed time and stops trying older keys;
          a cancelled run still stops, and a bundle that fails verification is still refused.
          The GitHub Actions blob download gets a 300s bound instead of 30s.
        - |-
          **The broker's crash reaper records every hosted service.** A service keyed by its
          workspace path was never written to the journal, so a new broker had nothing to stop.
        - |-
          **A step waiting on an upstream target no longer masks a stall.** Only a moving step
          beats the heartbeat; MGS3013 and MGS3012 still catch a wedge.
        - |-
          **Concurrent graph builds no longer leave the knowledge graph stale.** Two queries
          in one checkout could leave the manifest naming a shard the file on disk did not
          hold, and later builds never rewrote it.
        - |-
          **A remote output fetched by ref is filed by rename.** A concurrent reader never sees
          it half written, and a review's seen threads never come back as new after two
          processes save them.
        - |-
          **A service record survives the crash it exists for.** The broker's journal was
          rewritten in place, so a power loss could tear a record that the next broker then
          deleted without stopping the service.
        - '**`magus session load` stops waiting for another loader when it is interrupted.**'
        - |-
          **Overlapping runs no longer erase each other's test history.** The volatility and
          duration history is shared by every workspace on the machine; a run wrote back the
          copy it loaded before it started, dropping outcomes another run recorded meanwhile.
          `magus config history passed` and `import` had the same race.
        - |-
          **`magus-utils cut` flushes the release manifest before it deletes the fragments.** A
          manifest that fails to land leaves no temp file in `releases/`.
        - |-
          **The filesystem remote cache answers a push of a key it holds as already stored.**
          Every other backend already does.
        - |-
          **The operator token is flushed when written.** A crash cannot leave an empty token
          file the server refuses to start on.
        - |-
          **A trail rotation keeps `events.jsonl` readable at the mode it was created with.** It
          also flushes the file, so a crash mid-rotation cannot empty the trail.
        - |-
          **Review receipts recorded at the same time no longer drop each other.** The console
          and `magus diff --ack` both write the store; the later writer erased what the other
          had just recorded.
        - |-
          **A reverted edit no longer leaves the symbol index describing the edit.** The scip
          step replayed from cache for the restored sources while the index still held the
          edited ones, so `magus refs` answered stale lines. A replay now requires the index
          its run wrote, and reindexes otherwise.
        - |-
          **Three guard rules match their catalog entries.** `cd` fires only ahead of a magus
          command. `cache-dir-write` grades only write targets, so `rsync --exclude .magus` and
          an interpreter's quoted data pass. `stage-all`'s description now names `-u`, `.` and
          the long forms its matcher already covered.
        - |-
          **A checkpoint token now covers untracked files.** `magus vcs checkpoint -o name` and
          `magus job exec` used to name a tree holding only new files by the digest of an empty
          patch. The digest after the `+` now includes untracked files, so a worker on the handed
          revision reads as `revision-match`. A tree with only tracked edits keeps its token.
        - |-
          **The unchanged-inputs hint no longer reads as a verdict.** It prints before the
          target runs, so it now says the target runs again, and it names the failed attempt
          rather than the step ref, which moved to the new run's result once that run landed.
          The target always re-ran; the exit status was already that run's own.
        - |-
          **magus binds and dials a unix socket at any path length on linux.** A path past
          the 108 bytes `sun_path` holds goes through its directory under `/proc/self/fd`.
          macOS refuses such a path, naming its length and the limit. The broker and server
          use this, so a deep `TMPDIR`, such as a merge queue candidate's, no longer breaks
          them.
        - |-
          **An unrecognized boolean in a `MAGUS_*` variable is an error** instead of silently
          keeping the previous value.
        - |-
          **An unrecognized spawn decision ranks as deny,** not allow, when two rules' verdicts
          merge.
        - |-
          **A job with a checkout root but no registration counts as never taken.** It ends past
          `jobs.stale_after` like any other job nobody took.
        - |-
          **`vcs\cmd` ran version control unguarded under a lease.** It now asks `lease-vcs`
          before it runs, and refuses outright when a lease is acting and no guard is linked in.
        - |-
          **A vulnerability database release no longer invalidates every Go target's cache.** The
          database date keys only targets that run govulncheck.
        - |-
          **A worker can fork a child of its own job.** The guard refused every `magus job fork`
          and `op=fork` under a lease, though the job store grades exactly that. A row naming the
          caller's lease as `parent` now reaches the store, which refuses a child reaching past
          its parent's paths.
        - |-
          **A worker can wait on a job it forked.** `magus job wait` and `magus\job.wait`
          refused every call from a checkout holding a lease, so a worker could never verify its
          own child. A holder now waits on any job below its lease. Its own job, a sibling's, an
          ancestor's and any unrelated job stay refused.
        - |-
          **Workspace load is 10x faster.** A bare library import is no longer executed as a
          candidate spell, Buzz tokens are shared across sessions, and `magus ls` loads once.
          A run skips re-evaluating a magusfile that does not export the target, and an exact
          source no longer walks the tree. `magus ls` here: 1.45s to 0.11s.
    security:
        - |-
          **Breaking: the remote cache refuses pre-domain `ed25519` signature envelopes.** They
          signed the manifest alone, so a store could replay a genuine entry with its log and
          descriptor swapped or stripped. Every magus from 0.4.0 signs the domain-separated form;
          an entry signed by 0.3.x is now a miss and rebuilds.
        - |-
          **Breaking: every merge-queue hook keeps its caches in its candidate's own home.** A
          gate or regeneration gets `HOME`, the XDG directories, `TMPDIR` and magus's cache
          inside the candidate's box, and the queue refuses a hook whose sandbox could write
          outside it. `--scratch-env` is removed with nothing to replace it; drop the flag.
        - |-
          **Breaking: queue hooks run in the base's sandbox.** The gate, the regeneration and a
          `--facts` command run under the base's `sandbox` policy, at least `best-effort`,
          rooted at their checkout: landlock confines their files on Linux, and everywhere their
          environment is the sandbox's. `--sandbox=required` refuses a hook the kernel cannot
          confine; `hack/ci/merge-queue.buzz` passes it.
        - |-
          **The daemon's unauthenticated `/console/` serves only the app shell.** It served every
          built console file, including the demo graph JSON holding the whole knowledge graph and
          its notes. Other files and directory listings now return 404, on loopback and on the LAN
          share, and an attached graph explorer never falls back to that demo data.
        - |-
          **A rule kept only for its side effects is no longer dropped.** When a hook loads
          the root magusfile for its rules, an import nothing references is kept whenever its
          file, or one it imports, reaches `magus\guard`, and so is a registration through an
          alias of `magus\guard`. A type named only in an annotation keeps its declaration.
        - |-
          **The agent guard no longer runs compiled rules it read from the working tree.**
          Compiled guard rules are kept under `$XDG_CACHE_HOME/magus/buzz-bytecode`, keyed by
          build and workspace, instead of `.magus/`. The load of the approved (committed) rules
          uses no stored chunk. A new build removes chunk directories no build has used for a
          day.
        - |-
          **The guard denies an agent-attributed session that edits the host's hook wiring, not
          just a leased one.** `.claude/settings.json` and its per-host equivalents could disarm
          every rule from the next session on; an unleased subagent was only advised. A person's
          own session, or an orchestrator relaying for one, is still advised.
        - |-
          **A leased worker can no longer slip past the harness refusal or borrow another job.**
          A global flag's value (`magus --root . agent harness install`) or a single-dash word with
          an `h` (`-o=template=hi`) hid the command from the guard. A spawn title naming a job
          outside the spawner's own lease tree is recorded as untrusted and attributes nothing.
        - |-
          **Failed authentication on `/mcp` is throttled.** Each caller, keyed by `Origin` or else
          its peer, may fail 20 times a second in bursts of 40, then gets `429` with
          `Retry-After` and the new code MGS9030 (too many failed authentications).
          A valid token is never throttled.
        - |-
          **`magus\job.put` writes as its caller, not the server.** Over stdio that is the
          lease `magus mcp` inherited. Over HTTP it is the `magus.lease` member of the
          request's `baggage` header, and a request without one may read but not write.
          `buzz` scripts and served `next` hints use the same caller.
        - |-
          **Loopback `/mcp` trusts its bearer token alone.** It no longer checks `Host` or
          `Origin` (no MGS9007 there) and answers any origin's CORS preflight, so a browser page
          with a token works like any other MCP client. A page without a token, a DNS-rebinding
          page included, still gets `401`, CORS never allows credentials, and the console's routes
          keep their checks.
        - |-
          **A refused `/mcp` request is unreadable to a page.** Only an authenticated response
          carries `Access-Control-Allow-Origin`, so a `401`, `403` or `429` reaches a cross-origin
          page as the same network error as a closed port.
        - |-
          **Token checks answer from memory.** The server keeps the operator file and the token
          store in memory, reloaded when either changes on disk and at least once a second, so a
          refused token costs no file read. A revoke made by another process takes effect within a
          second.
        - |-
          **The merge queue trusts less of what a change controls.** A review counts only from
          an account that can push, at the commit it approved; `describe` reports
          `required_approvals`. The regeneration proof covers what merged beneath a candidate
          and treats no extension as data. Regeneration follows no committed symlink, and update
          commits carry the queue's committer.
        - |-
          **OpenTelemetry exporters no longer expose endpoint URLs in info logs.** Update
          OpenTelemetry Go modules to v1.45.0, which fixes GO-2026-6505.
        - |-
          **`magus queue apply` follows only the base's own validation run.** A pull
          request's run executes its own copy of the queue workflow and could upload a forged
          plan and verdicts that merged ungated. Apply now refuses any run but `--workflow`
          started by a push or dispatch on `--base` of its repository (MGS3027), and
          `queue-apply.yaml` dispatches main's run instead.
        - |-
          **`magus queue apply` checks the plan against what it reads itself.** A plan naming
          another base or remote, a base commit the base lacks, or a stack base that is not
          the reviewed head beneath stops applying (MGS3028): a forged stack base could merge
          a revert of the base. Apply writes the squash message itself.
        - |-
          **The merge queue's own git no longer runs what a change's hook configures.** Git in
          a candidate reads the repository recorded when the checkout was made, with fsmonitor
          and submodule recursion off; a rewritten `.git` refuses the change. Hooks get the
          shared object store read-only, and every head is fetched before the first hook.
        - |-
          **Queue hooks run on an allowlisted environment.** A hook inherits only the sandbox's
          default names and the base's `sandbox.env.passthrough`, so no token or Actions file
          command reaches it. A unit starting with `-` or holding a line break is refused, and a
          hook's process group is reaped without a race.
        - |-
          **A merge queue kick-back shows what validation reported as text.** The claim, file
          names and commits render as code spans or fences no backtick run can close, and the
          facts line escapes every character that could end its HTML comment. The reproduce
          lines come from `magus queue apply --reproduce-gate` and `--reproduce-regenerate`,
          never from a verdict.
        - |-
          **Files that run code after the run are write-protected.** Under any mode but `off`,
          magus's checks refuse writes to `.git/hooks`, `.git/config`, `.git/info`, `magus.yaml`,
          mise and asdf pins, `.envrc`, `.claude/`, `.cursor/`, `.mcp.json`,
          `.vscode/tasks.json` and git hook managers' config. Landlock cannot deny inside a
          grant, so a child can still write them.
        - |-
          **Buzz's own `os` and `io` go through the sandbox,** each run's `env\set` stays in
          that run, the proc socket demands a token (`MAGUS_PROC_TOKEN`), and the lease marker
          moved out of the cache dir a confined run can write.
        - |-
          **The sandbox confines each child, not magus.** A launcher applies the landlock
          ruleset to every process a run starts, so a server serves each workspace under its
          own policy. `required` needs landlock ABI 3 (Linux 6.2), else MGS2012. MGS2010 now
          means a nested or forwarded run asked for a weaker mode.
        - |-
          **Sandbox path checks follow symlinks the way the kernel does.** A `..` after a
          symlink, a write through a dangling link, and `fs\symlink` to a path outside the
          policy no longer pass the binding-level check.
        - |-
          **Breaking: no job holding a secret or a write token restores an Actions cache.** A
          merge queue hook can read the runner's runtime token and plant cache entries in the
          default branch's scope, so trusted jobs now install cold. `setup-magus` restores run
          history only with `restore-history: 'true'`. A conventions test enforces both.
body: |-
    ### Added

    - **The advice action flags a moved script a trusted job runs.** The new
      `trusted-script-moved` advisor comments when a pull request renames or removes a file
      that a workflow job runs after checking out the default branch, and says whether the
      job breaks on the pull request or after the merge.
    - **`magus affected ci` sizes its gate to the change.** Every changed file gets a tier
      (trivial, mechanical, scoped, full) with its evidence. Below full the gate runs only
      the drift check and lint, the targets that declare a changed doc, or `test` with
      `go-test` narrowed through `go list`. A trivial change exits 0.
      `--no-redundancy-check` runs the full gate.
    - **Three hack/dev scripts for handing work to a worker.** `bootstrap-worktree` builds
      `./magus` and the graph in a fresh worktree, takes a job's lease, and refuses unless the
      row names that worktree and checkpoint. `render-brief` renders a brief from the job row.
      `check-guard-blocks` replays calls the guard should stop through every agent host's
      hooks and fails if one got through.
    - **`AncestryReporter` answers whether one revision reaches another.** All four backends
      implement `IsAncestor`.
    - **A wait names each path that kept an approval from carrying.** It also says when the
      approved commit is no longer reachable. Another build tool answers the `classify_edit`
      fact through `--facts`.
    - **An approval carries over a push the classifier finds safe.** When approvals sit at an
      older commit, the merge queue replays the approved diff onto the head's base and
      classifies each path the head changes beyond it: `rebase`, `generated`, `prose`,
      `comment-only` or `code`. The approval carries when `queue.carry_approvals` in
      `magus.yaml` allows every tier (default: all but `code`).
    - **The agent guard refuses a backtick command substitution.** Inside double quotes a
      backtick runs a command, so a literal backtick in a pattern pairs with the next one and
      swallows everything between, file operands included. The deny names the fixes: `$(...)`
      for a substitution, single quotes for a literal backtick.
    - **A target holding two or more slots is a GNU make jobserver.** `make`, cargo, and
      other clients of the protocol it runs share the target's slots instead of
      choosing a width of their own. A target that declares no `slots` is unchanged.
    - **A first SIGTERM drains the broker, bounded by `shutdown_grace`.** It turns new claims
      and services away, naming itself, and exits once its holders finish or the grace
      (default 5m, `MAGUS_SHUTDOWN_GRACE`) passes; `broker status` shows it draining. The
      server cancels its runs and waits the same grace. A second SIGTERM, or SIGINT to the
      broker, exits now.
    - **`broker: required | best-effort | off` decides what a run does without a broker.**
      `required` refuses a step (MGS3022, exit 69), `best-effort` (the default) runs
      unarbitrated and says so once, and `off` never starts or contacts one. Also
      `--broker` and `MAGUS_BROKER`; Go callers pass `magus.WithBroker` or
      `magus.WithBrokerPolicy`.
    - **The broker can run under systemd or launchd.** `magus broker units` prints the units;
      magus never installs them. Under systemd the broker serves the socket the supervisor
      hands over and refuses a malformed one or one bound anywhere but `broker.sock`.
      `magus broker --idle-exit 0` keeps it up for a supervisor.
    - **`merge` host module.** `merge\shallow` replaces one level of an object.
      `merge\deep` recurses into objects and lets the overlay replace arrays and
      other values. `merge\json` is that deep merge for two JSON texts, so an
      integer past 2^53 keeps the digits that were in the text.
    - **`magus buzz --record` keeps a script's output and prints a ref to cite.** A quick
      probe run with `--record` lands in the same output store as a target run, so `magus
      query output <ref>` reopens it on any machine sharing the cache. A plan, review comment
      or job's notes can cite the run instead of asserting what it showed.
    - **BZZ1008: a redundant import alias is refused in magusfiles and embedded Buzz.**
      `import "path" as alias;` errors when `alias` repeats the default binding, for
      `spells/`, `project/`, `magus/spell/<name>` and `buzz:` imports; a file import's
      alias isolates it, so it is exempt, as is `as _`. The root magusfile and built-in
      harness spells dropped their redundant `as codex`, `as cursor`, `as opencode`.
    - **The cache refuses an entry whose hashed inputs moved while the target ran.** The run
      stays green; only the entry is skipped, locally and remotely.
    - **The cache is two tiers under standard two-tier semantics.** Reads go local, then
      remote; a remote hit is verified and promoted into the local tier; a build is stored in
      both, each under its own gate. `cache.remote.write.enabled` gates the remote tier:
      unset, it is written when a signing key is held; `true` makes remote writes required.
    - **A job's check can name a script.** `"check": {"script": "probes/key.buzz"}` on a job
      or a check goal is satisfied by a passing `magus buzz --record probes/key.buzz` run, so a
      fact no target checks can still close a job with evidence anyone can reopen.
    - **`types.CheckoutReporter`**, a VCS driver capability that lists a
      repository's registered checkouts with their revision and lock, and names the
      revisions no remote-tracking ref or base reaches. git implements it.
    - **`magus queue gate` runs a command in the box `queue validate` gives a candidate.** It
      checks HEAD out with a private home and temporary directory under the hook sandbox.
      `--cache` keeps the local tier outside the box; `--env` passes named variables to the
      command's own magus. CI's shards now gate through it.
    - **Claude Code MCP tool calls reach the guard.** A `mcp__magus__.*` `PreToolUse` entry
      forwards the call envelope. No rule judges MCP calls yet.
    - **`magus\clean` removes declared outputs.** Arguments are `magus clean`'s. The result is `{removed, tracked, dryRun}`, and `magus clean -o json` prints the same report with the key spelled `dry_run`.
    - **A command rule sees where a line runs and which binary judges it.** The request
      carries `dir` and `workspace`, each command its `path` when the line names the program
      by one, and `magus\guard.binary()` returns the hook binary's `path` and the `stamp` its
      build linked in.
    - **`concurrency_profile` sets build width relative to the machine.** `conservative` (half
      the cores), `balanced` (`min(cores, 8)`, the default) or `aggressive` (every core), also as
      `--concurrency-profile` and `MAGUS_CONCURRENCY_PROFILE`. An explicit `concurrency`
      overrides it.
    - **The console draws a dependency graph from a link.** `graph/#figure=<base64url JSON>`
      opens the Graph's Figures mode on the graph the link carries, drawn in the page with
      `magus/figure`. The fragment never reaches a server, so the hosted console needs none. A
      malformed link shows an inline notice naming the problem.
    - **The console has a Tools app.** It lists every binary the workspace's spells drive with its
      version, pin, release line, end of life and support, sortable, and filters to the tools past
      end of life, unannounced or unpinned. It opens from the launcher or `/console/tools/`. The
      Dashboard's Toolchain tile is now a count of those and opens the app.
    - **`ctx.narrowed()` tells a target body a sized gate narrowed its tests.** A check
      over the whole suite, such as a coverage floor, can stand down when only the packages
      a change reaches ran.
    - **Declared globs take `!` exclusions.** `ctx.writesFiles("gen/*.go", "!gen/runtime.go")`
      declares every generated file but the hand-maintained one; `ctx.readsFiles`,
      `ctx.modifiesExistingFiles`, `sources` and `outputs` take them too. An exclusion
      narrows only its own call. The cache, `magus clean` and `magus describe file` never
      treat an excluded file as an output. A call of only exclusions is refused; write a
      literal leading `!` as `\!`.
    - **`magus run --stdin` runs a saved `affected --plan`; `--shard <id>` runs one shard.**
      The plan now carries a `target` key. A malformed plan, an unknown shard, another target
      or a disagreeing `--n-shards` exits 2 (MGS3029). Under `--dry-run` it runs nothing and
      renders the plan through `-o`. Without `--stdin`, `--shard` stays a label.
    - **`magus describe spell` carries each spell's language record.** `-o json` adds
      `extensions` and `syntax` (comments and stubs); the text output adds a one-line
      `syntax:` summary.
    - **`DiffSymbol.publicThrough` names the public callers a changed symbol reaches.** Each is
      a caller referenced across a package or project boundary, with the callers between, read
      from any SCIP index that records calls.
    - **The doc-section advisory carries the reader's own query** instead of a `<terms>`
      placeholder.
    - **Each spell's install op is named binary + capability, one per binary.**
      typescript's `pnpm-install` and `npm-ci`, go's `go-mod-download`, python's
      `uv-sync`, rust's `cargo-fetch`. A project composes the one it needs into its
      own top-level `install` target, which `build`/`test`/`lint` need; `:update`
      rewrites the lockfile as before. An unchanged install replays without forking
      the package manager. macOS seeds `node_modules` from a sibling checkout.
    - **Every host delivers `advise` verdicts; three rehydrate after compaction.** Codex
      receives advisories and wires `SessionStart` on `compact`, Cursor's write guard moves to
      `preToolUse`, and OpenCode joins advisories by `callID`. Guard template v12: re-copy
