version: v0.5.0-rc.2
date: "2026-10-05"
notes:
    added:
        - |-
          **The advice action flags a moved script a trusted job runs.** The new
          `trusted-script-moved` advisor comments when a pull request renames or removes a file
          that a workflow job runs after checking out the default branch, and says whether the
          job breaks on the pull request or after the merge.
        - |-
          **`magus affected ci` sizes its gate to the change.** Every changed file gets a tier
          (trivial, mechanical, scoped, full) with its evidence. Below full the gate runs only
          the drift check and lint, the targets that declare a changed doc, or `test` with
          `go-test` narrowed through `go list`. A trivial change exits 0.
          `--no-redundancy-check` runs the full gate.
        - |-
          **Three hack/dev scripts for handing work to a worker.** `bootstrap-worktree` builds
          `./magus` and the graph in a fresh worktree, takes a job's lease, and refuses unless the
          row names that worktree and checkpoint. `render-brief` renders a brief from the job row.
          `check-guard-blocks` replays calls the guard should stop through every agent host's
          hooks and fails if one got through.
        - |-
          **`AncestryReporter` answers whether one revision reaches another.** All four backends
          implement `IsAncestor`.
        - |-
          **A wait names each path that kept an approval from carrying.** It also says when the
          approved commit is no longer reachable. Another build tool answers the `classify_edit`
          fact through `--facts`.
        - |-
          **An approval carries over a push the classifier finds safe.** When approvals sit at an
          older commit, the merge queue replays the approved diff onto the head's base and
          classifies each path the head changes beyond it: `rebase`, `generated`, `prose`,
          `comment-only` or `code`. The approval carries when `queue.carry_approvals` in
          `magus.yaml` allows every tier (default: all but `code`).
        - |-
          **The agent guard refuses a backtick command substitution.** Inside double quotes a
          backtick runs a command, so a literal backtick in a pattern pairs with the next one and
          swallows everything between, file operands included. The deny names the fixes: `$(...)`
          for a substitution, single quotes for a literal backtick.
        - |-
          **A target holding two or more slots is a GNU make jobserver.** `make`, cargo, and
          other clients of the protocol it runs share the target's slots instead of
          choosing a width of their own. A target that declares no `slots` is unchanged.
        - |-
          **A first SIGTERM drains the broker, bounded by `shutdown_grace`.** It turns new claims
          and services away, naming itself, and exits once its holders finish or the grace
          (default 5m, `MAGUS_SHUTDOWN_GRACE`) passes; `broker status` shows it draining. The
          server cancels its runs and waits the same grace. A second SIGTERM, or SIGINT to the
          broker, exits now.
        - |-
          **`broker: required | best-effort | off` decides what a run does without a broker.**
          `required` refuses a step (MGS3022, exit 69), `best-effort` (the default) runs
          unarbitrated and says so once, and `off` never starts or contacts one. Also
          `--broker` and `MAGUS_BROKER`; Go callers pass `magus.WithBroker` or
          `magus.WithBrokerPolicy`.
        - |-
          **The broker can run under systemd or launchd.** `magus broker units` prints the units;
          magus never installs them. Under systemd the broker serves the socket the supervisor
          hands over and refuses a malformed one or one bound anywhere but `broker.sock`.
          `magus broker --idle-exit 0` keeps it up for a supervisor.
        - |-
          **`merge` host module.** `merge\shallow` replaces one level of an object.
          `merge\deep` recurses into objects and lets the overlay replace arrays and
          other values. `merge\json` is that deep merge for two JSON texts, so an
          integer past 2^53 keeps the digits that were in the text.
        - |-
          **`magus buzz --record` keeps a script's output and prints a ref to cite.** A quick
          probe run with `--record` lands in the same output store as a target run, so `magus
          query output <ref>` reopens it on any machine sharing the cache. A plan, review comment
          or job's notes can cite the run instead of asserting what it showed.
        - |-
          **BZZ1008: a redundant import alias is refused in magusfiles and embedded Buzz.**
          `import "path" as alias;` errors when `alias` repeats the default binding, for
          `spells/`, `project/`, `magus/spell/<name>` and `buzz:` imports; a file import's
          alias isolates it, so it is exempt, as is `as _`. The root magusfile and built-in
          harness spells dropped their redundant `as codex`, `as cursor`, `as opencode`.
        - |-
          **The cache refuses an entry whose hashed inputs moved while the target ran.** The run
          stays green; only the entry is skipped, locally and remotely.
        - |-
          **The cache is two tiers under standard two-tier semantics.** Reads go local, then
          remote; a remote hit is verified and promoted into the local tier; a build is stored in
          both, each under its own gate. `cache.remote.write.enabled` gates the remote tier:
          unset, it is written when a signing key is held; `true` makes remote writes required.
        - |-
          **A job's check can name a script.** `"check": {"script": "probes/key.buzz"}` on a job
          or a check goal is satisfied by a passing `magus buzz --record probes/key.buzz` run, so a
          fact no target checks can still close a job with evidence anyone can reopen.
        - |-
          **`types.CheckoutReporter`**, a VCS driver capability that lists a
          repository's registered checkouts with their revision and lock, and names the
          revisions no remote-tracking ref or base reaches. git implements it.
        - |-
          **`magus queue gate` runs a command in the box `queue validate` gives a candidate.** It
          checks HEAD out with a private home and temporary directory under the hook sandbox.
          `--cache` keeps the local tier outside the box; `--env` passes named variables to the
          command's own magus. CI's shards now gate through it.
        - |-
          **Claude Code MCP tool calls reach the guard.** A `mcp__magus__.*` `PreToolUse` entry
          forwards the call envelope. No rule judges MCP calls yet.
        - '**`magus\clean` removes declared outputs.** Arguments are `magus clean`''s. The result is `{removed, tracked, dryRun}`, and `magus clean -o json` prints the same report with the key spelled `dry_run`.'
        - |-
          **A command rule sees where a line runs and which binary judges it.** The request
          carries `dir` and `workspace`, each command its `path` when the line names the program
          by one, and `magus\guard.binary()` returns the hook binary's `path` and the `stamp` its
          build linked in.
        - |-
          **`concurrency_profile` sets build width relative to the machine.** `conservative` (half
          the cores), `balanced` (`min(cores, 8)`, the default) or `aggressive` (every core), also as
          `--concurrency-profile` and `MAGUS_CONCURRENCY_PROFILE`. An explicit `concurrency`
          overrides it.
        - |-
          **The console draws a dependency graph from a link.** `graph/#figure=<base64url JSON>`
          opens the Graph's Figures mode on the graph the link carries, drawn in the page with
          `magus/figure`. The fragment never reaches a server, so the hosted console needs none. A
          malformed link shows an inline notice naming the problem.
        - |-
          **The console has a Tools app.** It lists every binary the workspace's spells drive with its
          version, pin, release line, end of life and support, sortable, and filters to the tools past
          end of life, unannounced or unpinned. It opens from the launcher or `/console/tools/`. The
          Dashboard's Toolchain tile is now a count of those and opens the app.
        - |-
          **`ctx.narrowed()` tells a target body a sized gate narrowed its tests.** A check
          over the whole suite, such as a coverage floor, can stand down when only the packages
          a change reaches ran.
        - |-
          **Declared globs take `!` exclusions.** `ctx.writesFiles("gen/*.go", "!gen/runtime.go")`
          declares every generated file but the hand-maintained one; `ctx.readsFiles`,
          `ctx.modifiesExistingFiles`, `sources` and `outputs` take them too. An exclusion
          narrows only its own call. The cache, `magus clean` and `magus describe file` never
          treat an excluded file as an output. A call of only exclusions is refused; write a
          literal leading `!` as `\!`.
        - |-
          **`magus run --stdin` runs a saved `affected --plan`; `--shard <id>` runs one shard.**
          The plan now carries a `target` key. A malformed plan, an unknown shard, another target
          or a disagreeing `--n-shards` exits 2 (MGS3029). Under `--dry-run` it runs nothing and
          renders the plan through `-o`. Without `--stdin`, `--shard` stays a label.
        - |-
          **`magus describe spell` carries each spell's language record.** `-o json` adds
          `extensions` and `syntax` (comments and stubs); the text output adds a one-line
          `syntax:` summary.
        - |-
          **`DiffSymbol.publicThrough` names the public callers a changed symbol reaches.** Each is
          a caller referenced across a package or project boundary, with the callers between, read
          from any SCIP index that records calls.
        - |-
          **The doc-section advisory carries the reader's own query** instead of a `<terms>`
          placeholder.
        - |-
          **Each spell's install op is named binary + capability, one per binary.**
          typescript's `pnpm-install` and `npm-ci`, go's `go-mod-download`, python's
          `uv-sync`, rust's `cargo-fetch`. A project composes the one it needs into its
          own top-level `install` target, which `build`/`test`/`lint` need; `:update`
          rewrites the lockfile as before. An unchanged install replays without forking
          the package manager. macOS seeds `node_modules` from a sibling checkout.
        - |-
          **Every host delivers `advise` verdicts; three rehydrate after compaction.** Codex
          receives advisories and wires `SessionStart` on `compact`, Cursor's write guard moves to
          `preToolUse`, and OpenCode joins advisories by `callID`. Guard template v12: re-copy
          installed copies.
        - |-
          **Every record says which OS account wrote it, and through which entry point.** Trail
          events, session records and job rows carry `user`, `uid` and `entry_point` (`cli`,
          `hook`, `mcp`, `rpc`, `daemon`), read by magus itself. `magus session` gains a USER
          column. A job row's `registered_by` is an `Origin`.
        - |-
          **Every wait and kick-back carries a code.** Verdicts, events and `kick_back` name one of
          a closed set (`WAIT_NOT_APPROVED`, `KICK_CONFLICT`, ...) beside the files at issue, and
          the GitHub provider writes them under its comment for a workflow to read.
        - |-
          **The `extended` charm**, for tests that need more of the host than the gate does.
          A function target reads it with `ctx.hasCharm("extended")`. This repository's cgo
          compression and shell completion tests now run only under it.
        - |-
          **A failing remote tier degrades the run to the local tier.** The first failure is
          reported and counted as failed, never missed, and the run stops asking.
        - |-
          **The agent guard refuses a filter that nothing feeds.** A `grep`, `sed`, `jq`, `head`,
          `tr` or similar with no file operand, no pipe into it and no input redirect reads the
          harness's stdin, which can hang past the tool timeout. Each tool's flags are modeled, and
          a call the guard cannot classify passes.
        - |-
          **A `flags` host module and `magus buzz --check`.** `flags\parse` returns
          `{values, positionals, unknown}`. `--check` parses and type-checks without running; add
          `--embedded` for magusfile code.
        - |-
          **`flags\parse` reads repeated flags and commands.** Flags named in `repeated` collect
          every value in order into `lists` (`--env A --env B`). With `command` set, the first
          bare word starts a command that keeps its own flags, the way sudo and Go's flag package
          read argv. `on-linux` and `on-actions` now parse with it.
        - |-
          **`flags\parse` takes a `required` list.** A required flag that is absent or given an
          empty value raises, so a workflow passing an unset variable (`--issue "$ISSUE"`) fails
          instead of reading as a choice to skip the step.
        - |-
          **`magus job fork` refuses an unordered share of one file across checkouts.** When
          another live job in a different checkout holds the same diffable file and no parent,
          child or `depends_on` chain orders them, the fork is refused (MGS3032) naming the
          holder; an untaken row is left alone. A worker may narrow a whole-file write path to
          one declaration.
        - |-
          **Generated bytes reach a branch only from the base's own regeneration.** Apply runs it
          where the build tool proves a change touches none of the generator's code, and kicks the
          change back otherwise. Generated means a declared output, and a review covers a merge of
          the base only when that regeneration reproduces it.
        - |-
          **Git hooks written in Buzz, kept under version control.** `spells/git/hooks.buzz`
          installs a shim for each `<hook>.buzz` in a directory you name, honoring
          `core.hooksPath` and linked worktrees; `remove` deletes only its own. It writes only
          under `rw`, and a hook it did not write is an error.
        - |-
          **The go spell's `govulncheck` op captures its output and defaults `./...`.** Explicit
          args replace the default, so `{"args": ["-format", "json", "./..."]}` returns the
          JSON stream in `stdout`.
        - |-
          **File nodes carry `lines` and `bytes`.** Buzz sources and the files a SCIP index
          defines symbols in are sized from the read that already indexes them, so `magus explain
          file:<path>` says how long a file is. `explain` on a `file:` or `dir:` ID now loads the
          symbol shards. Knowledge-graph schema v15.
        - |-
          **The knowledge graph counts the precedents a workspace already follows.** Import
          direction between top-level directories, per-directory import fan-out, error value names
          and test package names, each with the cases that follow and depart from it. Nothing reads
          the counts yet; they are the ground a later advisor measures a change against.
        - |-
          **`magus refs <symbol> --definition` prints where a body starts and ends.** Each
          definition reads as `path:start-end`, checked against the file: `verified` when it
          predates its index, `changed` (exit 1) when the name left the start line. `--source`
          adds the lines. A missing end line is said, never guessed.
        - |-
          **The guard advises on reads outside the session's focus.** Focus is the working
          project, its dependencies and nested projects. Under a bound lease it denies, and the job
          row's `read_paths` grants reads without writes. `magus describe file` reports `focus`.
        - |-
          **The guard advises on a split `magus run` (`split-run`).** One target run on two
          project sets, on one line or in two calls within ten minutes, gets the combined form,
          once per session. A charm is part of the target, so `lint` and `lint:rw` never combine.
        - |-
          **Guard requests carry the caller's subagent id.** `CommandRequest`, `WriteRequest`
          and `SpawnRequest` gain `agent`, the id the host's hook payload names a subagent by,
          empty for the session's main agent. A policy can now tell a subagent from the main
          agent even when magus never saw it spawned and it holds no lease.
        - |-
          **The guard refuses a spawn brief that teaches a denied command (`brief-command`).** Each
          fenced shell block and inline code span in an Agent or SendMessage brief is graded like a
          shell line; a line naming a command to forbid it is passed over.
        - |-
          **The agent guard refuses magus wrapped in `timeout` or `gtimeout`.** A `run` or
          `affected` is served the same command with `--timeout` and the wrapper's duration
          (`timeout 600` becomes `--timeout 10m`); any other verb is served bare. `magus buzz`
          is advised instead. A QUIT or ABRT signal and a verb that runs until interrupted pass.
        - |-
          **The guard denies a line that ends by printing an exit status (`exit-status-echo`).**
          `cmd; echo "rc=$?"`, `printf` forms, `rc=$?; echo $rc`, `cmd || echo "failed $?"` and an
          echoed `${PIPESTATUS[...]}` are refused: the echo exits 0, masking the failure. `exit $?`,
          `[ $? -ne 0 ]`, `&&` chains and redirected echoes pass.
        - |-
          **The agent guard refuses a leased or agent-attributed write that sets `vcs.enabled:
          false` in a magus.yaml tier this workspace reads.** Disabling VCS drops the guard's
          approval authority (HEAD of whatever VCS resolves) entirely, so no Buzz policy edit
          after that write is checked against an approved copy. Every other edit passes.
        - |-
          **The guard denies a retired or misspelled MAGUS_* variable (`unknown-env`).** A
          `NAME=value` prefix, `env NAME=value`, `env -u NAME` or `export` of a name magus's own
          startup would refuse (MGS1046) is denied with the same message, naming the replacement
          or the closest real name.
        - |-
          **`search-translation` denies a search a graph query provably answers.** A pattern
          matching only MGS codes, every Markdown heading searched, or only magusfile target
          declarations is checked against the graph's ids and names the exact query. The guard
          reads those ids from `guard.idx`, written by `magus graph build`, within 150 ms.
        - |-
          **`hack/lint/run.buzz` lints named files or one rule.** `-- <path>...` reports only the
          findings at those files, from the rules that read them; a path no rule reads is not an
          error. `-- --rule <name>` runs one rule and refuses an unknown name, listing the rules.
          A bare run still lints the whole tree.
        - |-
          **Every hack script reads its argv with `flags\parse`.** A lint rule reports a script in
          a hack script directory that declares `main` without importing `flags`, so a repeated
          flag, a missing or empty value and `--` mean the same thing in every script.
        - |-
          **`magus ls jobs` lists the changes in flight.** Each open change on the queue's base
          is joined to the jobs whose checkout is on its branch and to the queue's plan, and
          says whose turn it is. Yours come first; `--all` lists everyone's. `magus queue ls` keeps what it read, so this never fetches.
        - |-
          **Only the orchestrator widens a job through `magus job apply`.** A holder may apply
          only the release of its own paths. A path dropped from a taken job is recorded as a
          revoked release with its digest, and the holder's next write there is refused naming the
          revocation. A refusal never serves a widening command.
        - |-
          **A write path can claim one declaration of a file.** `run.go#executeStages` lets two
          jobs start on one file: claims on different declarations do not overlap, `magus ls jobs`
          lists the pair as `claims: disjoint`, and dropping a claim releases that declaration's
          own lines. `magus job fork` refuses a claim nothing can grade (MGS3031).
        - |-
          **The agent guard refuses an edit into another job's claimed declaration.** When the
          hook payload carries the replacement, the guard applies it in memory and places the
          changed lines as the job footprint does; `claimed-declaration` denies a leased edit
          landing in a declaration another live job claims. A whole-file write stays graded by path.
        - |-
          **A jobs guide for people at a terminal.** `docs/guides/jobs.md` follows one person
          across two worktrees, two teammates sharing a file, and CI grading merged work with
          `magus job wait --integration`; `docs/guides/jobs/other-work.md` splits a dependency
          upgrade, a translation and a release checklist. Every transcript is compared byte for
          byte against a `job_people_*` script.
        - |-
          **`magus job apply -f <file|->` upserts jobs' specs, the way `kubectl apply` does.** The
          record is the whole spec; the job keeps its state, holder and registration. `-f -` reads
          stdin: one record, an array, or one per line, all checked before any is written. A new
          id creates the job. `--dry-run` prints the spec diff.
        - |-
          **Diff drivers in the managed `.gitattributes` block**, with funcname patterns for
          TypeScript and Buzz. `magus doctor` reports a missing one.
        - |-
          **A job's footprint.** `magus job wait` names the declaration each changed line lands
          in, found with git's own funcname patterns and measured from the merge base, and
          `magus ls jobs` compares footprints when it reports overlapping write paths. Lines
          above a file's first declaration land in its `(preamble)`.
        - |-
          **`magus job prune` ends every job nobody is working.** Exited and never collected,
          overdue, orphaned, or never taken past `jobs.stale_after`: each ends as `no_return`
          and prints with its reason, then the count. A job its holder touched within
          `jobs.stale_after` is never ended; `--all` also ends one idle that long.
        - |-
          **Job rows and results carry `schema_version`.** An unknown version is rejected by name
          rather than field by field. Rows record `registered_by`.
        - |-
          **`magus job wait --integration` grades a job's check goals in another tree.** The
          `--stdin` result names runs recorded in the caller's checkout, such as a merged
          integration tree. The grade is recorded as the job's `integration`, beside its state,
          which does not move, and an ended job is graded too.
        - |-
          **`magus job wait` grades a job's footprint against its declaration claims.** For a
          file the job claims only by declaration, each declaration its diff touched that no claim
          names is a violation. A doc comment now belongs to the declaration below it, and a Go
          `var`, `const` or `type` is a declaration of its own.
        - |-
          **Enter a live job's path instead of spawning a worker for one small change.**
          `magus job fork --stdin` with `enter`, or `magus\job.put` with `enter`, records
          the entry. Once the holder has idled a minute, the guard lets one write into that
          path and marks the entry consumed. A job takes two; `describe job` and `job wait`
          list them.
        - |-
          **A lease's declared boundary is enforced.** The guard denies writes outside
          `write_paths` or inside `deny_paths`, any write by a `read_only` row, and `ci` when
          `check` names a narrower target.
        - |-
          **The console's Toolchain tile shows each toolchain's release cycle.** It shows the
          cycle, end-of-life date and support, and says when the provider was offline or
          unreachable.
        - |-
          **The `toolchain-lifecycle` doctor check advises on end-of-life toolchains.** It gives
          advice when an installed version, or a project's `tools` floor, is in a cycle past its
          end of life. It reads the answer `describe tools` stored and never fetches.
        - |-
          **`spells/endoflife-date` is the first lifecycle provider.** It reads
          `https://endoflife.date/api/v1/products/<product>`. It ships as source, not in the
          binary: copy it into your workspace's `spells/` (docs/concepts/providers.md).
        - '**`magus\describe.tool()` returns the `describe tools` report as a typed `ToolReport`.**'
        - |-
          **`magus describe tools` says when each installed toolchain's release cycle ends.** A
          magusfile wires one lifecycle provider with `magus\lifecycle.provider(<spell>)`; the
          spell exports `list_lifecycles` and returns `[Lifecycle]`. Each row gains `lifecycle`,
          `cycle`, `eol` and `support` (`supported`, `eol`, `unannounced`, `unknown`). `-o json`
          carries a `lifecycle` object with its `state`: `live`, `offline`, `unreached` or
          `unwired`. Nothing it answers fails a build.
        - |-
          **`magus affected --plan` prints `affected` and `unbounded_by`.** The merge queue
          partitions by them.
        - |-
          **`magus describe job` derives a holder's terms; `magus job wait` grades the result.**
          Terms add reached projects, output globs, sibling holds and hidden coupling. `wait`
          checks paths, descendants and a passing run of the row's `check`, exiting 1 on a
          rejection and 2 when it cannot answer; `magus job exit --schema` prints the result
          contract.
        - |-
          **`magus diff` brings the symbol index current before it reads it.** Each touched
          project's `scip` target replays or rebuilds; when it cannot (a missing indexer, cache
          writes off), the review carries `MGS7003` in place of conformance findings, and the PR
          section fails its step instead of reading as clean.
        - |-
          **`magus diff` reports where a changed symbol departs from how the workspace declares the
          same kind of thing:** a missed naming pattern, a name a target already has, a rename's
          leftover old name, or reversed parameters. Each is a `Check` on
          `DiffSymbol.checks` stating the workspace's own counts, gated by
          `--conformance-min-cohort` and `--conformance-min-share`.
        - |-
          **`magus\diff` takes `opts.patch`.** A unified diff passed as text is read the way
          `magus diff --patch -` reads one.
        - '**`magus doctor` reports whether a bound lease is enforced** (`bound-lease`).'
        - |-
          **`magus\guard.command` registers a workspace shell-command rule.** One Buzz function
          sees every agent shell command the built-ins pass, as parsed programs, and may deny or
          advise, never lift a built-in deny. It fails open and is held to the committed copy as
          `magus\guard.spawn` is. Both rules now return `GuardVerdict` (was `SpawnVerdict`) and
          share `once`/`count`.
        - |-
          **`magus\guard.spawn` registers a workspace spawn rule.** One Buzz function sees every
          subagent spawn and continuation and may deny or advise, never lift a built-in deny. An
          uncommitted loosening waits for a commit. Policy changes land on the trail as
          `guard_policy`; MGS1045 refuses a bad registration. magus ships no rule.
        - |-
          **`magus\guard.write` registers a workspace file-write rule.** One Buzz function sees
          every file an agent writes through its host's edit tools, with the text the host says
          it writes, on the same strengthen-only, fail-open, committed-copy terms as
          `magus\guard.command`. A command rule judging `git push` also gets the checkout's
          branch and its remotes' branches, read through the VCS driver.
        - |-
          **`magus job fork` declares a job from the terminal.** Flags cover one row
          (`--criteria`, `--write-paths`, `--read-paths`, `--check`, `--model`, `--read-only`);
          `--stdin` takes a full record and `--schema` prints its contract.
        - |-
          **`magus mcp` serves MCP over stdio.** An agent host registers `{"command": "magus", "args": ["mcp"]}`
          and gets every tool for the workspace it launches in, with no daemon and no token. Each call
          carries a `stdio` credential holding `mcp=write`, and every MCP tool call, over either
          transport, is refused below that with MGS9015.
        - '**The magus-multi-agent skill adds a coalescing rule and a typed brief and report.**'
        - |-
          **A `pipe` Buzz module makes `magus buzz <script>` a stage of a magus pipe.** A
          script reads the records of the run before it with `pipe\more`, `pipe\next` and
          `pipe\all`, and `pipe\emit` writes records for the stage after it, so `magus run test .
          | magus buzz failures.buzz` replaces `| grep FAIL`. Its exit status counts like any
          stage's.
        - |-
          **Magus stages in a pipe trade typed records, and projects flow forward.** A run
          whose stdout another magus reads writes its `-o jsonl` records there and its prose
          on stderr, so `magus run format libs/x | magus run lint | magus run test` runs all
          three on libs/x. Named projects still win; an explicit `-o` keeps its format.
        - |-
          **`magus queue describe` prints the `gh` commands that finish setting the queue up.**
          `--app <slug>` adds the steps for the queue's own GitHub App, which `setup-magus`
          turns into a token. magus runs none of it. `apply` refuses a status pinned to another
          integration than its token's (MGS3019).
        - |-
