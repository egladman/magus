        - |-
          **Breaking: magus requires git 2.54 or newer.** Older git fails every git command with
          MGS3005. Before 2.54 a histogram diff could shift its hunks, so `vcs\regions`, job
          footprints and split plans differed from one machine's git to another's. Upgrade git.
        - |-
          **The GitHub-hosted 4-core hard-code is removed.** A larger runner gets its real core
          count. magus reads no environment variable to guess it runs in CI, so the same command
          behaves the same everywhere, and `concurrency_profile` stays `balanced`
          (`min(cores, 8)`) unless something asks otherwise.
        - |-
          **Go-source conventions run in `magus run lint`.** Ten tree-walking tests in
          `conventions_test.go` became golangci-lint analyzers in `libs/conventions`
          (`hostagnostic`, `hostvocab`, `ruletext`, `asciistrings`, `importceiling`,
          `stutter`, `nameoutput`, `testisolation`) plus a `depguard` rule for `types`.
          They report at the offending line and take `//nolint:<name>`.
        - |-
          **`magus refs -o json` carries the index cause.** The answer of `refs`, `refs
          --occurrences` and `refs --definition` holds `index_cause {why, fix}` whenever it reports
          a missing or stale index, the same sentences the text output prints. A name refs cannot
          resolve now prints its record, verdict included, under `-o json`, `-o yaml`, `-o jsonl`
          and `-o template`.
        - |-
          **Graph builds no longer race on the knowledge store.** Every graph build takes one lock
          on the knowledge store. The second names the build it waits on, with its pid and start
          time, then reads the graph that build stored. A project still lacking a current index
          gets a build; a killed build's lock is taken over with a notice.
        - |-
          **Graph reads fold only the session files written since the last read.** The agent
          contacts `@session` overlay counts are cached beside the session store, keyed by each
          invocation file's name, size, modification time and inode. The store is capped at its
          newest 10,000 invocation files, sparing the newest 500 loaded host sessions, and
          schema-1 files age out like any other.
        - |-
          **Graph reads answer from the stored graph when nothing changed.** `query`, `explain`,
          `path` and `refs` no longer reassemble the whole knowledge graph per call. The store
          stamps each shard class's inputs (tree, history head, SCIP indexes, run records,
          coverage profile, session store, ignore rules outside the tree), answers from disk when
          they match, and reassembles only classes whose stamps moved.
        - |-
          **A domain read parses no SCIP index.** A parsed index is reused until its file changes,
          and a symbol read no longer rebuilds the agent session overlay every time the session
          store grows.
        - |-
          **The guard runs an agent's shell commands with stdin at end-of-file.** On Claude Code
          it prefixes an allowed command with `exec </dev/null;`, so a stray stdin reader no
          longer waits forever. A heredoc, pipe or `<` still feeds their command.
          `magus shell --rewrites-input` declares a wiring that can carry the rewrite. Codex and
          Cursor are not rewritten.
        - |-
          **A search for a symbol is refused even when the symbol index is behind the tree.** The
          guard classifies each alternative of a `grep`, `rg` or `git grep` pattern and refuses
          when any is a name the index defines, serving `magus refs` per name and `magus refs
          --text` per literal alternative. Every refusal names what it classified and why.
        - |-
          **The guard denies every channel a bound lease could use to rewrite its row** (`magus
          job exec <other>`, `job wait`, `job fork`, `op=clear`). Reads and `--schema` pass.
        - |-
          **The guard denies process-table polling** (`pgrep`, `pidof`, `ps`). Use `magus status
          --watch`.
        - |-
          **The guard lets git's own help through its destructive-command rules.**
          `git stash --help`, `git worktree remove -h` and `git help stash` print usage
          and pass. The request has to be the whole line with no global option, prefix,
          pipe or flag before the help flag; anything else is judged as work.
        - |-
          **`git ls-files` is checked against the tracked files.** Alone or piped into a search of
          its paths, it is refused with the query when the graph reproduces it, and the refusal
          names any tracked match the graph does not index.
        - |-
          **The guard hook asks version control only about the files its policy load read.** An
          allowed shell command no longer waits on a whole-tree status or on resolving the
          repository root. `magus.ApprovedSpawnRuleAt`, `ApprovedCommandRuleAt` and
          `ApprovedWriteRuleAt` are renamed `LoadApprovedSpawnRule`, `LoadApprovedCommandRule`
          and `LoadApprovedWriteRule`; `ApprovedPolicy.Pending` takes a scope.
        - |-
          **A host's content and file search tools are judged as the `rg` and `find` lines they
          stand for.** The files a search must reach are the languages a spell indexes.
        - |-
          **The guard judges a script by its content.** `bash x.sh`, `python3 x.py` or `./x.sh`,
          and a write of such a file, get the busy-wait, scripted-rewrite, cd, output-pipe,
          output-redirect, capture-filter and unknown-env verdicts the script's lines would get
          typed inline. The refusal says the script was read.
        - |-
          **The guard judges `git worktree remove` instead of refusing every one.** It
          passes a clean, unlocked worktree other than the session's own, with no live
          job taken there and every commit reachable from a remote-tracking ref, the
          base, or a finished job's filed result. Otherwise the refusal names the
