        - |-
          **Breaking for SDK callers: status types name the broker and the server.**
          `types.StatusSnapshot` gains `Broker`, `Server` and `BrokerPolicy` and drops `Machine`
          and `Services`; `types.StatusOutput` drops `Mode` and renames `DaemonVersion` to
          `Version`. The new `broker` package is the client and server, and
          `workspace.WithMachineAdmitter` is gone.
        - |-
          **Breaking: `magus status` reports the broker and the server one fact per row.**
          `-o json` gains `broker`, `server` and `broker_policy`, moves `machine` and
          `services` under `broker`, and drops `pool.mode`; `pool.daemon_version` is
          `pool.version`. `magus version -o json` reports `server` for `daemon`. `magus
          broker status` exits non-zero when none is running.
        - |-
          **Breaking: the daemon is two processes, `magus broker` and `magus server`.** A run
          starts the broker, which holds host capacity and shared services on a unix socket only
          and exits after ten minutes holding nothing. Only `magus server start` starts the
          server, which serves MCP, the console and jobs. `server stop --services` is now
          `broker stop --services`.
        - |-
          **busy-wait says what it proves about a foreign process.** A sleep loop probing
          `kill -0`, the process table, `magus status` or a job row is told it holds a tool slot
          for its whole wait, not that the process will announce its end.
        - |-
          **`magus buzz -C <dir>` changes to that directory before anything else, as `go -C`
          does.** It applies in every mode, so a script path and its imports resolve from
          `<dir>` wherever the command runs; a missing directory is an error naming it. It used
          to aim only the REPL's import resolution.
        - |-
          **Magusfiles and every embedded Buzz session reject `mod.member`.** The dot form on
          an imported module now fails at load the way upstream fails it, `` `fs` is not
          defined ``, and the error names the fix, `fs\writeFile`. An imported spell, project or
          remote spell handle is a value and keeps its dot (`markdown.markdownlint(ctx)`,
          `lint.name`).
        - |-
          **The docs explain how gopherbuzz runs Buzz.** A new page, How gopherbuzz runs Buzz,
          follows a program from the lexer through import resolution, the checker and the
          compiler to the interpreter and the baseline JIT, with a figure for each half. The
          Engines figure now shows the dry evaluator the playground runs and the trampolines both
          hosts install modules through.
        - |-
          **A literal of a type a host declares for type checking only fails to compile.**
          It names the type, instead of failing at run time in whatever branch reaches it.
        - |-
          **`ns\object\member` is rejected, as upstream rejects it.** A namespace object's
          members take a dot: `magus\job.list()`, `magus\secret.read(ref)`. The error names the
          dot form.
        - |-
          **A `magus buzz` script builds the knowledge graph once.** Graph reads such as
          `magus\refs` share one build per script run, as a spell's already did, instead of
          rebuilding the symbol graph on every call.
        - |-
          **Breaking: the magus-buzz-write skill is now magus-buzz-lang, rebuilt around
          examples.** It carries one reference script that checks and runs, a table of the
          mistakes TypeScript, Go and Python habits produce with each diagnostic, every built-in
          `str`, list and map method, and the check-fix-run loop. Its examples no longer call
          `main()` themselves. `magus agent install` prunes the old directory.
        - |-
          **The guard refuses magus runs chained with `&&` or `;`.** It serves the pipe of the
          same stages, which runs overlapping projects in order and exits with the first failure.
          A stage on disjoint projects still runs after an upstream fails. `||`, a later
          `affected` stage and a stage after relinking `./magus` stay advisories.
        - |-
          **The changelog is fragments under `changes/unreleased/` plus the release
          manifests, and the root `CHANGELOG.md` is gone.** One file per entry, so concurrent
          pull requests never edit one shared section; the docs changelog page renders both.
          A malformed fragment or an unknown group fails `pr-changelog`.
        - |-
          **CI asks for the whole machine explicitly.** Every `magus` invocation in this
          repo's own `.github/workflows/*.yaml` that runs a build, test, lint, or generate
          target now passes `--concurrency-profile aggressive` on the command line, the same
          flag any other caller would use - not an environment variable read by magus itself.
        - |-
          **A step claims the memory it has been measured to use.** Machine admission claims the
          smaller of a target's `memory_mb` and 1.25 times its highest measured peak over at least
          three successful runs, so a declaration sized for the worst case no longer refuses peers
          that would fit. `magus status` and MGS3009 say whether a figure is declared or measured.
        - |-
          **Claude Code, Codex and OpenCode harnesses are Buzz spells** under `spells/harness/`,
          wired with `magus\harness.provider`. Adapt one by forking it and changing the import
          path.
        - |-
          **The Claude Code harness guards its Grep and Glob tools.** `magus describe harness
          claude-code` now wires a `Grep|Glob` PreToolUse entry, so a host search is judged as
          the `rg` or `find` line it stands for. Run the printed merge command to pick it up.
        - |-
          **Claude Code hooks are plain `magus buzz` commands run from the session root.** Each
          printed entry runs `magus buzz -C "$CLAUDE_PROJECT_DIR"` on its shipped template, with
          no shell around it; PATH's magus re-execs into that root's `./magus` when it has one.
          The new `magus-session.buzz` puts the root first on the session's PATH.
        - |-
          **The console's Diagrams app is now the Graph's Figures mode.** Open it from the
          Graph's Figures button or `/console/diagrams/`, which the server now serves. The
          Shortcuts app's id is `shortcuts`: `console.open.shortcuts` and `?app=shortcuts`
