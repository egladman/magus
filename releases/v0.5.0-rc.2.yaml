      or the declaration's own lines when the index cannot vouch for the name.
    - **A shard plan in a pipe waits for the magus stages before it.** `magus affected
      generate --no-default-charms | magus affected ci --plan` prints the plan only once
      generate has passed, and nothing (MGS3030) when it failed, so no shard starts from a
      drifted tree. `magus run --stdin` reading a plan refuses the same way.
    - **`magus refs <symbol> --rename <new>` renames a symbol at every verified site.**
      Every file is graded under the acting lease before any is written, and every file is
      written or none is. An ambiguous name, a stale index, an unverified site, a declared
      output or a guard deny refuses the whole rename. `--dry-run` prints the sites.
    - **Results carry structured `next` suggestions.** `query`, `explain`, `describe file`,
      affected listings and failing results carry up to three `{id, command, argv, why}`
      entries, filtered by the acting lease's role and journaled per session.
    - **`hack/dev/show-review-context.buzz` gives a reviewer per-symbol context.** For each touched
      symbol it prints the signature, exposure and path to the API, callers, callees, tests,
      cited diagnostics and notes, plus the projects, owners and vocabulary the change moves.
      Each section reads found, absent or unknown. It reads `--rev`, `--patch` or `--from`, and
      prints markdown or `-o json`.
    - **A run held back by its width suggests `concurrency_profile: aggressive`.** It fires
      once per session, only after 15s or more queued for slots with cores idle. It stays
      silent under an explicit `concurrency`, an already aggressive profile, or a wait on the
      machine budget. Uptake is counted by `magus session hints` as `concurrency-profile`.
    - **A run that may write the remote tier backfills it.** A local hit whose key the remote
      tier lacks is uploaded in the background, after a `has_artifact` lookup; the cache
      contract gains that optional function.
    - **`next` can carry workspace scripts.** A script the index lists for a situation is
      served as `magus buzz <path> -- <args>` with id `script-<name>`, its `{ref}`, `{rule}`
      and `{project}` filled in or the script withheld. A script declared read reaches
      reviewers and workers; a write script never does.
    - **MGS4010 names a target that can never be cached.** Its key reads a file its own run
      generates after the key is taken, so every run succeeds and none is stored. The notice
      names the files and says to generate them before the key.
    - **`magus\trail` reads what the guard did in a session.** `magus\trail.read` returns one
      session's guard record from every checkout's trail: each call with its verdict, rule,
      served nexts and command shape, plus its subagents. `.shape` and `.shapes` normalize a
      shell line so calls differing only in paths and literals read alike. `.mark` and
      `.marks` keep a person's verdicts on report rows.
    - **Loaded sessions carry the model and host version.** `AgentEvent` and `Summary` gain
      one `agent` value (`model`, `host_version`) on the wire and in `-o json`. Adapters that
      cannot read them declare `none` rather than guess, and the coverage line moves to
      schema=2.
    - **Signed spell caches.** A spell's sandbox declaration names which locations
      are caches, e.g. the go spell's `GOCACHE`/`GOMODCACHE`. `magus config cache
      export --remote` signs each spell's caches into the remote tier, keeping only
      the entries a run used; `import --remote` restores the newest bundle that
      verifies against the trust set. An unverified bundle is refused.
    - **`magus queue gate --cache` keeps the spells' caches beside the local tier**, each in
      the mode its spell grants it, so a restore and a save in boxes of the same `--cache`
      reach what the gate built with. `validate` keeps them in the candidate's box.
    - **A spawn rule sees its continue target's facts and the job store.** `target` carries
      the spawn's `description`, `model` and last observed `contextTokens`;
      `magus\job.list()` reads the guard's rows. A spawn titled `<parent>/<role> <job>`
      grades the child under that job's lease and records its base.
    - **`magus spell ls magus/spell` lists every spell magus ships.** Each is pinned to the
      digest a release publishes, with no network.
    - **`magus spell push magus/spell/<name> <ref>` pushes a spell magus ships.** The spell
      is packed from the binary.
    - **Every spell magus ships is published with each release.** Each gets one repository
      under `ghcr.io/egladman/magus/spells`, tagged with the release version. Harness and
      provider spells now ship in the binary as source only, named by their directory
      (`harness/cursor`, `github/actions`). The digest `magus spell pull magus/spell/<name>`
      stamps on a copy is the one published.
    - **`magus spell pull magus/spell/<name> <dir>` copies out a spell magus ships.** It
      writes the spell's published files from the binary with no network, stamps
      `spell.buzz` with the artifact's pinned reference, and prints the `magus.yaml` override
      to add. The new `spell-overrides` doctor check advises when the built-in has changed
      since the copy was pulled.
    - **Spells can be imported from a registry by path.** `import "ghcr.io/team/spells/lint";`
      is declared with a tag in `magus.yaml` and pinned in `magus.lock`; only the `update`
      charm, through `magus spell lock --update`, resolves a tag. A `path:` entry replaces an
      embedded or remote spell. MGS1041 through MGS1044 cover undeclared, stale, mismatched
      and invalid. `magus spell build|push|pull|ls` publish.
    - **A function needed a layer early is pulled down or stubbed.** It is pulled down when it
      fits, else stubbed from its spell's stub body with its header kept byte for byte; a
      symbol neither can supply marks the layer `needs-stub`.
    - **`vcs\regions` gives a script the declarations a change lands in.** One record per
      declaration each hunk touches, with its side, lines and the diff driver that named it: the
      footprint `magus job wait` prints, from the same implementation.
    - **`hack/dev/split-into-branches.buzz --by symbols` splits a change by declaration.**
      Each layer lands after every changed declaration it references: a rename rides with its
      callers, a test with its code, generated output with its source. Layers pack up to
      `--budget` changed lines (default 400), each with the command that proves it builds and
      passes. `-o json` is the branch stack merge-job-branches reads.
    - **`magus\service.acquire(spell, op:)` holds a shared service from a `magus buzz`
      script.** It returns a `ServiceLease` saying whether magus owns the service, routes
      through the broker as a target's does, and every lease is released when the script
      ends. `hack/remote/on-linux.buzz` holds the podman machine this way instead of refusing a
      stopped one.
    - **A service can outlive the command that starts it.** A `Service` declares `start`
      instead of `command` for a VM or a system unit, with `readiness` and `stop` required.
      One already passing its readiness probe is adopted and never stopped; one magus starts
      is stopped at idle and recorded for the crash reaper. The podman spell gains a
      `machine` op.
    - **`magus status --wait | magus run <target>` waits for the build budget.** A run
      refused with MGS3009 still exits at once and names this pipe. `status --wait` sizes the
      run's claim from the pipe and exits once the budget can seat it; on its own it waits
      for a free slot.
    - **A spell declares how its language writes a placeholder body.** The `Language` record
      gains `syntax.stubs`: the SCIP symbol kinds a stub may replace, whether the body is
      brace- or indent-delimited, and a Mustache body template with `Name`, `Qualified`,
      `Kind` and `Branch` holes. The go, typescript, rust and python spells declare one; an
      unknown style or kind fails to load.
    - **A subagent's shell and edit calls are graded under its job.** `magus shell --agent`
      takes the host's subagent id, and the command and path glue forward it (`HOST_AGENT_PATH`,
      default `agent_id`). Guard templates are at version 17; re-install them.
    - **A `SymbolIndexer` can name other spell tools in `uses`.** Their versions key the
      symbol index, never a build or test (the go spell names `go`). A `uses` entry that is
      not a version-probed tool is a load error.
    - **A target whose inputs have not moved since it failed says so before rerunning.**
      Nothing is skipped (`hint_id: unchanged-failure`).
    - **`testkit.Environ`, `Isolate` and `Main` give a test an environment built from an
      allowlist.** The sandbox's allowlist plus the Go toolchain's settings survive; HOME and
      the XDG base directories move under a temp root; the broker and server are pinned off;
      everything else is dropped. A package names any extra variables in its TestMain.
    - **A text filter over a backgrounded run's capture is denied like a pipe over magus.**
      Use `-o jsonl --tee <file>` for a capture a tool may consume.
    - **A spell's tool names the endoflife.date product it follows.**
      `Tool{lifecycle = "nodejs"}` sits beside the version probe; the go, typescript, python
      and rust spells declare `go`, `nodejs`, `python` and `rust`. It carries no dates; the
      lifecycle provider looks them up by it.
    - **Tools declare `observe` probes; ops declare external effects.** An observation keys
      only the targets that drive the tool (`obs:`). Ops mark `reads-external` or
      `mutates-external`, and MGS1033 fails a cacheable target composing one with neither an
      observation nor `skip_cache`. The docker spell gains `trivy-image`.
    - **The knowledge graph reads every manifest the shipped spells declare.** A
      `package.json`, `pyproject.toml` or `Cargo.toml` contributes `package:npm`,
      `package:python` or `package:cargo` nodes at the versions its lockfile resolves,
      beside the `package:gomod` nodes go.mod already gave. `explain` prints each
      package's documentation URL, derived from manager, name and version and never
      fetched. Workspaces that gain nodes rebuild the `@packages` shard once.
    - **The spell contract has a reference page.** `docs/reference/spell-contract.md` lists
      every `mgs_` function a spell may export with the exact return type magus expects,
      generated from the contract magus loads spells against. MGS1051 names a spell whose
      `mgs_` functions do not match it; magus does not raise it on load yet.
    - **The typescript spell gains `esbuild` and `node-test` ops.** `esbuild` runs the
      project's esbuild with the caller's entry points and flags; the composing target
      declares what it writes. `node-test` runs `node --test` with source maps and
      coverage, printing spec to stdout and writing lcov to the file the caller names
      first (`--test-reporter-destination=<file>`), or `coverage.lcov` when it passes no
      args.
    - **URLs in comments and docs become graph edges.** A URL resolves to a local page,
      heading or file where it can, otherwise to a `link` node (`kind=link`). Nothing is
      fetched. Knowledge-graph schema v14.
    - **VCS capabilities that combine revisions without a working copy.** `TreeReporter`,
      `TreeMerger`, `CommitWriter`, `GeneratedPathReporter`, `CheckoutProvisioner`,
      `RevisionFetcher`, `Pusher` and `Bundler` join `types.VCSDriver`, with `RangeFiles` and
      `RangeCommits` on `RangeReporter`. git implements every one; none runs a hook or signs.
    - **`vcs\ref`, `vcs\changedFiles` and `vcs\base` take an optional `dir`.** Each reads
      the repository holding that directory, with whichever VCS it uses, instead of the one
      holding the cwd. A `dir` that does not exist raises.
    - **`security` tells a change's vulnerabilities from the base's.** Each actionable
      govulncheck or pnpm audit finding is labeled introduced or inherited against the vcs
      base ref. On a pull request an inherited finding prints `[inherited]` and passes. A
      merge queue candidate passes `--inherited=fatal` to fail on inherited findings too;
      the Security scanning guide shows the recipe.
    - **A write that opens an unrelated unit of work draws an advisory** pointing at the
      magus-multi-agent skill.
    - **`yaml\positions` and a typed `Finding`.** `yaml\positions(source)` returns the line and
      column of every value, keyed by JSON pointer, so a Buzz check over `yaml\parse` output
      can point at a line. `import "magus/lint"` brings `Finding`, the record a Buzz lint
      rule returns.

    ### Changed

    - **The advice action links the console instead of posting a Mermaid fence.** The
      blast-radius section links the hosted console, which draws the graph in the browser from
      the link's URL fragment, which is never sent to a server. The new `console-base` input
      points the link at a console of your own.
    - **The agent guard hook no longer loads the workspace.** `magus shell` reads its rules
      from the root magusfile alone, and loads the committed copy only while a file that
      load read is uncommitted. Measured here: about 120ms per call, down from about 1.6s.
    - **Breaking: `magus agent install` prunes the skills the catalog dropped; `--prune` is
      removed.** A stamped skill directory that is no longer shipped is deleted after the
      install writes, and each removal prints on stdout. An unstamped skill is never touched.
      `--dry-run` lists what would go, and `magus agent harness install` prints its removals the
      same way.
    - **The agent surface stops promising a checkpoint restore.** A checkpoint records a
      digest, not the patch; magus-vcs-hygiene covers recovering work.
    - **`aggressive` now claims memory, not just cores.** `balanced` and `conservative`
      still reserve a quarter of memory for everything else on the machine; `aggressive`
      takes every usable megabyte down to a fixed 512 MiB floor for the kernel.
    - **An ambiguous output ref prints a count and three examples.**
    - **An analyzer directory setting that matches no Go files fails the linter load.**
      This covers `providerio`'s `dirs` and the `skip-dirs` of `filenames` and
      `hostagnostic`, so a stale entry can no longer turn a rule off silently.
    - **BREAKING: analyzer settings are renamed.** `nameoutput` `case` is `case-ident`;
      `coldread` `wrapped` is `report-wrapped`; `testlayout` `no-unix-suffix` and
      `no-main-tests` are `report-unix-suffix` and `report-main-tests`.
    - **Every `/api/` error carries a reason code.** Validation, not-found, conflict and
      internal failures answer in the auth refusals' JSON envelope instead of plain text:
      MGS9023 invalid request, MGS9024 not found, MGS9025 state conflict, MGS9026 no
      workspace, MGS9027 internal failure, MGS9028 streaming unsupported, MGS9029 review host
      failed. Statuses are unchanged; an internal failure keeps its cause in the server log.
    - **A `BAGGAGE` lease claim ranks below every record.** `magus shell --lease` no longer
      defaults to it, so the subagent's spawn record and the checkout's `magus job exec`
      binding answer first, for magusfile job writes and attention requests too. Verdicts,
      activity events, target results and attention requests record `lease_from`: `flag`,
      `agent`, `marker`, `env` or `contested`; the console's session lineage shows it.
    - **A fresh checkout bootstraps in one command.** `GOEXPERIMENT=jsonv2 go run -trimpath
      ./cmd/magus run go-build --no-cache .` compiles magus and runs its real `go-build`
      target, so the first `./magus` is built like every later one. `--no-cache` skips the
      magus cache for that target; Go's build cache stays on. Every hint that taught the old
      two-step build names it.
    - **BREAKING: the activity wire's `actor` is a rendered label, and `actors` filters by
      field.** `actor` was a kind (`agent`, `operator`); it is now the origin rendered for a row
      head. An `actors` entry matches one origin field exactly (user, host, agent, credential,
      entry point), never the label. The review-remark telemetry label `human` is now
      `unattributed`.
    - **Breaking for SDK callers: a shared service crosses the broker wire as a
      `broker.ServiceSpec`.** `Client.AcquireService` and `ServiceHost.Acquire` take one
      instead of `spells.Service`, so a spell schema change never changes the protocol;
      `broker.NewServiceSpec` resolves a spell's service to one. A service acquire with no
      command is refused as `malformed`, and `Client.Shutdown` returns once the broker has
      hung up.
    - **Breaking: a retired or misspelled `MAGUS_*` variable stops every command.** Setting
      `MAGUS_NO_WAIT`, a `MAGUS_DAEMON_*` name, or a near miss such as `MAGUS_CACHE_DIRR`
      fails with MGS1046 before any work, naming the fix; `magus shell` denies instead.
      Other unknown names run, and `magus doctor` reports them.
    - **Breaking (Go API): the cache's tiers share one shape.** `cache.WithMutable` is
      `WithLocalWrite`, `WithRemoteStats` is `ContextWithRemoteStats`, `Cache.Remote()` is
      `RemoteNamespace(ns)`, and `RemoteBackend` takes `(namespace, key)`, answers
      `ErrRemoteMiss` and `ErrRemoteExists` instead of `(nil, nil)`, and gains `HasArtifact`.
      `cache.Open` reads no environment.
    - **Breaking (Go API): gopherbuzz's `TargetMemo` is `TargetRuns`.** `NewTargetRuns(done ...)`
      takes the targets already done, and `MarkDone` records more later. `WithTargetRuns` and
      `TargetRunsFromContext` replace the memo spellings.
    - **Breaking (Buzz): `magus\describe` is an object with one typed method per noun.**
      `magus\describe.file`, `.module`, `.spell`, `.charm`, `.target`, `.evaluatedTarget`,
      `.project`, `.evaluatedProject`, `.graph`, `.graphMarkdown`, `.workspace`, `.tool`,
      `.rule`, `.harness` and `.mcpTool` each return the record `magus describe <noun> -o json`
      prints. They replace `magus\describe(args)`, `magus\describeFile`,
      `magus\describeModule`, `magus\projects`, `magus\targets` and `magus\tools`; a noun
      with no method (`job`) is reached through `magus\cmd("describe", [...])`.
    - **Breaking: `magus queue apply` requires `--base`, and `--workflow` with a run
      source.** Verdicts no longer carry `message`, and a provider's `list_artifacts`
      returns the run's origin as `run`; a provider script without it is refused.
    - **Breaking: the GitHub merge queue requires its own GitHub App.** `magus queue describe
      --status-context` and `apply` refuse to run without `--app`, and nothing falls back to
      the job's Actions token: a run or merge that token makes starts no workflow, so the
      queue validated changes and merged none. Register the app with the link `describe`
      prints.
    - **BREAKING: spells declare what their tools need from the sandbox.** The core grants no
      toolchain; each spell's `mgs_getSandbox()` does, and a spell op's child gets only its
      project's spells. Drop Go variables from `sandbox.env.passthrough`: the go spell
      passes them. Grant mise with a `sandbox.allow` entry. A target's new `sandbox` policy
      key takes the same shape.
    - **Breaking (SDK): every `types.VCSDriver` implements every capability.** A backend
      without one returns `*types.VCSUnsupportedError` naming itself and a `VCSCapability`,
      matching `ErrVCSUnsupported` and `errors.ErrUnsupported`. `RemoteURL` takes a remote
      name, `RangeDiffReporter` is `RangeReporter`, and `Bisect` moves to `Bisector`.
    - **Breaking (spells): comment syntax moves under `Language.syntax`.** A spell writes
      `syntax = Syntax{ comments = CommentSyntax{...}, stubs = StubSyntax{...} }` where it
      wrote `comments = CommentSyntax{...}`.
    - **BREAKING: a token holds a grant, and every route names what it needs.** A grant is
      `none`, `read` or `write` per surface (`tokens`, `mcp`, `console`); a valid token below
      a route's need gets 403 MGS9015. No door mints a token wider than its minter's grant.
      Doctor's `mcp-tokens` check is now `tokens`.
    - **BREAKING: tokens carry their class and always expire; older ones are refused.**
      `mgo_` is the operator, `mgs_` a stored token (now in `tokens.d`), `mgl_` a share link,
      which the loopback daemon refuses. Stored tokens live at most 366 days and share links
      24 hours; longer, or `never`, is MGS9018. An old operator file is MGS9016, anything in
      `connectors.d` MGS9017.
    - **Breaking (Go API): `types.Charm` is `types.CharmEntry`,** and the guard's `RuleDoc`,
      the harness plan and the MCP tool catalog records live in `types`.
    - **Breaking: the `daemon` block in `magus.yaml` is now `server`.** Every key moves as is:
      `daemon.enabled`, `daemon.address`, `daemon.idle_ttl`, `daemon.workspaces` and
      `daemon.maintenance.*` become `server.enabled`, `server.address`, `server.idle_ttl`,
      `server.workspaces` and `server.maintenance.*`. The flags follow, `--daemon-*` to
      `--server-*`. A `daemon` key is refused with an error naming its replacement.
    - **Breaking: `MAGUS_DAEMON_*` variables are now `MAGUS_SERVER_*`.** `MAGUS_DAEMON_ENABLED`,
      `MAGUS_DAEMON_ADDRESS`, `MAGUS_DAEMON_IDLE_TTL`, `MAGUS_DAEMON_WORKSPACES` and the
      `MAGUS_DAEMON_MAINTENANCE_*` family keep their suffix under `MAGUS_SERVER_`; setting an
      old name is an error that names the new one. The pool pointer magus exports to its
      children, `MAGUS_DAEMON_SOCKET`, is now `MAGUS_PROC_SOCKET`.
    - **Breaking for SDK callers: `magus.Open` refuses a broker it would never use.**
      `WithBroker` given a nil client, or a client while `WithBrokerPolicy` or the workspace's
      `broker` setting resolves to `off`, is an error from `Open` rather than a client silently
      ignored. Pass one or the other.
    - **Breaking for SDK callers: the daemon names are gone from the Go API.** `magus.Daemon`,
      `SetDaemon` and `ServeDaemon` are `Server`, `SetServer` and `Serve`;
      `types.EntryPointDaemon`, `HolderDaemon` and `DaemonSocketWithheld` are
      `EntryPointServer`, `HolderServer` and `ProcSocketWithheld`; `DaemonRequired` is gone. The
      `internal/daemon` package is `internal/server`.
    - **Breaking: the wire says server where it said daemon.** `Pool.daemon_version` is
      reserved and replaced by `owner_version`; `JOB_HOLDER_DAEMON` is reserved and replaced by
      `JOB_HOLDER_SERVER`; the entry point recorded on an event is `server`, not `daemon`; and
      the doctor check `daemon-version` is `server-version`.
    - **Breaking: `--detach` runs the command in the background itself and needs no server.**
      The run becomes its own session, appends to a log under
      `$XDG_STATE_HOME/magus/detached/` and holds its own broker connection; magus prints its
      pid and log path. The `run.detach` record carries `pid` and `log`. MGS5004 is retired.
    - **SIGHUP no longer stops the server or the broker.** The server reloads its
      configuration, as `magus server reload` does; the broker reopens the file its new
      `--log` flag names, so a log rotator can move it aside. A broker a run starts logs
      through `--log` to `$XDG_STATE_HOME/magus/broker.log`.
    - **Breaking: sockets and logs moved.** `$XDG_RUNTIME_DIR/magus/broker.sock` and
      `server.sock` replace `magus-daemon.sock`, and a detached broker or server logs to
      `$XDG_STATE_HOME/magus/`, which survives logout, instead of beside its socket. The
      detached server runs as `magus server --foreground`.
    - **Breaking for SDK callers: status types name the broker and the server.**
      `types.StatusSnapshot` gains `Broker`, `Server` and `BrokerPolicy` and drops `Machine`
      and `Services`; `types.StatusOutput` drops `Mode` and renames `DaemonVersion` to
      `Version`. The new `broker` package is the client and server, and
      `workspace.WithMachineAdmitter` is gone.
    - **Breaking: `magus status` reports the broker and the server one fact per row.**
      `-o json` gains `broker`, `server` and `broker_policy`, moves `machine` and
      `services` under `broker`, and drops `pool.mode`; `pool.daemon_version` is
      `pool.version`. `magus version -o json` reports `server` for `daemon`. `magus
      broker status` exits non-zero when none is running.
    - **Breaking: the daemon is two processes, `magus broker` and `magus server`.** A run
      starts the broker, which holds host capacity and shared services on a unix socket only
      and exits after ten minutes holding nothing. Only `magus server start` starts the
      server, which serves MCP, the console and jobs. `server stop --services` is now
      `broker stop --services`.
    - **busy-wait says what it proves about a foreign process.** A sleep loop probing
      `kill -0`, the process table, `magus status` or a job row is told it holds a tool slot
      for its whole wait, not that the process will announce its end.
    - **`magus buzz -C <dir>` changes to that directory before anything else, as `go -C`
      does.** It applies in every mode, so a script path and its imports resolve from
      `<dir>` wherever the command runs; a missing directory is an error naming it. It used
      to aim only the REPL's import resolution.
    - **Magusfiles and every embedded Buzz session reject `mod.member`.** The dot form on
      an imported module now fails at load the way upstream fails it, `` `fs` is not
      defined ``, and the error names the fix, `fs\writeFile`. An imported spell, project or
      remote spell handle is a value and keeps its dot (`markdown.markdownlint(ctx)`,
      `lint.name`).
    - **The docs explain how gopherbuzz runs Buzz.** A new page, How gopherbuzz runs Buzz,
      follows a program from the lexer through import resolution, the checker and the
      compiler to the interpreter and the baseline JIT, with a figure for each half. The
      Engines figure now shows the dry evaluator the playground runs and the trampolines both
      hosts install modules through.
    - **A literal of a type a host declares for type checking only fails to compile.**
      It names the type, instead of failing at run time in whatever branch reaches it.
    - **`ns\object\member` is rejected, as upstream rejects it.** A namespace object's
      members take a dot: `magus\job.list()`, `magus\secret.read(ref)`. The error names the
      dot form.
    - **A `magus buzz` script builds the knowledge graph once.** Graph reads such as
      `magus\refs` share one build per script run, as a spell's already did, instead of
      rebuilding the symbol graph on every call.
    - **Breaking: the magus-buzz-write skill is now magus-buzz-lang, rebuilt around
      examples.** It carries one reference script that checks and runs, a table of the
      mistakes TypeScript, Go and Python habits produce with each diagnostic, every built-in
      `str`, list and map method, and the check-fix-run loop. Its examples no longer call
      `main()` themselves. `magus agent install` prunes the old directory.
    - **The guard refuses magus runs chained with `&&` or `;`.** It serves the pipe of the
      same stages, which runs overlapping projects in order and exits with the first failure.
      A stage on disjoint projects still runs after an upstream fails. `||`, a later
      `affected` stage and a stage after relinking `./magus` stay advisories.
    - **The changelog is fragments under `changes/unreleased/` plus the release
      manifests, and the root `CHANGELOG.md` is gone.** One file per entry, so concurrent
      pull requests never edit one shared section; the docs changelog page renders both.
      A malformed fragment or an unknown group fails `pr-changelog`.
    - **CI asks for the whole machine explicitly.** Every `magus` invocation in this
      repo's own `.github/workflows/*.yaml` that runs a build, test, lint, or generate
      target now passes `--concurrency-profile aggressive` on the command line, the same
      flag any other caller would use - not an environment variable read by magus itself.
    - **A step claims the memory it has been measured to use.** Machine admission claims the
      smaller of a target's `memory_mb` and 1.25 times its highest measured peak over at least
      three successful runs, so a declaration sized for the worst case no longer refuses peers
      that would fit. `magus status` and MGS3009 say whether a figure is declared or measured.
    - **Claude Code, Codex and OpenCode harnesses are Buzz spells** under `spells/harness/`,
      wired with `magus\harness.provider`. Adapt one by forking it and changing the import
      path.
    - **The Claude Code harness guards its Grep and Glob tools.** `magus describe harness
      claude-code` now wires a `Grep|Glob` PreToolUse entry, so a host search is judged as
      the `rg` or `find` line it stands for. Run the printed merge command to pick it up.
    - **Claude Code hooks are plain `magus buzz` commands run from the session root.** Each
      printed entry runs `magus buzz -C "$CLAUDE_PROJECT_DIR"` on its shipped template, with
      no shell around it; PATH's magus re-execs into that root's `./magus` when it has one.
      The new `magus-session.buzz` puts the root first on the session's PATH.
    - **The console's Diagrams app is now the Graph's Figures mode.** Open it from the
      Graph's Figures button or `/console/diagrams/`, which the server now serves. The
      Shortcuts app's id is `shortcuts`: `console.open.shortcuts` and `?app=shortcuts`
      replace the `actions` forms, and a saved tab of either old app opens empty.
    - **A console figure link draws each edge the way the SVG does.** A `#figure=` edge may name
      a magus/figure stroke and a label, so a dashed "after" dependency no longer reads like a
      solid spawn in the browser. The link format is now version 2; the console refuses version 1
      links by name.
    - **Console links carry a one-time code, never a token.** `#code=` lives a minute and
      works once; the console trades it at `POST /api/v1/token/exchange` for a 12-hour console
      token. The guard denies agents the commands that mint or revoke tokens
      (`credential-verb`) and the token files (`token-state`). A non-loopback `mcp.address`
      needs `mcp.insecure_bind: true`, and the operator token is refused off loopback.
    - **BREAKING: the in-repo analyzers carry no repository policy.** `hostagnostic`
      takes its host list from `hosts` and `host-patterns`, and six conventions analyzers
      take a `hint` for the repository-specific half of their message.
    - **Compiled guard rules survive a rebuild of the same source.** The bytecode cache is
      keyed on the binary's Go build ID, not its file's mtime and size, so a fresh CI build
      of an unchanged commit reuses the last run's chunks.
    - **Breaking for Buzz callers: `vcs\ref()` returns `str?`.** It is null when no name
      points at the revision: a detached git HEAD, which read as the branch `HEAD`, or jj's
      anonymous working-copy change. Write `vcs\ref() ?? ""` where a string is wanted. It
      still raises when there is no VCS or the backend fails.
    - **Breaking: `crypto\sign`, `crypto\signFile` and `crypto\publicKey` take `key`, not
      `key_env`.** Pass the hex private key read through `magus\secret.read`, so it comes
      from the workspace's secret provider (the environment by default, a keychain where one
      is selected) and stays out of run logs. No error echoes the key.
    - **Cursor's harness guards MCP calls and budgets session start.**
      `beforeMCPExecution` fails closed. `sessionStart` sets `PATH` and `__MAGUS_BIN`,
      then injects `magus session --brief` only below 16 KiB. Every hook has a
      10-second timeout. MCP advice and post-compaction rehydration remain unwired.
    - **`magus session --brief` claims host capacity before it Inspects.** It starts the
      broker (when enabled) and holds a declared `session-brief` seat for the workspace
      load, so a stack of Cursor `sessionStart` hooks cannot outspend the machine the way
      a stack of runs cannot. A full budget refuses with exit 75; the Cursor hook already
      treats a failed brief as env-only.
    - **`magus session --brief` caps live leases it names.** Editing jobs come first;
      at most 12 live leases are printed, with an `and N more: magus ls jobs` line for
      the rest, so a dirty store of exited holders cannot refill a compacted window.
    - **The daemon's guards refuse a request as `google.rpc.Status` JSON in the route's protocol.**
      A Connect service answers Connect's envelope; every other route, `/mcp` included,
      AIP-193's `{"error":{"code","message","status","details"}}`. Both carry the MGS code as a
      `google.rpc.ErrorInfo` reason and a `google.rpc.Help` link. A missing bearer token is now
      MGS9011, split from a rejected one (MGS9001). Host, loopback, share-device and
      console-file refusals gain MGS9007-9010.
    - **A daemon whose workspace fails to load keeps serving and says why.** The console,
      `/mcp` and status stay up; workspace calls answer MGS3016 (`FAILED_PRECONDITION`, one
      `PreconditionFailure` violation per diagnostic), or MGS3017 while reloading.
      `StatusService` reports `Workspace.state` and a `google.rpc.Status` error. A failed
      workspace reloads when a `.buzz` file or `magus.yaml` changes.
    - **`ctx.glob` refuses a pattern list that is only negations.**
      `ctx.glob("!site-generate")` used to select no targets; it now fails the run, like a
      declared glob made only of exclusions.
    - **A declared `timeout` bounds the target's own time.** A body parks while its
      `ctx.needs` dependencies run and gets a fresh deadline per stretch of its own work.
    - **Breaking: `magus queue validate` reads its plan from stdin with `--stdin`; `--plan
      <file>` is gone.** Run `magus queue validate --stdin ... < plan.json`, the same input
      idiom as `affected --stdin` and `run --stdin`. Without `--stdin` validate exits 2.
    - **A deny on a multi-command line says nothing on it ran.**
    - **A guard deny serves its remedy as `next`.** output-pipe, output-redirect, raw-tool,
      stage-all, process-poll, symbol-search and sibling-checkout put the command they
      computed from the refused line in a `next` field (id `deny-<rule>`) and under a
      reason, so running it is pre-authorized and counted. A remedy is graded for
      the acting lease and dropped when that role could not run it.
    - **The diagram routes render each figure once per graph and lens.** A repeat request for an
      unchanged graph is served from a bounded in-process cache, and concurrent requests for the
      same figure share one render. The diagram listing reads the symbol index's manifest to
      report `indexed` instead of loading the symbol shards.
    - **Breaking: `DiffSymbol`'s exposure fields are renamed.** `externalProjects` is
      `publicTo`, `externalFileCount` is `publicFileCount` and `moduleAPI` is
      `publicBeyondWorkspace`, in `magus diff -o json` and in `magus\diff`.
    - **`magus diff` lists only the symbols a change touched.** `DiffFile.symbols` holds the
      symbols whose definition lines the patch changed, each with a `change` read from the patch
      when no `--baseline` decides it. Package and namespace symbols are never listed, so a
      file's `reach` is no longer every importer of its package.
    - **`magus doctor` names a leftover skill directory install cannot prune.** An empty
      directory, or one whose `SKILL.md` cannot be read, is reported as stale with the `rmdir`
      or `rm -r` that removes it. A dropped stamped skill is now fixed by a reinstall, which
      `--fix` runs.
    - **Every Connect procedure and `/api/` route names its own need.** The daemon refuses to
      start on a missing or empty one, and an unloaded daemon holds the same needs. Graph
      reads need `console=read`. TokenService takes a `Grant` and lists each token's class;
      `TokenScope` is gone. A malformed share body is MGS9020, an impossible mint MGS9021.
    - **Every guard deny cites its verdict ref.** A deny's first firing now stores the full
      verdict and prints `full verdict: magus query output grd...` the way a repeat does.
    - **An exited job no longer blocks another fork's write paths.** Its holder returned, so
      the shared-checkout refusal and MGS3032 leave its paths alone.
    - **Breaking: a magus/figure `Figure` is plain data, drawn by `figure\draw(f, theme:)`.**
      `.svg()`, `.title()`, `.eyebrow()`, `.desc()`, `.down()` and `.generated()` are gone:
      `figure\of(id, title:, eyebrow:, desc:, direction:, generated:)` sets them. The Diagrams
      server and the console runtime build a `Figure` and call `draw` without writing Buzz, and
      the playground resolves `import "magus/figure"`.
    - **A `magus/figure` drawing carries an anchor's line only when it links.** `draw` without
      `anchorHref` no longer paints `data-line`, so a committed figure stays byte-identical
      when an edit moves the anchored symbol down its file. Pass `anchorHref` to keep the line.
    - **The redundancy check, CI verdict inheritance and job completion skip only a trivial
      change.** A comment-only edit, and markdown a package embeds or a gate target reads,
      no longer skip the gate. A job's completion gate on `ci` passes on a green `ci` gate
      when the change since it is trivial.
    - **Breaking: magus requires git 2.54 or newer.** Older git fails every git command with
      MGS3005. Before 2.54 a histogram diff could shift its hunks, so `vcs\regions`, job
      footprints and split plans differed from one machine's git to another's. Upgrade git.
    - **The GitHub-hosted 4-core hard-code is removed.** A larger runner gets its real core
      count. magus reads no environment variable to guess it runs in CI, so the same command
      behaves the same everywhere, and `concurrency_profile` stays `balanced`
      (`min(cores, 8)`) unless something asks otherwise.
    - **Go-source conventions run in `magus run lint`.** Ten tree-walking tests in
      `conventions_test.go` became golangci-lint analyzers in `libs/conventions`
      (`hostagnostic`, `hostvocab`, `ruletext`, `asciistrings`, `importceiling`,
      `stutter`, `nameoutput`, `testisolation`) plus a `depguard` rule for `types`.
      They report at the offending line and take `//nolint:<name>`.
    - **`magus refs -o json` carries the index cause.** The answer of `refs`, `refs
      --occurrences` and `refs --definition` holds `index_cause {why, fix}` whenever it reports
      a missing or stale index, the same sentences the text output prints. A name refs cannot
      resolve now prints its record, verdict included, under `-o json`, `-o yaml`, `-o jsonl`
      and `-o template`.
    - **Graph builds no longer race on the knowledge store.** Every graph build takes one lock
      on the knowledge store. The second names the build it waits on, with its pid and start
      time, then reads the graph that build stored. A project still lacking a current index
      gets a build; a killed build's lock is taken over with a notice.
    - **Graph reads fold only the session files written since the last read.** The agent
      contacts `@session` overlay counts are cached beside the session store, keyed by each
      invocation file's name, size, modification time and inode. The store is capped at its
      newest 10,000 invocation files, sparing the newest 500 loaded host sessions, and
      schema-1 files age out like any other.
    - **Graph reads answer from the stored graph when nothing changed.** `query`, `explain`,
      `path` and `refs` no longer reassemble the whole knowledge graph per call. The store
      stamps each shard class's inputs (tree, history head, SCIP indexes, run records,
      coverage profile, session store, ignore rules outside the tree), answers from disk when
      they match, and reassembles only classes whose stamps moved.
    - **A domain read parses no SCIP index.** A parsed index is reused until its file changes,
      and a symbol read no longer rebuilds the agent session overlay every time the session
      store grows.
    - **The guard runs an agent's shell commands with stdin at end-of-file.** On Claude Code
      it prefixes an allowed command with `exec </dev/null;`, so a stray stdin reader no
      longer waits forever. A heredoc, pipe or `<` still feeds their command.
      `magus shell --rewrites-input` declares a wiring that can carry the rewrite. Codex and
      Cursor are not rewritten.
    - **A search for a symbol is refused even when the symbol index is behind the tree.** The
      guard classifies each alternative of a `grep`, `rg` or `git grep` pattern and refuses
      when any is a name the index defines, serving `magus refs` per name and `magus refs
      --text` per literal alternative. Every refusal names what it classified and why.
    - **The guard denies every channel a bound lease could use to rewrite its row** (`magus
      job exec <other>`, `job wait`, `job fork`, `op=clear`). Reads and `--schema` pass.
    - **The guard denies process-table polling** (`pgrep`, `pidof`, `ps`). Use `magus status
      --watch`.
    - **The guard lets git's own help through its destructive-command rules.**
      `git stash --help`, `git worktree remove -h` and `git help stash` print usage
      and pass. The request has to be the whole line with no global option, prefix,
      pipe or flag before the help flag; anything else is judged as work.
    - **`git ls-files` is checked against the tracked files.** Alone or piped into a search of
      its paths, it is refused with the query when the graph reproduces it, and the refusal
      names any tracked match the graph does not index.
    - **The guard hook asks version control only about the files its policy load read.** An
      allowed shell command no longer waits on a whole-tree status or on resolving the
      repository root. `magus.ApprovedSpawnRuleAt`, `ApprovedCommandRuleAt` and
      `ApprovedWriteRuleAt` are renamed `LoadApprovedSpawnRule`, `LoadApprovedCommandRule`
      and `LoadApprovedWriteRule`; `ApprovedPolicy.Pending` takes a scope.
    - **A host's content and file search tools are judged as the `rg` and `find` lines they
      stand for.** The files a search must reach are the languages a spell indexes.
    - **The guard judges a script by its content.** `bash x.sh`, `python3 x.py` or `./x.sh`,
      and a write of such a file, get the busy-wait, scripted-rewrite, cd, output-pipe,
      output-redirect, capture-filter and unknown-env verdicts the script's lines would get
      typed inline. The refusal says the script was read.
    - **The guard judges `git worktree remove` instead of refusing every one.** It
      passes a clean, unlocked worktree other than the session's own, with no live
      job taken there and every commit reachable from a remote-tracking ref, the
      base, or a finished job's filed result. Otherwise the refusal names the
      failed condition; `--force` changes nothing. `jj workspace forget` stays
      refused.
    - **The owned-path lease advisory speaks once per session per lease (`leased-path`).** It
      repeated on every write into a running lease's paths, 52% of all advisories served in one
      audit.
    - **Listings the graph reproduces are refused with the query.** `find`, `fd`, `rg
      --files`, `ls <dir>` and `ls -R <dir>` whose files are all graph file nodes are answered
      by `magus query`, inline, whatever revision the index was built at.
    - **The guard denies pushes, merges, spawns and shared-state writes while its policy cannot
      load.** When neither the working tree nor its approved copy loads, and the policy last
      registered a command or spawn rule, those calls are denied with the rebuild that fixes
      it. Every other call passes with the notice.
    - **A `for` loop that sleeps between passes is a polling loop.** The `busy-wait` rule
      denies `for i in $(seq 1 60); do sleep 10; done`, and a workspace command rule sees
      each program inside such a loop with `repeats` set, as it already did for `while` and
      `until`. A `for` loop over a list with no `sleep` still repeats nothing.
    - **The guard refuses fewer harmless commands.** `2>&1` and a read verb's `2>/dev/null`
      pass, the `cd` rule is gone, and a piped graph read or a filtered run capture is
      advised rather than refused. A recursive grep with no path, `gofmt -l`, a heredoc
      append and a bare listing of the token state directory pass too.
    - **The guard routes unbounded source dumps to `magus refs`.**
    - **Searches that name no indexed symbol still run.** Text, prose, one named file, stdin,
      `.github`, a directory holding no source, and a revision are not refused.
    - **A stale symbol index no longer turns a refused search into advice.** The refusal
      serves `magus graph build --silent` first.
    - **`symbol-search` denies alternations, definition lookups and diagnostic codes.** A
      recursive search whose every alternative (`A\|B`, `-e A -e B`, `func X`, `type X`) is an
      indexed symbol routes to one `magus refs <name> --occurrences` each; a registered MGS code
      routes to `magus explain diagnostic:<code>`.
    - **`hack/dev/host-schemas.buzz` takes steps, not an environment variable.** Run
      `magus buzz hack/dev/host-schemas.buzz -- verify | fetch`. It has no default step: a bare
      run prints the usage line and fails.
    - **hack/gha-queue.buzz is now `hack/ci/merge-queue.buzz`.** hack/ci/ holds the steps
      only a workflow runs.
    - **Refusals name the reference script that does the job.** In a workspace that keeps
      `hack/dev/rename-symbol.buzz` or `hack/dev/example-typed-results.buzz`, the in-place rewrite
      refusals name the first and the output pipe and redirect refusals the second, in one
      line each.
    - **Breaking: a holder's rendered terms carry commands.** `footer` is replaced by
      `bootstrap`, a list of `{run, why}`, and the rules and skills blocks are gone.
    - **Breaking: hook glue names its host on the command (guard template 18).** Each glue
      command carries `--agent-name <host>`, rendered from the harness spell's name.
      `__MAGUS_AGENT_NAME`, the `claude-code` default and Codex detection from `turn_id` are
      gone; a hook with no name is refused (MGS3024). Merge what `magus describe harness`
      prints.
    - **Host errors name the call the way a script writes it.** Errors from `vcs\root`,
      `vcs\cmd`, `os\retry`, `proc\exec`, `magus\raise` and `magus\diff` begin with the
      backslash form instead of `vcs.root:` and the like.
    - **The blast radius member is `magus\impact`.** It returns the report `magus affected --impact` prints. `magus\affected` is the project set.
    - **`install` probes only its own tools and skips dependency order.** A project's install
      no longer waits for its dependencies' installs, and `run install` probes node and pnpm,
      not tsc.
    - **Ctrl+C asks twice only when it would discard work.** A read or a follow stream
      (`events -f`, `status -W`, `watch`) and a run between targets stop on one press. While
      targets execute, the first press names them and how long they have run, and a second
      within three seconds stops them.
    - **`magus job exec` starts a declared job running.** `magus ls jobs` shows `running`
      for a job somebody took, and HOLDER names the worktree it was taken in (`-` until
      somebody takes it, `server` for magus's own jobs) instead of `session` on every row.
      `-o json` keeps `holder` as before.
    - **`magus job exit` ends several jobs in one call.** Without `--stdin` it takes any
      number of job ids and abandons each, trying every one and failing at the end if any
      could not be ended. A filed result still names exactly one job.
    - **Breaking: job goals live in the record's `goals`; the `--gate-*` flags are gone.**
      `completion_gates` is renamed, and `job fork` refuses a writing job with neither
      a check nor a goal. `job wait` grades the diff in the job's own checkout, and
      fails a symbol goal it cannot verify. A record naming no state is stored declared.
    - **magus\job.put holds an update to fork's rules for what it adds.** Added goals and
      write paths now meet the same checks as a fork's (MGS3018, MGS3031, MGS3032).
    - **Declaring an ended job again clears the checkout it was taken in.**
    - **Breaking for SDK callers: `types.RegionReporter` gains `RegionsBetween` and `Drivers`.**
      `RegionsBetween` places the lines two in-memory versions of a file differ in, and
      `Drivers` names each path's diff driver. A backend implementing `types.VCSDriver` adds
      both, or declines with `*types.VCSUnsupportedError`.
    - **A job whose work landed on the base ends by itself.** An exited job's changed paths
      are compared offline at its checkout's HEAD and on the base branch; when all match, it
      ends as `no_return` naming the base commit. A squash of several jobs' branches ends
      each of them.
    - **Breaking: job rows are `schema_version` 11.** A `#` in a write path now claims a
      declaration, which an older magus would match against no file and stop grading, so it
      refuses these rows instead. Records sent to `magus job fork --stdin` and `magus\job.put`
      carry 11. A magus that writes 10, which ends dead jobs, refuses them too.
    - **`magus job exec` refuses a job another checkout holds.** It used to move the job's
      checkout silently, so `job wait` graded the second taker's tree. The refusal names the
      holder's checkout, its state, how long ago it last moved, and how to hand the job over:
      its holder runs `magus job exit`, then its forker runs `magus job apply`.
    - **An older magus reads a job store a newer one wrote.** A newer row no longer locks
      older binaries out of the store: its unknown fields and version survive a rewrite, and
      only a row requiring something this build lacks turns read-only, named in `magus ls
      jobs`. Adding a field no longer bumps the schema version.
    - **The job store refuses a write to another holder's row.** A leased session may record
      its base, shrink its own `write_paths`, end its own row, and fork inside its paths.
      `clear` archives what it drops.
    - **A lease binding whose checkout is gone becomes a tombstone the guard refuses.** The
      read that ends a job whose worktree was removed turns each binding naming it into a
      tombstone. The guard refuses that caller with `lease-undeclared` until `magus job exec`
      binds it again, instead of grading it as the orchestrator. Tombstones expire after
      `jobs.stale_after`.
    - **Each `magus job` verb's help ends with an example.** So do `magus ls jobs -h` and
      `magus describe job -h`.
    - **The job store grades `magus job wait`'s verdict itself.** A leased holder may only pass
      a row below its own lease and change nothing else on it; the store refuses any other
      verdict, not only the command.
    - **Breaking: magus ends dead jobs itself, and job rows are `schema_version` 10.** A
      store read ends a live job as `no_return` when an ancestor ended, its checkout is gone,
      or nobody took it within `jobs.stale_after` (default 2h, `0` never). Older magus
      binaries refuse the store once this one writes it: restart the daemon and rebuild
      `./magus` after upgrading.
    - **A worker may commit in its own checkout.** `lease-vcs` now lets a worker lease commit,
      with any backend, on its own branch in its leased checkout. It still refuses push,
      stash, revert, reset, clean, rebase, merge, cherry-pick, `checkout .`/`restore .`,
      worktree removal, and a commit in another tree, the primary checkout, the base branch or
      a detached HEAD.
    - **The leased-path advisory names whoever holds the path.** It says where the job
      was taken, or that nobody has taken it yet, instead of warning about "a concurrent
      agent".
    - **`MAGUS_OFFLINE` also stops the lifecycle provider.** `describe tools` replays the
      stored answer, or reads `unknown (offline)`.
    - **Repository file conventions run as `lint-rules`.** The checks on lockfiles, workflows,
      magusfiles, hook configs, skill declarations and the landing rotator moved out of a Go
      test into Buzz rules under `hack/lint/`, which the root `lint` target runs. Each
      finding names the file, the line, and the fix.
    - **Breaking: `log.format: jsonl` is refused** from `magus.yaml`, `MAGUS_LOG_FORMAT` and
      `--log-format`. It withheld per-target results with no stream to carry them; `-o jsonl`
      is the one way to select it.
    - **`magus lsp` completes module members after a backslash.** Completion triggers on `\`
      and `/` instead of `.` and `/`.
    - **The language server completes, hovers and signs `fs\glob`.** It read only `fs.glob`,
      the spelling the checker refuses; after a dot it offers nothing, since only a value's
      member follows one.
    - **`magus agent harness install` is refused under a lease from any source.**
      It refuses under the checkout's binding as well as a `BAGGAGE` claim, and the guard
      refuses it for a worker attributed by its spawn or its session.
    - **`magus doctor` checks a freshly built knowledge graph.** `graph-bounds` built nothing
      and passed when `gen/knowledge-graph.json` was absent; it now builds the graph in process
      and fails when the build does. The graph JSON is no longer committed.
    - **`magus doctor`'s `recurring-guard-denials` check reports facts only.** Rule, surface,
      denial count, session count, and followed rate; the retired advice layer's destination
      and confidence labels are gone. A human reads the evidence and decides.
    - **MAGUS.md is formatted with the repo's other Markdown.**
    - **Breaking: `magus` must be imported.** A magusfile, spell or script calling `magus\`
      needs `import "magus";`; without it the load fails with MGS1039, which names the fix.
    - **magus never waits on another magus invocation.** A workspace lock or machine budget
      held by another invocation refuses immediately (exit 75), naming the holder.
      `MAGUS_NO_WAIT` is removed. Invocations in one process (the daemon's) queue for each
      other, as do the nested runs of one root invocation. `--watch` retries on the next
      change.
    - **`magus query output --publish` is refused when remote writes are off.**
    - **`magus query output` reads trail payloads.** `grd` (guard verdicts) and `mcp` refs
      resolve beside `out` run outputs.
    - **Breaking: `magus status -o json` nests concurrency.** `config.concurrency` is an object
      of `configured`, `profile` and `effective`; `config.concurrency_effective` is gone.
    - **Breaking: magus is told where it runs; it never detects it.** The CI provider spells
      stop checking `GITHUB_ACTIONS`/`GITLAB_CI`; wire them under a setting the workflow sets.
      `TestNoEnvironmentSniffing` enforces it.
    - **Breaking: the remaining MCP tools drop the `magus_` prefix.** They are
      `buzz`, `status`, `config`, `console`, and `diff`; hosts already namespace a
      tool by its server.
    - **Agent hosts get their own MCP server.** `magus describe harness` registers a
      per-session stdio `./magus mcp` in the checkout, which keeps its graph warm. Every
      tool result names the served root and build under `_meta.magus`, and adds a line
      when the caller's roots or the rebuilt binary differ.
    - **The MCP tool catalog is generated from the `std.Magus` descriptor.**
    - **Breaking: `server.sock` speaks HTTP.** Forwarded runs, jobs, status, reload and stop
      are `/proc/v1/` paths on it, and a client meeting a server started by an older magus
      gets MGS3025 naming the restart. On Linux and macOS it admits only processes running
      as the server's user (MGS9022 otherwise).
    - **A merge regenerates what it changed, in the merge.** The merge driver's registration
      writes settle hooks running `magus vcs resolve --hook` on the whole tree: projects
      whose sources or outputs the operation changed regenerate and are staged, a clean
      merge's commit is left to `git commit`, and a failed regeneration stops the commit.
      `regenerate-owed` is gone.
    - **Breaking: the GitHub merge queue's status labels read `queue: <state>`.** A
      person's intent stays `merge-queue: <method>`; the queue's answer is `queue: queued`,
      `queue: kicked back` or `queue: needs regeneration`, with descriptions saying what to
      do. Delete the old `merge-queue:` status labels by hand. The advisor mute labels are
      now `advice: silence` and `advice: silence <name>`.
    - **The merge queue needs no bypass actor.** Apply posts `success` right before a merge,
      once main is still at the predicted tip, and GitHub's auto-merge merges; apply merges
      itself after a minute. A success it cannot follow through goes back to `pending`.
      Breaking for providers: `list_green` is required, and `merge_change` reports
      `by_provider`, which `merged` events carry.
    - **MGS1021's advice for a merged tree names the generators in order.** For a tree whose
      generated files lag its sources, it used to say to restore them from the revision that
      generated them.
    - **MGS1040 reads as a list.** Each unknown `magus.yaml` key prints once, by its dotted
      path, with every line it appears on and any suggestion. The version gap is stated once, followed by the fixes
      as commands, including the `go build` bootstrap for a dev build in a magus checkout.
    - **MGS3010 defers a redundant `ci` gate regardless of load.** `--no-redundancy-check`
      runs it anyway.
    - **The root magusfile's three modules moved from the repository root to
      `hack/magusfile/`.** `coverage.buzz` keeps its name, `badge.buzz` is now
      `badges.buzz` and `releaser.buzz` is now `releases.buzz`. Each is a module the root
      magusfile imports, with no `main`, so it sits beside the other magusfile modules.
      `buzz-test` now runs the coverage and badge test blocks embedded, like the rest of
      `hack/magusfile/`.
    - **The repository's own scripts moved from `tools/` to `hack/`, one directory per
      caller.** `hack/dev/` holds what a person runs while working, `hack/remote/` runs a
      command elsewhere, `hack/magusfile/` holds the modules magusfiles import,
      `hack/ci/` what CI and the merge queue invoke; `hack/README.md` lists them all.
      `buzz-test` runs every hack/ script's test blocks, strict
      unless the file is a magusfile import.
    - **The magus-multi-agent skill teaches the fork that `magus job fork` accepts.** Its
      examples claim files and file globs, never a directory, which fork refuses with MGS3018.
      It shows `<file>#<declaration>` for two jobs sharing a file, the `--check` form, and the
      order: fork the row, then spawn with the description `<parent>/<role> <job>`. Rules the
      guard enforces are cut.
    - **`-o jsonl` runs emit only records.** Headers, progress, summaries, race diagnostics
      and lock decisions are typed events on stdout beside `run.target.result`; notices, other
      log lines and output printed outside a target are `run.notice` records on stderr.
      `magus x`, `affected --stdin` and `--detach` (`run.detach`) do the same. No record is
      dropped; the schema is now 5.
    - **An older magus refuses to replace what a newer one wrote.** Managed hook and
      `.gitattributes` sections, the merge driver registration, the config and installed skills
      record their writer; an older writer stops, naming both builds and the fix. `magus init`
      writes a config holding no keys instead of every default.
    - **hack/gha-run.buzz is `hack/remote/on-actions.buzz`, a prefix.** `magus buzz
      hack/remote/on-actions.buzz -- magus affected ci` pushes HEAD, runs the command on a GitHub
      Actions runner, waits, prints its output, exits with its exit code, and deletes the run
      and the branch unless `--keep`. `--detach`, `--result <run>`, `--delete <run>` and `--ls`
      manage runs; `dispatch`, `result` and `forget` are gone.
    - **Per-session guard state is keyed per host.** Facts a rule reads, such as skill loads
      and projects written, key on `<host>/<session>`; fire-once notices and deny explanations
      key on `<host>/<transport>/<session>`, each part escaped. `magus shell --transport` names
      the hook form; the shipped sh and Buzz command and path hooks pass `sh` and `buzz`.
    - **A pipe of magus runs fails at its first failed stage, without `set -o pipefail`.**
      A run starts nothing once a magus stage upstream of it has failed, and the last
      stage exits with that stage's status (MGS3030), so `magus run generate:rw . | magus
      run test .` is a chain whose exit status can be trusted.
    - **A planted token record cannot outrank a minted one.** The store skips, with MGS9019,
      a record holding `tokens=write`, outliving 366 days or naming another file, and keeps
      the rest; `magus doctor` fails on it. Revoke takes an exact id or name, within the
      caller's grant. Every mint is audited, and a revoked token ends its open streams.
    - **The PR advice comment leads with files no project claims.**
    - **The `proc\exec` warning names the `magus\describe` methods.** Running the magus binary
      through `proc\exec` for `describe <noun>`, `ls` or `ls targets` now points at
      `magus\describe.<noun>`, `magus\describe.project` or `magus\describe.graph`.
    - **The `buf-breaking` op takes its baseline from the caller.** It no longer compares
      against `.git#branch=main`, so a repo on another default branch, or a module below the
      git root, passes `--against` with the ref and `subdir=`. The proto project's `ci` now
      runs it against the default branch `vcs` resolves.
    - **The push rule reads only gate verdicts.** It used to decode every invocation in the
      session store on each push; it now reads the gate results through the same per-kind cache.
    - **`magus query -h` and `--help` print usage** instead of searching the graph for them.
    - **`magus query`, `refs` and `explain` answer in a fraction of the time.** Whether a
      symbol index is current used to cost a version probe of every declared tool. A stamp
      beside each index now answers that from a stat of its inputs, and only an index whose
      inputs moved pays the probe. Warm: `query guard` 2.2 s to 0.5 s.
    - **A graph read no longer evaluates the workspace when the stored graph is current.**
      `magus query`, `explain`, `path`, `graph stats` and `graph export` answer from the
      store when its fast stamps match, and evaluate the workspace when they do not.
    - **Breaking: a merge queue hook is a command and its arguments, not a shell line.**
      The queue appends the change's affected projects (`/` when unproven) instead of
      setting `MERGEQUEUE_*` variables, so a gate becomes `magus run ci
      --no-default-charms`; `--facts` gets the fact asked for. Shell syntax is refused
      with MGS3026: point the flag at a script.
    - **The queue keeps a change whose generated files its merge leaves alone.** It kicks
      back with `KICK_REGENERATION` only when the merge needs them regenerated (a conflict,
      or main changed them) by code the change touches; otherwise the drift gate checks them.
      A kicked-back change merges main in, regenerates, and is queued again.
    - **The merge queue kicks back stale generated files before its gate runs.** A change
      that edits generator code must commit outputs that are current on top of the base. If
      they are stale, the kick-back names the stale files and says how to fix them. If they are
      current, the change merges.
    - **The queue lands a change whose generated files drifted.** Planning no longer kicks
      back with `KICK_REGENERATION`; validation regenerates the candidate, gates it, and
      uploads it as `candidate.bundle`. Apply runs none of the change's code: it takes that
      commit only once it checks its parent and that it changes declared outputs alone.
    - **Raw package-manager installs are advised, not denied.** `pnpm install`, `npm ci`,
      `uv sync`, `cargo fetch` and `go mod download` point at `magus run install`; naming a
      package leaves the command alone.
    - **The read rules judge every whole read.** `read-navigation` maps Go files from their
      own parse, so a stale index still gets the map. It judges every file a `cat` prints,
      maps Buzz files, and leaves SKILL.md, AGENTS.md and CLAUDE.md whole. Claude Code and
      Codex route the `Read` tool through the command guard; re-merge what `magus describe
      harness` prints.
    - **A record with no host claim is unattributed, never "a person".** `magus shell` typed at
      a terminal records `entry_point: cli`, no session, and no longer `actor: "agent"`; its
      terminal window keys fire-once notices but is not recorded as a session. The OS user
      says whose account acted.
    - **Re-forking a live job to move its paths keeps its state.** A fork that only changes
      write, read or deny paths no longer resets the job to `declared`.
    - **`refs` reads one directory's symbols, not the whole index.** Symbol shards are split
      by the directory a symbol is defined in, a bare name routes to the shards of the symbols
      it names, and `--occurrences` reads each symbol's sites from a file written once per
      index instead of decoding the SCIP index on every call.
    - **Breaking: the `relock` charm is renamed `update`, with no alias.** A run spelling
      `relock` fails with MGS6002, which names `update`; rename the suffix. `ci` strips
      `update` as it stripped `relock`, and `rw` does not include it.
    - **BREAKING: `cache.remote.write.enabled: true` fails Open when no remote backend can
      write.** A wired backend that does not start, or no backend at all, is an error naming
      the cause. Unset or false, the run stays local-only and the cache header names why:
      `local (remote <name> unavailable: <err>)`.
    - **Breaking: `-o mermaid` is removed.** `magus graph deps`, `magus graph export
      --select`, `magus describe graph` and `magus run --graph` no longer emit Mermaid, and
      `-o mermaid` is an unknown output format. `-o dot` stays.
    - **Breaking for SDK callers: `RenderedSkills` takes a form, not a variant.** The
      `*ForForm` methods are gone.
    - **A repeated guard deny is one line and a ref.** The first deny from a rule in a session
      carries the full reason, `nothing ran (N commands)` on a multi-command line, and the
      rule's page. Later ones name the rule and cite `magus query output grd<hex>`, counted by
      `magus session hints` as `deny-verdict`.
    - **The `run.remote` record says `stored`, not `published`,** which names output bundles
      only.
    - **Breaking: sandbox grants are explicit, and misconfiguration is an error.** Exec
      needs `mode: rx` or `rwx`; `ro` and `rw` no longer imply it. An unset `$VAR`, a mode
      typo or a passthrough prefix like `GO*` fails with MGS2004. System, `PATH`, toolchain
      and tool-cache directories are granted by default; children get a private `TMPDIR`.
    - **Breaking: `sandbox.enabled` is now `sandbox.mode: off | best-effort | required`.**
      Also `MAGUS_SANDBOX` and `--sandbox=<mode>`, replacing `MAGUS_SANDBOX_ENABLED` and
      `--sandbox-enabled`. `best-effort` is the old `enabled: true`; `required` refuses to
      run (MGS2012) unless kernel landlock can confine its children. The old env var is an
      error naming its replacement.
    - **The scip op keys on its language's sources and its indexer's version.** An install
      that adds `node_modules` no longer marks a symbol index out of date, and upgrading
      scip-go or scip-typescript now does. An indexing spell declares its indexer as an
      observed tool, so its version keys only the scip op.
    - **`magus describe graph -o markdown <project>` renders only that project.** A scoped
      index drops the workspace-wide kind and project tables, so a change elsewhere cannot
      make it stale; the unscoped index keeps them. A project path that names no project is
      now an error instead of an empty index.
    - **A running `magus server` answers graph reads.** It runs the same stamp-checked build
      a local read runs, so its answer is the local answer. It answers only a client of the
      same build that reads under the same configuration and the same `PATH` and
      index-relevant environment. In every other case, or with no server, the read runs
      locally as before.
    - **A running server answers symbol reads from memory.** `magus server` keeps the
      knowledge shards it decodes and the symbol-merged graph, so a warm `query --kind
      symbol`, `refs` or `explain` decodes nothing that did not change. A source edit, an
      index rebuild or a session load is read fresh. The cache is capped at 512 MiB of shards.
    - **"Session" now means only the host's conversation; magus's per-process id is an
      invocation.** `magus session` lists INVOCATION and SESSION columns; `-o json` keys are
      `invocations`, `invocation` and `session`. The store is schema 2; a schema-1 line is
      counted and named as written before the rename (`legacy` in JSON), and pruning never
      deletes a file this build cannot read.
    - **Breaking: `--skill-form` takes `both`, `short` or `full`.** Skills stamp
      `skill-variant: short`, and a body brackets short wording with `{{if .Short}}`.
    - **Breaking: an import never leaves the workspace.** A `../` spell or module import
      joined onto a shallow search level used to reach past the root, so a worktree could
      load a sibling checkout's file. A candidate outside the root is now skipped, and an
      import with none inside it fails with MGS1047 naming the import, level and root.
    - **`magus spell lock --update` writes no lock that pins nothing.** With no remote spell
      declared it removes `magus.lock` instead of writing a header and `version: 1`.
    - **Built-in spells ship as their Buzz source, not bytecode.** The binary embeds each
      `spells/<dir>` and compiles the built-ins at startup, offering only `magus/spell`,
      `magus/charm` and `magus/lint`. A spell importing anything else ships as source only:
      `endoflife-date`, `onepassword` and `system-keychain`. The committed `.bo` files and
      the `magus-utils spells` generator are gone.
    - **`go-test` and `go-vet` pass `-trimpath`.** Matching `go-build`, so a run in one
      worktree can share its compile and result cache with another worktree at the
      same content, regardless of either one's absolute path.
    - **A stale-index search refusal says why the index fell behind.** When the guard refuses
      a symbol search because the symbol index is older than the tree, the refusal now adds
      what magus observed (no server running, a sync in progress, a hook whose binary is
      missing) and the command that keeps the index current.
    - **A missing or stale symbol index says why.** `magus refs` and the guard's stale-graph
      advice name the cause they can observe, with its remedy: no server running, a refresh
      hook whose binary (such as `./magus`) is missing, no refresh hook installed, a server on
      another build, or a sync running now. `magus job run sync-graph` records what each
      request did.
    - **Breaking for SDK callers: `ServiceHost.Acquire` and `Client.AcquireService` also
      return whether the broker owns the service.** A service with neither `command` nor
      `start`, or with both, fails to load.
    - **`stutter` reads the package clause.** It skips `package main`, and
      `min-package-len` (was `min-package`) defaults to 3.
    - **A symbol query ranks from a names index.** `query --kind symbol` used to decode every
      symbol shard. It now ranks matches from a compact index of node names and decodes only
      the shards its answer's neighborhood touches, with the same output.
    - **A target's `std\print` is captured with its output.** It is withheld, streamed and
      stored under the target's ref like a subprocess's output, instead of bypassing both.
    - **One tool renders the terminal SVGs.** `cmd/magus-termshots` is now the
      `shots` subcommand of `cmd/magus-termcast`, and `termshots-generate` runs
      `magus-termcast shots`. Its outputs are unchanged. A word other than `shots`
      in the subcommand position is an error instead of being ignored.
    - **BREAKING: every Go test file pairs with a source file of the same name.** The
      new `testpair` linter reports each `X_test.go` with no `X.go` or platform family
      beside it, with no exemptions. It runs on every module, reads build-tagged files,
      and `//nolint:testlayout` does not reach it. `testlayout` drops `allow`,
      `report-unpaired`, `honor-marker` and `pair-benchmarks`.
    - **The toolchain's violation flag and window text come from the server.** `ListTools`
      returns `violation` and the spell, workspace and effective windows per tool, rendered by
      the same code as `magus describe tools`, so the console and the CLI agree. The CLI text
      table prints a verdict as "too old"; JSON keeps `too_old`.
    - **Tool-version probes for go, golangci-lint, buf and `pnpm exec tsc` are cached.** The
      key is the resolved binary's identity plus what picks its version (for go, the toolchain
      lines of go.work and go.mod, GOENV and GOTOOLCHAIN), not the project directory, so
      projects with the same inputs share one answer and one fork. A failed probe is cached
      for ten minutes.
    - **A tool that runs but cannot say which build it is now fails the run as MGS3035.** The
      cache key used to record `UNPROBED` for it. An absent tool still keys as `UNPROBED` with
      a warning. Graph reads do not fail: `magus status` reports that project's symbol index
      as `unvouched`, with the reason.
    - **A toolchain upgrade with no source change keeps a symbol index reading current.** It
      stays current until the next `magus graph build`.
    - **The trail names the credential, not "operator", and drops `actor`.** Each event records
      `credential` (the verified token's class, id, name and grant, never its secret) and the
      MCP client as `host`; the wire's `actor` is a label rendered from them. Console review
      comments are `unattributed`, not `human`.
    - **Breaking: the typed graph returns use camelCase keys.** `node_count` is `nodeCount`,
      `match_count` is `matchCount`, `schema_version` is `schemaVersion`, `file_count` and
      `ref_count` are `fileCount` and `refCount`, `blast_radius` is `blastRadius`, `docs_url`
      is `docsURL`, and `duration_ms` is `durationMs`. An old key reads as null rather than
      raising, so a script that read one needs the new name.
    - **Breaking: `magus\explain(node, to:)` is gone.** A path between two nodes is
      `magus\path(node, to:)`.
    - **`magus\query`, `explain`, `path`, `refs`, `stats`, and `output` return typed
      objects.** Annotate them `> QueryResult`, `> ExplainResult`, `> PathResult`,
      `> RefsResult`, `> KnowledgeStats`, and `> OutputRecord`.
    - **`types.DoctorCheck` is `types.Check`, and `DoctorCheckStatus` is `CheckStatus`** (with
      `CheckOK`, `CheckFail` and `CheckAdvice`): a conformance finding is the same record. Go
      names only; JSON keys and proto messages are unchanged. `magus\diff` gains `opts.from`,
      reading a saved review, so `magus diff --impact`'s advisors share one diff.
    - **Breaking: the typescript spell's `dev-server` op takes the server command from
      the caller.** It no longer runs the `dev` script in `package.json`: pass the command
      the way `esbuild` takes its args, `typescript["dev-server"](ctx, {"args": ["vite"]})`
      runs `pnpm exec vite`. A call with no command fails with that call spelled out.
    - **Breaking: an unknown key in `magus.yaml` fails the load.** MGS1040 reports each as
      `file:line` with the nearest known key; a second YAML document in a file is rejected.
    - **Upstream-wait messages back off** (15s, 30s, 1m, 2m, …) and name both targets.
    - **Breaking: `vcs\base` is declared as raising.** It raises only for a `dir` that does
      not exist, but a caller outside a raising function must now catch it.
    - **`vcs\history` takes `paths` and `first_parent`, and each commit carries `files`.**
      It reads any number of commits in one VCS call on git, hg, sl and jj, and `limit: 0`
      returns them all. A merge is judged by its diff against the first parent. The docs site
      reads its page history this way and no longer shells out to git.
    - **Breaking for SDK implementers: `VCSDriver.Preserve` is required.** Every backend
      captures and restores the working copy, untracked files included.
    - **A workspace load reports every broken magusfile and every shadowed spell at once.**
      `ls`, `doctor` and every other command name them all instead of stopping at the first.
    - **Breaking: MGS3018: a job's write paths name files.** `magus job fork`
      and `magus\job.put` refuse every existing directory, `.` and a sub-project root such
      as `console` included, since a root overlaps every other job. A path the job creates
      passes. A glob ending in wildcards (`dir/**`) is judged as its directory.
    - **Writes to host guard wiring are denied under a bound lease.** Every verdict names the
      lease it was graded under; an unknown lease id is a deny.

    ### Removed

    - **Breaking: `libs/pricing` moves to `benchmarks/agent/internal/pricing` and drops
      its batch, fast-mode and geo pricing.** Nothing recorded which mode a benchmark
      run used, so `Effective`, `Options`, `Rates.Fast` and `Rates.GeoMultipliers` are
      gone with it; `Rates.Cost` replaces the per-field arithmetic `extract.go` did by
      hand.
    - **Breaking: the advice action's `hand-edited-generated` advisor and input.** It named
      generated files as hand edits whenever no declared input of their project changed, which
      was false for every output whose target opts out of the cache, such as a `MAGUS.md`
      rendered from the whole graph. The drift gate already fails on a real hand edit. Delete
      the key from `with:`.
    - **Breaking: the advice action's `fix-generated-drift`, `fix-merge-conflict`,
      `offer-fix-label` and `fix-label` inputs.** Both fixers pushed to the pull request's
      branch and neither ever ran: their consent label never matched `gh`'s JSON. The merge
      queue now settles drift and conflicts at merge time. Delete the keys from `with:`; the
      action needs only `pull-requests: write`.
    - **Breaking: the advice action's `pr-number`, `base-ref`, `head-sha`, `head-ref` and
      `head-repo` inputs.** The action reads the pull request from the triggering event and
      runs its advisors in one step; delete those keys from `with:`. An input switch reading
      anything but `true` or `false` now fails the step, and one failing advisor no longer
      stops the rest.
    - **Breaking: `--wait` on `run` and `affected`, with no replacement.** It waited on a run
      handed to the server, and `--detach` no longer hands a run to anything; to wait for a
      run, leave off `--detach`.
    - **Breaking: the `ci-shard` target.** A workflow publishes the plan itself: save
      `magus affected ci --plan` to a file, then redirect `magus run --stdin --dry-run -o
      'template=...' < plan.json` into `$GITHUB_OUTPUT` and `$GITHUB_STEP_SUMMARY`. The GitHub
      Actions guide shows the three lines. A magusfile that copied `ci_shard` keeps working.
    - **Breaking: the `exclusive` target and project option, with no replacement.** A
      magusfile that sets it fails with MGS1038; delete the key. `slots` and `memory_mb` are
      the concurrency dials. The run-isolation gate goes with it. See docs/decisions/0001.
    - **Breaking: `magus\guard.bash` is gone.** It was an alias for `magus\guard.shell`
      that defaulted the dialect to bash; call `magus\guard.shell` and set `dialect: "bash"`.
    - **The `code-search` and `doc-search` guard advisories.** Measured uptake was 0.9% over
      6,075 servings and 2.5% over 812. A search the graph answers exactly is still refused by
      `symbol-search`, and a one-name precedent hunt still advises.
    - **Breaking: `magus job exec --session` and `--vacate`.** The guard now binds whoever
      runs `magus job exec`, keyed on the host's session and subagent ids, so a subagent's
      exec never binds its parent. Exec records only the base and checkout. After an exited
      or ended job, the next exec takes a new one.
    - **Breaking: `magus agent harness apply` and `remove`, which wrote host config.**
      `magus describe harness <id>` prints each entry a host file lacks and the one merge
      command you run yourself; `-o json` prints the exact fragments. magus never writes host
      config. `verify` and `install` stay.
    - **Breaking: `harnesses/*.json` compat descriptors are removed.** All four shipped hosts are
      Buzz spells under `spells/harness/`, wired with `magus\harness.provider(...)`. JSON
      descriptors under `harnesses/`, `.magus/harnesses/` and `$XDG_CONFIG_HOME/magus/harnesses`
      are no longer read, and `--id` now resolves only a wired spell. Adapt a host by
      forking its spell's import path instead.
    - **Breaking: `magus run --then` and `magus affected --then`, with no alias.** Pipe the
      run into a `magus buzz` script instead: `pipe\outputs`, `pipe\exportTo`,
      `pipe\history`, `pipe\diff` and `pipe\value` act on the records it reads, and
      `fs\readFile` and `crypto\sha256File` cover `contents` and `hash`.
    - **`cmd/magus-ruledocs`.** The docs `content-generate` target renders the guard-rule
      reference through `hack/magusfile/ruledocs.buzz` from `magus\describe.rule`, the same
      catalog `magus describe rules` prints, so the pages and the CLI read one source.
    - **The `tail_log` MCP tool.** `magus\output` returns the same bytes by ref; the SDK
      keeps `Magus.TailLog`.
    - **`magus-utils mockassert`.** The `mocks-generate` target writes each published mock's
      interface assertions through `hack/magusfile/mockassert.buzz`, byte for byte what the
      Go subcommand wrote, and the guard no longer admits the subcommand as a recovery
      command for a checkout that cannot load.
    - **`magus-utils sign`.** The `release-sign` target signs `dist/SHA256SUMS` with
      `crypto\signFile` directly, reading the key from `MAGUS_SIGNING_KEY` as before, so a
      release no longer compiles a Go program to sign one file.
    - **`magus-utils verify`.** `release-sign` checks the signature it wrote with
      `crypto\verify` against the active key in `internal/selfupdate/release-keys.json`, the
      keyring of the tree being released, so a mis-set signing key fails the release rather
      than every client's self-update.
    - **Per-verb MCP tools the magus module already covers.** `describe`, `describe_file`,
      `insight`, `run_target`, `doctor`, `memory`, `query`, `output`, `explain`, `refs`,
      `path`, `stats`, `vcs_checkpoint`, `job`, `where`, `run_affected`, `affected_plan` and
      `affected_explain` are gone. Call the matching `magus\` member from `client`, which
      does not offer `magus\cmd` or `magus\pry`.
    - **The memory store is gone.** `magus memory`, the `magus_memory` MCP tool, the
      `magus\memory` Buzz module, the console's Memory tab, the `MemoryService` API,
      `magus notes promote` and the `memory-write` advisory are removed. An agent's harness
      owns what persists between sessions. Notes stay, human-authored and committed. Old
      entries on disk are left untouched.
    - **The `preflight` target convention.** The starter magusfile and the docs no longer
      declare one, and the `typescript` spell's no-op `preflight` op is gone; pipe the cheap
      check in instead: `magus affected generate --no-default-charms | magus affected ci`.
      A target you named `preflight` keeps working.
    - **Breaking for SDK callers: `ReportWriter`, `NewReportWriter`, `WithReport`,
      `WithReportWriter`, `Magus.LogScope`, `LogCharms`, `LogCache` and `LogBase`.** Build one
      `Sink` with `NewSink(format, stdout, stderr)` for the invocation's `-o` format, emit
      headers through it, pass it with `WithSink` and close it after the run.
    - **Breaking: the POSIX sh hook glue is gone; every host wires the Buzz glue.** The
      `magus-*.sh` hooks, `cursor-hook.sh` and the `magus-session-load-*.sh` adapters are
      deleted. Wire `magus buzz -s <file>.buzz -- --agent-name <host>` as `magus describe
      harness` prints. `magus-rehydrate.buzz` takes `--format json` and `--rules <file>` in
      place of `REHYDRATE_FORMAT` and `REHYDRATE_RULES`. Guard templates are version 19.
    - **`magus config cache export --toolchain` and `--used-within`, and `import
      --toolchain`.** `--remote` carries every cache the workspace's spells declare, and a
      save keeps only what was used since the last restore, with no flag to say so.
    - **The `stale-binary` advisory and the `go -C` deny into another checkout of magus.**
      Both judged only magus's own repository, which now keeps them in its guard policy.
    - **`hack/magusfile/toolchain.buzz` no longer prints `end of life unknown` for every tool.**
    - **`magus self refresh`, `magus self registry`, the `registry-freshness` doctor check,
      `MAGUS_REGISTRY_URL` and `registry.d` drop-ins are gone.** The signed end-of-life
      registry they read was never published, so `self refresh` always refused. The workflow
      and hack/toolchain-releases.buzz that built it are deleted too.

    ### Fixed

    - **The bootstrap builds without mise.** It is now
      `GOEXPERIMENT=jsonv2 go run -trimpath ./cmd/magus run go-build --no-cache .`; magus
      does not compile without that experiment, and the old command worked only where the
      mise shim set it. The `raw-tool` rule exempts this exact line; any other spelling is
      refused and served it.
    - **Breaking for SDK callers: `magus clean` keeps outputs the VCS tracks.** It
      deleted committed generated files, with or without `--cache`, and left the tree
      dirty. `CleanOutputs` returns `CleanedOutputs`, listing removed and kept paths.
    - **A broken working tree no longer switches off the approved spawn rule.** The committed
      `magus\guard.spawn` rule runs on every spawn whatever the working tree holds; resolving
      it too slowly denies. A skipped rule says what applied. A workspace advise joins a
      built-in one, and the idle clock follows the agent's id.
    - **The broker adopts a supervisor's socket bound past the 107-byte path limit.** A socket
      bound through its directory reported a closed file descriptor's name, so the broker
      refused it; it now asks the kernel which file the socket is bound to.
    - **Status, doctor and the console see both background processes.** The liveness probe
      asks the configured server rather than whichever socket a run inherited; doctor's
      `sockets` check reports `broker.sock` and `server.sock` by name; the compact status line
      names each; and the dashboard gains broker and server tiles. `MAGUS_*` settings now
      apply in a workspace with no `magus.yaml`.
    - **A claim released while a restarted broker was taking it back is released there.** A
      step finishing during the moment its claim moved to the new broker left the claim
      counted, so the broker admitted less work until that process exited.
    - **A claim released while its holder reconnects no longer stays on the new broker.** A
      release that landed after the new broker recorded the re-asserted claim, but before
      the client finished reconnecting, was dropped, so the broker counted that memory
      until the holder's process exited. The client now hands such a claim back as soon
      as it reconnects.
    - **A broker reply that arrives just before the connection closes is no longer lost.**
      `magus broker stop` could report `connection closed during shutdown` after the broker
      had answered and stopped.
    - **A run killed outright releases its claims and services at once.** Claims and
      service references ride the run's one broker connection, so the kernel closing it
      releases them; this replaces pid polling and the 24-hour cap. When the broker
      restarts under running steps, they re-assert their claims on the new one.
    - **The server keeps the knowledge graph and symbol indexes current with MCP off.**
      Graph watching and symbol indexing belonged to the MCP listener, so `mcp.enabled:
      false` quietly stopped both; they now run for as long as the server does.
    - **`magus broker units` fits the broker's drain and SIGHUP.** Each unit pins
      `shutdown_grace` and waits that long plus 60s before SIGKILL, where systemd waited 90s.
      systemd sends SIGTERM to the broker alone and `reload` sends SIGHUP; the launchd broker
      logs through `--log` so SIGHUP reopens it. Reinstall printed units.
    - **The Buzz checker rejects four programs upstream Buzz refuses.** Each used to pass
      `magus buzz --check` and fail at run time with no line, or run with a wrong answer:
      `std.print(...)` (upstream-strict sessions only), an unknown method on a list, map or
      string, `len(xs)`, and `return null` from a function declared `> int`. Each error names
      the fix.
    - **A diagnostic inside an interpolated string points at the expression.** Every error
      in `"{...}"` reported line 1, column 1.
    - **A module's private object or enum stays its own when the importer declares one of
      the same name.** A script declaring `object Node` that imported `magus/figure` made
      figure build its internal nodes from the script's `Node`, so every figure refused to
      draw. Private objects and enums now get per-module keys, as private vars and functions
      already did, matching upstream Buzz.
    - **A long-running magus no longer grows with every magusfile evaluation.** Each Buzz
      session kept about 0.5 MB alive forever, so the daemon and benchmarks grew without
      bound. A session now releases its heap values when it closes; under `-race`, a value
      read after its session closed panics instead of reading another object.
    - **Buzz `s[i]` indexes bytes, as upstream Buzz does.** It indexed runes, so on a
      non-ASCII string it disagreed with `len()`, `sub()` and `foreach`: `"aé—b".len()` is 7,
      yet `"aé—b"[5]` failed as out of range. Each index now yields a one-byte `str`, and one
      past the end fails with upstream's "Out of bound str access".
    - **Buzz subscript errors use upstream's wording.** A list index out of range, read or
      assigned, fails with "Out of bound list access", and a negative `str` index with "Out
      of bound string access", in place of "list index N out of range". Each still names the
      index and the length.
    - **Buzz type tests and qualified literals tell same-named types apart.** `is`, `as?`, a
      typed `catch` and a `<Node>` match arm match the object or enum in scope, so another
      module's private `Node` no longer passes `is Node`. A script's own declarations no
      longer replace an import's export, and `ns\Node{...}` builds the `Node` that `ns`
      exports. Matches upstream Buzz.
    - **Breaking: a Buzz annotation naming an undeclared type is BZZ1002.** `fun f(r: Nope)`
      and `fun f(r: magus\Nope)` accepted any argument; now they fail, as upstream Buzz
      does. `ns\T` resolves through the namespace `ns`, host types reach aliased imports,
      and `serialize\Boxed` is declared.
    - **A namespace a module never imported is BZZ1009.** `magus\Context` without
      `import "magus";` named the wrong cure, `magus self update`; now the error says no
      import binds `magus` and names the line to add. Hints suggesting a target now carry
      that import.
    - **A call to a member an untyped value lacks names the member and the line.** It raised
      `null is not callable` with no position; it now raises
      `<file>:<line>: unknown method push on list`.
    - **The first run after a change is cached.** A composer's skip_cache generators run once
      its dependencies finish and before its key, on a miss as well as a hit, once per
      invocation however many composers reach them. Their own members cache as steps, as
      under an uncached composer.
    - **"Cannot check byte-stability" is recorded.** It fails the gate, and a `-o jsonl` run
      now carries it as `race.determinism_unchecked` with its error.
    - **A catch-all lease no longer turns every word of a shell line into a path.**
      Under a `**` declaration only a redirect target or a file-shaped word is graded,
      so `python3 -c 'print(1)'` and `echo hi` pass beside it.
    - **A failure cause no longer clips MGS3011's log path.** Under a long `TMPDIR`, the
      240-character excerpt used to cut mid-path, leaving `captured output: ...` unopenable.
      The excerpt now trims the prose ahead of the path instead, so the path always prints
      whole.
    - **Clones of an hg, jj or Sapling repository share one state store.** Identity is read
      from each backend's config without running it. jj is covered when colocated with git.
    - **A target reached through `ctx.needs` runs under its own sandbox declaration.** Only
      the target a run schedules got its `sandbox` grants; one it composed ran under its
      caller's policy. `ci` composing `test` left `test` without its `/proc` read. Each
      composed target now gets its own declaration, not the union with its caller's.
    - **Concurrent fetches into one repository no longer fail.** Two `git fetch` runs read
      each other's refs mid-update and failed with "bad object"; magus now fetches into a
      repository one at a time.
    - **Config values given as flags are validated.** `--log-level bogus` ran with a value the
      same setting in `magus.yaml` or the environment is refused for.
    - **The console dashboard connects on the daemon's own origin.** The token exchange sends
      an expiry the daemon accepts, and a page from an older console build asks for a reload.
    - **Console failures are always shown.** Every failed daemon call, stream or undecodable
      frame raises a notification, and the console lint rejects a swallowed catch. A page with
      no token shows one sign-in state with the command that opens it signed in, and a 401
      returns there.
    - **Console links carry a runnable command.** `magus job fork`, `ls jobs` and the other
      console hints print `open "<url>#token=$(magus config token print)"`, and
      the `console` MCP tool returns it as `open`. The job hint names a daemon running a
      different build instead of claiming nothing serves the console.
    - **Security: cached guard-rule bytecode is authenticated.** Every chunk under
      `<user cache>/magus/buzz-bytecode` carries an HMAC keyed by a secret in
      `<user state>/magus/buzz-bytecode.key`. A chunk that does not verify, planted or moved
      from another key, is compiled over rather than run.
    - **A top-level raising call in `magus buzz` names the fix.** BZZ1006 says to put
      the call in `fun main(args: [str]) > void !> any { ... }`, which `magus buzz` calls
      after the top level, and which `-e` takes too.
    - **`MAGUS_OFFLINE` refuses every `http\` request a script sends,** by name and before
      it leaves the process, as it already did for remote-spell fetches; `http\serve`, which
      only listens on localhost, is unaffected. `http` no longer claims its requests are
      audited: they are not recorded.
    - **The merge queue gates the change's projects.** It appended them after the gate
      line's `--`, so `run ci:gha -- --inherited=fatal <projects>` forwarded them as
      arguments, selected every project, and failed `security`'s argument check. The
      units now go ahead of the line's first `--`.
    - **`magus --root <dir> buzz` runs the script as if started in `<dir>`.** Its `vcs\`
      calls, execs and relative paths used the process's working directory, so a script
      pointed at another checkout read and branched the one it was started in.
    - **The root project declares its dependency on `proto`.** Its handlers import
      `proto/gen/go`, so a `.proto` edit now reaches the root's affected set, and a lease
      focused on the root can read `proto`.
    - **A coverage record is no longer refused after a squash merge.** Its commit is
      provenance only; per-file digests keep it honest.
    - **Cursor gates Grep, Glob, and Read before they run.** The hook restates
      them as shell and denies on `preToolUse`; `postToolUse` still advises.
      This workspace refuses a read of a run log or task capture, and creating
      or reading a directory named `terminals`.
    - **`affected --plan` advice names `--max-shards`, the plan's own flag, instead of
      `--ci-max-shards`.** The GitHub Actions guide no longer tells shard jobs to run a
      nonexistent `affected --shard` with a `matrix.total` the plan never emits; they run
      `run ci:gha ${{ matrix.projects }}`.
    - **A cache hit no longer restores a nested project's generated files.** An output glob
      such as `**/gen/mocks/*.go` stops at a nested project's directory unless rooted there,
      in the snapshot, replay, drift gate and `--race=replay` alike. MGS3001 now judges a
      directly selected step's replay, catches a file replaced with its mtime kept, and
      names the likely writer.
    - **`magus describe harness` prints what a current harness wires.** Text output lists each
      managed hook's matcher and command, and `-o json` carries them under `wired`, whether or
      not anything is left to merge.
    - **Go code inside a string or comment no longer reads as a declaration.** The golang diff
      driver took `var i = 0;` in Buzz held by a Go raw string for a Go declaration, in both
      git's change regions and magus's hunk placement. Lines inside a Go string literal or
      block comment now stay with the declaration around them.
    - **`magus diff` names the declarations a change touched in test files and build-tagged
      files.** A test function has no referents, so the filter dropping unreferenced locals
      dropped it; a touched declaration is now listed regardless. A Go file the symbol index
      leaves out, such as one under an unsatisfied build tag, has its declarations read from
      its own syntax.
    - **`magus doctor` fails when the hook interpreter is another build.** `guard-binary`
      runs `version` on the magus a hook would run and fails, naming both binaries, when
      it differs from the doctor's own or prints none.
    - **Whole-tree generation no longer traverses pre-existing untracked directories.** The
      drift gate now treats VCS-collapsed directories as opaque, so a local `node_modules/`
      tree cannot exhaust the host's file descriptors while unrelated generators run. New or
      removed directories are still reported as generated-file drift.
    - **The playground and `--dry-run` check a script as the engine does.** `proc`, `http`,
      `vcs` and the other host modules are typed there too, so a body the engine refuses no
      longer passes a dry run.
    - **Every git call magus makes is hardened the same way.** `GIT_DIR`, `GIT_REPLACE_REF_BASE`,
      `GIT_ATTR_SOURCE`, the shallow and pathspec variables and injected config never reach
      git, including the shallow-clone deepening fetch, which re-added them. git never prompts
      for credentials, and no signing, rerere or signature line changes what magus reads.
    - **Generated docs examples read the same wherever they are regenerated.** The
      examples generator runs magus in `testkit.Environ`, so no `MAGUS_*` variable, cache or
      state dir it inherits leaks run history into the captured `magus explain` output.
    - **A command magus runs leaves no process behind.** On Linux, macOS and the BSDs,
      whatever of a target's process group outlives its command is killed when the command
      exits, before it is reaped, so a background process it started stops there and no
      longer holds the run open for five seconds on its output.
    - **A failed remote-cache exchange names the step that failed.**
    - **A failed spell import names its magusfile.** A workspace failure located no file for
      an import error, and an error built without a relative path rendered `magusfile: exec :`.
    - **A failed version probe quotes the tool's own reason** instead of a bare exit
      status.
    - **A failing remote store reads as failed, not missed.** Both shipped cache spells throw
      on a failed request; `false` means not stored (get) or already stored (put).
    - **A failed target's cause line keeps its reason.** A long log path no longer crowds
      the statement out, so a timeout still says the target exceeded its declared ceiling
      when TMPDIR is deep.
    - **A fresh checkout can build its first binary.** With no `magus` in the checkout root,
      the `raw-tool` rule serves `GOEXPERIMENT=jsonv2 go run -trimpath ./cmd/magus run
      go-build --no-cache .` for every raw `go` command, and denies it once one exists.
      `go -C <dir> <verb>` and `go <verb> -C <dir>` reach one verdict; a bare `cd <dir>`
      passes the `cd` rule.
    - **Generated output no longer depends on the build.** magus requires
      `GOEXPERIMENT=jsonv2` and refuses to build without it.
    - **A cache replay no longer removes an output before restoring it.** Bytes already
      current are left alone; anything else is staged and renamed over, so a sibling
      compiling a go:embed of the tree never finds a file missing. A declared read whose
      literal prefix names a pruned dir such as `gen/` is now hashed, and MGS4008 sees it.
    - **A hand-maintained file among generated ones merges as text again.** `.gitattributes`
      lists each declared output glob as written, then names every tracked file an output's
      exclusion carves out with `!merge !linguist-generated`, so git's own merge handles it
      and review shows its diff. A slashless output glob is now anchored at the root.
    - **The GitHub Actions remote tier stores what it uploads.** The spell read the signed
      URLs under their lowerCamel names while the service answers `signed_upload_url`, and took
      the empty URL for an existing entry: every upload reported success, nothing was stored,
      and every lookup missed. It reads either name.
    - **The GitHub provider no longer offers a merge method a ruleset refuses.** `describe`
      intersected repository settings alone; it now narrows `methods` to what every active
      ruleset rule targeting the base branch also allows, drops `merge` under a required
      linear history, and errors when nothing is left in common.
    - **`go::go-clean` accepts forwarded flags.** `-cache`, `-testcache`, `-modcache`, and
      `-fuzzcache` always landed alongside `./...`, which go refuses in any order. A new
      `Command.TrailingArgs` slot drops the package pattern the moment any flag is
      forwarded; a bare `go::go-clean` still cleans `./...`.
    - **A sandboxed `go` can write the checksum database's state.** The go spell grants
      `$GOPATH/pkg/sumdb` (or `~/go/pkg/sumdb`), where go records the tree head it
      verifies a module against. Without it, `golangci-lint custom`'s `go mod tidy`
      failed under landlock whenever `GOMODCACHE` pointed elsewhere, as in the merge
      queue's candidates.
    - **The graph links a target to a workspace spell imported without an alias.**
      `import "spells/acme";`, the form BZZ1008 requires, produced no target-to-op edges, so
      `magus path` and `magus explain` missed every op it runs.
    - **Guard advisories no longer fire on paths outside the workspace.** A command whose every
      path lies outside the root, or a write into a scratch directory, is advised nothing, and
      scripted-rewrite no longer refuses a script whose every named path is outside it.
    - **A checkout that cannot load its own sources can be relinked by an agent.** When the
      workspace fails to load with MGS1021, the raw-tool rule allows the relink MGS1021 prints
      (`go build [-trimpath] -o magus ./cmd/magus`) and the generators the `*_generate`
      targets run, alone on their line. Everything else stays denied, and denied again once
      the workspace loads.
    - **A workspace command rule's deny holds on a line the guard asks about.** A built-in
      ask, such as an ungated push, skipped `magus\guard.command`, so approving the push
      also ran what the workspace denies on the same line, such as a chained
      `gh pr merge --admin`.
    - **A read-only interpreter program is no longer refused as a cache-dir write.** An
      inline program such as `python3 - <<EOF` is judged on the destinations of its writes,
      and on nothing when it writes nothing. One that deletes, moves or shells out, or writes
      somewhere the guard cannot follow, is still judged on every path it names.
    - **A spawn brief is judged as the worker's fresh tree meets it.** The bootstrap command
      alone on its line is no longer refused (it is the one go command a tree with no binary
      may run), and a single backticked word in prose (`cat`, `grep`) is not graded as a
      command the brief teaches.
    - **Every guard verdict names its rule.** A lease, focus, hook-wiring, notes or
      cache-dir refusal, an undeclared lease, and five advisories recorded no rule. Each now
      carries a catalogued name: `lease-write`, `lease-undeclared`, `lease-gate`,
      `lease-vcs`, `lease-rebind`, `lease-harness`, `focus-read`, `hook-wiring-write`,
      `lease-state`, `dependency-update`, `dependency-install`, `echo-on-success` and
      `timed-magus`, each listed by `magus describe rules`.
    - **A deny path naming one declaration denies only edits to it.** A job forked with
      `--deny-paths 'run.go#A'` had all of `run.go` denied. The guard now denies an edit only
      when it changes `A`, and `magus job wait` grades the footprint the same way. A write it
      cannot place, and a file or glob deny path, deny the whole file.
    - **The guard judges a `for` loop over literal words one iteration at a time.**
      `for b in x y; do git worktree remove /w/$b; done` passes when each worktree is
      safe to remove, and a dirty one is named in the denial. Lists needing expansion,
      other loops, conditionals and functions stay refused.
    - **Global options no longer hide a VCS command from the guard.** `git -C . reset --hard`,
      `hg -R . purge` and `jj --at-op @ abandon` reach the rule their subcommand triggers.
      An inline alias such as `git -c alias.x=...` is refused under the new `inline-alias`
      rule.
    - **The guard lets a tool's help through.** `go clean --help`, `gofmt -h` and
      `magus run --help | grep charm` pass the rules that route work through magus. A help
      flag handed to a program, as in `go run main.go --help`, is still work, and the
      credential and destructive-command rules still refuse.
    - **The agent guard judges a Buzz script's writes, and leaves scratch files alone.**
      `magus buzz` replacing a file the workspace already has through `fs` is refused like
      the same write from python. `sed -i` or a scripted rewrite whose files all lie outside
      the workspace passes, including after a `cd` into a scratch directory.
    - **A worker in its own worktree can write inside its lease.** A leased write is graded
      against the checkout the lease was taken in, and a write into another magus checkout
      is denied. A subagent's first call registers its checkout only when the host reports
      the call's directory; otherwise `magus job exec` does.
    - **The guard no longer refuses a search in favor of a stale graph.** While a
      merge, rebase, cherry-pick or revert is underway, or the guard index was built
      at another revision, symbol-search, grep-reader and search-translation advise
      that the graph is stale and name `magus graph build`. An index from another
      revision now reads as stale for every kind.
    - **A guard verdict ref resolves from a linked worktree.** A hook run from the primary
      checkout stores a repeated deny's full verdict in that checkout's activity trail, so
      `magus query output grd...` in the worktree failed with MGS8001. It now reads the
      primary checkout's trail when its own has no such payload, and a miss names every cache
      directory searched.
    - **The magus-buzz-lang skill's examples run.** They import `encoding/json`, list a
      directory with `fs\listDir` and raise from an exported `main`, and the module list
      names the `encoding/` modules by their import paths. `flags\parse` says a flag is
      declared with its dashes.
    - **`magus describe harness` retires only the host entries a harness spell marked as its own.**
      A hook entry is magus's when it runs a shipped template or its command ends in
      `# magus:harness`; a harness spell declaring any other entry is refused. Every other
      hook stays yours, whatever it mentions.
    - **A harness probe that runs out of time reports `unprobed`, not `uncovered`.** On a
      machine under memory pressure, a guard that answers in a second can miss the 10s probe
      deadline, and `magus agent harness verify` and doctor then called a wired config
      uncovered. A probe that misses its deadline or cannot start now reports `unprobed` and
      names the deadline.
    - **Mercurial no longer sends every conflicted file to the magus merge tool.** With no
      `ui.merge` set, hand-written files fell back to it and stayed conflicted. The tool is
      now registered with `disabled = True`, so only `[merge-patterns]` routes declared
      outputs to it, in Sapling too. A hand file an output's exclusion carves out gets
      Mercurial's `:merge`.
    - **The hook glue runs the magus of the checkout a call runs in.** It looks for `./magus`
      from the event's `cwd` first, so a subagent in its own worktree is judged by that
      tree's binary rather than the session's or an older one on PATH. `HOST_CWD_PATH`
      renames the field.
    - **Imported cache files are 0644, and a running target's crash record survives the same
      target running twice at once.** Stale inflight temp files and staging directories are
      collected.
    - **Installs of magus-managed git, hg and Sapling sections are atomic.** They are
      serialized per repository and leave a hook executable. A torn section marker is an error.
    - **`magus job fork` refuses a deny path no footprint can grade (MGS3031).** A
      declaration deny on a file with no diff driver, on a pattern, or with nothing after
      the `#` is refused, as the same write path already was.
    - **A goal's `expect` is optional in the job schema.** The decoder already filled it in
      (`passed` for a check, `changed` for paths and symbols); `magus job fork --schema` now
      agrees and states the default.
    - **`magus\job.list` measures overlap footprints.** It left every footprint empty, while
      `magus ls jobs -o json` measured them. Both now measure them the same way.
    - **A job row no longer stores `"no_default_charms": false`.** A check that does not opt
      out of the default charms leaves the field out, as it did before the field existed, and
      the job schema reads a field tagged `omitzero` as optional.
    - **The guard's "installed skill" advice no longer fires on a skill's source.** It reads
      the `source: magus` stamp from the frontmatter only, so editing
      `internal/agent/skills/*/SKILL.md` is not mistaken for editing an installed copy.
    - **The job store judges a job by what it declares.** A job queued on a live dependency
      is no longer ended as stale; its clock starts when the dependency ends. A re-fork is
      ordered by its new depends_on, a put adding a directory write path is refused
      (MGS3018), and an abbreviated checkpoint no longer reads as a diverged base.
    - **`magus job wait` accepts a check's own run.** A check resolves against the workspace's
      `default_charms` as `magus run` does, so with default `rw`, `magus run test .` records
      `test:rw` and satisfies a `test .` check. A run of another target, project or charm set
      is still rejected. A check declaring `no_default_charms: true` is satisfied only by a
      `--no-default-charms` run.
    - **`magus job wait` accepts a run recorded in the same second as the job was
      declared.** The declaration time is stored in whole seconds, and the comparison
      rounded it up to the end of its second, so a check run straight after `job fork` or
      `job apply` was rejected as older than the job.
    - **Knowledge shards on the remote tier are signed and verified,** and a run that may not
      write the remote tier stores none.
    - **A lease's read paths widen its write paths instead of replacing them.** A job
      declaring `--read-paths` lost read access to the projects it was leased to edit, so
      the guard's `focus-read` rule denied a worker its own files. The guard now reads the
      same boundary the job store checks: the write paths plus the read paths.
    - **`lease-vcs` graded a parentless row as the orchestrator's.** A worker forked without
      `--parent` could push. A lease now counts as a worker when its row has a parent, when
      a subagent holds it, or when its caller names no session. Only a root session holding
      a parentless row is the root.
    - **`log.level` is honored.** It was overwritten at startup by the level `-v` and `-q`
      imply, so `log.level: debug` in `magus.yaml`, `MAGUS_LOG_LEVEL` and `--log-level` left the
      process at `info`. A verbosity flag still wins when given.
    - **`magus affected` rebuilds the project a renamed file left.** Under `diff.renames`,
      git's default, only the new path was reported. Branch-change notices list both too.
    - **`magus bisect` names the culprit on current git.** Newer git writes
      `# first 'bad' commit:` in the bisect log, which the parser did not read.
    - **`magus\cmd`, `magus\run` and `magus\describe` honor `opts.allow_failure`.** A
      non-zero exit returns the result instead of raising, as `proc\exec` does.
    - **`magus doctor` reports an unregistered merge driver from an explicit boolean.**
    - **`magus doctor` sees the checkpoint hook template again** (template revision 11).
    - **`MAGUS.md` routing indexes are byte-identical on every machine.** Example columns rank
      by the repository's own edges, not the binary's spell catalog; gitignored sources are
      skipped; and the drift gate now catches an output a composed step writes, which let
      five library indexes go stale.
    - **`magus session dispose` refuses without an interactive terminal and is denied to
      agents.** Disposing an attention request records that a PERSON answered it. Outside a
      terminal the CLI exits 2 with the `--ack` sentence, and the guard rule `agent-sign-off`
      (widened from `read-ack`) denies every spelling on every agent channel.
    - **One magus can pipe into another that needs the same project, even through `jq` or
      `tee`.** The reader, proven from the kernel on linux and macOS, waits until the
      upstream is done with its projects, draining the pipe; before, the stage that lost
      the race exited 75. Different projects still stream. A looping pipe is MGS3023.
    - **Every `magus\` type a script names is declared and buildable.** `magus\Context` and
      `magus\Exec` are typed, so a misspelled ctx member fails the check. `magus\DirsOptions{...}`
      and every other record and enum construct at run time, including through an aliased import.
      Callback parameters are typed, so `fs\walk`, `os\withEnv` and the `magus\guard` rules
      refuse a callback of the wrong shape.
    - **A `MAGUS_*` value that does not parse stops the load.** A bad number or duration was
      ignored, and `magus.Open` skipped validating the environment at all.
    - **`magus vcs resolve --against` works in a linked worktree, and paths stage literally.**
      A conflicted merge there read as one that never started, and a file named `*.txt`
      staged every `.txt` file. A merge already underway is now refused.
    - **`magus mcp --help` and `magus status` stop naming an HTTP `/mcp` that is off.** With
      `mcp.http: false` they say so and name stdio and the server socket, and
      `--probe=mcp` fails with that note instead of reporting `serving`.
    - **`mcp.insecure_bind` binds the address it names.** The listener used to bind
      `127.0.0.1` whatever `mcp.address` said, so `0.0.0.0:7391` listened on loopback only. It
      now listens on exactly that address, exposing `/mcp` over plaintext HTTP with a bearer
      token as its only guard; the startup log names the bound address and warns. The operator
      token is still refused from any non-loopback peer.
    - **magus reads no longer take `index.lock`.** Every git call runs with
      `GIT_OPTIONAL_LOCKS=0`, so a status from a guard hook, the daemon or the merge driver
      never rewrites the index while your own `git add`, `commit` or `merge` needs it, which
      failed with "index.lock: File exists".
    - **A target reached through `ctx.needs` runs at `--concurrency 1`.** A needed target
      that ran an install or a child magus waited for the slot its own pool worker held, so
      `magus --concurrency 1 run test` hung until `--target-timeout`. Needed targets and
      per-spell fan-outs now show on the MGS3013 deadlock check, so a pool they wedge is
      refused within seconds.
    - **A nested magus aimed at another workspace runs there.** `magus --root <other> ...` run
      inside `magus run` was handed to the outer run, whose own lock refused it with MGS3007.
      The outer run now declines a run from another workspace, so the nested magus runs it
      under that workspace's locks. A nested run into the same workspace is still refused.
    - **`describe job` and `job wait` no longer panic on a job with goals.** A command that
      loaded the workspace under `--root` as given and again under the path it resolves to
      hit the one-workspace check; both spellings now name one load.
    - **Go ops key their cache on the platform they build for.** The go spell's build, vet,
      test and lint ops fold `GOOS`, `GOARCH`, `GOARM` and `GOAMD64` into their cache keys,
      so a run for another platform no longer replays the host's result.
    - **The `output-pipe`/`output-redirect` exemption for `magus query output` and
      `magus refs --text` now sees past a global flag.** It anchored on the first argument
      after `magus`, so `magus --root <dir> query output <ref> | grep x` was wrongly denied;
      the check now reads argv the same way the read-ack rule does, ignoring where a global
      flag sits.
    - **A missing tool costs one probe and one warning, not one per invocation.** With no
      `node_modules`, every magus call forked `pnpm exec tsc --version` and warned each time.
      The probe cache now records an absent tool like a version, keyed on the lockfile,
      install stamps, `node_modules/.bin/tsc` and the `typescript` link. The warning names the
      cause and the fix.
    - **The `proc\exec` warning about the magus binary fires only when a typed member answers
      the invocation, and names it** (`call magus\run instead`). `magus job exec`,
      `magus queue ls` and other invocations with no member no longer warn.
    - **The push gate grades the checkout a push runs in.** `git -C <dir> push`, `hg -R`,
      `jj -R` and a leading `cd <dir> &&` are graded by that checkout's revision and gate
      record, not the hook's, and a single refspec grades the revision it names. A directory
      only the shell can resolve keeps the advisory.
    - **The queue merges a gated candidate whose only regeneration was a settled conflict.**
      When validation's regeneration wrote nothing, apply kicked the change with
      `KICK_REGENERATION`; it now merges its own rebuild once that rebuild is the commit
      validation gated, still running none of the change's code.
    - **The merge queue no longer kicks a change back for a red it inherited.** A red
      candidate whose base is red on the same projects waits with `WAIT_BASE_RED`, keeps
      its place and gets no comment. The base is gated once a run, however many changes it
      reddens.
    - **Queue candidates are dated from the commits they merge.** They carried a fixed
      2000-01-01 date, so a build that reads HEAD's date as "now" dropped every dated post.
      The plan records the newest date among its base and admitted heads, so the same queue
      still builds the same candidates.
    - **The queue dashboard renders and edits its issue.** It read 100 merged pull requests
      with their checks, which timed out GitHub every run; it reads 40. `--issue` is now
      required, and `--preview` writes only the file, so an unset issue variable fails the job
      instead of passing green with no issue edited.
    - **`magus queue describe --app` works for a private GitHub App.** It reads the App ID
      from an organization's installations where an owner's token lists them; elsewhere it
      names the app's settings page and prints the rerun with `--app <slug>:<id>`. The printed
      key step reads no stdin and deletes the download even when storing fails.
    - **The merge queue starts a validation run only when no unfinished one covers the
      change.** On merge intent, and when CI finishes on a queued head, it skips if a run on
      main is pending or planned later, so triggers no longer cancel each other's pending
      runs. Each decision is a named notice.
    - **The merge queue's gate replays main's cache.** It ran `ci` while main's shards
      stored entries under `ci:gha`, and charms key every step, so an unchanged base
      missed every entry. The gate now runs `ci:gha`, and a test holds its keys equal to
      the shards'.
    - **A queue hook's sandbox carries the base's target grants.** It already took the grants
      of every spell the base resolved; it now adds each target's own `sandbox` declaration.
      The gate stacks a target's sandbox on the hook's, so a grant the hook lacked, like this
      repo's test target reading `/proc`, was unusable.
    - **The merge queue no longer asks the remote for blobs its own merges wrote.** In a
      partial clone, git fetched them as missing and the remote refused, failing the
      candidate as a machine error. `queue validate` and `queue apply` now refuse a partial
      clone, and the queue workflows check out full clones.
    - **A quiet `magus\cmd` that fails carries the child's stderr in its error.** The
      Workflows pass `secrets.GITHUB_TOKEN` as `GITHUB_TOKEN`, which `gh` and the github
      queue provider both read, in place of `GH_TOKEN`.
    - **The agent guard no longer refuses every `node` command.** A spell now names the args
      that select an op from its program's other uses, through the new optional
      `mgs_getModeArgs()`, and `typescript` declares `--test` for `node-test`. `node --test` is
      refused while `node -e` and `node script.mjs` run. Single-purpose tools such as
      `govulncheck` stay refused in every spelling.
    - **`interpreter-rewrite` judges what a script writes, not what it mentions.** A
      script that carries tracked paths as data and writes its report to scratch or
      stdout runs; only a write's destination is checked against the tree.
    - **The refresh hook's `./magus` is looked for where git runs the hook.** The not-indexed
      diagnosis resolved a relative hook binary against the magus workspace root; it now uses
      the repository's top level, which differs when the workspace sits below it.
    - **Symbol lookups finish in workspaces with nested checkouts.** `magus refs`
      skips linked checkouts when checking a missing symbol against workspace text.
      Default text searches classify only files with matches, reducing work in large
      repositories.
    - **`refs` refuses a name several definitions share.** It used to answer for whichever one
      ranked first. It now exits 2 and lists `magus refs '<id>'` for each candidate.
    - **`magus refs <symbol> --rename <new> --dry-run` records nothing.** Grading each file
      through the guard spent the session's once-only advisories, added to its touched
      projects, recorded the policy, registered the acting lease's base and appended
      activity lines. The dry run now reaches the same verdict from a discarded copy of that
      state and writes none of it.
    - **`magus self update` never picks a release candidate on its own.** The release
      index lists candidates apart from stable releases, so no shipped binary moves to
      one, and `--version v0.5.0-rc.1` still installs it by name. Cutting a candidate
      records its notes without consuming the changelog fragments the final release
      needs.
    - **A remote hit is one `cache.hit` record, counted once its replay succeeds.** A local
      replay that fails tries the remote tier before rebuilding.
    - **A remote-tier miss is visible.** Each prints `<project> not in the remote cache
      (out...)` with the producing run's ref, the end-of-run line counts misses, and `-v`
      adds a digest per key-input class.
    - **Replaying a fully cached run is fast again.** Tool probes run concurrently and skip
      tools no selected target drives. Cache keys are unchanged.
    - **`--root` from another directory no longer loads that directory's modules.** A
      magusfile's imports resolve against its project, then the workspace root.
    - **`magus run test . -- -run X` runs only the selected tests.** The workspace's `test`
      target passed explicit arguments to `go test`, which replaced the forwarded ones, so every
      narrowed run executed the whole suite. It now appends its forwarded args and skips the
      coverage floor when narrowed; the spell docs show the `+ args` idiom.
    - **Args after `--` reach only the target you name.** A cached replay's gates and the
      settle step no longer receive them, so `magus run test . -- -run X` stops failing in
      its generate step with `flag provided but not defined: -run`.
    - **A run the machine's build budget refuses says so.** It exited 75 with nothing after
      the header; it now prints `[fail] <project> <target> (not started)` with the MGS3009
      cause naming the holder, and `-o jsonl` emits the `run.target.result` and
      `run.diagnostic` records.
    - **Two runs of one step recorded in the same millisecond resolve to the later one.**
      A bare output ref and `--attempts` broke that tie by a random attempt hash, so they
      could answer with the older run. Each record now stores when it was persisted, and
      that decides the tie.
    - **A sandboxed tool can create its declared cache directory.** The kernel sandbox skipped
      a granted path that did not exist yet, so buf on a fresh machine was denied its cache. A
      missing path a spell or `sandbox.allow` declares writable is now created; a missing
      workspace is still reported.
    - **Sandboxed `go generate` and `go run` work again.** The sandbox grants the Go build cache
      execute as well as read and write: since Go 1.24, `go run` and `go tool` exec the binaries
      they cache there, so every `go run` generator failed with `permission denied`.
    - **A sandboxed child's git runs again on Linux.** Under landlock git died reading the
      unreachable `~/.gitconfig`. Children now get `GIT_CONFIG_GLOBAL=/dev/null` unless
      `GIT_CONFIG_GLOBAL` is passed through, so a commit takes its identity from
      `GIT_AUTHOR_*` and `GIT_COMMITTER_*`. MGS3002 now shows what git said.
    - **`self update` refusals hand back flags that exist.** Downgrade, reinstall and
      unversioned-build errors named `--uf.Force` / `--uf.Yes`, which are struct fields,
      not flags; they now say `--force` and `--yes`/`-y`. A declined install exits nonzero
      instead of 0. The confirmation prompt names the host the release index came from.
    - **`magus` means the checkout's build in a session and under magus.** A new
      `SessionStart` entry puts the session root first on PATH for the agent's Bash tool
      commands, and every child magus starts gets the running binary's directory first on
      PATH.
    - **Share and wrong-method failures answer in the refusal shape.** `/api/v1/share` and a
      wrong method on any `/api/` route send AIP-193 JSON (MGS9012-MGS9014); the console shows
      its message and Help link. Health reports down when every workspace failed, and the
      Windows sign-in line is PowerShell's `Start-Process`.
    - **A shared step no longer inherits one caller's timeout.** It runs under the
      invocation's cancellation. MGS3012 lists what was still admitted.
    - **`diagrams-generate docs` no longer replays stale figures after a rebuild.** It
      keys on the digest of the `magus/figure` source the running binary embeds, which
      `magus version -o json` now reports as `embedded.figure_sha256`, so an engine
      change misses the cache without `--no-cache`.
    - **A worker in its own worktree is graded under its job.** A spawn titled
      `<parent>/<role> <job>` now binds the child's agent id beside the job store, so its
      hooks resolve the lease from any checkout, and its first call records that checkout's
      base. A title's `<job>` also matches `<parent>/<job>`.
    - **`config cache` verbs reach a spell-backed remote tier.** `export` and `import
      --remote`, `prune --remote`, and `query output` publishing and remote lookup now carry
      the workspace's secret resolver, so a backend spell that reads its token through
      `magus\secret` no longer fails with "no secret resolver on this run".
    - **A spell cache restore builds cold when the store cannot answer.** A timeout or
      failed fetch logs the backend, key and elapsed time and stops trying older keys;
      a cancelled run still stops, and a bundle that fails verification is still refused.
      The GitHub Actions blob download gets a 300s bound instead of 30s.
    - **The broker's crash reaper records every hosted service.** A service keyed by its
      workspace path was never written to the journal, so a new broker had nothing to stop.
    - **A step waiting on an upstream target no longer masks a stall.** Only a moving step
      beats the heartbeat; MGS3013 and MGS3012 still catch a wedge.
    - **Concurrent graph builds no longer leave the knowledge graph stale.** Two queries
      in one checkout could leave the manifest naming a shard the file on disk did not
      hold, and later builds never rewrote it.
    - **A remote output fetched by ref is filed by rename.** A concurrent reader never sees
      it half written, and a review's seen threads never come back as new after two
      processes save them.
    - **A service record survives the crash it exists for.** The broker's journal was
      rewritten in place, so a power loss could tear a record that the next broker then
      deleted without stopping the service.
    - **`magus session load` stops waiting for another loader when it is interrupted.**
    - **Overlapping runs no longer erase each other's test history.** The volatility and
      duration history is shared by every workspace on the machine; a run wrote back the
      copy it loaded before it started, dropping outcomes another run recorded meanwhile.
      `magus config history passed` and `import` had the same race.
    - **`magus-utils cut` flushes the release manifest before it deletes the fragments.** A
      manifest that fails to land leaves no temp file in `releases/`.
    - **The filesystem remote cache answers a push of a key it holds as already stored.**
      Every other backend already does.
    - **The operator token is flushed when written.** A crash cannot leave an empty token
      file the server refuses to start on.
    - **A trail rotation keeps `events.jsonl` readable at the mode it was created with.** It
      also flushes the file, so a crash mid-rotation cannot empty the trail.
    - **Review receipts recorded at the same time no longer drop each other.** The console
      and `magus diff --ack` both write the store; the later writer erased what the other
      had just recorded.
    - **A reverted edit no longer leaves the symbol index describing the edit.** The scip
      step replayed from cache for the restored sources while the index still held the
      edited ones, so `magus refs` answered stale lines. A replay now requires the index
      its run wrote, and reindexes otherwise.
    - **Three guard rules match their catalog entries.** `cd` fires only ahead of a magus
      command. `cache-dir-write` grades only write targets, so `rsync --exclude .magus` and
      an interpreter's quoted data pass. `stage-all`'s description now names `-u`, `.` and
      the long forms its matcher already covered.
    - **A checkpoint token now covers untracked files.** `magus vcs checkpoint -o name` and
      `magus job exec` used to name a tree holding only new files by the digest of an empty
      patch. The digest after the `+` now includes untracked files, so a worker on the handed
      revision reads as `revision-match`. A tree with only tracked edits keeps its token.
    - **The unchanged-inputs hint no longer reads as a verdict.** It prints before the
      target runs, so it now says the target runs again, and it names the failed attempt
      rather than the step ref, which moved to the new run's result once that run landed.
      The target always re-ran; the exit status was already that run's own.
    - **magus binds and dials a unix socket at any path length on linux.** A path past
      the 108 bytes `sun_path` holds goes through its directory under `/proc/self/fd`.
      macOS refuses such a path, naming its length and the limit. The broker and server
      use this, so a deep `TMPDIR`, such as a merge queue candidate's, no longer breaks
      them.
    - **An unrecognized boolean in a `MAGUS_*` variable is an error** instead of silently
      keeping the previous value.
    - **An unrecognized spawn decision ranks as deny,** not allow, when two rules' verdicts
      merge.
    - **A job with a checkout root but no registration counts as never taken.** It ends past
      `jobs.stale_after` like any other job nobody took.
    - **`vcs\cmd` ran version control unguarded under a lease.** It now asks `lease-vcs`
      before it runs, and refuses outright when a lease is acting and no guard is linked in.
    - **A vulnerability database release no longer invalidates every Go target's cache.** The
      database date keys only targets that run govulncheck.
    - **A worker can fork a child of its own job.** The guard refused every `magus job fork`
      and `op=fork` under a lease, though the job store grades exactly that. A row naming the
      caller's lease as `parent` now reaches the store, which refuses a child reaching past
      its parent's paths.
    - **A worker can wait on a job it forked.** `magus job wait` and `magus\job.wait`
      refused every call from a checkout holding a lease, so a worker could never verify its
      own child. A holder now waits on any job below its lease. Its own job, a sibling's, an
      ancestor's and any unrelated job stay refused.
    - **Workspace load is 10x faster.** A bare library import is no longer executed as a
      candidate spell, Buzz tokens are shared across sessions, and `magus ls` loads once.
      A run skips re-evaluating a magusfile that does not export the target, and an exact
      source no longer walks the tree. `magus ls` here: 1.45s to 0.11s.

    ### Security

    - **Breaking: the remote cache refuses pre-domain `ed25519` signature envelopes.** They
      signed the manifest alone, so a store could replay a genuine entry with its log and
      descriptor swapped or stripped. Every magus from 0.4.0 signs the domain-separated form;
      an entry signed by 0.3.x is now a miss and rebuilds.
    - **Breaking: every merge-queue hook keeps its caches in its candidate's own home.** A
      gate or regeneration gets `HOME`, the XDG directories, `TMPDIR` and magus's cache
      inside the candidate's box, and the queue refuses a hook whose sandbox could write
      outside it. `--scratch-env` is removed with nothing to replace it; drop the flag.
    - **Breaking: queue hooks run in the base's sandbox.** The gate, the regeneration and a
      `--facts` command run under the base's `sandbox` policy, at least `best-effort`,
      rooted at their checkout: landlock confines their files on Linux, and everywhere their
      environment is the sandbox's. `--sandbox=required` refuses a hook the kernel cannot
      confine; `hack/ci/merge-queue.buzz` passes it.
    - **The daemon's unauthenticated `/console/` serves only the app shell.** It served every
      built console file, including the demo graph JSON holding the whole knowledge graph and
      its notes. Other files and directory listings now return 404, on loopback and on the LAN
      share, and an attached graph explorer never falls back to that demo data.
    - **A rule kept only for its side effects is no longer dropped.** When a hook loads
      the root magusfile for its rules, an import nothing references is kept whenever its
      file, or one it imports, reaches `magus\guard`, and so is a registration through an
      alias of `magus\guard`. A type named only in an annotation keeps its declaration.
    - **The agent guard no longer runs compiled rules it read from the working tree.**
      Compiled guard rules are kept under `$XDG_CACHE_HOME/magus/buzz-bytecode`, keyed by
      build and workspace, instead of `.magus/`. The load of the approved (committed) rules
      uses no stored chunk. A new build removes chunk directories no build has used for a
      day.
    - **The guard denies an agent-attributed session that edits the host's hook wiring, not
      just a leased one.** `.claude/settings.json` and its per-host equivalents could disarm
      every rule from the next session on; an unleased subagent was only advised. A person's
      own session, or an orchestrator relaying for one, is still advised.
    - **A leased worker can no longer slip past the harness refusal or borrow another job.**
      A global flag's value (`magus --root . agent harness install`) or a single-dash word with
      an `h` (`-o=template=hi`) hid the command from the guard. A spawn title naming a job
      outside the spawner's own lease tree is recorded as untrusted and attributes nothing.
    - **Failed authentication on `/mcp` is throttled.** Each caller, keyed by `Origin` or else
      its peer, may fail 20 times a second in bursts of 40, then gets `429` with
      `Retry-After` and the new code MGS9030 (too many failed authentications).
      A valid token is never throttled.
    - **`magus\job.put` writes as its caller, not the server.** Over stdio that is the
      lease `magus mcp` inherited. Over HTTP it is the `magus.lease` member of the
      request's `baggage` header, and a request without one may read but not write.
      `buzz` scripts and served `next` hints use the same caller.
    - **Loopback `/mcp` trusts its bearer token alone.** It no longer checks `Host` or
      `Origin` (no MGS9007 there) and answers any origin's CORS preflight, so a browser page
      with a token works like any other MCP client. A page without a token, a DNS-rebinding
      page included, still gets `401`, CORS never allows credentials, and the console's routes
      keep their checks.
    - **A refused `/mcp` request is unreadable to a page.** Only an authenticated response
      carries `Access-Control-Allow-Origin`, so a `401`, `403` or `429` reaches a cross-origin
      page as the same network error as a closed port.
    - **Token checks answer from memory.** The server keeps the operator file and the token
      store in memory, reloaded when either changes on disk and at least once a second, so a
      refused token costs no file read. A revoke made by another process takes effect within a
      second.
    - **The merge queue trusts less of what a change controls.** A review counts only from
      an account that can push, at the commit it approved; `describe` reports
      `required_approvals`. The regeneration proof covers what merged beneath a candidate
      and treats no extension as data. Regeneration follows no committed symlink, and update
      commits carry the queue's committer.
    - **OpenTelemetry exporters no longer expose endpoint URLs in info logs.** Update
      OpenTelemetry Go modules to v1.45.0, which fixes GO-2026-6505.
    - **`magus queue apply` follows only the base's own validation run.** A pull
      request's run executes its own copy of the queue workflow and could upload a forged
      plan and verdicts that merged ungated. Apply now refuses any run but `--workflow`
      started by a push or dispatch on `--base` of its repository (MGS3027), and
      `queue-apply.yaml` dispatches main's run instead.
    - **`magus queue apply` checks the plan against what it reads itself.** A plan naming
      another base or remote, a base commit the base lacks, or a stack base that is not
      the reviewed head beneath stops applying (MGS3028): a forged stack base could merge
      a revert of the base. Apply writes the squash message itself.
    - **The merge queue's own git no longer runs what a change's hook configures.** Git in
      a candidate reads the repository recorded when the checkout was made, with fsmonitor
      and submodule recursion off; a rewritten `.git` refuses the change. Hooks get the
      shared object store read-only, and every head is fetched before the first hook.
    - **Queue hooks run on an allowlisted environment.** A hook inherits only the sandbox's
      default names and the base's `sandbox.env.passthrough`, so no token or Actions file
      command reaches it. A unit starting with `-` or holding a line break is refused, and a
      hook's process group is reaped without a race.
    - **A merge queue kick-back shows what validation reported as text.** The claim, file
      names and commits render as code spans or fences no backtick run can close, and the
      facts line escapes every character that could end its HTML comment. The reproduce
      lines come from `magus queue apply --reproduce-gate` and `--reproduce-regenerate`,
      never from a verdict.
    - **Files that run code after the run are write-protected.** Under any mode but `off`,
      magus's checks refuse writes to `.git/hooks`, `.git/config`, `.git/info`, `magus.yaml`,
      mise and asdf pins, `.envrc`, `.claude/`, `.cursor/`, `.mcp.json`,
      `.vscode/tasks.json` and git hook managers' config. Landlock cannot deny inside a
      grant, so a child can still write them.
    - **Buzz's own `os` and `io` go through the sandbox,** each run's `env\set` stays in
      that run, the proc socket demands a token (`MAGUS_PROC_TOKEN`), and the lease marker
      moved out of the cache dir a confined run can write.
    - **The sandbox confines each child, not magus.** A launcher applies the landlock
      ruleset to every process a run starts, so a server serves each workspace under its
      own policy. `required` needs landlock ABI 3 (Linux 6.2), else MGS2012. MGS2010 now
      means a nested or forwarded run asked for a weaker mode.
    - **Sandbox path checks follow symlinks the way the kernel does.** A `..` after a
      symlink, a write through a dangling link, and `fs\symlink` to a path outside the
      policy no longer pass the binding-level check.
    - **Breaking: no job holding a secret or a write token restores an Actions cache.** A
      merge queue hook can read the runner's runtime token and plant cache entries in the
      default branch's scope, so trusted jobs now install cold. `setup-magus` restores run
      history only with `restore-history: 'true'`. A conventions test enforces both.
