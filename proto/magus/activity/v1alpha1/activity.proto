syntax = "proto3";

// Package magus.activity.v1alpha1 is the versioned wire contract for the magus activity trail: a
// time-ordered record of consequential actions taken against a workspace or its server, for
// accountability. It is a sibling of the magus tool-page contracts (magus.viewer.v1alpha1,
// magus.status.v1alpha1). It is deliberately NOT the execution journal (magus.viewer.v1alpha1, what a
// build ran) nor metrics (magus.metrics.v1alpha1, aggregate counters): activity answers "who did
// what, and did it succeed". It also records agent-host command observations so maintainers can
// understand which tools and interfaces agents actually choose. A pre-execution hook cannot know
// whether its requested command later ran, so that event captures the guard decision rather than
// inventing an execution result. This is local workflow telemetry, not a security boundary.
// buf-breaking gates this file. The on-disk store is JSONL (a hand-rolled struct, snake_case,
// matching the journal); this proto is the WIRE format only, mapped from that struct in the handler.
package magus.activity.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "magus/query/v1alpha1/query.proto";

// Kind classifies the recorded action by its source. A reader switches on kind; new sources
// add a value without changing the envelope.
enum Kind {
  KIND_UNSPECIFIED = 0;
  KIND_MCP_TOOL_CALL = 1;   // an agent invoked an MCP tool over the server (emitted)
  // The remaining sources share this envelope; each is emitted once its producer records into
  // the trail, with no schema change. A reader/dashboard selects the kinds it wants (see
  // ActivityQuery.kinds), so one stream serves the agent view, a jobs view, and a full log.
  KIND_JOB = 2;             // a server background job: SCIP reindex, graph build, VCS refresh (emitted)
  KIND_CONFIG_CHANGE = 3;   // reserved: magus.yaml changed on reload, or a `magus config set` mutation
  KIND_TOKEN_LIFECYCLE = 4; // reserved: a connector token was minted or revoked
  KIND_SANDBOX_DENIAL = 5;  // magus's own read/write/exec check refused an access; not a kernel-landlock denial, which reports nothing back (emitted)
  KIND_MEMORY = 6;          // a console MemoryService action on the durable magus_memory files (reads audited too)
  // An agent host observed a shell or file-tool invocation. The request blob contains normalized
  // host/tool/session data and the command or path; the response blob contains the guard decision.
  // OUTCOME_OK means the observation was recorded, NOT that a pre-hooked command later succeeded.
  KIND_AGENT_COMMAND = 7;
  // A run made a credential reachable: a magusfile granted one to a destination host, or
  // opened a loopback endpoint carrying one. The event names the REFERENCE, the host and
  // the header, never the value - a grant resolves nothing at declaration time, and
  // resolving one in order to log it would defeat that. It is the governance half of a
  // fact the execution journal already records per invocation; this is what connects an
  // agent's tool call to the credential it made spendable.
  KIND_CREDENTIAL_GRANT = 8;
  // An orchestrating agent handed work to a sub-agent. The request blob carries the CONTEXT
  // that was handed over - the lease's whole point, and routinely kilobytes, so only its
  // ref rides the event. There is no response blob and no guard decision: a spawn is an
  // observation, not a judged surface. OUTCOME_OK means the handoff was observed, NOT that the
  // sub-agent later succeeded.
  KIND_AGENT_SPAWN = 9;
  // The console NotesService door onto the workspace's human-authored notes. The service has no
  // write path - a note's whole value is the guarantee that a person wrote it - so every event
  // under this kind is a READ, audited because this is the only door that can serve the PRIVATE
  // note store, which lives outside any repository and which nothing else attributes.
  KIND_NOTES = 10;
  // A path under a job's declared write paths changed, as the server's file watcher saw it.
  // action is the repo-relative path and unit is the job whose write paths cover it. The producer
  // is the FILESYSTEM, not an agent: this is the one kind that needs no cooperation from
  // the worker being watched, which is the whole reason a person can see what a worker is
  // doing without asking it. An empty unit means no live job covered the path.
  KIND_FILE_CHANGE = 11;
  // A run magus recorded against a job: its check, one of its completion gates, or the
  // server's own last run of a catalog job. action is the rendered command and preview
  // names which of the three it was. OUTCOME_ERROR means the run failed, which is the one
  // kind here where the outcome is a fact about the work rather than about the recording.
  KIND_RUN = 12;
  // The effective workspace guard rules changed. action is loaded, tightened, loosen_pending,
  // committed or removed; the request blob names each source file by its working-tree and
  // approved content ids, never its body. Written only on a change, so these rows read as the
  // lineage of the workspace's policy, and a verdict event's policy digest points at one.
  KIND_GUARD_POLICY = 13;
}

// Outcome is how the action ended.
enum Outcome {
  OUTCOME_UNSPECIFIED = 0;
  OUTCOME_OK = 1;
  OUTCOME_ERROR = 2;
}

// ActivityEvent is one recorded action - the atom of the trail. The envelope (time, actor,
// kind, action, outcome) is common to every kind; the payload refs point into the activity
// blob store (fetched via GetPayload) so a large request/response body never bloats the line.
// For an MCP tool call: action is the tool name, request is the arguments, response is the
// result. For an agent command observation: action is the host tool name, request is the
// normalized invocation, and response is the guard decision. For a token lifecycle event:
// action is the RPC method and the refs are empty.
message ActivityEvent {
  google.protobuf.Timestamp time = 1;    // when the action occurred
  Kind kind = 2;
  string actor = 3;                      // the origin fields below as one label: "eli via claude-code", "server", "unattributed"
  string action = 4;                     // the specific action: a tool name, "connector.create"
  Outcome outcome = 5;
  string error = 6;                      // error text when outcome is OUTCOME_ERROR
  google.protobuf.Duration duration = 7; // wall-clock, on call-shaped actions

  // Content-addressed payload refs, provenance-prefixed (an MCP payload is "mcp<hash>").
  // Empty when the action has no such body. Resolve with GetPayload.
  string request_ref = 8;
  string response_ref = 9;
  string preview = 10;                   // opening characters of the response, for list views
  int64 request_bytes = 11;
  int64 response_bytes = 12;

  // The workspace root the action pertained to; empty for a server-wide action not bound to one
  // workspace (an MCP call). The trail is a single server-wide stream, so this disambiguates a
  // job by its workspace rather than fragmenting the record across per-workspace directories.
  string workspace = 13;

  // The agent host behind the action and that host's own session id, empty when the producer
  // could not know them. The name is an opaque label the caller supplies, not a set magus
  // enumerates: a hook is told its host by the wrapper that ran it, because no local process can
  // discover which agent host started it. An MCP call is attributed from the client's handshake
  // name, or its HTTP User-Agent when it recorded none, mapped into this same field so one view
  // can group both kinds by host rather than switching on kind first.
  //
  // They ride the EVENT rather than the request blob, which also carries them: a 200-row feed
  // grouped by host must not cost 200 GetPayload calls.
  string host = 14;
  string session = 15;

  // The work-ledger lease this action belongs to, empty when the producer could not correlate
  // one. The field keeps the "unit" spelling; magus calls the concept a lease. Set today only by
  // KIND_AGENT_SPAWN, and only when the handed context declared it: no host event names a magus
  // lease, so the producer scans the lease prompt for a documented marker line
  // ("lease: <id>") instead. Correlation is COOPERATIVE - an orchestrator that wants
  // the join writes the marker, and one that does not leaves this empty, which is a missing join
  // rather than a wrong one. It rides the event rather than the blob for the same reason host and
  // session do: joining a page of rows to a ledger must not cost a GetPayload per row.
  string unit = 16;

  // On a KIND_FILE_CHANGE, the leases that BOTH declared this path, set only when more than
  // one did. unit is then empty, because there is no answer to "whose write is this": the
  // write paths are meant to be disjoint and this path is the evidence they are not.
  //
  // A repeated field rather than a sentence in preview, because a reader watching one lease
  // has to ask "am I one of these" on every row, and parsing prose to answer it is how the
  // one event a damaged plan most needs to surface gets dropped. A filter on units matches a
  // contested event that names one of them, which is deliberate: the event is attributed to
  // nobody and is still that reader's business.
  repeated string contested = 17;

  // Where the action came from, one field per channel, so a reader never guesses which kind of
  // value a single string holds. user is the OS account the recording process ran as, read from
  // the OS. entry_point is where the request entered magus (cli, hook, mcp, rpc, server).
  // credential is the bearer a server request presented, as the server verified it. agent is the
  // host's subagent id within session. actor above is these rendered as one label for a row
  // head.
  string user = 18;
  string entry_point = 19;
  Credential credential = 20;
  string agent = 21;

  // Which source answered unit (the lease), where the producer resolved one: flag, agent (the
  // spawn magus recorded for the calling subagent), marker (the checkout's `magus job exec`
  // binding), contested (the marker, over a BAGGAGE claim naming another lease), or env (the
  // BAGGAGE claim alone). Empty on events whose unit is a prompt's lease line. A new field, so
  // it takes magus's word for the concept rather than unit's.
  string lease_from = 22;
}

// Credential is a verified bearer, never its secret: which class it is, its stable id, the name
// it was minted under, and the grant it held when the action was recorded. The id is the
// identity; the name is a label a later token can reuse.
message Credential {
  string class = 1;   // operator, token or share
  string id = 2;      // first 8 hex of the secret's SHA-256
  string name = 3;    // empty for the operator and a share link
  string grant = 4;   // e.g. "console=write" or "mcp=write"
}

// ActivityService serves the trail to a viewer, mirroring magus.viewer.v1alpha1's shape: List a
// page of events (newest first), Get a payload blob by ref. Mounted on the console's
// human-facing API surface, never under /mcp (the agent protocol surface).
service ActivityService {
  // ListActivity returns a page of recent events, newest first, narrowed by filter.
  rpc ListActivityEvents(ListActivityEventsRequest) returns (ListActivityEventsResponse);
  // GetPayload returns a stored request or response body by its ref (from an ActivityEvent).
  rpc GetPayload(GetPayloadRequest) returns (Payload);
  // WatchActivityEvents follows the same trail forward, OLDEST first, until the caller
  // hangs up. It is the polling half of ListActivityEvents turned inside out: the console
  // and `magus job watch` both want "tell me when something happens", and asking a list
  // endpoint that question costs a full retained-window scan per second per reader.
  //
  // It merges three producers into the one envelope, which is why the filter is where it
  // is rather than on the client: file changes the server's watcher saw, attributed to the
  // job whose declared write paths cover the path; the guard's tool-call observations,
  // attributed by the lease the hook resolved; and the runs recorded against a job. A
  // reader narrows by job, session or path and gets one time-ordered stream of all three,
  // so "what is that worker doing" is one subscription rather than three.
  rpc WatchActivityEvents(WatchActivityEventsRequest) returns (stream ActivityEvent);
}

// ActivityQuery narrows the listing server-side. Fields AND together; repeated values within
// a field OR; the time window bounds it.
message ActivityQuery {
  repeated Kind kinds = 1;              // restrict to these action kinds
  repeated string actors = 2;          // restrict to events whose origin names one of these in a single field: user, host, agent, the credential's class, id or name, or entry_point, matched exactly (never the actor label)
  repeated string actions = 3;         // restrict to these actions (e.g. tool names)
  magus.query.v1alpha1.TimeRange time = 4;   // action-time window
  // The three narrowings a person watching a worker asks for. They are here rather than on
  // the watch request alone because the same question is worth asking of history: "what has
  // this job been doing" and "what is it doing now" differ only in which verb you call.
  repeated string units = 5;     // restrict to these leases (magus calls one a job)
  repeated string sessions = 6;  // restrict to these host session ids
  // Restrict to file changes under these paths. A path matches the way a declared write
  // path does, so naming a directory answers for what is under it. It selects FILE events
  // only: a tool call and a run are attributed by lease, not by path, and quietly returning
  // them for a path filter would report reach nobody asked about.
  repeated string paths = 7;
}

message ListActivityEventsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 2;
  ActivityQuery filter = 3;
}
message ListActivityEventsResponse {
  repeated ActivityEvent events = 1;
  string next_page_token = 2;  // set when more events remain
}

// WatchActivityEventsRequest subscribes to the merged feed.
message WatchActivityEventsRequest {
  ActivityQuery filter = 1;
  // backfill is how many already-recorded matching events to send before following. It is
  // what stops a reader opening a drawer onto a blank panel and reading it as "nothing has
  // happened": a job that has been running for an hour has a past, and a stream that starts
  // at now hides all of it. Zero means none; the server caps it.
  int32 backfill = 2 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
}

message GetPayloadRequest {
  // A provenance-prefixed content ref: a short lowercase source tag followed by hex.
  string ref = 1 [(buf.validate.field).string.pattern = "^[a-z]{2,8}[0-9a-f]+$"];
}
// Payload is one stored request or response body, resolved from an ActivityEvent's ref.
message Payload {
  bytes body = 1;
  int64 size_bytes = 2;
}
