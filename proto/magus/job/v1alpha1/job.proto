syntax = "proto3";

// Package magus.job.v1alpha1 is the versioned wire contract for the daemon's CONTROL surface: the
// mutating sibling of the read-only console services (magus.activity.v1alpha1, magus.status.v1alpha1,
// magus.viewer.v1alpha1, magus.metrics.v1alpha1). Its RPCs submit background maintenance jobs - reconcile
// the knowledge graph, rotate the activity trail, clear the build cache - through the same
// fire-and-forget, coalescing mechanism the daemon uses for any adopted work, so an identical
// in-flight job is never started twice. Every RPC requires the daemon bearer token; the service
// is mounted behind the same guard as /mcp and never served unauthenticated. buf-breaking gates
// this file: fields and RPCs may be ADDED (old clients ignore unknown fields), never renumbered
// or removed. The response carries a full metadata snapshot (last run, current size) so a client
// renders a job's state without a second call.
package magus.job.v1alpha1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";

// JobService is the daemon's control surface for background maintenance jobs. Trigger RPCs
// submit a job and return immediately; ListJobs reports every job's state. Read surfaces stay on
// the per-domain services - this one only mutates.
service JobService {
  // ListJobs returns every registered job with its running state, last run, and target size.
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  // RunJob submits the named job and returns immediately: whether it started or coalesced
  // onto an identical in-flight run, where to watch it, and the job's fresh metadata.
  //
  // One RPC over N job resources rather than one RPC per job. The four verbs this replaced
  // were the same operation four times, which is why they had to share a response type and
  // why buf.yaml had to waive RPC_REQUEST_RESPONSE_UNIQUE and RPC_RESPONSE_STANDARD_NAME to
  // let them. Both waivers are gone with them. The property that argued for sharing the
  // response - that adding a job must not touch this file in four places - is stronger here:
  // a new job is a registry entry and NO schema change at all.
  rpc RunJob(RunJobRequest) returns (RunJobResponse);
}

// SubmitState is the disposition of a trigger RPC. Both values are SUCCESS outcomes returned in a
// normal response (not an error): coalescing an identical job is expected, not a failure. Real
// failures (unknown job, missing token, internal error) use the transport's error codes instead.
enum SubmitState {
  SUBMIT_STATE_UNSPECIFIED = 0;
  SUBMIT_STATE_SUBMITTED = 1;       // a new background job was started
  SUBMIT_STATE_ALREADY_RUNNING = 2; // an identical job was already in flight; coalesced, not restarted
}

// RunJobResponse reports what the submission did: whether the job started or coalesced, the
// invocation id and console deep-link for its live log, and the job's fresh metadata snapshot so a
// caller can render "last rotated 3m ago, trail 2.1 MB" without a follow-up call.
message RunJobResponse {
  SubmitState state = 1;
  string invocation_id = 2; // the running job's invocation id (the new one, or the coalesced one)
  string console_url = 3;   // deep-link to this invocation's live log; empty when no console is mounted
  Job job = 4;              // the job's descriptor plus its last-run and current-size metadata
}

// JobHolder is who runs a job. One listing carries both kinds, so a reader can tell the
// daemon's own housekeeping from work a session was handed without asking a second door.
enum JobHolder {
  JOB_HOLDER_UNSPECIFIED = 0;
  JOB_HOLDER_DAEMON = 1;  // the daemon's own maintenance catalog
  JOB_HOLDER_SESSION = 2; // work an orchestrator declared for somebody else to hold
}

// Job is the full picture of one job: what it is, who holds it, whether an instance is
// running now, its most recent run, and the current magnitude of the resource it maintains.
//
// ONE message for both kinds. A catalog job fills the description and target; a delegated
// one fills the lanes and the check it was given; both carry id, holder and state, which is
// what lets a client render the two in one list without branching on which it has.
message Job {
  // name is the resource name, "jobs/{job}" - e.g. "jobs/rotate-activities". The bare job id
  // is the last segment, and is what the CLI's `job run <name>` leaf takes.
  string name = 1;
  string description = 2;
  bool running = 3;        // an instance is in flight right now
  JobRun last_run = 4;     // most recent run; unset if the job has never been submitted
  ResourceSize target = 5; // current size of what the job operates on (trail, cache, or logs)

  string id = 6;        // the bare row id, without the "jobs/" collection segment
  JobHolder holder = 7; // who runs it
  // state is the row's lifecycle position: declared, running, exited, pass, fail or
  // no_return. A string rather than an enum because the vocabulary is the job store's and a
  // second closed set here would be a second place to add a value to.
  string state = 8;

  // The facts a DELEGATED job carries, empty on a catalog job. These are what an
  // orchestrator declared, never a verdict magus reached.
  string goal = 9;
  string parent = 10; // the job this one was handed out under, empty for a root
  string model = 11;
  string check = 12; // the one check this job runs, rendered as the command that runs it
  repeated string write_paths = 13;
  repeated string deny_paths = 14;
  repeated string read_paths = 15;
  repeated string depends_on = 16;
  bool read_only = 17;
  string checkpoint = 18;
  repeated JobRelease releases = 19;
  int64 created = 20; // unix SECONDS, as the store records them
  int64 updated = 21;
}

// JobRelease is a path a job gave up, and the version of it the next one inherits. The
// digest is the file's sha256 when there was a file; "absent" and "dir" are carried through
// as they are rather than turned into a hash-shaped lie.
message JobRelease {
  string path = 1;
  string digest = 2;
  int64 released_at = 3; // unix seconds
}

// JobOverlap is one pair of jobs whose declared write paths intersect. Derived on every
// read and stored nowhere, and never a verdict: a client draws it and the reader decides
// whether their plan meant it.
//
// Each side's intersecting declarations come separately, because the two are rarely the
// same string ("internal/job" and "internal/job/store.go" intersect) and a reader who
// cannot tell which job claimed which has nothing to act on.
message JobOverlap {
  string job_a = 1;
  string job_b = 2;
  repeated string paths_a = 3;
  repeated string paths_b = 4;
}

// JobRun is one completed execution of a job.
message JobRun {
  string invocation_id = 1;
  google.protobuf.Timestamp end_time = 2;
  google.protobuf.Duration duration = 3;
  bool ok = 4;          // false when the run errored
  string error = 5;     // error text when ok is false

  // Per-run deltas, populated only by jobs that measure them (a rotate reports what it dropped).
  // Zero when the job does not report a delta yet - additive, so a job starts reporting later
  // without a contract change.
  int64 items_removed = 6;   // e.g. trail events pruned, cache entries invalidated
  int64 bytes_reclaimed = 7; // on-disk bytes freed
}

// ResourceSize is the current magnitude of a job's target resource, for a caller to show how much
// there is to maintain (and to judge whether a rotate/clear is worth running).
message ResourceSize {
  int64 size_bytes = 1; // total on-disk bytes
  int64 item_count = 2; // logical item count (trail events, cached entries, run logs)
}

message RunJobRequest {
  // name is the job's resource name, "jobs/{job}". An unregistered name is a NotFound error,
  // not a SubmitState - the enum reports how a VALID submission resolved, and a name nobody
  // registered never became a submission.
  string name = 1 [(buf.validate.field).string.pattern = "^jobs/[a-z][a-z0-9-]*$"];
}

// Paginated by contract so growth never forces a breaking change, though the registry is a
// fixed handful today and one page always holds it.
message ListJobsRequest {
  int32 page_size = 1 [(buf.validate.field).int32 = {gte: 0, lte: 1000}];
  string page_token = 2;
}
message ListJobsResponse {
  repeated Job jobs = 1;      // every job, catalog and delegated, in a stable order
  string next_page_token = 2; // empty while one page holds the registry
  // overlaps are the pairs of jobs claiming common ground, derived from jobs on every read.
  repeated JobOverlap overlaps = 3;
}
