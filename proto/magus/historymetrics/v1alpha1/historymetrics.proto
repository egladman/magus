syntax = "proto3";

// Package magus.historymetrics.v1alpha1 is the versioned wire contract for workspace
// history metrics the console dashboard paints as one board: hotspots, affinity,
// ownership, and trend from one cached git-log scan; volatility from run-outcome
// history; model_tiers from finished jobs; conformance from the symbol graph. They
// travel together so one poll fills the board and the four git metrics share one
// window. Domain types in types/ stay free of protobuf; the handler maps at the
// boundary. Nested messages are domain nouns; only this RPC's Request/Response
// carry those suffixes (ADR 0022).
package magus.historymetrics.v1alpha1;

import "google/protobuf/timestamp.proto";
import "magus/graph/v1alpha1/graph.proto";

// HistoryMetricsService serves the assembled history metrics to the console.
service HistoryMetricsService {
  // GetHistoryMetrics returns every metric field in one response.
  rpc GetHistoryMetrics(GetHistoryMetricsRequest) returns (GetHistoryMetricsResponse);
}

message GetHistoryMetricsRequest {}

// GetHistoryMetricsResponse is the RPC envelope only: each field is a domain metric.
// volatility / model_tiers / conformance stay absent (not empty) when their source
// was never recorded or the server held no workspace.
message GetHistoryMetricsResponse {
  Hotspots hotspots = 1;
  Affinity affinity = 2;
  Ownership ownership = 3;
  Trend trend = 4;
  Volatility volatility = 5;
  ModelTiers model_tiers = 6;
  Conformance conformance = 7;
}

message Hotspots {
  string definition = 1;
  int32 commits = 2;
  string since = 3;
  repeated ProjectNode nodes = 4;
  repeated FileHotspot files = 5;
}

message ProjectNode {
  reserved 6;
  reserved "exclusive";

  string path = 1;
  string name = 2;
  string spell_name = 3;
  repeated string children = 4;
  string dir = 5;
  int32 blast_radius = 7;
  int64 duration_ms = 8;
  int32 churn = 9;
  int32 authors = 10;
  google.protobuf.Timestamp last_commit_time = 11;
}

message FileHotspot {
  string path = 1;
  int32 commits = 2;
  int32 complexity = 3;
  int32 score = 4;
  int32 authors = 5;
  google.protobuf.Timestamp last_commit_time = 6;
  int32 moves = 7;
}

message Affinity {
  string definition = 1;
  int32 commits = 2;
  string since = 3;
  repeated CoChange pairs = 4;
}

message CoChange {
  string a = 1;
  string a_name = 2;
  string b = 3;
  string b_name = 4;
  int32 count = 5;
  bool hidden = 6;
}

message Ownership {
  string definition = 1;
  int32 commits = 2;
  string since = 3;
  repeated OwnershipEntry projects = 4;
}

message OwnershipEntry {
  string path = 1;
  string name = 2;
  int32 commits = 3;
  int32 authors = 4;
  string primary = 5;
  int32 primary_share = 6;
  bool bus_factor_1 = 7;
  bool stale = 8;
  google.protobuf.Timestamp last_commit_time = 9;
}

message Trend {
  string definition = 1;
  int32 commits = 2;
  string since = 3;
  repeated TrendEntry projects = 4;
}

message TrendEntry {
  string path = 1;
  string name = 2;
  int32 recent = 3;
  int32 earlier = 4;
  int32 delta = 5;
}

message Volatility {
  double threshold = 1;
  repeated VolatilityTarget targets = 2;
}

message VolatilityTarget {
  string project = 1;
  string target = 2;
  double score = 3;
  bool volatile = 4;
  int32 pass = 5;
  int32 fail = 6;
  int32 volatile_count = 7;
  int32 samples = 8;
  google.protobuf.Timestamp last_pass_time = 9;
}

message ModelTiers {
  string definition = 1;
  repeated ModelTierRecord rows = 2;
}

message ModelTierRecord {
  int32 rank = 1;
  string model_tier = 2;
  string kind = 3;
  int32 jobs = 4;
  int32 pass = 5;
  int32 fail = 6;
  int32 no_return = 7;
  double pass_lower = 8;
  double checks_per_job = 9;
  double forks_per_id = 10;
  double rework_per_job = 11;
  double widenings_per_job = 12;
  optional double mean_cost_usd = 13;
  optional int64 median_tokens = 14;
  int32 first_attempts = 15;
  int32 first_pass = 16;
  double first_pass_lower = 17;
  int32 not_retryable = 18;
}

message Conformance {
  reserved 3;
  reserved "stale";
  string definition = 1;
  repeated ConformanceRow rows = 2;
  int32 excluded = 4;
  magus.graph.v1alpha1.Answer answer = 5;
}

message ConformanceKey {
  string metric = 1;
  string population = 2;
  string scope = 3;
}

message ConformanceRow {
  reserved 9, 11, 12;
  reserved "anchor", "known", "source";
  ConformanceKey key = 1;
  int32 n = 2;
  int32 p50 = 3;
  int32 p90 = 4;
  int32 p95 = 5;
  int32 p99 = 6;
  int32 live = 7;
  int32 value = 8;
  int32 propose = 10;
  repeated ConformanceItem violations = 13;
}

message ConformanceItem {
  string id = 1;
  string source = 2;
  int32 measure = 3;
}
