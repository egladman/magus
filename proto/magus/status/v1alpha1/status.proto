syntax = "proto3";

// Package magus.status.v1alpha1 is the versioned wire contract for magus's status/dashboard
// view, scoped to LIVE state: overall health, the concurrency pool (capacity/running/
// queued slots), what is running right now - the running targets, their workspace, and
// how long they have run - and live cache ACTIVITY (hit/miss/error tallies + real on-disk
// size). Static CONFIG (telemetry, the cache cap/immutability, build flags) is deliberately
// NOT here; that is `magus status`/config, not "what is happening." Backs a native-feeling
// /dashboard. A sibling of magus.viewer.v1alpha1. buf-breaking gates this file.
package magus.status.v1alpha1;

import "google/protobuf/timestamp.proto";
import "google/rpc/status.proto";

// Health is the at-a-glance rollup a dashboard shows.
enum Health {
  HEALTH_UNSPECIFIED = 0;
  HEALTH_HEALTHY = 1;   // server reachable, pool nominal
  HEALTH_DEGRADED = 2;  // reachable but something is off (pool error, saturation)
  HEALTH_DOWN = 3;      // no server / pool
}

// Status is the live snapshot.
message Status {
  reserved 3;                    // was string magus_version; replaced by the granular BuildInfo below
  reserved "magus_version";
  Health health = 1;
  Pool pool = 2;                 // live concurrency; absent when no server/pool is running
  repeated Run runs = 4;         // runs the server is executing right now (adopted dispatches)
  repeated Service services = 5; // shared services the broker is hosting right now; the same list as broker.services
  BuildInfo build = 6;           // the running server's build identity
  repeated Lock locks = 7;       // per-project workspace locks held right now
  Broker broker = 8;             // the broker holding this host's capacity; absent when none is running
  Server server = 9;             // the server itself; absent when none is running
  string broker_policy = 10;     // required | best-effort | off: what a missing broker means
}

// Broker is the per-user process holding this host's capacity (concurrency slots and
// declared memory) and the services every magus on it shares. It listens on a unix
// socket only and exits once it has held nothing for its idle window.
message Broker {
  int32 pid = 1;
  string version = 2;
  int32 protocol = 3;                        // the broker wire version it speaks
  string socket = 4;
  string executable = 5;                     // the binary it runs from
  google.protobuf.Timestamp start_time = 6;
  Capacity capacity = 7;
  int32 idle_exit_seconds = 8;               // how long it stays up once it holds nothing
}

// Capacity is the host's whole budget, what is held, and every claim holding it.
message Capacity {
  int32 budget_mb = 1;              // 0 = unmeasured
  int32 held_mb = 2;
  int32 budget_slots = 3;           // 0 = unmeasured
  int32 held_slots = 4;
  repeated Claim holders = 5;       // oldest first
}

// Claim is one step holding capacity, and who is running it.
message Claim {
  string project = 1;
  string target = 2;
  int32 pid = 3;
  int32 memory_mb = 4;
  int32 slots = 5;
  string dir = 6;                            // where the holding run was started
  string command = 7;                        // the holder's argv
  google.protobuf.Timestamp start_time = 8;  // when the claim was granted
}

// Server is the person-started process serving MCP, the console, the APIs and jobs.
message Server {
  int32 pid = 1;
  string version = 2;
  string socket = 3;
  string executable = 4;
  google.protobuf.Timestamp start_time = 5;
  repeated Listener listeners = 6;
  repeated string watch = 7;                 // workspace roots whose graph and symbols it keeps current
}

// Listener is one address the server accepts connections on.
message Listener {
  string kind = 1;     // socket | http
  string address = 2;
}

// Lock is one held per-project workspace lock and the process holding it.
//
// A held lock is the NORMAL state of a mutating run, so this is state and never a
// fault: it must not fail a readiness or liveness check. It is on the wire because an
// OS file lock carries no identity of its own, so without the holder a refused run
// cannot say who refused it - and a lock is held for exactly as long as its holder
// lives, which means one held by a process nobody remembers starting refuses every
// other run until someone finds it.
message Lock {
  reserved 6;                                    // was repeated LockWaiter waiters; a contended lock refuses rather than queuing
  reserved "waiters";
  string project = 1;                            // workspace-relative path; "." is the root
  int32 pid = 2;                                 // holder's process id
  string command = 3;                            // holder's argv, for recognizing what it is
  string dir = 4;                                // holder's working directory; a path that no longer exists means abandoned
  google.protobuf.Timestamp acquire_time = 5;    // when the holder took it; age is the signal a human reads
  int32 stale_after_seconds = 7;                 // when to read this holder as possibly abandoned rather than busy
}

// BuildInfo identifies the running magus binary: the version tag, the commit it was built
// from, the build date, and the full human fingerprint (what `magus --version` prints).
// Reported so a dashboard shows exactly which server it is talking to. All fields are
// "unknown" for an unstamped dev build.
message BuildInfo {
  string version = 1;     // git describe, e.g. "v0.1.0-3-gabc1234"
  string commit = 2;      // short commit hash
  string date = 3;        // build date, RFC3339
  string fingerprint = 4; // full identity: "magus <version> (<commit>) built <date>"
}

// Run is one in-flight invocation the server has adopted - a `magus run`/`affected`
// dispatch, keyed by its invocation id. It carries the per-target execution state a
// dashboard renders as a live run row, so the SAME status stream that shows the pool
// also shows what each run's targets are doing.
message Run {
  string inv = 1;                             // invocation id (inv...); deep-links to the run's live log
  string trigger = 2;                         // how the run was spawned: run | affected | ci | ...
  google.protobuf.Timestamp start_time = 3;   // when the invocation opened
  repeated TargetRun targets = 4;             // per-target execution state within this run
}

// TargetRun is the execution state of one target within a Run. It advances QUEUED ->
// RUNNING -> PASSED|FAILED|CACHED as the run emits journal events; a finished target
// carries its output reference and wall-clock duration.
message TargetRun {
  // State is where a target sits in its lifecycle.
  // Values carry the STATE_ prefix because protobuf enum values share their
  // PARENT's scope, so an unprefixed CACHED would collide with any other enum
  // declaring the same name in this package. STATE_UNSPECIFIED always followed the
  // convention; the rest did not, which buf's ENUM_VALUE_PREFIX rule caught once
  // proto's lint target started running. Renaming a value leaves the wire
  // untouched - encoding is by number, and these are unchanged.
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_QUEUED = 1;   // scheduled, not yet started
    STATE_RUNNING = 2;  // a subprocess is executing
    STATE_PASSED = 3;   // finished successfully
    STATE_FAILED = 4;   // finished with an error
    STATE_CACHED = 5;   // satisfied from cache (no work run)
  }
  string project = 1;                         // repo-relative project path
  string target = 2;                          // target name (as the CLI spells it)
  State state = 3;
  google.protobuf.Timestamp start_time = 4;   // when the target began running (unset while QUEUED)
  google.protobuf.Timestamp end_time = 5;     // when the target finished (unset while active)
  string output_ref = 6;                      // output reference, once finished
  int64 duration_ms = 7;                      // wall-clock duration in ms, once finished
}

// Service is one long-running shared service the server is hosting right now, kept warm
// across invocations. It carries the derived identity (id/label/command/ports), the live
// state a dashboard renders, and how many targets currently depend on it.
message Service {
  string id = 1;                              // short service id (fingerprint prefix)
  string label = 2;                           // human name: image[:tag] or the binary basename
  string command = 3;                         // full process command, space-joined
  repeated string ports = 4;                  // container-side published ports (empty if unknown)
  string state = 5;                           // starting | running | idle | failed
  int32 dependents = 6;                       // targets currently depending on this service
  google.protobuf.Timestamp start_time = 7;   // when the registry began starting this instance
}

// Pool is the live concurrency pool - the slots and the work occupying them.
message Pool {
  reserved 2, 3;               // 2 was daemon_version, now owner_version; 3 was mode, now Status.server
  reserved "daemon_version", "mode";
  int32 parent_pid = 1;
  string owner_version = 11;   // the build of the process that owns the pool
  int32 capacity = 4;         // total concurrency slots (0 = unlimited)
  int32 running = 5;           // slots currently running
  int32 queued = 6;            // targets queued for a slot
  repeated RunningTarget running_targets = 7; // what is running right now
  repeated Workspace workspaces = 8;
  repeated string affected = 9;
  Cache cache = 10;            // aggregate cache activity across the warm workspaces
}

// RunningTarget is one running unit of work in the pool.
message RunningTarget {
  repeated string args = 1;                  // the argument vector (carries the target/project)
  string workspace = 2;
  google.protobuf.Timestamp start_time = 3;  // when the running target started
  string step = 4;                           // the cache step currently executing
  string invocation = 5;                     // the invocation id (inv...) this running target belongs to; deep-links to its live log
}

// Workspace is one workspace the server holds: loading, loaded, or failed to load.
message Workspace {
  // State is where the server's copy of this workspace sits. Output only; values may be added.
  enum State {
    STATE_UNSPECIFIED = 0;
    STATE_LOADING = 1; // evaluating magusfiles; resolves on its own
    STATE_ACTIVE = 2;  // loaded; workspace calls are served
    STATE_FAILED = 3;  // load failed, see error; held until a workspace source changes
  }
  string root = 1;
  google.protobuf.Timestamp load_time = 2;
  google.protobuf.Timestamp last_access_time = 3;
  Cache cache = 4;             // this workspace's cache activity
  // secret_provider is the NAME of the provider spell this workspace's magusfile selected;
  // empty means no declaration and the built-in environment provider applies. It exists so
  // a reader can see that credential resolution is wired up and through what - the same
  // config visibility the cache cap gets.
  //
  // The name and nothing else. No reference list, no value: magus does not store secrets,
  // it reads them through a provider, and publishing what a build CAN reach would be a map
  // of what to go after.
  string secret_provider = 5;
  State state = 6;
  // Why the workspace is FAILED; unset in every other state. The same Status a call against
  // it returns. Spelled out because a bare Status here resolves to this package's message.
  google.rpc.Status error = 7;
}

// Cache is live cache ACTIVITY: the hit/miss/error tallies a warm cache has served this
// session plus its real on-disk size. These are running counters (not static config like
// the cap or immutability), so a dashboard plots hit-rate over time by sampling the stream.
message Cache {
  int64 hits = 1;
  int64 misses = 2;
  int64 errors = 3;
  int64 size_bytes = 4;   // real on-disk size of the cache dir (0 = unknown/not computed)
  int32 size_cap_mb = 5;  // configured cap (MAGUS_CACHE_SIZE_MB; 0 = unlimited)
  // saved_ms is the summed recorded duration of the runs those hits replayed - the work the cache
  // avoided, measured rather than modeled: each figure is how long that exact target took on this
  // machine when it last ran, carried on the cache entry.
  //
  // It UNDERSTATES and never overstates. A hit on an entry written before the duration was recorded
  // counts toward hits and adds nothing here, so a reader must not present this as the cache's
  // lifetime saving - it is what this server has saved since it started.
  int64 saved_ms = 6;
}

// StatusService serves the snapshot, and streams it for a live dashboard.
service StatusService {
  // GetStatus returns the current snapshot.
  rpc GetStatus(GetStatusRequest) returns (GetStatusResponse);
  // StreamStatus pushes a fresh snapshot whenever the pool changes (or on a heartbeat),
  // so a dashboard reflects what is running without polling.
  rpc StreamStatus(StreamStatusRequest) returns (stream StreamStatusResponse);
}

message GetStatusRequest {}
message GetStatusResponse {
  Status status = 1;
  // observe_start_time and config ride the ONE-SHOT response envelope, NOT the streamed Status frame: they
  // are static per server session (Status stays "what is happening right now"), so a dashboard reads them
  // once via GetStatus rather than on every StreamStatus push. This is the typed home for the two fields
  // the deprecated JSON /api/v1/status route used to carry.
  google.protobuf.Timestamp observe_start_time = 2; // when this server began observing (its start)
  Config config = 3;                             // the server's resolved, read-only configuration
}

// Config is the server's resolved, read-only configuration a dashboard shows so an operator can see what
// the server is set to do without a terminal round-trip. Static per session, so it rides GetStatusResponse
// (the one-shot), never the live Status frame.
message Config {
  repeated string default_charms = 1; // the charms applied to every run by default
  int32 concurrency = 2;              // the concurrency cap (0 = unlimited)
  bool sandbox = 3;                   // whether filesystem sandboxing is on
}
message StreamStatusRequest {}
message StreamStatusResponse {
  Status status = 1;
}
