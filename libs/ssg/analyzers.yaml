# This project's analyzer policy, typed by a person. An analyzer reads it for
# this project's files only, and paths are relative to this directory; the
# root analyzers.yaml describes the shape.

no-throw:
  # construct: {file: count}
  baseline:
    buzz-error-signature:
      csp.buzz: 4
      date.buzz: 3
      paths.buzz: 2

proofread:
  # file: {rule: count} of the code-comment deny findings a file still holds,
  # which hack/lint/code-comments-follow-proofread-rules.buzz holds it to. A
  # count may only fall.
  baseline:
    csp.buzz: {code-comment-budget: 2, code-comment-sentence: 4}
    date.buzz: {code-comment-budget: 1, code-comment-sentence: 1}
    dom.buzz: {comment-caps: 2}
    feed.buzz: {comment-caps: 2}
    paths.buzz: {code-comment-budget: 5, code-comment-sentence: 7, comment-caps: 7, comment-history: 1, doc-path: 3}
    rewrite.buzz: {code-comment-budget: 2, code-comment-sentence: 5, comment-caps: 6, comment-first-person: 1, comment-history: 1, doc-path: 3}
    text.buzz: {code-comment-budget: 2, code-comment-sentence: 2, comment-caps: 5}
    urls.buzz: {code-comment-budget: 1, code-comment-sentence: 2, comment-caps: 3}
