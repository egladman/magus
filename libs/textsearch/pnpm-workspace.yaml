# pnpm settings for the shared textsearch lib's dev-only gates (typescript + biome). NOT a
# workspace: there is no `packages:` key and this is one package. pnpm 10.16+ reads settings
# here that older versions read from .npmrc, and this file replaced that one.

# In MINUTES; 14400 = 10 days. Supply-chain guard: never install a version published less
# than 10 days ago, so a compromised release has time to be caught before it enters a build.
# pnpm (not npm) is the reason this works at all: npm has no such key and ignores it.
minimumReleaseAge: 14400
