# This project's analyzer policy, typed by a person. An analyzer reads it for
# this project's files only, and paths are relative to this directory; the
# root analyzers.yaml describes the shape.

exhaustive-switch:
  # Functions that may still hold a switch over a closed set that misses a member or keeps a default
  # arm. A count may only shrink; a function holding fewer switches than its row fails.
  baseline:
    - {path: vm/vm.go, symbol: Exec}
  # Switches a person accepted, each with the reason it stays.
  exits:
    - {path: parser.go, symbol: compoundAssignOp, type: Kind, reason: "Only compound-assignment tokens map to a binary operator; every other token returns false so the parser follows the ordinary expression-assignment path."}
    - {path: parser.go, symbol: isTypeStart, type: Kind, reason: "Only identifiers, void, array and function tokens can begin a type expression; false lets callers distinguish an omitted annotation from a type."}
    - {path: parser.go, symbol: parseBitwise, type: Kind, reason: "This precedence level consumes only &, | and ^; any other token ends the bitwise chain for the enclosing expression parser."}
    - {path: parser.go, symbol: parseComparison, type: Kind, reason: "This precedence level consumes only comparison operators; other tokens belong to a surrounding expression or terminate it."}
    - {path: parser.go, symbol: parseMultiplicative, type: Kind, reason: "This precedence level consumes only *, / and %; other tokens end the multiplicative chain."}
    - {path: parser.go, symbol: parsePostfix, type: Kind, reason: "The loop handles calls, indexing and member access after a primary; other tokens end the postfix chain and return its expression."}
    - {path: parser.go, symbol: parsePrimary, type: Kind, reason: "Only primary-expression starters produce nodes here; the default reports an expression syntax error for tokens outside that grammar."}
    - {path: parser.go, symbol: parseShift, type: Kind, reason: "This precedence level consumes only << and >>; other tokens end the shift chain."}
    - {path: parser.go, symbol: parseStmt, type: Kind, reason: "Recognized statement starters dispatch to statement parsers; the default delegates remaining forms to expression-or-assignment parsing."}
    - {path: parser.go, symbol: parseUnary, type: Kind, reason: "Only prefix unary operators are handled here; all other tokens proceed to postfix and primary parsing."}
    - {path: parser.go, symbol: readGenericArg, type: Kind, reason: "Only angle brackets change generic-argument nesting; other tokens are preserved as type text, and EOF reports an unterminated list."}
    - {path: parser.go, symbol: skipBalancedBraces, type: Kind, reason: "Only braces change the nested-group depth; all other tokens are contents to consume until the matching close brace."}
    - {path: parser.go, symbol: skipGenericArgs, type: Kind, reason: "Only angle brackets change generic-argument nesting; other tokens are contents to skip until the matching close angle."}
    - {path: parser.go, symbol: skipType, type: Kind, reason: "The cases implement the supported type grammar; a token outside that grammar is rejected as an invalid type rather than consumed as a type."}
    - {path: parser.go, symbol: tokenText, type: Kind, reason: "Type reconstruction keeps identifiers, type constructors, modifiers and delimiters; unrelated tokens are omitted from the reconstructed annotation."}
    - {path: session.go, symbol: declaredNamespace, type: Kind, reason: "Only namespace declarations and the leading empty/export forms can declare a namespace; other first tokens cannot yield one."}
    - {path: token/token.go, symbol: String, type: Kind, reason: "Every defined token kind has a readable spelling; the fallback labels unknown numeric kinds without enumerating invalid values."}
    - {path: vm/chunk.go, symbol: FoldConsts, type: OpCode, reason: "Constant folding is limited to integer add, subtract, multiply, divide and modulo; other opcodes remain unchanged for runtime semantics."}
    - {path: vm/chunk.go, symbol: branchTargets, type: OpCode, reason: "Only jumps, iterator advance and try-begin instructions carry branch destinations; other instructions cannot protect a target slot."}
    - {path: vm/chunk.go, symbol: fusableBinop, type: OpCode, reason: "Fusion supports the listed arithmetic and comparison tails after GetLocal/LoadConst; other opcodes do not match that superinstruction shape."}
    - {path: vm/chunk.go, symbol: fusableCondOp, type: OpCode, reason: "Conditional fusion requires a comparison result immediately consumed by JumpFalse; non-comparison opcodes cannot form that pattern."}
    - {path: vm/ffi_purego.go, symbol: buzzRetToReflect, type: CType, reason: "Only callback-legal result kinds are converted; null or mismatched results deliberately collapse to the zero value of the declared Go return type."}
    - {path: vm/ffi_purego.go, symbol: buzzToReflectArg, type: valueTag, reason: "Only values supported by the pure-Go FFI are converted to reflect arguments; other runtime tags return an unsupported-argument error."}
    - {path: vm/ffi_purego.go, symbol: reflectArgToBuzz, type: CType, reason: "Only callback-legal argument kinds have a Go-to-Buzz mapping; an unexpected kind returns null as the trampoline's defensive fallback."}
    - {path: vm/gc_collect.go, symbol: markReachable, type: valueTag, reason: "Reachability follows only heap-backed values that can own references; scalar tags have no outgoing objects to mark."}
    - {path: vm/heapprofile.go, symbol: kindName, type: valueTag, reason: "Heap profiles name heap object categories; immediate scalar tags use the generic fallback because they are not heap allocations."}
    - {path: vm/jit_arm64.go, symbol: compileJIT, type: OpCode, reason: "The ARM64 JIT compiles only its implemented opcode subset; any other opcode rejects JIT compilation so execution falls back to the VM."}
    - {path: vm/jit_shared.go, symbol: depths, type: OpCode, reason: "The verifier computes stack effects only for opcodes it can model; an unknown effect makes the chunk ineligible for JIT compilation."}
    - {path: vm/jit_shared.go, symbol: jitSubOK, type: OpCode, reason: "The fused JIT operation supports only arithmetic and comparison sub-opcodes; other opcodes cannot occupy that superinstruction slot."}
    - {path: vm/marshal.go, symbol: constVal, type: valueTag, reason: "Chunk serialization accepts only values legal in the constant pool; runtime-only objects are rejected as non-constant values."}
    - {path: vm/operators.go, symbol: applyBinop, type: OpCode, reason: "The binary evaluator handles arithmetic, comparison and bitwise opcodes; any other opcode is not a binary operator and returns an error."}
    - {path: vm/operators.go, symbol: asInt, type: valueTag, reason: "Integers pass through and floats convert by truncation; false rejects non-numeric runtime tags without coercion."}
    - {path: vm/operators.go, symbol: asNumeric, type: valueTag, reason: "Only integer and float values participate in numeric operations; other tags return false so callers can report a type error."}
    - {path: vm/operators.go, symbol: bitwise, type: OpCode, reason: "Only bitwise and shift opcodes are evaluated here; callers route all other operations elsewhere."}
    - {path: vm/operators.go, symbol: builtinMethod, type: valueTag, reason: "Built-in methods exist only for the listed receiver types; unsupported receivers return no method for the caller's missing-member path."}
    - {path: vm/operators.go, symbol: call, type: valueTag, reason: "Only function, builtin and callable runtime values can be called; other tags produce the language's not-callable error."}
    - {path: vm/operators.go, symbol: cmpResult, type: OpCode, reason: "Callers pass only relational opcodes here; the default branch is OpGreaterEqual, while equality operators are handled by applyBinop."}
    - {path: vm/operators.go, symbol: compare, type: OpCode, reason: "Callers pass only relational opcodes; the default branch is GreaterEqual, while equality operations are handled in applyBinop."}
    - {path: vm/operators.go, symbol: execCold, type: OpCode, reason: "This out-of-line path implements only bitwise opcodes excluded from Exec's hot switch; its default reports an unknown opcode."}
    - {path: vm/operators.go, symbol: floatArith, type: OpCode, reason: "Only floating-point arithmetic opcodes are evaluated here; other opcodes return an unsupported-operation error."}
    - {path: vm/operators.go, symbol: floatBinop, type: OpCode, reason: "The fast float path recognizes only operations with direct float implementations; false sends other operations to the general evaluator."}
    - {path: vm/operators.go, symbol: getMember, type: valueTag, reason: "Member lookup has dedicated behavior for built-ins, maps, objects, object definitions and enum values; unhandled tags intentionally yield null."}
    - {path: vm/operators.go, symbol: indexGet, type: valueTag, reason: "Only lists, strings and maps support indexing; other values return a cannot-index error."}
    - {path: vm/operators.go, symbol: intArith, type: OpCode, reason: "Only integer arithmetic opcodes are evaluated here; other opcodes return an unsupported-operation error."}
    - {path: vm/operators.go, symbol: setIndex, type: valueTag, reason: "Only mutable lists and maps accept indexed assignment; other values return a cannot-set-index error."}
    - {path: vm/operators.go, symbol: setMember, type: valueTag, reason: "Only maps, object instances and object definitions have writable fields; all other receiver tags return a cannot-set-field error."}
    - {path: vm/value.go, symbol: Bool, type: valueTag, reason: "Buzz truthiness makes null and false false; every other value tag is true, so the default carries the language's truthiness rule."}
    - {path: vm/value.go, symbol: FunName, type: valueTag, reason: "Only Buzz functions and direct host functions carry a declared name; anonymous closures and other tags return an empty name."}
    - {path: vm/value.go, symbol: MapView, type: valueTag, reason: "Only maps return themselves and object instances expose a fields map; every other tag returns null with false."}
    - {path: vm/value.go, symbol: ObjectTypeName, type: valueTag, reason: "Only object definitions and instances carry a declared object type name; every other tag returns an empty name."}
    - {path: vm/value.go, symbol: mapKeyEqual, type: valueTag, reason: "Strings compare by content and null, booleans and numbers by payload; other same-tag keys delegate to valuesEqual for structural or identity semantics."}
    - {path: vm/value.go, symbol: valuesEqual, type: valueTag, reason: "Primitive and structural tags have explicit Buzz equality; all remaining heap objects compare by reference identity."}
    - {path: vm/vm.go, symbol: Call, type: valueTag, reason: "Only callable runtime value tags enter call dispatch; all others return a not-callable fault."}
    - {path: vm/vm.go, symbol: Exec, type: OpCode, reason: "The VM dispatches defined instructions and returns an invalid-opcode fault for unknown values; enumerating invalid numeric opcodes would add no runtime behavior."}
    - {path: vm/vm.go, symbol: Exec, type: valueTag, reason: "Unary negation accepts integer and float operands; all other tags take the language's cannot-negate error path."}
    - {path: vm/vm.go, symbol: Invoke, type: valueTag, reason: "Resolved method values are called only when they are Buzz functions or direct host functions; other values produce missing or not-callable errors."}
    - {path: vm/vm.go, symbol: buzzCast, type: valueTag, reason: "Each target Buzz type accepts only its documented source tags; the default rejects invalid casts instead of coercing unknown values."}
    - {path: vm/vm.go, symbol: buzzIsType, type: valueTag, reason: "Structural obj-shape tests inspect map and object fields only; every other value tag fails that shape check."}

no-throw:
  # construct: {file: count}
  baseline:
    buzz-error-signature:
      benchmarks/upstream/programs/trycatch.buzz: 1
      magusfile.buzz: 2

# An engineered zone: see the root analyzers.yaml for the shape.
zones:
  - path: "**"
    reason: spec
    evidence:
      - conformance_test.go
      - README.md#upstream-parity
      - benchmarks/upstream/upstream_test.go
      - benchmarks/comparison/comparison_test.go
    # magus.yaml's knowledge.conformance.exclude and the .golangci.yml path
    # exclusion still hold this until a rule reads the zone.
    budgets:
      conformance: excluded
