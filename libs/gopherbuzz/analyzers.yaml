# This project's analyzer policy, typed by a person. An analyzer reads it for
# this project's files only, and paths are relative to this directory; the
# root analyzers.yaml describes the shape.

exhaustive-switch:
  # Functions that may still hold a switch over a closed set that misses a member or keeps a default
  # arm. A count may only shrink; a function holding fewer switches than its row fails.
  baseline:
    - {path: vm/vm.go, symbol: Exec}
  # Switches a person accepted, each with the reason it stays.
  exits:
    - {path: parser.go, symbol: compoundAssignOp, type: Kind, reason: "proposed, unconfirmed: a dispatch over the full instruction, token or value-tag set; the arms name the cases that act and the default is the rest, so listing every member would restate the set at each site"}
