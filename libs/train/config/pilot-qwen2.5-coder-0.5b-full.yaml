# Stage S0 pilot, completion: Qwen2.5-Coder-0.5B, full fine-tune with plan 3.4's
# hyperparameters, 200 steps of 4,096-token sequences. `train pilot` passes the model,
# the data and the adapter path.
train: true
fine_tune_type: full
num_layers: -1
batch_size: 1
max_seq_length: 4096
iters: 200
grad_checkpoint: true
optimizer: adamw
optimizer_config:
  adamw:
    betas: [0.9, 0.95]
    weight_decay: 0.01
learning_rate: 5.0e-5
lr_schedule:
  name: cosine_decay
  arguments: [5.0e-5, 200, 0.0]
  warmup: 4
steps_per_report: 10
steps_per_eval: 1000
val_batches: 1
save_every: 1000
seed: 0
