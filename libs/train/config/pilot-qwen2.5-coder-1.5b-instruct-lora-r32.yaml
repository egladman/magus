# Stage S0 pilot, assist floor: Qwen2.5-Coder-1.5B-Instruct, LoRA r=32, alpha=64 on every
# linear layer of every block (plan 3.4), 200 steps of 4,096-token sequences. mlx-lm's
# scale is alpha / r. `train pilot` passes the model, the data and the adapter path.
train: true
fine_tune_type: lora
num_layers: -1
lora_parameters:
  rank: 32
  scale: 2.0
  dropout: 0.0
batch_size: 1
max_seq_length: 4096
iters: 200
grad_checkpoint: true
optimizer: adamw
optimizer_config:
  adamw:
    betas: [0.9, 0.95]
    weight_decay: 0.01
learning_rate: 1.0e-4
lr_schedule:
  name: cosine_decay
  arguments: [1.0e-4, 200, 0.0]
  warmup: 4
steps_per_report: 10
steps_per_eval: 1000
val_batches: 1
save_every: 1000
seed: 0
