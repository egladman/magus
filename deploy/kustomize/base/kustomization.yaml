apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  # Not in selectors: a selector is immutable, so a label added later would orphan the pods.
  - pairs:
      app.kubernetes.io/part-of: magus
      app.kubernetes.io/managed-by: kustomize
    includeSelectors: false
    includeTemplates: true
resources:
  - serviceaccount.yaml
  - persistentvolumeclaim.yaml
  - deployment.yaml
  - service.yaml
  - networkpolicy-default-deny.yaml
  - networkpolicy-allow-dns.yaml
configMapGenerator:
  - name: magus-config
    files:
      - magus.yaml=daemon-config.yaml
