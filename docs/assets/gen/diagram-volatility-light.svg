<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1024" width="760" height="1024" role="img" aria-labelledby="volatility-title volatility-desc" class="magus-diagram"><metadata>{"figure":"volatility","stamp":"sha256:24c46dc345c2ec8f6c72dd7438e4f8838dd9af9303634a95be5011c004685bbd"}</metadata><title id="volatility-title">When a failure is retried, and when it is believed</title><desc id="volatility-desc">A failing target that opted in is retried once while its history is too thin to judge, when the diff did not touch its project, or when its measured volatility is above the threshold. A retry that passes is recorded as volatile and the run continues; anything else is a suspected regression.</desc><defs><marker id="volatility-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="volatility-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="volatility-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">VOLATILITY</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">When a failure is retried, and when it is believed</text><g transform="translate(0,40)"><path data-edge="external:Target fails->internal/ci/volatility" id="volatility-edge-external_3aTarget_20fails-internal_2fci_2fvolatility" d="M 140 120 L 140 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="internal/ci/volatility->external:Report failure" id="volatility-edge-internal_2fci_2fvolatility-external_3aReport_20failure" d="M 140 248 L 140 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="internal/ci/volatility->external:enough history?" id="volatility-edge-internal_2fci_2fvolatility-external_3aenough_20history_3f" d="M 248 220 L 372 220 Q 380 220 380 228 L 380 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:enough history?->external:diff touched it?" id="volatility-edge-external_3aenough_20history_3f-external_3adiff_20touched_20it_3f" d="M 380 376 L 380 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:enough history?->external:Retry once" id="volatility-edge-external_3aenough_20history_3f-external_3aRetry_20once" d="M 488 348 L 516 348 Q 524 348 524 356 L 524 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:diff touched it?->external:over threshold?" id="volatility-edge-external_3adiff_20touched_20it_3f-external_3aover_20threshold_3f" d="M 380 504 L 380 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:diff touched it?->external:Retry once" id="volatility-edge-external_3adiff_20touched_20it_3f-external_3aRetry_20once" d="M 488 476 L 504 476 Q 512 476 512 484 L 512 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:over threshold?->external:Retry once" id="volatility-edge-external_3aover_20threshold_3f-external_3aRetry_20once" d="M 488 604 L 492 604 Q 500 604 500 612 L 500 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:over threshold?->external:Suspected regression" id="volatility-edge-external_3aover_20threshold_3f-external_3aSuspected_20regression" d="M 380 632 L 380 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:Retry once->external:Record volatile" id="volatility-edge-external_3aRetry_20once-external_3aRecord_20volatile" d="M 520 760 L 520 788 Q 520 796 528 796 L 612 796 Q 620 796 620 804 L 620 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:Retry once->external:Suspected regression" id="volatility-edge-external_3aRetry_20once-external_3aSuspected_20regression" d="M 504 760 L 504 788 Q 504 796 496 796 L 400 796 Q 392 796 392 804 L 392 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><rect x="150" y="276" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="160" y="285" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="300" y="198" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="312" y="207" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="390" y="404" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="402" y="413" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="534" y="516" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="562" y="525" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BOOTSTRAP</text><rect x="390" y="532" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="402" y="541" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="498" y="454" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="508" y="463" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="466" y="644" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="478" y="653" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="350" y="724" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="360" y="733" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="548" y="774" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="568" y="783" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PASSES</text><rect x="416" y="774" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="448" y="783" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FAILS AGAIN</text><g data-node="external:Target fails"><rect x="32" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Target fails</text></g><g data-node="internal/ci/volatility" data-anchor="internal/ci/volatility/volatility.go"><rect x="32" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Decide</text><text x="140" y="236" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">on, and opted in?</text></g><g data-node="external:Report failure"><rect x="32" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Report failure</text></g><g data-node="external:enough history?"><polygon points="380,320 488,348 380,376 272,348" fill="#f5f5f5"/><polygon points="380,320 488,348 380,376 272,348" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="380" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">enough history?</text></g><g data-node="external:diff touched it?"><polygon points="380,448 488,476 380,504 272,476" fill="#f5f5f5"/><polygon points="380,448 488,476 380,504 272,476" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="380" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">diff touched it?</text></g><g data-node="external:over threshold?"><polygon points="380,576 488,604 380,632 272,604" fill="#f5f5f5"/><polygon points="380,576 488,604 380,632 272,604" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="380" y="608" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">over threshold?</text></g><g data-node="external:Retry once"><rect x="404" y="704" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="404" y="704" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="512" y="732" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Retry once</text><text x="512" y="748" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the same target</text></g><g data-node="external:Record volatile"><rect x="512" y="832" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="512" y="832" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="620" y="860" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Record volatile</text><text x="620" y="876" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the run continues</text></g><g data-node="external:Suspected regression"><rect x="272" y="832" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="832" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="380" y="860" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Suspected regression</text><text x="380" y="876" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">chase with --bisect</text></g><line x1="32" y1="924" x2="728" y2="924" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="938" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="944" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="953" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WANTS A HUMAN</text></g></svg>