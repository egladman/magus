<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 628 1024" width="628" height="1024" role="img" aria-labelledby="volatility-title volatility-desc" class="magus-diagram"><title id="volatility-title">When a failure is retried, and when it is believed</title><desc id="volatility-desc">A failing target is retried once if history is too thin to judge, or if its measured volatility is above the threshold. A retry that passes is recorded as volatile and the run continues; anything else is a suspected regression.</desc><defs><marker id="volatility-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="volatility-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="volatility-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">VOLATILITY</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">When a failure is retried, and when it is believed</text><g transform="translate(0,40)"><path data-edge="fail->det" d="M 140 120 L 140 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="det->report" d="M 140 248 L 140 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="det->hist" d="M 248 220 L 252 220 Q 260 220 260 228 L 260 276 Q 260 284 268 284 L 372 284 Q 380 284 380 292 L 380 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="hist->retry" d="M 488 348 L 492 348 Q 500 348 500 356 L 500 406 Q 500 412 506 412 L 506 412 Q 512 412 512 418 L 512 532 Q 512 540 504 540 L 400 540 Q 392 540 392 548 L 392 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="hist->rate" d="M 380 376 L 380 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="rate->retry" d="M 380 504 L 380 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="rate->regress" d="M 272 476 L 268 476 Q 260 476 260 484 L 260 534 Q 260 540 254 540 L 254 540 Q 248 540 248 546 L 248 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="retry->pass" d="M 380 632 L 380 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="pass->volatile" d="M 380 760 L 380 788 Q 380 796 388 796 L 480 796 Q 488 796 488 804 L 488 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="pass->regress" d="M 272 732 L 268 732 Q 260 732 260 740 L 260 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><rect x="150" y="276" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="160" y="285" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="308" y="262" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="271" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="424" y="518" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="452" y="527" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BOOTSTRAP</text><rect x="390" y="404" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="402" y="413" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="390" y="532" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="402" y="541" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="242" y="518" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="252" y="527" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="420" y="774" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="432" y="783" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="270" y="772" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="280" y="781" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><g data-node="fail"><rect x="32" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Target fails</text></g><g data-node="det"><polygon points="140,192 248,220 140,248 32,220" fill="#f5f5f5"/><polygon points="140,192 248,220 140,248 32,220" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="224" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">detection on?</text></g><g data-node="report"><rect x="32" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Report failure</text></g><g data-node="hist"><polygon points="380,320 488,348 380,376 272,348" fill="#f5f5f5"/><polygon points="380,320 488,348 380,376 272,348" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="380" y="352" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">enough history?</text></g><g data-node="rate"><polygon points="380,448 488,476 380,504 272,476" fill="#f5f5f5"/><polygon points="380,448 488,476 380,504 272,476" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="380" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">over threshold?</text></g><g data-node="retry" data-anchor="internal/retry"><rect x="272" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="576" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="380" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Retry once</text><text x="380" y="620" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the same target</text></g><g data-node="pass"><polygon points="380,704 488,732 380,760 272,732" fill="#f5f5f5"/><polygon points="380,704 488,732 380,760 272,732" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="380" y="736" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">retry passed?</text></g><g data-node="volatile"><rect x="380" y="832" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="380" y="832" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="488" y="860" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Record volatile</text><text x="488" y="876" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the run continues</text></g><g data-node="regress"><rect x="140" y="832" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="140" y="832" width="216" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="248" y="860" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Suspected regression</text><text x="248" y="876" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">chase with --bisect</text></g><line x1="32" y1="924" x2="596" y2="924" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="938" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="944" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="953" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WANTS A HUMAN</text></g></svg>