<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" role="img" aria-labelledby="volatility-title volatility-desc" class="magus-diagram"><title id="volatility-title">When a failure is retried, and when it is believed</title><desc id="volatility-desc">A failing target is retried once if history is too thin to judge, or if its measured volatility is above the threshold. A retry that passes is recorded as volatile and the run continues; anything else is a suspected regression.</desc><defs><marker id="volatility-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="volatility-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="volatility-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">VOLATILITY</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">When a failure is retried, and when it is believed</text><g transform="translate(0,40)"><path d="M 480 120 L 480 152" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 408 188 L 264 188" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 480 224 L 480 256" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 552 292 L 624 292 Q 632 292 632 300 L 632 376 Q 632 384 640 384 L 712 384" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 480 328 L 480 360" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 552 396 L 660 396 Q 664 396 664 400 L 664 400 Q 664 404 668 404 L 712 404" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 408 396 L 344 396 Q 336 396 336 404 L 336 492 Q 336 500 328 500 L 264 500" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 808 428 L 808 480" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 808 552 L 808 604" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 736 516 L 502 516 Q 500 516 500 518 L 500 518 Q 500 520 498 520 L 264 520" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><rect x="326" y="166" width="20" height="12" rx="2" fill="#ffffff"/><text x="336" y="175" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="492" y="232" width="24" height="12" rx="2" fill="#ffffff"/><text x="504" y="241" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="604" y="314" width="56" height="12" rx="2" fill="#ffffff"/><text x="632" y="323" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BOOTSTRAP</text><rect x="492" y="336" width="24" height="12" rx="2" fill="#ffffff"/><text x="504" y="345" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="652" y="378" width="24" height="12" rx="2" fill="#ffffff"/><text x="664" y="387" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="326" y="426" width="20" height="12" rx="2" fill="#ffffff"/><text x="336" y="435" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="820" y="568" width="24" height="12" rx="2" fill="#ffffff"/><text x="832" y="577" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="490" y="494" width="20" height="12" rx="2" fill="#ffffff"/><text x="500" y="503" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="400" y="64" width="160" height="56" rx="6" fill="#ffffff"/><rect x="400" y="64" width="160" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="480" y="96" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Target fails</text><polygon points="480,152 552,188 480,224 408,188" fill="#ffffff"/><polygon points="480,152 552,188 480,224 408,188" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="480" y="192" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">detection on?</text><rect x="64" y="156" width="200" height="64" rx="6" fill="#ffffff"/><rect x="64" y="156" width="200" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="164" y="192" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Report failure</text><polygon points="480,256 552,292 480,328 408,292" fill="#ffffff"/><polygon points="480,256 552,292 480,328 408,292" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="480" y="296" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">enough history?</text><polygon points="480,360 552,396 480,432 408,396" fill="#ffffff"/><polygon points="480,360 552,396 480,432 408,396" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="480" y="400" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">over threshold?</text><rect x="712" y="364" width="192" height="64" rx="6" fill="#ffffff"/><rect x="712" y="364" width="192" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="808" y="396" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Retry once</text><text x="808" y="412" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the same target</text><polygon points="808,480 880,516 808,552 736,516" fill="#ffffff"/><polygon points="808,480 880,516 808,552 736,516" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="808" y="520" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">retry passed?</text><rect x="712" y="604" width="192" height="64" rx="6" fill="#ffffff"/><rect x="712" y="604" width="192" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="808" y="636" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Record volatile</text><text x="808" y="652" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the run continues</text><rect x="64" y="480" width="200" height="64" rx="6" fill="#ffffff"/><rect x="64" y="480" width="200" height="64" rx="6" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="1"/><text x="164" y="512" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Suspected regression</text><text x="164" y="528" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">chase with --bisect</text><line x1="32" y1="712" x2="928" y2="712" stroke="#dce3eb" stroke-width="0.8"/><rect x="32" y="720" width="10" height="10" rx="2" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="0.8"/><text x="50" y="729" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WANTS A HUMAN</text></g></svg>