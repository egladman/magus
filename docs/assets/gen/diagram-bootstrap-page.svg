<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1224 688" width="1224" height="688" role="img" aria-labelledby="bootstrap-title bootstrap-desc" class="magus-diagram"><metadata>{"figure":"bootstrap","stamp":"sha256:404e03ff9e0a8386e5e1774ab50ba69d041af9653a3ac030c457bdcb47f73e30"}</metadata><title id="bootstrap-title">One go run, then magus builds magus</title><desc id="bootstrap-desc">In a checkout with no ./magus, the guard's raw-tool rule advises exactly one command through, alone on its line: GOEXPERIMENT=jsonv2 go run -trimpath ./cmd/magus run go-build --no-cache ., which runs the real go-build target. It regenerates the spell bytecode first and links a stamp of the sources the binary was built from. Every other raw go command, a bare go build included, is refused and served that command; once ./magus exists the rule names ./magus run go-build . instead. The magus on PATH re-execs that ./magus; the stale policy compares its stamp with the checkout, and when a binary can no longer load the tree the escape moves it aside, which is the one way back to the bootstrap.</desc><defs><marker id="bootstrap-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="bootstrap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="bootstrap-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">BOOTSTRAP</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One go run, then magus builds magus</text><g transform="translate(0,40)"><rect x="624" y="32" width="552" height="112" rx="8" fill="var(--magus-diagram-ink, #2d3142)" fill-opacity="0.02" stroke="var(--magus-diagram-ink, #2d3142)" stroke-opacity="0.1" stroke-width="0.8"/><rect x="852" y="36" width="96" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="900" y="45" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">NO ./MAGUS YET</text><rect x="32" y="168" width="552" height="384" rx="8" fill="var(--magus-diagram-ink, #2d3142)" fill-opacity="0.02" stroke="var(--magus-diagram-ink, #2d3142)" stroke-opacity="0.1" stroke-width="0.8"/><rect x="248" y="172" width="120" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="308" y="181" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">MAGUS BUILDS MAGUS</text><rect x="624" y="304" width="552" height="248" rx="8" fill="var(--magus-diagram-ink, #2d3142)" fill-opacity="0.02" stroke="var(--magus-diagram-ink, #2d3142)" stroke-opacity="0.1" stroke-width="0.8"/><rect x="864" y="308" width="72" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="900" y="317" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">KEPT FRESH</text><path data-edge="external:Person or hook->cmd/magus" id="bootstrap-edge-external_3aPerson_20or_20hook-cmd_2fmagus" d="M 264 96 L 352 96" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="cmd/magus->internal/guard" id="bootstrap-edge-cmd_2fmagus-internal_2fguard" d="M 568 96 L 640 96" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="internal/guard->external:go run ./cmd/magus" id="bootstrap-edge-internal_2fguard-external_3ago_20run_20_2e_2fcmd_2fmagus" d="M 856 96 L 944 96" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go run ./cmd/magus->external:go-build" id="bootstrap-edge-external_3ago_20run_20_2e_2fcmd_2fmagus-external_3ago-build" d="M 1052 128 L 1052 156 Q 1052 164 1044 164 L 164 164 Q 156 164 156 172 L 156 200" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go-build->external:Spell bytecode" id="bootstrap-edge-external_3ago-build-external_3aSpell_20bytecode" d="M 156 264 L 156 336" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go-build->internal/interp/bindings" id="bootstrap-edge-external_3ago-build-internal_2finterp_2fbindings" d="M 264 232 L 268 232 Q 276 232 276 240 L 276 472" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go-build->external:Stale policy" id="bootstrap-edge-external_3ago-build-external_3aStale_20policy" d="M 168 264 L 168 292 Q 168 300 176 300 L 268 300 A 8 8 0 0 1 284 300 L 740 300 Q 748 300 748 308 L 748 336" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Stale policy->internal/interp/bindings" id="bootstrap-edge-external_3aStale_20policy-internal_2finterp_2fbindings" d="M 736 400 L 736 428 Q 736 436 728 436 L 296 436 Q 288 436 288 444 L 288 472" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Stale policy->external:Relink escape" id="bootstrap-edge-external_3aStale_20policy-external_3aRelink_20escape" d="M 748 400 L 748 472" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Relink escape->external:go run ./cmd/magus" id="bootstrap-edge-external_3aRelink_20escape-external_3ago_20run_20_2e_2fcmd_2fmagus" d="M 856 504 L 1184 504 Q 1192 504 1192 496 L 1192 104 Q 1192 96 1184 96 L 1160 96" fill="none" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bootstrap-arrow-accent)"/><rect x="278" y="74" width="60" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="308" y="83" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS MAGUS</text><rect x="584" y="74" width="40" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="604" y="83" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JUDGES</text><rect x="870" y="74" width="60" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="900" y="83" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO ./MAGUS</text><rect x="588" y="142" width="32" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="604" y="151" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS</text><rect x="110" y="292" width="36" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="128" y="301" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FIRST</text><rect x="286" y="344" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="308" y="353" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">-X LINK</text><rect x="426" y="278" width="60" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="456" y="287" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BUILDSTAMP</text><rect x="494" y="414" width="36" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="512" y="423" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READS</text><rect x="758" y="428" width="64" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="790" y="437" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DECLS MOVED</text><rect x="988" y="482" width="72" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="1024" y="491" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MV MAGUS.OLD</text><g data-node="external:Person or hook"><rect x="48" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="48" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="156" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Person or hook</text><text x="156" y="112" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">shell or PreToolUse</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="352" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="352" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="460" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus on PATH</text><text x="460" y="112" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">re-execs ./magus</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="640" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="640" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="748" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Raw-tool rule</text><text x="748" y="112" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">refuses a raw go build</text></g><g data-node="external:go run ./cmd/magus"><rect x="944" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="944" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><text x="1052" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">go run ./cmd/magus</text><text x="1052" y="112" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">run go-build, alone</text></g><g data-node="external:go-build"><rect x="48" y="200" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="48" y="200" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><rect x="56" y="208" width="48" height="12" rx="2" fill="none" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="80" y="217" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">TARGET</text><text x="156" y="240" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">go-build</text><text x="156" y="256" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">generate, link, stamp</text></g><g data-node="external:Spell bytecode"><rect x="48" y="336" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="48" y="336" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="156" y="368" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Spell bytecode</text><text x="156" y="384" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">spells-generate</text></g><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="168" y="472" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="168" y="472" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="276" y="504" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Build stamp</text><text x="276" y="520" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">linked into ./magus</text></g><g data-node="external:Stale policy"><rect x="640" y="336" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="640" y="336" width="216" height="64" rx="6" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="748" y="368" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Stale policy</text><text x="748" y=