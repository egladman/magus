<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 1096" width="992" height="1096" role="img" aria-labelledby="bootstrap-title bootstrap-desc" class="magus-diagram"><title id="bootstrap-title">One bare go build, then magus builds magus</title><desc id="bootstrap-desc">In a checkout with no ./magus, the guard's raw-tool rule lets exactly one go build -o magus ./cmd/magus through, alone on its line. From then on the rule denies it and names ./magus run go-build ., which regenerates the spell bytecode first and links a stamp of the sources the binary was built from. The magus on PATH re-execs that ./magus; the stale policy compares its stamp with the checkout, and when a binary can no longer load the tree the escape moves it aside, which is the one way back to the bare build.</desc><defs><marker id="bootstrap-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="bootstrap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="bootstrap-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">BOOTSTRAP</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One bare go build, then magus builds magus</text><g transform="translate(0,40)"><rect x="32" y="304" width="248" height="248" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="108" y="308" width="96" height="12" rx="2" fill="#2d3142"/><text x="156" y="317" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">GO BUILD, ONCE</text><rect x="304" y="576" width="368" height="384" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="428" y="580" width="120" height="12" rx="2" fill="#2d3142"/><text x="488" y="589" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">MAGUS BUILDS MAGUS</text><rect x="696" y="712" width="248" height="248" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="784" y="716" width="72" height="12" rx="2" fill="#2d3142"/><text x="820" y="725" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">KEPT FRESH</text><path data-edge="person->cli" id="bootstrap-edge-person-cli" d="M 156 128 L 156 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="cli->rule" id="bootstrap-edge-cli-rule" d="M 156 264 L 156 336" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="rule->exempt" id="bootstrap-edge-rule-exempt" d="M 156 400 L 156 472" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="exempt->target" id="bootstrap-edge-exempt-target" d="M 156 536 L 156 564 Q 156 572 164 572 L 420 572 Q 428 572 428 580 L 428 608" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="target->spells" id="bootstrap-edge-target-spells" d="M 428 672 L 428 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="target->stale" id="bootstrap-edge-target-stale" d="M 440 672 L 440 700 Q 440 708 448 708 L 812 708 Q 820 708 820 716 L 820 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="target->stamp" id="bootstrap-edge-target-stamp" d="M 536 640 L 540 640 Q 548 640 548 648 L 548 700 A 8 8 0 0 0 548 716 L 548 880" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="stale->stamp" id="bootstrap-edge-stale-stamp" d="M 808 808 L 808 836 Q 808 844 800 844 L 568 844 Q 560 844 560 852 L 560 880" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="stale->escape" id="bootstrap-edge-stale-escape" d="M 820 808 L 820 880" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="escape->exempt" id="bootstrap-edge-escape-exempt" d="M 928 912 L 952 912 Q 960 912 960 904 L 960 512 Q 960 504 952 504 L 264 504" fill="none" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bootstrap-arrow-accent)"/><rect x="166" y="156" width="60" height="12" rx="2" fill="#2d3142"/><text x="196" y="165" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS MAGUS</text><rect x="166" y="292" width="40" height="12" rx="2" fill="#2d3142"/><text x="186" y="301" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JUDGES</text><rect x="166" y="428" width="60" height="12" rx="2" fill="#2d3142"/><text x="196" y="437" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO ./MAGUS</text><rect x="262" y="550" width="60" height="12" rx="2" fill="#2d3142"/><text x="292" y="559" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">THEN STAMP</text><rect x="382" y="700" width="36" height="12" rx="2" fill="#2d3142"/><text x="400" y="709" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FIRST</text><rect x="598" y="686" width="60" height="12" rx="2" fill="#2d3142"/><text x="628" y="695" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BUILDSTAMP</text><rect x="558" y="752" width="44" height="12" rx="2" fill="#2d3142"/><text x="580" y="761" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">-X LINK</text><rect x="666" y="822" width="36" height="12" rx="2" fill="#2d3142"/><text x="684" y="831" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READS</text><rect x="830" y="836" width="64" height="12" rx="2" fill="#2d3142"/><text x="862" y="845" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DECLS MOVED</text><rect x="576" y="482" width="72" height="12" rx="2" fill="#2d3142"/><text x="612" y="491" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MV MAGUS.OLD</text><g data-node="person"><rect x="48" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="64" width="216" height="64" rx="6" fill="#2d3142" stroke="#8e98ac" stroke-width="1.2"/><text x="156" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Person or hook</text><text x="156" y="112" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">shell or PreToolUse</text></g><g data-node="cli" data-anchor="cmd/magus"><rect x="48" y="200" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="200" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="156" y="232" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus on PATH</text><text x="156" y="248" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">re-execs ./magus</text></g><g data-node="rule" data-anchor="internal/guard"><rect x="48" y="336" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="336" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="156" y="368" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Raw-tool rule</text><text x="156" y="384" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">denies go build</text></g><g data-node="exempt" data-anchor="internal/guard/bootstrap.go"><rect x="48" y="472" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="472" width="216" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="156" y="504" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Bootstrap link</text><text x="156" y="520" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">go build, alone</text></g><g data-node="target" data-anchor="magusfile.buzz"><rect x="320" y="608" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="608" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="328" y="616" width="48" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="352" y="625" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">TARGET</text><text x="428" y="648" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">go-build</text><text x="428" y="664" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">link, then stamp</text></g><g data-node="spells" data-anchor="internal/spell/gen"><rect x="320" y="744" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="744" width="216" height="64" rx="6" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="776" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Spell bytecode</text><text x="428" y="792" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">spells-generate</text></g><g data-node="stamp" data-anchor="internal/interp/bindings"><rect x="440" y="880" width="216" height="64" rx="6" fill="#2d3142"/><rect x="440" y="880" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="548" y="912" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Build stamp</text><text x="548" y="928" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">linked into ./magus</text></g><g data-node="stale" data-anchor="tools/policy/stale.buzz"><rect x="712" y="744" width="216" height="64" rx="6" fill="#2d3142"/><rect x="712" y="744" width="216" height="64" rx="6" fill="#bfc0c0" fill-opacity="0.1" stroke="#8e98ac" stroke-width="1.2"/><text x="820" y="776" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Stale policy</text><text x="820" y="792" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">stamp vs sources</text></g><g data-node="escape" data-anchor="."><rect x="712" y="880" width="216" height="64" rx="6" fill="#2d3142"/><rect x="712" y="880" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="820" y="912" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Relink escape</text><text x="820" y="928" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">stale_build.go</text></g><line x1="32" y1="996" x2="960" y2="996" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="1010" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="1016" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="1025" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE BARE GO BUILD</text><rect x="192" y="1016" width="10" height="10" rx="2" fill="#2d3142" stroke="#8e98ac" stroke-width="0.8"/><text x="210" y="1025" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text><rect x="352" y="1016" width="10" height="10" rx="2" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="370" y="1025" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">EMBEDDED IN THE BINARY</text><rect x="512" y="1016" width="10" height="10" rx="2" fill="#bfc0c0" fill-opacity="0.1" stroke="#8e98ac" stroke-width="0.8"/><text x="530" y="1025" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THIS REPO'S RULES</text></g></svg>