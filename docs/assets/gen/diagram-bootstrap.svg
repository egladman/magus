<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 992 1096" width="992" height="1096" role="img" aria-labelledby="bootstrap-title bootstrap-desc" class="magus-diagram"><metadata>{"figure":"bootstrap","stamp":"sha256:4aaecdc55cde985e45cbe79f6902f7b97279193f11dab72c897000a1fdcedeb6"}</metadata><title id="bootstrap-title">One go run, then magus builds magus</title><desc id="bootstrap-desc">In a checkout with no ./magus, the guard's raw-tool rule advises exactly one command through, alone on its line: go run -trimpath ./cmd/magus run go-build --no-cache ., which runs the real go-build target. It regenerates the spell bytecode first and links a stamp of the sources the binary was built from. Every other raw go command, a bare go build included, is refused and served that command; once ./magus exists the rule names ./magus run go-build . instead. The magus on PATH re-execs that ./magus; the stale policy compares its stamp with the checkout, and when a binary can no longer load the tree the escape moves it aside, which is the one way back to the bootstrap.</desc><defs><marker id="bootstrap-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="bootstrap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="bootstrap-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">BOOTSTRAP</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One go run, then magus builds magus</text><g transform="translate(0,40)"><rect x="32" y="304" width="248" height="248" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="108" y="308" width="96" height="12" rx="2" fill="#2d3142"/><text x="156" y="317" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">NO ./MAGUS YET</text><rect x="304" y="576" width="368" height="384" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="428" y="580" width="120" height="12" rx="2" fill="#2d3142"/><text x="488" y="589" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">MAGUS BUILDS MAGUS</text><rect x="696" y="712" width="248" height="248" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="784" y="716" width="72" height="12" rx="2" fill="#2d3142"/><text x="820" y="725" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">KEPT FRESH</text><path data-edge="external:Person or hook->cmd/magus" id="bootstrap-edge-external_3aPerson_20or_20hook-cmd_2fmagus" d="M 156 128 L 156 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="cmd/magus->internal/guard" id="bootstrap-edge-cmd_2fmagus-internal_2fguard" d="M 156 264 L 156 336" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="internal/guard->external:go run ./cmd/magus" id="bootstrap-edge-internal_2fguard-external_3ago_20run_20_2e_2fcmd_2fmagus" d="M 156 400 L 156 472" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go run ./cmd/magus->external:go-build" id="bootstrap-edge-external_3ago_20run_20_2e_2fcmd_2fmagus-external_3ago-build" d="M 156 536 L 156 564 Q 156 572 164 572 L 420 572 Q 428 572 428 580 L 428 608" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go-build->external:Spell bytecode" id="bootstrap-edge-external_3ago-build-external_3aSpell_20bytecode" d="M 428 672 L 428 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go-build->internal/interp/bindings" id="bootstrap-edge-external_3ago-build-internal_2finterp_2fbindings" d="M 536 640 L 540 640 Q 548 640 548 648 L 548 880" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go-build->external:Stale policy" id="bootstrap-edge-external_3ago-build-external_3aStale_20policy" d="M 440 672 L 440 700 Q 440 708 448 708 L 540 708 A 8 8 0 0 1 556 708 L 812 708 Q 820 708 820 716 L 820 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Stale policy->internal/interp/bindings" id="bootstrap-edge-external_3aStale_20policy-internal_2finterp_2fbindings" d="M 808 808 L 808 836 Q 808 844 800 844 L 568 844 Q 560 844 560 852 L 560 880" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Stale policy->external:Relink escape" id="bootstrap-edge-external_3aStale_20policy-external_3aRelink_20escape" d="M 820 808 L 820 880" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Relink escape->external:go run ./cmd/magus" id="bootstrap-edge-external_3aRelink_20escape-external_3ago_20run_20_2e_2fcmd_2fmagus" d="M 928 912 L 952 912 Q 960 912 960 904 L 960 512 Q 960 504 952 504 L 264 504" fill="none" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#bootstrap-arrow-accent)"/><rect x="166" y="156" width="60" height="12" rx="2" fill="#2d3142"/><text x="196" y="165" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS MAGUS</text><rect x="166" y="292" width="40" height="12" rx="2" fill="#2d3142"/><text x="186" y="301" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JUDGES</text><rect x="166" y="428" width="60" height="12" rx="2" fill="#2d3142"/><text x="196" y="437" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO ./MAGUS</text><rect x="276" y="550" width="32" height="12" rx="2" fill="#2d3142"/><text x="292" y="559" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS</text><rect x="382" y="700" width="36" height="12" rx="2" fill="#2d3142"/><text x="400" y="709" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FIRST</text><rect x="558" y="752" width="44" height="12" rx="2" fill="#2d3142"/><text x="580" y="761" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">-X LINK</text><rect x="598" y="686" width="60" height="12" rx="2" fill="#2d3142"/><text x="628" y="695" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BUILDSTAMP</text><rect x="666" y="822" width="36" height="12" rx="2" fill="#2d3142"/><text x="684" y="831" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READS</text><rect x="830" y="836" width="64" height="12" rx="2" fill="#2d3142"/><text x="862" y="845" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DECLS MOVED</text><rect x="576" y="482" width="72" height="12" rx="2" fill="#2d3142"/><text x="612" y="491" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MV MAGUS.OLD</text><g data-node="external:Person or hook"><rect x="48" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="64" width="216" height="64" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="156" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Person or hook</text><text x="156" y="112" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">shell or PreToolUse</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="48" y="200" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="200" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="156" y="232" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus on PATH</text><text x="156" y="248" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">re-execs ./magus</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="48" y="336" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="336" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="156" y="368" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Raw-tool rule</text><text x="156" y="384" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">refuses a raw go build</text></g><g data-node="external:go run ./cmd/magus"><rect x="48" y="472" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="472" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="156" y="504" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">go run ./cmd/magus</text><text x="156" y="520" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">run go-build, alone</text></g><g data-node="external:go-build"><rect x="320" y="608" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="608" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="328" y="616" width="48" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="352" y="625" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">TARGET</text><text x="428" y="648" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">go-build</text><text x="428" y="664" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">generate, link, stamp</text></g><g data-node="external:Spell bytecode"