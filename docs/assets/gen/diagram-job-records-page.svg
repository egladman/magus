<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 656" width="864" height="656" role="img" aria-labelledby="job-records-title job-records-desc" class="magus-diagram"><metadata>{"figure":"job-records","stamp":"sha256:c73485340920bfddd38f4557fc45ad9e3b0912fddda97ff7890850ec39d9ac4b"}</metadata><title id="job-records-title">A job row is one record, and four packages read it</title><desc id="job-records-desc">The job store keeps one row per job in a JSON Lines file: its goal, checkpoint and write paths, and the leases that release them. Migrations upgrade an old row on read. describe renders the spec an agent reads, the forecast sizes the verifying checks, and the queue types record a landed job. The store reads the session record and the trail to say who held a lease. The guard judges calls against the row, and the sandbox narrows a run's writes to it.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:v