amily="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">JOB</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">A job row is one record, and four packages read it</text><g transform="translate(0,40)"><path data-edge="internal/job->internal/store/migrate" id="job-records-edge-internal_2fjob-internal_2fstore_2fmigrate" d="M 436 204 L 436 180 Q 436 172 444 172 L 616 172" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/describe" id="job-records-edge-internal_2fjob-internal_2fdescribe" d="M 544 252 L 616 252" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/ci/forecast" id="job-records-edge-internal_2fjob-internal_2fci_2fforecast" d="M 544 240 L 572 240 Q 580 240 580 232 L 580 180 A 8 8 0 0 1 580 164 L 580 112 Q 580 104 588 104 L 616 104" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/queue/types" id="job-records-edge-internal_2fjob-internal_2fqueue_2ftypes" d="M 460 300 L 460 324 Q 460 332 468 332 L 616 332" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/sessions" id="job-records-edge-internal_2fjob-internal_2fsessions" d="M 448 300 L 448 404 Q 448 412 456 412 L 616 412" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/trail" id="job-records-edge-internal_2fjob-internal_2ftrail" d="M 436 300 L 436 484 Q 436 492 444 492 L 616 492" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/guard->internal/job" id="job-records-edge-internal_2fguard-internal_2fjob" d="M 248 104 L 280 104 Q 288 104 288 112 L 288 232 Q 288 240 296 240 L 328 240" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/guard->internal/ci/forecast" id="job-records-edge-internal_2fguard-internal_2fci_2fforecast" d="M 248 92 L 616 92" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/sandbox->internal/job" id="job-records-edge-internal_2fsandbox-internal_2fjob" d="M 248 252 L 328 252" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><rect x="298" y="164" width="36" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="316" y="173" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="256" y="262" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="288" y="271" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITE GRANT</text><g data-node="internal/job" data-anchor="internal/job"><rect x="328" y="204" width="216" height="96" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="328" y="204" width="216" height="96" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="436" y="252" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="436" y="268" fill="#5f67