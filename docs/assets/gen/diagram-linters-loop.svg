2 640 32 632 L 32 92 Q 32 84 40 84 L 320 84" fill="none" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#linters-loop-arrow-accent)"/><path data-edge="external:A person->external:analyzers.yaml" id="linters-loop-edge-external_3aA_20person-external_3aanalyzers_2eyaml" d="M 940 128 L 940 156 Q 940 164 932 164 L 704 164 Q 696 164 696 172 L 696 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#linters-loop-arrow-default)"/><path data-edge="external:magus run format->external:analyzers.yaml" id="linters-loop-edge-external_3amagus_20run_20format-external_3aanalyzers_2eyaml" d="M 684 128 L 684 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#linters-loop-arrow-default)"/><rect x="228" y="106" width="32" height="12" rx="2" fill="#2d3142"/><text x="244" y="115" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS</text><rect x="182" y="292" width="32" height="12" rx="2" fill="#2d3142"/><text x="198" y="301" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ASKS</text><rect x="394" y="414" width="52" height="12" rx="2" fill="#2d3142"/><text x="420" y="423" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MEASURES</text><rect x="694" y="564" width="44" height="12" rx="2" fill="#2d3142"/><text x="716" y="573" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VERDICT</text><rect x="694" y="360" width="60" height="12" rx="2" fill="#2d3142"/><text x="724" y="369" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">CONFIGURES</text><rect x="274" y="618" width="60" height="12" rx="2" fill="#2d3142"/><text x="304" y="627" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FIX, RERUN</text><rect x="794" y="142" width="44" height="12" rx="2" fill="#2d3142"/><text x="816" y="151" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXCUSES</text><rect x="630" y="156" width="44" height="12" rx="2" fill="#2d3142"/><text x="652" y="165" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SHRINKS</text><g data-node="external:Author"><rect x="320" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="64" width="216" height="64" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="428" y="96" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Author</text><text x="428" y="112" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">a person or an agent</text></g><g data-node="external:magus run lint"><rect x="64" y="200" width="216" height="64" rx="6" fill="#2d3142"/><rect x="64" y="200" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="72" y="208" width="48" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="96" y="217" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">TARGET</text><text x="172" y="240" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus run lint</text><text x="172" y="256" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">scoped to the files</text></g><a href="#diagram-linters-boundary" data-node="external:magus measures"><g><rect x="64" y="336" width="216" height="64" rx="6" fill="#2d3142"/><rect x="64" y="336" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="172" y="368" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus measures</text><text x="172" y="384" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">graph, conformance rows</text></g></a><a href="#diagram-linters-boundary" data-node="external:Analyzers judge"><g><rect x="576" y="472" width="216" height="64" rx="6" fill="#2d3142"/><rect x="576" y="472" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="684" y="504" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Analyzers judge</text><text x="684" y="520" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">libs/conventions, hack/lint</text></g></a><g data-node="external:analyzers.yaml"><rect x="576" y="200" width="216" height="64" rx="6" fill="#2d3142"/><rect x="576" y="200" width="216" height="64" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="684" y="232" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">analyzers.yaml</text><text x="684" y="248" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">per project</text></g><g data-node="external:Finding"><rect x="576" y="608" width="216" height="64" rx="6" fill="#2d3142"/><rect x="576" y="608" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="684" y="640" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Finding</text><text x="684" y="656" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:n