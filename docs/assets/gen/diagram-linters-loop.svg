<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 824" width="1080" height="824" role="img" aria-labelledby="linters-loop-title linters-loop-desc" class="magus-diagram"><metadata>{"diagram":"linters-loop","stamp":"sha256:2f7afcc12a1bdd480f1277cf04c83bb01f16f763fa34a1cd116f86e5529c02c1"}</metadata><title id="linters-loop-title">magus measures, the analyzers judge, and the finding says what to fix</title><desc id="linters-loop-desc">magus run lint asks magus to measure the head and the base revision. The analyzers this repository writes judge those measures against analyzers.yaml, and each verdict is a finding with a message and a fix the author applies and reruns. Only a person adds a baseline entry or an exit; format drops the entries the code no longer needs.</desc><defs><marker id="linters-loop-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="linters-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="linters-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">LINTERS</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">magus measures, the analyzers judge, and the finding says what to fix</text><g transform="translate(0,40)"><rect x="48" y="304" width="248" height="112" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="80" y="308" width="184" height="12" rx="2" fill="#2d3142"/><text x="172" y="317" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none"