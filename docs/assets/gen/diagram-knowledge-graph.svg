<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 752" width="680" height="752" role="img" aria-labelledby="knowledge-graph-title knowledge-graph-desc" class="magus-diagram"><metadata>{"diagram":"knowledge-graph","stamp":"sha256:f5e6c9990f7bac45b14dbbf74d9d34b869571f37bdc2dd5fa941646d756e307d"}</metadata><title id="knowledge-graph-title">Every source writes a shard; every reader asks one graph</title><desc id="knowledge-graph-desc">magus graph build assembles a shard per source: the magusfiles, Buzz, docs, directories and owners, a lazy symbol shard per project from a SCIP index, git history and notes. The store rewrites only the shards whose content changed and merges them into one graph, which the CLI and the MCP tools both read.</desc><defs><marker id="knowledge-graph-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="knowledge-graph-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="knowledge-graph-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">KNOWLEDGE GRAPH</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">Every source writes a shard; every reader asks one graph</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="376" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="80" y="68" width="120" height="12" rx="2" fill="#2d3142"/><text x="140" y="77" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">A SHARD PER SOURCE</text><path data-edge="external:Magusfiles and docs->internal/graph/knowledge" id="knowledge-graph-edge-external_3aMagusfiles_20and_20docs-internal_2fgraph_2fknowledge" d="M 248 128 L 284 128 Q 292 128 292 136 L 292 272 Q 292 280 300 280 L 320 280" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="external:History->internal/graph/knowledge" id="knowledge-graph-edge-external_3aHistory-internal_2fgraph_2fknowledge" d="M 248 216 L 268 216 Q 276 216 276 224 L 276 284 Q 276 292 284 292 L 320 292" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="external:Notes->internal/graph/knowledge" id="knowledge-graph-edge-external_3aNotes-internal_2fgraph_2fknowledge" d="M 248 304 L 320 304" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="cmd/magus->internal/graph/knowledge" id="knowledge-graph-edge-cmd_2fmagus-internal_2fgraph_2fknowledge" d="M 248 496 L 268 496 Q 276 496 276 488 L 276 324 Q 276 316 284 316 L 320 316" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="internal/handler/mcp->internal/graph/knowledge" id="knowledge-graph-edge-internal_2fhandler_2fmcp-internal_2fgraph_2fknowledge" d="M 248 584 L 284 584 Q 292 584 292 576 L 292 336 Q 292 328 300 328 L 320 328" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><g data-node="external:Magusfiles and docs"><rect x="32" y="96" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="96" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="128" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Magusfiles and docs</text><text x="140" y="144" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">registry, Buzz, docs, dirs, owners</text></g><g data-node="external:History"><rect x="32" y="184" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="184" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="216" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">History</text><text x="140" y="232" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">@vcs, from git</text></g><g data-node="external:Notes"><rect x="32" y="272" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="272" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="304" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Notes</text><text x="140" y="320" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">@notes shared + private</text></g><g data-node="group:Symbol index" data-drill="symbol-index"><rect x="32" y="360" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="360" width="216" height="64" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="392" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Symbol index</text><text x="140" y="408" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">SCIP per language, lazy shards</text></g><g data-node="internal/graph/knowledge" data-anchor="internal/graph/knowledge"><rect x="320" y="268" width="216" height="72" rx="6" fill="#2d3142"/><rect x="320" y="268" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="428" y="304" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">One graph</text><text x="428" y="320" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">query, explain, refs, path</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="32" y="464" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="464" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="40" y="472" width="48" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="64" y="481" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">READER</text><text x="140" y="504" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus CLI</text><text x="140" y="520" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">text or -o json</text></g><g data-node="internal/handler/mcp" data-anchor="internal/handler/mcp"><rect x="32" y="552" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="552" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="40" y="560" width="48" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="64" y="569" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">READER</text><text x="140" y="592" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">MCP client</text><text x="140" y="608" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus\graph().query and kin</text></g><line x1="32" y1="652" x2="648" y2="652" stroke="#505466" stroke-width="0.8"/><text x="32" y="666" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="672" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="681" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT EVERY READER ASKS</text><rect x="192" y="672" width="10" height="10" rx="2" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="681" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">BUILT BY A SCIP INDEXER</text></g></svg>