<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 576" width="856" height="576" role="img" aria-labelledby="config-load-title config-load-desc" class="magus-diagram"><metadata>{"figure":"config-load","stamp":"sha256:de39eddc11ff0e000b70320d8c5e15488f686e2d11683dab0eb7ed612ecaf72f"}</metadata><title id="config-load-title">Every key has one declaration, and every source feeds the same load</title><desc id="config-load-desc">The load reads magus.yaml, the environment and the flags into one set of keys, resolving user and state paths through the xdg directories. A remote source goes through the HTTP client, a daemon address through the endpoint package, and a key that names a ward or a stamp is checked against it. The keys come from one declaration. The generator writes the typed accessors in gen from it, so a flag, a config key and the help text cannot disagree.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="config-load-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="config-load-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="config-load-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">CONFIG</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">Every key has one declaration, and every source feeds the same load</text><g transform="translate(0,40)"><path data-edge="external:Config sources->internal/config" id="config-load-edge-external_3aConfig_20sources-internal_2fconfig" d="M 248 92 L 284 92 Q 292 92 292 100 L 292 220 Q 292 228 300 228 L 320 228" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->internal/httpx" id="config-load-edge-internal_2fconfig-internal_2fhttpx" d="M 428 216 L 428 100 Q 428 92 436 92 L 608 92" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->internal/proc/endpoint" id="config-load-edge-internal_2fconfig-internal_2fproc_2fendpoint" d="M 440 216 L 440 180 Q 440 172 448 172 L 608 172" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->internal/ward" id="config-load-edge-internal_2fconfig-internal_2fward" d="M 536 252 L 608 252" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->internal/stamp" id="config-load-edge-internal_2fconfig-internal_2fstamp" d="M 440 288 L 440 324 Q 440 332 448 332 L 608 332" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->libs/xdg" id="config-load-edge-internal_2fconfig-libs_2fxdg" d="M 428 288 L 428 404 Q 428 412 436 412 L 608 412" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config/gen->internal/config" id="config-load-edge-internal_2fconfig_2fgen-internal_2fconfig" d="M 248 172 L 268 172 Q 276 172 276 180 L 276 232 Q 276 240 284 240 L 320 240" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config/generate->internal/config" id="config-load-edge-internal_2fconfig_2fgenerate-internal_2fconfig" d="M 248 252 L 320 252" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><g data-node="external:Config sources"><rect x="32" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Config sources</text><text x="140" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus.yaml, env, flags</text></g><g data-node="internal/config" data-anchor="internal/config"><rect x="320" y="216" width="216" height="72" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="216" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="428" y="252" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Config load</text><text x="428" y="268" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one set of keys</text></g><g data-node="internal/config/gen" data-anchor="internal/config/gen"><rect x="32" y="144" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="140" y="172" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Typed keys</text><text x="140" y="188" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">generated accessors</text></g><g data-node="internal/config/generate" data-anchor="internal/config/generate"><rect x="32" y="224" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="252" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Key generator</text><text x="140" y="268" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">from the declaration</text></g><g data-node="internal/httpx" data-anchor="internal/httpx"><rect x="608" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="716" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">HTTP client</text><text x="716" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middl