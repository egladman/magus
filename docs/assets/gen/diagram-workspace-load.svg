<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1472 416" width="1472" height="416" role="img" aria-labelledby="workspace-load-title workspace-load-desc" class="magus-diagram"><title id="workspace-load-title">A target exists because a magusfile exported it</title><desc id="workspace-load-desc">Discovery walks the tree from the root marker and registers one project per magusfile: the root's is project ., each nested one declares its own. Every magusfile is evaluated: its exported functions are its targets and magus\project layers policy on. A static read of each target body recovers ctx.readsFiles, ctx.writesFiles and cross-project ctx.needs as literals. The project model that results is what the cache keys, what describe answers from, and what a command resolves its project against from the current directory.</desc><defs><marker id="workspace-load-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="workspace-load-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="workspace-load-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">WORKSPACE</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A target exists because a magusfile exported it</text><g transform="translate(0,40)"><rect x="16" y="92" width="248" height="184" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="90" y="96" width="100" height="12" rx="2" fill="#2d3142"/><text x="140" y="105" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WRITTEN BY HAND</text><path data-edge="rootmf->discover" id="workspace-load-edge-rootmf-discover" d="M 248 152 L 284 152 Q 292 152 292 160 L 292 176 Q 292 184 300 184 L 336 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="nestedmf->discover" id="workspace-load-edge-nestedmf-discover" d="M 248 232 L 284 232 Q 292 232 292 224 L 292 208 Q 292 200 300 200 L 336 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="discover->interp" id="workspace-load-edge-discover-interp" d="M 444 164 L 444 120 Q 444 112 452 112 L 624 112" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="discover->extract" id="workspace-load-edge-discover-extract" d="M 552 192 L 624 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="interp->model" id="workspace-load-edge-interp-model" d="M 840 112 L 872 112 Q 880 112 880 120 L 880 156 Q 880 164 888 164 L 920 164" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="extract->model" id="workspace-load-edge-extract-model" d="M 840 192 L 874 192 Q 880 192 880 186 L 880 186 Q 880 180 886 180 L 920 180" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="model->cache" id="workspace-load-edge-model-cache" d="M 1028 144 L 1028 100 Q 1028 92 1036 92 L 1208 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="model->describe" id="workspace-load-edge-model-describe" d="M 1136 172 L 1208 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="model->cwd" id="workspace-load-edge-model-cwd" d="M 1028 200 L 1028 244 Q 1028 252 1036 252 L 1208 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><rect x="260" y="130" width="64" height="12" rx="2" fill="#2d3142"/><text x="292" y="139" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS .</text><rect x="254" y="242" width="76" height="12" rx="2" fill="#2d3142"/><text x="292" y="251" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS DIR</text><rect x="846" y="90" width="44" height="12" rx="2" fill="#2d3142"/><text x="868" y="99" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">TARGETS</text><rect x="846" y="202" width="60" height="12" rx="2" fill="#2d3142"/><text x="876" y="211" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FOOTPRINTS</text><rect x="1086" y="230" width="60" height="12" rx="2" fill="#2d3142"/><text x="1116" y="239" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WHERE(CWD)</text><g data-node="rootmf" data-anchor="magusfile.buzz"><rect x="32" y="124" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="124" width="216" height="56" rx="6" fill="#bfc0c0" fill-opacity="0.1" stroke="#8e98ac" stroke-width="1.2"/><text x="140" y="152" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Root magusfile</text><text x="140" y="168" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">declares project .</text></g><g data-node="nestedmf" data-anchor="docs/magusfile.buzz"><rect x="32" y="204" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="204" width="216" height="56" rx="6" fill="#bfc0c0" fill-opacity="0.1" stroke="#8e98ac" stroke-width="1.2"/><text x="140" y="232" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Nested magusfiles</text><text x="140" y="248" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">docs/, proto/, libs/*</text></g><g data-node="discover" data-anchor="project"><rect x="336" y="164" width="216" height="56" rx="6" fill="#2d3142"/><rect x="336" y="164" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="444" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Discovery</text><text x="444" y="208" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">a magusfile is a project</text></g><g data-node="interp" data-anchor="internal/interp"><rect x="624" y="84" width="216" height="56" rx="6" fill="#2d3142"/><rect x="624" y="84" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="732" y="112" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Evaluate</text><text x="732" y="128" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">export fun is a target</text></g><g data-node="extract" data-anchor="internal/describe"><rect x="624" y="164" width="216" height="56" rx="6" fill="#2d3142"/><rect x="624" y="164" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="732" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Static read</text><text x="732" y="208" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">literal reads, writes, needs</text></g><g data-node="model" data-anchor="types/project.go"><rect x="920" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="920" y="144" width="216" height="56" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="1028" y="172" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Projects and targets</text><text x="1028" y="188" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">sources, outputs, depends_on</text></g><g data-node="cache" data-anchor="internal/cache"><rect x="1208" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="1208" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1316" y="92" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Cache key</text><text x="1316" y="108" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">one step per target</text></g><g data-node="describe" data-anchor="describe.go"><rect x="1208" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="1208" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1316" y="172" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus describe</text><text x="1316" y="188" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">targets, claims, the graph</text></g><g data-node="cwd" data-anchor="project/affected.go"><rect x="1208" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="1208" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1316" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Directory context</text><text x="1316" y="268" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">cwd picks the project</text></g><line x1="32" y1="316" x2="1440" y2="316" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="330" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="336" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="345" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT EVERY READER READS</text><rect x="192" y="336" width="10" height="10" rx="2" fill="#bfc0c0" fill-opacity="0.1" stroke="#8e98ac" stroke-width="0.8"/><text x="210" y="345" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONLY DECLARATIONS</text></g></svg>