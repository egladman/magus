<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 544" width="984" height="544" role="img" aria-labelledby="workspace-load-title workspace-load-desc" class="magus-diagram"><metadata>{"figure":"workspace-load","stamp":"sha256:17f6d8ec4bcc52e43192514f5b3a10a174d1e4238baca18f27bbe71ec5db375f"}</metadata><title id="workspace-load-title">A target exists because a magusfile exported it</title><desc id="workspace-load-desc">Discovery registers one project per magusfile. Evaluating a magusfile turns its exported functions into targets, and a static read of each target body recovers its literal reads, writes and cross-project needs. The project model that results is what the cache keys and what describe answers from.</desc><defs><marker id="workspace-load-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="workspace-load-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="workspace-load-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">WORKSPACE</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">A target exists because a magusfile exported it</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="184" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="90" y="68" width="100" height="12" rx="2" fill="#2d3142"/><text x="140" y="77" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WRITTEN BY HAND</text><path data-edge="external:Root magusfile->project" id="workspace-load-edge-external_3aRoot_20magusfile-project" d="M 248 124 L 332 124 Q 340 124 340 132 L 340 184 Q 340 192 348 192 L 432 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="external:Nested magusfiles->project" id="workspace-load-edge-external_3aNested_20magusfiles-project" d="M 248 204 L 432 204" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="project->types" id="workspace-load-edge-project-types" d="M 648 204 L 684 204 Q 692 204 692 212 L 692 292 Q 692 300 700 300 L 720 300" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/interp->types" id="workspace-load-edge-internal_2finterp-types" d="M 140 328 L 140 332 Q 140 340 148 340 L 670 340 Q 676 340 676 334 L 676 334 Q 676 328 682 328 L 720 328" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/interp->internal/cache" id="workspace-load-edge-internal_2finterp-internal_2fcache" d="M 248 300 L 432 300" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/describe->project" id="workspace-load-edge-internal_2fdescribe-project" d="M 248 368 L 332 368 Q 340 368 340 360 L 340 348 A 8 8 0 0 1 340 332 L 340 308 A 8 8 0 0 1 340 292 L 340 224 Q 340 216 348 216 L 432 216" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/describe->types" id="workspace-load-edge-internal_2fdescribe-types" d="M 248 380 L 684 380 Q 692 380 692 372 L 692 348 Q 692 340 700 340 L 720 340" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/cache->types" id="workspace-load-edge-internal_2fcache-types" d="M 648 300 L 670 300 Q 676 300 676 306 L 676 306 Q 676 312 682 312 L 720 312" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><rect x="260" y="102" width="64" height="12" rx="2" fill="#2d3142"/><text x="292" y="111" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS .</text><rect x="254" y="182" width="76" height="12" rx="2" fill="#2d3142"/><text x="292" y="191" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS DIR</text><rect x="386" y="350" width="44" height="12" rx="2" fill="#2d3142"/><text x="408" y="359" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">TARGETS</text><rect x="438" y="358" width="60" height="12" rx="2" fill="#2d3142"/><text x="468" y="367" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FOOTPRINTS</text><g data-node="external:Root magusfile"><rect x="32" y="96" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="96" width="216" height="56" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="124" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Root magusfile</text><text x="140" y="140" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">declares project .</text></g><g data-node="external:Nested magusfiles"><rect x="32" y="176" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="176" width="216" height="56" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="204" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Nested magusfiles</text><text x="140" y="220" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">docs/, proto/, libs/*</text></g><g data-node="project" data-anchor="project"><rect x="432" y="176" width="216" height="56" rx="6" fill="#2d3142"/><rect x="432" y="176" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="540" y="204" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Projects</text><text x="540" y="220" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">discovery, Where(cwd)</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="32" y="272" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="272" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="300" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Evaluate</text><text x="140" y="316" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">export fun is a target</text></g><g data-node="internal/describe" data-anchor="internal/describe"><rect x="32" y="352" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="352" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="380" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Static read</text><text x="140" y="396" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">literal reads, writes, needs</text></g><g data-node="types" data-anchor="types"><rect x="720" y="284" width="216" height="72" rx="6" fill="#2d3142"/><rect x="720" y="284" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="828" y="320" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Projects and targets</text><text x="828" y="336" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sources, outputs, depends_on</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="432" y="272" width="216" height="56" rx="6" fill="#2d3142"/><rect x="432" y="272" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="540" y="300" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cache key</text><text x="540" y="316" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one step per target</text></g><line x1="32" y1="444" x2="952" y2="444" stroke="#505466" stroke-width="0.8"/><text x="32" y="458" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="464" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="473" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT EVERY READER READS</text><rect x="192" y="464" width="10" height="10" rx="2" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="473" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONLY DECLARATIONS</text></g></svg>