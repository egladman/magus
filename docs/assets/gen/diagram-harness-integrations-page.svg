<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 472" width="1760" height="472" role="img" aria-labelledby="harness-integrations-title harness-integrations-desc" class="magus-diagram"><metadata>{"figure":"harness-integrations","stamp":"sha256:de73bbede234de34fe92c4778fcfc9e63201aaac47e553885b1ac7e208e2bdd9"}</metadata><title id="harness-integrations-title">One spell per host writes the hook that reaches the guard</title><desc id="harness-integrations-desc">Each supported host has a harness spell under spells/harness: Claude Code, Codex, Cursor and OpenCode, plus the Claude Code mod. A spell knows where its host keeps hook entries and prints the entry a person merges. magus agent install writes the shared half, the embedded skills and the read-only scout agent, through internal/agent. The hook each spell prints runs the guard before every call. The driver in internal/agent/harness runs a host's loop in tests, so a spell's output is proven against a real hook payload.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="harness-integrations-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="harness-integrations-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="harness-integrations-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">One spell per host writes the hook that reaches the guard</text><g transform="translate(0,40)"><rect x="16" y="136" width="536" height="112" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="222" y="140" width="124" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="284" y="149" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT A SPELL PRINTS</text><path data-edge="external:Harness spells->external:Hook entry" id="harness-integrations-edge-external_3aHarness_20spells-external_3aHook_20entry" d="M 248 200 L 320 200" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="external:Hook entry->external:Agent host" id="harness-integrations-edge-external_3aHook_20entry-external_3aAgent_20host" d="M 536 200 L 632 200" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="external:Agent host->internal/guard" id="harness-integrations-edge-external_3aAgent_20host-internal_2fguard" d="M 848 200 L 920 200" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-accent)"/><path data-edge="external:Skills->external:Agent host" id="harness-integrations-edge-external_3aSkills-external_3aAgent_20host" d="M 1604 80 L 1604 72 Q 1604 64 1596 64 L 748 64 Q 740 64 740 72 L 740 168" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/agent->external:Skills" id="harness-integrations-edge-internal_2fagent-external_3aSkills" d="M 1316 168 L 1316 120 Q 1316 112 1324 112 L 1496 112" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/agent->external:Scout agent" id="harness-integrations-edge-internal_2fagent-external_3aScout_20agent" d="M 1424 200 L 1496 200" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/guard->internal/agent" id="harness-integrations-edge-internal_2fguard-internal_2fagent" d="M 1136 200 L 1208 200" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><rect x="264" y="178" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="284" y="187" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PRINTS</text><rect x="544" y="178" width="80" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="584" y="187" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGED BY HAND</text><rect x="854" y="178" width="60" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="884" y="187" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><re