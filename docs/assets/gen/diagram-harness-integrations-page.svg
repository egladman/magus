font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><rect x="138" y="346" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="160" y="355" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ BY</text><rect x="200" y="618" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="220" y="627" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITES</text><rect x="406" y="700" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="426" y="709" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITES</text><g data-node="external:Harness spells"><rect x="288" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="288" y="64" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="396" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Harness spells</text><text x="396" y="112" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">spells/harness: claude-code, codex, cursor, opencode</text></g><g data-node="external:Hook entry"><rect x="288" y="200" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="288" y="200" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="396" y="232" fill="#2d3142" font-family="sans