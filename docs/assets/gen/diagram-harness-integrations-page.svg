dle">Hook entry</text><text x="428" y="216" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">printed by describe harness</text></g><g data-node="external:Agent host"><rect x="632" y="168" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="632" y="168" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" class="magus-fill-paper magus-stroke-soft" stroke-width="1.2"/><rect x="640" y="176" width="48" height="12" rx="2" fill="none" stroke="#5f6780" class="magus-stroke-soft" stroke-width="0.8"/><text x="664" y="185" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="740" y="208" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Agent host</text><text x="740" y="224" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, Codex, Cursor, OpenCode</text></g><g data-node="external:Skills"><rect x="1496" y="80" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1496" y="80" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1604" y="112" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Skills</text><text x="1604" y="128" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">embedded, stamped</text></g><g data-node="external:Scout agent"><rect x="1496" y="168" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1496" y="168