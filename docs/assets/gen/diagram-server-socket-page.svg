-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SHELL</text><text x="140" y="192" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">You</text><text x="140" y="208" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">run, status, query</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="320" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="428" y="184" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">magus CLI</text><text x="428" y="200" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">dispatches every command</text></g><g data-node="internal/proc" data-anchor="internal/proc"><rect x="896" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="896" y="152" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><rect x="904" y="160" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="0.8"/><text x="918" y="169" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">IPC</text><text x="1004" y="192" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Unix socket</text><text x="1004" y="208" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">0700, internal/proc</text></g><g data-node="internal/server" data-anchor="internal/server"><rect x="608" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="152" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="716" y="184" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Server</text><text x="716" y="200" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">pool, registries, broker</text></g><g data-node="internal/share" data-anchor="internal/share"><rect x="896" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="896" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="1.2" stroke-dasharray="4,3"/><text x="1004" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Loopback server</text><text x="1004" y="112" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">graph export --open</text></g><line x1="32" y1="264" x2="1112" y2="264" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="278" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="284" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="0.8"/><text x="50" y="293" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">SHARED SERVER STATE</text><rect x="192" y="284" width="10" height="10" rx="2" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="0.8"/><text x="210" y="293" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">SPAWNED ON DEMAND</text></g></svg>