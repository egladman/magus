<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 528" width="856" height="528" role="img" aria-labelledby="server-socket-title server-socket-desc" class="magus-diagram"><metadata>{"figure":"server-socket","stamp":"sha256:1eeea14165bcee7fab42d785848ca996e2a928ad91cb5f48ca7f9e058798adb5"}</metadata><title id="server-socket-title">How a local command reaches the server</title><desc id="server-socket-desc">The magus CLI dispatches over a private unix domain socket into the concurrency pool, the workspace registry and the run registry; shared services go to the broker. Sharing a graph spawns a separate short-lived loopback server.</desc><defs><marker id="server-socket-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="server-socket-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="server-socket-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">How a local command reaches the server</text><g transform="translate(0,40)"><path data-edge="external:magus CLI->internal/proc" id="server-socket-edge-external_3amagus_20CLI-internal_2fproc" d="M 248 184 L 320 184" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><path data-edge="external:magus CLI->internal/share" id="server-socket-edge-external_3amagus_20CLI-internal_2fshare" d="M 140 216 L 140 268 Q 140 276 148 276 L 320 276" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#server-socket-arrow-default)"/><path data-edge="internal/proc->external:Concurrency pool" id="server-socket-edge-internal_2fproc-external_3aConcurrency_20pool" d="M 428 148 L 428 104 Q 428 96 436 96 L 608 96" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><path data-edge="internal/proc->external:Workspace registry" id="server-socket-edge-internal_2fproc-external_3aWorkspace_20registry" d="M 536 184 L 608 184" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><path data-edge="internal/proc->external:Run registry" id="server-socket-edge-internal_2fproc-external_3aRun_20registry" d="M 536 196 L 572 196 Q 580 196 580 204 L 580 264 Q 580 272 588 272 L 608 272" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><path data-edge="internal/proc->external:Broker" id="server-socket-edge-internal_2fproc-external_3aBroker" d="M 536 208 L 556 208 Q 564 208 564 216 L 564 352 Q 564 360 572 360 L 608 360" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><rect x="258" y="162" width="52" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="284" y="171" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text><rect x="208" y="254" width="40" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="228" y="263" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SPAWNS</text><g data-node="external:magus CLI"><rect x="32" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><rect x="40" y="160" width="40" height="12" rx="2" fill="none" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="60" y="169" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SHELL</text><text x="140" y="192" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus CLI</text><text x="140" y="208" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">run, status, query</text></g><g data-node="internal/proc" data-anchor="internal/proc"><rect x="320" y="148" width="216" height="72" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="320" y="148" width="216" height="72" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><rect x="328" y="156" width="28" height="12" rx="2" fill="none" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="0.8"/><text x="342" y="165" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">IPC</text><text x="428" y="188" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Unix socket</text><text x="428" y="204" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">0700, internal/proc</text></g><g data-node="internal/share" data-anchor="internal/share"><rect x="320" y="244" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="320" y="244" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2" stroke-dasharray="4,3"/><text x="428" y="276" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Loopback server</text><text x="428" y="292" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">graph export --open</text></g><g data-node="external:Concurrency pool"><rect x="608" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="716" y="100" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Concurrency pool</text></g><g data-node="external:Workspace registry"><rect x="608" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="716" y="184" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace registry</text><text x="716" y="200" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">graph, SCIP, cache</text></g><g data-node="external:Run registry"><rect x="608" y="240" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="240" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="716" y="272" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Run registry</text><text x="716" y="288" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">live runs</text></g><g data-node="external:Broker"><rect x="608" y="328" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="328" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="716" y="360" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Broker</text><text x="716" y="376" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">shared services</text></g><line x1="32" y1="428" x2="824" y2="428" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="32" y="442" fill="var(--magus-diagram-muted, #4f5d75)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="448" width="10" height="10" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="50" y="457" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">SHARED SERVER STATE</text><rect x="192" y="448" width="10" height="10" rx="2" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="210" y="457" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">SPAWNED ON DEMAND</text></g></svg>