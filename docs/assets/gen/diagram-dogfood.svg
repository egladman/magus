<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 432" width="872" height="432" role="img" aria-labelledby="dogfood-title dogfood-desc" class="magus-diagram"><metadata>{"figure":"dogfood","stamp":"sha256:c10f1ad0e36fddbd33608ecb44e5df5ccd4ff296c89623d02860185a283e11a5"}</metadata><title id="dogfood-title">magus builds magus, then runs the last release at it too</title><desc id="dogfood-desc">Almost every CI job builds magus from the commit under test and runs it against that commit's magusfile, so a change can rely on a feature that has not shipped. One audit job instead runs the pinned previous release against the same magusfile; it is advisory, and a failure reports a breaking change rather than blocking the branch.</desc><defs><marker id="dogfood-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="dogfood-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="dogfood-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">DEVELOPMENT</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">magus builds magus, then runs the last release at it too</text><g transform="translate(0,40)"><rect x="304" y="64" width="536" height="104" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="446" y="68" width="252" height="12" rx="2" fill="#2d3142"/><text x="572" y="77" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">BLOCKING: THE BINARY THIS COMMIT DEFINES</text><rect x="304" y="192" width="536" height="104" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="440" y="196" width="264" height="12" rx="2" fill="#2d3142"/><text x="572" y="205" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ADVISORY: THE LAST RELEASE, SAME MAGUSFILE</text><path data-edge="external:This commit->external:Built from source" id="dogfood-edge-external_3aThis_20commit-external_3aBuilt_20from_20source" d="M 140 160 L 140 132 Q 140 124 148 124 L 320 124" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dogfood-arrow-default)"/><path data-edge="external:This commit->external:Last release" id="dogfood-edge-external_3aThis_20commit-external_3aLast_20release" d="M 140 216 L 140 244 Q 140 252 148 252 L 320 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dogfood-arrow-default)"/><path data-edge="external:Built from source->external:Every gate" id="dogfood-edge-external_3aBuilt_20from_20source-external_3aEvery_20gate" d="M 536 124 L 608 124" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dogfood-arrow-default)"/><path data-edge="external:Last release->external:audit compat" id="dogfood-edge-external_3aLast_20release-external_3aaudit_20compat" d="M 536 252 L 608 252" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#dogfood-arrow-accent)"/><rect x="544" y="102" width="56" height="12" rx="2" fill="#2d3142"/><text x="572" y="111" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MUST PASS</text><rect x="546" y="230" width="52" height="12" rx="2" fill="#2d3142"/><text x="572" y="239" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MAY FAIL</text><g data-node="external:This commit"><rect x="32" y="160" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="160" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="188" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">This commit</text><text x="140" y="204" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magusfile + Go source</text></g><g data-node="external:Built from source"><rect x="320" y="96" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="96" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="124" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Built from source</text><text x="428" y="140" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">setup-magus source-path</text></g><g data-node="external:Last release"><rect x="320" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="428" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Last release</text><text x="428" y="268" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">setup-magus git-ref</text></g><g data-node="external:Every gate"><rect x="608" y="96" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="96" width="216" height="56" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="716" y="124" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Every gate</text><text x="716" y="140" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">lint, build, test, ci</text></g><g data-node="external:audit compat"><rect x="608" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#a9b1c2" stroke-width="1.2" stroke-dasharray="4,3"/><text x="716" y="252" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">audit compat</text><text x="716" y="268" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">red is a signal, not a stop</text></g><line x1="32" y1="332" x2="840" y2="332" stroke="#505466" stroke-width="0.8"/><text x="32" y="346" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="352" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="361" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">BLOCKS THE BRANCH</text><rect x="192" y="352" width="10" height="10" rx="2" fill="#393e53" stroke="#a9b1c2" stroke-width="0.8"/><text x="210" y="361" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">ADVISORY ONLY</text></g></svg>