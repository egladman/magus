<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 768" width="1012" height="768" role="img" aria-labelledby="symbol-index-title symbol-index-desc" class="magus-diagram"><metadata>{"diagram":"symbol-index","stamp":"sha256:6a0a0923e150347611f72e6ef326c3b7b80e5cb102b855631360fb1335ead1d9"}</metadata><title id="symbol-index-title">A SCIP indexer per language writes the file the graph reads lazily</title><desc id="symbol-index-desc">Each language has an indexer behind one contract: the Go indexer wraps a Go analyzer, the Buzz indexer parses with scipbuzz, and the shell indexer reads scripts. Each writes one SCIP file per project when its sources change, and the knowledge graph opens that file one project at a time instead of loading every symbol.</desc><style>.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#f5f5f5);--magus-diagram-paint-fill:var(--magus-diagram-fill,#ffffff);--magus-diagram-paint-ink:var(--magus-diagram-ink,#2d3142);--magus-diagram-paint-muted:var(--magus-diagram-muted,#4f5d75);--magus-diagram-paint-soft:var(--magus-diagram-soft,#5f6780);--magus-diagram-paint-rule:var(--magus-diagram-rule,#e6e6e8);--magus-diagram-paint-accent:var(--magus-diagram-accent,#eb6c36);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-diagram-paint-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#2d3142);--magus-diagram-paint-fill:var(--magus-diagram-fill,#393e53);--magus-diagram-paint-ink:var(--magus-diagram-ink,#f5f5f5);--magus-diagram-paint-muted:var(--magus-diagram-muted,#bfc0c0);--magus-diagram-paint-soft:var(--magus-diagram-soft,#a9b1c2);--magus-diagram-paint-rule:var(--magus-diagram-rule,#505466);--magus-diagram-paint-accent:var(--magus-diagram-accent,#f08a59);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-diagram-paint-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-diagram-paint-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-diagram-paint-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-diagram-paint-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-diagram-paint-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-diagram-paint-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-diagram-paint-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-diagram-paint-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-diagram-paint-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-diagram-paint-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-diagram-paint-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-diagram-paint-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-diagram-paint-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-diagram-paint-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-diagram-paint-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-diagram-paint-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-diagram-paint-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="symbol-index-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="symbol-index-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="symbol-index-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SYMBOLS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">A SCIP indexer per language writes the file the graph reads lazily</text><g transform="translate(0,40)"><path data-edge="internal/symbols->external:index.scip" id="symbol-index-edge-internal_2fsymbols-external_3aindex_2escip" d="M 620 376 L 620 448" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/symbols/goindex->internal/symbols" id="symbol-index-edge-internal_2fsymbols_2fgoindex-internal_2fsymbols" d="M 140 248 L 140 284 Q 140 292 148 292 L 588 292 Q 596 292 596 300 L 596 320" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/symbols/buzzindex->internal/symbols" id="symbol-index-edge-internal_2fsymbols_2fbuzzindex-internal_2fsymbols" d="M 392 248 L 392 268 Q 392 276 400 276 L 600 276 Q 608 276 608 284 L 608 320" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/symbols/buzzindex->libs/scipbuzz" id="symbol-index-edge-internal_2fsymbols_2fbuzzindex-libs_2fscipbuzz" d="M 380 248 L 380 284 A 8 8 0 0 0 380 300 L 380 320" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/symbols/shindex->internal/symbols" id="symbol-index-edge-internal_2fsymbols_2fshindex-internal_2fsymbols" d="M 620 248 L 620 320" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marke