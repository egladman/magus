ternal/graph/knowledge" id="symbol-index-edge-external_3aindex_2escip-internal_2fgraph_2fknowledge" d="M 620 504 L 620 576" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><rect x="630" y="404" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="650" y="413" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITES</text><rect x="630" y="532" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="662" y="541" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ LAZILY</text><g data-node="internal/symbols" data-anchor="internal/symbols"><rect x="512" y="320" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="512" y="320" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="620" y="348" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Index contract</text><text x="620" y="364" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what an indexer returns</text></g><g data-node="internal/symbols/goindex" data-anchor="internal/symbols/goindex"><rect x="32" y="192" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="220" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Go indexer</text><text x="140" y="236" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">packages, symbols</text></g><g data-node="internal/symbols/buzzindex" data-anchor="internal/symbols/buzzindex"><rect x="272" y="192" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="272" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="380" y="220" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Buzz indexer</text><text x="380" y="236" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">parsed by scipbuzz</text></g><g data-node="internal/symbols/shindex" data-anchor="internal/symbols/shindex"><rect x="512" y="192" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="512" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="620" y="220" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Shell indexer</text><text x="620" y="236" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">functions, sources</text></g><g data-node="libs/scipbuzz" data-anchor="libs/scipbuzz"><rect x="272" y="320" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="272" y="320" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="380" y="348" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">scipbuzz</text><text x="380" y="364" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Buzz to SCIP</text></g><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="512" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="512" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="620" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Host bindings</text><text x="620" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">calls an indexer</text></g><g data-node="internal/spell" data-anchor="internal/spell"><rect x="752" y="192" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="752" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="860" y="220" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Spell host</text><text x="860" y="236" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ops ask for symbols</text></g><g data-node="internal/graph/knowledge" data-anchor="internal/graph/knowledge"><rect x="512" y="576" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="512" y="576" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="620" y="604" fill="#2d3142" font-family="sans-serif" class="magus-fi