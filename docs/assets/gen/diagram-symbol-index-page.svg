ize="9" style="font-variant-ligatures:none" text-anchor="middle">Buzz to SCIP</text></g><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="32" y="216" width="216" height="72" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="216" width="216" height="72" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="252" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Host bindings</text><text x="140" y="268" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">calls an indexer</text></g><g data-node="internal/spell" data-anchor="internal/spell"><rect x="320" y="304" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="428" y="332" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Spell host</text><text x="428" y="348" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ops ask for symbols</text></g><g data-node="internal/graph/knowledge" data-anchor="internal/graph/knowledge"><rect x="1192" y="224" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1192" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1300" y="252" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Knowledge graph</text><text x="1300" y="268" fill="#5f6780" font-family="monospace" class="ma