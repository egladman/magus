aper"/><text x="520" y="79" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VARIABLES</text><rect x="516" y="150" width="24" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="528" y="159" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JOB</text><g data-node="internal/sandbox" data-anchor="internal/sandbox"><rect x="320" y="216" width="216" height="72" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="216" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="428" y="252" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Sandbox</text><text x="428" y="268" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one grant per run</text></g><g data-node="libs/safetyscissors/sandbox/filesystem" data-anchor="libs/safetyscissors/sandbox/filesystem"><rect x="616" y="224" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="616" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="724" y="252" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Filesystem grant</text><text x="724" y="268" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">landlock where the kernel has it</text></g><g data-node="internal/sandbox/env" data-anchor="internal/sandbox/env"><rect x="616" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="616" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="724" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Environment</text><text x="724" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">allowlist, no secrets</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="616" y="144" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="616" y="144" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="724" y="172" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="724" y="188" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write paths narrow the grant</text></g><g data-node="internal/journal" data-anchor="internal/journal"><rect x="616" y="304" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="616" y="304" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="724" y="332" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Journal</text><text x="724" y="348" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the denial kept</text></g><g data-node="internal/trail" data-anchor="internal/trail"><rect x="904" y="184" wi