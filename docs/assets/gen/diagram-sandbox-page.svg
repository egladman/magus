<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 664" width="1168" height="664" role="img" aria-labelledby="sandbox-title sandbox-desc" class="magus-diagram"><metadata>{"figure":"sandbox","stamp":"sha256:c5cc492dd46476dc3e50d9d03863bb69d46b749b83ad9a95b5dbd6be256e5b40"}</metadata><title id="sandbox-title">What a spell may touch while it runs</title><desc id="sandbox-desc">A spell reaches the sandbox from two sides: the interpreter runs its Buzz in process, and the spawner starts its tool. The sandbox builds one grant. The filesystem half names the readable and writable paths and applies them with landlock where the kernel has it. The environment half rebuilds the child's variables from an allowlist. A job's write paths narrow the writes, a refusal lands in the trail, and the journal keeps the denial.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="sandbox-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="sandbox-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="sandbox-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SANDBOX</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">What a spell may touch while it runs</text><g transform="translate(0,40)"><path data-edge="internal/sandbox->internal/sandbox/filesystem" id="sandbox-edge-internal_2fsandbox-internal_2fsandbox_2ffilesystem" d="M 536 332 L 632 332" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/sandbox/env" id="sandbox-edge-internal_2fsandbox-internal_2fsandbox_2fenv" d="M 428 296 L 428 100 Q 428 92 436 92 L 632 92" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/job" id="sandbox-edge-internal_2fsandbox-internal_2fjob" d="M 440 296 L 440 180 Q 440 172 448 172 L 632 172" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/journal" id="sandbox-edge-internal_2fsandbox-internal_2fjournal" d="M 452 296 L 452 260 Q 452 252 460 252 L 632 252" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/trail" id="sandbox-edge-internal_2fsandbox-internal_2ftrail" d="M 536 320 L 576 320 Q 584 320 584 312 L 584 300 Q 584 292 592 292 L 876 292 Q 884 292 884 284 L 884 192 Q 884 184 892 184 L 920 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/job->internal/trail" id="sandbox-edge-internal_2fjob-internal_2ftrail" d="M 848 172 L 920 172" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge