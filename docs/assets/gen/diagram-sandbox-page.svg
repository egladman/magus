ont-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">allowlist, no secrets</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="632" y="144" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="632" y="144" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="740" y="172" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="740" y="188" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write paths narrow the grant</text></g><g data-node="internal/recorder" data-anchor="internal/recorder"><rect x="920" y="184" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="920" y="184" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="1028" y="212" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Recorder</text><text x="1028" y="228" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the refusal and the denial kept</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="32" y="344" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="344" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="372" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Interpreter</text><text x="140" y="38