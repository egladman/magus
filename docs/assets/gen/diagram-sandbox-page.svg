<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 548" width="1168" height="548" role="img" aria-labelledby="sandbox-title sandbox-desc" class="magus-diagram"><metadata>{"diagram":"sandbox","stamp":"sha256:d2050f5ebfe03e111ef6bd5b0f61c798cbfaeba7514c13a7d1d3790044f177e9"}</metadata><title id="sandbox-title">Every spell run gets one grant, narrowed by its job's write paths</title><desc id="sandbox-desc">A spell reaches the sandbox from two sides: the interpreter runs its Buzz in process, and the spawner starts its tool. The sandbox builds one grant: the filesystem half applies the readable and writable paths with landlock where it can, and the environment half rebuilds the child's variables from an allowlist. A job's write paths narrow the writes.</desc><style>.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#f5f5f5);--magus-diagram-paint-fill:var(--magus-diagram-fill,#ffffff);--magus-diagram-paint-ink:var(--magus-diagram-ink,#2d3142);--magus-diagram-paint-muted:var(--magus-diagram-muted,#4f5d75);--magus-diagram-paint-soft:var(--magus-diagram-soft,#5f6780);--magus-diagram-paint-rule:var(--magus-diagram-rule,#e6e6e8);--magus-diagram-paint-accent:var(--magus-diagram-accent,#eb6c36);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-diagram-paint-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#2d3142);--magus-diagram-paint-fill:var(--magus-diagram-fill,#393e53);--magus-diagram-paint-ink:var(--magus-diagram-ink,#f5f5f5);--magus-diagram-paint-muted:var(--magus-diagram-muted,#bfc0c0);--magus-diagram-paint-soft:var(--magus-diagram-soft,#a9b1c2);--magus-diagram-paint-rule:var(--magus-diagram-rule,#505466);--magus-diagram-paint-accent:var(--magus-diagram-accent,#f08a59);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-diagram-paint-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-diagram-paint-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-diagram-paint-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-diagram-paint-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-diagram-paint-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-diagram-paint-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-diagram-paint-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-diagram-paint-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-diagram-paint-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-diagram-paint-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-diagram-paint-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-diagram-paint-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-diagram-paint-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-diagram-paint-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-diagram-paint-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-diagram-paint-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-diagram-paint-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="sandbox-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="sandbox-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="sandbox-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-li