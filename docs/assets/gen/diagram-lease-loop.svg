<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 912" width="852" height="912" role="img" aria-labelledby="lease-loop-title lease-loop-desc" class="magus-diagram"><metadata>{"figure":"lease-loop","stamp":"sha256:b706095a97120b733e434bfe14353ebff0a5dbb94c773894d3c172ebe1492f4d"}</metadata><title id="lease-loop-title">A declared plan, released early, verified by diff</title><desc id="lease-loop-desc">An orchestrator checkpoints the working state, partitions the work by write set using graph evidence, and forks one job per unit: goal, checkpoint, write paths. Holders release paths as soon as they are done with them, so the plan shrinks while it runs, and the Jobs view renders the rows, their overlaps and their staleness for whoever is watching. The orchestrator verifies each job by diffing since that job's checkpoint against what it claimed, then integrates and runs magus affected ci. magus records and answers; it enforces none of it.</desc><defs><marker id="lease-loop-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="lease-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="lease-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">LEASE</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A declared plan, released early, verified by diff</text><g transform="translate(0,40)"><rect x="32" y="32" width="276" height="744" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacit