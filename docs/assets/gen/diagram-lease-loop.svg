<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 656" width="1064" height="656" role="img" aria-labelledby="lease-loop-title lease-loop-desc" class="magus-diagram"><metadata>{"figure":"lease-loop","stamp":"sha256:63034533ec64bee9e3a6305d0142896c4044ea9b1e465ffc976f3bda449bcfed"}</metadata><title id="lease-loop-title">A declared plan, released early, verified by diff</title><desc id="lease-loop-desc">An orchestrator checkpoints the revision through vcs, partitions the work by write set and forks one job row per unit into the job store: goal, checkpoint, write paths. describe prints the row a worker reads. The guard reads the row on every call. Holders release paths as soon as they are done, so the plan shrinks while it runs, and the Jobs view renders the rows for whoever is watching. The change set verifies each job by diffing since that job's checkpoint against what it claimed. magus records and answers; it enforces none of it beyond the guard.</desc><defs><marker id="lease-loop-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="lease-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="lease-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">LEASE</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">A declared plan, released early, verified by diff</text><g transform="translate(0,40)"><rect x="32" y="32" width="728" height="488" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="300" y="36" width="192" height="12" rx="2" fill="#2d3142"/><text x="396" y="45" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE LOOP THE ORCHESTRATOR RUNS</text><rect x="784" y="32" width="248" height="232" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="840" y="36" width="136" height="12" rx="2" fill="#2d3142"/><text x="908" y="45" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT A PERSON WATCHES</text><path data-edge="external:Orchestrator->internal/job" id="lease-loop-edge-external_3aOrchestrator-internal_2fjob" d="M 156 120 L 156 268 Q 156 276 164 276 L 496 276 Q 504 276 504 284 L 504 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="internal/job->vcs" id="lease-loop-edge-internal_2fjob-vcs" d="M 408 348 L 284 348 Q 276 348 276 356 L 276 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="internal/job->internal/describe" id="lease-loop-edge-internal_2fjob-internal_2fdescribe" d="M 516 376 L 516 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="external:Workers->internal/job" id="lease-loop-edge-external_3aWorkers-internal_2fjob" d="M 504 92 L 508 92 Q 516 92 516 100 L 516 320" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#lease-loop-arrow-accent)"/><path data-edge="external:Workers->internal/changeset" id="lease-loop-edge-external_3aWorkers-internal_2fchangeset" d="M 396 120 L 396 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="internal/guard->internal/job" id="lease-loop-edge-internal_2fguard-internal_2fjob" d="M 636 120 L 636 268 Q 636 276 628 276 L 536 276 Q 528 276 528 284 L 528 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="internal/handler/job->internal/job" id="lease-loop-edge-internal_2fhandler_2fjob-internal_2fjob" d="M 908 248 L 908 284 Q 908 292 900 292 L 548 292 Q 540 292 540 300 L 540 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="external:The human->internal/handler/job" id="lease-loop-edge-external_3aThe_20human-internal_2fhandler_2fjob" d="M 908 120 L 908 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><rect x="312" y="254" width="32" height="12" rx="2" fill="#2d3142"/><text x="328" y="263" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FORK</text><rect x="310" y="326" width="60" height="12" rx="2" fill="#2d3142"/><text x="340" y="335" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">CHECKPOINT</text><rect x="526" y="404" width="32" height="12" rx="2" fill="#2d3142"/><text x="542" y="413" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SPEC</text><rect x="526" y="196" width="44" height="12" rx="2" fill="#2d3142"/><text x="548" y="205" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RELEASE</text><rect x="406" y="148" width="72" height="12" rx="2" fill="#2d3142"/><text x="442" y="157" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPORTS DONE</text><rect x="562" y="254" width="36" height="12" rx="2" fill="#2d3142"/><text x="580" y="263" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="698" y="270" width="52" height="12" rx="2" fill="#2d3142"/><text x="724" y="279" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JOB ROWS</text><rect x="918" y="148" width="44" height="12" rx="2" fill="#2d3142"/><text x="940" y="157" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WATCHES</text><g data-node="external:Orchestrator"><rect x="48" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="48" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="156" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Orchestrator</text><text x="156" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">partitions by write set</text></g><g data-node="vcs" data-anchor="vcs"><rect x="168" y="448" width="216" height="56" rx="6" fill="#2d3142"/><rect x="168" y="448" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="276" y="476" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Checkpoint</text><text x="276" y="492" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">revision + dirty digest</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="408" y="320" width="216" height="56" rx="6" fill="#2d3142"/><rect x="408" y="320" width="216" height="56" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="516" y="348" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="516" y="364" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">goal, checkpoint, paths</text></g><g data-node="internal/describe" data-anchor="internal/describe"><rect x="408" y="448" width="216" height="56" rx="6" fill="#2d3142"/><rect x="408" y="448" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="516" y="476" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">describe job</text><text x="516" y="492" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the spec a worker reads</text></g><g data-node="external:Workers"><rect x="288" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="288" y="64" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="396" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Workers</text><text x="396" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one write set each</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="528" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="528" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="636" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="636" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">reads the row per call</text></g><g data-node="internal/changeset" data-anchor="internal/changeset"><rect x="288" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="288" y="192" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="396" y="220" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-