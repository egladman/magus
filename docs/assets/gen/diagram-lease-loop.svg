76 348" fill="none" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lease-loop-arrow-accent)"/><path data-edge="external:Workers edit->internal/changeset" id="lease-loop-edge-external_3aWorkers_20edit-internal_2fchangeset" d="M 184 504 L 184 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="internal/changeset->external:Integrate" id="lease-loop-edge-internal_2fchangeset-external_3aIntegrate" d="M 184 632 L 184 704" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="external:Integrate->external:magus vcs checkpoint" id="lease-loop-edge-external_3aIntegrate-external_3amagus_20vcs_20checkpoint" d="M 76 732 L 56 732 Q 48 732 48 724 L 48 100 Q 48 92 56 92 L 76 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="external:The human->external:Plan app" id="lease-loop-edge-external_3aThe_20human-external_3aPlan_20app" d="M 456 120 L 456 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><rect x="294" y="390" width="52" height="12" rx="2" fill="#2d3142"/><text x="320" y="399" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JOB ROWS</text><rect x="70" y="404" width="44" height="12" rx="2" fill="#2d3142"/><text x="92" y="413" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RELEASE</text><rect x="194" y="532" width="72" height="12" rx="2" fill="#2d3142"/><text x="230" y="541" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPORTS DONE</text><r