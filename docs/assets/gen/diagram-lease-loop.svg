<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="lease-loop-title lease-loop-desc" class="magus-diagram"><title id="lease-loop-title">A declared plan, released early, verified by diff</title><desc id="lease-loop-desc">An orchestrator checkpoints the working state, partitions the work by write set using graph evidence, and declares one ledger row per lease: goal, checkpoint, owned paths. Workers release paths as soon as they are done with them, so the plan shrinks while it runs, and the Plan surface renders the rows, their overlaps and their staleness for whoever is watching. The orchestrator verifies each lease by diffing since that lease's checkpoint against what it claimed, then integrates and runs magus affected ci. magus records and answers; it enforces none of it.</desc><defs><marker id="lease-loop-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="lease-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="lease-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">LEASE</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A declared plan, released early, verified by diff</text><g transform="translate(0,40)"><path d="M 232 120 L 280 120" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#lease-loop-arrow-default)"/><path d="M 480 120 L 528 120" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#lease-loop-arrow-default)"/><path d="M 592 152 L 592 160 Q 592 168 600 168 L 836 168 Q 844 168 844 176 L 844 192" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#lease-loop-arrow-default)"/><path d="M 844 256 L 844 440" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#lease-loop-arrow-default)"/><path d="M 744 472 L 480 472" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#lease-loop-arrow-default)"/><path d="M 280 472 L 24 472 Q 16 472 16 464 L 16 128 Q 16 120 24 120 L 32 120" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#lease-loop-arrow-default)"/><path d="M 744 224 L 744 224 Q 740 224 740 220 L 740 124 Q 740 120 736 120 L 728 120" fill="none" stroke="#f08a59" stroke-width="1" marker-end="url(#lease-loop-arrow-accent)"/><path d="M 660 152 L 660 188 Q 660 196 652 196 L 152 196 Q 144 196 144 204 L 144 232" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#lease-loop-arrow-default)"/><path d="M 144 344 L 144 296" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#lease-loop-arrow-default)"/><rect x="856" y="340" width="72" height="12" rx="2" fill="#13171f"/><text x="892" y="349" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPORTS DONE</text><rect x="718" y="150" width="44" height="12" rx="2" fill="#13171f"/><text x="740" y="159" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RELEASE</text><rect x="368" y="174" width="64" height="12" rx="2" fill="#13171f"/><text x="400" y="183" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEDGER ROWS</text><rect x="156" y="312" width="44" height="12" rx="2" fill="#13171f"/><text x="178" y="321" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WATCHES</text><rect x="32" y="88" width="200" height="64" rx="6" fill="#13171f"/><rect x="32" y="88" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="132" y="120" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus vcs checkpoint</text><text x="132" y="136" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">revision + dirty digest</text><rect x="280" y="88" width="200" height="64" rx="6" fill="#13171f"/><rect x="280" y="88" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="380" y="120" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Partition by write set</text><text x="380" y="136" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">refs, explain, affected</text><rect x="528" y="88" width="200" height="64" rx="6" fill="#13171f"/><rect x="528" y="88" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="628" y="120" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Declare the plan</text><text x="628" y="136" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">goal, checkpoint, paths</text><rect x="744" y="192" width="200" height="64" rx="6" fill="#13171f"/><rect x="744" y="192" width="200" height="64" rx="6" fill="#13171f" stroke="#6b7383" stroke-width="1"/><text x="844" y="224" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workers edit</text><text x="844" y="240" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">one write set each</text><rect x="744" y="440" width="200" height="64" rx="6" fill="#13171f"/><rect x="744" y="440" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="844" y="472" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Verify each lease</text><text x="844" y="488" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">diff since its checkpoint</text><rect x="280" y="440" width="200" height="64" rx="6" fill="#13171f"/><rect x="280" y="440" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="380" y="472" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Integrate</text><text x="380" y="488" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus affected ci</text><rect x="32" y="232" width="224" height="64" rx="6" fill="#13171f"/><rect x="32" y="232" width="224" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="144" y="264" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Plan surface</text><text x="144" y="280" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">/console/plan/, overlaps, stale</text><rect x="32" y="344" width="224" height="64" rx="6" fill="#13171f"/><rect x="32" y="344" width="224" height="64" rx="6" fill="#13171f" stroke="#6b7383" stroke-width="1"/><text x="144" y="376" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">The human</text><text x="144" y="392" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">watches and decides</text><rect x="376" y="272" width="280" height="72" rx="6" fill="#13171f"/><rect x="376" y="272" width="280" height="72" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><text x="516" y="308" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus records and answers</text><text x="516" y="324" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">it enforces none of it</text><line x1="32" y1="552" x2="928" y2="552" stroke="#202632" stroke-width="0.8"/><rect x="32" y="560" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="569" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE WHOLE GUARANTEE</text><rect x="192" y="560" width="10" height="10" rx="2" fill="#13171f" stroke="#6b7383" stroke-width="0.8"/><text x="210" y="569" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">AGENTS AND PEOPLE</text></g></svg>