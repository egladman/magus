<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1064 912" width="1064" height="912" role="img" aria-labelledby="lease-loop-title lease-loop-desc" class="magus-diagram"><title id="lease-loop-title">A declared plan, released early, verified by diff</title><desc id="lease-loop-desc">An orchestrator checkpoints the working state, partitions the work by write set using graph evidence, and forks one job per unit: goal, checkpoint, write paths. Holders release paths as soon as they are done with them, so the plan shrinks while it runs, and the Jobs view renders the rows, their overlaps and their staleness for whoever is watching. The orchestrator verifies each job by diffing since that job's checkpoint against what it claimed, then integrates and runs magus affected ci. magus records and answers; it enforces none of it.</desc><defs><marker id="lease-loop-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="lease-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="lease-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">LEASE</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A declared plan, released early, verified by diff</text><g transform="translate(0,40)"><rect x="32" y="32" width="488" height="744" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="180" y="36" width="192" height="12" rx="2" fill="#2d3142"/><text x="276" y="45" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE LOOP THE ORCHESTRATOR RUNS</text><rect x="544" y="32" width="248" height="488" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="600" y="36" width="136" height="12" rx="2" fill="#2d3142"/><text x="668" y="45" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT A PERSON WATCHES</text><path data-edge="cp->part" d="M 240 120 L 240 136 Q 240 144 232 144 L 164 144 Q 156 144 156 152 L 156 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="part->decl" d="M 156 248 L 156 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="decl->work" d="M 100 376 L 100 424 Q 100 432 108 432 L 112 432 Q 120 432 120 440 L 120 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="work->verify" d="M 156 504 L 156 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="verify->integrate" d="M 156 632 L 156 672 Q 156 680 164 680 L 232 680 Q 240 680 240 688 L 240 704" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="integrate->cp" d="M 312 704 L 312 664 Q 312 656 320 656 L 388 656 Q 396 656 396 648 L 396 176 Q 396 168 388 168 L 320 168 Q 312 168 312 160 L 312 120" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="work->decl" d="M 192 448 L 192 424 Q 192 416 184 416 L 164 416 Q 156 416 156 408 L 156 376" fill="none" stroke="#f08a59" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lease-loop-arrow-accent)"/><path data-edge="decl->plan" d="M 208 376 L 208 396 Q 208 404 216 404 L 624 404 Q 632 404 632 412 L 632 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="human->plan" d="M 668 120 L 668 380 Q 668 388 676 388 L 696 388 Q 704 388 704 396 L 704 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><rect x="166" y="532" width="72" height="12" rx="2" fill="#2d3142"/><text x="202" y="541" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPORTS DONE</text><rect x="150" y="394" width="44" height="12" rx="2" fill="#2d3142"/><text x="172" y="403" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RELEASE</text><rect x="394" y="382" width="52" height="12" rx="2" fill="#2d3142"/><text x="420" y="391" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JOB ROWS</text><rect x="662" y="366" width="44" height="12" rx="2" fill="#2d3142"/><text x="684" y="375" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WATCHES</text><g data-node="cp" data-anchor="cmd/magus"><rect x="168" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="168" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="276" y="92" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus vcs checkpoint</text><text x="276" y="108" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">revision + dirty digest</text></g><g data-node="part" data-anchor="internal/graph"><rect x="48" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="48" y="192" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="156" y="220" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Partition by write set</text><text x="156" y="236" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">refs, explain, affected</text></g><g data-node="decl" data-anchor="internal/job"><rect x="48" y="320" width="216" height="56" rx="6" fill="#2d3142"/><rect x="48" y="320" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="156" y="348" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Declare the plan</text><text x="156" y="364" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">goal, checkpoint, paths</text></g><g data-node="work"><rect x="48" y="448" width="216" height="56" rx="6" fill="#2d3142"/><rect x="48" y="448" width="216" height="56" rx="6" fill="#2d3142" stroke="#8e98ac" stroke-width="1.2"/><text x="156" y="476" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workers edit</text><text x="156" y="492" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">one write set each</text></g><g data-node="verify" data-anchor="internal/changeset"><rect x="48" y="576" width="216" height="56" rx="6" fill="#2d3142"/><rect x="48" y="576" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="156" y="604" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Verify each lease</text><text x="156" y="620" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">diff since its checkpoint</text></g><g data-node="integrate" data-anchor="cmd/magus"><rect x="168" y="704" width="216" height="56" rx="6" fill="#2d3142"/><rect x="168" y="704" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="276" y="732" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Integrate</text><text x="276" y="748" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus affected ci</text></g><g data-node="plan" data-anchor="internal/handler/status"><rect x="560" y="448" width="216" height="56" rx="6" fill="#2d3142"/><rect x="560" y="448" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="668" y="476" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Plan surface</text><text x="668" y="492" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">/console/plan/, overlaps, stale</text></g><g data-node="human"><rect x="560" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="560" y="64" width="216" height="56" rx="6" fill="#2d3142" stroke="#8e98ac" stroke-width="1.2"/><text x="668" y="92" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">The human</text><text x="668" y="108" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">watches and decides</text></g><g data-node="doctrine" data-anchor="internal/job"><rect x="816" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="816" y="64" width="216" height="56" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="924" y="92" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus records and answers</text><text x="924" y="108" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">it enforces none of it</text></g><line x1="32" y1="812" x2="1032" y2="812" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="826" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="832" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="841" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE WHOLE GUARANTEE</text><rect x="192" y="832" width="10" height="10" rx="2" fill="#2d3142" stroke="#8e98ac" stroke-width="0.8"/><text x="210" y="841" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">AGENTS AND PEOPLE</text></g></svg>