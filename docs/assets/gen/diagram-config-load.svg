<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 576" width="856" height="576" role="img" aria-labelledby="config-load-title config-load-desc" class="magus-diagram"><metadata>{"figure":"config-load","stamp":"sha256:dbe4bb02e1825e9685501ac4a72c34268b8db7a7c68f65e00c584f39e8f60656"}</metadata><title id="config-load-title">Every key has one declaration, and every source feeds the same load</title><desc id="config-load-desc">The load reads magus.yaml, the environment and the flags into one set of keys, resolving user and state paths through the xdg directories. A remote source goes through the HTTP client, a daemon address through the endpoint package, and a key that names a ward or a stamp is checked against it. The keys come from one declaration. The generator writes the typed accessors in gen from it, so a flag, a config key and the help text cannot disagree.</desc><defs><marker id="config-load-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="config-load-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="config-load-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">CONFIG</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">Every key has one declaration, and every source feeds the same load</text><g transform="translate(0,40)"><path data-edge="external:Config sources->internal/config" id="config-load-edge-external_3aConfig_20sources-internal_2fconfig" d="M 248 172 L 276 172 Q 284 172 284 180 L 284 232 Q 284 240 292 240 L 320 240" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->internal/httpx" id="config-load-edge-internal_2fconfig-internal_2fhttpx" d="M 428 216 L 428 100 Q 428 92 436 92 L 608 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->internal/proc/endpoint" id="config-load-edge-internal_2fconfig-internal_2fproc_2fendpoint" d="M 440 216 L 440 180 Q 440 172 448 172 L 608 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->internal/ward" id="config-load-edge-internal_2fconfig-internal_2fward" d="M 536 252 L 608 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->internal/stamp" id="config-load-edge-internal_2fconfig-internal_2fstamp" d="M 440 288 L 440 324 Q 440 332 448 332 L 608 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config->libs/xdg" id="config-load-edge-internal_2fconfig-libs_2fxdg" d="M 428 288 L 428 404 Q 428 412 436 412 L 608 412" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><path data-edge="internal/config/gen->internal/config" id="config-load-edge-internal_2fconfig_2fgen-internal_2fconfig" d="M 248 252 L 320 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#config-load-arrow-default)"/><g data-node="external:Config sources"><rect x="32" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Config sources</text><text x="140" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus.yaml, env, flags</text></g><g data-node="internal/config" data-anchor="internal/config"><rect x="320" y="216" width="216" height="72" rx="6" fill="#2d3142"/><rect x="320" y="216" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="428" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Config load</text><text x="428" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one set of keys</text></g><g data-node="internal/config/gen" data-anchor="internal/config/gen"><rect x="32" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="140" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Typed keys</text><text x="140" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">generated accessors</text></g><g data-node="libs/clikit/generate" data-anchor="libs/clikit/generate"><rect x="32" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Key generator</text><text x="140" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">from the declaration</text></g><g data-node="internal/httpx" data-anchor="internal/httpx"><rect x="608" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">HTTP client</text><text x="716" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">remote sources</text></g><g data-node="internal/proc/endpoint" data-anchor="internal/proc/endpoint"><rect x="608" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Endpoints</text><text x="716" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">daemon addresses</text></g><g data-node="internal/ward" data-anchor="internal/ward"><rect x="608" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ward</text><text x="716" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">kind checks</text></g><g data-node="internal/stamp" data-anchor="internal/stamp"><rect x="608" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Stamp</text><text x="716" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">build identity</text></g><g data-node="libs/xdg" data-anchor="libs/xdg"><rect x="608" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="384" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">XDG paths</text><text x="716" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">config, state, cache</text></g><line x1="32" y1="476" x2="824" y2="476" stroke="#505466" stroke-width="0.8"/><text x="32" y="490" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="496" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE LOAD</text><rect x="192" y="496" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">GENERATED OUTPUT</text><rect x="352" y="496" width="10" height="10" rx="2" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="0.8"/><text x="370" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHERE KEYS COME FROM</text></g></svg>