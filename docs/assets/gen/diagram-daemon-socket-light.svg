<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="daemon-socket-title daemon-socket-desc" class="magus-diagram"><title id="daemon-socket-title">How a local command reaches the daemon</title><desc id="daemon-socket-desc">The magus CLI dispatches over a private unix domain socket into the concurrency pool, the workspace registry, the run registry and the service registry. Sharing a graph spawns a separate short-lived loopback server.</desc><defs><marker id="daemon-socket-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="daemon-socket-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="daemon-socket-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS DAEMON</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">How a local command reaches the daemon</text><g transform="translate(0,40)"><path d="M 192 208 L 320 208" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#daemon-socket-arrow-default)"/><path d="M 520 188 L 552 188 Q 560 188 560 180 L 560 128 Q 560 120 568 120 L 640 120" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#daemon-socket-arrow-default)"/><path d="M 520 200 L 588 200 Q 592 200 592 204 L 592 204 Q 592 208 596 208 L 640 208" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#daemon-socket-arrow-default)"/><path d="M 520 212 L 568 212 Q 576 212 576 220 L 576 288 Q 576 296 584 296 L 640 