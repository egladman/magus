<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="project-reference-title project-reference-desc" class="magus-diagram"><title id="project-reference-title">Four spellings in, one reference out</title><desc id="project-reference-desc">magus accepts a workspace URL, a workspace-relative path, a dot-relative path or the bare root alias, and parses them all to one project reference. Human output prints the short path; machine output prints the workspace URL.</desc><defs><marker id="project-reference-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="project-reference-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="project-reference-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Four spellings in, one reference out</text><g transform="translate(0,40)"><rect x="32" y="88" width="280" height="344" rx="8" fill="none" stroke="#202632" stroke-width="1" stroke-dasharray="4,4"/><text x="44" y="108" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.14em">ACCEPTED AS INPUT, INTERCHANGEABLE</text><path d="M 288 224 L 336 224 Q 344 224 344 232 L 344 248 Q 344 256 352 256 L 400 256" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#project-reference-arrow-default)"/><path d="M 288 304 L 348 304 Q 356 304 356 296 L 356 276 Q 356 268 364 268 L 400 268" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#project-reference-arrow-default)"/><path d="M 288 144 L 360 144 Q 368 144 368 152 L 368 236 Q 368 244 376 244 L 400 244" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#project-reference-arrow-default)"/><path d="M 288 384 L 372 384 Q 380 384 380 376 L 380 288 Q 380 280 388 280 L 400 280" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#project-reference-arrow-default)"/><path d="M 544 264 L 624 264" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#project-reference-arrow-default)"/><path d="M 740 232 L 740 152" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#project-reference-arrow-default)"/><path d="M 740 296 L 740 376" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#project-reference-arrow-default)"/><rect x="752" y="184" width="44" height="12" rx="2" fill="#13171f"/><text x="774" y="193" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PRINTED</text><rect x="752" y="328" width="44" height="12" rx="2" fill="#13171f"/><text x="774" y="337" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">-O JSON</text><rect x="56" y="112" width="232" height="64" rx="6" fill="#13171f"/><rect x="56" y="112" width="232" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="172" y="148" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">workspace://pkg/api</text><rect x="56" y="192" width="232" height="64" rx="6" fill="#13171f"/><rect x="56" y="192" width="232" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="172" y="228" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">pkg/api</text><rect x="56" y="272" width="232" height="64" rx="6" fill="#13171f"/><rect x="56" y="272" width="232" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="172" y="308" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">./pkg/api</text><rect x="56" y="352" width="232" height="64" rx="6" fill="#13171f"/><rect x="56" y="352" width="232" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="172" y="384" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">workspace://</text><text x="172" y="400" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the root alias</text><rect x="400" y="232" width="144" height="64" rx="6" fill="#13171f"/><rect x="400" y="232" width="144" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="408" y="240" width="36" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="426" y="249" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">STEP</text><text x="472" y="272" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">parse</text><rect x="624" y="232" width="232" height="64" rx="6" fill="#13171f"/><rect x="624" y="232" width="232" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><text x="740" y="264" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">One reference</text><text x="740" y="280" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">path: pkg/api</text><rect x="624" y="88" width="232" height="64" rx="6" fill="#13171f"/><rect x="624" y="88" width="232" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="740" y="120" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Human output</text><text x="740" y="136" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">pkg/api</text><rect x="624" y="376" width="232" height="64" rx="6" fill="#13171f"/><rect x="624" y="376" width="232" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="740" y="408" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Machine output</text><text x="740" y="424" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">workspace://pkg/api</text><line x1="32" y1="472" x2="928" y2="472" stroke="#202632" stroke-width="0.8"/><rect x="32" y="480" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="489" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">ONE CANONICAL FORM</text></g></svg>