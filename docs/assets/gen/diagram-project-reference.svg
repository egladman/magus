<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 576" width="1160" height="576" role="img" aria-labelledby="project-reference-title project-reference-desc" class="magus-diagram"><title id="project-reference-title">Four spellings in, one reference out</title><desc id="project-reference-desc">magus accepts a workspace URL, a workspace-relative path, a dot-relative path or the bare root alias, and parses them all to one project reference. Human output prints the short path; machine output prints the workspace URL.</desc><defs><marker id="project-reference-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="project-reference-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="project-reference-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Four spellings in, one reference out</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="376" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="32" y="68" width="216" height="12" rx="2" fill="#2d3142"/><text x="140" y="77" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ACCEPTED AS INPUT, INTERCHANGEABLE</text><path data-edge="rel->parse" d="M 248 216 L 280 216 Q 288 216 288 224 L 288 236 Q 288 244 296 244 L 320 244" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="dot->parse" d="M 248 304 L 252 304 Q 260 304 260 296 L 260 264 Q 260 256 268 256 L 320 256" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="url->parse" d="M 248 128 L 296 128 Q 304 128 304 136 L 304 224 Q 304 232 312 232 L 320 232" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="root->parse" d="M 248 392 L 268 392 Q 276 392 276 384 L 276 276 Q 276 268 284 268 L 320 268" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="parse->ref" d="M 536 252 L 608 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="ref->human" d="M 824 240 L 840 240 Q 848 240 848 232 L 848 216 Q 848 208 856 208 L 896 208" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="ref->machine" d="M 824 260 L 864 260 Q 872 260 872 268 L 872 288 Q 872 296 880 296 L 896 296" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><rect x="850" y="186" width="44" height="12" rx="2" fill="#2d3142"/><text x="872" y="195" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PRINTED</text><rect x="826" y="238" width="44" height="12" rx="2" fill="#2d3142"/><text x="848" y="247" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">-O JSON</text><g data-node="url"><rect x="32" y="96" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="96" width="216" 