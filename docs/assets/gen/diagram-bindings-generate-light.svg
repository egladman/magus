<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 576" width="856" height="576" role="img" aria-labelledby="bindings-generate-title bindings-generate-desc" class="magus-diagram"><metadata>{"figure":"bindings-generate","stamp":"sha256:f5e068cc2613d1626b8204cc9f474b34222c47da8c4ade113d5c1efa30d6f24b"}</metadata><title id="bindings-generate-title">Go types become Buzz mirrors at build time, never at run time</title><desc id="bindings-generate-desc">magus-utils reads Go declarations with godecl and the config keys with the config generator. Both hand the emitter a description, and the emitter writes Buzz declarations through buzzgen. The bindings package imports the generated mirrors from its gen directory, so a host module and a Buzz script see the same type. A mirror is generated and committed, never reflected at run time.</desc><defs><marker id="bindings-generate-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="bindings-generate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="bindings-generate-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">GENERATE</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">Go types become Buzz mirrors at build time, never at run time</text><g transform="translate(0,40)"><path data-edge="cmd/magus-utils->internal/generate/godecl" id="bindings-generate-edge-cmd_2fmagus-utils-internal_2fgenerate_2fgodecl" d="M 140 144 L 140 100 Q 140 92 148 92 L 320 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="cmd/magus-utils->libs/clikit/generate" id="bindings-generate-edge-cmd_2fmagus-utils-libs_2fclikit_2fgenerate" d="M 248 172 L 320 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="cmd/magus-utils->internal/generate/emit" id="bindings-generate-edge-cmd_2fmagus-utils-internal_2fgenerate_2femit" d="M 140 200 L 140 244 Q 140 252 148 252 L 320 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="internal/generate/emit->libs/gopherbuzz/buzzgen" id="bindings-generate-edge-internal_2fgenerate_2femit-libs_2fgopherbuzz_2fbuzzgen" d="M 536 252 L 608 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="internal/interp/bindings->internal/config" id="bindings-generate-edge-internal_2finterp_2fbindings-internal_2fconfig" d="M 248 332 L 320 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="internal/interp/bindings->internal/interp/bindings/gen" id="bindings-generate-edge-internal_2finterp_2fbindings-internal_2finterp_2fbindings_2fgen" d="M 140 360 L 140 404 Q 140 412 148 412 L 320 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><g data-node="cmd/magus-utils" data-anchor="cmd/magus-utils"><rect x="32" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus-utils</text><text x="140" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the generate targets</text></g><g data-node="internal/generate/godecl" data-anchor="internal/generate/godecl"><rect x="320" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Go declarations</text><text x="428" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">types, enums, callbacks</text></g><g data-node="internal/config" data-anchor="internal/config"><rect x="320" y="304" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="332" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Config</text><text x="428" y="348" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">keys, defaults</text></g><g data-node="libs/clikit/generate" data-anchor="libs/clikit/generate"><rect x="320" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Config generator</text><text x="428" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">keys to Buzz</text></g><g data-node="internal/generate/emit" data-anchor="internal/generate/emit"><rect x="320" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="428" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Emitter</text><text x="428" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">description to Buzz</text></g><g data-node="libs/gopherbuzz/buzzgen" data-anchor="libs/gopherbuzz/buzzgen"><rect x="608" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">buzzgen</text><text x="716" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">writes the declarations</text></g><g data-node="internal/interp/bindings/gen" data-anchor="internal/interp/bindings/gen"><rect x="320" y="384" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="384" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="412" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Generated mirrors</text><text x="428" y="428" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">committed, never edited</text></g><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="32" y="304" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="332" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host bindings</text><text x="140" y="348" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">import the mirrors</text></g><line x1="32" y1="476" x2="824" y2="476" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="490" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="496" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="505" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE EMITTER</text><rect x="192" y="496" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="505" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">GENERATED OUTPUT</text></g></svg>