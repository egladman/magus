<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 428" width="1144" height="428" role="img" aria-labelledby="bindings-generate-title bindings-generate-desc" class="magus-diagram"><metadata>{"figure":"bindings-generate","stamp":"sha256:ca35187ef1224406aa0ae1f0536e2fa56d9fc9e0f297b4bf45129e74d8d1a052"}</metadata><title id="bindings-generate-title">Go types become Buzz mirrors at build time, never at run time</title><desc id="bindings-generate-desc">magus-utils reads Go declarations with godecl and the config keys with the config generator. Both hand the emitter a description, and the emitter writes Buzz declarations through buzzgen. The bindings package imports the generated mirrors from its gen directory, so a host module and a Buzz script see the same type. A mirror is generated and committed, never reflected at run time.</desc><defs><marker id="bindings-generate-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="bindings-generate-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="bindings-generate-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">GENERATE</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">Go types become Buzz mirrors at build time, never at run time</text><g transform="translate(0,40)"><path data-edge="cmd/magus-utils->internal/generate/godecl" id="bindings-generate-edge-cmd_2fmagus-utils-internal_2fgenerate_2fgodecl" d="M 140 144 L 140 100 Q 140 92 148 92 L 320 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="cmd/magus-utils->internal/config/generate" id="bindings-generate-edge-cmd_2fmagus-utils-internal_2fconfig_2fgenerate" d="M 248 172 L 320 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="cmd/magus-utils->internal/generate/emit" id="bindings-generate-edge-cmd_2fmagus-utils-internal_2fgenerate_2femit" d="M 140 200 L 140 204 Q 140 212 148 212 L 572 212 Q 580 212 580 204 L 580 192 Q 580 184 588 184 L 608 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="internal/config/generate->internal/config" id="bindings-generate-edge-internal_2fconfig_2fgenerate-internal_2fconfig" d="M 536 184 L 556 184 Q 564 184 564 192 L 564 204 A 8 8 0 0 0 564 220 L 564 236 Q 564 244 572 244 L 608 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="internal/config/generate->internal/generate/emit" id="bindings-generate-edge-internal_2fconfig_2fgenerate-internal_2fgenerate_2femit" d="M 536 172 L 608 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="internal/generate/emit->libs/gopherbuzz/buzzgen" id="bindings-generate-edge-internal_2fgenerate_2femit-libs_2fgopherbuzz_2fbuzzgen" d="M 824 172 L 896 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="internal/interp/bindings->internal/config" id="bindings-generate-edge-internal_2finterp_2fbindings-internal_2fconfig" d="M 140 280 L 140 284 Q 140 292 148 292 L 556 292 Q 564 292 564 284 L 564 268 Q 564 260 572 260 L 608 260" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><path data-edge="internal/interp/bindings->internal/interp/bindings/gen" id="bindings-generate-edge-internal_2finterp_2fbindings-internal_2finterp_2fbindings_2fgen" d="M 248 252 L 320 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bindings-generate-arrow-default)"/><g data-node="cmd/magus-utils" data-anchor="cmd/magus-utils"><rect x="32" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus-utils</text><text x="140" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the generate targets</text></g><g data-node="internal/generate/godecl" data-anchor="internal/generate/godecl"><rect x="320" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Go declarations</text><text x="428" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">types, enums, callbacks</text></g><g data-node="internal/config" data-anchor="internal/config"><rect x="608" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Config</text><text x="716" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">keys, defaults</text></g><g data-node="internal/config/generate" data-anchor="internal/config/generate"><rect x="320" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Config generator</text><text x="428" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">keys to Buzz</text></g><g data-node="internal/generate/emit" data-anchor="internal/generate/emit"><rect x="608" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="144" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="716" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Emitter</text><text x="716" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">description to Buzz</text></g><g data-node="libs/gopherbuzz/buzzgen" data-anchor="libs/gopherbuzz/buzzgen"><rect x="896" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="1004" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">buzzgen</text><text x="1004" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">writes the declarations</text></g><g data-node="internal/interp/bindings/gen" data-anchor="internal/interp/bindings/gen"><rect x="320" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Generated mirrors</text><text x="428" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">committed, never edited</text></g><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="32" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host bindings</text><text x="140" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">import the mirrors</text></g><line x1="32" y1="328" x2="1112" y2="328" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="342" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="348" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="357" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE EMITTER</text><rect x="192" y="348" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="357" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">GENERATED OUTPUT</text></g></svg>