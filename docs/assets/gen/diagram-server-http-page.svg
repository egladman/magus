style="font-variant-ligatures:none" text-anchor="middle">scripts, probes</text></g><g data-node="internal/httpx" data-anchor="internal/httpx"><rect x="896" y="180" width="216" height="72" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="896" y="180" width="216" height="72" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><rect x="904" y="188" width="36" height="12" rx="2" fill="none" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="0.8"/><text x="922" y="197" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">GATE</text><text x="1004" y="220" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Guard</text><text x="1004" y="236" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">rebind + token + CORS</text></g><g data-node="internal/handler/mcp" data-anchor="internal/handler/mcp"><rect x="608" y="228" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="228" width="216" height="64" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="716" y="260" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/mcp</text><text x="716" y="276" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">agent tools, SSE</text></g><g data-node="group:Console routes"><rect x="608" y="316" width="216" height="64" rx="6" fill="var(--