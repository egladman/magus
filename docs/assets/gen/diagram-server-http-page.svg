<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 620" width="1160" height="620" role="img" aria-labelledby="server-http-title server-http-desc" class="magus-diagram"><metadata>{"figure":"server-http","stamp":"sha256:7ef9b43201a927b3d3e1af3aaa1aeb745b07ac2af8db6f81a4087444e85ecf06"}</metadata><title id="server-http-title">The HTTP routes, and the one route without a guard</title><desc id="server-http-desc">Agents and the console reach /mcp, the /api/v1 read views, the review and plan routes and the typed Connect services through the DNS-rebind, bearer-token and CORS guard. POST /api/v1/diff/session carries the human half of a paired review and POST /api/v1/share opens the LAN listener; both are loopback only. The health endpoints answer probes directly, with no authentication.</desc><defs><marker id="server-http-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="server-http-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="server-http-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The HTTP routes, and the one route without a guard</text><g transform="translate(0,40)"><rect x="16" y="64" width="1112" height="332" rx="8" fill="var(--magus-diagram-ink, #2d3142)" fill-