nal/handler/mcp" id="server-http-edge-internal_2fserver-internal_2fhandler_2fmcp" d="M 536 440 L 552 440 Q 560 440 560 432 L 560 268 Q 560 260 568 260 L 608 260" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-http-arrow-default)"/><path data-edge="internal/server->group:Console routes" id="server-http-edge-internal_2fserver-group_3aConsole_20routes" d="M 536 452 L 564 452 Q 572 452 572 444 L 572 356 Q 572 348 580 348 L 608 348" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-http-arrow-default)"/><rect x="256" y="430" width="56" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="284" y="439" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">UNGUARDED</text><g data-node="external:AI agents"><rect x="32" y="96" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="96" width="216" height="64" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><rect x="40" y="104" width="48" height="12" rx="2" fill="none" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="64" y="113" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="136" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">AI agents</text><text x="140" y="152" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, IDE</text></g><g data-node="ex