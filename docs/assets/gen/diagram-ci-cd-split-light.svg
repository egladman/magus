<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 960" width="1080" height="960" role="img" aria-labelledby="ci-cd-split-title ci-cd-split-desc" class="magus-diagram"><metadata>{"figure":"ci-cd-split","stamp":"sha256:f57936c05fd2154637edf1fd8110af5162b5764639ca236eb18a525e2efd5e0a"}</metadata><title id="ci-cd-split-title">CI validates a change; CD ships what a merge produces</title><desc id="ci-cd-split-desc">ci.yaml runs on a pull request: the gate sizer in internal/ci picks the shards from the forecast and the volatility score, runs them, and annotates the result. It restores the signed remote cache and writes only a tier scoped to the pull request. cd.yaml runs after a merge to main, renders the site from the profiles CI uploaded and builds the image, and it alone holds the key that writes the shared tier. release.yaml cuts binaries on a tag. Nothing that runs pull-request code holds a secret or a write token.</desc><defs><marker id="ci-cd-split-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="ci-cd-split-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="ci-cd-split-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">CI</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">CI validates a change; CD ships what a merge produces</text><g transform="translate(0,40)"><rect x="48" y="32" width="488" height="792" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="226" y="36" width="132" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="45" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">VALIDATES, NO SECRET</text><rect x="560" y="440" width="488" height="248" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="738" y="444" width="132" height="12" rx="2" fill="#f5f5f5"/><text x="804" y="453" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">SHIPS, HOLDS THE KEY</text><path data-edge="external:A pull request->internal/ci" id="ci-cd-split-edge-external_3aA_20pull_20request-internal_2fci" d="M 172 128 L 172 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-cd-split-arrow-default)"/><path data-edge="external:ci.yaml->external:cd.yaml" id="ci-cd-split-edge-external_3aci_2eyaml-external_3acd_2eyaml" d="M 172 400 L 172 428 Q 172 436 180 436 L 676 436 Q 684 436 684 444 L 684 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-cd-split-arrow-default)"/><path data-edge="external:cd.yaml->external:release.yaml" id="ci-cd-split-edge-external_3acd_2eyaml-external_3arelease_2eyaml" d="M 684 536 L 684 608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-cd-split-arrow-default)"/><path data-edge="external:cd.yaml->internal/cache" id="ci-cd-split-edge-external_3acd_2eyaml-internal_2fcache" d="M 792 504 L 924 504 Q 932 504 932 512 L 932 608" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#ci-cd-split-arrow-accent)"/><path data-edge="internal/ci->external:ci.yaml" id="ci-cd-split-edge-internal_2fci-external_3aci_2eyaml" d="M 172 264 L 172 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-cd-split-arrow-default)"/><path data-edge="internal/ci->group:Forecast" id="ci-cd-split-edge-internal_2fci-group_3aForecast" d="M 280 232 L 404 232 Q 412 232 412 240 L 412 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-cd-split-arrow-default)"/><path data-edge="internal/cache->external:ci.yaml" id="ci-cd-split-edge-internal_2fcache-external_3aci_2eyaml" d="M 916 608 L 916 580 Q 916 572 908 572 L 692 572 A 8 8 0 0 0 676 572 L 40 572 Q 32 572 32 564 L 32 376 Q 32 368 40 368 L 64 368" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ci-cd-split-arrow-default)"/><path data-edge="internal/cache->internal/ci/annotate" id="ci-cd-split-edge-internal_2fcache-internal_2fci_2fannotate" d="M 924 672 L 924 700 Q 924 708 916 708 L 180 708 Q 172 708 172 716 L 172 744" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-cd-split-arrow-default)"/><rect x="182" y="156" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="218" y="165" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PULL_REQUEST</text><rect x="402" y="414" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="428" y="423" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PROFILES</text><rect x="694" y="588" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="714" y="597" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">V* TAG</text><rect x="830" y="482" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="860" y="491" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SIGN + PUT</text><rect x="182" y="292" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="202" y="301" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SHARDS</text><rect x="318" y="210" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="344" y="219" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SIZES BY</text><rect x="444" y="550" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="472" y="559" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ ONLY</text><g data-node="external:A pull request"><rect x="64" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="64" y="64" width="216" height="64" rx="6" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="1.2"/><text x="172" y="96" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">A pull request</text><text x="172" y="112" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">untrusted code</text></g><g data-node="external:ci.yaml"><rect x="64" y="336" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="64" y="336" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="72" y="344" width="60" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="102" y="353" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">WORKFLOW</text><text x="172" y="376" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">ci.yaml</text><text x="172" y="392" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">validates, ships nothing</text></g><g data-node="external:cd.yaml"><rect x="576" y="472" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="576" y="472" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><rect x="584" y="480" width="60" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/><text x="614" y="489" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">WORKFLOW</text><text x="684" y="512" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">cd.yaml</text><text x="684" y="528" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">site and image of main</text></g><g data-node="external:release.yaml"><rect x="576" y="608" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="576" y="608" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="584" y="616" width="60" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="614" y="625" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">WORKFLOW</text><text x="684" y="648" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">release.yaml</text><text x="684" y="664" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">binaries on a v* tag</text></g><g data-node="internal/ci" data-anchor="internal/ci"><rect x="64" y="200" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="64" y="200" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="172" y="232" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Gate sizing</text><text x="172" y="248" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">which shards run</text></g><g data-node="internal/ci/annotate" data-anchor="internal/ci/annotate"><rect x="64" y="744" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="64" y="744" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="172" y="776" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Annotations</text><text x="172" y="792" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the result on the PR</text></g><g data-node="group:Forecast"><rect x="304" y="336" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="304" y="336" width="216" height="64" rx="6" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="1.2"/><text x="412" y="368" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Forecast</text><text x="412" y="384" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">cost and volatility</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="816" y="608" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="816" y="608" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="924" y="640" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Remote cache</text><text x="924" y="656" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">signed by main only</text></g><line x1="32" y1="860" x2="1048" y2="860" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="874" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="880" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="889" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE THAT SHIPS</text><rect x="192" y="880" width="10" height="10" rx="2" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="889" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">READS HISTORY</text><rect x="352" y="880" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="370" y="889" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE SHARED STORE</text></g></svg>