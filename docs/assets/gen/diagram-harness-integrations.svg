<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1760 472" width="1760" height="472" role="img" aria-labelledby="harness-integrations-title harness-integrations-desc" class="magus-diagram"><metadata>{"figure":"harness-integrations","stamp":"sha256:de73bbede234de34fe92c4778fcfc9e63201aaac47e553885b1ac7e208e2bdd9"}</metadata><title id="harness-integrations-title">One spell per host writes the hook that reaches the guard</title><desc id="harness-integrations-desc">Each supported host has a harness spell under spells/harness: Claude Code, Codex, Cursor and OpenCode, plus the Claude Code mod. A spell knows where its host keeps hook entries and prints the entry a person merges. magus agent install writes the shared half, the embedded skills and the read-only scout agent, through internal/agent. The hook each spell prints runs the guard before every call. The driver in internal/agent/harness runs a host's loop in tests, so a spell's output is proven against a real hook payload.</desc><defs><marker id="harness-integrations-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="harness-integrations-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="harness-integrations-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">One spell per host writes the hook that reaches the guard</text><g transform="translate(0,40)"><rect x="16" y="136" width="536" height="112" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="222" y="140" width="124" height="12" rx="2" fill="#2d3142"/><text x="284" y="149" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT A SPELL PRINTS</text><path data-edge="external:Harness spells->external:Hook entry" id="harness-integrations-edge-external_3aHarness_20spells-external_3aHook_20entry" d="M 248 200 L 320 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="external:Hook entry->external:Agent host" id="harness-integrations-edge-external_3aHook_20entry-external_3aAgent_20host" d="M 536 200 L 632 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="external:Agent host->internal/guard" id="harness-integrations-edge-external_3aAgent_20host-internal_2fguard" d="M 848 200 L 920 200" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-accent)"/><path data-edge="external:Skills->external:Agent host" id="harness-integrations-edge-external_3aSkills-external_3aAgent_20host" d="M 1604 80 L 1604 72 Q 1604 64 1596 64 L 748 64 Q 740 64 740 72 L 740 168" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/agent->external:Skills" id="harness-integrations-edge-internal_2fagent-external_3aSkills" d="M 1316 168 L 1316 120 Q 1316 112 1324 112 L 1496 112" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/agent->external:Scout agent" id="harness-integrations-edge-internal_2fagent-external_3aScout_20agent" d="M 1424 200 L 1496 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/guard->internal/agent" id="harness-integrations-edge-internal_2fguard-internal_2fagent" d="M 1136 200 L 1208 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><rect x="264" y="178" width="40" height="12" rx="2" fill="#2d3142"/><text x="284" y="187" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PRINTS</text><rect x="544" y="178" width="80" height="12" rx="2" fill="#2d3142"/><text x="584" y="187" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGED BY HAND</text><rect x="854" y="178" width="60" height="12" rx="2" fill="#2d3142"/><text x="884" y="187" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><rect x="1150" y="42" width="44" height="12" rx="2" fill="#2d3142"/><text x="1172" y="51" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ BY</text><rect x="1384" y="90" width="40" height="12" rx="2" fill="#2d3142"/><text x="1404" y="99" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITES</text><rect x="1440" y="178" width="40" height="12" rx="2" fill="#2d3142"/><text x="1460" y="187" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITES</text><g data-node="external:Harness spells"><rect x="32" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="168" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="140" y="200" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Harness spells</text><text x="140" y="216" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">spells/harness: claude-code, codex, cursor, opencode</text></g><g data-node="external:Hook entry"><rect x="320" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="168" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="200" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Hook entry</text><text x="428" y="216" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">printed by describe harness</text></g><g data-node="external:Agent host"><rect x="632" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="632" y="168" width="216" height="64" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><rect x="640" y="176" width="48" height="12" rx="2" fill="none" stroke="#a9b1c2" stroke-width="0.8"/><text x="664" y="185" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="740" y="208" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent host</text><text x="740" y="224" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, Codex, Cursor, OpenCode</text></g><g data-node="external:Skills"><rect x="1496" y="80" width="216" height="64" rx="6" fill="#2d3142"/><rect x="1496" y="80" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1604" y="112" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Skills</text><text x="1604" y="128" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">embedded, stamped</text></g><g data-node="external:Scout agent"><rect x="1496" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="1496" y="168" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1604" y="200" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Scout agent</text><text x="1604" y="216" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">read-only lookups</text></g><g data-node="internal/agent" data-anchor="internal/agent"><rect x="1208" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="1208" y="168" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1316" y="200" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent install</text><text x="1316" y="216" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus agent install</text></g><g data-node="internal/agent/harness" data-anchor="internal/agent/harness"><rect x="32" y="272" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="272" width="216" height="64" rx="6" fill="#393e53" stroke="#a9b1c2" stroke-width="1.2" stroke-dasharray="4,3"/><text x="140" y="304" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host driver</text><text x="140" y="320" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">runs a host's loop in tests</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="920" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="920" y="168" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1028" y="200" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="1028" y="216" fill="#a9b1c2" font-family=