<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 792 960" width="792" height="960" role="img" aria-labelledby="harness-integrations-title harness-integrations-desc" class="magus-diagram"><metadata>{"diagram":"harness-integrations","stamp":"sha256:497f9a906eee20ecc9d7cad16c6a9ea7d05a17863d25ca0ffc54cbb735491bfd"}</metadata><title id="harness-integrations-title">One spell per host writes the hook that reaches the guard</title><desc id="harness-integrations-desc">Each supported host has a harness spell under spells/harness that prints the hook entry a person merges into the host's config. magus agent install writes the shared half, the embedded skills and the scout agent, through internal/agent. The hook each spell prints runs the guard before every call, and the driver in internal/agent/harness proves it against a real hook payload.</desc><defs><marker id="harness-integrations-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="harness-integrations-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="harness-integrations-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">One spell per host writes the hook that reaches the guard</text><g transform="translate(0,40)"><rect x="272" y="32" width="248" height="248" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="334" y="36" width="124" height="12" rx="2" fill="#2d3142"/><text x="396" y="45" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT A SPELL PRINTS</text><path data-edge="external:Harness spells->external:Hook entry" id="harness-integrations-edge-external_3aHarness_20spells-external_3aHook_20entry" d="M 396 128 L 396 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="external:Hook entry->external:Agent host" id="harness-integrations-edge-external_3aHook_20entry-external_3aAgent_20host" d="M 396 264 L 396 336" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="external:Agent host->internal/guard" id="harness-integrations-edge-external_3aAgent_20host-internal_2fguard" d="M 396 400 L 396 472" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-accent)"/><path data-edge="external:Skills->external:Agent host" id="harness-integrations-edge-external_3aSkills-external_3aAgent_20host" d="M 48 776 L 40 776 Q 32 776 32 768 L 32 376 Q 32 368 40 368 L 288 368" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/agent->external:Skills" id="harness-integrations-edge-internal_2fagent-external_3aSkills" d="M 288 640 L 164 640 Q 156 640 156 648 L 156 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/agent->external:Scout agent" id="harness-integrations-edge-internal_2fagent-external_3aScout_20agent" d="M 396 672 L 396 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><path data-edge="internal/guard->internal/agent" id="harness-integrations-edge-internal_2fguard-internal_2fagent" d="M 396 536 L 396 608" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-integrations-arrow-default)"/><rect x="406" y="156" width="40" height="12" rx="2" fill="#2d3142"/><text x="426" y="165" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PRINTS</text><rect x="406" y="292" width="80" height="12" rx="2" fill="#2d3142"/><text x="446" y="301" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGED BY HAND</text><rect x="406" y="428" width="60" height="12" rx="2" fill="#2d3142"/><text x="436" y="437" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><rect x="138" y="346" width="44" height="12" rx="2" fill="#2d3142"/><text x="160" y="355" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ BY</text><rect x="200" y="618" width="40" height="12" rx="2" fill="#2d3142"/><text x="220" y="627" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITES</text><rect x="406" y="700" width="40" height="12" rx="2" fill="#2d3142"/><text x="426" y="709" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITES</text><g data-node="external:Harness spells"><rect x="288" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="288" y="64" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="396" y="96" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Harness spells</text><text x="396" y="112" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">spells/harness: claude-code, codex, cursor, opencode</text></g><g data-node="external:Hook entry"><rect x="288" y="200" width="216" height="64" rx="6" fill="#2d3142"/><rect x="288" y="200" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="396" y="232" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Hook entry</text><text x="396" y="248" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">printed by describe harness</text></g><g data-node="external:Agent host"><rect x="288" y="336" width="216" height="64" rx="6" fill="#2d3142"/><rect x="288" y="336" width="216" height="64" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><rect x="296" y="344" width="48" height="12" rx="2" fill="none" stroke="#a9b1c2" stroke-width="0.8"/><text x="320" y="353" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="396" y="376" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent host</text><text x="396" y="392" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, Codex, Cursor, OpenCode</text></g><g data-node="external:Skills"><rect x="48" y="744" width="216" height="64" rx="6" fill="#2d3142"/><rect x="48" y="744" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="156" y="776" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Skills</text><text x="156" y="792" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">embedded, stamped</text></g><g data-node="external:Scout agent"><rect x="288" y="744" width="216" height="64" rx="6" fill="#2d3142"/><rect x="288" y="744" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="396" y="776" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Scout agent</text><text x="396" y="792" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">read-only lookups</text></g><g data-node="internal/agent" data-anchor="internal/agent"><rect x="288" y="608" width="216" height="64" rx="6" fill="#2d3142"/><rect x="288" y="608" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="396" y="640" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent install</text><text x="396" y="656" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus agent install</text></g><g data-node="internal/agent/harness" data-anchor="internal/agent/harness"><rect x="544" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="544" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#a9b1c2" stroke-width="1.2" stroke-dasharray="4,3"/><text x="652" y="96" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host driver</text><text x="652" y="112" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">runs a host's loop in tests</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="288" y="472" width="216" height="64" rx="6" fill="#2d3142"/><rect x="288" y="472" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="396" y="504" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="396" y="520" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">every call, first</text></g><line x1="32" y1="860" x2="760" y2="860" stroke="#505466" stroke-width="0.8"/><text x="32" y="874" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="880" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="889" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">ONE PER HOST</text><rect x="192" y="880" width="10" height="10" rx="2" fill="#393e53" stroke="#a9b1c2" stroke-width="0.8"/><text x="210" y="889" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">TESTS ONLY</text><rect x="352" y="880" width="10" height="10" rx="2" fill="#2d3142" stroke="#a9b1c2" stroke-width="0.8"/><text x="370" y="889" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>