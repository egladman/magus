<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 768" width="760" height="768" role="img" aria-labelledby="vcs-title vcs-desc" class="magus-diagram"><metadata>{"diagram":"vcs","stamp":"sha256:ff003fe00a36ef7f766337869ad9c343206f5b11c49fe7bacafc4d7ec076773a"}</metadata><title id="vcs-title">One VCS interface answers git, Mercurial, Sapling and Jujutsu</title><desc id="vcs-desc">The vcs package names the revision, the branch, the dirty digest and the changed files for whichever backend the checkout uses, so no other package runs a VCS command. Job leases and the cache key read the revision, the session and activity records stamp it, and the landing code reads the branch and the merge base.</desc><defs><marker id="vcs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="vcs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="vcs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">VCS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">One VCS interface answers git, Mercurial, Sapling and Jujutsu</text><g transform="translate(0,40)"><path data-edge="vcs->internal/file" id="vcs-edge-vcs-internal_2ffile" d="M 272 476 L 148 476 Q 140 476 140 484 L 140 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="vcs->internal/stamp" id="vcs-edge-vcs-internal_2fstamp" d="M 380 504 L 380 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="vcs->libs/xdg" id="vcs-edge-vcs-libs_2fxdg" d="M 488 476 L 612 476 Q 620 476 620 484 L 620 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Runs->vcs" id="vcs-edge-group_3aRuns-vcs" d="M 368 220 L 372 220 Q 380 220 380 228 L 380 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Runs->group:Records" id="vcs-edge-group_3aRuns-group_3aRecords" d="M 260 248 L 260 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Records->vcs" id="vcs-edge-group_3aRecords-vcs" d="M 260 376 L 260 404 Q 260 412 268 412 L 360 412 Q 368 412 368 420 L 368 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Landing->vcs" id="vcs-edge-group_3aLanding-vcs" d="M 368 92 L 384 92 Q 392 92 392 100 L 392 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Landing->group:Runs" id="vcs-edge-group_3aLanding-group_3aRuns" d="M 260 120 L 260 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><g data-node="vcs" data-anchor="vcs"><rect x="272" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="448" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="380" y="476" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">VCS</text><text x="380" y="492" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">revision, branch, dirty digest</text></g><g data-node="internal/file" data-anchor="internal/file"><rect x="32" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="576" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="604" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">File helpers</text><text x="140" y="620" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">reads and writes</text></g><g data-node="internal/stamp" data-anchor="internal/stamp"><rect x="272" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="576" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="380" y="604" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Build stamp</text><text x="380" y="620" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">who ran it</text></g><g data-node="libs/xdg" data-anchor="libs/xdg"><rect x="512" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="512" y="576" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="620" y="604" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">XDG paths</text><text x="620" y="620" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">state</text></g><g data-node="group:Runs"><rect x="152" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="152" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="260" y="220" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Runs</text><text x="260" y="236" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">leases, cache key, queue</text></g><g data-node="group:Records" data-drill="guard-path"><rect x="152" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="152" y="320" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="260" y="348" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Records</text><text x="260" y="364" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sessions, activity</text></g><g data-node="group:Landing"><rect x="152" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="152" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="260" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Landing</text><text x="260" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">settle, race, work</text></g><line x1="32" y1="668" x2="728" y2="668" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="682" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="688" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="697" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE INTERFACE</text><rect x="192" y="688" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="697" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>