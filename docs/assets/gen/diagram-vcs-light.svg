<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 416" width="1144" height="416" role="img" aria-labelledby="vcs-title vcs-desc" class="magus-diagram"><metadata>{"figure":"vcs","stamp":"sha256:ca06d3bfb232cd4dca686fb4ea64b6e9a8f0978fc1e2144fce1d1ad651246bf3"}</metadata><title id="vcs-title">One VCS interface answers git, Mercurial, Sapling and Jujutsu</title><desc id="vcs-desc">The vcs package names the revision, the branch, the dirty digest and the changed files for whichever backend the checkout uses, so no other package runs a VCS command. Job leases and the cache key read the revision, the session and trail records stamp it, and the landing code reads the branch and the merge base. The package reads files through internal/file, identifies itself with the build stamp and keeps its state in the XDG directories.</desc><defs><marker id="vcs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="vcs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="vcs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">VCS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">One VCS interface answers git, Mercurial, Sapling and Jujutsu</text><g transform="translate(0,40)"><path data-edge="vcs->internal/file" id="vcs-edge-vcs-internal_2ffile" d="M 716 144 L 716 100 Q 716 92 724 92 L 896 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="vcs->internal/stamp" id="vcs-edge-vcs-internal_2fstamp" d="M 824 172 L 896 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="vcs->libs/xdg" id="vcs-edge-vcs-libs_2fxdg" d="M 716 200 L 716 244 Q 716 252 724 252 L 896 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Runs->vcs" id="vcs-edge-group_3aRuns-vcs" d="M 140 160 L 140 164 Q 140 172 148 172 L 608 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Runs->group:Records" id="vcs-edge-group_3aRuns-group_3aRecords" d="M 248 132 L 320 132" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Records->vcs" id="vcs-edge-group_3aRecords-vcs" d="M 536 132 L 564 132 Q 572 132 572 140 L 572 152 Q 572 160 580 160 L 608 160" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Landing->vcs" id="vcs-edge-group_3aLanding-vcs" d="M 248 212 L 564 212 Q 572 212 572 204 L 572 192 Q 572 184 580 184 L 608 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><g data-node="vcs" data-anchor="vcs"><rect x="608" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="144" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="716" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">VCS</text><text x="716" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">revision, branch, dirty digest</text></g><g data-node="internal/file" data-anchor="internal/file"><rect x="896" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="1004" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">File helpers</text><text x="1004" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">reads and writes</text></g><g data-node="internal/stamp" data-anchor="internal/stamp"><rect x="896" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="1004" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Build stamp</text><text x="1004" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">who ran it</text></g><g data-node="libs/xdg" data-anchor="libs/xdg"><rect x="896" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="1004" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">XDG paths</text><text x="1004" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">state</text></g><g data-node="group:Runs"><rect x="32" y="104" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="104" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="132" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Runs</text><text x="140" y="148" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">leases, cache key, queue</text></g><g data-node="group:Records"><rect x="320" y="104" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="104" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="132" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Records</text><text x="428" y="148" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sessions, trail</text></g><g data-node="group:Landing"><rect x="32" y="184" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="184" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="212" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Landing</text><text x="140" y="228" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">settle, race, work</text></g><line x1="32" y1="316" x2="1112" y2="316" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="330" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="336" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="345" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE INTERFACE</text><rect x="192" y="336" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="345" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>