<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 508" width="1144" height="508" role="img" aria-labelledby="sessions-title sessions-desc" class="magus-diagram"><metadata>{"figure":"sessions","stamp":"sha256:1e7693dcb61186a5c58fac699d5e6bb6b179fe4f8e6dd0b349b76878d9faa82a"}</metadata><title id="sessions-title">A session record is written by the hook and read by four others</title><desc id="sessions-desc">Each agent host session gets one record: who started it, its checkout and what it did. The guard appends to it on every call, and the journal underneath keeps the append-only lines. The trail reads the record to say which session made a change, the agent install reads it to rehydrate a session that lost its history, and the console's attention and viewer handlers show it to the person watching.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="sessions-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="sessions-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="sessions-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SESSIONS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">A session record is written by the hook and read by four others</text><g transform="translate(0,40)"><path data-edge="internal/sessions->internal/journal" id="sessions-edge-internal_2fsessions-internal_2fjournal" d="M 824 184 L 896 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/trail->internal/sessions" id="sessions-edge-internal_2ftrail-internal_2fsessions" d="M 536 104 L 556 104 Q 564 104 564 112 L 564 164 Q 564 172 572 172 L 608 172" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/agent->internal/sessions" id="sessions-edge-internal_2fagent-internal_2fsessions" d="M 140 76 L 140 72 Q 140 64 148 64 L 572 64 Q 580 64 580 72 L 580 152 Q 580 160 588 160 L 608 160" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/agent->internal/trail" id="sessions-edge-internal_2fagent-internal_2ftrail" d="M 248 104 L 320 104" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/guard->internal/sessions" id="sessions-edge-internal_2fguard-internal_2fsessions" d="M 248 264 L 556 264 Q 564 264 564 256 L 564 204 Q 564 196 572 196 L 608 196" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/attention->internal/sessions" id="sessions-edge-internal_2fhandler_2fattention-internal_2fsessions" d="M 248 184 L 608 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/attention->internal/trail" id="sessions-edge-internal_2fhandler_2fattention-internal_2ftrail" d="M 248 172 L 276 172 Q 284 172 284 164 L 284 124 Q 284 116 292 116 L 320 116" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/viewer->internal/sessions" id="sessions-edge-internal_2fhandler_2fviewer-internal_2fsessions" d="M 248 344 L 572 344 Q 580 344 580 336 L 580 216 Q 580 208 588 208 L 608 208" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><g data-node="internal/sessions" data-anchor="internal/sessions"><rect x="608" y="148" width="216" height="72" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="148" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="716" y="184" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Session record</text><text x="716" y="200" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one per host session</text></g><g data-node="internal/journal" data-anchor="internal/journal"><rect x="896" y="156" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="896" y="156" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="1004" y="184" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Journal</text><text x="1004" y="200" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">append-only lines</text></g><g data-node="internal/trail" data-anchor="internal/trail"><rect x="320" y="76" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="76" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="428" y="104" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Trail</text><text x="428" y="120" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">which session changed what</text></g><g data-node="internal/agent" data-anchor="internal/agent"><rect x="32" y="76" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="76" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="104" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Agent install</text><text x="140" y="120" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">rehydrate a lost session</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="32" y="236" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="236" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="264" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="140" y="280" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">appends on every call</text></g><g data-node="internal/handler/attention" data-anchor="internal/handler/attention"><rect x="32" y="156" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="156" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="184" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Attention view</text><text x="140" y="200" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what needs a person</text></g><g data-node="internal/handler/viewer" data-anchor="internal/handler/viewer"><rect x="32" y="316" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="316" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="344" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Viewer</text><text x="140" y="360" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the shared read</text></g><line x1="32" y1="408" x2="1112" y2="408" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="422" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="428" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="0.8"/><text x="50" y="437" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE RECORD</text><rect x="192" y="428" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="0.8"/><text x="210" y="437" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>