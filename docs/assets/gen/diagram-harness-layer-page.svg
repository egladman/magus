<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 500" width="1160" height="500" role="img" aria-labelledby="harness-layer-title harness-layer-desc" class="magus-diagram"><metadata>{"figure":"harness-layer","stamp":"sha256:bed3419e0c48f20dd0c8c9abe73af6bbd66eeeaf8b989efcff5b061241bfb74e"}</metadata><title id="harness-layer-title">The harness lives in the task runner, not above it</title><desc id="harness-layer-desc">magus is one Go module. Its root package, the Go SDK, imports the workspace graph, which holds every target's declared inputs and outputs, and the harness packages: the guard and job leases. The CLI imports the same packages. The agent host runs the model loop and sends every call through the guard; magus never calls a model.</desc><defs><marker id="harness-layer-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="harness-layer-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="harness-layer-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">DESIGN</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The harness lives in the task runner, not above it</text><g transform="translate(0,40)"><rect x="592" y="64" width="536" height="200" rx="8" fill="var(--magus-diagram-ink, #2d3142)" fill-opacity="0.02" stroke="var(--magus-diagram-ink, #2d3142)" stroke-opacity="0.1" stroke-width="0.8"/><rect x="816" y="68" width="88" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="860" y="77" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ONE GO MODULE</text><path data-edge="external:A person->cmd/magus" id="harness-layer-edge-external_3aA_20person-cmd_2fmagus" d="M 248 244 L 320 244" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#harness-layer-arrow-default)"/><path data-edge="external:Agent host->group:Harness" id="harness-layer-edge-external_3aAgent_20host-group_3aHarness" d="M 248 332 L 276 332 Q 284 332 284 324 L 284 320 Q 284 312 292 312 L 864 312 Q 872 312 872 304 L 872 236 Q 872 228 880 228 L 896 228" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#harness-layer-arrow-default)"/><path data-edge="cmd/magus->." id="harness-layer-edge-cmd_2fmagus-_2e" d="M 428 212 L 428 136 Q 428 128 436 128 L 608 128" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#harness-layer-arrow-default)"/><path data-edge="cmd/magus->internal/graph/workspacegraph" id="harness-layer-edge-cmd_2fmagus-internal_2fgraph_2fworkspacegraph" d="M 440 276 L 440 280 Q 440 288 448 288 L 840 288 Q 848 288 848 280 L 848 148 Q 848 140 856 140 L 896 140" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#harness-layer-arrow-default)"/><path data-edge="cmd/magus->group:Harness" id="harness-layer-edge-cmd_2fmagus-group_3aHarness" d="M 428 276 L 428 292 Q 428 300 436 300 L 852 300 Q 860 300 860 292 L 860 224 Q 860 216 868 216 L 896 216" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#harness-layer-arrow-default)"/><path data-edge=".->internal/graph/workspacegraph" id="harness-layer-edge-_2e-internal_2fgraph_2fworkspacegraph" d="M 824 128 L 896 128" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#harness-layer-arrow-default)"/><path data-edge=".->group:Harness" id="harness-layer-edge-_2e-group_3aHarness" d="M 716 160 L 716 196 Q 716 204 724 204 L 840 204 A 8 8 0 0 1 856 204 L 896 204" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#harness-layer-arrow-default)"/><rect x="546" y="322" width="60" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="576" y="331" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><g data-node="external:A person"><rect x="32" y="212" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="212" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><rect x="40" y="220" width="48" height="12" rx="2" fill="none" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="64" y="229" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="252" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">A person</text><text x="140" y="268" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">at a terminal</text></g><g data-node="external:Agent host"><rect x="32" y="300" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="300" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><rect x="40" y="308" width="48" height="12" rx="2" fill="none" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="64" y="317" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="340" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Agent host</text><text x="140" y="356" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">runs the model loop</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="320" y="212" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="320" y="212" width="216" height="64" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="428" y="248" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus CLI</text></g><g data-node="." data-anchor="."><rect x="608" y="96" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="96" width="216" height="64" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="716" y="128" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Go SDK</text><text x="716" y="144" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">import magus</text></g><g data-node="internal/graph/workspacegraph" data-anchor="internal/graph/workspacegraph"><rect x="896" y="96" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="896" y="96" width="216" height="64" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1004" y="128" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace graph</text><text x="1004" y="144" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">inputs, outputs, deps</text></g><g data-node="group:Harness"><rect x="896" y="184" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="896" y="184" width="216" height="64" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><text x="1004" y="216" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Harness</text><text x="1004" y="232" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">guard, job leases</text></g><line x1="32" y1="400" x2="1128" y2="400" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="32" y="414" fill="var(--magus-diagram-muted, #4f5d75)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="420" width="10" height="10" rx="2" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="0.8"/><text x="50" y="429" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE HARNESS</text><rect x="192" y="420" width="10" height="10" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="210" y="429" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>