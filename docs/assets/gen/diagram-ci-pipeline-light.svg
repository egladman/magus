<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 592" width="568" height="592" role="img" aria-labelledby="ci-pipeline-title ci-pipeline-desc" class="magus-diagram"><title id="ci-pipeline-title">ci declares steps, not an order</title><desc id="ci-pipeline-desc">A ci target names its steps in a single needs call, so they are independent and run in parallel. Order comes from edges the steps themselves declare, such as test depending on build. magus enforces none of this list.</desc><defs><marker id="ci-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="ci-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="ci-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">TARGETS</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">ci declares steps, not an order</text><g transform="translate(0,40)"><path data-edge="cmd->generate" d="M 248 228 L 264 228 Q 272 228 272 220 L 272 100 Q 272 92 280 92 L 320 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->build" d="M 248 264 L 288 264 Q 296 264 296 272 L 296 324 Q 296 332 304 332 L 320 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->format" d="M 248 240 L 276 240 Q 284 240 284 232 L 284 180 Q 284 172 292 172 L 320 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->test" d="M 248 276 L 276 276 Q 284 276 284 284 L 284 404 Q 284 412 292 412 L 320 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->lint" d="M 248 252 L 320 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->security" d="M 248 288 L 264 288 Q 272 288 272 296 L 272 484 Q 272 492 280 492 L 320 492" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><g data-node="cmd"><rect x="32" y="204" width="216" height="96" rx="6" fill="#f5f5f5"/><rect x="32" y="204" width="216" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="140" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus affected ci</text></g><g data-node="generate"><rect x="320" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">generate</text></g><g data-node="format"><rect x="320" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">format</text></g><g data-node="lint"><rect x="320" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="256" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">lint</text></g><g data-node="build"><rect x="320" y="304" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="336" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">build</text></g><g data-node="test"><rect x="320" y="384" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="384" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="416" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">test</text></g><g data-node="security"><rect x="320" y="464" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="464" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="496" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">security</text></g></g></svg>