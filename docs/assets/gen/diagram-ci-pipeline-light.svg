<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="ci-pipeline-title ci-pipeline-desc" class="magus-diagram"><title id="ci-pipeline-title">ci declares steps, not an order</title><desc id="ci-pipeline-desc">A ci target names its steps in a single needs call, so they are independent and run in parallel. Order comes from edges the steps themselves declare, such as test depending on build. magus enforces none of this list.</desc><defs><marker id="ci-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="ci-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="ci-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">TARGETS</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">ci declares steps, not an order</text><g transform="translate(0,40)"><path d="M 412 144 L 412 148 Q 412 156 404 156 L 128 156 Q 120 156 120 164 L 120 224" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 436 144 L 436 160 Q 436 168 428 168 L 248 168 Q 240 168 240 176 L 240 340" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 456 144 L 456 172 Q 456 180 448 180 L 368 180 Q 360 180 360 188 L 360 224" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 480 144 L 480 192 L 480 192 L 480 340" fill="none" s