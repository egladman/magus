<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 592" width="568" height="592" role="img" aria-labelledby="ci-pipeline-title ci-pipeline-desc" class="magus-diagram"><title id="ci-pipeline-title">ci declares steps, not an order</title><desc id="ci-pipeline-desc">A ci target names its steps in a single needs call, so they are independent and run in parallel. Order comes from edges the steps themselves declare, such as test depending on build. magus enforces none of this list.</desc><defs><marker id="ci-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="ci-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="ci-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">TARGETS</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">ci declares steps, not an order</text><g transform="translate(0,40)"><path d="M 248 272 L 248 272 Q 256 272 256 264 L 256 100 Q 256 92 264 92 L 320 92" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 248 296 L 300 296 Q 308 296 308 304 L 308 324 Q 308 332 316 332 L 320 332" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 248 280 L 260 280 Q 268 280 268 272 L 268 180 Q 268 172 276 172 L 320 172" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 248 304 L 288 304 Q 296 304 296 312 L 296 404 Q 296 412 304 412 L 320 412" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 248 288 L 268 288 Q 276 288 276 280 L 276 260 Q 276 252 284 252 L 320 252" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 248 312 L 280 312 Q 288 312 288 320 L 288 484 Q 288 492 296 492 L 320 492" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><rect x="32" y="264" width="216" height="56" rx="6" fill="#ffffff"/><rect x="32" y="264" width="216" height="56" rx="6" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="1"/><text x="140" y="296" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus affected ci</text><rect x="320" y="64" width="216" height="56" rx="6" fill="#ffffff"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="428" y="96" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">generate</text><rect x="320" y="144" width="216" height="56" rx="6" fill="#ffffff"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="428" y="176" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">format</text><rect x="320" y="224" width="216" height="56" rx="6" fill="#ffffff"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="428" y="256" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">lint</text><rect x="320" y="304" width="216" height="56" rx="6" fill="#ffffff"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="428" y="336" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">build</text><rect x="320" y="384" width="216" height="56" rx="6" fill="#ffffff"/><rect x="320" y="384" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="428" y="416" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">test</text><rect x="320" y="464" width="216" height="56" rx="6" fill="#ffffff"/><rect x="320" y="464" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="428" y="496" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">security</text></g></svg>