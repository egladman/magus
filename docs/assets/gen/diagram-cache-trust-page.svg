<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1176 536" width="1176" height="536" role="img" aria-labelledby="cache-trust-title cache-trust-desc" class="magus-diagram"><metadata>{"figure":"cache-trust","stamp":"sha256:f9571c298b54b742e67c27f6a26292dd967f1a8ce1f08b751dd8007bdbb8c3fc"}</metadata><title id="cache-trust-title">A pull request reads the shared cache and never writes it</title><desc id="cache-trust-desc">A pull request run reads the signed remote tier and reads and writes a local tier scoped to its own ref. Only a run on the default branch holds the signing key, so only the default branch writes the remote tier. Every read checks the signature and rebuilds the target on an unsigned entry.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="cache-trust-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="cache-trust-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="cache-trust-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">REMOTE CACHE</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">A pull request reads the shared cache and never writes it</text><g transform="translate(0,40)"><rect x="592" y="64" width="552" height="112" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="778" y="68" width="180" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="868" y="77" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">PULL REQUEST, UNTRUSTED CODE</text><rect x="16" y="288" width="824" height="112" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="354" y="292" width="148" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="428" y="301" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">DEFAULT BRANCH, TRUSTED</text><path data-edge="external:PR run->external:Local tier" id="cache-trust-edge-external_3aPR_20run-external_3aLocal_20tier" d="M 824 128 L 912 128" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#cache-trust-arrow-default)"/><path data-edge="internal/cache->external:PR run" id="cache-trust-edge-internal_2fcache-external_3aPR_20run" d="M 428 200 L 428 136 Q 428 128 436 128 L 608 128" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#cache-trust-arrow-default)"/><path data-edge="internal/cache->external:Unsigned entry" id="cache-trust-edge-internal_2fcache-external_3aUnsigned_20entry" d="M 536 232 L 564 232 Q 572 232 572 240 L 572 344 Q 572 352 580 352 L 608 352" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cache-trust-arrow-default)"/><path data-edge="external:Default branch run->internal/cache" id="cache-trust-edge-external_3aDefault_20branch_20run-internal_2fcache" d="M 248 352 L 276 352 Q 284 352 284 344 L 284 240 Q 284 232 292 232 L 320 232" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="1.2" marker-end="url(#cache-trust-arrow-accent)"/><rect x="832" y="106" width="72" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="868" y="115" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ + WRITE</text><rect x="488" y="106" width="56" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="516" y="115" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ ONLY</text><rect x="582" y="284" width="72" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="618" y="293" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO SIGNATURE</text><rect x="254" y="210" width="60" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="284" y="219" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SIGN + PUT</text><g data-node="external:PR run"><rect x="608" y="96" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><rect x="616" y="104" width="84" height="12" rx="2" fill="none" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="658" y="113" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PULL_REQUEST</text><text x="716" y="136" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">PR run</text><text x="716" y="152" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">no signing key</text></g><g data-node="external:Local tier"><rect x="912" y="96" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="912" y="96" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="1020" y="128" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Local tier</text><text x="1020" y="144" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Actions cache, PR ref</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="320" y="200" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="200" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><rect x="328" y="208" width="52" height="12" rx="2" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="0.8"/><text x="354" y="217" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ED25519</text><text x="428" y="240" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Remote tier</text><text x="428" y="256" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">verified on every read</text></g><g data-node="external:Default branch run"><rect x="32" y="320" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="320" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><rect x="40" y="328" width="36" height="12" rx="2" fill="none" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="58" y="337" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PUSH</text><text x="140" y="360" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Default branch run</text><text x="140" y="376" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">holds the signing key</text></g><g data-node="external:Unsigned entry"><rect x="608" y="320" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="320" width="216" height="64" rx="6" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="1.2" stroke-dasharray="4,3"/><text x="716" y="352" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Unsigned entry</text><text x="716" y="368" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">rejected, then rebuilt</text></g><line x1="32" y1="436" x2="1144" y2="436" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="450" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="456" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="0.8"/><text x="50" y="465" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE SHARED STORE</text><rect x="192" y="456" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="0.8"/><text x="210" y="465" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">ONE PULL REQUEST ONLY</text><rect x="352" y="456" width="10" height="10" rx="2" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="0.8"/><text x="370" y="465" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">NEVER REPLAYED</text></g></svg>