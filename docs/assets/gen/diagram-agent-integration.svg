 fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">commands, next fields</text></g><line x1="32" y1="860" x2="668" y2="860" stroke="#505466" stroke-width="0.8"/><text x="32" y="874" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="880" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="889" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE GATE</text><rect x="192" y="880" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="889" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECLARED LEASES</text><rect x="352" y="880" width="10" height="10" rx="2" fill="#2d3142" stroke="#a9b1c2" stroke-width="0.8"/><text x="370" y="889" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>