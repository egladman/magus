<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 960" width="700" height="960" role="img" aria-labelledby="agent-integration-title agent-integration-desc" class="magus-diagram"><metadata>{"figure":"agent-integration","stamp":"sha256:f5322edb38d4f1b3451f2a7375c7e8f943267480a42c7654dd3845f6c64a1004"}</metadata><title id="agent-integration-title">Every call an agent host makes crosses the guard first</title><desc id="agent-integration-desc">magus agent install writes the skills and the AGENTS.md block, and a harness spell prints the hook entry for the host's config. The host then runs the guard before every shell command, edit and MCP call, and only an allowed call runs. The guard reads the job store for the call's lease, and every reply names commands through internal/hint.</desc><defs><marker id="agent-integration-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="agent-integration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="agent-integration-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">Every call an agent host makes crosses the guard first</text><g transform="translate(0,40)"><rect x="48" y="32" width="620" height="248" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="274" y="36" width="168" height="12" rx="2" fill="#2d3142"/><text x="358" y="45" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">INSTALLED BEFORE A SESSION</text><rect x="48" y="440" width="620" height="384" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="314" y="444" width="88" height="12" rx="2" fill="#2d3142"/><text x="358" y="453" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ON EVERY CALL</text><path data-edge="internal/agent->external:Skills" id="agent-integration-edge-internal_2fagent-external_3aSkills" d="M 304 128 L 304 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="external:Skills->external:Agent host" id="agent-integration-edge-external_3aSkills-external_3aAgent_20host" d="M 304 264 L 304 292 Q 304 300 312 300 L 408 300 Q 416 300 416 308 L 416 336" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="external:Harness spells->external:Agent host" id="agent-integration-edge-external_3aHarness_20spells-external_3aAgent_20host" d="M 544 128 L 544 292 Q 544 300 536 300 L 440 300 Q 432 300 432 308 L 432 336" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="external:Agent host->internal/guard" id="agent-integration-edge-external_3aAgent_20host-internal_2fguard" d="M 316 368 L 192 368 Q 184 368 184 376 L 184 472" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#agent-integration-arrow-accent)"/><path data-edge="external:Agent host->group:MCP tools" id="agent-integration-edge-external_3aAgent_20host-group_3aMCP_20tools" d="M 424 400 L 424 472" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/guard->internal/agent" id="agent-integration-edge-internal_2fguard-internal_2fagent" d="M 76 492 L 40 492 Q 32 492 32 484 L 32 104 Q 32 96 40 96 L 196 96" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/guard->internal/job" id="agent-integration-edge-internal_2fguard-internal_2fjob" d="M 184 536 L 184 608" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/guard->internal/hint" id="agent-integration-edge-internal_2fguard-internal_2fhint" d="M 76 504 L 72 504 Q 64 504 64 512 L 64 700 Q 64 708 72 708 L 164 708 Q 172 708 172 716 L 172 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/job->internal/hint" id="agent-integration-edge-internal_2fjob-internal_2fhint" d="M 184 672 L 184 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="group:MCP tools->internal/job" id="agent-integration-edge-group_3aMCP_20tools-internal_2fjob" d="M 412 536 L 412 564 Q 412 572 404 572 L 204 572 Q 196 572 196 580 L 196 608" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="group:MCP tools->internal/hint" id="agent-integration-edge-group_3aMCP_20tools-internal_2fhint" d="M 424 536 L 424 700 Q 424 708 416 708 L 204 708 Q 196 708 196 716 L 196 744" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><rect x="314" y="156" width="76" height="12" rx="2" fill="#2d3142"/><text x="352" y="165" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">AGENT INSTALL</text><rect x="338" y="278" width="44" height="12" rx="2" fill="#2d3142"/><text x="360" y="287" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ BY</text><rect x="448" y="278" width="80" height="12" rx="2" fill="#2d3142"/><text x="488" y="287" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">HOOKS TO MERGE</text><rect x="218" y="346" width="60" height="12" rx="2" fill="#2d3142"/><text x="248" y="355" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><rect x="434" y="428" width="60" height="12" rx="2" fill="#2d3142"/><text x="464" y="437" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">IF ALLOWED</text><rect x="138" y="564" width="36" height="12" rx="2" fill="#2d3142"/><text x="156" y="573" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="80" y="686" width="72" height="12" rx="2" fill="#2d3142"/><text x="116" y="695" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DENIAL HINTS</text><rect x="276" y="686" width="64" height="12" rx="2" fill="#2d3142"/><text x="308" y="695" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NEXT FIELDS</text><g data-node="internal/agent" data-anchor="internal/agent"><rect x="196" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="196" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="304" y="96" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent install</text><text x="304" y="112" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">writes skills, AGENTS.md</text></g><g data-node="external:Skills"><rect x="196" y="200" width="216" height="64" rx="6" fill="#2d3142"/><rect x="196" y="200" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="304" y="232" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Skills</text><text x="304" y="248" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">embedded, stamped, AGENTS.md</text></g><g data-node="external:Harness spells"><rect x="436" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="436" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="544" y="96" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Harness spells</text><text x="544" y="112" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">spells/harness: a hook entry per host</text></g><g data-node="external:Agent host"><rect x="316" y="336" width="216" height="64" rx="6" fill="#2d3142"/><rect x="316" y="336" width="216" height="64" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><rect x="324" y="344" width="48" height="12" rx="2" fill="none" stroke="#a9b1c2" stroke-width="0.8"/><text x="348" y="353" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="424" y="376" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent host</text><text x="424" y="392" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, Codex, Cursor, OpenCode</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="76" y="472" width="216" height="64" rx="6" fill="#2d3142"/><rect x="76" y="472" width="216" height="64" rx="6" fill="#403