<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 576" width="568" height="576" role="img" aria-labelledby="guard-internals-title guard-internals-desc" class="magus-diagram"><metadata>{"figure":"guard-internals","stamp":"sha256:17c331e02cacc20e21e1523b00bf948e60f507b550350d82e77e6ee5a4190e2d"}</metadata><title id="guard-internals-title">What the guard reads to reach one verdict</title><desc id="guard-internals-desc">The guard holds the rules and little else of its own. The catalog names every built-in rule and its grade, the workspace supplies the loaded policy, and the config says which rules are denied, advised or off. The interpreter runs the workspace's Buzz rule. To judge a call the guard reads the job store for the lease the call acts as and the session record for what the session already did. It writes each judgment to the trail and names the command to run instead through the hint package.</desc><defs><marker id="guard-internals-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="guard-internals-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="guard-internals-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">GUARD</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">What the guard reads to reach one verdict</text><g transform="translate(0,40)"><path data-edge="internal/guard->internal/guard/builtin" id="guard-internals-edge-internal_2fguard-internal_2fguard_2fbuiltin" d="M 140 216 L 140 100 Q 140 92 148 92 L 320 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-internals-arrow-default)"/><path data-edge="internal/guard->group:Policy" id="guard-internals-edge-internal_2fguard-group_3aPolicy" d="M 152 216 L 152 180 Q 152 172 160 172 L 320 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-internals-arrow-default)"/><path data-edge="internal/guard->internal/interp" id="guard-internals-edge-internal_2fguard-internal_2finterp" d="M 248 252 L 320 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-internals-arrow-default)"/><path data-edge="internal/guard->group:Stores" id="guard-internals-edge-internal_2fguard-group_3aStores" d="M 152 288 L 152 324 Q 152 332 160 332 L 320 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-internals-arrow-default)"/><path data-edge="internal/guard->internal/hint" id="guard-internals-edge-internal_2fguard-internal_2fhint" d="M 140 288 L 140 404 Q 140 412 148 412 L 320 412" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-internals-arrow-default)"/><g data-node="internal/guard" data-anchor="internal/guard"><rect x="32" y="216" width="216" height="72" rx="6" fill="#2d3142"/><rect x="32" y="216" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="140" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="140" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one verdict per call</text></g><g data-node="internal/guard/builtin" data-anchor="internal/guard/builtin"><rect x="320" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rule catalog</text><text x="428" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ids, grades</text></g><g data-node="group:Policy"><rect x="320" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Policy</text><text x="428" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">loaded rules, grades</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="320" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Interpreter</text><text x="428" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">runs the Buzz rule</text></g><g data-node="group:Stores"><rect x="320" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="428" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Stores</text><text x="428" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">lease, session, judgment</text></g><g data-node="internal/hint" data-anchor="internal/hint"><rect x="320" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="384" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Hints</text><text x="428" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">next: breadcrumbs</text></g><line x1="32" y1="476" x2="536" y2="476" stroke="#505466" stroke-width="0.8"/><text x="32" y="490" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="496" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE VERDICT</text><rect x="192" y="496" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">READ OR APPENDED</text></g></svg>