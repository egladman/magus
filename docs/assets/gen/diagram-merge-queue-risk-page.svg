75)" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge=".->external:Gate the projects" id="merge-queue-risk-edge-_2e-external_3aGate_20the_20projects" d="M 76 476 L 72 476 Q 64 476 64 484 L 64 788 Q 64 796 72 796 L 420 796 Q 428 796 428 804 L 428 832" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="internal/risk->external:low risk?" id="merge-queue-risk-edge-internal_2frisk-external_3alow_20risk_3f" d="M 184 632 L 184 660 Q 184 668 192 668 L 432 668 Q 440 668 440 676 L 440 704" fill="none" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-accent)"/><path data-edge="external:low risk?->external:Gate the projects" id="merge-queue-risk-edge-external_3alow_20risk_3f-external_3aGate_20the_20projects" d="M 440 760 L 440 832" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="external:low risk?->external:Verdict" id="merge-queue-risk-edge-external_3alow_20risk_3f-external_3aVerdict" d="M 548 732 L 552 732 Q 560 732 560 740 L 560 788 A 8 8 0 0 0 560 804 L 560 916 Q 560 924 552 924 L 516 924 Q 508 924 508 932 L 508 960" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="external:Gate the projects->external:Verdict" id="merge-queue-risk-edge-external_3aGate_20the_20projects-external_3aVerdict" d="M 440 888 L 440 916 Q 440 924 448 924 L 484 924 Q 492 924 492 932 L 492 960" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="external:Verdict->external:GitHub" id="merge-queue-risk-edge-external_3aVerdict-external_3aGitHub" d="M 392 988 L 40 988 Q 32 988 32 980 L 32 100 Q 32 92 40 92 L 452 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#merge-queue-risk-arrow-default)"/><rect x="570" y="148" width="72" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="606" y="157" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGE INTENT</text><rect x="570" y="276" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="592" y="285" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">CHANGES</text><rect x="286" y="326" width="60" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="316" y="335" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">A CONFLICT</text><rect x="480" y="774" width="64" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="512" y="783" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO CONFLICT</text><rect x="208" y="774" width="72" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="244" y="783" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ITS PROJECTS</text><rect x="284" y="646" width="56" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="312" y="655" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">THE CLASS</text><rect x="358" y="772" width="72" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="394" y="781" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES: SETTLED</text><rect x="478" y="902" width="76" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="516" y="911" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO: KICK BACK</text><rect x="416" y="934" width="64" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="448" y="943" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXIT STATUS</text><rect x="222" y="70" width="36" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="240" y="79" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">APPLY</text><g data-node="external:GitHub"><rect x="452" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="452" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="560" y="92" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">GitHub</text><text x="560" y="108" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-fon