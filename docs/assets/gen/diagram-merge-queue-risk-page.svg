text x="210" y="969" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text><rect x="352" y="960" width="10" height="10" rx="2" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="0.8"/><text x="370" y="969" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE QUEUE DECIDES</text></g></svg>