="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO: KICK BACK</text><rect x="340" y="806" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="372" y="815" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXIT STATUS</text><rect x="154" y="838" width="36" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="172" y="847" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">APPLY</text><g data-node="external:Queue workflows"><rect x="64" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="64" y="64" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#5f6780" class="magus-fill-paper magus-stroke-soft" stroke-width="1.2"/><text x="172" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Queue workflows</text><text x="172" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">queue-intent, queue, queue-apply</text></g><g data-node="internal/queue/provider" data-anchor="internal/queue/provider"><rect x="64" y="192" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="64" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="172" y="220" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Forge provider</text><text x="172" y="236" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">github.buzz on a Buzz VM</text></g><a href="#diagram-merge-queue-workflows" data-node="group:Queue engine" data-drill="merge-queue-workflows"><g><rect x="64" y="320" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="64" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="172" y="348" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Queue engine</text><text x="172" y="364" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">plan, validate, apply; asks the SDK</text></g></a><g data-node="internal/risk" data-anchor="internal/risk"><rect x="64" y="448" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="64" y="448" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="172" y="476" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Classify each path</text><text x="172" y="492" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">generated, prose, comment, code</text></g><g data-node="external:low risk?"><polygon points="440,576 548,604 440,632 332,604" fill="#f5f5f5" class="magus-fill-paper"/><polygon points="440,576 548,604 440,632 332,604" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="440" y="608" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">low risk?</text></g><g data-node="external:Gate the projects"><rect x="256" y="704" width="216" height="5