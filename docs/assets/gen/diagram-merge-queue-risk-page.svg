<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 1168" width="700" height="1168" role="img" aria-labelledby="merge-queue-risk-title merge-queue-risk-desc" class="magus-diagram"><metadata>{"figure":"merge-queue-risk","stamp":"sha256:af87cf636bf8f25a99b041062981f50c1a7843b5c5a0c7b5751efb3b84bd8417"}</metadata><title id="merge-queue-risk-title">What a candidate's risk makes the queue run</title><desc id="merge-queue-risk-desc">For a conflicted file the queue asks the classifier which class the edit is and settles only a low-risk one, kicking code back, then gates the projects the magus SDK says the change reaches, or every project when that set is no proof.</desc><defs><marker id="merge-queue-risk-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="merge-queue-risk-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="merge-queue-risk-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MERGE QUEUE</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What a candidate's risk makes the queue run</text><g transform="translate(0,40)"><rect x="48" y="416" width="260" height="232" rx="8" fill="var(--magus-diagram-ink, #2d3142)" fill-opacity="0.02" stroke="var(--magus-diagram-ink, #2d3142)" stroke-opacity="0.1" stroke-width="0.8"/><rect x="134" y="42