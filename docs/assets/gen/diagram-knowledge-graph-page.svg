" d="M 536 496 L 556 496 Q 564 496 564 488 L 564 324 Q 564 316 572 316 L 608 316" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="cmd/magus->." id="knowledge-graph-edge-cmd_2fmagus-_2e" d="M 248 496 L 320 496" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="internal/handler/mcp->internal/graph/knowledge" id="knowledge-graph-edge-internal_2fhandler_2fmcp-internal_2fgraph_2fknowledge" d="M 248 584 L 572 584 Q 580 584 580 576 L 580 336 Q 580 328 588 328 L 608 328" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="internal/handler/mcp->." id="knowledge-graph-edge-internal_2fhandler_2fmcp-_2e" d="M 248 572 L 276 572 Q 284 572 284 564 L 284 516 Q 284 508 292 508 L 320 508" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><g data-node="external:Magusfiles + adapters"><rect x="32" y="96" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="128" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Magusfiles + adapters</text><text x="140" y="144" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">registry, Buzz, docs, dirs, links, owners</text></g><g data-node="external:History"><rect x="32" y="184" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="184" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-s