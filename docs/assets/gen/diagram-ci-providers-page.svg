<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 512" width="1160" height="512" role="img" aria-labelledby="ci-providers-title ci-providers-desc" class="magus-diagram"><metadata>{"figure":"ci-providers","stamp":"sha256:1144da65c9f7c6bd2c13ea9e5ba195aa557dd1d9a53ab8fd4e5d816c4b0c0f20"}</metadata><title id="ci-providers-title">Vendor syntax lives in the spell, never in the binary</title><desc id="ci-providers-desc">A failing project reaches the annotator contract, which speaks generic verbs to a provider spell; the spell translates them into the CI system's own syntax. Quote prefixes are declared once and applied per line in Go.</desc><defs><marker id="ci-providers-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="ci-providers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="ci-providers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">CI PROVIDERS</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Vendor syntax lives in the spell, never in the binary</text><g transform="translate(0,40)"><rect x="16" y="64" width="536" height="184" rx="8" fill="var(--magus-diagram-ink, #2d3142)" fill-opacity="0.02" stroke="var(--magus-diagram-ink, #2d3142)" stroke-opacity="0.1" stroke-width="0.8"/><rect x="182" y="68" width="204" height="12" rx=