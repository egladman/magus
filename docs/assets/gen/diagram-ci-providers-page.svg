ontract</text><text x="172" y="112" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">internal/ci/annotate</text></g><g data-node="internal/ci" data-anchor="internal/ci"><rect x="64" y="336" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="64" y="336" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="172" y="368" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">QuoteWith</text><text x="172" y="384" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">per line, in Go</text></g><g data-node="external:Provider spell"><rect x="320" y="200" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="200" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><rect x="328" y="208" width="36" height="12" rx="2" fill="none" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="346" y="217" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">BUZZ</text><text x="428" y="240" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Provider spell</text><text x="428" y="256" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">group, annotate, quote_prefixes</text></g><g data-node="external:CI system"><rect x="192" y="472" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="192" y="472