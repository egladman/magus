<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1736 640" width="1736" height="640" role="img" aria-labelledby="buzz-engine-title buzz-engine-desc" class="magus-diagram"><title id="buzz-engine-title">One pipeline, and the modules each host registers</title><desc id="buzz-engine-desc">gopherbuzz parses Buzz source, type-checks it, compiles it to bytecode and runs it on its VM, the same way for a magusfile, a spell, a magus buzz script and the browser playground. The host bindings register magus's host modules at init, through the trampolines generated from each module's descriptor. The playground's wasm build installs only the modules marked WASM: pure compute, with no filesystem, process or network access.</desc><defs><marker id="buzz-engine-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="buzz-engine-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="buzz-engine-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">BUZZ</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One pipeline, and the modules each host registers</text><g transform="translate(0,40)"><rect x="592" y="64" width="1112" height="112" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="1112" y="68" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="1148" y="77" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">GOPHERBUZZ</text><rect x="16" y="200" width="824" height="156" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="384" y="204" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="428" y="213" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">MAGUS AS HOST</text><rect x="16" y="380" width="536" height="124" rx="8" fill="#eb6c36" fill-opacity="0.05" stroke="#eb6c36" stroke-opacity="0.5" stroke-width="1.2" stroke-dasharray="4,4"/><rect x="218" y="374" width="132" height="12" rx="2" fill="#f5f5f5"/><text x="284" y="383" fill="#eb6c36" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE BROWSER, JS/WASM</text><path data-edge="engine->parse" id="buzz-engine-edge-engine-parse" d="M 536 264 L 552 264 Q 560 264 560 256 L 560 128 Q 560 120 568 120 L 608 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="playground->parse" id="buzz-engine-edge-playground-parse" d="M 140 476 L 140 480 Q 140 488 148 488 L 564 488 Q 572 488 572 480 L 572 452 A 8 8 0 0 1 572 436 L 572 144 Q 572 136 580 136 L 608 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="parse->check" id="buzz-engine-edge-parse-check" d="M 824 128 L 896 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="check->compile" id="buzz-engine-edge-check-compile" d="M 1112 128 L 1184 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="compile->vm" id="buzz-engine-edge-compile-vm" d="M 1400 128 L 1472 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="bindings->engine" id="buzz-engine-edge-bindings-engine" d="M 248 264 L 320 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="bindings->std" id="buzz-engine-edge-bindings-std" d="M 140 296 L 140 300 Q 140 308 148 308 L 564 308 A 8 8 0 0 1 580 308 L 608 308" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="playground->wasm" id="buzz-engine-edge-playground-wasm" d="M 248 444 L 320 444" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="wasm->std" id="buzz-engine-edge-wasm-std" d="M 536 444 L 576 444 Q 584 444 584 436 L 584 328 Q 584 320 592 320 L 608 320" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-accent)"/><rect x="540" y="98" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="568" y="107" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MAGUSFILE</text><rect x="318" y="498" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="356" y="507" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EDITOR SOURCE</text><rect x="1410" y="106" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="1436" y="115" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BYTECODE</text><rect x="264" y="242" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="284" y="251" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INIT()</text><rect x="336" y="318" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="372" y="327" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY MODULE</text><rect x="258" y="422" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="284" y="431" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INSTALLS</text><rect x="594" y="372" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="634" y="381" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WASM-SAFE ONLY</text><g data-node="engine" data-anchor="internal/interp"><rect x="320" y="232" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="232" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Magusfile engine</text><text x="428" y="280" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">load, cache, run targets</text></g><g data-node="bindings" data-anchor="internal/interp/bindings"><rect x="32" y="232" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="232" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Host bindings</text><text x="140" y="280" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus namespace, init()</text></g><g data-node="std" data-anchor="std"><rect x="608" y="276" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="608" y="276" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="716" y="308" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Host modules</text><text x="716" y="324" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">fs, vcs, proc, http, json</text></g><g data-node="parse" data-anchor="libs/gopherbuzz/parser.go"><rect x="608" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="608" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="716" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Parse</text><text x="716" y="144" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">tokens to AST</text></g><g data-node="check" data-anchor="libs/gopherbuzz/checker.go"><rect x="896" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="896" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1004" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Type-check</text><text x="1004" y="144" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">BZZ diagnostics</text></g><g data-node="compile" data-anchor="libs/gopherbuzz/compiler.go"><rect x="1184" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="1184" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1292" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Compile</text><text x="1292" y="144" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">flat bytecode</text></g><g data-node="vm" data-anchor="libs/gopherbuzz/vm"><rect x="1472" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="1472" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1580" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">VM</text><text x="1580" y="144" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">register window, JIT</text></g><g data-node="playground" data-anchor="cmd/buzz-playground"><rect x="32" y="412" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="412" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="40" y="420" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="64" y="429" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="452" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Browser playground</text><text x="140" y="468" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">js/wasm editor, REPL</text></g><g data-node="wasm" data-anchor="internal/interp/bindings/gen/modules_wasm.go"><rect x="320" y="412" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="412" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="428" y="444" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">WASM module set</text><text x="428" y="460" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">pure compute only</text></g><line x1="32" y1="540" x2="1704" y2="540" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="554" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="560" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="569" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE BROWSER'S SUBSET</text></g></svg>