<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 240" width="1168" height="240" role="img" aria-labelledby="mandate-raises-the-bar-title mandate-raises-the-bar-desc" class="magus-diagram"><metadata>{"figure":"mandate-raises-the-bar","stamp":"sha256:7609f5874b0dc4d0093d9b6d94b1beb2f0f192839f302a153d0d1900d8c092c8"}</metadata><title id="mandate-raises-the-bar-title">A mandate raises the bar at its tolerance</title><desc id="mandate-raises-the-bar-desc">The risk tiers magus proves, lowest first. The person types --tolerance when issuing a mandate, at most this repository's ceiling, mechanical. An unsettled job whose change proves at or below it is integrated with no one present; one above it is held for review. A settled job is integrated through its gates at any tier.</desc><defs><marker id="mandate-raises-the-bar-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="mandate-raises-the-bar-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="mandate-raises-the-bar-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">DECISION</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">A mandate raises the bar at its tolerance</text><g transform="translate(0,40)"><rect x="16" y="64" width="536" height="104" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="188" y="68" width="192" height="12" rx="2" fill="#f5f5f5"/><text x="284" y="77" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">INTEGRATED WITH NO ONE PRESENT</text><rect x="600" y="64" width="536" height="104" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="818" y="68" width="100" height="12" rx="2" fill="#f5f5f5"/><text x="868" y="77" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">HELD FOR REVIEW</text><path data-edge="external:trivial->external:mechanical" id="mandate-raises-the-bar-edge-external_3atrivial-external_3amechanical" d="M 248 124 L 320 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mandate-raises-the-bar-arrow-default)"/><path data-edge="external:mechanical->external:scoped" id="mandate-raises-the-bar-edge-external_3amechanical-external_3ascoped" d="M 536 124 L 616 124" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#mandate-raises-the-bar-arrow-accent)"/><path data-edge="external:scoped->external:full" id="mandate-raises-the-bar-edge-external_3ascoped-external_3afull" d="M 832 124 L 904 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#mandate-raises-the-bar-arrow-default)"/><rect x="544" y="102" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="576" y="111" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">--TOLERANCE</text><g data-node="external:trivial"><rect x="32" y="96" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="96" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><text x="140" y="124" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">trivial</text><text x="140" y="140" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">no gate</text></g><g data-node="external:mechanical"><rect x="320" y="96" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="96" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><text x="428" y="124" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">mechanical</text><text x="428" y="140" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">no code semantics</text></g><g data-node="external:scoped"><rect x="616" y="96" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="616" y="96" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><text x="724" y="124" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">scoped</text><text x="724" y="140" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">tests narrow</text></g><g data-node="external:full"><rect x="904" y="96" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="904" y="96" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><text x="1012" y="124" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">full</text><text x="1012" y="140" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">anything unproven</text></g></g></svg>