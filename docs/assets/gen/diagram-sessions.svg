<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 496" width="1144" height="496" role="img" aria-labelledby="sessions-title sessions-desc" class="magus-diagram"><metadata>{"diagram":"sessions","stamp":"sha256:53b9b7ed24c0886f36a5554547bea565b5d98d1f4a3bf2ab625e2f66291a8d9a"}</metadata><title id="sessions-title">A session record is written by the hook and read by four others</title><desc id="sessions-desc">Each agent host session gets one record: who started it, its checkout and what it did. The guard appends to it on every call, over the append-only journal. The recorder writes the activity log, the agent install reads the record to rehydrate a session, and the console's attention and viewer handlers show it to the person watching.</desc><defs><marker id="sessions-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="sessions-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="sessions-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SESSIONS</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">A session record is written by the hook and read by four others</text><g transform="translate(0,40)"><path data-edge="internal/sessions->libs/safetyscissors/journal" id="sessions-edge-internal_2fsessions-libs_2fsafetyscissors_2fjournal" d="M 536 172 L 852 172 Q 860 172 860 164 L 860 144 Q 860 136 868 136 L 896 136" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/sessions->internal/recorder" id="sessions-edge-internal_2fsessions-internal_2frecorder" d="M 536 160 L 556 160 Q 564 160 564 152 L 564 144 Q 564 136 572 136 L 608 136" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/recorder->libs/safetyscissors/journal" id="sessions-edge-internal_2frecorder-libs_2fsafetyscissors_2fjournal" d="M 824 124 L 896 124" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/agent->internal/sessions" id="sessions-edge-internal_2fagent-internal_2fsessions" d="M 248 104 L 284 104 Q 292 104 292 112 L 292 152 Q 292 160 300 160 L 320 160" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/agent->internal/recorder" id="sessions-edge-internal_2fagent-internal_2frecorder" d="M 248 92 L 556 92 Q 564 92 564 100 L 564 104 Q 564 112 572 112 L 608 112" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/guard->internal/sessions" id="sessions-edge-internal_2fguard-internal_2fsessions" d="M 248 332 L 284 332 Q 292 332 292 324 L 292 204 Q 292 196 300 196 L 320 196" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/attention->internal/sessions" id="sessions-edge-internal_2fhandler_2fattention-internal_2fsessions" d="M 248 172 L 320 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/attention->internal/recorder" id="sessions-edge-internal_2fhandler_2fattention-internal_2frecorder" d="M 248 160 L 268 160 Q 276 160 276 152 L 276 132 Q 276 124 284 124 L 284 124 A 8 8 0 0 1 300 124 L 608 124" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/viewer->internal/sessions" id="sessions-edge-internal_2fhandler_2fviewer-internal_2fsessions" d="M 248 240 L 268 240 Q 276 240 276 232 L 276 192 Q 276 184 284 184 L 320 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/viewer->internal/recorder" id="sessions-edge-internal_2fhandler_2fviewer-internal_2frecorder" d="M 248 252 L 284 252 A 8 8 0 0 1 300 252 L 572 252 Q 580 252 580 244 L 580 180 A 8 8 0 0 1 580 164 L 580 156 Q 580 148 588 148 L 608 148" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><g data-node="internal/sessions" data-anchor="internal/sessions"><rect x="320" y="136" width="216" height="72" rx="6" fill="#2d3142"/><rect x="320" y="136" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="428" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Session record</text><text x="428" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one per host session</text></g><g data-node="libs/safetyscissors/journal" data-anchor="libs/safetyscissors/journal"><rect x="896" y="96" width="216" height="56" rx="6" fill="#2d3142"/><rect x="896" y="96" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="1004" y="124" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Journal</text><text x="1004" y="140" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">append-only lines</text></g><g data-node="internal/recorder" data-anchor="internal/recorder"><rect x="608" y="88" width="216" height="72" rx="6" fill="#2d3142"/><rect x="608" y="88" width="216" height="72" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="124" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Recorder</text><text x="716" y="140" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">which session changed what</text></g><g data-node="internal/agent" data-anchor="internal/agent"><rect x="32" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent install</text><text x="140" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">rehydrate a lost session</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="32" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="140" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">appends on every call</text></g><g data-node="internal/handler/attention" data-anchor="internal/handler/attention"><rect x="32" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Attention view</text><text x="140" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what needs a person</text></g><g data-node="internal/handler/viewer" data-anchor="internal/handler/viewer"><rect x="32" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Viewer</text><text x="140" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the shared read</text></g><line x1="32" y1="396" x2="1112" y2="396" stroke="#505466" stroke-width="0.8"/><text x="32" y="410" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="416" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="425" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE RECORD</text><rect x="192" y="416" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="425" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>