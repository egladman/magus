pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">A CONFLICT</text><rect x="480" y="786" width="64" height="12" rx="2" fill="#2d3142"/><text x="512" y="795" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO CONFLICT</text><rect x="324" y="786" width="72" height="12" rx="2" fill="#2d3142"/><text x="360" y="795" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ITS PROJECTS</text><rect x="308" y="646" width="56" height="12" rx="2" fill="#2d3142"/><text x="336" y="655" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">THE CLASS</text><rect x="450" y="768" width="72" height="12" rx="2" fill="#2d3142"/><text x="486" y="777" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES: SETTLED</text><rect x="478" y="926" width="76" height="12" rx="2" fill="#2d3142"/><text x="516" y="935" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO: KICK BACK</text><rect x="416" y="958" width="64" height="12" rx="2" fill="#2d3142"/><text x="448" y="967" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXIT STATUS</text><rect x="194" y="990" width="36" height="12" rx="2" fill="#2d3142"/><text x="212" y="999" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">APPLY</text><g data-node="external:GitHub"><rect x="264" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="264" y="64" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="372" y="92" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">GitHub</text><text x="372" y="108" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">auto-merge or a label</text></g><g data-node="internal/queue/provider" data-anchor="internal/queue/provider"><rect x="264" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="264" y="192" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="372" y="220" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Forge provider</text><text x="372" y="236" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">github.buzz on a Buzz VM</text></g><g data-node="group:Queue engine"><rect x="264" y="320" width="216" height="56" rx="6" fill="#2d3142"/><rect x="264" y="320" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="372" y="348" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Queue engine</text><text x="372" y="364" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">plan, validate, apply</text></g><g data-node="." data-anchor="."><rect x="64" y="448" width="216" height="56" rx="6" fill="#2d3142"/><rect x="64" y="448" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" strok