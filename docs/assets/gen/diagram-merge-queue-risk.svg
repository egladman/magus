<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1192" width="640" height="1192" role="img" aria-labelledby="merge-queue-risk-title merge-queue-risk-desc" class="magus-diagram"><metadata>{"figure":"merge-queue-risk","stamp":"sha256:6f3bc811852d5ff62c4034740f814d277030357960941708c0dd5de4c8617cdb"}</metadata><title id="merge-queue-risk-title">What a candidate's risk makes the queue run</title><desc id="merge-queue-risk-desc">For a conflicted file the queue asks the classifier which class the edit is and settles only a low-risk one, kicking code back, then gates the projects the magus SDK says the change reaches, or every project when that set is no proof.</desc><defs><marker id="merge-queue-risk-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="merge-queue-risk-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="merge-queue-risk-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MERGE QUEUE</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What a candidate's risk makes the queue run</text><g transform="translate(0,40)"><rect x="48" y="416" width="260" height="232" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="134" y="420" width="88" height="12" rx="2" fill="#2d3142"/><text x="178" y="429" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" l