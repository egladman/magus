<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 528" width="856" height="528" role="img" aria-labelledby="server-socket-title server-socket-desc" class="magus-diagram"><title id="server-socket-title">How a local command reaches the server</title><desc id="server-socket-desc">The magus CLI dispatches over a private unix domain socket into the concurrency pool, the workspace registry and the run registry; shared services go to the broker. Sharing a graph spawns a separate short-lived loopback server.</desc><defs><marker id="server-socket-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="server-socket-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="server-socket-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">How a local command reaches the server</text><g transform="translate(0,40)"><path d="M 248 216 L 264 216 Q 272 216 272 208 L 272 192 Q 272 184 280 184 L 320 184" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#server-socket-arrow-default)"/><path d="M 536 164 L 544 164 Q 552 164 552 156 L 552 104 Q 552 96 560 96 L 608 96" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#server-socket-arrow-default)"/><path d="M 536 176 L 608 176" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#server-socket-arrow-default)"/><path d="M 536 188 L 580 188 Q 588 188 588 196 L 588 264 Q 588 272 596 272 L 608 272" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#server-socket-arrow-default)"/><path d="M 536 200 L 564 200 Q 572 200 572 208 L 572 352 Q 572 360 580 360 L 608 360" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#server-socket-arrow-default)"/><path d="M 248 236 L 288 236 Q 296 236 296 244 L 296 264 Q 296 272 304 272 L 320 272" fill="none" stroke="#7b8495" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#server-socket-arrow-default)"/><rect x="246" y="178" width="52" height="12" rx="2" fill="#13171f"/><text x="272" y="187" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DISPATCH</text><rect x="276" y="230" width="40" height="12" rx="2" fill="#13171f"/><text x="296" y="239" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SPAWNS</text><rect x="32" y="196" width="216" height="64" rx="6" fill="#13171f"/><rect x="32" y="196" width="216" height="64" rx="6" fill="#13171f" stroke="#6b7383" stroke-width="1"/><rect x="40" y="204" width="40" height="12" rx="2" fill="none" stroke="#6b7383" stroke-width="0.8"/><text x="60" y="213" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SHELL</text><text x="140" y="236" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus CLI</text><text x="140" y="252" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">run, status, query</text><rect x="320" y="152" width="216" height="64" rx="6" fill="#13171f"/><rect x="320" y="152" width="216" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><rect x="328" y="160" width="28" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="342" y="169" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">IPC</text><text x="428" y="192" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Unix socket</text><text x="428" y="208" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">0700, internal/proc</text><rect x="608" y="64" width="216" height="64" rx="6" fill="#13171f"/><rect x="608" y="64" width="216" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="716" y="100" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Concurrency pool</text><rect x="608" y="152" width="216" height="64" rx="6" fill="#13171f"/><rect x="608" y="152" width="216" height="64" rx="6" fill="#13171f" stroke="#202632" stroke-width="1"/><text x="716" y="184" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace registry</text><text x="716" y="200" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">graph, SCIP, cache</text><rect x="608" y="240" width="216" height="64" rx="6" fill="#13171f"/><rect x="608" y="240" width="216" height="64" rx="6" fill="#13171f" stroke="#202632" stroke-width="1"/><text x="716" y="272" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Run registry</text><text x="716" y="288" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">live runs</text><rect x="608" y="328" width="216" height="64" rx="6" fill="#13171f"/><rect x="608" y="328" width="216" height="64" rx="6" fill="#13171f" stroke="#6b7383" stroke-width="1"/><text x="716" y="360" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Broker client</text><text x="716" y="376" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">shared services</text><rect x="320" y="240" width="216" height="64" rx="6" fill="#13171f"/><rect x="320" y="240" width="216" height="64" rx="6" fill="#1b1f29" stroke="#6b7383" stroke-width="1" stroke-dasharray="4,3"/><text x="428" y="272" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Loopback server</text><text x="428" y="288" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">graph export --open</text><line x1="32" y1="440" x2="824" y2="440" stroke="#202632" stroke-width="0.8"/><rect x="32" y="448" width="10" height="10" rx="2" fill="#13171f" stroke="#202632" stroke-width="0.8"/><text x="50" y="457" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">SHARED SERVER STATE</text><rect x="192" y="448" width="10" height="10" rx="2" fill="#1b1f29" stroke="#6b7383" stroke-width="0.8"/><text x="210" y="457" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">SPAWNED ON DEMAND</text></g></svg>