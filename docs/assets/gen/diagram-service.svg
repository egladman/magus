<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 576" width="856" height="576" role="img" aria-labelledby="service-title service-desc" class="magus-diagram"><metadata>{"figure":"service","stamp":"sha256:da9620e819bff9cfaeee0b612ae507a00f37938af84a9c6b59b30511de539ed0"}</metadata><title id="service-title">A service op is one long-running process with one identity</title><desc id="service-desc">A service op names a long-running process. internal/service starts it through the spawner and keeps the record of the run, keyed by an identity that survives a restart. The ward checks the op's argv against its declared kind before it runs, the audit finds a recorded service whose op is gone, and the host bindings and doctor read the same identity. The identity package holds the key and nothing else, so every reader agrees on what one service is.</desc><defs><marker id="service-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="service-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="service-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SERVICES</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">A service op is one long-running process with one identity</text><g transform="translate(0,40)"><path data-edge="internal/service->internal/service/identity" id="service-edge-internal_2fservice-internal_2fservice_2fidentity" d="M 428 144 L 428 100 Q 428 92 436 92 L 608 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#service-arrow-default)"/><path data-edge="internal/service->internal/proc/spawn" id="service-edge-internal_2fservice-internal_2fproc_2fspawn" d="M 536 172 L 608 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#service-arrow-default)"/><path data-edge="internal/interp/bindings->internal/service" id="service-edge-internal_2finterp_2fbindings-internal_2fservice" d="M 248 172 L 320 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#service-arrow-default)"/><path data-edge="internal/interp/bindings->internal/proc/spawn" id="service-edge-internal_2finterp_2fbindings-internal_2fproc_2fspawn" d="M 140 200 L 140 204 Q 140 212 148 212 L 564 212 Q 572 212 572 204 L 572 192 Q 572 184 580 184 L 608 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#service-arrow-default)"/><path data-edge="internal/doctor->internal/serviceaudit" id="service-edge-internal_2fdoctor-internal_2fserviceaudit" d="M 248 332 L 320 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#service-arrow-default)"/><g data-node="internal/service" data-anchor="internal/service"><rect x="320" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="428" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Service</text><text x="428" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">start, record, stop</text></g><g data-node="internal/service/identity" data-anchor="internal/service/identity"><rect x="608" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Identity</text><text x="716" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one key per service</text></g><g data-node="internal/proc/spawn" data-anchor="internal/proc/spawn"><rect x="608" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spawner</text><text x="716" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the process</text></g><g data-node="internal/ward" data-anchor="internal/ward"><rect x="32" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="384" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ward</text><text x="140" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">argv against kind</text></g><g data-node="internal/serviceaudit" data-anchor="internal/serviceaudit"><rect x="320" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Audit</text><text x="428" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">recorded, op gone</text></g><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="32" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host bindings</text><text x="140" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ops call it</text></g><g data-node="internal/doctor" data-anchor="internal/doctor"><rect x="32" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Doctor</text><text x="140" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">reports drift</text></g><line x1="32" y1="476" x2="824" y2="476" stroke="#505466" stroke-width="0.8"/><text x="32" y="490" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="496" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE RECORD</text></g></svg>