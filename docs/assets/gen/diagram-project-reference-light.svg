<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 544" width="1160" height="544" role="img" aria-labelledby="project-reference-title project-reference-desc" class="magus-diagram"><metadata>{"figure":"project-reference","stamp":"sha256:77aa7ddd2f2d28c0a5442970f0d62485f1b3cfa68996179f78aa256cf73a0924"}</metadata><title id="project-reference-title">Four spellings in, one reference out</title><desc id="project-reference-desc">magus accepts a workspace URL, a workspace-relative path, a dot-relative path or the bare root alias, and parses them all to one project reference. Human output prints the short path; machine output prints the workspace URL.</desc><defs><marker id="project-reference-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="project-reference-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="project-reference-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Four spellings in, one reference out</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="344" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="32" y="68" width="216" height="12" rx="2" fill="#f5f5f5"/><text x="140" y="77" fill="#5f6780" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">A