<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 544" width="1160" height="544" role="img" aria-labelledby="project-reference-title project-reference-desc" class="magus-diagram"><title id="project-reference-title">Four spellings in, one reference out</title><desc id="project-reference-desc">magus accepts a workspace URL, a workspace-relative path, a dot-relative path or the bare root alias, and parses them all to one project reference. Human output prints the short path; machine output prints the workspace URL.</desc><defs><marker id="project-reference-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="project-reference-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="project-reference-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Four spellings in, one reference out</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="344" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="32" y="68" width="216" height="12" rx="2" fill="#f5f5f5"/><text x="140" y="77" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ACCEPTED AS INPUT, INTERCHANGEABLE</text><path data-edge="rel->parse" d="M 248 204 L 268 204 Q 276 204 276 212 L 276 228 Q 276 236 284 236 L 320 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="dot->parse" d="M 248 284 L 268 284 Q 276 284 276 276 L 276 260 Q 276 252 284 252 L 320 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="url->parse" d="M 248 124 L 284 124 Q 292 124 292 132 L 292 216 Q 292 224 300 224 L 320 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="root->parse" d="M 248 364 L 284 364 Q 292 364 292 356 L 292 272 Q 292 264 300 264 L 320 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="parse->ref" d="M 536 244 L 608 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="ref->human" d="M 824 232 L 852 232 Q 860 232 860 224 L 860 172 Q 860 164 868 164 L 896 164" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><path data-edge="ref->machine" d="M 824 244 L 896 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#project-reference-arrow-default)"/><rect x="806" y="188" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="828" y="197" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PRINTED</text><rect x="838" y="222" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="860" y="231" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">-O JSON</text><g data-node="url"><rect x="32" y="96" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="96" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">workspace://pkg/api</text></g><g data-node="rel"><rect x="32" y="176" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="176" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="208" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">pkg/api</text></g><g data-node="dot"><rect x="32" y="256" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="256" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="288" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">./pkg/api</text></g><g data-node="root"><rect x="32" y="336" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="336" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="364" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">workspace://</text><text x="140" y="380" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the root alias</text></g><g data-node="parse"><rect x="320" y="208" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="320" y="208" width="216" height="72" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="328" y="216" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="346" y="225" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">STEP</text><text x="428" y="248" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">parse</text></g><g data-node="ref"><rect x="608" y="216" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="216" width="216" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="716" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">One reference</text><text x="716" y="260" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">path: pkg/api</text></g><g data-node="human"><rect x="896" y="136" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="136" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1004" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Human output</text><text x="1004" y="180" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">pkg/api</text></g><g data-node="machine"><rect x="896" y="216" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="216" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1004" y="244" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Machine output</text><text x="1004" y="260" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">workspace://pkg/api</text></g><line x1="32" y1="444" x2="1128" y2="444" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="458" fill="#4f5d75" font-size="8" font-family="var(