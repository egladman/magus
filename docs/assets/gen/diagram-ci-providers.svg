<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 512" width="1160" height="512" role="img" aria-labelledby="ci-providers-title ci-providers-desc" class="magus-diagram"><title id="ci-providers-title">Vendor syntax lives in the spell, never in the binary</title><desc id="ci-providers-desc">A failing project reaches the annotator contract, which speaks generic verbs to a provider spell; the spell translates them into the CI system's own syntax. Quote prefixes are declared once and applied per line in Go.</desc><defs><marker id="ci-providers-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="ci-providers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="ci-providers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">CI PROVIDERS</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Vendor syntax lives in the spell, never in the binary</text><g transform="translate(0,40)"><rect x="16" y="64" width="536" height="184" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="182" y="68" width="204" height="12" rx="2" fill="#2d3142"/><text x="284" y="77" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">MAGUS BINARY, NAMES NO CI SYSTEM</text><rect x="16" y="272" width="824" height="104" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="354" y="276" width="148" height="12" rx="2" fill="#2d3142"/><text x="428" y="285" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">PROVIDER SPELL, IN BUZZ</text><path data-edge="run->contract" d="M 248 164 L 264 164 Q 272 164 272 156 L 272 132 Q 272 124 280 124 L 320 124" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="contract->ops" d="M 536 124 L 576 124 Q 584 124 584 132 L 584 324 Q 584 332 592 332 L 608 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="ops->vendor" d="M 824 332 L 840 332 Q 848 332 848 324 L 848 236 Q 848 228 856 228 L 896 228" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="prefixes->quote" d="M 248 332 L 288 332 Q 296 332 296 324 L 296 212 Q 296 204 304 204 L 320 204" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="quote->vendor" d="M 536 204 L 552 204 Q 560 204 560 196 L 560 172 Q 560 164 568 164 L 864 164 Q 872 164 872 172 L 872 200 Q 872 208 880 208 L 896 208" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><rect x="594" y="220" width="76" height="12" rx="2" fill="#2d3142"/><text x="632" y="229" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GENERIC VERBS</text><rect x="858" y="272" width="76" height="12" rx="2" fill="#2d3142"/><text x="896" y="281" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VENDOR SYNTAX</text><rect x="306" y="260" width="56" height="12" rx="2" fill="#2d3142"/><text x="334" y="269" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ ONCE</text><rect x="688" y="142" width="56" height="12" rx="2" fill="#2d3142"/><text x="716" y="151" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DE-FANGED</text><g data-node="run"><rect x="32" y="136" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="136" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="140" y="164" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">run and cache</text><text x="140" y="180" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">a project failed</text></g><g data-node="contract" data-anchor="internal/ci"><rect x="320" y="96" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="96" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="124" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Annotator contract</text><text x="428" y="140" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">internal/ci/annotate</text></g><g data-node="quote" data-anchor="internal/ci"><rect x="320" y="176" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="176" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="204" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">QuoteWith</text><text x="428" y="220" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">per line, in Go</text></g><g data-node="ops"><rect x="608" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="716" y="332" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Provider ops</text><text x="716" y="348" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">group start, end, annotate</text></g><g data-node="prefixes"><rect x="32" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="140" y="332" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">quote_prefixes</text><text x="140" y="348" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">declared once</text></g><g data-node="vendor"><rect x="896" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="896" y="192" width="216" height="56" rx="6" fill="#2d3142" stroke="#8e98ac" stroke-width="1.2"/><text x="1004" y="220" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">CI system</text><text x="1004" y="236" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">job log, pull request</text></g><line x1="32" y1="412" x2="1128" y2="412" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="426" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="432" width="10" height="10" rx="2" fill="#2d3142" stroke="#8e98ac" stroke-width="0.8"/><text x="50" y="441" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>