<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 520" width="1144" height="520" role="img" aria-labelledby="cache-internals-title cache-internals-desc" class="magus-diagram"><metadata>{"figure":"cache-internals","stamp":"sha256:4306ac29e1049af82392cc4a054b7a13dd13e10da722d073cf8d054cdbca8754"}</metadata><title id="cache-internals-title">What a cache lookup reads, and what it writes back</title><desc id="cache-internals-desc">A lookup hashes a target's declared inputs, found by the change set, and asks the local store, then the remote tier over HTTP. A hit restores the outputs by copy-on-write clone where the filesystem has it. A miss runs the target through the spawner, records the run in the journal and, on a trusted branch, signs the entry with the secret and puts it. The job row decides which writes count as the run's own.</desc><defs><marker id="cache-internals-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="cache-internals-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="cache-internals-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">CACHE</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">What a cache lookup reads, and what it writes back</text><g transform="translate(0,40)"><path data-edge="internal/cache->internal/changeset" id="cache-internals-edge-internal_2fcache-internal_2fchangeset" d="M 140 204 L 140 100 Q 140 92 148 92 L 320 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><path data-edge="internal/cache->internal/cache/reflink" id="cache-internals-edge-internal_2fcache-internal_2fcache_2freflink" d="M 152 204 L 152 180 Q 152 172 160 172 L 320 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><path data-edge="internal/cache->internal/httpx" id="cache-internals-edge-internal_2fcache-internal_2fhttpx" d="M 248 252 L 320 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><path data-edge="internal/cache->internal/proc/spawn" id="cache-internals-edge-internal_2fcache-internal_2fproc_2fspawn" d="M 164 300 L 164 324 Q 164 332 172 332 L 320 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><path data-edge="internal/cache->group:Run records" id="cache-internals-edge-internal_2fcache-group_3aRun_20records" d="M 152 300 L 152 364 Q 152 372 160 372 L 564 372 Q 572 372 572 364 L 572 352 Q 572 344 580 344 L 608 344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><path data-edge="internal/cache->internal/secret" id="cache-internals-edge-internal_2fcache-internal_2fsecret" d="M 140 300 L 140 376 Q 140 384 148 384 L 852 384 Q 860 384 860 376 L 860 352 Q 860 344 868 344 L 896 344" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><path data-edge="internal/proc/spawn->group:Run records" id="cache-internals-edge-internal_2fproc_2fspawn-group_3aRun_20records" d="M 536 332 L 608 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><path data-edge="internal/proc/spawn->internal/secret" id="cache-internals-edge-internal_2fproc_2fspawn-internal_2fsecret" d="M 428 304 L 428 300 Q 428 292 436 292 L 852 292 Q 860 292 860 300 L 860 312 Q 860 320 868 320 L 896 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><path data-edge="group:Run records->internal/secret" id="cache-internals-edge-group_3aRun_20records-internal_2fsecret" d="M 824 332 L 896 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-internals-arrow-default)"/><g data-node="internal/cache" data-anchor="internal/cache"><rect x="32" y="204" width="216" height="96" rx="6" fill="#2d3142"/><rect x="32" y="204" width="216" height="96" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="140" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cache</text><text x="140" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">key, restore, store</text></g><g data-node="internal/changeset" data-anchor="internal/changeset"><rect x="320" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Change set</text><text x="428" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">declared inputs, diffed</text></g><g data-node="internal/cache/reflink" data-anchor="internal/cache/reflink"><rect x="320" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Reflink restore</text><text x="428" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">copy-on-write clones</text></g><g data-node="internal/httpx" data-anchor="internal/httpx"><rect x="320" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Remote tier</text><text x="428" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">HTTP client</text></g><g data-node="internal/proc/spawn" data-anchor="internal/proc/spawn"><rect x="320" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spawner</text><text x="428" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">runs a miss</text></g><g data-node="group:Run records"><rect x="608" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="304" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="716" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Run records</text><text x="716" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">whose writes, what ran</text></g><g data-node="internal/secret" data-anchor="internal/secret"><rect x="896" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="896" y="304" width="216" height="56" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="1004" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Signing key</text><text x="1004" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sign and verify</text></g><line x1="32" y1="420" x2="1112" y2="420" stroke="#505466" stroke-width="0.8"/><text x="32" y="434" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="440" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="449" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE LOOKUP</text><rect x="192" y="440" width="10" height="10" rx="2" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="449" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">TRUSTED RUNS ONLY</text><rect x="352" y="440" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="370" y="449" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>