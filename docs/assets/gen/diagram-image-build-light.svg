<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 352" width="1144" height="352" role="img" aria-labelledby="image-build-title image-build-desc" class="magus-diagram"><title id="image-build-title">What a bare run pushes, and what each channel adds</title><desc id="image-build-desc">Without the cd charm an image-build loads locally and pushes nothing. With it, the channel decides: the default commit channel adds one immutable tag to one registry, and only stable moves the floating latest tag.</desc><defs><marker id="image-build-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="image-build-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="image-build-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">RECOMMENDATIONS</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What a bare run pushes, and what each channel adds</text><g transform="translate(0,40)"><path data-edge="run->cd" d="M 248 172 L 320 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="cd->local" d="M 428 144 L 428 140 Q 428 132 436 132 L 608 132" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="cd->channel" d="M 536 172 L 564 172 Q 572 172 572 180 L 572 204 Q 572 212 580 212 L 608 212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="channel->commit" d="M 716 184 L 716 180 Q 716 172 724 172 L 840 172 Q 848 172 848 164 L 848 100 Q 848 92 856 92 L 896 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="channel->unstable" d="M 824 212 L 864 212 Q 872 212 872 204 L 872 180 Q 872 172 880 172 L 896 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="channel->stable" d="M 716 240 L 716 244 Q 716 252 724 252 L 896 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><rect x="506" y="110" width="20" height="12" rx="2" fill="#f5f5f5"/><text x="516" y="119" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="540" y="150" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="552" y="159" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="850" y="70" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="872" y="79" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DEFAULT</text><rect x="822" y="190" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="848" y="199" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">UNSTABLE</text><rect x="784" y="230" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="804" y="239" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">STABLE</text><g data-node="run"><rect x="32" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="216" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="140" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus run image-build</text></g><g data-node="cd"><polygon points="428,144 536,172 428,200 320,172" fill="#f5f5f5"/><polygon points="428,144 536,172 428,200 320,172" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="176" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">cd?</text></g><g data-node="local"><rect x="608" y="104" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="104" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="716" y="132" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Load locally</text><text x="716" y="148" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">pushes nothing</text></g><g data-node="channel"><polygon points="716,184 824,212 716,240 608,212" fill="#f5f5f5"/><polygon points="716,184 824,212 716,240 608,212" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="716" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">channel</text></g><g data-node="commit"><rect x="896" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1004" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Commit</text><text x="1004" y="108" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">ghcr, tagged by hash</text></g><g data-node="unstable"><rect x="896" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1004" y="172" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Prerelease</text><text x="1004" y="188" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">no floating tag</text></g><g data-node="stable"><rect x="896" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1004" y="252" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Release</text><text x="1004" y="268" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">version and latest</text></g></g></svg>