<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="image-build-title image-build-desc" class="magus-diagram"><title id="image-build-title">What a bare run pushes, and what each channel adds</title><desc id="image-build-desc">Without the cd charm an image-build loads locally and pushes nothing. With it, the channel decides: the default commit channel adds one immutable tag to one registry, and only stable moves the floating latest tag.</desc><defs><marker id="image-build-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="image-build-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="image-build-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">RECOMMENDATIONS</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What a bare run pushes, and what each channel adds</text><g transform="translate(0,40)"><path d="M 192 260 L 256 260" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 328 224 L 328 204 Q 328 196 336 196 L 572 196 Q 580 196 580 188 L 580 168" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 400 260 L 560 260" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 632 224 L 632 204 Q 632 196 640 196 L 856 196 Q 864 196 864 188 L 864 168" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 704 260 L 784 260" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 632 296 L 632 316 Q 632 324 640 324 L 856 324 Q 864 324 864 332 L 864 352" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><rect x="442" y="174" width="20" height="12" rx="2" fill="#ffffff"/><text x="452" y="183" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="468" y="238" width="24" height="12" rx="2" fill="#ffffff"/><text x="480" y="247" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="726" y="174" width="44" height="12" rx="2" fill="#ffffff"/><text x="748" y="183" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DEFAULT</text><rect x="718" y="238" width="52" height="12" rx="2" fill="#ffffff"/><text x="744" y="247" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">UNSTABLE</text><rect x="728" y="302" width="40" height="12" rx="2" fill="#ffffff"/><text x="748" y="311" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">STABLE</text><rect x="32" y="232" width="160" height="56" rx="6" fill="#ffffff"/><rect x="32" y="232" width="160" height="56" rx="6" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="1"/><text x="112" y="264" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus run image-build</text><polygon points="328,224 400,260 328,296 256,260" fill="#ffffff"/><polygon points="328,224 400,260 328,296 256,260" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="328" y="264" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">cd?</text><rect x="480" y="104" width="200" height="64" rx="6" fill="#ffffff"/><rect x="480" y="104" width="200" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="580" y="136" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Load locally</text><text x="580" y="152" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">pushes nothing</text><polygon points="632,224 704,260 632,296 560,260" fill="#ffffff"/><polygon points="632,224 704,260 632,296 560,260" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="632" y="264" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">channel</text><rect x="784" y="104" width="160" height="64" rx="6" fill="#ffffff"/><rect x="784" y="104" width="160" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="864" y="136" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Commit</text><text x="864" y="152" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">ghcr, tagged by hash</text><rect x="784" y="228" width="160" height="64" rx="6" fill="#ffffff"/><rect x="784" y="228" width="160" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="864" y="260" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Prerelease</text><text x="864" y="276" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">no floating tag</text><rect x="784" y="352" width="160" height="64" rx="6" fill="#ffffff"/><rect x="784" y="352" width="160" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="864" y="384" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Release</text><text x="864" y="400" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">version and latest</text></g></svg>