<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 352" width="1144" height="352" role="img" aria-labelledby="image-build-title image-build-desc" class="magus-diagram"><title id="image-build-title">What a bare run pushes, and what each channel adds</title><desc id="image-build-desc">Without the cd charm an image-build loads locally and pushes nothing. With it, the channel decides: the default commit channel adds one immutable tag to one registry, and only stable moves the floating latest tag.</desc><defs><marker id="image-build-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="image-build-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="image-build-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">RECOMMENDATIONS</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What a bare run pushes, and what each channel adds</text><g transform="translate(0,40)"><path d="M 248 172 L 320 172" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 428 144 L 428 140 Q 428 132 436 132 L 608 132" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 536 172 L 564 172 Q 572 172 572 180 L 572 204 Q 572 212 580 212 L 608 212" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 716 184 L 716 180 Q 716 172 724 172 L 840 172 Q 848 172 848 164 L 848 100 Q 848 92 856 92 L 896 92" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 824 212 L 864 212 Q 872 212 872 204 L 872 180 Q 872 172 880 172 L 896 172" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><path d="M 716 240 L 716 244 Q 716 252 724 252 L 896 252" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#image-build-arrow-default)"/><rect x="506" y="110" width="20" height="12" rx="2" fill="#ffffff"/><text x="516" y="119" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="560" y="170" width="24" height="12" rx="2" fill="#ffffff"/><text x="572" y="179" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="758" y="150" width="44" height="12" rx="2" fill="#ffffff"/><text x="780" y="159" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DEFAULT</text><rect x="846" y="170" width="52" height="12" rx="2" fill="#ffffff"/><text x="872" y="179" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">UNSTABLE</text><rect x="784" y="230" width="40" height="12" rx="2" fill="#ffffff"/><text x="804" y="239" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">STABLE</text><rect x="32" y="144" width="216" height="56" rx="6" fill="#ffffff"/><rect x="32" y="144" width="216" height="56" rx="6" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="1"/><text x="140" y="176" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus run image-build</text><polygon points="428,144 536,172 428,200 320,172" fill="#ffffff"/><polygon points="428,144 536,172 428,200 320,172" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="428" y="176" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">cd?</text><rect x="608" y="104" width="216" height="56" rx="6" fill="#ffffff"/><rect x="608" y="104" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="716" y="132" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Load locally</text><text x="716" y="148" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">pushes nothing</text><polygon points="716,184 824,212 716,240 608,212" fill="#ffffff"/><polygon points="716,184 824,212 716,240 608,212" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="716" y="216" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">channel</text><rect x="896" y="64" width="216" height="56" rx="6" fill="#ffffff"/><rect x="896" y="64" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="1004" y="92" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Commit</text><text x="1004" y="108" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">ghcr, tagged by hash</text><rect x="896" y="144" width="216" height="56" rx="6" fill="#ffffff"/><rect x="896" y="144" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="1004" y="172" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Prerelease</text><text x="1004" y="188" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">no floating tag</text><rect x="896" y="224" width="216" height="56" rx="6" fill="#ffffff"/><rect x="896" y="224" width="216" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="1004" y="252" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Release</text><text x="1004" y="268" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">version and latest</text></g></svg>