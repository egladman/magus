<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 608" width="1144" height="608" role="img" aria-labelledby="job-records-title job-records-desc" class="magus-diagram"><metadata>{"figure":"job-records","stamp":"sha256:b79646dbe5adb1687ec437c0fb582ab8af207dbaace4a87d431371eb2fcf18a2"}</metadata><title id="job-records-title">A job row is one record, and four packages read it</title><desc id="job-records-desc">The job store keeps one row per job in a JSON Lines file: its goal, checkpoint, write paths and leases. describe renders the spec an agent reads, the forecast sizes the checks, and the queue types record a landed job. The guard judges calls against the row, and the sandbox narrows writes to it.</desc><defs><marker id="job-records-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="job-records-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="job-records-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">JOB</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">A job row is one record, and four packages read it</text><g transform="translate(0,40)"><path data-edge="internal/job->internal/store/migrate" id="job-records-edge-internal_2fjob-internal_2fstore_2fmigrate" d="M 428 364 L 428 100 Q 428 92 436 92 L 608 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/describe" id="job-records-edge-internal_2fjob-internal_2fdescribe" d="M 440 364 L 440 180 Q 440 172 448 172 L 608 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/ci/forecast" id="job-records-edge-internal_2fjob-internal_2fci_2fforecast" d="M 536 412 L 608 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/queue/types" id="job-records-edge-internal_2fjob-internal_2fqueue_2ftypes" d="M 452 364 L 452 260 Q 452 252 460 252 L 608 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/sessions" id="job-records-edge-internal_2fjob-internal_2fsessions" d="M 464 364 L 464 340 Q 464 332 472 332 L 608 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/recorder" id="job-records-edge-internal_2fjob-internal_2frecorder" d="M 536 400 L 564 400 Q 572 400 572 392 L 572 380 Q 572 372 580 372 L 852 372 Q 860 372 860 364 L 860 352 Q 860 344 868 344 L 896 344" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/sessions->internal/recorder" id="job-records-edge-internal_2fsessions-internal_2frecorder" d="M 824 332 L 896 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/guard->internal/job" id="job-records-edge-internal_2fguard-internal_2fjob" d="M 248 412 L 320 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/guard->internal/ci/forecast" id="job-records-edge-internal_2fguard-internal_2fci_2fforecast" d="M 140 440 L 140 464 Q 140 472 148 472 L 564 472 Q 572 472 572 464 L 572 432 Q 572 424 580 424 L 608 424" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/sandbox->internal/job" id="job-records-edge-internal_2fsandbox-internal_2fjob" d="M 248 332 L 276 332 Q 284 332 284 340 L 284 392 Q 284 400 292 400 L 320 400" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><rect x="266" y="422" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="284" y="431" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="294" y="340" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="326" y="349" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITE GRANT</text><g data-node="internal/job" data-anchor="internal/job"><rect x="320" y="364" width="216" height="96" rx="6" fill="#f5f5f5"/><rect x="320" y="364" width="216" height="96" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="428" y="412" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="428" y="428" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">rows and leases</text></g><g data-node="internal/store/migrate" data-anchor="internal/store/migrate"><rect x="608" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Row migrations</text><text x="716" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">old rows upgrade on read</text></g><g data-node="internal/describe" data-anchor="internal/describe"><rect x="608" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">describe job</text><text x="716" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the spec an agent reads</text></g><g data-node="internal/ci/forecast" data-anchor="internal/ci/forecast"><rect x="608" y="384" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="384" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="412" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Check forecast</text><text x="716" y="428" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what verifies the row</text></g><g data-node="internal/queue/types" data-anchor="internal/queue/types"><rect x="608" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Queue records</text><text x="716" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">a landed job</text></g><g data-node="internal/sessions" data-anchor="internal/sessions"><rect x="608" y="304" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="304" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="332" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Session record</text><text x="716" y="348" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">who held the lease</text></g><g data-node="internal/recorder" data-anchor="internal/recorder"><rect x="896" y="304" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="304" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="1004" y="332" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Activity log</text><text x="1004" y="348" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what it did</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="32" y="384" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="384" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="412" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="140" y="428" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">judges against the row</text></g><g data-node="internal/sandbox" data-anchor="internal/sandbox"><rect x="32" y="304" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="332" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sandbox</text><text x="140" y="348" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write grant from the row</text></g><line x1="32" y1="508" x2="1112" y2="508" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="522" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="528" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="537" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE RECORD</text><rect x="192" y="528" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="537" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>