<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 440" width="1144" height="440" role="img" aria-labelledby="server-share-title server-share-desc" class="magus-diagram"><title id="server-share-title">The only listener a second machine can reach</title><desc id="server-share-desc">Sharing from the dashboard posts to a loopback-only endpoint, which mints a time-boxed read-only token and opens an ephemeral LAN listener. The listener serves four JSON read routes and the read Connect services, and nothing else: the graph, the diff routes, the derived plan, the job store, /mcp and job control stay loopback only.</desc><defs><marker id="server-share-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="server-share-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="server-share-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The only listener a second machine can reach</text><g transform="translate(0,40)"><path data-edge="dash->sharep" d="M 248 96 L 288 96 Q 296 96 296 104 L 296 132 Q 296 140 304 140 L 320 140" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="sharep->lan" d="M 536 140 L 576 140 Q 584 140 584 148 L 584 164 Q 584 172 592 172 L 608 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="phone->lan" d="M 248 184 L 264 184 Q 272 184 272 192 L 272 220 Q 272 228 280 228 L 552 228 Q 560 228 560 220 L 560 200 Q 560 192 568 192 L 608 192" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#server-share-arrow-accent)"/><path data-edge="lan->served" d="M 824 172 L 840 172 Q 848 172 848 164 L 848 148 Q 848 140 856 140 L 896 140" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="lan->connectreads" d="M 824 192 L 864 192 Q 872 192 872 200 L 872 220 Q 872 228 880 228 L 896 228" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><rect x="254" y="74" width="36" height="12" rx="2" fill="#2d3142"/><text x="272" y="83" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SHARE</text><rect x="528" y="118" width="64" height="12" rx="2" fill="#2d3142"/><text x="560" y="127" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MINTS TOKEN</text><rect x="388" y="206" width="56" height="12" rx="2" fill="#2d3142"/><text x="416" y="215" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text><rect x="852" y="118" width="40" height="12" rx="2" fill="#2d3142"/><text x="872" y="127" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SERVES</text><rect x="828" y="170" width="40" height="12" rx="2" fill="#2d3142"/><text x="848" y="179" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SERVES</text><g data-node="dash"><rect x="32" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="40" y="72" width="28" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="54" y="81" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PWA</text><text x="140" y="104" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Console</text><text x="140" y="120" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">dashboard</text></g><g data-node="sharep" data-anchor="internal/share"><rect x="320" y="108" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="108" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="328" y="116" width="40" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="348" y="125" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROUTE</text><text x="428" y="148" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1/share</text><text x="428" y="164" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">loopback + bearer</text></g><g data-node="lan" data-anchor="internal/share"><rect x="608" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="152" width="216" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><rect x="616" y="160" width="64" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="648" y="169" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">EPHEMERAL</text><text x="716" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">LAN listener</text><text x="716" y="208" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">15m, read-only token</text></g><g data-node="phone"><rect x="32" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="152" width="216" height="64" rx="6" fill="#2d3142" stroke="#8e98ac" stroke-width="1.2"/><rect x="40" y="160" width="48" height="12" rx="2" fill="none" stroke="#8e98ac" stroke-width="0.8"/><text x="64" y="169" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Phone on the LAN</text><text x="140" y="208" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">same-origin viewer</text></g><g data-node="served" data-anchor="internal/handler/viewer"><rect x="896" y="108" width="216" height="64" rx="6" fill="#2d3142"/><rect x="896" y="108" width="216" height="64" rx="6" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1004" y="140" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Shared read routes</text><text x="1004" y="156" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">events, insight, outputs, output</text></g><g data-node="connectreads" data-anchor="internal/handler/status"><rect x="896" y="196" width="216" height="64" rx="6" fill="#2d3142"/><rect x="896" y="196" width="216" height="64" rx="6" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1004" y="228" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Shared Connect reads</text><text x="1004" y="244" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">status, activity, metrics, insight</text></g><g data-node="withheld" data-anchor="internal/handler/graph"><rect x="32" y="240" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="240" width="216" height="64" rx="6" fill="#393e53" stroke="#8e98ac" stroke-width="1.2" stroke-dasharray="4,3"/><text x="140" y="272" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Never on a share</text><text x="140" y="288" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">graph, diff, plan, job, /mcp</text></g><line x1="32" y1="340" x2="1112" y2="340" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="354" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="360" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="369" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">REACHABLE OFF-MACHINE</text><rect x="192" y="360" width="10" height="10" rx="2" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="210" y="369" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">SERVED ON A SHARE</text><rect x="352" y="360" width="10" height="10" rx="2" fill="#393e53" stroke="#8e98ac" stroke-width="0.8"/><text x="370" y="369" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LOOPBACK ONLY</text></g></svg>