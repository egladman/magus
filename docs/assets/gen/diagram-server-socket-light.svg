<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 364" width="1144" height="364" role="img" aria-labelledby="server-socket-title server-socket-desc" class="magus-diagram"><metadata>{"figure":"server-socket","stamp":"sha256:67aa88540f5cc96ddb6c4a6b5ae70178835cf7548e67dbee4ad59ca06eeef595"}</metadata><title id="server-socket-title">A local command reaches the server over one private socket</title><desc id="server-socket-desc">The magus CLI dispatches over a private unix domain socket to the server, which holds the concurrency pool, the workspace and run registries and the broker for shared services. Sharing a graph spawns a separate short-lived loopback server.</desc><defs><marker id="server-socket-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="server-socket-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="server-socket-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">A local command reaches the server over one private socket</text><g transform="translate(0,40)"><path data-edge="external:You->cmd/magus" id="server-socket-edge-external_3aYou-cmd_2fmagus" d="M 248 184 L 320 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><path data-edge="cmd/magus->internal/proc" id="server-socket-edge-cmd_2fmagus-internal_2fproc" d="M 428 216 L 428 220 Q 428 228 436 228 L 852 228 Q 860 228 860 220 L 860 204 Q 860 196 868 196 L 896 196" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><path data-edge="cmd/magus->internal/server" id="server-socket-edge-cmd_2fmagus-internal_2fserver" d="M 536 184 L 608 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><path data-edge="internal/server->internal/proc" id="server-socket-edge-internal_2fserver-internal_2fproc" d="M 824 184 L 896 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><path data-edge="internal/server->internal/share" id="server-socket-edge-internal_2fserver-internal_2fshare" d="M 716 152 L 716 104 Q 716 96 724 96 L 896 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-socket-arrow-default)"/><g data-node="external:You"><rect x="32" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="152" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><rect x="40" y="160" width="40" height="12" rx="2" fill="none" stroke="#5f6780" stroke-width="0.8"/><text x="60" y="169" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SHELL</text><text x="140" y="192" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">You</text><text x="140" y="208" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">run, status, query</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="320" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="184" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus CLI</text><text x="428" y="200" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">dispatches every command</text></g><g data-node="internal/proc" data-anchor="internal/proc"><rect x="896" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="896" y="152" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><rect x="904" y="160" width="28" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/><text x="918" y="169" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">IPC</text><text x="1004" y="192" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Unix socket</text><text x="1004" y="208" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">0700, internal/proc</text></g><g data-node="internal/server" data-anchor="internal/server"><rect x="608" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="608" y="152" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="184" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Server</text><text x="716" y="200" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">pool, registries, broker</text></g><g data-node="internal/share" data-anchor="internal/share"><rect x="896" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="896" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#5f6780" stroke-width="1.2" stroke-dasharray="4,3"/><text x="1004" y="96" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Loopback server</text><text x="1004" y="112" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">graph export --open</text></g><line x1="32" y1="264" x2="1112" y2="264" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="278" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="284" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="50" y="293" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">SHARED SERVER STATE</text><rect x="192" y="284" width="10" height="10" rx="2" fill="#ffffff" stroke="#5f6780" stroke-width="0.8"/><text x="210" y="293" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">SPAWNED ON DEMAND</text></g></svg>