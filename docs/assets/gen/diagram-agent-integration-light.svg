<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1752 472" width="1752" height="472" role="img" aria-labelledby="agent-integration-title agent-integration-desc" class="magus-diagram"><metadata>{"figure":"agent-integration","stamp":"sha256:66769d7a450fb0417577b864f82af131a16855c1964ee50efc8ff136940b2050"}</metadata><title id="agent-integration-title">What an agent host gets, and the gate every call crosses</title><desc id="agent-integration-desc">magus agent install writes the skills and the AGENTS.md block, and the harness spell for the host prints the hook entry a person merges into the host's config. From then on the host runs the guard's PreToolUse hook before every shell command, file edit and magus MCP call, and only an allowed call runs. The guard reads the job store for the lease the call acts as. The harness sits in the same Go module as the task runner: the guard, the job store and the MCP tools import the graph the targets declare, not a layer above it. Skills, guard verdicts and MCP replies all name commands through internal/hint, so a renamed command cannot leave one of them pointing at nothing.</desc><defs><marker id="agent-integration-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="agent-integration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="agent-integration-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">What an agent host gets, and the gate every call crosses</text><g transform="translate(0,40)"><rect x="16" y="80" width="552" height="256" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="208" y="84" width="168" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="93" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">INSTALLED BEFORE A SESSION</text><rect x="896" y="80" width="824" height="256" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="1264" y="84" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="1308" y="93" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ON EVERY CALL</text><path data-edge="internal/agent->external:Skills" id="agent-integration-edge-internal_2fagent-external_3aSkills" d="M 248 200 L 336 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="external:Skills->external:Agent host" id="agent-integration-edge-external_3aSkills-external_3aAgent_20host" d="M 552 200 L 580 200 Q 588 200 588 208 L 588 228 Q 588 236 596 236 L 624 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="external:Harness spells->external:Agent host" id="agent-integration-edge-external_3aHarness_20spells-external_3aAgent_20host" d="M 248 288 L 580 288 Q 588 288 588 280 L 588 260 Q 588 252 596 252 L 624 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="external:Agent host->internal/guard" id="agent-integration-edge-external_3aAgent_20host-internal_2fguard" d="M 732 212 L 732 164 Q 732 156 740 156 L 912 156" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#agent-integration-arrow-accent)"/><path data-edge="external:Agent host->group:MCP tools" id="agent-integration-edge-external_3aAgent_20host-group_3aMCP_20tools" d="M 840 244 L 912 244" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/guard->internal/agent" id="agent-integration-edge-internal_2fguard-internal_2fagent" d="M 1008 124 L 1008 72 Q 1008 64 1000 64 L 148 64 Q 140 64 140 72 L 140 168" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/guard->internal/job" id="agent-integration-edge-internal_2fguard-internal_2fjob" d="M 1128 156 L 1200 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/guard->internal/hint" id="agent-integration-edge-internal_2fguard-internal_2fhint" d="M 1020 124 L 1020 120 Q 1020 112 1028 112 L 1444 112 Q 1452 112 1452 120 L 1452 136 Q 1452 144 1460 144 L 1488 144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/job->internal/hint" id="agent-integration-edge-internal_2fjob-internal_2fhint" d="M 1416 156 L 1488 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="group:MCP tools->internal/job" id="agent-integration-edge-group_3aMCP_20tools-internal_2fjob" d="M 1128 232 L 1156 232 Q 1164 232 1164 224 L 1164 176 Q 1164 168 1172 168 L 1200 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="group:MCP tools->internal/hint" id="agent-integration-edge-group_3aMCP_20tools-internal_2fhint" d="M 1128 244 L 1444 244 Q 1452 244 1452 236 L 1452 176 Q 1452 168 1460 168 L 1488 168" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><rect x="254" y="178" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="187" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">AGENT INSTALL</text><rect x="562" y="178" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="584" y="187" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ BY</text><rect x="376" y="266" width="80" height="12" rx="2" fill="#f5f5f5"/><text x="416" y="275" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">HOOKS TO MERGE</text><rect x="790" y="134" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="820" y="143" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><rect x="846" y="222" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="876" y="231" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">IF ALLOWED</text><rect x="1146" y="134" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="1164" y="143" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="1200" y="90" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="1236" y="99" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DENIAL HINTS</text><rect x="1256" y="222" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="1288" y="231" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NEXT FIELDS</text><g data-node="internal/agent" data-anchor="internal/agent"><rect x="32" y="168" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="168" width=