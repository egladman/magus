middle">Agent host</text><text x="732" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, Codex, Cursor, OpenCode</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="912" y="124" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="912" y="124" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><rect x="920" y="132" width="36" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/><text x="938" y="141" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">GATE</text><text x="1020" y="164" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="1020" y="180" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">deny, advise, ask</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="1200" y="124" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="1200" y="124" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="1308" y="156" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="1308" y="172" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the lease a call acts as</text></g><g data-node="group:MCP tools"><rect x="912" y="212" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="912" y="212" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="1020" y="244" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">MCP tools</text><text x="1020" y="260" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">./magus mcp or /mcp</text></g><g data-node="internal/hint" data-anchor="internal/hint"><rect x="1488" y="124" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="1488" y="124" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="1596" y="156" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Hints</text><text x="1596" y="172" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">commands, next fields</text></g><line x1="32" y1="372" x2="1720" y2="372" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="386" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="392" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="401" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE GATE</text><rect x="192" y="392" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="401" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECLARED LEASES</text><rect x="352" y="392" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#5f6780" stroke-width="0.8"/><text x="370" y="401" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>