zz/ast" id="buzz-packages-edge-libs_2fgopherbuzz_2fvm-libs_2fgopherbuzz_2fast" d="M 536 252 L 608 252" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-packages-arrow-default)"/><a href="#diagram-buzz-compile" data-node="libs/gopherbuzz" data-anchor="libs/gopherbuzz" data-drill="buzz-compile"><g><rect x="32" y="136" width="216" height="72" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="136" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="140" y="172" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Session</text><text x="140" y="188" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">parse, import, check, compile</text></g></a><g data-node="libs/gopherbuzz/token" data-anchor="libs/gopherbuzz/token"><rect x="320" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="428" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Lexer</text><text x="428" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">token.Tokenize</text></g><g data-node="libs/gopherbuzz/ast" data-anchor="libs/gopherbuzz/ast"><rect x="608" y="224" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="716" y="252" fill="#2d3142" font-family="sans-se