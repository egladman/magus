<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1432 336" width="1432" height="336" role="img" aria-labelledby="oci-assembly-title oci-assembly-desc" class="magus-diagram"><metadata>{"figure":"oci-assembly","stamp":"sha256:72c651ecb7268779dc789ce21b92b29782ddf3064abe1a21241c12f5a454096c"}</metadata><title id="oci-assembly-title">OCI assembly: files in, a layout out, a registry after</title><desc id="oci-assembly-desc">Built files and an optional digest-pinned base reach libs/image through the image host module. libs/image assembles each layer, stages one layout per platform, combines the layouts into an index and attaches referrers, cloning files copy-on-write where the filesystem has it. libs/oci is the registry client: it resolves the base by digest and publishes the result.</desc><defs><marker id="oci-assembly-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="oci-assembly-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="oci-assembly-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">IMAGES</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">OCI assembly: files in, a layout out, a registry after</text><g transform="translate(0,40)"><path data-edge="external:Built files->std" id="oci-assembly-edge-external_3aBuilt_20files-std" d="M 248 92 L 320 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="external:Pinned base->libs/oci" id="oci-assembly-edge-external_3aPinned_20base-libs_2foci" d="M 248 172 L 852 172 Q 860 172 860 164 L 860 152 Q 860 144 868 144 L 896 144" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="std->libs/image" id="oci-assembly-edge-std-libs_2fimage" d="M 536 92 L 608 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="std->libs/oci" id="oci-assembly-edge-std-libs_2foci" d="M 428 120 L 428 124 Q 428 132 436 132 L 896 132" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="libs/image->libs/oci" id="oci-assembly-edge-libs_2fimage-libs_2foci" d="M 824 92 L 852 92 Q 860 92 860 100 L 860 112 Q 860 120 868 120 L 896 120" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="libs/oci->external:Registry" id="oci-assembly-edge-libs_2foci-external_3aRegistry" d="M 1112 132 L 1184 132" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><rect x="524" y="150" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="552" y="159" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BY DIGEST</text><rect x="1126" y="110" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="1148" y="119" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text><g data-node="external:Built files"><rect x="32" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="96" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Built files</text></g><g data-node="external:Pinned base"><rect x="32" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#5f6780" stroke-width="1.2" stroke-dasharray="4,3"/><text x="140" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pinned base</text><text x="140" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">optional, by digest</text></g><g data-node="std" data-anchor="std"><rect x="320" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">image module</text><text x="428" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write, index, publish</text></g><g data-node="libs/image" data-anchor="libs/image"><rect x="608" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="64" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="716" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Layout assembly</text><text x="716" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">layers, platforms, index</text></g><g data-node="libs/oci" data-anchor="libs/oci"><rect x="896" y="104" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="104" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="1004" y="132" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Registry client</text><text x="1004" y="148" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">resolve, push, referrers</text></g><g data-node