<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 768" width="812" height="768" role="img" aria-labelledby="oci-assembly-title oci-assembly-desc" class="magus-diagram"><metadata>{"diagram":"oci-assembly","stamp":"sha256:e5d4d92a8505af25995d9d9f8a28ae1b492a7e8bd44ea886c33f1c18d8887830"}</metadata><title id="oci-assembly-title">Assembly stays on disk; only the registry client talks to a registry</title><desc id="oci-assembly-desc">Built files and an optional digest-pinned base reach libs/image through the image host module. libs/image assembles each layer, stages one layout per platform, combines the layouts into an index and attaches referrers, cloning files copy-on-write where the filesystem has it. libs/oci is the registry client: it resolves the base by digest and publishes the result.</desc><defs><marker id="oci-assembly-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="oci-assembly-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="oci-assembly-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">IMAGES</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">Assembly stays on disk; only the registry client talks to a registry</text><g transform="translate(0,40)"><path data-edge="external:Built files->std" id="oci-assembly-edge-external_3aBuilt_20files-std" d="M 140 120 L 140 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="external:Pinned base->libs/oci" id="oci-assembly-edge-external_3aPinned_20base-libs_2foci" d="M 380 120 L 380 404 Q 380 412 372 412 L 280 412 Q 272 412 272 420 L 272 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="std->libs/image" id="oci-assembly-edge-std-libs_2fimage" d="M 140 248 L 140 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="std->libs/oci" id="oci-assembly-edge-std-libs_2foci" d="M 248 220 L 252 220 Q 260 220 260 228 L 260 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="libs/image->libs/oci" id="oci-assembly-edge-libs_2fimage-libs_2foci" d="M 140 376 L 140 404 Q 140 412 148 412 L 240 412 Q 248 412 248 420 L 248 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="libs/oci->external:Registry" id="oci-assembly-edge-libs_2foci-external_3aRegistry" d="M 260 504 L 260 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><rect x="296" y="390" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="324" y="399" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BY DIGEST</text><rect x="270" y="532" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="541" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text><g data-node="external:Built files"><rect x="32" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="96" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Built files</text></g><g data-node="external:Pinned base"><rect x="272" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#5f6780" stroke-width="1.2" stroke-dasharray="4,3"/><text x="380" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Pinned base</text><text x="380" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">optional, by digest</text></g><g data-node="std" data-anchor="std"><rect x="32" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="220" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">image module</text><text x="140" y="236" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write, index, publish</text></g><g data-node="libs/image" data-anchor="libs/image"><rect x="32" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="320" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="140" y="348" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Layout assembly</text><text x="140" y="364" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">layers, platforms, index</text></g><g data-node="libs/oci" data-anchor="libs/oci"><rect x="152" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="152" y="448" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="260" y="476" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Registry client</text><text x="260" y="492" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">resolve, push, referrers</text></g><g data-node="external:Registry"><rect x="152" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="152" y="576" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="260" y="608" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Registry</text></g><line x1="32" y1="668" x2="780" y2="668" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="682" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="688" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="697" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHERE LAYERS ARE BUILT</text><rect x="192" y="688" width="10" height="10" rx="2" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="697" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT MAGUS BUILT</text><rect x="352" y="688" width="10" height="10" rx="2" fill="#ffffff" stroke="#5f6780" stroke-width="0.8"/><text x="370" y="697" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OPTIONAL</text><rect x="512" y="688" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="530" y="697" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>