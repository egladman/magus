<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 568 592" width="568" height="592" role="img" aria-labelledby="ci-pipeline-title ci-pipeline-desc" class="magus-diagram"><title id="ci-pipeline-title">ci declares steps, not an order</title><desc id="ci-pipeline-desc">A ci target names its steps in a single needs call, so they are independent and run in parallel. Order comes from edges the steps themselves declare, such as test depending on build. magus enforces none of this list.</desc><defs><marker id="ci-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="ci-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="ci-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">TARGETS</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">ci declares steps, not an order</text><g transform="translate(0,40)"><path data-edge="cmd->generate" id="ci-pipeline-edge-cmd-generate" d="M 140 204 L 140 100 Q 140 92 148 92 L 320 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->build" id="ci-pipeline-edge-cmd-build" d="M 164 300 L 164 324 Q 164 332 172 332 L 320 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->format" id="ci-pipeline-edge-cmd-format" d="M 152 204 L 152 180 Q 152 172 160 172 L 320 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->test" id="ci-pipeline-edge-cmd-test" d="M 152 300 L 152 404 Q 152 412 160 412 L 320 412" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->lint" id="ci-pipeline-edge-cmd-lint" d="M 248 252 L 320 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->security" id="ci-pipeline-edge-cmd-security" d="M 140 300 L 140 484 Q 140 492 148 492 L 320 492" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><g data-node="cmd"><rect x="32" y="204" width="216" height="96" rx="6" fill="#2d3142"/><rect x="32" y="204" width="216" height="96" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="140" y="256" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus affected ci</text></g><g data-node="generate"><rect x="320" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">generate</text></g><g data-node="format"><rect x="320" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="176" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">format</text></g><g data-node="lint"><rect x="320" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="256" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">lint</text></g><g data-node="build"><rect x="320" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="336" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">build</text></g><g data-node="test"><rect x="320" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="384" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="416" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">test</text></g><g data-node="security"><rect x="320" y="464" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="464" width="216" height="56" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="496" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">security</text></g></g></svg>