<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="ci-pipeline-title ci-pipeline-desc" class="magus-diagram"><title id="ci-pipeline-title">ci declares steps, not an order</title><desc id="ci-pipeline-desc">A ci target names its steps in a single needs call, so they are independent and run in parallel. Order comes from edges the steps themselves declare, such as test depending on build. magus enforces none of this list.</desc><defs><marker id="ci-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="ci-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="ci-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">TARGETS</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">ci declares steps, not an order</text><g transform="translate(0,40)"><path d="M 416 144 L 416 148 Q 416 156 408 156 L 188 156 Q 180 156 180 164 L 180 224" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 440 144 L 440 160 Q 440 168 432 168 L 308 168 Q 300 168 300 176 L 300 340" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 464 144 L 464 172 Q 464 180 456 180 L 428 180 Q 420 180 420 188 L 420 224" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#ci-pipeline-arrow-default)"/><path d="M 492 144 L 492 172 Q 492 180 500 180 L 532 180 Q 540 