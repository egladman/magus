<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 784" width="580" height="784" role="img" aria-labelledby="ci-pipeline-title ci-pipeline-desc" class="magus-diagram"><title id="ci-pipeline-title">ci declares steps, not an order</title><desc id="ci-pipeline-desc">A ci target names its steps in a single needs call, so they are independent and run in parallel. Order comes from edges the steps themselves declare, such as test depending on build. magus enforces none of this list.</desc><defs><marker id="ci-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="ci-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="ci-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">TARGETS</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">ci declares steps, not an order</text><g transform="translate(0,40)"><path data-edge="cmd->generate" d="M 248 356 L 252 356 Q 260 356 260 348 L 260 116 Q 260 108 268 108 L 332 108" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->build" d="M 248 392 L 312 392 Q 320 392 320 400 L 320 436 Q 320 444 328 444 L 332 444" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->format" d="M 248 368 L 264 368 Q 272 368 272 360 L 272 228 Q 272 220 280 220 L 332 220" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->test" d="M 248 404 L 300 404 Q 308 404 308 412 L 308 548 Q 308 556 316 556 L 332 556" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->lint" d="M 248 380 L 276 380 Q 284 380 284 372 L 284 340 Q 284 332 292 332 L 332 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><path data-edge="cmd->security" d="M 248 416 L 288 416 Q 296 416 296 424 L 296 660 Q 296 668 304 668 L 332 668" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#ci-pipeline-arrow-default)"/><g data-node="cmd"><rect x="32" y="344" width="216" height="88" rx="6" fill="#2d3142"/><rect x="32" y="344" width="216" height="88" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="140" y="392" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus affected ci</text></g><g data-node="generate"><rect x="332" y="64" width="216" height="88" rx="6" fill="#2d3142"/><rect x="332" y="64" width="216" height="88" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="440" y="112" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">generate</text></g><g data-node="format"><rect x="332" y="176" width="216" height="88" rx="6" fill="#2d3142"/><rect x="332" y="176" width="216" height="88" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="440" y="224" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">format</text></g><g data-node="lint"><rect x="332" y="288" width="216" height="88" rx="6" fill="#2d3142"/><rect x="332" y="288" width="216" height="88" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="440" y="336" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">lint</text></g><g data-node="build"><rect x="332" y="400" width="216" height="88" rx="6" fill="#2d3142"/><rect x="332" y="400" width="216" height="88" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="440" y="448" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">build</text></g><g data-node="test"><rect x="332" y="512" width="216" height="88" rx="6" fill="#2d3142"/><rect x="332" y="512" width="216" height="88" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="440" y="560" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">test</text></g><g data-node="security"><rect x="332" y="624" width="216" height="88" rx="6" fill="#2d3142"/><rect x="332" y="624" width="216" height="88" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="440" y="672" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">security</text></g></g></svg>