<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 664" width="872" height="664" role="img" aria-labelledby="server-http-title server-http-desc" class="magus-diagram"><title id="server-http-title">The HTTP surface, and the one route without a guard</title><desc id="server-http-desc">Agents and the console reach /mcp, the /api/v1 read views, the review and plan routes and eleven typed Connect services through the DNS-rebind, bearer-token and CORS guard. POST /api/v1/diff/session carries the human half of a paired review and POST /api/v1/share opens the LAN listener; both are loopback only. The health endpoints answer probes directly, with no authentication.</desc><defs><marker id="server-http-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="server-http-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="server-http-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The HTTP surface, and the one route without a guard</text><g transform="translate(0,40)"><rect x="16" y="64" width="824" height="376" rx="8" fill="none" stroke="#dce3eb" stroke-width="1" stroke-dasharray="4,4"/><text x="28" y="84" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.14em">THROUGH THE GUARD</text><path d="M 248 216 L 288 216 Q 296 216 296 224 L 296 240 Q 296 248 304 248 L 320 248" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#server-http-arrow-default)"/><path d="M 248 304 L 264 304 Q 272 304 272 296 L 272 276 Q 272 268 280 268 L 320 268" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#server-http-arrow-default)"/><path d="M 536 240 L 540 240 Q 548 240 548 232 L 548 136 Q 548 128 556 128 L 608 128" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#server-http-arrow-default)"/><path d="M 536 252 L 556 252 Q 564 252 564 244 L 564 224 Q 564 216 572 216 L 608 216" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#server-http-arrow-default)"/><path d="M 536 264 L 584 264 Q 592 264 592 272 L 592 296 Q 592 304 600 304 L 608 304" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#server-http-arrow-default)"/><path d="M 536 276 L 568 276 Q 576 276 576 284 L 576 384 Q 576 392 584 392 L 608 392" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#server-http-arrow-default)"/><path d="M 248 496 L 320 496" fill="none" stroke="#bc4c00" stroke-width="1" marker-end="url(#server-http-arrow-accent)"/><rect x="256" y="474" width="56" height="12" rx="2" fill="#ffffff"/><text x="284" y="483" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">UNGUARDED</text><rect x="32" y="184" width="216" height="64" rx="6" fill="#ffffff"/><rect x="32" y="184" width="216" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><rect x="40" y="192" width="48" height="12" rx="2" fill="none" stroke="#dce3eb" stroke-width="0.8"/><text x="64" y="201" fill="#7b8495" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="224" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">AI agents</text><text x="140" y="240" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, IDE</text><rect x="32" y="272" width="216" height="64" rx="6" fill="#ffffff"/><rect x="32" y="272" width="216" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><rect x="40" y="280" width="48" height="12" rx="2" fill="none" stroke="#dce3eb" stroke-width="0.8"/><text x="64" y="289" fill="#7b8495" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="312" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Console PWA</text><text x="140" y="328" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">dashboard, review</text><rect x="32" y="464" width="216" height="64" rx="6" fill="#ffffff"/><rect x="32" y="464" width="216" height="64" rx="6" fill="#ffffff" stroke="#7b8495" stroke-width="1"/><rect x="40" y="472" width="48" height="12" rx="2" fill="none" stroke="#7b8495" stroke-width="0.8"/><text x="64" y="481" fill="#7b8495" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="504" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">kubelet</text><text x="140" y="520" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">scripts, probes</text><rect x="320" y="228" width="216" height="64" rx="6" fill="#ffffff"/><rect x="320" y="228" width="216" height="64" rx="6" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="1"/><rect x="328" y="236" width="36" height="12" rx="2" fill="none" stroke="#bc4c00" stroke-width="0.8"/><text x="346" y="245" fill="#7b8495" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">GATE</text><text x="428" y="268" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Guard</text><text x="428" y="284" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">rebind + token + CORS</text><rect x="608" y="96" width="216" height="64" rx="6" fill="#ffffff"/><rect x="608" y="96" width="216" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="716" y="128" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/mcp</text><text x="716" y="144" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">agent tools, SSE</text><rect x="608" y="184" width="216" height="64" rx="6" fill="#ffffff"/><rect x="608" y="184" width="216" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="716" y="216" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1 read views</text><text x="716" y="232" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">graph, events, insight, outputs</text><rect x="608" y="272" width="216" height="64" rx="6" fill="#ffffff"/><rect x="608" y="272" width="216" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="716" y="304" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1 review + plans</text><text x="716" y="320" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">diff, session, plan, review</text><rect x="608" y="360" width="216" height="64" rx="6" fill="#ffffff"/><rect x="608" y="360" width="216" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="716" y="392" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Connect RPC</text><text x="716" y="408" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">eleven typed services</text><rect x="320" y="464" width="216" height="64" rx="6" fill="#ffffff"/><rect x="320" y="464" width="216" height="64" rx="6" fill="#ffffff" stroke="#7b8495" stroke-width="1"/><text x="428" y="496" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/livez /readyz</text><text x="428" y="512" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">no authentication</text><line x1="32" y1="576" x2="840" y2="576" stroke="#dce3eb" stroke-width="0.8"/><rect x="32" y="584" width="10" height="10" rx="2" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="0.8"/><text x="50" y="593" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">AUTHENTICATED</text><rect x="192" y="584" width="10" height="10" rx="2" fill="#ffffff" stroke="#7b8495" stroke-width="0.8"/><text x="210" y="593" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OPEN TO AN