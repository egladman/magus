<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 468" width="1456" height="468" role="img" aria-labelledby="guard-path-title guard-path-desc" class="magus-diagram"><metadata>{"figure":"guard-path","stamp":"sha256:ba7a855a4ffb2ec2d4be90e48e793c88ab6066fabf811c5597740114f4215c5c"}</metadata><title id="guard-path-title">One command judges every call, and says what to run instead</title><desc id="guard-path-desc">The host's PreToolUse hook, wired by magus agent harness install, pipes the event to magus shell. The built-in rules judge it first, reading the job store for the lease the call acts as; the workspace's magus\guard.command rule sees only what they let through and can only add to the verdict. A deny carries its reason and a next: breadcrumb naming the command to run instead, and the hook renders it into the host's reply.</desc><defs><marker id="guard-path-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="guard-path-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="guard-path-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">GUARD</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One command judges every call, and says what to run instead</text><g transform="translate(0,40)"><path data-edge="external:Host hook->cmd/magus" id="guard-path-edge-external_3aHost_20hook-cmd_2fmagus" d="M 248 200 L 336 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="cmd/magus->internal/guard" id="guard-path-edge-cmd_2fmagus-internal_2fguard" d="M 552 200 L 624 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/job" id="guard-path-edge-internal_2fguard-internal_2fjob" d="M 732 164 L 732 120 Q 732 112 740 112 L 920 112" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->external:Workspace rules" id="guard-path-edge-internal_2fguard-external_3aWorkspace_20rules" d="M 840 200 L 920 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->external:Verdict" id="guard-path-edge-internal_2fguard-external_3aVerdict" d="M 732 236 L 732 324 Q 732 332 740 332 L 1164 332 Q 1172 332 1172 324 L 1172 220 Q 1172 212 1180 212 L 1208 212" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/hint" id="guard-path-edge-internal_2fguard-internal_2fhint" d="M 744 236 L 744 280 Q 744 288 752 288 L 920 288" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="external:Workspace rules->external:Verdict" id="guard-path-edge-external_3aWorkspace_20rules-external_3aVerdict" d="M 1136 200 L 1208 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="external:Verdict->external:Host hook" id="guard-path-edge-external_3aVerdict-external_3aHost_20hook" d="M 1316 168 L 1316 72 Q 1316 64 1308 64 L 148 64 Q 140 64 140 72 L 140 168" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#guard-path-arrow-default)"/><rect x="256" y="178" width="72" height="12" rx="2" fill="#2d3142"/><text x="292" y="187" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ARGV + STDIN</text><rect x="568" y="178" width="40" height="12" rx="2" fill="#2d3142"/><text x="588" y="187" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JUDGES</text><rect x="806" y="90" width="36" height="12" rx="2" fill="#2d3142"/><text x="824" y="99" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="848" y="178" width="64" height="12" rx="2" fill="#2d3142"/><text x="880" y="187" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LET THROUGH</text><rect x="816" y="266" width="32" height="12" rx="2" fill="#2d3142"/><text x="832" y="275" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NEXT</text><rect x="710" y="42" width="36" height="12" rx="2" fill="#2d3142"/><text x="728" y="51" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPLY</text><g data-node="external:Host hook"><rect x="32" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="168" width="216" height="64" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><rect x="40" y="176" width="60" height="12" rx="2" fill="none" stroke="#a9b1c2" stroke-width="0.8"/><text x="70" y="185" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SETTINGS</text><text x="140" y="208" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Host hook</text><text x="140" y="224" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">PreToolUse, stdin JSON</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="336" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="336" y="168" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="444" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus shell</text><text x="444" y="216" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the guard with one door</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="624" y="164" width="216" height="72" rx="6" fill="#2d3142"/><rect x="624" y="164" width="216" height="72" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="732" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Built-in rules</text><text x="732" y="216" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">catalogued, run first</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="920" y="80" width="216" height="64" rx="6" fill="#2d3142"/><rect x="920" y="80" width="216" height="64" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="1028" y="112" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Job store</text><text x="1028" y="128" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">leases, write paths</text></g><g data-node="external:Workspace rules"><rect x="920" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="920" y="168" width="216" height="64" rx="6" fill="#bfc0c0" fill-opacity="0.1" stroke="#a9b1c2" stroke-width="1.2"/><text x="1028" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace rules</text><text x="1028" y="216" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus\guard.command, can only add</text></g><g data-node="external:Verdict"><rect x="1208" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="1208" y="168" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="1316" y="200" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Verdict</text><text x="1316" y="216" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">deny, advise or pass</text></g><g data-node="internal/hint" data-anchor="internal/hint"><rect x="920" y="256" width="216" height="64" rx="6" fill="#2d3142"/><rect x="920" y="256" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1028" y="288" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">next: breadcrumb</text><text x="1028" y="304" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">a command to run</text></g><line x1="32" y1="368" x2="1424" y2="368" stroke="#505466" stroke-width="0.8"/><text x="32" y="382" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="388" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="397" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT THE AGENT READS</text><rect x="192" y="388" width="10" height="10" rx="2" fill="#2d3142" stroke="#a9b1c2" stroke-width="0.8"/><text x="210" y="397" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE HOST'S SIDE</text><rect x="352" y="388" width="10" height="10" rx="2" fill="#bfc0c0" fill-opacity="0.1" stroke="#a9b1c2" stroke-width="0.8"/><text x="370" y="397" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THIS REPO'S RULES</text><rect x="512" y="388" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="530" y="397" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECLARED LEASES</text></g></svg>