<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 644" width="1448" height="644" role="img" aria-labelledby="guard-path-title guard-path-desc" class="magus-diagram"><metadata>{"figure":"guard-path","stamp":"sha256:e456585e1b97478699b467b85869226c4e723f0e4032962b15b3cdda2df3f305"}</metadata><title id="guard-path-title">One command judges every call, and says what to run instead</title><desc id="guard-path-desc">The host's PreToolUse hook, wired by magus agent harness install, pipes the event to magus shell. The built-in rules judge it first, reading the job store for the lease the call acts as and the session record for what the session already did; the workspace's magus\guard.command rule sees only what they let through and can only add to the verdict. Each judgment goes to the trail. A deny carries its reason and a next: breadcrumb naming the command to run instead, and the hook renders it into the host's reply.</desc><defs><marker id="guard-path-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="guard-path-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="guard-path-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">GUARD</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">One command judges every call, and says what to run instead</text><g transform="translate(0,40)"><path data-edge="external:Host hook->cmd/magus" id="guard-path-edge-external_3aHost_20hook-cmd_2fmagus" d="M 248 288 L 336 288" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="cmd/magus->internal/guard" id="guard-path-edge-cmd_2fmagus-internal_2fguard" d="M 552 288 L 624 288" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/guard/builtin" id="guard-path-edge-internal_2fguard-internal_2fguard_2fbuiltin" d="M 732 240 L 732 120 Q 732 112 740 112 L 912 112" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/job" id="guard-path-edge-internal_2fguard-internal_2fjob" d="M 744 240 L 744 208 Q 744 200 752 200 L 912 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/sessions" id="guard-path-edge-internal_2fguard-internal_2fsessions" d="M 840 288 L 912 288" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/trail" id="guard-path-edge-internal_2fguard-internal_2ftrail" d="M 756 336 L 756 368 Q 756 376 764 376 L 912 376" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->external:Workspace rules" id="guard-path-edge-internal_2fguard-external_3aWorkspace_20rules" d="M 744 336 L 744 456 Q 744 464 752 464 L 912 464" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->external:Verdict" id="guard-path-edge-internal_2fguard-external_3aVerdict" d="M 732 336 L 732 500 Q 732 508 740 508 L 1156 508 Q 1164 508 1164 500 L 1164 484 Q 1164 476 1172 476 L 1200 476" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="external:Workspace rules->external:Verdict" id="guard-path-edge-external_3aWorkspace_20rules-external_3aVerdict" d="M 1128 464 L 1200 464" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="external:Verdict->external:Host hook" id="guard-path-edge-external_3aVerdict-external_3aHost_20hook" d="M 1308 432 L 1308 72 Q 1308 64 1300 64 L 148 64 Q 140 64 140 72 L 140 256" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#guard-path-arrow-default)"/><rect x="256" y="266" width="72" height="12" rx="2" fill="#2d3142"/><text x="292" y="275" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ARGV + STDIN</text><rect x="568" y="266" width="40" height="12" rx="2" fill="#2d3142"/><text x="588" y="275" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JUDGES</text><rect x="802" y="90" width="36" height="12" rx="2" fill="#2d3142"/><text x="820" y="99" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RULES</text><rect x="810" y="178" width="36" height="12" rx="2" fill="#2d3142"/><text x="828" y="187" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="854" y="266" width="44" height="12" rx="2" fill="#2d3142"/><text x="876" y="275" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">HISTORY</text><rect x="810" y="354" width="44" height="12" rx="2" fill="#2d3142"/><text x="832" y="363" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RECORDS</text><rect x="796" y="442" width="64" height="12" rx="2" fill="#2d3142"/><text x="828" y="451" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LET THROUGH</text><rect x="706" y="42" width="36" height="12" rx="2" fill="#2d3142"/><text x="724" y="51" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPLY</text><g data-node="external:Host hook"><rect x="32" y="256" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="256" width="216" height="64" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><rect x="40" y="264" width="60" height="12" rx="2" fill="none" stroke="#a9b1c2" stroke-width="0.8"/><text x="70" y="273" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SETTINGS</text><text x="140" y="296" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host hook</text><text x="140" y="312" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">PreToolUse, stdin JSON</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="336" y="256" width="216" height="64" rx="6" fill="#2d3142"/><rect x="336" y="256" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="444" y="288" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus shell</text><text x="444" y="304" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the guard with one door</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="624" y="240" width="216" height="96" rx="6" fill="#2d3142"/><rect x="624" y="240" width="216" height="96" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="732" y="288" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Built-in rules</text><text x="732" y="304" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">judged first, in order</text></g><g data-node="internal/guard/builtin" data-anchor="internal/guard/builtin"><rect x="912" y="80" width="216" height="64" rx="6" fill="#2d3142"/><rect x="912" y="80" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1020" y="112" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Rule catalog</text><text x="1020" y="128" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ids and grades</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="912" y="168" width="216" height="64" rx="6" fill="#2d3142"/><rect x="912" y="168" width="216" height="64" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="1020" y="200" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="1020" y="216" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">leases, write paths</text></g><g data-node="internal/sessions" data-anchor="internal/sessions"><rect x="912" y="256" width="216" height="64" rx="6" fill="#2d3142"/><rect x="912" y="256" width="216" height="64" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="1020" y="288" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Session record</text><text x="1020" y="304" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what this session did</text></g><g data-node="internal/trail" data-anchor="internal/trail"><rect x="912" y="344" width="216" height="64" rx="6" fill="#2d3142"/><rect x="912" y="344" width="216" height="64" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="1020" y="376" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Trail</text><text x="1020" y="392" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">every judgment kept</text></g><g data-node="external:Workspace rules"><rect x="912" y="432" width="216" height="64" rx="6" fill="#2d3142"/><rect x="912" y="432" width="216" height="64" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="1020" y="464" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Workspace rules</text><text x="1020" y="480" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus\guard.command, can only add</text></g><g data-node="external:Verdict"><rect x="1200" y="432" width="216" height="64" rx="6" fill="#2d3142"/><rect x="1200" y="432" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="1308" y="464" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Verdict</text><text x="1308" y="480" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">deny, advise or pass, with next:</text></g><line x1="32" y1="544" x2="1416" y2="544" stroke="#505466" stroke-width="0.8"/><text x="32" y="558" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="564" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="573" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT THE AGENT READS</text><rect x="192" y="564" width="10" height="10" rx="2" fill="#2d3142" stroke="#a9b1c2" stroke-width="0.8"/><text x="210" y="573" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE HOST'S SIDE</text><rect x="352" y="564" width="10" height="10" rx="2" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="0.8"/><text x="370" y="573" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THIS REPO'S RULES</text><rect x="512" y="564" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="530" y="573" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY RECORDS</text></g></svg>