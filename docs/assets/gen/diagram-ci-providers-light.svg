<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1448 472" width="1448" height="472" role="img" aria-labelledby="ci-providers-title ci-providers-desc" class="magus-diagram"><metadata>{"figure":"ci-providers","stamp":"sha256:db3753f8b8a0ad87afbb5b902e64ceb30bec659d9a4b2f911e42accdefccd4d8"}</metadata><title id="ci-providers-title">Vendor syntax lives in the spell, never in the binary</title><desc id="ci-providers-desc">A failing project reaches the annotator contract, which speaks generic verbs to a provider spell; the spell translates them into the CI system's own syntax. Quote prefixes are declared once and applied per line in Go.</desc><defs><marker id="ci-providers-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="ci-providers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="ci-providers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">CI PROVIDERS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">Vendor syntax lives in the spell, never in the binary</text><g transform="translate(0,40)"><rect x="16" y="64" width="824" height="144" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="326" y="68" width="204" height="12" rx="2" fill="#f5f5f5"/><text x="428" y="77" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">MAGUS BINARY, NAMES NO CI SYSTEM</text><rect x="16" y="232" width="1112" height="104" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="498" y="236" width="148" height="12" rx="2" fill="#f5f5f5"/><text x="572" y="245" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">PROVIDER SPELL, IN BUZZ</text><path data-edge="external:run and cache->internal/ci/annotate" id="ci-providers-edge-external_3arun_20and_20cache-internal_2fci_2fannotate" d="M 248 124 L 608 124" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="internal/ci/annotate->external:Provider ops" id="ci-providers-edge-internal_2fci_2fannotate-external_3aProvider_20ops" d="M 824 124 L 852 124 Q 860 124 860 132 L 860 284 Q 860 292 868 292 L 896 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="internal/ci->internal/ci/annotate" id="ci-providers-edge-internal_2fci-internal_2fci_2fannotate" d="M 536 152 L 564 152 Q 572 152 572 144 L 572 144 Q 572 136 580 136 L 608 136" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="internal/ci->external:CI system" id="ci-providers-edge-internal_2fci-external_3aCI_20system" d="M 536 164 L 852 164 A 8 8 0 0 1 868 164 L 1140 164 Q 1148 164 1148 172 L 1148 212 Q 1148 220 1156 220 L 1184 220" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="external:Provider ops->external:CI system" id="ci-providers-edge-external_3aProvider_20ops-external_3aCI_20system" d="M 1112 292 L 1140 292 Q 1148 292 1148 284 L 1148 244 Q 1148 236 1156 236 L 1184 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="external:quote_prefixes->internal/ci" id="ci-providers-edge-external_3aquote_prefixes-internal_2fci" d="M 248 292 L 276 292 Q 284 292 284 284 L 284 172 Q 284 164 292 164 L 320 164" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ci-providers-arrow-default)"/><rect x="870" y="200" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="908" y="209" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GENERIC VERBS</text><rect x="788" y="174" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="816" y="183" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DE-FANGED</text><rect x="1158" y="264" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="1196" y="273" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VENDOR SYNTAX</text><rect x="256" y="142" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="284" y="151" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ ONCE</text><g data-node="external:run and cache"><rect x="32" y="96" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="96" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="124" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">run and cache</text><text x="140" y="140" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">a project failed</text></g><g data-node="internal/ci/annotate" data-anchor="internal/ci/annotate"><rect x="608" y="96" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="608" y="96" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="124" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Annotator contract</text><text x="716" y="140" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">internal/ci/annotate</text></g><g data-node="internal/ci" data-anchor="internal/ci"><rect x="320" y="136" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="136" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="164" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">QuoteWith</text><text x="428" y="180" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">per line, in Go</text></g><g data-node="external:Provider ops"><rect x="896" y="264" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="264" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="1004" y="292" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Provider ops</text><text x="1004" y="308" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">group start, end, annotate</text></g><g data-node="external:quote_prefixes"><rect x="32" y="264" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="264" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="292" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">quote_prefixes</text><text x="140" y="308" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">declared once</text></g><g data-node="external:CI system"><rect x="1184" y="200" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="1184" y="200" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><text x="1292" y="228" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">CI system</text><text x="1292" y="244" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">job log, pull request</text></g><line x1="32" y1="372" x2="1416" y2="372" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="386" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="392" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#5f6780" stroke-width="0.8"/><text x="50" y="401" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>