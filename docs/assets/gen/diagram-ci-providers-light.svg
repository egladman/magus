<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="ci-providers-title ci-providers-desc" class="magus-diagram"><title id="ci-providers-title">Vendor syntax lives in the spell, never in the binary</title><desc id="ci-providers-desc">A failing project reaches the annotator contract, which speaks generic verbs to a provider spell; the spell translates them into the CI system's own syntax. Quote prefixes are declared once and applied per line in Go.</desc><defs><marker id="ci-providers-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="ci-providers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="ci-providers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">CI PROVIDERS</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Vendor syntax lives in the spell, never in the binary</text><g transform="translate(0,40)"><rect x="32" y="88" width="280" height="320" rx="8" fill="none" stroke="#dce3eb" stroke-width="1" stroke-dasharray="4,4"/><text x="44" y="108" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.14em">MAGUS BINARY, NAMES NO CI SYSTEM</text><rect x="376" y="88" width="280" height="320" rx="8" fill="none" stroke="#dce3eb" stroke-width="1" stroke-dasharray="4,4"/><text x="388" y="108" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.14em">PROVIDER SPELL, IN BUZZ</text><path d="M 172 192 L 172 224" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-providers-arrow-default)"/><path d="M 288 256 L 336 256 Q 344 256 344 248 L 344 168 Q 344 160 352 160 L 400 160" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-providers-arrow-default)"/><path d="M 632 160 L 668 160 Q 676 160 676 168 L 676 248 Q 676 256 684 256 L 720 256" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-providers-arrow-default)"/><path d="M 400 352 L 350 352 Q 344 352 344 346 L 344 346 Q 344 340 338 340 L 288 340" fill="none" stroke="#646b79" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#ci-providers-arrow-default)"/><path d="M 172 384 L 172 432 Q 172 440 180 440 L 812 440 Q 820 440 820 432 L 820 288" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#ci-providers-arrow-default)"/><rect x="306" y="186" width="76" height="12" rx="2" fill="#ffffff"/><text x="344" y="195" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GENERIC VERBS</text><rect x="638" y="186" width="76" height="12" rx="2" fill="#ffffff"/><text x="676" y="195" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VENDOR SYNTAX</text><rect x="316" y="322" width="56" height="12" rx="2" fill="#ffffff"/><text x="344" y="331" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ ONCE</text><rect x="468" y="418" width="56" height="12" rx="2" fill="#ffffff"/><text x="496" y="427" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DE-FANGED</text><rect x="56" y="128" width="232" height="64" rx="6" fill="#ffffff"/><rect x="56" y="128" width="232" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="172" y="160" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">run and cache</text><text x="172" y="176" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">a project failed</text><rect x="56" y="224" width="232" height="64" rx="6" fill="#ffffff"/><rect x="56" y="224" width="232" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="172" y="256" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Annotator contract</text><text x="172" y="272" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">internal/ci/annotate</text><rect x="56" y="320" width="232" height="64" rx="6" fill="#ffffff"/><rect x="56" y="320" width="232" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="172" y="352" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">QuoteWith</text><text x="172" y="368" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">per line, in Go</text><rect x="400" y="128" width="232" height="64" rx="6" fill="#ffffff"/><rect x="400" y="128" width="232" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="516" y="160" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Provider ops</text><text x="516" y="176" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">group start, end, annotate</text><rect x="400" y="320" width="232" height="64" rx="6" fill="#ffffff"/><rect x="400" y="320" width="232" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="516" y="352" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">quote_prefixes</text><text x="516" y="368" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">declared once</text><rect x="720" y="224" width="200" height="64" rx="6" fill="#ffffff"/><rect x="720" y="224" width="200" height="64" rx="6" fill="#ffffff" stroke="#7b8495" stroke-width="1"/><text x="820" y="256" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">CI system</text><text x="820" y="272" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">job log, pull request</text><line x1="32" y1="472" x2="928" y2="472" stroke="#dce3eb" stroke-width="0.8"/><rect x="32" y="480" width="10" height="10" rx="2" fill="#ffffff" stroke="#7b8495" stroke-width="0.8"/><text x="50" y="489" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>