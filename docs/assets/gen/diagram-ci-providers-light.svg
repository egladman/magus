<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 644 688" width="644" height="688" role="img" aria-labelledby="ci-providers-title ci-providers-desc" class="magus-diagram"><metadata>{"figure":"ci-providers","stamp":"sha256:4207003e30608ad51dc96f3acd7cd84752993edebdc065166117ebe1099d9798"}</metadata><title id="ci-providers-title">Vendor syntax lives in the spell, never in the binary</title><desc id="ci-providers-desc">A failing project reaches the annotator contract, which speaks generic verbs to a provider spell; the spell translates them into the CI system's own syntax. Quote prefixes are declared once in the spell and applied per line in Go.</desc><defs><marker id="ci-providers-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="ci-providers-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="ci-providers-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">CI PROVIDERS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">Vendor syntax lives in the spell, never in the binary</text><g transform="translate(0,40)"><rect x="32" y="32" width="264" height="384" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="62" y="36" width="204" height="12" rx="2" fill="#f5f5f5"/><text x="164" y="45" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">MAGUS BINARY, NAMES NO CI SYSTEM</text><path data-edge="internal/ci/annotate->external:Provider spell" id="ci-providers-edge-internal_2fci_2fannotate-external_3aProvider_20spell" d="M 172 128 L 172 156 Q 172 164 180 164 L 420 164 Q 428 164 428 172 L 428 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="internal/ci->internal/ci/annotate" id="ci-providers-edge-internal_2fci-internal_2fci_2fannotate" d="M 64 368 L 56 368 Q 48 368 48 360 L 48 104 Q 48 96 56 96 L 64 96" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="internal/ci->external:CI system" id="ci-providers-edge-internal_2fci-external_3aCI_20system" d="M 172 400 L 172 428 Q 172 436 180 436 L 284 436 Q 292 436 292 444 L 292 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="external:Provider spell->internal/ci" id="ci-providers-edge-external_3aProvider_20spell-internal_2fci" d="M 416 264 L 416 292 Q 416 300 408 300 L 180 300 Q 172 300 172 308 L 172 336" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#ci-providers-arrow-default)"/><path data-edge="external:Provider spell->external:CI system" id="ci-providers-edge-external_3aProvider_20spell-external_3aCI_20system" d="M 428 264 L 428 428 Q 428 436 420 436 L 316 436 Q 308 436 308 444 L 308 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#ci-providers-arrow-default)"/><rect x="262" y="142" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="300" y="151" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GENERIC VERBS</text><rect x="204" y="414" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="232" y="423" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DE-FANGED</text><rect x="264" y="278" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="287" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ ONCE</text><rect x="330" y="414" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="368" y="423" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VENDOR SYNTAX</text><g data-node="internal/ci/annotate" data-anchor="internal/ci/annotate"><rect x="64" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="64" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="172" y="96" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Annotator contract</text><text x="172" y="112" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">internal/ci/annotate</text></g><g data-node="internal/ci" data-anchor="internal/ci"><rect x="64" y="336" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="64" y="336" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="172" y="368" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">QuoteWith</text><text x="172" y="384" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">per line, in Go</text></g><g data-node="external:Provider spell"><rect x="320" y="200" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="200" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="328" y="208" width="36" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="346" y="217" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">BUZZ</text><text x="428" y="240" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Provider spell</text><text x="428" y="256" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">group, annotate, quote_prefixes</text></g><g data-node="external:CI system"><rect x="192" y="472" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="192" y="472" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><text x="300" y="504" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">CI system</text><text x="300" y="520" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">job log, pull request</text></g><line x1="32" y1="588" x2="612" y2="588" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="602" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="608" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#5f6780" stroke-width="0.8"/><text x="50" y="617" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>