<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 364" width="1144" height="364" role="img" aria-labelledby="language-service-title language-service-desc" class="magus-diagram"><metadata>{"figure":"language-service","stamp":"sha256:a26aafaaec576a3eb1a32af99e9eebef99748239bdba053088216308149d008d"}</metadata><title id="language-service-title">One language service answers the editor and the playground</title><desc id="language-service-desc">The language service answers completion, hover and signature help for Buzz from the lexer's tokens and a manifest of every host module's members. magus serves it to an editor over the language server protocol, and the browser playground runs the same code in WebAssembly beside the dry-run engine, so the two answer the same way.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="language-service-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="language-service-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="language-service-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style=