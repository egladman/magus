nospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">STATE</text><text x="716" y="192" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace registry</text><text x="716" y="208" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the warm graph</text><line x1="32" y1="352" x2="824" y2="352" stroke="#202632" stroke-width="0.8"/><rect x="32" y="360" width="10" height="10" rx="2" fill="#13171f" stroke="#6b7383" stroke-width="0.8"/><text x="50" y="369" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE THE SERVER</text><rect x="192" y="360" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="210" y="369" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE WARM COPY</text></g></svg>