<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 440" width="856" height="440" role="img" aria-labelledby="server-jobs-title server-jobs-desc" class="magus-diagram"><title id="server-jobs-title">What keeps the warm workspace current</title><desc id="server-jobs-desc">File changes drive the watchers and the SCIP auto-indexer; a magus run queues a coalesced graph-build job. All three write into the workspace registry, which is the server's single warm copy of the knowledge graph.</desc><defs><marker id="server-jobs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="server-jobs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="server-jobs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What keeps the warm workspace current</text><g transform="translate(0,40)"><path data-edge="fs->watch" d="M 248 128 L 256 128 Q 264 128 264 120 L 264 104 Q 264 96 272 96 L 320 96" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="fs->idx" d="M 248 148 L 292 148 Q 300 148 300 156 L 300 176 Q 300 184 308 184 L 320 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="cli->job" d="M 248 228 L 276 228 Q 284 228 284 236 L 284 264 Q 284 272 292 272 L 320 272" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="watch->ws" d="M 536 96 L 576 96 Q 584 96 584 104 L 584 160 Q 584 168 592 168 L 608 168" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="idx->ws" d="M 536 184 L 608 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="job->ws" d="M 536 272 L 552 272 Q 560 272 560 264 L 560 208 Q 560 200 568 200 L 608 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><rect x="280" y="250" width="40" height="12" rx="2" fill="#2d3142"/><text x="300" y="259" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">QUEUES</text><rect x="594" y="124" width="60" height="12" rx="2" fill="#2d3142"/><text x="624" y="133" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INVALIDATE</text><rect x="550" y="162" width="44" height="12" rx="2" fill="#2d3142"/><text x="572" y="171" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SYMBOLS</text><rect x="562" y="178" width="44" height="12" rx="2" fill="#2d3142"/><text x="584" y="187" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REBUILD</text><g data-node="fs"><rect x="32" y="108" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="108" width="216" height="64" rx="6" fill="#2d3142" stroke="#8e98ac" stroke-width="1.2"/><rect x="40" y="116" width="40" height="12" rx="2" fill="none" stroke="#8e98ac" stroke-width="0.8"/><text x="60" y="125" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">INPUT</text><text x="140" y="148" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Source files</text><text x="140" y="164" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magusfiles, code</text></g><g data-node="cli"><rect x="32" y="196" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="196" width="216" height="64" rx="6" fill="#2d3142" stroke="#8e98ac" stroke-width="1.2"/><rect x="40" y="204" width="40" height="12" rx="2" fill="none" stroke="#8e98ac" stroke-width="0.8"/><text x="60" y="213" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">INPUT</text><text x="140" y="236" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus run</text><text x="140" y="252" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">any invocation</text></g><g data-node="watch" data-anchor="internal/file"><rect x="320" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="328" y="72" width="28" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="342" y="81" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="428" y="104" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">File watchers</text><text x="428" y="120" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">internal/file/watch</text></g><g data-node="idx"><rect x="320" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="328" y="160" width="28" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="342" y="169" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="428" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">SCIP indexer</text><text x="428" y="208" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">symbol index</text></g><g data-node="job"><rect x="320" y="240" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="240" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="328" y="248" width="28" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="342" y="257" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="428" y="280" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Graph build</text><text x="428" y="296" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">coalesced, async</text></g><g data-node="ws" data-anchor="internal/graph"><rect x="608" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="152" width="216" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><rect x="616" y="160" width="40" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="636" y="169" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">STATE</text><text x="716" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace registry</text><text x="716" y="208" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the warm graph</text></g><line x1="32" y1="340" x2="824" y2="340" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="354" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="360" width="10" height="10" rx="2" fill="#2d3142" stroke="#8e98ac" stroke-width="0.8"/><text x="50" y="369" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE THE SERVER</text><rect x="192" y="360" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="210" y="369" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE WARM COPY</text></g></svg>