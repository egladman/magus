<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 440" width="856" height="440" role="img" aria-labelledby="server-jobs-title server-jobs-desc" class="magus-diagram"><title id="server-jobs-title">What keeps the warm workspace current</title><desc id="server-jobs-desc">File changes drive the watchers and the SCIP auto-indexer; a magus run queues a coalesced graph-build job. All three write into the workspace registry, which is the server's single warm copy of the knowledge graph.</desc><defs><marker id="server-jobs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="server-jobs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="server-jobs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What keeps the warm workspace current</text><g transform="translate(0,40)"><path d="M 248 128 L 256 128 Q 264 128 264 120 L 264 104 Q 264 96 272 96 L 320 96" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#server-jobs-arrow-default)"/><path d="M 248 148 L 292 148 Q 300 148 300 156 L 300 176 Q 300 184 308 184 L 320 184" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#server-jobs-arrow-default)"/><path d="M 248 228 L 276 228 Q 284 228 284 236 L 284 264 Q 284 272 292 272 L 320 272" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#server-jobs-arrow-default)"/><path d="M 536 96 L 576 96 Q 584 96 584 104 L 584 1