<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1012 768" width="1012" height="768" role="img" aria-labelledby="symbol-index-title symbol-index-desc" class="magus-diagram"><metadata>{"diagram":"symbol-index","stamp":"sha256:6a0a0923e150347611f72e6ef326c3b7b80e5cb102b855631360fb1335ead1d9"}</metadata><title id="symbol-index-title">A SCIP indexer per language writes the file the graph reads lazily</title><desc id="symbol-index-desc">Each language has an indexer behind one contract: the Go indexer wraps a Go analyzer, the Buzz indexer parses with scipbuzz, and the shell indexer reads scripts. Each writes one SCIP file per project when its sources change, and the knowledge graph opens that file one project at a time instead of loading every symbol.</desc><defs><marker id="symbol-index-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="symbol-index-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="symbol-index-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SYMBOLS</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">A SCIP indexer per language writes the file the graph reads lazily</text><g transform="translate(0,40)"><path data-edge="internal/symbols->external:index.scip" id="symbol-index-edge-internal_2fsymbols-external_3aindex_2escip" d="M 620 376 L 620 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/symbols/goindex->internal/symbols" id="symbol-index-edge-internal_2fsymbols_2fgoindex-internal_2fsymbols" d="M 140 248 L 140 284 Q 140 292 148 292 L 588 292 Q 596 292 596 300 L 596 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/symbols/buzzindex->internal/symbols" id="symbol-index-edge-internal_2fsymbols_2fbuzzindex-internal_2fsymbols" d="M 392 248 L 392 268 Q 392 276 400 276 L 600 276 Q 608 276 608 284 L 608 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/symbols/buzzindex->libs/scipbuzz" id="symbol-index-edge-internal_2fsymbols_2fbuzzindex-libs_2fscipbuzz" d="M 380 248 L 380 284 A 8 8 0 0 0 380 300 L 380 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/symbols/shindex->internal/symbols" id="symbol-index-edge-internal_2fsymbols_2fshindex-internal_2fsymbols" d="M 620 248 L 620 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/interp/bindings->internal/symbols" id="symbol-index-edge-internal_2finterp_2fbindings-internal_2fsymbols" d="M 728 92 L 972 92 Q 980 92 980 100 L 980 284 Q 980 292 972 292 L 652 292 Q 644 292 644 300 L 644 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/interp/bindings->internal/symbols/goindex" id="symbol-index-edge-internal_2finterp_2fbindings-internal_2fsymbols_2fgoindex" d="M 512 92 L 148 92 Q 140 92 140 100 L 140 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/interp/bindings->internal/symbols/buzzindex" id="symbol-index-edge-internal_2finterp_2fbindings-internal_2fsymbols_2fbuzzindex" d="M 512 104 L 388 104 Q 380 104 380 112 L 380 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/interp/bindings->internal/symbols/shindex" id="symbol-index-edge-internal_2finterp_2fbindings-internal_2fsymbols_2fshindex" d="M 620 120 L 620 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/interp/bindings->internal/spell" id="symbol-index-edge-internal_2finterp_2fbindings-internal_2fspell" d="M 728 104 L 852 104 Q 860 104 860 112 L 860 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="internal/spell->internal/symbols" id="symbol-index-edge-internal_2fspell-internal_2fsymbols" d="M 860 248 L 860 268 Q 860 276 852 276 L 640 276 Q 632 276 632 284 L 632 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><path data-edge="external:index.scip->internal/graph/knowledge" id="symbol-index-edge-external_3aindex_2escip-internal_2fgraph_2fknowledge" d="M 620 504 L 620 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#symbol-index-arrow-default)"/><rect x="630" y="404" width="40" height="12" rx="2" fill="#2d3142"/><text x="650" y="413" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WRITES</text><rect x="630" y="532" width="64" height="12" rx="2" fill="#2d3142"/><text x="662" y="541" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ LAZILY</text><g data-node="internal/symbols" data-anchor="internal/symbols"><rect x="512" y="320" width="216" height="56" rx="6" fill="#2d3142"/><rect x="512" y="320" width="216" height="56" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="620" y="348" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Index contract</text><text x="620" y="364" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what an indexer returns</text></g><g data-node="internal/symbols/goindex" data-anchor="internal/symbols/goindex"><rect x="32" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="192" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="220" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Go indexer</text><text x="140" y="236" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">packages, symbols</text></g><g data-node="internal/symbols/buzzindex" data-anchor="internal/symbols/buzzindex"><rect x="272" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="272" y="192" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="380" y="220" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Buzz indexer</text><text x="380" y="236" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">parsed by scipbuzz</text></g><g data-node="internal/symbols/shindex" data-anchor="internal/symbols/shindex"><rect x="512" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="512" y="192" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="620" y="220" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Shell indexer</text><text x="620" y="236" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">functions, sources</text></g><g data-node="libs/scipbuzz" data-anchor="libs/scipbuzz"><rect x="272" y="320" width="216" height="56" rx="6" fill="#2d3142"/><rect x="272" y="320" width="216" height="56" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="380" y="348" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">scipbuzz</text><text x="380" y="364" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Buzz to SCIP</text></g><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="512" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="512" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="620" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host bindings</text><text x="620" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">calls an indexer</text></g><g data-node="internal/spell" data-anchor="internal/spell"><rect x="752" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="752" y="192" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="860" y="220" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spell host</text><text x="860" y="236" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ops ask for symbols</text></g><g data-node="internal/graph/knowledge" data-anchor="internal/graph/knowledge"><rect x="512" y="576" width="216" height="56" rx="6" fill="#2d3142"/><rect x="512" y="576" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="620" y="604" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Knowledge graph</text><text x="620" y="620" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">opens a shard lazily</text></g><g data-node="external:index.scip"><rect x="512" y="448" width="216" height="56" rx="6" fill="#2d3142"/><rect x="512" y="448" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="620" y="476" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">index.scip</text><text x="620" y="492" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one per project</text></g><line x1="32" y1="668" x2="980" y2="668" stroke="#505466" stroke-width="0.8"/><text x="32" y="682" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="688" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="697" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE CONTRACT</text><rect x="192" y="688" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="697" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE COMMITTED SHAPE</text><rect x="352" y="688" width="10" height="10" rx="2" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="0.8"/><text x="370" y="697" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">A PARSER</text></g></svg>