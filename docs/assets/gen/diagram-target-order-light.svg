<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 896" width="772" height="896" role="img" aria-labelledby="target-order-title target-order-desc" class="magus-diagram"><title id="target-order-title">Only ci is required; the rest is an order</title><desc id="target-order-desc">magus refuses a ci run when no project in scope declares ci. Every other step, and the order between them, is the convention this workspace follows so each verb means the same thing in every project.</desc><defs><marker id="target-order-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="target-order-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="target-order-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">TARGETS</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Only ci is required; the rest is an order</text><g transform="translate(0,40)"><path data-edge="install->generate" id="target-order-edge-install-generate" d="M 380 120 L 380 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="generate->format" id="target-order-edge-generate-format" d="M 380 248 L 380 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="generate->security" id="target-order-edge-generate-security" d="M 488 220 L 612 220 Q 620 220 620 228 L 620 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="format->lint" id="target-order-edge-format-lint" d="M 272 348 L 148 348 Q 140 348 140 356 L 140 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="format->build" id="target-order-edge-format-build" d="M 380 376 L 380 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="format->test" id="target-order-edge-format-test" d="M 392 376 L 392 404 Q 392 412 400 412 L 612 412 Q 620 412 620 420 L 620 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="lint->ci" id="target-order-edge-lint-ci" d="M 140 504 L 140 524 Q 140 532 148 532 L 360 532 Q 368 532 368 540 L 368 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="build->ci" id="target-order-edge-build-ci" d="M 380 504 L 380 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="test->ci" id="target-order-edge-test-ci" d="M 620 504 L 620 524 Q 620 532 612 532 L 400 532 Q 392 532 392 540 L 392 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="security->ci" id="target-order-edge-security-ci" d="M 728 348 L 732 348 Q 740 348 740 356 L 740 540 Q 740 548 732 548 L 412 548 Q 404 548 404 556 L 404 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#target-order-arrow-default)"/><path data-edge="ci->cd" id="target-order-edge-ci-cd" d="M 380 632 L 380 704" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#target-order-arrow-default)"/><g data-node="install" data-anchor="docs/magusfile.buzz"><rect x="272" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="380" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">install</text><text x="380" y="108" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">fetch dependencies</text></g><g data-node="generate" data-anchor="magusfile.buzz"><rect x="272" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="380" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">generate</text><text x="380" y="236" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">committed output</text></g><g data-node="format" data-anchor="magusfile.buzz"><rect x="272" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="380" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">format</text><text x="380" y="364" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">rewrites source</text></g><g data-node="lint" data-anchor="magusfile.buzz"><rect x="32" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="448" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">lint</text><text x="140" y="492" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">reports, never writes</text></g><g data-node="build" data-anchor="magusfile.buzz"><rect x="272" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="448" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="380" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">build</text><text x="380" y="492" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">uncommitted artifacts</text></g><g data-node="test" data-anchor="magusfile.buzz"><rect x="512" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="512" y="448" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="620" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">test</text></g><g data-node="security" data-anchor="magusfile.buzz"><rect x="512" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="512" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="620" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">security</text><text x="620" y="364" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">advisory data, uncached</text></g><g data-node="ci" data-anchor="internal/doctor/checks.go"><rect x="272" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="576" width="216" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="380" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">ci</text><text x="380" y="620" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">MGS1001 when absent</text></g><g data-node="cd" data-anchor="types/charm.go"><rect x="272" y="704" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="272" y="704" width="216" height="56" rx="6" fill="#ffffff" stroke="#7a8399" stroke-width="1.2" stroke-dasharray="4,3"/><text x="380" y="732" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">cd charm</text><text x="380" y="748" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">ci:cd delivers</text></g><line x1="32" y1="796" x2="740" y2="796" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="810" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="816" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="825" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">ENFORCED</text><rect x="192" y="816" width="10" height="10" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="210" y="825" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">RECOMMENDED</text><rect x="352" y="816" width="10" height="10" rx="2" fill="#ffffff" stroke="#7a8399" stroke-width="0.8"/><text x="370" y="825" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OPT-IN, REQUIRED BY NOTHING</text></g></svg>