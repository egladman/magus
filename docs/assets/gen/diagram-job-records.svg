c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the spec an agent reads</text></g><g data-node="internal/ci/forecast" data-anchor="internal/ci/forecast"><rect x="616" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="616" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="724" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Check forecast</text><text x="724" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what verifies the row</text></g><g data-node="internal/queue/types" data-anchor="internal/queue/types"><rect x="616" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="616" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="724" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Queue records</text><text x="724" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">a landed job</text></g><g data-node="internal/sessions" data-anchor="internal/sessions"><rect x="616" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="616" y="384" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="724" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Session record</text><text x="724" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">who held the lease</text></g><g data-node="internal/trail" data-anchor="internal/trail"><rect x="616" y="464" width="216" height="56" rx="6" fill="#2d3142"/><rect x="616" y="464" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="724" y="492" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Trail</text><text x="724" y="508" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what it did</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="32" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="140" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">judges against the row</text></g><g data-node="internal/sandbox" data-anchor="internal/sandbox"><rect x="32" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sandbox</text><text x="140" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write grant from the row</text></g><line x1="32" y1="556" x2="832" y2="556" stroke="#505466" stroke-width="0.8"/><text x="32" y="570" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="576" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="585" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE RECORD</text><rect x="192" y="576" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="585" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligat