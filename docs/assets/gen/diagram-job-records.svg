<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 656" width="864" height="656" role="img" aria-labelledby="job-records-title job-records-desc" class="magus-diagram"><metadata>{"figure":"job-records","stamp":"sha256:c73485340920bfddd38f4557fc45ad9e3b0912fddda97ff7890850ec39d9ac4b"}</metadata><title id="job-records-title">A job row is one record, and four packages read it</title><desc id="job-records-desc">The job store keeps one row per job in a JSON Lines file: its goal, checkpoint and write paths, and the leases that release them. Migrations upgrade an old row on read. describe renders the spec an agent reads, the forecast sizes the verifying checks, and the queue types record a landed job. The store reads the session record and the trail to say who held a lease. The guard judges calls against the row, and the sandbox narrows a run's writes to it.</desc><defs><marker id="job-records-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="job-records-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="job-records-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">JOB</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">A job row is one record, and four packages read it</text><g transform="translate(0,40)"><path data-edge="internal/job->internal/store/migrate" id="job-records-edge-internal_2fjob-internal_2fstore_2fmigrate" d="M 436 204 L 436 180 Q 436 172 444 172 L 616 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/describe" id="job-records-edge-internal_2fjob-internal_2fdescribe" d="M 544 252 L 616 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/ci/forecast" id="job-records-edge-internal_2fjob-internal_2fci_2fforecast" d="M 544 240 L 572 240 Q 580 240 580 232 L 580 180 A 8 8 0 0 1 580 164 L 580 112 Q 580 104 588 104 L 616 104" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/queue/types" id="job-records-edge-internal_2fjob-internal_2fqueue_2ftypes" d="M 460 300 L 460 324 Q 460 332 468 332 L 616 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/sessions" id="job-records-edge-internal_2fjob-internal_2fsessions" d="M 448 300 L 448 404 Q 448 412 456 412 L 616 412" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/job->internal/trail" id="job-records-edge-internal_2fjob-internal_2ftrail" d="M 436 300 L 436 484 Q 436 492 444 492 L 616 492" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/guard->internal/job" id="job-records-edge-internal_2fguard-internal_2fjob" d="M 248 104 L 280 104 Q 288 104 288 112 L 288 232 Q 288 240 296 240 L 328 240" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/guard->internal/ci/forecast" id="job-records-edge-internal_2fguard-internal_2fci_2fforecast" d="M 248 92 L 616 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#job-records-arrow-default)"/><path data-edge="internal/sandbox->internal/job" id="job-records-edge-internal_2fsandbox-internal_2fjob" d="M 248 252 L 328 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" mar