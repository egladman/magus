<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 808" width="680" height="808" role="img" aria-labelledby="merge-queue-workflows-title merge-queue-workflows-desc" class="magus-diagram"><metadata>{"figure":"merge-queue-workflows","stamp":"sha256:364e2a5f8ca2409f7932f3c85c9639012dab812c305cf841e4081df464b02b75"}</metadata><title id="merge-queue-workflows-title">Three workflows drive the queue, and one script gates it</title><desc id="merge-queue-workflows-desc">queue-intent runs when a pull request asks to merge and records the intent. queue plans the batch with the engine, asks the forge provider for the changes and runs the repository's gate script on the candidate. queue-apply merges the candidate the gate passed and reports the rest. The workflows are YAML; the decisions are the engine's, so the same queue runs from any forge that has a provider.</desc><defs><marker id="merge-queue-workflows-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="merge-queue-workflows-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="merge-queue-workflows-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">MERGE QUEUE</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">Three workflows drive the queue, and one script gates it</text><g transform="translate(0,40)"><path data-edge="external:queue-intent->external:queue" id="merge-queue-workflows-edge-external_3aqueue-intent-external_3aqueue" d="M 140 128 L 140 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-workflows-arrow-default)"/><path data-edge="external:queue->external:queue-apply" id="merge-queue-workflows-edge-external_3aqueue-external_3aqueue-apply" d="M 140 264 L 140 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-workflows-arrow-default)"/><path data-edge="external:queue->internal/queue" id="merge-queue-workflows-edge-external_3aqueue-internal_2fqueue" d="M 248 232 L 372 232 Q 380 232 380 240 L 380 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-workflows-arrow-default)"/><path data-edge="external:queue-apply->internal/queue/provider" id="merge-queue-workflows-edge-external_3aqueue-apply-internal_2fqueue_2fprovider" d="M 140 400 L 140 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-workflows-arrow-default)"/><path data-edge="internal/queue->external:merge-queue.buzz" id="merge-queue-workflows-edge-internal_2fqueue-external_3amerge-queue_2ebuzz" d="M 380 400 L 380 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-workflows-arrow-default)"/><path data-edge="internal/queue/provider->internal/queue/types" id="merge-queue-workflows-edge-internal_2fqueue_2fprovider-internal_2fqueue_2ftypes" d="M 140 536 L 140 608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-workflows-arrow-default)"/><path data-edge="internal/queue/client->internal/queue/types" id="merge-queue-workflows-edge-internal_2fqueue_2fclient-internal_2fqueue_2ftypes" d="M 500 128 L 500 564 Q 500 572 492 572 L 160 572 Q 152 572 152 580 L 152 608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-workflows-arrow-default)"/><rect x="150" y="156" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="170" y="165" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INTENT</text><rect x="150" y="292" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="170" y="301" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PASSED</text><rect x="296" y="210" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="312" y="219" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PLAN</text><rect x="150" y="428" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="168" y="437" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGE</text><rect x="390" y="428" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="418" y="437" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">CANDIDATE</text><g data-node="external:queue-intent"><rect x="32" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="1.2"/><rect x="40" y="72" width="60" height="12" rx="2" fill="none" stroke="#5f6780" stroke-width="0.8"/><text x="70" y="81" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">WORKFLOW</text><text x="140" y="104" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">queue-intent</text><text x="140" y="120" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">records a merge intent</text></g><g data-node="external:queue"><rect x="32" y="200" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="200" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="40" y="208" width="60" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="70" y="217" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">WORKFLOW</text><text x="140" y="240" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">queue</text><text x="140" y="256" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">plans, validates the batch</text></g><g data-node="external:queue-apply"><rect x="32" y="336" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="336" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="40" y="344" width="60" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="70" y="353" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">WORKFLOW</text><text x="140" y="376" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">queue-apply</text><text x="140" y="392" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">merges what passed</text></g><g data-node="internal/queue" data-anchor="internal/queue"><rect x="272" y="336" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="272" y="336" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="380" y="368" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Queue engine</text><text x="380" y="384" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">plan, validate, apply</text></g><g data-node="internal/queue/provider" data-anchor="internal/queue/provider"><rect x="32" y="472" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="472" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="504" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Forge provider</text><text x="140" y="520" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">github.buzz</text></g><g data-node="internal/queue/client" data-anchor="internal/queue/client"><rect x="392" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="392" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="500" y="96" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Queue client</text><text x="500" y="112" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">asks the SDK</text></g><g data-node="internal/queue/types" data-anchor="internal/queue/types"><rect x="32" y="608" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="608" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="640" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Queue records</text><text x="140" y="656" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">intent, candidate</text></g><g data-node="external:merge-queue.buzz"><rect x="272" y="472" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="272" y="472" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="380" y="504" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">merge-queue.buzz</text><text x="380" y="520" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the repo's gate</text></g><line x1="32" y1="708" x2="648" y2="708" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="722" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="728" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="737" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECISIONS</text><rect x="192" y="728" width="10" height="10" rx="2" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="737" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">STARTS THE FLOW</text><rect x="352" y="728" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="370" y="737" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">RECORDS</text></g></svg>