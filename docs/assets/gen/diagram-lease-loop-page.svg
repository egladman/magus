idth="60" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="340" y="335" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">CHECKPOINT</text><rect x="526" y="404" width="32" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="542" y="413" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SPEC</text><rect x="526" y="196" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="548" y="205" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RELEASE</text><rect x="406" y="148" width="72" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="442" y="157" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPORTS DONE</text><rect x="562" y="254" width="36" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="580" y="263" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="698" y="270" width="52" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="724" y="279" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JOB ROWS</text><rect x="918" y="148" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="940" y="157" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligature