<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1752 652" width="1752" height="652" role="img" aria-labelledby="agent-orchestration-title agent-orchestration-desc" class="magus-diagram"><metadata>{"figure":"agent-orchestration","stamp":"sha256:4629f60ec014e9a9fe5de54d4d8b1cf45a44c1349d505807dfe2179e3f2d4f8e"}</metadata><title id="agent-orchestration-title">Three roles, one store, and a guard at every boundary</title><desc id="agent-orchestration-desc">The orchestrator forks job rows into one JSON Lines store and waits on them; it never does groundwork. Each worker is bound to one row: its write paths, its one check, its own checkout. The integrator merges the finished branches with git merge --no-ff, regenerates once and runs the full checks. The guard reads the row on every write and command, the sandbox narrows a run's writes to the same row, and the broker holds the one build budget every checkout on the machine shares.</desc><defs><marker id="agent-orchestration-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="agent-orchestration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="agent-orchestration-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">ORCHESTRATION</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Three roles, one store, and a guard at every boundary</text><g transform="translate(0,40)"><rect x="16" y="64" width="552" height="264" rx="8" fill="#f5f5f5" fill-opacity="0.02" str