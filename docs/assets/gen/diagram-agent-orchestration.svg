<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 912" width="956" height="912" role="img" aria-labelledby="agent-orchestration-title agent-orchestration-desc" class="magus-diagram"><metadata>{"diagram":"agent-orchestration","stamp":"sha256:625c41ed7e74ded8c129aaa93f85c8137ccd6420675538ebb81d69497d35d3a2"}</metadata><title id="agent-orchestration-title">Three roles, one store, and a guard at every boundary</title><desc id="agent-orchestration-desc">The orchestrator forks job rows into one store and waits on them. Each worker holds one row: its write paths, check and checkout. The integrator merges finished branches and runs the checks. The guard reads the row on every call, the sandbox narrows a run's writes to it, and the broker holds the machine's one build budget.</desc><defs><marker id="agent-orchestration-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="agent-orchestration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="agent-orchestration-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">ORCHESTRATION</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">Three roles, one store, and a guard at every boundary</text><g transform="translate(0,40)"><rect x="32" y="32" width="488" height="232" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="244" y="36" width="64" height="12" rx="2" fill="#2d3142"/><text x="276" y="45" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE ROLES</text><rect x="544" y="32" width="380" height="744" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="642" y="36" width="184" height="12" rx="2" fill="#2d3142"/><text x="734" y="45" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT MAGUS HOLDS AND ENFORCES</text><path data-edge="external:Orchestrator->external:Worker" id="agent-orchestration-edge-external_3aOrchestrator-external_3aWorker" d="M 156 120 L 156 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="external:Orchestrator->internal/job" id="agent-orchestration-edge-external_3aOrchestrator-internal_2fjob" d="M 264 92 L 268 92 Q 276 92 276 100 L 276 540 Q 276 548 284 548 L 756 548 Q 764 548 764 556 L 764 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="external:Worker->internal/guard" id="agent-orchestration-edge-external_3aWorker-internal_2fguard" d="M 156 248 L 156 284 Q 156 292 164 292 L 268 292 A 8 8 0 0 1 284 292 L 652 292 Q 660 292 660 300 L 660 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="external:Integrator->internal/guard" id="agent-orchestration-edge-external_3aIntegrator-internal_2fguard" d="M 396 120 L 396 268 Q 396 276 404 276 L 668 276 Q 676 276 676 284 L 676 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/job->vcs" id="agent-orchestration-edge-internal_2fjob-vcs" d="M 788 632 L 788 704" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/guard->internal/job" id="agent-orchestration-edge-internal_2fguard-internal_2fjob" d="M 776 360 L 780 360 Q 788 360 788 368 L 788 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/guard->broker" id="agent-orchestration-edge-internal_2fguard-broker" d="M 668 376 L 668 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/guard->vcs" id="agent-orchestration-edge-internal_2fguard-vcs" d="M 776 348 L 792 348 Q 800 348 800 356 L 800 524 Q 800 532 808 532 L 900 532 Q 908 532 908 540 L 908 660 Q 908 668 900 668 L 808 668 Q 800 668 800 676 L 800 704" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="group:Sandbox->internal/job" id="agent-orchestration-edge-group_3aSandbox-internal_2fjob" d="M 788 120 L 788 148 Q 788 156 796 156 L 804 156 Q 812 156 812 164 L 812 524 A 8 8 0 0 0 812 540 L 812 542 Q 812 548 806 548 L 806 548 Q 800 548 800 554 L 800 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="broker->internal/job" id="agent-orchestration-edge-broker-internal_2fjob" d="M 668 504 L 668 524 Q 668 532 676 532 L 768 532 Q 776 532 776 540 L 776 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><rect x="166" y="148" width="76" height="12" rx="2" fill="#2d3142"/><text x="204" y="157" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">./MAGUS, EXEC</text><rect x="490" y="526" width="60" height="12" rx="2" fill="#2d3142"/><text x="520" y="535" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FORK, WAIT</text><rect x="380" y="302" width="56" height="12" rx="2" fill="#2d3142"/><text x="408" y="311" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EACH CALL</text><rect x="500" y="254" width="72" height="12" rx="2" fill="#2d3142"/><text x="536" y="263" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGE, BUILD</text><rect x="742" y="428" width="36" height="12" rx="2" fill="#2d3142"/><text x="760" y="437" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="678" y="404" width="36" height="12" rx="2" fill="#2d3142"/><text x="696" y="413" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SEATS</text><g data-node="external:Orchestrator"><rect x="48" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="48" y="64" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="156" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Orchestrator</text><text x="156" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the root session</text></g><g data-node="external:Worker"><rect x="48" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="48" y="192" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="156" y="220" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Worker</text><text x="156" y="236" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one row, one check</text></g><g data-node="external:Integrator"><rect x="288" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="288" y="64" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="396" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Integrator</text><text x="396" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">&lt;parent&gt;/integrate</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="680" y="576" width="216" height="56" rx="6" fill="#2d3142"/><rect x="680" y="576" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="788" y="604" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="788" y="620" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">jobs.jsonl, one per repo</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="560" y="320" width="216" height="56" rx="6" fill="#2d3142"/><rect x="560" y="320" width="216" height="56" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="668" y="348" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="668" y="364" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">every write and command</text></g><g data-node="group:Sandbox" data-drill="sandbox"><rect x="680" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="680" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="788" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sandbox</text><text x="788" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write grant, landlock applies it</text></g><g data-node="broker" data-anchor="broker"><rect x="560" y="448" width="216" height="56" rx="6" fill="#2d3142"/><rect x="560" y="448" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="668" y="476" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Broker</text><text x="668" y="492" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one machine budget</text></g><g data-node="vcs" data-anchor="vcs"><rect x="680" y="704" width="216" height="56" rx="6" fill="#2d3142"/><rect x="680" y="704" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="788" y="732" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">vcs</text><text x="788" y="748" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">checkpoint, merge</text></g><line x1="32" y1="812" x2="924" y2="812" stroke="#505466" stroke-width="0.8"/><text x="32" y="826" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="832" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="841" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE ENFORCER</text><rect x="192" y="832" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="841" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECLARED ROWS</text><rect x="352" y="832" width="10" height="10" rx="2" fill="#2d3142" stroke="#a9b1c2" stroke-width="0.8"/><text x="370" y="841" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">AGENT SESSIONS</text></g></svg>