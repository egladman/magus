<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1752 692" width="1752" height="692" role="img" aria-labelledby="agent-orchestration-title agent-orchestration-desc" class="magus-diagram"><metadata>{"figure":"agent-orchestration","stamp":"sha256:4ff7903a11edab27f0efe6e9c40fa51681ff95229dbdbf7a5bf1326065d5aee7"}</metadata><title id="agent-orchestration-title">Three roles, one store, and a guard at every boundary</title><desc id="agent-orchestration-desc">The orchestrator forks job rows into one JSON Lines store and waits on them; it never does groundwork. Each worker is bound to one row: its write paths, its one check, its own checkout, placed by the worktree bootstrap. The integrator merges the finished branches with git merge --no-ff, regenerates once and runs the full checks. The guard reads the row on every write and command. The sandbox narrows a run's writes to the same row, and its filesystem half applies that grant with landlock where the kernel has it. The broker holds the one build budget every checkout on the machine shares.</desc><defs><marker id="agent-orchestration-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="agent-orchestration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="agent-orchestration-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">ORCHESTRATION</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">Three roles, one store, and a guard at every boundary</text><g transform="translate(0,40)"><rect x="16" y="64" width="552" height="184" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="260" y="68" width="64" height="12" rx="2" fill="#2d3142"/><text x="292" y="77" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE ROLES</text><rect x="16" y="272" width="1704" height="284" rx="8" fill="#f5f5f5" stroke="#f5f5f5" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="776" y="276" width="184" height="12" rx="2" fill="#2d3142"/><text x="868" y="285" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT MAGUS HOLDS AND ENFORCES</text><path data-edge="external:Orchestrator->external:Worker" id="agent-orchestration-edge-external_3aOrchestrator-external_3aWorker" d="M 248 124 L 336 124" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="external:Orchestrator->internal/job" id="agent-orchestration-edge-external_3aOrchestrator-internal_2fjob" d="M 140 152 L 140 156 Q 140 164 148 164 L 1164 164 Q 1172 164 1172 172 L 1172 460 Q 1172 468 1180 468 L 1200 468" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="external:Worker->internal/guard" id="agent-orchestration-edge-external_3aWorker-internal_2fguard" d="M 552 124 L 588 124 Q 596 124 596 132 L 596 156 A 8 8 0 0 0 596 172 L 596 436 Q 596 444 604 444 L 624 444" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="external:Integrator->internal/guard" id="agent-orchestration-edge-external_3aIntegrator-internal_2fguard" d="M 248 204 L 572 204 Q 580 204 580 212 L 580 452 Q 580 460 588 460 L 624 460" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/job->vcs" id="agent-orchestration-edge-internal_2fjob-vcs" d="M 1416 492 L 1488 492" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/guard->internal/job" id="agent-orchestration-edge-internal_2fguard-internal_2fjob" d="M 744 480 L 744 484 Q 744 492 752 492 L 1200 492" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/guard->broker" id="agent-orchestration-edge-internal_2fguard-broker" d="M 840 452 L 912 452" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/guard->vcs" id="agent-orchestration-edge-internal_2fguard-vcs" d="M 732 480 L 732 496 Q 732 504 740 504 L 1148 504 Q 1156 504 1156 512 L 1156 532 Q 1156 540 1164 540 L 1444 540 Q 1452 540 1452 532 L 1452 512 Q 1452 504 1460 504 L 1488 504" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/sandbox->internal/job" id="agent-orchestration-edge-internal_2fsandbox-internal_2fjob" d="M 140 360 L 140 508 Q 140 516 148 516 L 1148 516 A 8 8 0 0 1 1164 516 L 1166 516 Q 1172 516 1172 510 L 1172 510 Q 1172 504 1178 504 L 1200 504" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="internal/sandbox->internal/sandbox/filesystem" id="agent-orchestration-edge-internal_2fsandbox-internal_2fsandbox_2ffilesystem" d="M 248 332 L 336 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="broker->internal/job" id="agent-orchestration-edge-broker-internal_2fjob" d="M 1128 452 L 1148 452 Q 1156 452 1156 460 L 1156 472 Q 1156 480 1164 480 L 1200 480" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><rect x="254" y="102" width="76" height="12" rx="2" fill="#2d3142"/><text x="292" y="111" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">./MAGUS, EXEC</text><rect x="626" y="142" width="60" height="12" rx="2" fill="#2d3142"/><text x="656" y="151" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FORK, WAIT</text><rect x="560" y="102" width="56" height="12" rx="2" fill="#2d3142"/><text x="588" y="111" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EACH CALL</text><rect x="376" y="182" width="72" height="12" rx="2" fill="#2d3142"/><text x="412" y="191" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGE, BUILD</text><rect x="866" y="470" width="36" height="12" rx="2" fill="#2d3142"/><text x="884" y="479" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="858" y="430" width="36" height="12" rx="2" fill="#2d3142"/><text x="876" y="439" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SEATS</text><rect x="270" y="310" width="44" height="12" rx="2" fill="#2d3142"/><text x="292" y="319" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">APPLIES</text><g data-node="external:Orchestrator"><rect x="32" y="96" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="96" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="140" y="124" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Orchestrator</text><text x="140" y="140" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the root session</text></g><g data-node="external:Worker"><rect x="336" y="96" width="216" height="56" rx="6" fill="#2d3142"/><rect x="336" y="96" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="444" y="124" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Worker</text><text x="444" y="140" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one row, one check</text></g><g data-node="external:Integrator"><rect x="32" y="176" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="176" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="140" y="204" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Integrator</text><text x="140" y="220" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">&lt;parent&gt;/integrate</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="1200" y="456" width="216" height="72" rx="6" fill="#2d3142"/><rect x="1200" y="456" width="216" height="72" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="1308" y="492" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="1308" y="508" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">jobs.jsonl, one per repo</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="624" y="424" width="216" height="56" rx="6" fill="#2d3142"/><rect x="624" y="424" width="216" height="56" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="732" y="452" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="732" y="468" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">every write and command</text></g><g data-node="internal/sandbox" data-anchor="internal/sandbox"><rect x="32" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sandbox</text><text x="140" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write grant from the row</text></g><g data-node="internal/sandbox/filesystem" data-anchor="internal/sandbox/filesystem"><rect x="336" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="336" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="444" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Landlock</text><text x="444" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the kernel applies the grant</text></g><g data-node="broker" data-anchor="broker"><rect x="912" y="424" width="216" height="56" rx="6" fill="#2d3142"/><rect x="912" y="424" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1020" y="452" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Broker</text><text x="1020" y="468" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one machine budget</text></g><g data-node="vcs" data-anchor="vcs"><rect x="1488" y="464" width="216" height="56" rx="6" fill="#2d3142"/><rect x="1488" y="464" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1596" y="492" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">vcs</text><text x="1596" y="508" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">checkpoint, merge</text></g><line x1="32" y1="592" x2="1720" y2="592" stroke="#505466" stroke-width="0.8"/><text x="32" y="606" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="612" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="621" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE ENFORCER</text><rect x="192" y="612" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="621" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECLARED ROWS</text><rect x="352" y="612" width="10" height="10" rx="2" fill="#2d3142" stroke="#a9b1c2" stroke-width="0.8"/><text x="370" y="621" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">AGENT SESSIONS</text></g></svg>