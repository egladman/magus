th="216" height="56" rx="6" fill="#2d3142"/><rect x="1488" y="424" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1596" y="452" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">vcs</text><text x="1596" y="468" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">checkpoint, merge</text></g><line x1="32" y1="552" x2="1720" y2="552" stroke="#505466" stroke-width="0.8"/><text x="32" y="566" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="572" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="581" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE ENFORCER</text><rect x="192" y="572" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="581" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECLARED ROWS</text><rect x="352" y="572" width="10" height="10" rx="2" fill="#2d3142" stroke="#a9b1c2" stroke-width="0.8"/><text x="370" y="581" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">AGENT SESSIONS</text><rect x="512" y="572" width="10" height="10" rx="2" fill="#393e53" stroke="#505466" stroke-width="0.8"/><text x="530" y="581" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">A SCRIPT</text></g></svg>