height="12" rx="2" fill="#2d3142"/><text x="292" y="191" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">./MAGUS, EXEC</text><rect x="560" y="182" width="56" height="12" rx="2" fill="#2d3142"/><text x="588" y="191" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EACH CALL</text><rect x="376" y="262" width="72" height="12" rx="2" fill="#2d3142"/><text x="412" y="271" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGE, BUILD</text><rect x="866" y="430" width="36" height="12" rx="2" fill="#2d3142"/><text x="884" y="439" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="858" y="390" width="36" height="12" rx="2" fill="#2d3142"/><text x="876" y="399" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SEATS</text><g data-node="external:Orchestrator"><rect x="32" y="96" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="96" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="140" y="124" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Orchestrator</text><text x="140" y="140" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the root session</text></g><g data-node="external:Worktree bootstrap"><rect x="32" y="176" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="176" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="204" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Worktree bootstrap</text><text x="140" y="220" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">places ./magus</text></g><g data-node="external:Worker"><rect x="336" y="176" width="216" height="56" rx="6" fill="#2d3142"/><rect x="336" y="176" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="444" y="204" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Worker</text><text x="444" y="220" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">one row, one check</text></g><g data-node="external:Integrator"><rect x="32" y="256" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="256" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="140" y="284" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Integrator</text><text x="140" y="300" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">&lt;parent&gt;/integrate</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="1200" y="416" width="216" height="72" rx="6" fill="#2d3142"/><rect x="1200" y="416" width="216" height="72" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="1308" y="452" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Job store</text><text x="1308"