-spacing="0.06em">FAILS AGAIN</text><g data-node="external:A target failed" data-anchor="internal/ci/volatility/volatility.go"><rect x="32" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">A target failed</text><text x="140" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">on, and opted in</text></g><g data-node="external:enough history?" data-anchor="internal/ci/volatility/volatility.go"><polygon points="140,192 248,220 140,248 32,220" fill="#2d3142"/><polygon points="140,192 248,220 140,248 32,220" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="224" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">enough history?</text></g><g data-node="external:diff touched it?" data-anchor="internal/ci/volatility/volatility.go"><polygon points="140,320 248,348 140,376 32,348" fill="#2d3142"/><polygon points="140,320 248,348 140,376 32,348" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="352" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">diff touched it?</text></g><g data-node="external:over threshold?" data-anchor="internal/ci/volatility/volatility.go"><polygon points="140,448 248,476 140,504 32,476" fill="#2d3142"/><polygon points="140,448 248,476 140,504 32,476" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="480" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">over threshold?</text></g><g data-node="external:Retry once" data-anchor="internal/ci/volatility/volatility.go"><rect x="164" y="576" width="216" height="56" rx="6" fill="#2d3142"/><rect x="164" y="576" width="216" height="56" rx="6" 