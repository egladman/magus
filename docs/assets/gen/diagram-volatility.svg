<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 896" width="768" height="896" role="img" aria-labelledby="volatility-title volatility-desc" class="magus-diagram"><metadata>{"figure":"volatility","stamp":"sha256:d8b635d2ef468da6ea6f58a376106826e022b6cb0f7bf61df5760f936cedd55c"}</metadata><title id="volatility-title">A failure is believed only when the diff touched a steady target</title><desc id="volatility-desc">A failing target that opted in is retried once while its history is too thin, when the diff did not touch its project, or when its volatility is above the threshold. A retry that passes is recorded as volatile; anything else is a suspected regression.</desc><defs><marker id="volatility-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="volatility-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="volatility-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">VOLATILITY</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">A failure is believed only when the diff touched a steady target</text><g transform="translate(0,40)"><path data-edge="external:A target failed->external:enough history?" id="volatility-edge-external_3aA_20target_20failed-external_3aenough_20history_3f" d="M 140 120 L 140 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:enough history?->external:diff touched it?" id="volatility-edge-external_3aenough_20history_3f-external_3adiff_20touched_20it_3f" d="M 140 