<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 628 1024" width="628" height="1024" role="img" aria-labelledby="volatility-title volatility-desc" class="magus-diagram"><metadata>{"figure":"volatility","stamp":"sha256:572a9559dbcce9371223ec8409f55371d801ea6a84a5e4ab06f9dd314a509897"}</metadata><title id="volatility-title">When a failure is retried, and when it is believed</title><desc id="volatility-desc">A failing target is retried once if history is too thin to judge, or if its measured volatility is above the threshold. A retry that passes is recorded as volatile and the run continues; anything else is a suspected regression.</desc><defs><marker id="volatility-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="volatility-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="volatility-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">VOLATILITY</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">When a failure is retried, and when it is believed</text><g transform="translate(0,40)"><path data-edge="external:Target fails->external:detection on?" id="volatility-edge-external_3aTarget_20fails-external_3adetection_20on_3f" d="M 140 120 L 140 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:detection on?->external:Report failure" id="volatility-edge-external_3adetection_20on_3f-external_3aReport_20failure" d="M 140 248 L 140 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:detection on?->external:enough history?" id="volatility-edge-external_3adetection_20on_3f-external_3aenough_20history_3f" d="M 248 220 L 372 220 Q 380 220 380 228 L 380 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:enough history?->external:over threshold?" id="volatility-edge-external_3aenough_20history_3f-external_3aover_20threshold_3f" d="M 380 376 L 380 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:enough history?->internal/retry" id="volatility-edge-external_3aenough_20history_3f-internal_2fretry" d="M 488 348 L 504 348 Q 512 348 512 356 L 512 532 Q 512 540 504 540 L 400 540 Q 392 540 392 548 L 392 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:over threshold?->internal/retry" id="volatility-edge-external_3aover_20threshold_3f-internal_2fretry" d="M 380 504 L 380 576" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:over threshold?->external:Suspected regression" id="volatility-edge-external_3aover_20threshold_3f-external_3aSuspected_20regression" d="M 272 476 L 256 476 Q 248 476 248 484 L 248 832" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="internal/retry->external:retry passed?" id="volatility-edge-internal_2fretry-external_3aretry_20passed_3f" d="M 380 632 L 380 704" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:retry passed?->external:Record volatile" id="volatility-edge-external_3aretry_20passed_3f-external_3aRecord_20volatile" d="M 380 760 L 380 788 Q 380 796 388 796 L 480 796 Q 488 796 488 804 L 488 832" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><path data-edge="external:retry passed?->external:Suspected regression" id="volatility-edge-external_3aretry_20passed_3f-external_3aSuspected_20regression" d="M 272 732 L 268 732 Q 260 732 260 740 L 260 832" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#volatility-arrow-default)"/><rect x="150" y="276" width="20" height="12" rx="2" fill="#2d3142"/><text x="160" y="285" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="300" y="198" width="24" height="12" rx="2" fill="#2d3142"/><text x="312" y="207" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="390" y="404" width="24" height="12" rx="2" fill="#2d3142"/><text x="402" y="413" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="424" y="518" width="56" height="12" rx="2" fill="#2d3142"/><text x="452" y="527" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BOOTSTRAP</text><rect x="346" y="532" width="24" height="12" rx="2" fill="#2d3142"/><text x="358" y="541" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="242" y="454" width="20" height="12" rx="2" fill="#2d3142"/><text x="252" y="463" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="420" y="774" width="24" height="12" rx="2" fill="#2d3142"/><text x="432" y="783" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="270" y="772" width="20" height="12" rx="2" fill="#2d3142"/><text x="280" y="781" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><g data-node="external:Target fails"><rect x="32" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Target fails</text></g><g data-node="external:detection on?"><polygon points="140,192 248,220 140,248 32,220" fill="#2d3142"/><polygon points="140,192 248,220 140,248 32,220" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="224" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">detection on?</text></g><g data-node="external:Report failure"><rect x="32" y="320" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="320" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Report failure</text></g><g data-node="external:enough history?"><polygon points="380,320 488,348 380,376 272,348" fill="#2d3142"/><polygon points="380,320 488,348 380,376 272,348" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="380" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">enough history?</text></g><g data-node="external:over threshold?"><polygon points="380,448 488,476 380,504 272,476" fill="#2d3142"/><polygon points="380,448 488,476 380,504 272,476" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="380" y="480" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">over threshold?</text></g><g data-node="internal/retry" data-anchor="internal/retry"><rect x="272" y="576" width="216" height="56" rx="6" fill="#2d3142"/><rect x="272" y="576" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="380" y="604" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Retry once</text><text x="380" y="620" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the same target</text></g><g data-node="external:retry passed?"><polygon points="380,704 488,732 380,760 272,732" fill="#2d3142"/><polygon points="380,704 488,732 380,760 272,732" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="380" y="736" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">retry passed?</text></g><g data-node="external:Record volatile"><rect x="380" y="832" width="216" height="56" rx="6" fill="#2d3142"/><rect x="380" y="832" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="488" y="860" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Record volatile</text><text x="488" y="876" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the run continues</text></g><g data-node="external:Suspected regression"><rect x="14