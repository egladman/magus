<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 1024" width="612" height="1024" role="img" aria-labelledby="volatility-title volatility-desc" class="magus-diagram"><title id="volatility-title">When a failure is retried, and when it is believed</title><desc id="volatility-desc">A failing target is retried once if history is too thin to judge, or if its measured volatility is above the threshold. A retry that passes is recorded as volatile and the run continues; anything else is a suspected regression.</desc><defs><marker id="volatility-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="volatility-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="volatility-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">VOLATILITY</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">When a failure is retried, and when it is believed</text><g transform="translate(0,40)"><path d="M 260 120 L 260 192" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 152 220 L 148 220 Q 140 220 140 228 L 140 320" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 260 248 L 260 276 Q 260 284 268 284 L 372 284 Q 380 284 380 292 L 380 320" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 380 376 L 380 512 Q 380 520 388 520 L 408 520 Q 416 520 416 528 L 416 576" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 272 348 L 268 348 Q 260 348 260 356 L 260 404 Q 260 412 252 412 L 148 412 Q 140 412 140 420 L 140 448" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 140 504 L 140 532 Q 140 540 148 540 L 336 540 Q 344 540 344 548 L 344 576" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 32 476 L 28 476 Q 20 476 20 484 L 20 548 Q 20 556 28 556 L 132 556 Q 140 556 140 564 L 140 776 Q 140 784 132 784 L 112 784 Q 104 784 104 792 L 104 832" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 380 632 L 380 704" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 380 760 L 380 832" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><path d="M 272 732 L 268 732 Q 260 732 260 740 L 260 800 Q 260 808 252 808 L 184 808 Q 176 808 176 816 L 176 832" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#volatility-arrow-default)"/><rect x="152" y="260" width="20" height="12" rx="2" fill="#13171f"/><text x="162" y="269" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="308" y="262" width="24" height="12" rx="2" fill="#13171f"/><text x="320" y="271" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="392" y="440" width="56" height="12" rx="2" fill="#13171f"/><text x="420" y="449" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BOOTSTRAP</text><rect x="188" y="390" width="24" height="12" rx="2" fill="#13171f"/><text x="200" y="399" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="228" y="518" width="24" height="12" rx="2" fill="#13171f"/><text x="240" y="527" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="152" y="660" width="20" height="12" rx="2" fill="#13171f"/><text x="162" y="669" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="392" y="788" width="24" height="12" rx="2" fill="#13171f"/><text x="404" y="797" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="206" y="786" width="20" height="12" rx="2" fill="#13171f"/><text x="216" y="795" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="152" y="64" width="216" height="56" rx="6" fill="#13171f"/><rect x="152" y="64" width="216" height="56" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="260" y="96" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Target fails</text><polygon points="260,192 368,220 260,248 152,220" fill="#13171f"/><polygon points="260,192 368,220 260,248 152,220" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="260" y="224" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">detection on?</text><rect x="32" y="320" width="216" height="56" rx="6" fill="#13171f"/><rect x="32" y="320" width="216" height="56" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="140" y="352" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Report failure</text><polygon points="380,320 488,348 380,376 272,348" fill="#13171f"/><polygon points="380,320 488,348 380,376 272,348" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="380" y="352" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">enough history?</text><polygon points="140,448 248,476 140,504 32,476" fill="#13171f"/><polygon points="140,448 248,476 140,504 32,476" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="140" y="480" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">over threshold?</text><rect x="272" y="576" width="216" height="56" rx="6" fill="#13171f"/><rect x="272" y="576" width="216" height="56" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="380" y="604" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Retry once</text><text x="380" y="620" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the same target</text><polygon points="380,704 488,732 380,760 272,732" fill="#13171f"/><polygon points="380,704 488,732 380,760 272,732" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="380" y="736" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">retry passed?</text><rect x="272" y="832" width="216" height="56" rx="6" fill="#13171f"/><rect x="272" y="832" width="216" height="56" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="380" y="860" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Record volatile</text><text x="380" y="876" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the run continues</text><rect x="32" y="832" width="216" height="56" rx="6" fill="#13171f"/><rect x="32" y="832" width="216" height="56" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><text x="140" y="860" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Suspected regression</text><text x="140" y="876" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">chase with --bisect</text><line x1="32" y1="936" x2="580" y2="936" stroke="#202632" stroke-width="0.8"/><rect x="32" y="944" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="953" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WANTS A HUMAN</text></g></svg>