<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 364" width="856" height="364" role="img" aria-labelledby="buzz-packages-title buzz-packages-desc" class="magus-diagram"><metadata>{"figure":"buzz-packages","stamp":"sha256:704789be0405249ba9cc1e6b4973714e94286ac12e789b02940fb59490102627"}</metadata><title id="buzz-packages-title">The root package drives every step; vm runs what it compiles</title><desc id="buzz-packages-desc">The gopherbuzz root package holds the session and every compile step. It reads tokens from token, builds trees from ast, checks them against types, and hands the chunk it compiles to vm, which runs it.</desc><defs><marker id="buzz-packages-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="buzz-packages-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="buzz-packages-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">GOPHERBUZZ</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">The root package drives every step; vm runs what it compiles</text><g transform="translate(0,40)"><path data-edge="libs/gopherbuzz->libs/gopherbuzz/token" id="buzz-packages-edge-libs_2fgopherbuzz-libs_2fgopherbuzz_2ftoken" d="M 140 136 L 140 100 Q 140 92 148 92 L 320 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-packages-arrow-default)"/><path data-edge="libs/gopherbuzz->libs/gopherbuzz/ast" id="buzz-packages-edge-libs_2fgopherbuzz-libs_2fgopherbuzz_2fast" d="M 140 208 L 140 284 Q 140 292 148 292 L 564 292 Q 572 292 572 284 L 572 272 Q 572 264 580 264 L 608 264" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-packages-arrow-default)"/><path data-edge="libs/gopherbuzz->libs/gopherbuzz/types" id="buzz-packages-edge-libs_2fgopherbuzz-libs_2fgopherbuzz_2ftypes" d="M 248 172 L 320 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-packages-arrow-default)"/><path data-edge="libs/gopherbuzz->libs/gopherbuzz/vm" id="buzz-packages-edge-libs_2fgopherbuzz-libs_2fgopherbuzz_2fvm" d="M 152 208 L 152 244 Q 152 252 160 252 L 320 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-packages-arrow-default)"/><path data-edge="libs/gopherbuzz/types->libs/gopherbuzz/ast" id="buzz-packages-edge-libs_2fgopherbuzz_2ftypes-libs_2fgopherbuzz_2fast" d="M 536 172 L 564 172 Q 572 172 572 180 L 572 232 Q 572 240 580 240 L 608 240" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-packages-arrow-default)"/><path data-edge="libs/gopherbuzz/vm->libs/gopherbuzz/ast" id="buzz-packages-edge-libs_2fgopherbuzz_2fvm-libs_2fgopherbuzz_2fast" d="M 536 252 L 608 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-packages-arrow-default)"/><g data-node="libs/gopherbuzz" data-anchor="libs/gopherbuzz" data-drill="buzz-compile"><rect x="32" y="136" width="216" height="72" rx="6" fill="#2d3142"/><rect x="32" y="136" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="140" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Session</text><text x="140" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">parse, import, check, compile</text></g><g data-node="libs/gopherbuzz/token" data-anchor="libs/gopherbuzz/token"><rect x="320" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Lexer</text><text x="428" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">token.Tokenize</text></g><g data-node="libs/gopherbuzz/ast" data-anchor="libs/gopherbuzz/ast"><rect x="608" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Syntax tree</text><text x="716" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ast.Program</text></g><g data-node="libs/gopherbuzz/types" data-anchor="libs/gopherbuzz/types"><rect x="320" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Types</text><text x="428" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">types.Type</text></g><g data-node="libs/gopherbuzz/vm" data-anchor="libs/gopherbuzz/vm" data-drill="buzz-run"><rect x="320" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">VM</text><text x="428" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">interpreter, baseline JIT</text></g></g></svg>