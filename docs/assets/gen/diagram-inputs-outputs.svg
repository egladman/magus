<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 680" width="880" height="680" role="img" aria-labelledby="inputs-outputs-title inputs-outputs-desc" class="magus-diagram"><metadata>{"figure":"inputs-outputs","stamp":"sha256:b71ba2d225d0aa2b020694ab1aaaeec9fd8c28dc35563f41fef908336cdfd2e8"}</metadata><title id="inputs-outputs-title">An output stops at a nested project; an input does not</title><desc id="inputs-outputs-desc">A target's ctx.readsFiles and ctx.writesFiles globs resolve from its own project's directory. The source walk matches every file a glob names, so the root's **/*.go keys every nested Go file too. An output glob claims a file inside a nested project only when the glob is rooted there; the snapshot, the replay and the drift gate all ask the same rule, and a write that lands there anyway fails the run as MGS3001. A nested project reads the root's tree through a project handle, workspace\file, which also makes the root its upstream. The matched files and the probed tool versions are the key; an input nobody declared never reaches it.</desc><defs><marker id="inputs-outputs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="inputs-outputs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="inputs-outputs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">INPUTS AND OUTPUTS</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">An output stops at a nested project; an input does not</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="200" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="92" y="68" width="96" height="12" rx="2" fill="#2d3142"/><text x="140" y="77" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ROOT PROJECT .</text><rect x="16" y="288" width="544" height="112" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="234" y="292" width="108" height="12" rx="2" fill="#2d3142"/><text x="288" y="301" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">A NESTED PROJECT</text><rect x="16" y="424" width="832" height="120" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="400" y="428" width="64" height="12" rx="2" fill="#2d3142"/><text x="432" y="437" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE CACHE</text><path data-edge="external:readsFiles(&quot;**/*.go&quot;)->internal/cache" id="inputs-outputs-edge-external_3areadsFiles_28_22_2a_2a_2f_2a_2ego_22_29-internal_2fcache" d="M 248 216 L 280 216 Q 288 216 288 224 L 288 472 Q 288 480 296 480 L 328 480" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="external:writesFiles(&quot;**/gen/mocks/*.go&quot;)->internal/audit" id="inputs-outputs-edge-external_3awritesFiles_28_22_2a_2a_2fgen_2fmocks_2f_2a_2ego_22_29-internal_2faudit" d="M 248 120 L 304 120 Q 312 120 312 128 L 312 344 Q 312 352 320 352 L 328 352" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="external:writesFiles(&quot;**/gen/mocks/*.go&quot;)->internal/cache" id="inputs-outputs-edge-external_3awritesFiles_28_22_2a_2a_2fgen_2fmocks_2f_2a_2ego_22_29-internal_2fcache" d="M 248 136 L 292 136 Q 300 136 300 144 L 300 460 Q 300 468 308 468 L 328 468" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="external:workspace\file(...)->internal/cache" id="inputs-outputs-edge-external_3aworkspace_5cfile_28_2e_2e_2e_29-internal_2fcache" d="M 248 352 L 268 352 Q 276 352 276 360 L 276 484 Q 276 492 284 492 L 328 492" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-accent)"/><path data-edge="external:Tool probe->internal/cache" id="inputs-outputs-edge-external_3aTool_20probe-internal_2fcache" d="M 248 492 L 258 492 Q 264 492 264 498 L 264 498 Q 264 504 270 504 L 328 504" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="internal/cache->types" id="inputs-outputs-edge-internal_2fcache-types" d="M 544 492 L 616 492" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><rect x="260" y="194" width="32" height="12" rx="2" fill="#2d3142"/><text x="276" y="203" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SRC:</text><rect x="256" y="98" width="64" height="12" rx="2" fill="#2d3142"/><text x="288" y="107" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">STRAY WRITE</text><rect x="310" y="396" width="52" height="12" rx="2" fill="#2d3142"/><text x="336" y="405" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SNAPSHOT</text><rect x="194" y="412" width="72" height="12" rx="2" fill="#2d3142"/><text x="230" y="421" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">+ DEPENDS_ON</text><rect x="278" y="514" width="36" height="12" rx="2" fill="#2d3142"/><text x="296" y="523" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">TOOL:</text><g data-node="external:readsFiles(&quot;**/*.go&quot;)"><rect x="32" y="184" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="184" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="40" y="192" width="36" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="58" y="201" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROOT</text><text x="140" y="224" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">readsFiles(&quot;**/*.go&quot;)</text><text x="140" y="240" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">matches nested files too</text></g><g data-node="external:writesFiles(&quot;**/gen/mocks/*.go&quot;)"><rect x="32" y="96" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="96" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="40" y="104" width="36" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="58" y="113" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROOT</text><text x="140" y="136" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">writesFiles(&quot;**/gen/mocks/*.go&quot;)</text><text x="140" y="152" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the root's gen/ only</text></g><g data-node="external:workspace\file(...)"><rect x="32" y="320" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="320" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="40" y="328" width="36" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="58" y="337" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">DOCS</text><text x="140" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">workspace\file(...)</text><text x="140" y="376" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the root's tree, as upstream</text></g><g data-node="internal/audit" data-anchor="internal/audit"><rect x="328" y="320" width="216" height="64" rx="6" fill="#2d3142"/><rect x="328" y="320" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="436" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Descendant audit</text><text x="436" y="368" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">MGS3001 on a write inside</text></g><g data-node="external:Tool probe"><rect x="32" y="460" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="460" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="492" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Tool probe</text><text x="140" y="508" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the version, or UNPROBED</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="328" y="456" width="216" height="72" rx="6" fill="#2d3142"/><rect x="328" y="456" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="436" y="492" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Cache key</text><text x="436" y="508" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">source walk, key, snapshot</text></g><g data-node="types" data-anchor="types"><rect x="616" y="460" width="216" height="64" rx="6" fill="#2d3142"/><rect x="616" y="460" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="724" y="492" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Output claim</text><text x="724" y="508" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">stops at a nested dir</text></g><line x1="32" y1="580" x2="848" y2="580" stroke="#505466" stroke-width="0.8"/><text x="32" y="594" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="600" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="609" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT A HIT IS KEYED ON</text></g></svg>