<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1432 336" width="1432" height="336" role="img" aria-labelledby="oci-assembly-title oci-assembly-desc" class="magus-diagram"><metadata>{"figure":"oci-assembly","stamp":"sha256:72c651ecb7268779dc789ce21b92b29782ddf3064abe1a21241c12f5a454096c"}</metadata><title id="oci-assembly-title">OCI assembly: files in, a layout out, a registry after</title><desc id="oci-assembly-desc">Built files and an optional digest-pinned base reach libs/image through the image host module. libs/image assembles each layer, stages one layout per platform, combines the layouts into an index and attaches referrers, cloning files copy-on-write where the filesystem has it. libs/oci is the registry client: it resolves the base by digest and publishes the result.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="oci-assembly-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="oci-assembly-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="oci-assembly-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">IMAGES</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">OCI assembly: files in, a layout out, a registry after</text><g transform="translate(0,40)"><path data-edge="external:Built files->std" id="oci-assembly-edge-external_3aBuilt_20files-std" d="M 248 92 L 320 92" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="external:Pinned base->libs/oci" id="oci-assembly-edge-external_3aPinned_20base-libs_2foci" d="M 248 172 L 852 172 Q 860 172 860 164 L 860 152 Q 860 144 868 144 L 896 144" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="std->libs/image" id="oci-assembly-edge-std-libs_2fimage" d="M 536 92 L 608 92" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="std->libs/oci" id="oci-assembly-edge-std-libs_2foci" d="M 428 120 L 428 124 Q 428 132 436 132 L 896 132" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="libs/image->libs/oci" id="oci-assembly-edge-libs_2fimage-libs_2foci" d="M 824 92 L 852 92 Q 860 92 860 100 L 860 112 Q 860 120 868 120 L 896 120" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="libs/oci->external:Registry" id="oci-assembly-edge-libs_2foci-external_3aRegistry" d="M 1112 132 L 1184 132" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><rect x="524" y="150" width="56" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="552" y="159" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">BY DIGEST</text><rect x="1126" y="110" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="1148" y="119" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PUBLISH</text><g data-node="external:Built files"><rect x="32" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Built files</text></g><g data-node="external:Pinned base"><rect x="32" y="144" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="1.2" stroke-dasharray="4,3"/><text x="140" y="172" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Pinned base</text><text x="140" y="188" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">optional, by digest</text></g><g data-node="std" data-anchor="std"><rect x="320" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="428" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">image module</text><text x="428" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write, index, publish</text></g><g data-node="libs/image" data-anchor="libs/image"><rect x="608" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="64" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="716" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Layout assembly</text><text x="716" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">layers, platforms, index</text></g><g data-node="libs/oci" data-anchor="libs/oci"><rect x="896" y="104" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="896" y="104" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1004" y="132" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Registry client</text><text x="1004" y="148" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">resolve, push, referrers</text></g><g data-node="external:Registry"><rect x="1184" y="104" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1184" y="104" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="1292" y="136" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Registry</text></g><line x1="32" y1="236" x2="1400" y2="236" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="250" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="256" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="0.8"/><text x="50" y="265" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHERE LAYERS ARE BUILT</text><rect x="192" y="256" width="10" height="10" rx="2" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="265" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT MAGUS BUILT</text><rect x="352" y="256" width="10" height="10" rx="2" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="0.8"/><text x="370" y="265" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OPTIONAL</text><rect x="512" y="256" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="0.8"/><text x="530" y="265" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>