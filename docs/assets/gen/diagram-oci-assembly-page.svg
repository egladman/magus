<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1720 272" width="1720" height="272" role="img" aria-labelledby="oci-assembly-title oci-assembly-desc" class="magus-diagram"><metadata>{"figure":"oci-assembly","stamp":"sha256:6c16e6a552c718c2b74b9a0f29dc2a14e5b806af16572ba8e75e4be182f5c115"}</metadata><title id="oci-assembly-title">Proposed OCI assembly flow</title><desc id="oci-assembly-desc">Built files and an optional digest-pinned base feed image.write, which stages one layout per platform. image.index combines the layouts, then image.publish sends the result to a registry. These API calls remain proposed.</desc><defs><marker id="oci-assembly-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="oci-assembly-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="oci-assembly-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">PROPOSED</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Proposed OCI assembly flow</text><g transform="translate(0,40)"><path data-edge="external:Built files->external:image.write" id="oci-assembly-edge-external_3aBuilt_20files-external_3aimage_2ewrite" d="M 248 92 L 320 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="external:image.write->external:Platform layouts" id="oci-assembly-edge-external_3aimage_2ewrite-external_3aPlatform_20layouts" d="M 536 92 L 608 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="external:Pinned base->external:image.write" id="oci-assembly-edge-external_3aPinned_20base-external_3aimage_2ewrite" d="M 248 172 L 276 172 Q 284 172 284 164 L 284 112 Q 284 104 292 104 L 320 104" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="external:Platform layouts->external:image.index" id="oci-assembly-edge-external_3aPlatform_20layouts-external_3aimage_2eindex" d="M 824 92 L 896 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="external:image.index->external:image.publish" id="oci-assembly-edge-external_3aimage_2eindex-external_3aimage_2epublish" d="M 1112 92 L 1184 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><path data-edge="external:image.publish->external:Registry" id="oci-assembly-edge-external_3aimage_2epublish-external_3aRegistry" d="M 1400 92 L 1472 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#oci-assembly-arrow-default)"/><g data-node="external:Built files"><rect x="32" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="140" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Built files</text></g><g data-node="external:image.write"><rect x="320" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="320" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><text x="428" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">image.write</text></g><g data-node="external:Pinned base"><rect x="32" y="144" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="144" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2" stroke-dasharray="4,3"/><text x="140" y="172" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Pinned base</text><text x="140" y="188" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">optional, by digest</text></g><g data-node="external:Platform layouts"><rect x="608" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="716" y="92" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Platform layouts</text><text x="716" y="108" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">one per platform</text></g><g data-node="external:image.index"><rect x="896" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="896" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1004" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">image.index</text></g><g data-node="external:image.publish"><rect x="1184" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="1184" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1292" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">image.publish</text></g><g data-node="external:Registry"><rect x="1472" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="1472" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1580" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Registry</text></g></g></svg>