-ligatures:none" text-anchor="middle">one per platform</text></g><g data-node="external:image.index"><rect x="896" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="896" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1004" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">image.index</text></g><g data-node="external:image.publish"><rect x="1184" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1184" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1292" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">image.publish</text></g><g data-node="external:Registry"><rect x="1472" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1472" y="64" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="1580" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Registry</text></g></g></svg>