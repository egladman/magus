<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 808" width="1040" height="808" role="img" aria-labelledby="guard-path-title guard-path-desc" class="magus-diagram"><metadata>{"diagram":"guard-path","stamp":"sha256:eb75cfc887132ff7427478ff74851bae42d598862e8d5ffeb19c134291398f25"}</metadata><title id="guard-path-title">One command judges every call, and says what to run instead</title><desc id="guard-path-desc">The host's PreToolUse hook pipes each event to magus shell. The built-in rules judge it first, reading the job store for the call's lease and the session record; the workspace's own rule sees only what they let through. Each judgment goes to the activity log, and a deny names the command to run instead.</desc><style>.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#f5f5f5);--magus-diagram-paint-fill:var(--magus-diagram-fill,#ffffff);--magus-diagram-paint-ink:var(--magus-diagram-ink,#2d3142);--magus-diagram-paint-muted:var(--magus-diagram-muted,#4f5d75);--magus-diagram-paint-soft:var(--magus-diagram-soft,#5f6780);--magus-diagram-paint-rule:var(--magus-diagram-rule,#e6e6e8);--magus-diagram-paint-accent:var(--magus-diagram-accent,#eb6c36);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-diagram-paint-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#2d3142);--magus-diagram-paint-fill:var(--magus-diagram-fill,#393e53);--magus-diagram-paint-ink:var(--magus-diagram-ink,#f5f5f5);--magus-diagram-paint-muted:var(--magus-diagram-muted,#bfc0c0);--magus-diagram-paint-soft:var(--magus-diagram-soft,#a9b1c2);--magus-diagram-paint-rule:var(--magus-diagram-rule,#505466);--magus-diagram-paint-accent:var(--magus-diagram-accent,#f08a59);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-diagram-paint-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-diagram-paint-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-diagram-paint-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-diagram-paint-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-diagram-paint-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-diagram-paint-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-diagram-paint-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-diagram-paint-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-diagram-paint-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-diagram-paint-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-diagram-paint-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-diagram-paint-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-diagram-paint-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-diagram-paint-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-diagram-paint-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-diagram-paint-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-diagram-paint-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="guard-path-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="guard-path-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="guard-path-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">GUARD</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">One command judges every call, and says what to run instead</text><g transform="translate(0,40)"><path data-edge="external:Host hook->cmd/magus" id="guard-path-edge-external_3aHost_20hook-cmd_2fmagus" d="M 620 128 L 620 200" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="cmd/magus->internal/guard" id="guard-path-edge-cmd_2fmagus-internal_2fguard" d="M 620 264 L 620 336" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/guard/builtin" id="guard-path-edge-internal_2fguard-internal_2fguard_2fbuiltin" d="M 728 368 L 972 368 Q 980 368 980 376 L 980 556 Q 980 564 972 564 L 160 564 Q 152 564 152 572 L 152 608" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/job" id="guard-path-edge-internal_2fguard-internal_2fjob" d="M 512 368 L 148 368 Q 140 368 140 376 L 140 472" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/sessions" id="guard-path-edge-internal_2fguard-internal_2fsessions" d="M 512 380 L 388 380 Q 380 380 380 388 L 380 472" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/recorder" id="guard-path-edge-internal_2fguard-internal_2frecorder" d="M 620 400 L 620 472" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->external:Workspace rules" id="guard-path-edge-internal_2fguard-external_3aWorkspace_20rules" d="M 728 380 L 852 380 Q 860 380 860 388 L 860 472" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->external:Verdict" id="guard-path-edge-internal_2fguard-external_3aVerdict" d="M 728 356 L 984 356 Q 992 356 992 364 L 992 572 Q 992 580 984 580 L 880 580 Q 872 580 872 588 L 872 608" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/job->internal/guard/builtin" id="guard-path-edge-internal_2fjob-internal_2fguard_2fbuiltin" d="M 140 536 L 140 608" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="external:Workspace rules->external:Verdict" id="guard-path-edge-external_3aWorkspace_20rules-external_3aVerdict" d="M 860 536 L 860 556 A 8 8 0 0 0 860 572 L 860 608" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="external:Verdict->external:Host hook" id="guard-path-edge-external_3aVerdict-external_3aHost_20hook" d="M 968 640 L 1000 640 Q 1008 640 1008 632 L 1008 104 Q 1008 96 1000 96 L 728 96" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#guard-path-arrow-default)"/><rect x="630" y="156" width="72" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="666" y="165" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ARGV + STDIN</text><rect x="630" y="292" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="650" y="301" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JUDGES</text><rect x="546" y="542" width="36" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="564" y="551" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RULES</text><rect x="306" y="346" width="36" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="324" y="355" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="422" y="390" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="444" y="399" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">HISTORY</text><rect x="630" y="428" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="652" y="437" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RECORDS</text><rect x="760" y="390" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="792" y="399" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LET THROUGH</text><rect x="850" y="74" width="36" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="868" y="83" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPLY</text><g data-node="external:Host hook"><rect x="512" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="512" y="64" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" class="magus-fill-paper magus-stroke-soft" stroke-width="1.2"/><rect x="520" y="72" width="60" height="12" rx="2" fill="none" stroke="#5f6780" class="magus-stroke-soft" stroke-width="0.8"/><text x="550" y="81" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SETTINGS</text><text x="620" y="104" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Host hook</text><text x="620" y="120" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">PreToolUse, stdin JSON</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="512" y="200" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="512" y="200" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="620" y="232" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">magus shell</text><text x="620" y="248" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the guard with one door</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="512" y="336" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="512" y="336" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="620" y="368" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Built-in rules</text><text x="620" y="384" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">judged first, in order</text></g><g data-node="internal/guard/builtin" data-anchor="internal/guard/builtin"><rect x="32" y="608" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="608" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="640" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Rule catalog</text><text x="140" y="656" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ids and grades</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="32" y="472" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="472" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="140" y="504" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="140" y="520" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">leases, write paths</text></g><g data-node="internal/sessions" data-anchor="internal/sessions"><rect x="272" y="472" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="272" y="472" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="380" y="504" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Session record</text><text x="380" y="520" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what this session did</text></g><g data-node="internal/recorder" data-anchor="internal/recorder"><rect x="512" y="472" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="512" y="472" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="620" y="504" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Activity log</text><text x="620" y="520" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">every judgment kept</text></g><g data-node="external:Workspace rules"><rect x="752" y="472" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="752" y="472" width="216" height="64" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="860" y="504" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Workspace rules</text><text x="860" y="520" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus\guard.command, can only add</text></g><g data-node="external:Verdict"><rect x="752" y="608" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="752" y="608" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="860" y="640" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Verdict</text><text x="860" y="656" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">deny, advise or pass, with next:</text></g><line x1="32" y1="708" x2="1008" y2="708" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="722" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="728" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="0.8"/><text x="50" y="737" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT THE AGENT READS</text><rect x="192" y="728" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#5f6780" class="magus-fill-paper magus-stroke-soft" stroke-width="0.8"/><text x="210" y="737" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE HOST'S SIDE</text><rect x="352" y="728" width="10" height="10" rx="2" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="0.8"/><text x="370" y="737" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THIS REPO'S RULES</text><rect x="512" y="728" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="0.8"/><text x="530" y="737" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY RECORDS</text></g></svg>