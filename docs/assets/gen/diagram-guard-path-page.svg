<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 556" width="1456" height="556" role="img" aria-labelledby="guard-path-title guard-path-desc" class="magus-diagram"><metadata>{"figure":"guard-path","stamp":"sha256:b7594a6ea733bd6c11fbe1e9c2cefea4f10c28e06aef9796ec9292da238444f1"}</metadata><title id="guard-path-title">One command judges every call, and says what to run instead</title><desc id="guard-path-desc">The host's PreToolUse hook, wired by magus agent harness install, pipes the event to magus shell. The built-in rules judge it first, reading the job store for the lease the call acts as; the workspace's magus\guard.command rule sees only what they let through and can only add to the verdict. A deny carries its reason and a next: breadcrumb naming the command to run instead, and the hook renders it into the host's reply.</desc><defs><marker id="guard-path-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="guard-path-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="guard-path-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">GUARD</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One command judges every call, and says what to run instead</text><g transform="translate(0,40)"><path data-edge="external:Host hook->cmd/magus" id="guard-path-edge-external_3aHost_20hook-cmd_2fmagus" d="M 248 288 L 336 288" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="cmd/magus->internal/guard" id="guard-path-edge-cmd_2fmagus-internal_2fguard" d="M 552 288 L 624 288" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/guard/builtin" id="guard-path-edge-internal_2fguard-internal_2fguard_2fbuiltin" d="M 732 252 L 732 120 Q 732 112 740 112 L 920 112" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/job" id="guard-path-edge-internal_2fguard-internal_2fjob" d="M 744 252 L 744 208 Q 744 200 752 200 L 920 200" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->external:Workspace rules" id="guard-path-edge-internal_2fguard-external_3aWorkspace_20rules" d="M 840 288 L 920 288" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->external:Verdict" id="guard-path-edge-internal_2fguard-external_3aVerdict" d="M 732 324 L 732 412 Q 732 420 740 420 L 1164 420 Q 1172 420 1172 412 L 1172 308 Q 1172 300 1180 300 L 1208 300" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="internal/guard->internal/hint" id="guard-path-edge-internal_2fguard-internal_2fhint" d="M 744 324 L 744 368 Q 744 376 752 376 L 920 376" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="external:Workspace rules->external:Verdict" id="guard-path-edge-external_3aWorkspace_20rules-external_3aVerdict" d="M 1136 288 L 1208 288" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="external:Verdict->external:Host hook" id="guard-path-edge-external_3aVerdict-external_3aHost_20hook" d="M 1316 256 L 1316 72 Q 1316 64 1308 64 L 148 64 Q 140 64 140 72 L 140 256" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#guard-path-arrow-default)"/><rect x="256" y="266" width="72" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="292" y="275" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ARGV + STDIN</text><rect x="568" y="266" width="40" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="588" y="275" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JUDGES</text><rect x="806" y="90" width="36" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="824" y="99" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GRADE</text><rect x="814" y="178" width="36" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="832" y="187" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="848" y="266" width="64" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="880" y="275" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LET THROUGH</text><rect x="816" y="354" width="32" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="832" y="363" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NEXT</text><rect x="710" y="42" width="36" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="728" y="51" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPLY</text><g data-node="external:Host hook"><rect x="32" y="256" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="256" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><rect x="40" y="264" width="60" height="12" rx="2" fill="none" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="70" y="273" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SETTINGS</text><text x="140" y="296" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Host hook</text><text x="140" y="312" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">PreToolUse, stdin JSON</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="336" y="256" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="336" y="256" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="444" y="288" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus shell</text><text x="444" y="304" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the guard with one door</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="624" y="252" width="216" height="72" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="624" y="252" width="216" height="72" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="732" y="288" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Built-in rules</text><text x="732" y="304" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">catalogued, run first</text></g><g data-node="internal/guard/builtin" data-anchor="internal/guard/builtin"><rect x="920" y="80" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="920" y="80" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1028" y="112" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Rule grades</text><text x="1028" y="128" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">deny, advise or off per rule</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="920" y="168" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="920" y="168" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1028" y="200" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Job store</text><text x="1028" y="216" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">leases, write paths</text></g><g data-node="external:Workspace rules"><rect x="920" y="256" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="920" y="256" width="216" height="64" rx="6" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="1028" y="288" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace rules</text><text x="1028" y="304" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus\guard.command, can only add</text></g><g data-node="external:Verdict"><rect x="1208" y="256" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="1208" y="256" width="216" height="64" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><text x="1316" y="288" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Verdict</text><text x="1316" y="304" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">deny, advise or pass</text></g><g data-node="internal/hint" data-anchor="internal/hint"><rect x="920" y="344" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="920" y="344" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1028" y="376" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">next: breadcrumb</text><text x="1028" y="392" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">a command to run</text></g><line x1="32" y1="456" x2="1424" y2="456" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="32" y="470" fill="var(--magus-diagram-muted, #4f5d75)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="476" width="10" height="10" rx="2" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="0.8"/><text x="50" y="485" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT THE AGENT READS</text><rect x="192" y="476" width="10" height="10" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="210" y="485" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE HOST'S SIDE</text><rect x="352" y="476" width="10" height="10" rx="2" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="370" y="485" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THIS REPO'S RULES</text><rect x="512" y="476" width="10" height="10" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="530" y="485" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECLARED LEASES</text></g></svg>