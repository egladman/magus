<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1076 960" width="1076" height="960" role="img" aria-labelledby="bootstrap-title bootstrap-desc" class="magus-diagram"><metadata>{"diagram":"bootstrap","stamp":"sha256:281bcc143f489a9b2e61d19bfc80045c512233a8be4bb724bec0970eceebb124"}</metadata><title id="bootstrap-title">One go run, then magus builds magus</title><desc id="bootstrap-desc">With no ./magus, the guard's raw-tool rule lets exactly one go command through: go run ./cmd/magus run go-build, which regenerates the spell bytecode and links a stamp of its sources. The stale policy compares that stamp with the checkout and, when the binary can no longer load the tree, allows the same bootstrap again.</desc><defs><marker id="bootstrap-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="bootstrap-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="bootstrap-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">BOOTSTRAP</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">One go run, then magus builds magus</text><g transform="translate(0,40)"><rect x="32" y="304" width="488" height="248" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="228" y="308" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="276" y="317" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">NO ./MAGUS YET</text><rect x="32" y="576" width="488" height="248" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="216" y="580" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="276" y="589" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">MAGUS BUILDS MAGUS</text><rect x="544" y="32" width="260" height="248" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="638" y="36" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="674" y="45" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">KEPT FRESH</text><path data-edge="external:Person or hook->external:magus on PATH" id="bootstrap-edge-external_3aPerson_20or_20hook-external_3amagus_20on_20PATH" d="M 936 128 L 936 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:magus on PATH->external:Raw-tool rule" id="bootstrap-edge-external_3amagus_20on_20PATH-external_3aRaw-tool_20rule" d="M 936 264 L 936 292 Q 936 300 928 300 L 676 300 A 8 8 0 0 0 660 300 L 164 300 Q 156 300 156 308 L 156 336" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Raw-tool rule->external:go run ./cmd/magus" id="bootstrap-edge-external_3aRaw-tool_20rule-external_3ago_20run_20_2e_2fcmd_2fmagus" d="M 156 400 L 156 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go run ./cmd/magus->external:go-build" id="bootstrap-edge-external_3ago_20run_20_2e_2fcmd_2fmagus-external_3ago-build" d="M 156 536 L 156 608" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go-build->external:Spell bytecode" id="bootstrap-edge-external_3ago-build-external_3aSpell_20bytecode" d="M 156 672 L 156 744" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:go-build->external:Build stamp" id="bootstrap-edge-external_3ago-build-external_3aBuild_20stamp" d="M 264 640 L 380 640 Q 388 640 388 648 L 388 744" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Stale policy->external:Build stamp" id="bootstrap-edge-external_3aStale_20policy-external_3aBuild_20stamp" d="M 776 96 L 780 96 Q 788 96 788 104 L 788 292 A 8 8 0 0 0 788 308 L 788 700 Q 788 708 780 708 L 412 708 Q 404 708 404 716 L 404 744" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Stale policy->external:Bootstrap again" id="bootstrap-edge-external_3aStale_20policy-external_3aBootstrap_20again" d="M 668 128 L 668 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#bootstrap-arrow-default)"/><path data-edge="external:Bootstrap again->external:go run ./cmd/magus" id="bootstrap-edge-external_3aBootstrap_20again-external_3ago_20run_20_2e_2fcmd_2fmagus" d="M 668 264 L 668 428 Q 668 436 660 436 L 176 436 Q 168 436 168 444 L 168 472" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#bootstrap-arrow-accent)"/><rect x="946" y="156" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="976" y="165" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS MAGUS</text><rect x="524" y="278" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="544" y="287" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JUDGES</text><rect x="86" y="428" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="116" y="437" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO ./MAGUS</text><rect x="166" y="564" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="182" y="573" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS</text><rect x="166" y="700" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="184" y="709" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FIRST</text><rect x="302" y="618" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="324" y="627" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">-X LINK</text><rect x="578" y="686" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="596" y="695" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READS</text><rect x="678" y="156" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="710" y="165" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DECLS MOVED</text><rect x="388" y="414" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="416" y="423" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUN AGAIN</text><g data-node="external:Person or hook"><rect x="828" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="828" y="64" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><text x="936" y="96" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Person or hook</text><text x="936" y="112" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">shell or PreToolUse</text></g><g data-node="external:magus on PATH"><rect x="828" y="200" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="828" y="200" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="936" y="232" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus on PATH</text><text x="936" y="248" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">re-execs ./magus</text></g><g data-node="external:Raw-tool rule"><rect x="48" y="336" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="48" y="336" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="156" y="368" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Raw-tool rule</text><text x="156" y="384" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">refuses a raw go build</text></g><g data-node="external:go run ./cmd/magus"><rect x="48" y="472" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="48" y="472" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="156" y="504" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">go run ./cmd/magus</text><text x="156" y="520" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">run go-build, alone</text></g><g data-node="external:go-build"><rect x="48" y="608" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="48" y="608" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="56" y="616" width="48" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="80" y="625" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">TARGET<