<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 656" width="768" height="656" role="img" aria-labelledby="doctor-title doctor-desc" class="magus-diagram"><metadata>{"figure":"doctor","stamp":"sha256:f3a2aedc382ccf698ab2f58aef0b76fcd9c214ad1dbd09312211a73bc2787bc4"}</metadata><title id="doctor-title">One check per question, each reading the subsystem it asks about</title><desc id="doctor-desc">magus doctor runs a list of checks and prints one verdict per check. Each check reads the subsystem it is about: the loaded config, the cache and its remote tier, the spell registry and its overrides, the service audit, the installed agent skills and hooks, and the job, session and trail records. A check reports what is wrong and the command that fixes it; it changes nothing.</desc><defs><marker id="doctor-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="doctor-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="doctor-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">DOCTOR</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">One check per question, each reading the subsystem it asks about</text><g transform="translate(0,40)"><path data-edge="internal/doctor->internal/config" id="doctor-edge-internal_2fdoctor-internal_2fconfig" d="M 140 204 L 140 100 Q 140 92 148 92 L 320 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#doctor-arrow-default)"/><path data-edge="internal/doctor->internal/cache" id="doctor-edge-internal_2fdoctor-internal_2fcache" d="M 152 204 L 152 180 Q 152 172 160 172 L 320 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#doctor-arrow-default)"/><path data-edge="internal/doctor->internal/spell" id="doctor-edge-internal_2fdoctor-internal_2fspell" d="M 248 252 L 320 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#doctor-arrow-default)"/><path data-edge="internal/doctor->internal/serviceaudit" id="doctor-edge-internal_2fdoctor-internal_2fserviceaudit" d="M 164 300 L 164 324 Q 164 332 172 332 L 320 332" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#doctor-arrow-default)"/><path data-edge="internal/doctor->internal/agent" id="doctor-edge-internal_2fdoctor-internal_2fagent" d="M 152 300 L 152 404 Q 152 412 160 412 L 320 412" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#doctor-arrow-default)"/><path data-edge="internal/doctor->group:Records" id="doctor-edge-internal_2fdoctor-group_3aRecords" d="M 140 300 L 140 484 Q 140 492 148 492 L 320 492" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#doctor-arrow-default)"/><g data-node="internal/doctor" data-anchor="internal/doctor"><rect x="32" y="204" width="216" height="96" rx="6" fill="#f5f5f5"/><rect x="32" y="204" width="216" height="96" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="140" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Checks</text><text x="140" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one verdict each</text></g><g data-node="internal/config" data-anchor="internal/config"><rect x="320" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Config</text><text x="428" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">keys, drift</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="320" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cache</text><text x="428" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">local and remote tier</text></g><g data-node="internal/spell" data-anchor="internal/spell"><rect x="320" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spells</text><text x="428" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">registry, overrides</text></g><g data-node="internal/serviceaudit" data-anchor="internal/serviceaudit"><rect x="320" y="304" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="304" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="332" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Service audit</text><text x="428" y="348" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">kind coherence</text></g><g data-node="internal/agent" data-anchor="internal/agent"><rect x="320" y="384" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="384" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="412" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent install</text><text x="428" y="428" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">skills, hooks</text></g><g data-node="group:Records"><rect x="320" y="464" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="464" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="492" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Records</text><text x="428" y="508" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">leases, sessions, trail</text></g><line x1="32" y1="556" x2="736" y2="556" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="570" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="576" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="585" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE VERDICTS</text><rect x="192" y="576" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="585" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>