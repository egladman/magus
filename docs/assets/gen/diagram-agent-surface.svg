<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 712" width="1272" height="712" role="img" aria-labelledby="agent-surface-title agent-surface-desc" class="magus-diagram"><metadata>{"figure":"agent-surface","stamp":"sha256:8ec7a102718d3b23e9080cfbe5273d521bfe6f1fb3a14e9f55c0c8f0a9ddff3a"}</metadata><title id="agent-surface-title">What an agent host gets, and the gate every call crosses</title><desc id="agent-surface-desc">magus agent install writes the skills and the AGENTS.md block, and magus describe harness prints the hook entries a person merges into the host's config. From then on the host runs the guard's PreToolUse hook before every shell command, file edit and magus MCP call, and only an allowed call runs. Skills, guard verdicts and MCP replies all name commands through internal/hint, so a renamed command cannot leave one of them pointing at nothing.</desc><defs><marker id="agent-surface-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="agent-surface-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="agent-surface-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What an agent host gets, and the gate every call crosses</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="200" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="56" y="68" width="168" height="12" rx="2" fill="#2d3142"/><text x="140" y="77" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">INSTALLED BEFORE A SESSION</text><rect x="592" y="376" width="648" height="200" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="872" y="380" width="88" height="12" rx="2" fill="#2d3142"/><text x="916" y="389" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ON EVERY CALL</text><path data-edge="internal/agent->external:Agent host" id="agent-surface-edge-internal_2fagent-external_3aAgent_20host" d="M 248 140 L 284 140 Q 292 140 292 148 L 292 304 Q 292 312 300 312 L 320 312" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="internal/agent->internal/hint" id="agent-surface-edge-internal_2fagent-internal_2fhint" d="M 248 128 L 908 128 Q 916 128 916 136 L 916 420 Q 916 428 924 428 L 1008 428" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="external:Harness spells->external:Agent host" id="agent-surface-edge-external_3aHarness_20spells-external_3aAgent_20host" d="M 248 216 L 268 216 Q 276 216 276 224 L 276 320 Q 276 328 284 328 L 320 328" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="external:Agent host->internal/guard" id="agent-surface-edge-external_3aAgent_20host-internal_2fguard" d="M 440 352 L 440 432 Q 440 440 448 440 L 608 440" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#agent-surface-arrow-accent)"/><path data-edge="external:Agent host->group:MCP tools" id="agent-surface-edge-external_3aAgent_20host-group_3aMCP_20tools" d="M 428 352 L 428 520 Q 428 528 436 528 L 608 528" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="internal/guard->internal/hint" id="agent-surface-edge-internal_2fguard-internal_2fhint" d="M 824 440 L 1008 440" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="group:MCP tools->internal/hint" id="agent-surface-edge-group_3aMCP_20tools-internal_2fhint" d="M 824 528 L 908 528 Q 916 528 916 520 L 916 460 Q 916 452 924 452 L 1008 452" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><rect x="302" y="216" width="76" height="12" rx="2" fill="#2d3142"/><text x="340" y="225" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">AGENT INSTALL</text><rect x="542" y="106" width="76" height="12" rx="2" fill="#2d3142"/><text x="580" y="115" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">COMMAND NAMES</text><rect x="186" y="264" width="80" height="12" rx="2" fill="#2d3142"/><text x="226" y="273" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">HOOKS TO MERGE</text><rect x="494" y="418" width="60" height="12" rx="2" fill="#2d3142"/><text x="524" y="427" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><rect x="486" y="506" width="60" height="12" rx="2" fill="#2d3142"/><text x="516" y="515" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">