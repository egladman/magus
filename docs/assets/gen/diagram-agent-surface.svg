<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 636" width="1536" height="636" role="img" aria-labelledby="agent-surface-title agent-surface-desc" class="magus-diagram"><title id="agent-surface-title">What an agent host gets, and the gate every call crosses</title><desc id="agent-surface-desc">magus agent install writes the skills and the AGENTS.md block, and magus describe harness prints the hook entries a person merges into the host's config. From then on the host runs the guard's PreToolUse hook before every shell command, file edit and magus MCP call, and only an allowed call runs. Skills, guard verdicts and MCP replies all name commands through internal/hint, so a renamed command cannot leave one of them pointing at nothing.</desc><defs><marker id="agent-surface-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="agent-surface-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="agent-surface-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What an agent host gets, and the gate every call crosses</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="200" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="56" y="68" width="168" height="12" rx="2" fill="#2d3142"/><text x="140" y="77" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">INSTALLED BEFORE A SESSION</text><rect x="592" y="288" width="912" height="124" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="1004" y="292" width="88" height="12" rx="2" fill="#2d3142"/><text x="1048" y="301" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ON EVERY CALL</text><path data-edge="skills->host" id="agent-surface-edge-skills-host" d="M 248 140 L 284 140 Q 292 140 292 148 L 292 452 Q 292 460 300 460 L 320 460" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="harness->host" id="agent-surface-edge-harness-host" d="M 248 216 L 268 216 Q 276 216 276 224 L 276 468 Q 276 476 284 476 L 320 476" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="host->guard" id="agent-surface-edge-host-guard" d="M 428 436 L 428 360 Q 428 352 436 352 L 608 352" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#agent-surface-arrow-accent)"/><path data-edge="guard->mcp" id="agent-surface-edge-guard-mcp" d="M 824 352 L 896 352" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="skills->hint" id="agent-surface-edge-skills-hint" d="M 248 128 L 1184 128 Q 1192 128 1192 136 L 1192 332 Q 1192 340 1200 340 L 1272 340" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="guard->hint" id="agent-surface-edge-guard-hint" d="M 716 384 L 716 388 Q 716 396 724 396 L 1184 396 Q 1192 396 1192 388 L 1192 372 Q 1192 364 1200 364 L 1272 364" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><path data-edge="mcp->hint" id="agent-surface-edge-mcp-hint" d="M 1112 352 L 1272 352" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#agent-surface-arrow-default)"/><rect x="302" y="292" width="76" height="12" rx="2" fill="#2d3142"/><text x="340" y="301" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">AGENT INSTALL</text><rect x="186" y="336" width="80" height="12" rx="2" fill="#2d3142"/><text x="226" y="345" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">HOOKS TO MERGE</text><rect x="486" y="330" width="60" height="12" rx="2" fill="#2d3142"/><text x="516" y="339" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><rect x="838" y="330" width="44" height="12" rx="2" fill="#2d3142"/><text x="860" y="339" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ALLOWED</text><rect x="682" y="106" width="76" height="12" rx="2" fill="#2d3142"/><text x="720" y="115" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">COMMAND NAMES</text><rect x="916" y="406" width="72" height="12" rx="2" fill="#2d3142"/><text x="952" y="415" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DENIAL HINTS</text><rect x="1120" y="330" width="64" height="12" rx="2" fill="#2d3142"/><text x="1152" y="339" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NEXT FIELDS</text><g data-node="skills" data-anchor="internal/agent"><rect x="32" y="96" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="96" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="140" y="128" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Skills catalog</text><text x="140" y="144" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">embedded skills, AGENTS.md</text></g><g data-node="harness" data-anchor="spells/harness"><rect x="32" y="184" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="184" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="140" y="216" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Harness spells</text><text x="140" y="232" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">hook entries per host</text></g><g data-node="host"><rect x="320" y="436" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="436" width="216" height="64" rx="6" fill="#2d3142" stroke="#8e98ac" stroke-width="1.2"/><rect x="328" y="444" width="48" height="12" rx="2" fill="none" stroke="#8e98ac" stroke-width="0.8"/><text x="352" y="453" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="428" y="476" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Agent host</text><text x="428" y="492" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, Codex, Cursor</text></g><g data-node="guard" data-anchor="internal/guard"><rect x="608" y="320" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="320" width="216" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><rect x="616" y="328" width="36" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="634" y="337" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">GATE</text><text x="716" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Guard</text><text x="716" y="376" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">deny, advise, ask</text></g><g data-node="mcp" data-anchor="internal/handler/mcp"><rect x="896" y="320" width="216" height="64" rx="6" fill="#2d3142"/><rect x="896" y="320" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1004" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">MCP tools</text><text x="1004" y="368" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">./magus mcp or /mcp</text></g><g data-node="hint" data-anchor="internal/hint"><rect x="1272" y="320" width="216" height="64" rx="6" fill="#2d3142"/><rect x="1272" y="320" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1380" y="352" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Hints</text><text x="1380" y="368" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">commands, next fields</text></g><line x1="32" y1="536" x2="1504" y2="536" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="550" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="556" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="565" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE GATE</text><rect x="192" y="556" width="10" height="10" rx="2" fill="#2d3142" stroke="#8e98ac" stroke-width="0.8"/><text x="210" y="565" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text></g></svg>