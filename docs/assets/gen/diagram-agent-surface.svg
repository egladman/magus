fill="none" stroke="#a9b1c2" stroke-width="0.8"/><text x="352" y="305" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="428" y="328" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Agent host</text><text x="428" y="344" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, Codex, Cursor</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="608" y="408" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="408" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><rect x="616" y="416" width="36" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="634" y="425" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">GATE</text><text x="716" y="448" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Guard</text><text x="716" y="464" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">deny, advise, ask</text></g><g data-node="group:MCP tools"><rect x="608" y="496" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="496" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="528" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">MCP tools</text><text x="716" y="544" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures