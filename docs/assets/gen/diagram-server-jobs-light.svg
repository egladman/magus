fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">INPUT</text><text x="140" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Source files</text><text x="140" y="120" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magusfiles, code</text></g><g data-node="cli"><rect x="32" y="240" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="240" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.2"/><rect x="40" y="248" width="40" height="12" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/><text x="60" y="257" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">INPUT</text><text x="140" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus run</text><text x="140" y="296" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">any invocation</text></g><g data-node="watch" data-anchor="internal/file"><rect x="320" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="328" y="72" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="342" y="81" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="428" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">File watchers</text><text x="428" y="120" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">internal/file/watch</text></g><g data-node="idx"><rect x="320" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="328" y="160" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="342" y="169" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="428" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">SCIP indexer</text><text x="428" y="208" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">symbol index</text></g><g data-node="job"><rect x="320" y="240" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="240" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="328" y="248" width="28" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="342" y="257" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="428" y="280" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Graph build</text><text x="428" y="296" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">coalesced, async</text></g><g data-node="ws" data-anchor="internal/graph"><rect x="656" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="656" y="152" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><rect x="664" y="160" width="40" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-width="0.8"/><text x="684" y="169" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">STATE</text><text x="764" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace registry</text><text x="764" y="208" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the warm graph</text></g><line x1="32" y1="340" x2="872" y2="340" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="354" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="360" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/><text x="50" y="369" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE THE SERVER</text><rect x="192" y="360" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="210" y="369" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE WARM COPY</text></g></svg>