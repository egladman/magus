<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1192 408" width="1192" height="408" role="img" aria-labelledby="server-jobs-title server-jobs-desc" class="magus-diagram"><metadata>{"figure":"server-jobs","stamp":"sha256:24e0bd4d46ac01528cbff8b9b1d7e3d7a210f6e48be98f31bb58bad406a30895"}</metadata><title id="server-jobs-title">What keeps the warm workspace current</title><desc id="server-jobs-desc">File changes reach the watchers, which tell the workspace registry what to invalidate. A magus run queues a coalesced graph-build job on the server, which rebuilds the knowledge graph and writes it back into the registry, the server's single warm copy.</desc><defs><marker id="server-jobs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="server-jobs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="server-jobs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">What keeps the warm workspace current</text><g transform="translate(0,40)"><path data-edge="external:Source files->internal/file/watch" id="server-jobs-edge-external_3aSource_20files-internal_2ffile_2fwatch" d="M 248 96 L 876 96 Q 884 96 884 104 L 884 120 Q 884 128 892 128 L 944 128" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="external:magus run->internal/server" id="server-jobs-edge-external_3amagus_20run-internal_2fserver" d="M 248 228 L 320 228" fill="none" stroke="#4f5d75" s