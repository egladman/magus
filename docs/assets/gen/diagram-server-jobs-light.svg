"/><rect x="616" y="204" width="28" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="630" y="213" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="716" y="236" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Graph build</text><text x="716" y="252" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">coalesced, async</text></g><line x1="32" y1="308" x2="1160" y2="308" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="322" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="328" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#5f6780" stroke-width="0.8"/><text x="50" y="337" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE THE SERVER</text><rect x="192" y="328" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="210" y="337" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE WARM COPY</text></g></svg>