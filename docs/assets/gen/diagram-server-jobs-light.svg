<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 440" width="904" height="440" role="img" aria-labelledby="server-jobs-title server-jobs-desc" class="magus-diagram"><title id="server-jobs-title">What keeps the warm workspace current</title><desc id="server-jobs-desc">File changes drive the watchers and the SCIP auto-indexer; a magus run queues a coalesced graph-build job. All three write into the workspace registry, which is the server's single warm copy of the knowledge graph.</desc><defs><marker id="server-jobs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="server-jobs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="server-jobs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What keeps the warm workspace current</text><g transform="translate(0,40)"><path data-edge="fs->watch" id="server-jobs-edge-fs-watch" d="M 248 96 L 320 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="fs->idx" id="server-jobs-edge-fs-idx" d="M 140 128 L 140 176 Q 140 184 148 184 L 320 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="cli->job" id="server-jobs-edge-cli-job" d="M 248 272 L 320 272" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-edge="watch->ws" id=