nt-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REBUILD</text><g data-node="external:Source files"><rect x="32" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><rect x="40" y="72" width="40" height="12" rx="2" fill="none" stroke="#5f6780" stroke-width="0.8"/><text x="60" y="81" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">INPUT</text><text x="140" y="104" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Source files</text><text x="140" y="120" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magusfiles, code</text></g><g data-node="external:magus run"><rect x="32" y="196" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="196" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><rect x="40" y="204" width="40" height="12" rx="2" fill="none" stroke="#5f6780" stroke-width="0.8"/><text x="60" y="213" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">INPUT</text><text x="140" y="236" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus run</text><text x="140" y="252" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">any invocation</text></g><g data-node="internal/file/watch" data-anchor="internal/file/watch"><rect x="944" y="108" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="944" y="108" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="952" y="116" width="28" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="966" y="125" fill="#5f6780" font-