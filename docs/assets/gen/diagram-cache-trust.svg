<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-labelledby="cache-trust-title cache-trust-desc" class="magus-diagram"><title id="cache-trust-title">A pull request reads the shared cache and never writes it</title><desc id="cache-trust-desc">A pull request run reads the signed remote tier and reads and writes a local tier scoped to its own ref. Only a run on the default branch holds the signing key, so only the default branch writes the remote tier. Every read checks the signature and rebuilds the target on an unsigned entry.</desc><defs><marker id="cache-trust-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="cache-trust-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="cache-trust-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">REMOTE CACHE</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A pull request reads the shared cache and never writes it</text><g transform="translate(0,40)"><rect x="32" y="88" width="280" height="352" rx="8" fill="none" stroke="#202632" stroke-width="1" stroke-dasharray="4,4"/><text x="44" y="108" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.14em">PULL REQUEST, UNTRUSTED CODE</text><rect x="648" y="88" width="280" height="352" rx="8" fill="none" stroke="#202632" stroke-width="1" stroke-dasharray="4,4"/><text x="660" y="108" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.14em">DEFAULT BRANCH, TRUSTED</text><path d="M 172 192 L 172 344" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#cache-trust-arrow-default)"/><path d="M 376 264 L 340 264 Q 332 264 332 256 L 332 168 Q 332 160 324 160 L 288 160" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#cache-trust-arrow-default)"/><path d="M 672 160 L 636 160 Q 628 160 628 168 L 628 244 Q 628 252 620 252 L 584 252" fill="none" stroke="#f08a59" stroke-width="1" marker-end="url(#cache-trust-arrow-accent)"/><path d="M 584 272 L 604 272 Q 612 272 612 280 L 612 368 Q 612 376 620 376 L 672 376" fill="none" stroke="#7b8495" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#cache-trust-arrow-default)"/><rect x="184" y="260" width="72" height="12" rx="2" fill="#13171f"/><text x="220" y="269" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ + WRITE</text><rect x="304" y="190" width="56" height="12" rx="2" fill="#13171f"/><text x="332" y="199" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ ONLY</text><rect x="598" y="182" width="60" height="12" rx="2" fill="#13171f"/><text x="628" y="191" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SIGN + PUT</text><rect x="576" y="302" width="72" height="12" rx="2" fill="#13171f"/><text x="612" y="311" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO SIGNATURE</text><rect x="56" y="128" width="232" height="64" rx="6" fill="#13171f"/><rect x="56" y="128" width="232" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="64" y="136" width="84" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="106" y="145" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PULL_REQUEST</text><text x="172" y="168" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">PR run</text><text x="172" y="184" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">no signing key</text><rect x="56" y="344" width="232" height="64" rx="6" fill="#13171f"/><rect x="56" y="344" width="232" height="64" rx="6" fill="#13171f" stroke="#202632" stroke-width="1"/><text x="172" y="376" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Local tier</text><text x="172" y="392" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">Actions cache, PR ref</text><rect x="376" y="232" width="208" height="64" rx="6" fill="#13171f"/><rect x="376" y="232" width="208" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><rect x="384" y="240" width="52" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="410" y="249" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ED25519</text><text x="480" y="272" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Remote tier</text><text x="480" y="288" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">verified on every read</text><rect x="672" y="128" width="232" height="64" rx="6" fill="#13171f"/><rect x="672" y="128" width="232" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="680" y="136" width="36" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="698" y="145" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PUSH</text><text x="788" y="168" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Default branch run</text><text x="788" y="184" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">holds the signing key</text><rect x="672" y="344" width="232" height="64" rx="6" fill="#13171f"/><rect x="672" y="344" width="232" height="64" rx="6" fill="#1b1f29" stroke="#6b7383" stroke-width="1" stroke-dasharray="4,3"/><text x="788" y="376" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Unsigned entry</text><text x="788" y="392" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">rejected, then rebuilt</text><line x1="32" y1="472" x2="928" y2="472" stroke="#202632" stroke-width="0.8"/><rect x="32" y="480" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="489" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE SHARED STORE</text><rect x="192" y="480" width="10" height="10" rx="2" fill="#13171f" stroke="#202632" stroke-width="0.8"/><text x="210" y="489" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">ONE PULL REQUEST ONLY</text><rect x="352" y="480" width="10" height="10" rx="2" fill="#1b1f29" stroke="#6b7383" stroke-width="0.8"/><text x="370" y="489" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">NEVER REPLAYED</text></g></svg>