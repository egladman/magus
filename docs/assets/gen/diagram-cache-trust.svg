<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 536" width="1160" height="536" role="img" aria-labelledby="cache-trust-title cache-trust-desc" class="magus-diagram"><title id="cache-trust-title">A pull request reads the shared cache and never writes it</title><desc id="cache-trust-desc">A pull request run reads the signed remote tier and reads and writes a local tier scoped to its own ref. Only a run on the default branch holds the signing key, so only the default branch writes the remote tier. Every read checks the signature and rebuilds the target on an unsigned entry.</desc><defs><marker id="cache-trust-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="cache-trust-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="cache-trust-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">REMOTE CACHE</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A pull request reads the shared cache and never writes it</text><g transform="translate(0,40)"><rect x="592" y="64" width="536" height="112" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="770" y="68" width="180" height="12" rx="2" fill="#2d3142"/><text x="860" y="77" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">PULL REQUEST, UNTRUSTED CODE</text><rect x="16" y="200" width="824" height="112" rx="8" fill="#f5f5f5" fill-opacity="0.02" stroke="#f5f5f5" stroke-opacity="0.1" stroke-width="0.8"/><rect x="354" y="204" width="148" height="12" rx="2" fill="#2d3142"/><text x="428" y="213" fill="#f5f5f5" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">DEFAULT BRANCH, TRUSTED</text><path data-edge="pr->local" d="M 824 128 L 896 128" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-trust-arrow-default)"/><path data-edge="remote->pr" d="M 536 356 L 552 356 Q 560 356 560 348 L 560 136 Q 560 128 568 128 L 608 128" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#cache-trust-arrow-default)"/><path data-edge="default->remote" d="M 248 264 L 276 264 Q 284 264 284 272 L 284 360 Q 284 368 292 368 L 320 368" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#cache-trust-arrow-accent)"/><path data-edge="remote->reject" d="M 536 376 L 576 376 Q 584 376 584 368 L 584 272 Q 584 264 592 264 L 608 264" fill="none" stroke="#bfc0c0" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#cache-trust-arrow-default)"/><rect x="824" y="106" width="72" height="12" rx="2" fill="#2d3142"/><text x="860" y="115" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ + WRITE</text><rect x="494" y="232" width="56" height="12" rx="2" fill="#2d3142"/><text x="522" y="241" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ ONLY</text><rect x="294" y="308" width="60" height="12" rx="2" fill="#2d3142"/><text x="324" y="317" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SIGN + PUT</text><rect x="594" y="312" width="72" height="12" rx="2" fill="#2d3142"/><text x="630" y="321" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO SIGNATURE</text><g data-node="pr" data-anchor=".github/workflows/ci.yaml"><rect x="608" y="96" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="96" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="616" y="104" width="84" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="658" y="113" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PULL_REQUEST</text><text x="716" y="136" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">PR run</text><text x="716" y="152" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">no signing key</text></g><g data-node="local" data-anchor=".github/workflows/ci.yaml"><rect x="896" y="96" width="216" height="64" rx="6" fill="#2d3142"/><rect x="896" y="96" width="216" height="64" rx="6" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1004" y="128" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Local tier</text><text x="1004" y="144" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">Actions cache, PR ref</text></g><g data-node="remote" data-anchor="internal/cache"><rect x="320" y="336" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="336" width="216" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><rect x="328" y="344" width="52" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="354" y="353" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ED25519</text><text x="428" y="376" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Remote tier</text><text x="428" y="392" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">verified on every read</text></g><g data-node="default" data-anchor=".github/workflows/ci.yaml"><rect x="32" y="232" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="232" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="40" y="240" width="36" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="58" y="249" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PUSH</text><text x="140" y="272" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Default branch run</text><text x="140" y="288" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">holds the signing key</text></g><g data-node="reject"><rect x="608" y="232" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="232" width="216" height="64" rx="6" fill="#393e53" stroke="#8e98ac" stroke-width="1.2" stroke-dasharray="4,3"/><text x="716" y="264" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Unsigned entry</text><text x="716" y="280" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">rejected, then rebuilt</text></g><line x1="32" y1="436" x2="1128" y2="436" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="450" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="456" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="465" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE SHARED STORE</text><rect x="192" y="456" width="10" height="10" rx="2" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="210" y="465" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">ONE PULL REQUEST ONLY</text><rect x="352" y="456" width="10" height="10" rx="2" fill="#393e53" stroke="#8e98ac" stroke-width="0.8"/><text x="370" y="465" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">NEVER REPLAYED</text></g></svg>