780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FORKS JOBS</text><rect x="94" y="324" width="52" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="120" y="333" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VERDICTS</text><rect x="210" y="382" width="52" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="236" y="391" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VERDICTS</text><rect x="194" y="430" width="60" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="224" y="439" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXEC, EXIT</text><rect x="310" y="430" width="60" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="340" y="439" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXEC, EXIT</text><g data-node="external:Person"><rect x="372" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="372" y="64" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#5f6780" class="magus-fill-paper magus-stroke-soft" stroke-width="1.2"/><text x="480" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Person</text><text x="480" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">forks, reviews</text></g>