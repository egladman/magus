<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="daemon-share-title daemon-share-desc" class="magus-diagram"><title id="daemon-share-title">The only listener a second machine can reach</title><desc id="daemon-share-desc">Sharing from the dashboard posts to a loopback-only endpoint, which mints a time-boxed read-only token and opens an ephemeral LAN listener. The listener serves four JSON read routes and the read Connect services, and nothing else: the graph, the diff routes, the derived plan, the delegation ledger, /mcp and job control stay loopback only.</desc><defs><marker id="daemon-share-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="daemon-share-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="daemon-share-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS DAEMON</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The only listener a second machine can reach</text><g transform="translate(0,40)"><path d="M 208 128 L 288 128" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#daemon-share-arrow-default)"/><path d="M 504 128 L 552 128 Q 560 128 560 120 L 560 116 Q 560 108 568 108 L 616 108" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#daemon-share-arrow-default)"/><path d="M 756 248 L 756 176" fill="none" stroke="#bc4c00" stroke-width="1" marker-end="url(#daemon-share-arrow-accent)"/><path d="M 