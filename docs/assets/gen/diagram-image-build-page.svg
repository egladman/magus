<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 352" width="1144" height="352" role="img" aria-labelledby="image-build-title image-build-desc" class="magus-diagram"><metadata>{"figure":"image-build","stamp":"sha256:25d2e8bb4304dbb87bb3eddb721649880a6161ddca601ba41b893c13522dd14a"}</metadata><title id="image-build-title">What a bare run pushes, and what each channel adds</title><desc id="image-build-desc">Without the cd charm an image-build loads locally and pushes nothing. With it, the channel decides: the default commit channel adds one immutable tag to one registry, and only stable moves the floating latest tag.</desc><defs><marker id="image-build-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="image-build-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="image-build-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">RECOMMENDATIONS</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What a bare run pushes, and what each channel adds</text><g transform="translate(0,40)"><path data-edge="external:magus run image-build->external:cd?" id="image-build-edge-external_3amagus_20run_20image-build-external_3acd_3f" d="M 248 92 L 320 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="external:cd?->external:Load locally" id="image-build-edge-external_3acd_3f-external_3aLoad_20locally" d="M 536 92 L 608 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="external:cd?->external:channel" id="image-build-edge-external_3acd_3f-external_3achannel" d="M 428 120 L 428 164 Q 428 172 436 172 L 608 172" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="external:channel->external:Commit" id="image-build-edge-external_3achannel-external_3aCommit" d="M 716 144 L 716 140 Q 716 132 724 132 L 852 132 Q 860 132 860 124 L 860 100 Q 860 92 868 92 L 896 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="external:channel->external:Prerelease" id="image-build-edge-external_3achannel-external_3aPrerelease" d="M 824 172 L 896 172" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><path data-edge="external:channel->external:Release" id="image-build-edge-external_3achannel-external_3aRelease" d="M 716 200 L 716 244 Q 716 252 724 252 L 896 252" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#image-build-arrow-default)"/><rect x="562" y="70" width="20" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="572" y="79" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="504" y="150" width="24" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="516" y="159" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="830" y="142" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="852" y="151" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DEFAULT</text><rect x="834" y="182" width="52" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="860" y="191" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">UNSTABLE</text><rect x="784" y="230" width="40" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="804" y="239" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">STABLE</text><g data-node="external:magus run image-build"><rect x="32" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><text x="140" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus run image-build</text></g><g data-node="external:cd?"><polygon points="428,64 536,92 428,120 320,92" fill="var(--magus-diagram-paper, #f5f5f5)"/><polygon points="428,64 536,92 428,120 320,92" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="428" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">cd?</text></g><g data-node="external:Load locally"><rect x="608" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="716" y="92" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Load locally</text><text x="716" y="108" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">pushes nothing</text></g><g data-node="external:channel"><polygon points="716,144 824,172 716,200 608,172" fill="var(--magus-diagram-paper, #f5f5f5)"/><polygon points="716,144 824,172 716,200 608,172" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="716" y="176" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">channel</text></g><g data-node="external:Commit"><rect x="896" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="896" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1004" y="92" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Commit</text><text x="1004" y="108" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">ghcr, tagged by hash</text></g><g data-node="external:Prerelease"><rect x="896" y="144" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="896" y="144" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1004" y="172" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Prerelease</text><text x="1004" y="188" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">no floating tag</text></g><g data-node="external:Release"><rect x="896" y="224" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="896" y="224" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1004" y="252" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Release</text><text x="1004" y="268" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">version and latest</text></g></g></svg>