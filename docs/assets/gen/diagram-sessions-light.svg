<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 496" width="1144" height="496" role="img" aria-labelledby="sessions-title sessions-desc" class="magus-diagram"><metadata>{"figure":"sessions","stamp":"sha256:d255bf7c10c149e11361e5716f51afe76c7bfeeaff56649394dff93d22df8828"}</metadata><title id="sessions-title">A session record is written by the hook and read by four others</title><desc id="sessions-desc">Each agent host session gets one record: who started it, its checkout and what it did. The guard appends to it on every call, and the journal underneath keeps the append-only lines. The trail reads the record to say which session made a change, the agent install reads it to rehydrate a session that lost its history, and the console's attention and viewer handlers show it to the person watching.</desc><defs><marker id="sessions-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="sessions-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="sessions-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SESSIONS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">A session record is written by the hook and read by four others</text><g transform="translate(0,40)"><path data-edge="internal/sessions->internal/journal" id="sessions-edge-internal_2fsessions-internal_2fjournal" d="M 824 212 L 896 212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/trail->internal/sessions" id="sessions-edge-internal_2ftrail-internal_2fsessions" d="M 536 172 L 556 172 Q 564 172 564 180 L 564 192 Q 564 200 572 200 L 608 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/agent->internal/sessions" id="sessions-edge-internal_2fagent-internal_2fsessions" d="M 248 92 L 572 92 Q 580 92 580 100 L 580 180 Q 580 188 588 188 L 608 188" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/guard->internal/sessions" id="sessions-edge-internal_2fguard-internal_2fsessions" d="M 248 252 L 556 252 Q 564 252 564 244 L 564 232 Q 564 224 572 224 L 608 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/attention->internal/sessions" id="sessions-edge-internal_2fhandler_2fattention-internal_2fsessions" d="M 140 200 L 140 204 Q 140 212 148 212 L 608 212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/attention->internal/trail" id="sessions-edge-internal_2fhandler_2fattention-internal_2ftrail" d="M 248 172 L 320 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><path data-edge="internal/handler/viewer->internal/sessions" id="sessions-edge-internal_2fhandler_2fviewer-internal_2fsessions" d="M 248 332 L 572 332 Q 580 332 580 324 L 580 244 Q 580 236 588 236 L 608 236" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sessions-arrow-default)"/><g data-node="internal/sessions" data-anchor="internal/sessions"><rect x="608" y="176" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="608" y="176" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="716" y="212" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Session record</text><text x="716" y="228" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one per host session</text></g><g data-node="internal/journal" data-anchor="internal/journal"><rect x="896" y="184" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="896" y="184" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="1004" y="212" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Journal</text><text x="1004" y="228" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">append-only lines</text></g><g data-node="internal/trail" data-anchor="internal/trail"><rect x="320" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Trail</text><text x="428" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">which session changed what</text></g><g data-node="internal/agent" data-anchor="internal/agent"><rect x="32" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Agent install</text><text x="140" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">rehydrate a lost session</text></g><g data-node="internal/guard" data-anchor="internal/guard"><rect x="32" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Guard</text><text x="140" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">appends on every call</text></g><g data-node="internal/handler/attention" data-anchor="internal/handler/attention"><rect x="32" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Attention view</text><text x="140" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what needs a person</text></g><g data-node="internal/handler/viewer" data-anchor="internal/handler/viewer"><rect x="32" y="304" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="332" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Viewer</text><text x="140" y="348" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the shared read</text></g><line x1="32" y1="396" x2="1112" y2="396" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="410" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="416" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="425" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE RECORD</text><rect x="192" y="416" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="425" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>