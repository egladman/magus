<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1168 548" width="1168" height="548" role="img" aria-labelledby="sandbox-title sandbox-desc" class="magus-diagram"><metadata>{"figure":"sandbox","stamp":"sha256:c60be7b8fc99936d54dbc1a739da2daa80b1858cb2adb240918fe5c9f5692cf8"}</metadata><title id="sandbox-title">Every spell run gets one grant, narrowed by its job's write paths</title><desc id="sandbox-desc">A spell reaches the sandbox from two sides: the interpreter runs its Buzz in process, and the spawner starts its tool. The sandbox builds one grant: the filesystem half applies the readable and writable paths with landlock where it can, and the environment half rebuilds the child's variables from an allowlist. A job's write paths narrow the writes.</desc><defs><marker id="sandbox-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="sandbox-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="sandbox-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SANDBOX</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">Every spell run gets one grant, narrowed by its job's write paths</text><g transform="translate(0,40)"><path data-edge="internal/sandbox->libs/safetyscissors/sandbox/filesystem" id="sandbox-edge-internal_2fsandbox-libs_2fsafetyscissors_2fsandbox_2ffilesystem" d="M 536 252 L 632 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/sandbox/env" id="sandbox-edge-internal_2fsandbox-internal_2fsandbox_2fenv" d="M 428 216 L 428 100 Q 428 92 436 92 L 632 92" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/job" id="sandbox-edge-internal_2fsandbox-internal_2fjob" d="M 440 216 L 440 180 Q 440 172 448 172 L 632 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/recorder" id="sandbox-edge-internal_2fsandbox-internal_2frecorder" d="M 536 240 L 576 240 Q 584 240 584 232 L 584 220 Q 584 212 592 212 L 920 212" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/job->internal/recorder" id="sandbox-edge-internal_2fjob-internal_2frecorder" d="M 848 172 L 876 172 Q 884 172 884 180 L 884 192 Q 884 200 892 200 L 920 200" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/interp->internal/recorder" id="sandbox-edge-internal_2finterp-internal_2frecorder" d="M 140 400 L 140 404 Q 140 412 148 412 L 876 412 Q 884 412 884 404 L 884 232 Q 884 224 892 224 L 920 224" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/interp->internal/spell" id="sandbox-edge-internal_2finterp-internal_2fspell" d="M 248 372 L 320 372" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/proc/spawn->internal/sandbox" id="sandbox-edge-internal_2fproc_2fspawn-internal_2fsandbox" d="M 248 252 L 320 252" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/proc/spawn->libs/safetyscissors/sandbox/filesystem" id="sandbox-edge-internal_2fproc_2fspawn-libs_2fsafetyscissors_2fsandbox_2ffilesystem" d="M 140 280 L 140 292 Q 140 300 148 300 L 576 300 Q 584 300 584 292 L 584 272 Q 584 264 592 264 L 632 264" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><rect x="542" y="262" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="560" y="271" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PATHS</text><rect x="500" y="70" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="528" y="79" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VARIABLES</text><rect x="524" y="150" width="24" height="12" rx="2" fill="#f5f5f5"/><text x="536" y="159" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JOB</text><g data-node="internal/sandbox" data-anchor="internal/sandbox"><rect x="320" y="216" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="320" y="216" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="428" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sandbox</text><text x="428" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one grant per run</text></g><g data-node="libs/safetyscissors/sandbox/filesystem" data-anchor="libs/safetyscissors/sandbox/filesystem"><rect x="632" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="632" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="740" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Filesystem grant</text><text x="740" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">landlock where the kernel has it</text></g><g data-node="internal/sandbox/env" data-anchor="internal/sandbox/env"><rect x="632" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="632" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="740" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Environment</text><text x="740" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">allowlist, no secrets</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="632" y="144" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="632" y="144" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="740" y="172" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="740" y="188" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write paths narrow the grant</text></g><g data-node="internal/recorder" data-anchor="internal/recorder"><rect x="920" y="184" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="920" y="184" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="1028" y="212" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Recorder</text><text x="1028" y="228" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the refusal and the denial kept</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="32" y="344" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="344" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="372" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Interpreter</text><text x="140" y="388" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Buzz, in process</text></g><g data-node="internal/proc/spawn" data-anchor="internal/proc/spawn"><rect x="32" y="224" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="252" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spawner</text><text x="140" y="268" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the tool's process</text></g><g data-node="internal/spell" data-anchor="internal/spell"><rect x="320" y="344" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="320" y="344" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="372" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spells</text><text x="428" y="388" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ops that run</text></g><line x1="32" y1="448" x2="1136" y2="448" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="462" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="468" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="477" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE GRANT</text><rect x="192" y="468" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="477" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">RECORDS</text></g></svg>