<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="daemon-share-title daemon-share-desc" class="magus-diagram"><title id="daemon-share-title">The only listener a second machine can reach</title><desc id="daemon-share-desc">Sharing from the dashboard posts to a loopback-only endpoint, which mints a time-boxed read-only token and opens an ephemeral LAN listener. The listener serves read-only views and carries no MCP, share or mutating routes.</desc><defs><marker id="daemon-share-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="daemon-share-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="daemon-share-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS DAEMON</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The only listener a second machine can reach</text><g transform="translate(0,40)"><path d="M 208 208 L 304 208" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-share-arrow-default)"/><path d="M 504 208 L 512 208 Q 520 208 520 200 L 520 124 Q 520 116 528 116 L 600 116" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-share-arrow-default)"/><path d="M 720 280 L 720 176" fill="none" stroke="#f08a59" stroke-width="1" marker-end="url(#daemon-share-arrow-accent)"/><path d="M 600 144 L 568 144 Q 560 144 560 152 L 560 344 Q 560 352 552 352 L 504 352" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-share-arrow-default)"/><rect x="238" y="186" width="36" height="12" rx="2" fill="#13171f"/><text x="256" y="195" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SHARE</text><rect x="488" y="138" width="64" height="12" rx="2" fill="#13171f"/><text x="520" y="147" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MINTS TOKEN</text><rect x="732" y="220" width="56" height="12" rx="2" fill="#13171f"/><text x="760" y="229" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text><rect x="542" y="226" width="36" height="12" rx="2" fill="#13171f"/><text x="560" y="235" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READS</text><rect x="32" y="176" width="176" height="64" rx="6" fill="#13171f"/><rect x="32" y="176" width="176" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="40" y="184" width="28" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="54" y="193" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PWA</text><text x="120" y="216" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Console</text><text x="120" y="232" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">dashboard</text><rect x="304" y="176" width="200" height="64" rx="6" fill="#13171f"/><rect x="304" y="176" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="312" y="184" width="40" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="332" y="193" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROUTE</text><text x="404" y="216" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1/share</text><text x="404" y="232" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">loopback + bearer</text><rect x="600" y="88" width="240" height="88" rx="6" fill="#13171f"/><rect x="600" y="88" width="240" height="88" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><rect x="608" y="96" width="64" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="640" y="105" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">EPHEMERAL</text><text x="720" y="128" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">LAN listener</text><text x="720" y="144" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">15m, read-only token</text><rect x="600" y="280" width="240" height="64" rx="6" fill="#13171f"/><rect x="600" y="280" width="240" height="64" rx="6" fill="#13171f" stroke="#6b7383" stroke-width="1"/><rect x="608" y="288" width="48" height="12" rx="2" fill="none" stroke="#6b7383" stroke-width="0.8"/><text x="632" y="297" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="720" y="320" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Phone on the LAN</text><text x="720" y="336" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">same-origin viewer</text><rect x="304" y="320" width="200" height="64" rx="6" fill="#13171f"/><rect x="304" y="320" width="200" height="64" rx="6" fill="#13171f" stroke="#202632" stroke-width="1"/><text x="404" y="352" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace registry</text><text x="404" y="368" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">read-only views</text><line x1="32" y1="432" x2="928" y2="432" stroke="#202632" stroke-width="0.8"/><rect x="32" y="440" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="449" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">REACHABLE OFF-MACHINE</text><rect x="192" y="440" width="10" height="10" rx="2" fill="#13171f" stroke="#202632" stroke-width="0.8"/><text x="210" y="449" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">READ-ONLY</text></g></svg>