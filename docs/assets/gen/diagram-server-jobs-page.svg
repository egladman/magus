83" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INVALIDATE</text><rect x="542" y="162" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="564" y="171" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SYMBOLS</text><rect x="542" y="250" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="564" y="259" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REBUILD</text><g data-node="external:Source files"><rect x="32" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><rect x="40" y="72" width="40" height="12" rx="2" fill="none" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="60" y="81" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">INPUT</text><text x="140" y="104" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Source files</text><text x="140" y="120" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magusfiles, code</text></g><g data-node="external:magus run"><rect x="32" y="240" width="216" height="6