<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 904 440" width="904" height="440" role="img" aria-labelledby="server-jobs-title server-jobs-desc" class="magus-diagram"><metadata>{"figure":"server-jobs","stamp":"sha256:e6b3c01d4d9e7683fc9cee225f3074969339cddfab44e9cb4c0c983e3064fb21"}</metadata><title id="server-jobs-title">What keeps the warm workspace current</title><desc id="server-jobs-desc">File changes drive the watchers and the SCIP auto-indexer; a magus run queues a coalesced graph-build job. All three write into the workspace registry, which is the server's single warm copy of the knowledge graph.</desc><defs><marker id="server-jobs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="server-jobs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="server-jobs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What keeps the warm workspace current</text><g transform="translate(0,40)"><path data-edge="external:Source files->internal/file/watch" id="server-jobs-edge-external_3aSource_20files-internal_2ffile_2fwatch" d="M 248 96 L 320 96" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-jobs-arrow-default)"/><path data-ed