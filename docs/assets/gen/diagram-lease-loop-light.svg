<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 852 912" width="852" height="912" role="img" aria-labelledby="lease-loop-title lease-loop-desc" class="magus-diagram"><title id="lease-loop-title">A declared plan, released early, verified by diff</title><desc id="lease-loop-desc">An orchestrator checkpoints the working state, partitions the work by write set using graph evidence, and forks one job per unit: goal, checkpoint, write paths. Holders release paths as soon as they are done with them, so the plan shrinks while it runs, and the Jobs view renders the rows, their overlaps and their staleness for whoever is watching. The orchestrator verifies each job by diffing since that job's checkpoint against what it claimed, then integrates and runs magus affected ci. magus records and answers; it enforces none of it.</desc><defs><marker id="lease-loop-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="lease-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="lease-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">LEASE</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A declared plan, released early, verified by diff</text><g transform="translate(0,40)"><rect x="32" y="32" width="276" height="744" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="74" y="36" width="192" height="12" rx="2" fill="#f5f5f5"/><text x="170" y="45" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE LOOP THE ORCHESTRATOR RUNS</text><rect x="332" y="32" width="248" height="488" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="388" y="36" width="136" height="12" rx="2" fill="#f5f5f5"/><text x="456" y="45" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT A PERSON WATCHES</text><path data-edge="cp->part" d="M 184 120 L 184 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="part->decl" d="M 184 248 L 184 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="decl->work" d="M 184 376 L 184 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="work->verify" d="M 184 504 L 184 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="verify->integrate" d="M 184 632 L 184 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="integrate->cp" d="M 76 732 L 56 732 Q 48 732 48 724 L 48 100 Q 48 92 56 92 L 76 92" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="work->decl" d="M 76 476 L 68 476 Q 60 476 60 468 L 60 356 Q 60 348 68 348 L 76 348" fill="none" stroke="#eb6c36" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#lease-loop-arrow-accent)"/><path data-edge="decl->plan" d="M 196 376 L 196 404 Q 196 412 204 412 L 436 412 Q 444 412 444 420 L 444 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><path data-edge="human->plan" d="M 456 120 L 456 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#lease-loop-arrow-default)"/><rect x="194" y="532" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="230" y="541" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPORTS DONE</text><rect x="70" y="404" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="92" y="413" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RELEASE</text><rect x="294" y="390" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="399" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JOB ROWS</text><rect x="466" y="276" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="488" y="285" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WATCHES</text><g data-node="cp" data-anchor="cmd/magus"><rect x="76" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="76" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="184" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus vcs checkpoint</text><text x="184" y="108" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">revision + dirty digest</text></g><g data-node="part" data-anchor="internal/graph"><rect x="76" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="76" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="184" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Partition by write set</text><text x="184" y="236" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">refs, explain, affected</text></g><g data-node="decl" data-anchor="internal/job"><rect x="76" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="76" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="184" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Declare the plan</text><text x="184" y="364" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">goal, checkpoint, paths</text></g><g data-node="work"><rect x="76" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="76" y="448" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.2"/><text x="184" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workers edit</text><text x="184" y="492" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">one write set each</text></g><g data-node="verify" data-anchor="internal/changeset"><rect x="76" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="76" y="576" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="184" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Verify each lease</text><text x="184" y="620" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">diff since its checkpoint</text></g><g data-node="integrate" data-anchor="cmd/magus"><rect x="76" y="704" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="76" y="704" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="184" y="732" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Integrate</text><text x="184" y="748" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus affected ci</text></g><g data-node="plan" data-anchor="internal/handler/status"><rect x="348" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="348" y="448" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="456" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Plan surface</text><text x="456" y="492" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">/console/plan/, overlaps, stale</text></g><g data-node="human"><rect x="348" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="348" y="64" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.2"/><text x="456" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">The human</text><text x="456" y="108" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">watches and decides</text></g><g data-node="doctrine" data-anchor="internal/job"><rect x="604" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="604" y="64" width="216" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="712" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus records and answers</text><text x="712" y="108" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">it enforces none of it</text></g><line x1="32" y1="812" x2="820" y2="812" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="826" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="832" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="841" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE WHOLE GUARANTEE</text><rect x="192" y="832" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/><text x="210" y="841" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">AGENTS AND PEOPLE</text></g></svg>