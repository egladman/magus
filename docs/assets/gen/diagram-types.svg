<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 576" width="856" height="576" role="img" aria-labelledby="types-title types-desc" class="magus-diagram"><metadata>{"figure":"types","stamp":"sha256:9234c3713eae0c26b5a44144ca57d4a4315766a897e0be8c5f709aa7c08f6fc1"}</metadata><title id="types-title">The shared records sit at the bottom, and the groups lean on them</title><desc id="types-desc">types holds the records every other package passes around: targets, runs, findings, jobs. Its enums sit in types/enum, and the diagnostic codes come from libs/diagnostics. The daemon, diff, event, trail and image groups split off the records that only some callers need, and each imports the base and the enums, never the other way. Encoding lives on the type through the shared JSON package, so no reader splits lines itself.</desc><defs><marker id="types-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="types-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="types-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">TYPES</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">The shared records sit at the bottom, and the groups lean on them</text><g transform="translate(0,40)"><path data-edge="types->types/enum" id="types-edge-types-types_2fenum" d="M 428 144 L 428 100 Q 428 92 436 92 L 608 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#types-arrow-default)"/><path data-edge="types->libs/diagnostics" id="types-edge-types-libs_2fdiagnostics" d="M 536 172 L 608 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#types-arrow-default)"/><path data-edge="types->internal/json" id="types-edge-types-internal_2fjson" d="M 428 200 L 428 244 Q 428 252 436 252 L 608 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#types-arrow-default)"/><path data-edge="types/daemon->types" id="types-edge-types_2fdaemon-types" d="M 248 92 L 276 92 Q 284 92 284 100 L 284 152 Q 284 160 292 160 L 320 160" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#types-arrow-default)"/><path data-edge="types/diff->types" id="types-edge-types_2fdiff-types" d="M 248 172 L 320 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#types-arrow-default)"/><g data-node="types" data-anchor="types"><rect x="320" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="320" y="144" width="216" height="56" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="428" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Records</text><text x="428" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">targets, runs, findings, jobs</text></g><g data-node="types/enum" data-anchor="types/enum"><rect x="608" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Enums</text><text x="716" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">method sets by hand</text></g><g data-node="libs/diagnostics" data-anchor="libs/diagnostics"><rect x="608" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Diagnostic codes</text><text x="716" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">MGSxxxx</text></g><g data-node="internal/json" data-anchor="internal/json"><rect x="608" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">JSON encoding</text><text x="716" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">on the type</text></g><g data-node="types/daemon" data-anchor="types/daemon"><rect x="32" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Daemon records</text><text x="140" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">server wire types</text></g><g data-node="types/diff" data-anchor="types/diff"><rect x="32" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="144" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Diff records</text><text x="140" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">changes between revisions</text></g><g data-node="types/events" data-anchor="types/events"><rect x="32" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Events</text><text x="140" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the stream</text></g><g data-node="types/trail" data-anchor="types/trail"><rect x="32" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Trail records</text><text x="140" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">audit entries</text></g><g data-node="types/image" data-anchor="types/image"><rect x="32" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="384" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Image records</text><text x="140" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">OCI specs</text></g><line x1="32" y1="476" x2="824" y2="476" stroke="#505466" stroke-width="0.8"/><text x="32" y="490" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="496" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE BASE EVERY PACKAGE IMPORTS</text></g></svg>