<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1152 576" width="1152" height="576" role="img" aria-labelledby="sandbox-title sandbox-desc" class="magus-diagram"><metadata>{"figure":"sandbox","stamp":"sha256:178e5c2616fe6ce89928422bbf40bc4ef7181bbf2a97169a853c0fbe16b0b01b"}</metadata><title id="sandbox-title">What a spell may touch while it runs</title><desc id="sandbox-desc">A spell reaches the sandbox from two sides: the interpreter runs its Buzz in process, and the spawner starts its tool. The sandbox builds one grant. The filesystem half names the readable and writable paths and applies them with landlock where the kernel has it. The environment half rebuilds the child's variables from an allowlist. A job's write paths narrow the writes, a refusal lands in the trail, and the journal keeps the denial.</desc><defs><marker id="sandbox-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="sandbox-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="sandbox-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">SANDBOX</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">What a spell may touch while it runs</text><g transform="translate(0,40)"><path data-edge="internal/sandbox->internal/sandbox/filesystem" id="sandbox-edge-internal_2fsandbox-internal_2fsandbox_2ffilesystem" d="M 536 252 L 616 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/sandbox/env" id="sandbox-edge-internal_2fsandbox-internal_2fsandbox_2fenv" d="M 428 216 L 428 100 Q 428 92 436 92 L 616 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/job" id="sandbox-edge-internal_2fsandbox-internal_2fjob" d="M 440 216 L 440 180 Q 440 172 448 172 L 616 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/journal" id="sandbox-edge-internal_2fsandbox-internal_2fjournal" d="M 536 264 L 560 264 Q 568 264 568 272 L 568 312 Q 568 320 576 320 L 616 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/sandbox->internal/trail" id="sandbox-edge-internal_2fsandbox-internal_2ftrail" d="M 536 240 L 560 240 Q 568 240 568 232 L 568 220 Q 568 212 576 212 L 860 212 Q 868 212 868 204 L 868 192 Q 868 184 876 184 L 904 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/job->internal/trail" id="sandbox-edge-internal_2fjob-internal_2ftrail" d="M 832 172 L 904 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/proc/spawn->internal/sandbox" id="sandbox-edge-internal_2fproc_2fspawn-internal_2fsandbox" d="M 248 240 L 290 240 Q 296 240 296 246 L 296 246 Q 296 252 302 252 L 320 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/proc/spawn->internal/sandbox/filesystem" id="sandbox-edge-internal_2fproc_2fspawn-internal_2fsandbox_2ffilesystem" d="M 248 252 L 276 252 Q 284 252 284 260 L 284 292 Q 284 300 292 300 L 560 300 A 8 8 0 0 1 576 300 L 576 300 Q 584 300 584 292 L 584 272 Q 584 264 592 264 L 616 264" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><path data-edge="internal/proc/spawn->internal/journal" id="sandbox-edge-internal_2fproc_2fspawn-internal_2fjournal" d="M 248 264 L 264 264 Q 272 264 272 272 L 272 324 Q 272 332 280 332 L 616 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#sandbox-arrow-default)"/><rect x="574" y="230" width="36" height="12" rx="2" fill="#2d3142"/><text x="592" y="239" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PATHS</text><rect x="492" y="70" width="56" height="12" rx="2" fill="#2d3142"/><text x="520" y="79" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VARIABLES</text><rect x="516" y="150" width="24" height="12" rx="2" fill="#2d3142"/><text x="528" y="159" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ROW</text><g data-node="internal/sandbox" data-anchor="internal/sandbox"><rect x="320" y="216" width="216" height="72" rx="6" fill="#2d3142"/><rect x="320" y="216" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="428" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Sandbox</text><text x="428" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one grant per run</text></g><g data-node="internal/sandbox/filesystem" data-anchor="internal/sandbox/filesystem"><rect x="616" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="616" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="724" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Filesystem grant</text><text x="724" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">landlock where the kernel has it</text></g><g data-node="internal/sandbox/env" data-anchor="internal/sandbox/env"><rect x="616" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="616" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="724" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Environment</text><text x="724" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">allowlist, no secrets</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="616" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="616" y="144" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="724" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job store</text><text x="724" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">write paths narrow the grant</text></g><g data-node="internal/journal" data-anchor="internal/journal"><rect x="616" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="616" y="304" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="724" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Journal</text><text x="724" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the denial kept</text></g><g data-node="internal/trail" data-anchor="internal/trail"><rect x="904" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="904" y="144" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="1012" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Trail</text><text x="1012" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the refusal</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="32" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Interpreter</text><text x="140" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">Buzz, in process</text></g><g data-node="internal/proc/spawn" data-anchor="internal/proc/spawn"><rect x="32" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spawner</text><text x="140" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the tool's process</text></g><g data-node="internal/spell" data-anchor="internal/spell"><rect x="32" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="384" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spells</text><text x="140" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ops that run</text></g><line x1="32" y1="476" x2="1120" y2="476" stroke="#505466" stroke-width="0.8"/><text x="32" y="490" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="496" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE GRANT</text><rect x="192" y="496" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="505" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">RECORDS</text></g></svg>