<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1272 712" width="1272" height="712" role="img" aria-labelledby="agent-integration-title agent-integration-desc" class="magus-diagram"><metadata>{"figure":"agent-integration","stamp":"sha256:bb408943aefaba86fc9db13d7c63b6fcdcd3331b96f3609fd47d51384300e9cd"}</metadata><title id="agent-integration-title">What an agent host gets, and the gate every call crosses</title><desc id="agent-integration-desc">magus agent install writes the skills and the AGENTS.md block, and magus describe harness prints the hook entries a person merges into the host's config. From then on the host runs the guard's PreToolUse hook before every shell command, file edit and magus MCP call, and only an allowed call runs. Skills, guard verdicts and MCP replies all name commands through internal/hint, so a renamed command cannot leave one of them pointing at nothing.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="agent-integration-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="agent-integration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="agent-integration-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">AGENTS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">What an agent host gets, and the gate every call crosses</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="200" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="56" y="68" width="168" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="140" y="77" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">INSTALLED BEFORE A SESSION</text><rect x="592" y="376" width="648" height="200" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="872" y="380" width="88" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="916" y="389" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ON EVERY CALL</text><path data-edge="internal/agent->external:Agent host" id="agent-integration-edge-internal_2fagent-external_3aAgent_20host" d="M 248 140 L 284 140 Q 292 140 292 148 L 292 304 Q 292 312 300 312 L 320 312" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#agent-integration-arrow-default)"/><path data-edge="internal/agent->internal/hint" id="agent-integration-edge-internal_2fagent-internal_2fhint" d="M 248 128 L 908 128 Q 916 128 916 136 L 916 420 Q 916 428 924 428 L 1008 428" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marke