<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 960" width="700" height="960" role="img" aria-labelledby="agent-integration-title agent-integration-desc" class="magus-diagram"><metadata>{"diagram":"agent-integration","stamp":"sha256:b63dedf17133a924b9db441f2e92f9dca128f2b1ad59befb2587a3c66a4cf2ae"}</metadata><title id="agent-integration-title">Every call an agent host makes crosses the guard first</title><desc id="agent-integration-desc">magus agent install writes the skills and the AGENTS.md block, and a harness spell prints the hook entry for the host's config. The host then runs the guard before every shell command, edit and MCP call, and only an allowed call runs. The guard reads the job store for the call's lease, and every reply names commands through internal/hint.</desc><style>.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#f5f5f5);--magus-diagram-paint-fill:var(--magus-diagram-fill,#ffffff);--magus-diagram-paint-ink:var(--magus-diagram-ink,#2d3142);--magus-diagram-paint-muted:var(--magus-diagram-muted,#4f5d75);--magus-diagram-paint-soft:var(--magus-diagram-soft,#5f6780);--magus-diagram-paint-rule:var(--magus-diagram-rule,#e6e6e8);--magus-diagram-paint-accent:var(--magus-diagram-accent,#eb6c36);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-diagram-paint-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#2d3142);--magus-diagram-paint-fill:var(--magus-diagram-fill,#393e53);--magus-diagram-paint-ink:var(--magus-diagram-ink,#f5f5f5);--magus-diagram-paint-muted:var(--magus-diagram-muted,#bfc0c0);--magus-diagram-paint-soft:var(--magus-diagram-soft,#a9b1c2);--magus-diagram-paint-rule:var(--magus-diagram-rule,#505466);--magus-diagram-paint-accent:var(--magus-diagram-accent,#f08a59);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-diagram-paint-link:var(--magus-diagram-link,