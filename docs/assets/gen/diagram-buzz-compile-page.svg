<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1472 512" width="1472" height="512" role="img" aria-labelledby="buzz-compile-title buzz-compile-desc" class="magus-diagram"><metadata>{"figure":"buzz-compile","stamp":"sha256:f7339b57580cf05113286c808cbbccb469664ee25d380b0a581fcd9b3fb4d4c1"}</metadata><title id="buzz-compile-title">From Buzz source to a chunk</title><desc id="buzz-compile-desc">Session.Exec compiles source in six steps, all in the gopherbuzz root package except the first and the last. The lexer, token.Tokenize, turns the source into tokens; a session given a parse cache keeps them by source text, so a module many sessions import is lexed once. The parser builds an ast.Program. Before the checker sees it, import resolution runs every imported file through this same pipeline and the VM, so their exports are bound when the checker looks names up. The checker reports types.Type mismatches as BZZ diagnostics, and the compiler emits a vm.Chunk, one per function. In the vm package, FoldConsts folds constants and FusePeephole fuses the common local, constant and branch sequences into superinstructions. A session with a bytecode store saves the chunk with every file it was compiled against and, on a later run where all of them still hold the same bytes, hands the saved chunk to the VM without parsing anything.</desc><defs><marker id="buzz-compile-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="buzz-compile-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="buzz-compile-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">GOPHERBUZZ</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">From Buzz source to a chunk</text><g transform="translate(0,40)"><path data-edge="libs/gopherbuzz/token->external:Parse cache" id="buzz-compile-edge-libs_2fgopherbuzz_2ftoken-external_3aParse_20cache" d="M 248 92 L 328 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Parse cache->external:Parser" id="buzz-compile-edge-external_3aParse_20cache-external_3aParser" d="M 544 92 L 616 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Parser->external:Import resolution" id="buzz-compile-edge-external_3aParser-external_3aImport_20resolution" d="M 832 92 L 928 92" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Import resolution->external:Checker" id="buzz-compile-edge-external_3aImport_20resolution-external_3aChecker" d="M 1036 120 L 1036 192" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Checker->external:Compiler" id="buzz-compile-edge-external_3aChecker-external_3aCompiler" d="M 1144 220 L 1224 220" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Compiler->libs/gopherbuzz/vm" id="buzz-compile-edge-external_3aCompiler-libs_2fgopherbuzz_2fvm" d="M 1332 248 L 1332 320" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Bytecode store->libs/gopherbuzz/vm" id="buzz-compile-edge-external_3aBytecode_20store-libs_2fgopherbuzz_2fvm" d="M 248 348 L 1224 348" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><rect x="260" y="70" width="56" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="288" y="79" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ON A MISS</text><rect x="558" y="70" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="580" y="79" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">[]TOKEN</text><rect x="844" y="70" width="72" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="880" y="79" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">*AST.PROGRAM</text><rect x="1046" y="148" width="76" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="1084" y="157" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXPORTS BOUND</text><rect x="1156" y="198" width="56" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="1184" y="207" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO ERRORS</text><rect x="1342" y="276" width="36" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="1360" y="285" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EMITS</text><rect x="708" y="326" width="56" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="736" y="335" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FRESH HIT</text><g data-node="libs/gopherbuzz/token" data-anchor="libs/gopherbuzz/token/token.go"><rect x="32" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="140" y="92" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Lexer</text><text x="140" y="108" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">token.Tokenize</text></g><g data-node="external:Parse cache"><rect x="328" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="328" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="436" y="92" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Parse cache</text><text x="436" y="108" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">tokens keyed by source</text></g><g data-node="external:Parser"><rect x="616" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="616" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="724" y="92" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Parser</text><text x="724" y="108" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">recursive descent, *ast.Program</text></g><g data-node="external:Import resolution"><rect x="928" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="928" y="64" width="216" height="56" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><text x="1036" y="92" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Import resolution</text><text x="1036" y="108" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">runs each module first</text></g><g data-node="external:Checker"><rect x="928" y="192" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="928" y="192" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1036" y="220" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Checker</text><text x="1036" y="236" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">types.Type, BZZ codes</text></g><g data-node="external:Compiler"><rect x="1224" y="192" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="1224" y="192" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1332" y="220" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Compiler</text><text x="1332" y="236" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">AST to *vm.Chunk</text></g><g data-node="external:Bytecode store"><rect x="32" y="320" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="320" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="140" y="348" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Bytecode store</text><text x="140" y="364" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">.bo plus its import closure</text></g><g data-node="libs/gopherbuzz/vm" data-anchor="libs/gopherbuzz/vm/chunk.go"><rect x="1224" y="320" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="1224" y="320" width="216" height="56" rx="6" fill="var(--magus-diagram-fill, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1332" y="348" fill="var(-