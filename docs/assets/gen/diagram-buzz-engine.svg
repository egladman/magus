<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 352" width="1280" height="352" role="img" aria-labelledby="buzz-engine-title buzz-engine-desc" class="magus-diagram"><metadata>{"figure":"buzz-engine","stamp":"sha256:428711c65540e70789c222ceb0de1f87abd3fdbfa253577cf99b06b12b7b2858"}</metadata><title id="buzz-engine-title">One pipeline, and the modules each host registers</title><desc id="buzz-engine-desc">Every Buzz program magus touches goes through the same gopherbuzz pipeline: lex, parse, check, compile, run. Hosts differ only in the modules they register first. The host bindings attach to the magusfile engine at init and provide every magus host module, each through the trampoline generated from its descriptor. The browser playground runs the dry evaluator, which installs only the trampolines marked WASM, pure compute with no filesystem, process or network access, and records host calls instead of running them. Both also install the Buzz stdlib.</desc><defs><marker id="buzz-engine-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="buzz-engine-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="buzz-engine-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">BUZZ</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One pipeline, and the modules each host registers</text><g transform="translate(0,40)"><path data-edge="internal/interp/bindings->internal/interp" id="buzz-engine-edge-internal_2finterp_2fbindings-internal_2finterp" d="M 248 96 L 344 96" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings->internal/interp/bindings/gen" id="buzz-engine-edge-internal_2finterp_2fbindings-internal_2finterp_2fbindings_2fgen" d="M 140 128 L 140 132 Q 140 140 148 140 L 652 140 Q 660 140 660 148 L 660 164 Q 660 172 668 172 L 744 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp->group:gopherbuzz" id="buzz-engine-edge-internal_2finterp-group_3agopherbuzz" d="M 560 96 L 744 96" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings/gen->std" id="buzz-engine-edge-internal_2finterp_2fbindings_2fgen-std" d="M 960 184 L 1032 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="external:Browser playground->internal/dry" id="buzz-engine-edge-external_3aBrowser_20playground-internal_2fdry" d="M 248 184 L 344 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/dry->group:gopherbuzz" id="buzz-engine-edge-internal_2fdry-group_3agopherbuzz" d="M 560 172 L 636 172 Q 644 172 644 164 L 644 148 A 8 8 0 0 1 644 132 L 644 116 Q 644 108 652 108 L 744 108" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/dry->internal/interp/bindings/gen" id="buzz-engine-edge-internal_2fdry-internal_2finterp_2fbindings_2fgen" d="M 560 184 L 744 184" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-accent)"/><rect x="276" y="74" width="40" height="12" rx="2" fill="#2d3142"/><text x="296" y="83" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INIT()</text><rect x="260" y="118" width="72" height="12" rx="2" fill="#2d3142"/><text x="296" y="127" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY MODULE</text><rect x="624" y="74" width="56" height="12" rx="2" fill="#2d3142"/><text x="652" y="83" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MAGUSFILE</text><rect x="280" y="162" width="32" height="12" rx="2" fill="#2d3142"/><text x="296" y="171" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS</text><rect x="662" y="118" width="76" height="12" rx="2" fill="#2d3142"/><text x="700" y="127" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EDITOR SOURCE</text><rect x="626" y="194" width="52" height="12" rx="2" fill="#2d3142"/><text x="652" y="203" fill="#a9b1c2" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">WASM SET</text><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="32" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Host bindings</text><text x="140" y="112" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus namespace, init()</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="344" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="344" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="452" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Magusfile engine</text><text x="452" y="112" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">load magusfiles, run targets</text></g><g data-node="group:gopherbuzz"><rect x="744" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="744" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="852" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">gopherbuzz</text><text x="852" y="112" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">lex, parse, check, compile, run</text></g><g data-node="internal/interp/bindings/gen" data-anchor="internal/interp/bindings/gen"><rect x="744" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="744" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="852" y="184" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Trampolines</text><text x="852" y="200" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">every module, plus a WASM set</text></g><g data-node="std" data-anchor="std"><rect x="1032" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="1032" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1140" y="184" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Host modules</text><text x="1140" y="200" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">fs, vcs, proc, http, json</text></g><g data-node="external:Browser playground"><rect x="32" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="40" y="160" width="48" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="64" y="169" fill="#a9b1c2" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Browser playground</text><text x="140" y="208" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">js/wasm editor</text></g><g data-node="internal/dry" data-anchor="internal/dry"><rect x="344" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="344" y="152" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="452" y="184" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Dry evaluator</text><text x="452" y="200" fill="#a9b1c2" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">records host calls</text></g><line x1="32" y1="252" x2="1248" y2="252" stroke="#505466" stroke-width="0.8"/><text x="32" y="266" fill="#bfc0c0" font-size="8" font