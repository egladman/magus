<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 576" width="1144" height="576" role="img" aria-labelledby="buzz-engine-title buzz-engine-desc" class="magus-diagram"><metadata>{"figure":"buzz-engine","stamp":"sha256:ce4d018f2e0d984c5d8dcca7be38f73cf392346e1a1be6a4c471290d817b6314"}</metadata><title id="buzz-engine-title">One pipeline, and the modules each host registers</title><desc id="buzz-engine-desc">Every Buzz program magus touches goes through the same gopherbuzz pipeline: lex, parse, check, compile, run. Hosts differ only in the modules they register first. The host bindings attach to the magusfile engine at init and provide every magus host module, each through the trampoline generated from its descriptor. The browser playground runs the dry evaluator, which installs only the trampolines marked WASM, pure compute with no filesystem, process or network access, and records host calls instead of running them. Both also install the Buzz stdlib.</desc><defs><marker id="buzz-engine-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="buzz-engine-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="buzz-engine-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">BUZZ</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">One pipeline, and the modules each host registers</text><g transform="translate(0,40)"><path data-edge="internal/interp/bindings->internal/interp" id="buzz-engine-edge-internal_2finterp_2fbindings-internal_2finterp" d="M 248 96 L 320 96" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings->internal/interp/bindings/gen" id="buzz-engine-edge-internal_2finterp_2fbindings-internal_2finterp_2fbindings_2fgen" d="M 140 128 L 140 132 Q 140 140 148 140 L 572 140 Q 580 140 580 148 L 580 164 Q 580 172 588 172 L 608 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings/opencode->group:gopherbuzz" id="buzz-engine-edge-internal_2finterp_2fbindings_2fopencode-group_3agopherbuzz" d="M 248 408 L 556 408 Q 564 408 564 400 L 564 292 Q 564 284 572 284 L 608 284" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings/opencode/wasm->internal/interp/bindings/opencode" id="buzz-engine-edge-internal_2finterp_2fbindings_2fopencode_2fwasm-internal_2finterp_2fbindings_2fopencode" d="M 140 304 L 140 376" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp->group:gopherbuzz" id="buzz-engine-edge-internal_2finterp-group_3agopherbuzz" d="M 536 96 L 556 96 Q 564 96 564 104 L 564 132 A 8 8 0 0 0 564 148 L 564 176 A 8 8 0 0 0 564 192 L 564 252 Q 564 260 572 260 L 608 260" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings/gen->std" id="buzz-engine-edge-internal_2finterp_2fbindings_2fgen-std" d="M 824 184 L 896 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="external:Browser playground->internal/dry" id="buzz-engine-edge-external_3aBrowser_20playground-internal_2fdry" d="M 248 184 L 320 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/dry->group:gopherbuzz" id="buzz-engine-edge-internal_2fdry-group_3agopherbuzz" d="M 428 216 L 428 264 Q 428 272 436 272 L 608 272" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/dry->internal/interp/bindings/gen" id="buzz-engine-edge-internal_2fdry-internal_2finterp_2fbindings_2fgen" d="M 536 184 L 608 184" fill="none" stroke="#f08a59" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-accent)"/><rect x="264" y="74" width="40" height="12" rx="2" fill="#2d3142"/><text x="284" y="83" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INIT()</text><rect x="268" y="162" width="32" height="12" rx="2" fill="#2d3142"/><text x="284" y="171" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS</text><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="32" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="96" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host bindings</text><text x="140" y="112" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus namespace, init()</text></g><g data-node="internal/interp/bindings/opencode" data-anchor="internal/interp/bindings/opencode"><rect x="32" y="376" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="376" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="408" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">OpenCode binding</text><text x="140" y="424" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">plugin, runtime</text></g><g data-node="internal/interp/bindings/opencode/wasm" data-anchor="internal/interp/bindings/opencode/wasm"><rect x="32" y="240" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="240" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="272" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">OpenCode WASM</text><text x="140" y="288" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">main, plugin</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="320" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="428" y="96" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Magusfile engine</text><text x="428" y="112" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">load magusfiles, run targets</text></g><g data-node="group:gopherbuzz"><rect x="608" y="240" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="240" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="272" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">gopherbuzz</text><text x="716" y="288" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">lex, parse, check, compile, run</text></g><g data-node="internal/interp/bindings/gen" data-anchor="internal/interp/bindings/gen"><rect x="608" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="184" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Trampolines</text><text x="716" y="200" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">every module, plus a WASM set</text></g><g data-node="std" data-anchor="std"><rect x="896" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="896" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="1004" y="184" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host modules</text><text x="1004" y="200" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">fs, vcs, proc, http, json</text></g><g data-node="external:Browser playground"><rect x="32" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><rect x="40" y="160" width="48" height="12" rx="2" fill="none" stroke="#505466" stroke-width="0.8"/><text x="64" y="169" fill="#a9b1c2" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="192" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Browser playground</text><text x="140" y="208" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">js/wasm editor</text></g><g data-node="internal/dry" data-anchor="internal/dry"><rect x="320" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="152" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="428" y="184" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Dry evaluator</text><text x="428" y="200" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">records host c