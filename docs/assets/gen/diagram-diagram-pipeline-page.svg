<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 944" width="680" height="944" role="img" aria-labelledby="diagram-pipeline-title diagram-pipeline-desc" class="magus-diagram"><metadata>{"diagram":"diagram-pipeline","stamp":"sha256:4df746abd5ee3c10a19951b5bc5f0c3392574e21af2140dd2284fd66cf18cfc7"}</metadata><title id="diagram-pipeline-title">One library draws every diagram, here and in the console</title><desc id="diagram-pipeline-desc">A diagram in docs/site/diagrams builds its boxes from the knowledge graph's records and draws the imports and declared calls between them. magus/diagram lays it out and paints it; diagrams-generate writes the committed copies with a receipt beside each. The server embeds the same module to draw the console's live diagrams, and the job store draws its plan through it.</desc><style>.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#f5f5f5);--magus-diagram-paint-fill:var(--magus-diagram-fill,#ffffff);--magus-diagram-paint-ink:var(--magus-diagram-ink,#2d3142);--magus-diagram-paint-muted:var(--magus-diagram-muted,#4f5d75);--magus-diagram-paint-soft:var(--magus-diagram-soft,#5f6780);--magus-diagram-paint-rule:var(--magus-diagram-rule,#e6e6e8);--magus-diagram-paint-accent:var(--magus-diagram-accent,#eb6c36);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-diagram-paint-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#2d3142);--magus-diagram-paint-fill:var(--magus-diagram-fill,#393e53);--magus-diagram-paint-ink:var(--magus-diagram-ink,#f5f5f5);--magus-diagram-paint-muted:var(--magus-diagram-muted,#bfc0c0);--magus-diagram-paint-soft:var(--magus-diagram-soft,#a9b1c2);--magus-diagram-paint-rule:var(--magus-diagram-rule,#505466);--magus-diagram-paint-accent:var(--magus-diagram-accent,#f08a59);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-diagram-paint-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-diagram-paint-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-diagram-paint-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-diagram-paint-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-diagram-paint-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-diagram-paint-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-diagram-paint-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-diagram-paint-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-diagram-paint-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-diagram-paint-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-diagram-paint-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-diagram-paint-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-diagram-paint-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-diagram-paint-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-diagram-paint-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-diagram-paint-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-diagram-paint-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="diagram-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="diagram-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="diagram-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">DIAGRAMS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">One library draws every diagram, here and in the console</text><g transform="translate(0,40)"><path data-edge="external:Diagram source->std" id="diagram-pipeline-edge-external_3aDiagram_20source-std" d="M 140 128 L 140 200" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:Diagram source->libs/diagram" id="diagram-pipeline-edge-external_3aDiagram_20source-libs_2fdiagram" d="M 248 96 L 252 96 Q 260 96 260 104 L 260 286 Q 260 292 266 292 L 266 292 Q 272 292 272 298 L 272 472" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="std->libs/diagram" id="diagram-pipeline-edge-std-libs_2fdiagram" d="M 152 264 L 152 300 Q 152 308 160 308 L 252 308 Q 260 308 260 316 L 260 472" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="std->internal/job" id="diagram-pipeline-edge-std-internal_2fjob" d="M 140 264 L 140 336" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="libs/diagram->external:SVGs + receipts" id="diagram-pipeline-edge-libs_2fdiagram-external_3aSVGs_20_2b_20receipts" d="M 260 536 L 260 608" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:SVGs + receipts->external:Site render" id="diagram-pipeline-edge-external_3aSVGs_20_2b_20receipts-external_3aSite_20render" d="M 260 672 L 260 744" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="internal/handler/diagram->libs/diagram" id="diagram-pipeline-edge-internal_2fhandler_2fdiagram-libs_2fdiagram" d="M 380 264 L 380 428 Q 380 436 372 436 L 292 436 Q 284 436 284 444 L 284 472" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="internal/job->libs/diagram" id="diagram-pipeline-edge-internal_2fjob-libs_2fdiagram" d="M 140 400 L 140 428 Q 140 436 148 436 L 240 436 Q 248 436 248 444 L 248 472" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:Console view->internal/handler/diagram" id="diagram-pipeline-edge-external_3aConsole_20view-internal_2fhandler_2fdiagram" d="M 380 128 L 380 200" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><rect x="150" y="156" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="172" y="165" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RECORDS</text><rect x="270" y="176" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="292" y="185" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">IMPORTS</text><rect x="184" y="286" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="204" y="295" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EMBEDS</text><rect x="270" y="564" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="290" y="573" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PAINTS</text><rect x="270" y="700" width="56" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="298" y="709" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PAGE COPY</text><rect x="390" y="156" width="24" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="402" y="165" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GET</text><g data-node="external:Diagram source"><rect x="32" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><rect x="40" y="72" width="36" height="12" rx="2" fill="none" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="58" y="81" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">BUZZ</text><text x="140" y="104" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Diagram source</text><text x="140" y="120" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">records, sets, actors</text></g><g data-node="std" data-anchor="std"><rect x="32" y="200" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="200" width="216" height="64" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="232" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">magus module</text><text x="140" y="248" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">dir, dirs, layer from the graph</text></g><g data-node="libs/diagram" data-anchor="libs/diagram"><rect x="152" y="472" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="152" y="472" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="260" y="504" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">magus/diagram</text><text x="260" y="520" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sets, layout, paint</text></g><g data-node="external:SVGs + receipts"><rect x="152" y="608" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="152" y="608" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="260" y="640" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">SVGs + receipts</text><text x="260" y="656" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">diagrams-generate</text></g><g data-node="external:Site render"><rect x="152" y="744" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="152" y="744" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="260" y="776" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Site render</text><text x="260" y="792" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">inlines the page copy</text></g><g data-node="internal/handler/diagram" data-anchor="internal/handler/diagram"><rect x="272" y="200" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="272" y="200" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="380" y="232" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">/api/v1/diagrams</text><text x="380" y="248" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the module in-process</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="32" y="336" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="336" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="368" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Job plan diagram</text><text x="140" y="384" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">draws rows with the same module</text></g><g d