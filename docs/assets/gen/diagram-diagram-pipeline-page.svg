<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1432 352" width="1432" height="352" role="img" aria-labelledby="diagram-pipeline-title diagram-pipeline-desc" class="magus-diagram"><metadata>{"figure":"diagram-pipeline","stamp":"sha256:3a7141e1f3f9d95d2251e01bd8488cf9452e1578bc5faa7eae46eda6af55b0a6"}</metadata><title id="diagram-pipeline-title">One library draws every figure, here and in the console</title><desc id="diagram-pipeline-desc">A figure in docs/site/diagrams builds its boxes from the knowledge graph's own records, magus\dir, magus\dirs and magus\layer, and draws the imports and declared calls between them. magus/figure lays it out and paints it; diagrams-generate writes the committed light, dark and page copies with a receipt beside each, and the site render inlines the page copy. The server embeds the same module to draw live figures at /api/v1/diagrams, which the console fetches.</desc><defs><marker id="diagram-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="diagram-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="diagram-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">FIGURES</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One library draws every figure, here and in the console</text><g transform="translate(0,40)"><path data-edge="external:Figure source->std" id="diagram-pipeline-edge-external_3aFigure_20source-std" d="M 248 96 L 320 96" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:Figure source->libs/figure" id="diagram-pipeline-edge-external_3aFigure_20source-libs_2ffigure" d="M 140 128 L 140 132 Q 140 140 148 140 L 608 140" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="std->libs/figure" id="diagram-pipeline-edge-std-libs_2ffigure" d="M 536 96 L 564 96 Q 572 96 572 104 L 572 120 Q 572 128 580 128 L 608 128" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="libs/figure->external:SVGs + receipts" id="diagram-pipeline-edge-libs_2ffigure-external_3aSVGs_20_2b_20receipts" d="M 824 140 L 896 140" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:SVGs + receipts->external:Site render" id="diagram-pipeline-edge-external_3aSVGs_20_2b_20receipts-external_3aSite_20render" d="M 1112 140 L 1184 140" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="internal/handler/diagram->libs/figure" id="diagram-pipeline-edge-internal_2fhandler_2fdiagram-libs_2ffigure" d="M 536 184 L 564 184 Q 572 184 572 176 L 572 160 Q 572 152 580 152 L 608 152" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:Console view->internal/handler/diagram" id="diagram-pipeline-edge-external_3aConsole_20view-internal_2fhandler_2fdiagram" d="M 248 184 L 320 184" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><rect x="262" y="74" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="284" y="83" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RECORDS</text><rect x="270" y="118" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="292" y="127" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">IMPORTS</text><rect x="548" y="74" width="40" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="568" y="83" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EMBEDS</text><rect x="840" y="118" width="40" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="860" y="127" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PAINTS</text><rect x="1120" y="118" width="56" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="1148" y="127" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PAGE COPY</text><rect x="272" y="162" width="24" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="284" y="171" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GET</text><g data-node="external:Figure source"><rect x="32" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><rect x="40" y="72" width="36" height="12" rx="2" fill="none" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="58" y="81" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">BUZZ</text><text x="140" y="104" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Figure source</text><text x="140" y="120" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">records, sets, actors</text></g><g data-node="std" data-anchor="std"><rect x="320" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="320" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="428" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus module</text><text x="428" y="112" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">dir, dirs, layer from the graph</text></g><g data-node="libs/figure" data-anchor="libs/figure"><rect x="608" y="108" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="608" y="108" width="216" height="64" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><text x="716" y="140" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus/figure</text><text x="716" y="156" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">sets, layout, paint</text></g><g data-node="external:SVGs + receipts"><rect x="896" y="108" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="896" y="108" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1004" y="140" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">SVGs + receipts</text><text x="1004" y="156" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">diagrams-generate</text></g><g data-node="external:Site render"><rect x="1184" y="108" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="1184" y="108" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="1292" y="140" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Site render</text><text x="1292" y="156" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">inlines the page copy</text></g><g data-node="internal/handler/diagram" data-anchor="internal/handler/diagram"><rect x="320" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="320" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="428" y="184" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1/diagrams</text><text x="428" y="200" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the module in-process</text></g><g data-node="external:Console view"><rect x="32" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="140" y="184" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Console view</text><text x="140" y="200" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">static SVG, then wasm</text></g><line x1="32" y1="252" x2="1400" y2="252" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="32" y="266" fill="var(--magus-diagram-muted, #4f5d75)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="272" width="10" height="10" rx="2" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="0.8"/><text x="50" y="281" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE LAYOUT</text><rect x="192" y="272" width="10" height="10" rx="2" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="210" y="281" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">READS THE KNOWLEDGE GRAPH</text><rect x="352" y="272" width="10" height="10" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="370" y="281" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">COMMITTED OUTPUT</text></g></svg>