<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1768 352" width="1768" height="352" role="img" aria-labelledby="diagram-pipeline-title diagram-pipeline-desc" class="magus-diagram"><metadata>{"figure":"diagram-pipeline","stamp":"sha256:05589921dc4a47d477acad70111014d6af440174877cd2ca56d1f2a2d586029f"}</metadata><title id="diagram-pipeline-title">One library draws every figure, here and in the console</title><desc id="diagram-pipeline-desc">A figure in docs/site/diagrams builds its boxes from the knowledge graph's own records, magus\graph().dir, magus\graph().dirs and magus\graph().layer, and draws the imports and declared calls between them. magus/figure lays it out and paints it; diagrams-generate writes the committed light, dark and page copies with a receipt beside each, and the site render inlines the page copy. The server embeds the same module to draw live figures at /api/v1/diagrams, which the console fetches. The job store draws its plan figure through the same module, and each figure's receipt carries a stamp of its boxes and edges, so a stale committed copy is a diff.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="diagram-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="diagram-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="diagram-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">FIGURES</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">One library draws every figure, here and in the console</text><g transform="translate(0,40)"><path data-edge="external:Figure source->std" id="diagram-pipeline-edge-external_3aFigure_20source-std" d="M 248 96 L 320 96" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:Figure source->libs/figure" id="diagram-pipeline-edge-external_3aFigure_20source-libs_2ffigure" d="M 140 128 L 140 132 Q 140 140 148 140 L 570 140 Q 576 140 576 146 L 576 146 Q 576 152 582 152 L 944 152" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="std->libs/figure" id="diagram-pipeline-edge-std-libs_2ffigure" d="M 536 108 L 584 108 Q 592 108 592 116 L 592 132 Q 592 140 600 140 L 944 140" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="std->internal/job" id="diagram-pipeline-edge-std-internal_2fjob" d="M 536 96 L 632 96" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="libs/figure->external:SVGs + receipts" id="diagram-pipeline-edge-libs_2ffigure-external_3aSVGs_20_2b_20receipts" d="M 1160 140 L 1232 140" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:SVGs + receipts->external:Site render" id="diagram-pipeline-edge-external_3aSVGs_20_2b_20receipts-external_3aSite_20render" d="M 1448 140 L 1520 140" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="internal/handler/diagram->libs/figure" id="diagram-pipeline-edge-internal_2fhandler_2fdiagram-libs_2ffigure" d="M 536 184 L 888 184 Q 896 184 896 176 L 896 172 Q 896 164 904 164 L 944 164" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="internal/job->libs/figure" id="diagram-pipeline-edge-internal_2fjob-libs_2ffigure" d="M 848 96 L 888 96 Q 896 96 896 104 L 896 120 Q 896 128 904 128 L 944 128" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:Console view->internal/handler/diagram" id="diagram-pipeline-edge-external_3aConsole_20view-internal_2fhandler_2fdiagram" d="M 248 184 L 320 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><rect x="262" y="74" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="284" y="83" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RECORDS</text><rect x="270" y="118" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="292" y="127" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">IMPORTS</text><rect x="544" y="118" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="564" y="127" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EMBEDS</text><rect x="1176" y="118" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="1196" y="127" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PAINTS</text><rect x="1456" y="118" width="56" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="1484" y="127" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PAGE COPY</text><rect x="272" y="162" width="24" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="284" y="171" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GET</text><g data-node="external:Figure source"><rect x="32" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><rect x="40" y="72" width="36" height="12" rx="2" fill="none" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="58" y="81" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">BUZZ</text><text x="140" y="104" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Figure source</text><text x="140" y="120" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">records, sets, actors</text></g><g data-node="std" data-anchor="std"><rect x="320" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="64" width="216" height="64" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="428" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">magus module</text><text x="428" y="112" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">dir, dirs, layer from the graph</text></g><g data-node="libs/figure" data-anchor="libs/figure"><rect x="944" y="104" width="216" height="72" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="944" y="104" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="1052" y="140" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">magus/figure</text><text x="1052" y="156" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sets, layout, paint</text></g><g data-node="external:SVGs + receipts"><rect x="1232" y="108" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1232" y="108" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="1340" y="140" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">SVGs + receipts</text><text x="1340" y="156" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">diagrams-generate</text></g><g data-node="external:Site render"><rect x="1520" y="108" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1520" y="108" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1628" y="140" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Site render</text><text x="1628" y="156" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">inlines the page copy</text></g><g data-node="internal/handler/diagram" data-anchor="internal/handler/diagram"><rect x="320" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="428" y="184" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">/api/v1/diagrams</text><text x="428" y="200" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the module in-process</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="632" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="632" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="740" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Job plan figure</text><text x="740" y="112" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">draws rows with the same module</text></g><g data-node="external:Console view"><rect x="32" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="184" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Console view</text><text x="140" y="200" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">static SVG, then wasm</text></g><line x1="32" y1="252" x2="1736" y2="252" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="266" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="272" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="0.8"/><text x="50" y="281" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE LAYOUT</text><rect x="192" y="272" width="10" height="10" rx="2" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="281" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">READS THE KNOWLEDGE GRAPH</text><rect x="352" y="272" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="0.8"/><text x="370" y="281" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">COMMITTED OUTPUT</text></g