" y="176" width="200" height="64" rx="6" fill="#13171f"/><rect x="288" y="176" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="296" y="184" width="28" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="310" y="193" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="388" y="216" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">SCIP indexer</text><text x="388" y="232" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">symbol index</text><rect x="288" y="264" width="200" height="64" rx="6" fill="#13171f"/><rect x="288" y="264" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="296" y="272" width="28" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="310" y="281" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">JOB</text><text x="388" y="304" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Graph build</text><text x="388" y="320" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">coalesced, async</text><rect x="624" y="160" width="200" height="88" rx="6" fill="#13171f"/><rect x="624" y="160" width="200" height="88" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><rect x="632" y="168" width="40" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="652" y="177" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">STATE</text><text x="724" y="200" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace registry</text><text x="724" y="216" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the warm graph</text><line x1="32" y1="392" x2="928" y2="392" stroke="#202632" stroke-width="0.8"/><rect x="32" y="400" width="10" height="10" rx="2" fill="#13171f" stroke="#6b7383" stroke-width="0.8"/><text x="50" y="409" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE THE DAEMON</text><rect x="192" y="400" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="210" y="409" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE WARM COPY</text></g></svg>