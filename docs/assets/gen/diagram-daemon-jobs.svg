<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 480" width="960" height="480" role="img" aria-labelledby="daemon-jobs-title daemon-jobs-desc" class="magus-diagram"><title id="daemon-jobs-title">What keeps the warm workspace current</title><desc id="daemon-jobs-desc">File changes drive the watchers and the SCIP auto-indexer; a magus run queues a coalesced graph-build job. All three write into the workspace registry, which is the daemon's single warm copy of the knowledge graph.</desc><defs><marker id="daemon-jobs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="daemon-jobs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="daemon-jobs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS DAEMON</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What keeps the warm workspace current</text><g transform="translate(0,40)"><path d="M 192 124 L 238 124 Q 240 124 240 122 L 240 122 Q 240 120 242 120 L 288 120" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-jobs-arrow-default)"/><path d="M 192 144 L 256 144 Q 264 144 264 152 L 264 200 Q 264 208 272 208 L 288 208" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-jobs-arrow-default)"/><path d="M 192 296 L 288 296" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-jobs-arrow-default)"/><path d="M 488 120 L 552 120 Q 560 120 560 128 L 560 172 Q 560 180 568 180 L 624 180" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-jobs-arrow-default)"/><path d="M 488 208 L 590 208 Q 592 208 592 206 L 592 206 Q 592 204 594 204 L 624 204" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-jobs-arrow-default)"/><path d="M 488 296 L 536 296 Q 544 296 544 288 L 544 232 Q 544 224 552 224 L 624 224" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-jobs-arrow-default)"/><rect x="220" y="274" width="40" height="12" rx="2" fill="#13171f"/><text x="240" y="283" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">QUEUES</text><rect x="530" y="126" width="60" height="12" rx="2" fill="#13171f"/><text x="560" y="135" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INVALIDATE</text><rect x="570" y="182" width="44" height="12" rx="2" fill="#13171f"/><text x="592" y="191" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SYMBOLS</text><rect x="522" y="238" width="44" height="12" rx="2" fill="#13171f"/><text x="544" y="247" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REBUILD</text><rect x="32" y="104" width="160" height="64" rx="6" fill="#13171f"/><rect x="32" y="104" width="160" height="64" rx="6" fill="#13171f" stroke="#6b7383" stroke-width="1"/><rect x="40" y="112" width="40" height="12" rx="2" fill="none" stroke="#6b7383" stroke-width="0.8"/><text x="60" y="121" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">INPUT</text><tex