ing="0.08em">BUZZ</text><text x="140" y="104" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Diagram source</text><text x="140" y="120" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">records, sets, actors</text></g><g data-node="std" data-anchor="std"><rect x="32" y="200" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="200" width="216" height="64" rx="6" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="232" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus module</text><text x="140" y="248" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">dir, dirs, layer from the graph</text></g><g data-node="libs/diagram" data-anchor="libs/diagram"><rect x="152" y="472" width="216" height="64" rx="6" fill="#2d3142"/><rect x="152" y="472" width="216" height="64" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="260" y="504" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">magus/diagram</text><text x="260" y="520" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sets, layout, paint</text></g><g data-node="external:SVGs + receipts"><rect x="152" y="608" width="216" height="64" rx="6" fill="#2d3142"/><rect x="152" y="608" width="216" height="64" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="260" y="640" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">SVGs + receipts</text><text x="260" y="656" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">diagrams-generate</text></g><g data-node="external:Site render"><rect x="152" y="744" width="216" height="64" rx="6" fill="#2d3142"/><rect x="152" y="744" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="260" y="776" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Site render</text><text x="260" y="792" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">inlines the page copy</text></g><g data-node="internal/handler/diagram" data-anchor="internal/handler/diagram"><rect x="272" y="200" width="216" height="64" rx="6" fill="#2d3142"/><rect x="272" y="200" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="380" y="232" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">/api/v1/diagrams</text><text x="380" y="248" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the module in-process</text></g><g data-node="internal/job" data-anchor="internal/job"><rect x="32" y="336" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="336" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="368" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Job plan diagram</text><text x="140" y="384" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">draws rows with the same module</text></g><g data-node="external:Console view"><rect x="272" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="272" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="380" y="96" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Console view</text><text x="380" y="112" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">static SVG, then wasm</text></g><line x1="32" y1="844" x2="648" y2="844" stroke="#505466" stroke-width="0.8"/><text x="32" y="858" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="864" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="873" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE LAYOUT</text><rect x="192" y="864" width="10" height="10" rx="2" fill="#bfc0c0" stroke="#a9b1c2" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="873" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">READS THE KNOWLEDGE GRAPH</text><rect x="352" y="864" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="370" y="873" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">COMMITTED OUTPUT</text></g></svg>