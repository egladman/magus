<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1432 528" width="1432" height="528" role="img" aria-labelledby="diagram-pipeline-title diagram-pipeline-desc" class="magus-diagram"><title id="diagram-pipeline-title">One library draws every figure, here and in the console</title><desc id="diagram-pipeline-desc">A figure declares its boxes and connectors in docs/site/diagrams and composes them over the observed set diagrams_observe writes from the import graph. flow lays it out and the renderer validates and paints it; diagrams_generate writes the committed light and dark pair after the drift verifier checks every anchor, scope and imports claim. The server embeds the same flow source to draw live figures at /api/v1/diagrams, which the console fetches.</desc><defs><marker id="diagram-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="diagram-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="diagram-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">FLOW</text><text x="32" y="60" fill="#f5f5f5" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One library draws every figure, here and in the console</text><g transform="translate(0,40)"><path data-edge="graph->observed" id="diagram-pipeline-edge-graph-observed" d="M 248 272 L 320 272" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="source->flow" id="diagram-pipeline-edge-source-flow" d="M 536 184 L 608 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="observed->flow" id="diagram-pipeline-edge-observed-flow" d="M 536 272 L 564 272 Q 572 272 572 264 L 572 204 Q 572 196 580 196 L 608 196" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="flow->renderer" id="diagram-pipeline-edge-flow-renderer" d="M 824 184 L 896 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="renderer->pair" id="diagram-pipeline-edge-renderer-pair" d="M 1112 184 L 1184 184" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="graph->drift" id="diagram-pipeline-edge-graph-drift" d="M 140 304 L 140 352 Q 140 360 148 360 L 320 360" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="drift->pair" id="diagram-pipeline-edge-drift-pair" d="M 536 360 L 1140 360 Q 1148 360 1148 352 L 1148 204 Q 1148 196 1156 196 L 1184 196" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="server->flow" id="diagram-pipeline-edge-server-flow" d="M 536 96 L 564 96 Q 572 96 572 104 L 572 164 Q 572 172 580 172 L 608 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="console->server" id="diagram-pipeline-edge-console-server" d="M 248 96 L 320 96" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><rect x="206" y="338" width="44" height="12" rx="2" fill="#2d3142"/><text x="228" y="347" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">IMPORTS</text><rect x="822" y="338" width="36" height="12" rx="2" fill="#2d3142"/><text x="840" y="347" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GATES</text><rect x="548" y="74" width="40" height="12" rx="2" fill="#2d3142"/><text x="568" y="83" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EMBEDS</text><rect x="272" y="74" width="24" height="12" rx="2" fill="#2d3142"/><text x="284" y="83" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GET</text><g data-node="source" data-anchor="docs/site/diagrams"><rect x="320" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="328" y="160" width="36" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="346" y="169" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">BUZZ</text><text x="428" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Figure source</text><text x="428" y="208" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">declared boxes + claims</text></g><g data-node="graph" data-anchor="internal/graph/knowledge/packagedeps.go"><rect x="32" y="240" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="240" width="216" height="64" rx="6" fill="#bfc0c0" fill-opacity="0.1" stroke="#8e98ac" stroke-width="1.2"/><text x="140" y="272" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Import graph</text><text x="140" y="288" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus\importGraph()</text></g><g data-node="observed" data-anchor="docs/site/diagrams/gen"><rect x="320" y="240" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="240" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="328" y="248" width="108" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="382" y="257" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">DIAGRAMS_OBSERVE</text><text x="428" y="280" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Observed set</text><text x="428" y="296" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">gen/&lt;id&gt;.buzz, stamped</text></g><g data-node="flow" data-anchor="libs/diagram"><rect x="608" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="608" y="152" width="216" height="64" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1.2"/><text x="716" y="184" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">flow</text><text x="716" y="200" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">compose, rank, route</text></g><g data-node="renderer" data-anchor="libs/diagram/diagram.buzz"><rect x="896" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="896" y="152" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="1004" y="184" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Renderer</text><text x="1004" y="200" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">validate, paint SVG</text></g><g data-node="drift" data-anchor="docs/site/diagrams/all.buzz"><rect x="320" y="328" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="328" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="360" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Drift verifier</text><text x="428" y="376" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">anchors, scope, imports</text></g><g data-node="pair" data-anchor="docs/assets/gen"><rect x="1184" y="152" width="216" height="64" rx="6" fill="#2d3142"/><rect x="1184" y="152" width="216" height="64" rx="6" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><rect x="1192" y="160" width="112" height="12" rx="2" fill="none" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="1248" y="169" fill="#8e98ac" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">DIAGRAMS_GENERATE</text><text x="1292" y="192" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">SVG pair</text><text x="1292" y="208" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">light + dark, committed</text></g><g data-node="server" data-anchor="internal/handler/diagram"><rect x="320" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="320" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="428" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1/diagrams</text><text x="428" y="112" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">flow embedded in-process</text></g><g data-node="console" data-anchor="console/src/console/diagrams"><rect x="32" y="64" width="216" height="64" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#393e53" stroke="rgba(245,245,245,0.12)" stroke-width="1.2"/><text x="140" y="96" fill="#f5f5f5" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Console view</text><text x="140" y="112" fill="#8e98ac" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">static SVG, then wasm</text></g><line x1="32" y1="428" x2="1400" y2="428" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="32" y="442" fill="#bfc0c0" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="448" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="457" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE LAYOUT</text><rect x="192" y="448" width="10" height="10" rx="2" fill="#bfc0c0" fill-opacity="0.1" stroke="#8e98ac" stroke-width="0.8"/><text x="210" y="457" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE SYMBOL INDEX</text><rect x="352" y="448" width="10" height="10" rx="2" fill="#2d3142" stroke="rgba(245,245,245,0.12)" stroke-width="0.8"/><text x="370" y="457" fill="#8e98ac" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">COMMITTED OUTPUT</text></g></svg>