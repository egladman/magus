<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 944" width="680" height="944" role="img" aria-labelledby="diagram-pipeline-title diagram-pipeline-desc" class="magus-diagram"><metadata>{"diagram":"diagram-pipeline","stamp":"sha256:d728d04bc7a8728cab8565a6e8b07e6d933d77e797f0073fc9112fa4b9241a52"}</metadata><title id="diagram-pipeline-title">One library draws every diagram, here and in the console</title><desc id="diagram-pipeline-desc">A diagram in docs/site/diagrams builds its boxes from the knowledge graph's records and draws the imports and declared calls between them. magus/diagram lays it out and paints it; diagrams-generate writes the committed copies with a receipt beside each. The server embeds the same module to draw the console's live diagrams, and the job store draws its plan through it.</desc><defs><marker id="diagram-pipeline-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="diagram-pipeline-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="diagram-pipeline-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">DIAGRAMS</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">One library draws every diagram, here and in the console</text><g transform="translate(0,40)"><path data-edge="external:Diagram source->std" id="diagram-pipeline-edge-external_3aDiagram_20source-std" d="M 140 128 L 140 200" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#diagram-pipeline-arrow-default)"/><path data-edge="external:Diagram source->libs/diagram" 