<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" width="960" height="600" role="img" aria-labelledby="dogfood-title dogfood-desc" class="magus-diagram"><title id="dogfood-title">magus builds magus, then runs the last release at it too</title><desc id="dogfood-desc">Almost every CI job builds magus from the commit under test and runs it against that commit's magusfile, so a change can rely on a feature that has not shipped. One audit job instead runs the pinned previous release against the same magusfile; it is advisory, and a failure reports a breaking change rather than blocking the branch.</desc><defs><marker id="dogfood-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="dogfood-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="dogfood-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">DEVELOPMENT</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">magus builds magus, then runs the last release at it too</text><g transform="translate(0,40)"><rect x="272" y="104" width="656" height="152" rx="8" fill="none" stroke="#dce3eb" stroke-width="1" stroke-dasharray="4,4"/><text x="284" y="124" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.14em">BLOCKING: THE BINARY THIS COMMIT DEFINES</text><rect x="272" y="320" width="656" height="152" rx="8" fill="none" stroke="#dce3eb" stroke-width="1" stroke-dasharray="4,4"/><text x="284" y="340" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.14em">ADVISORY: THE LAST RELEASE, SAME MAGUSFILE</text><path d="M 224 280 L 256 280 Q 264 280 264 272 L 264 192 Q 264 184 272 184 L 304 184" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#dogfood-arrow-default)"/><path d="M 224 300 L 272 300 Q 280 300 280 308 L 280 392 Q 280 400 288 400 L 304 400" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#dogfood-arrow-default)"/><path d="M 552 184 L 616 184" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#dogfood-arrow-default)"/><path d="M 552 400 L 616 400" fill="none" stroke="#bc4c00" stroke-width="1" marker-end="url(#dogfood-arrow-accent)"/><rect x="556" y="162" width="56" height="12" rx="2" fill="#ffffff"/><text x="584" y="171" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MUST PASS</text><rect x="558" y="378" width="52" height="12" rx="2" fill="#ffffff"/><text x="584" y="387" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MAY FAIL</text><rect x="32" y="264" width="192" height="56" rx="6" fill="#ffffff"/><rect x="32" y="264" width="192" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="128" y="292" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">This commit</text><text x="128" y="308" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magusfile + Go source</text><rect x="304" y="152" width="248" height="64" rx="6" fill="#ffffff"/><rect x="304" y="152" width="248" height="64" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="428" y="184" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Built from source</text><text x="428" y="200" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">setup-magus source-path</text><rect x="616" y="152" width="280" height="64" rx="6" fill="#ffffff"/><rect x="616" y="152" width="280" height="64" rx="6" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="1"/><text x="756" y="184" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Every gate</text><text x="756" y="200" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">lint, build, test, ci</text><rect x="304" y="368" width="248" height="64" rx="6" fill="#ffffff"/><rect x="304" y="368" width="248" height="64" rx="6" fill="#ffffff" stroke="#7b8495" stroke-width="1"/><text x="428" y="400" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Last release</text><text x="428" y="416" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">setup-magus git-ref</text><rect x="616" y="368" width="280" height="64" rx="6" fill="#ffffff"/><rect x="616" y="368" width="280" height="64" rx="6" fill="#f3f4f6" stroke="#7b8495" stroke-width="1" stroke-dasharray="4,3"/><text x="756" y="400" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">audit compat</text><text x="756" y="416" fill="#7b8495" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">red is a signal, not a stop</text><line x1="32" y1="512" x2="928" y2="512" stroke="#dce3eb" stroke-width="0.8"/><rect x="32" y="520" width="10" height="10" rx="2" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="0.8"/><text x="50" y="529" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">BLOCKS THE BRANCH</text><rect x="192" y="520" width="10" height="10" rx="2" fill="#f3f4f6" stroke="#7b8495" stroke-width="0.8"/><text x="210" y="529" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">ADVISORY ONLY</text></g></svg>