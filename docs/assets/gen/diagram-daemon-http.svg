<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="daemon-http-title daemon-http-desc" class="magus-diagram"><title id="daemon-http-title">The HTTP surface, and the one route without a guard</title><desc id="daemon-http-desc">Agents and the console reach /mcp, /api/v1, the Connect services and /api/v1/share through the DNS-rebind, bearer-token and CORS guard. The health endpoints answer probes directly, with no authentication.</desc><defs><marker id="daemon-http-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#7b8495"/></marker><marker id="daemon-http-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="daemon-http-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#13171f"/><text x="32" y="32" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS DAEMON</text><text x="32" y="60" fill="#c2c7d0" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The HTTP surface, and the one route without a guard</text><g transform="translate(0,40)"><path d="M 192 144 L 232 144 Q 240 144 240 152 L 240 220 Q 240 228 248 228 L 320 228" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-http-arrow-default)"/><path d="M 192 232 L 264 232 Q 272 232 272 240 L 272 248 Q 272 256 280 256 L 320 256" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-http-arrow-default)"/><path d="M 500 216 L 512 216 Q 520 216 520 208 L 520 128 Q 520 120 528 120 L 600 120" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-http-arrow-default)"/><path d="M 500 232 L 528 232 Q 536 232 536 224 L 536 216 Q 536 208 544 208 L 600 208" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-http-arrow-default)"/><path d="M 500 252 L 520 252 Q 528 252 528 260 L 528 288 Q 528 296 536 296 L 600 296" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-http-arrow-default)"/><path d="M 500 268 L 504 268 Q 512 268 512 276 L 512 376 Q 512 384 520 384 L 600 384" fill="none" stroke="#7b8495" stroke-width="1" marker-end="url(#daemon-http-arrow-default)"/><path d="M 192 472 L 600 472" fill="none" stroke="#f08a59" stroke-width="1" marker-end="url(#daemon-http-arrow-accent)"/><rect x="368" y="450" width="56" height="12" rx="2" fill="#13171f"/><text x="396" y="459" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">UNGUARDED</text><rect x="32" y="112" width="160" height="64" rx="6" fill="#13171f"/><rect x="32" y="112" width="160" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="40" y="120" width="48" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="64" y="129" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="112" y="152" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">AI agents</text><text x="112" y="168" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">Claude Code, IDE</text><rect x="32" y="200" width="160" height="64" rx="6" fill="#13171f"/><rect x="32" y="200" width="160" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><rect x="40" y="208" width="48" height="12" rx="2" fill="none" stroke="#202632" stroke-width="0.8"/><text x="64" y="217" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="112" y="240" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Console PWA</text><text x="112" y="256" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">dashboard, graph</text><rect x="32" y="440" width="160" height="64" rx="6" fill="#13171f"/><rect x="32" y="440" width="160" height="64" rx="6" fill="#13171f" stroke="#6b7383" stroke-width="1"/><rect x="40" y="448" width="48" height="12" rx="2" fill="none" stroke="#6b7383" stroke-width="0.8"/><text x="64" y="457" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="112" y="480" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">kubelet</text><text x="112" y="496" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">scripts, probes</text><rect x="320" y="200" width="180" height="88" rx="6" fill="#13171f"/><rect x="320" y="200" width="180" height="88" rx="6" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="1"/><rect x="328" y="208" width="36" height="12" rx="2" fill="none" stroke="#f08a59" stroke-width="0.8"/><text x="346" y="217" fill="#6b7383" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">GATE</text><text x="410" y="240" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Guard</text><text x="410" y="256" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">rebind + token + CORS</text><rect x="600" y="88" width="200" height="64" rx="6" fill="#13171f"/><rect x="600" y="88" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="700" y="120" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/mcp</text><text x="700" y="136" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">Streamable HTTP, SSE</text><rect x="600" y="176" width="200" height="64" rx="6" fill="#13171f"/><rect x="600" y="176" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="700" y="208" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1</text><text x="700" y="224" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">graph, status, events</text><rect x="600" y="264" width="200" height="64" rx="6" fill="#13171f"/><rect x="600" y="264" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="700" y="296" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Connect RPC</text><text x="700" y="312" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">metrics, activity</text><rect x="600" y="352" width="200" height="64" rx="6" fill="#13171f"/><rect x="600" y="352" width="200" height="64" rx="6" fill="#1b1f29" stroke="#202632" stroke-width="1"/><text x="700" y="384" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1/share</text><text x="700" y="400" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">loopback only</text><rect x="600" y="440" width="200" height="64" rx="6" fill="#13171f"/><rect x="600" y="440" width="200" height="64" rx="6" fill="#13171f" stroke="#6b7383" stroke-width="1"/><text x="700" y="472" fill="#c2c7d0" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/livez /readyz</text><text x="700" y="488" fill="#6b7383" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">no authentication</text><line x1="32" y1="552" x2="928" y2="552" stroke="#202632" stroke-width="0.8"/><rect x="32" y="560" width="10" height="10" rx="2" fill="rgba(240,138,89,0.10)" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="569" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">AUTHENTICATED</text><rect x="192" y="560" width="10" height="10" rx="2" fill="#13171f" stroke="#6b7383" stroke-width="0.8"/><text x="210" y="569" fill="#6b7383" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OPEN TO ANY CALLER</text></g></svg>