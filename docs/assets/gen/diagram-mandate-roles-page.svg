8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PLANS</text><rect x="390" y="532" width="52" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="416" y="541" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MANDATES</text><rect x="532" y="454" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="552" y="463" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">GRANTS</text><rect x="534" y="134" width="60" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="564" y="143" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><rect x="526" y="70" width="76" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="564" y="79" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FORKS, SPAWNS</text><rect x="666" y="686" width="60" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="696" y="695" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EVERY CALL</text><g data-node="external:Person"><rect x="272" y="448" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="272" y="448" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="380" y="476" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight=