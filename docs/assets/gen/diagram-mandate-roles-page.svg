<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 896" width="892" height="896" role="img" aria-labelledby="mandate-roles-title mandate-roles-desc" class="magus-diagram"><metadata>{"figure":"mandate-roles","stamp":"sha256:b13a8825fb61b64072e1485118ebe0ebc78ef184193056678495cc1fbc88867d"}</metadata><title id="mandate-roles-title">The person decides; the guard enforces what they wrote down</title><desc id="mandate-roles-desc">Four rows: the person decides, the plan, the mandate and each grant write the decision down, the guard judges every call against them, and the root and its workers do the work. Every call either one makes goes to the guard, whose verdict is allow, deny or advise. The root forks jobs and spawns workers; a worker's hand-back wakes the root. What a job did ends integrated or held for review, and the report hands that back to the person.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fi