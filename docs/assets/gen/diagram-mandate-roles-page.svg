<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 892 896" width="892" height="896" role="img" aria-labelledby="mandate-roles-title mandate-roles-desc" class="magus-diagram"><metadata>{"figure":"mandate-roles","stamp":"sha256:a8424de61e11bdea4eab59cbcf2bf1133777dde190b8856383ae3a57f4ffd4a1"}</metadata><title id="mandate-roles-title">The person decides; the guard enforces what they wrote down</title><desc id="mandate-roles-desc">Four rows: the person decides, the plan, the mandate and each grant write the decision down, the guard judges every call against them, and the root and its workers do the work. Every call either one makes goes to the guard, whose verdict is allow, deny or advise. The root forks jobs and spawns workers; a worker's hand-back wakes the root. What a job did ends integrated or held for review, and the report hands that back to the person.</desc><defs><marker id="mandate-roles-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="mandate-roles-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="mandate-roles-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">DECISION</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The person decides; the guard enforces what they wrote down</text><g transform="translate(0,40)"><path data-edge="external:Person->external:Plan" id="mandate-roles-edge-external_3aPerson-external_3aPlan" d="M 272 476 L 148 476 Q 140 476 140 484 L 140 576" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#mandate-roles-arrow-default)"/><path data-edge="external:Person->external:Mandate" id="mandate-roles-edge-external_3aPerson-external_3aMandate" d="M 380 504 L 380 576" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#mandate-roles-arrow-default)"/><path data-edge="external:Person->external:Grant" id="mandate-roles-edge-external_3aPerson-external_3aGrant" d="M 488 476 L 612 476 Q 620 476 620 484 L 620 576" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#mandate-roles-arrow-default)"/><path data-edge="external:Plan->external:Guard" id="mandate-roles-edge-external_3aPlan-external_3aGuard" d="M 140 632 L 140 668 Q 140 676 148 676 L 588 676 Q 596 676 596 684 L 596 704" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#mandate-roles-arrow-default)"/><path data-edge="external:Mandate->external:Guard" id="mandate-roles-edge-external_3aMandate-external_3aGuard" d="M 380 632 L 380 652 Q 380 660 388 660 L 600 660 Q 608 660 608 668 L 608 704" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#mandate-roles-arrow-default)"/><path data-edge="external:Grant->external:Guard" id="mandate-roles-edge-external_3aGrant-external_3aGuard" d="M 620 632 L 620 704" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#mandate-roles-arrow-default)"/><path data-edge="external:Root->external:Guard" id="mandate-roles-edge-external_3aRoot-external_3aGuard" d="M 392 120 L 392 148 Q 392 156 400 156 L 732 156 Q 740 156 740 164 L 740 652 Q 740 660 732 660 L 640 660 Q 632 660 632 668 L 632 704" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" strok