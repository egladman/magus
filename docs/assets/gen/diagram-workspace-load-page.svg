<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 624" width="888" height="624" role="img" aria-labelledby="workspace-load-title workspace-load-desc" class="magus-diagram"><metadata>{"figure":"workspace-load","stamp":"sha256:60b19414fd5de42445b84dc83247bfff53973e47c7dee8b5e7dedb3ef3a329a2"}</metadata><title id="workspace-load-title">A target exists because a magusfile exported it</title><desc id="workspace-load-desc">Discovery walks the tree from the root marker and registers one project per magusfile: the root's is project ., each nested one declares its own. Every magusfile is evaluated: its exported functions are its targets and magus\project layers policy on. A static read of each target body recovers ctx.readsFiles, ctx.writesFiles and cross-project ctx.needs as literals. The project model that results is what the cache keys, what describe answers from, and what a command resolves its project against from the current directory.</desc><defs><marker id="workspace-load-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="workspace-load-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="workspace-load-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">WORKSPACE</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A target exists because a magusfile exported it</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="184" rx="8" fill="var(--magus-diagram-ink, #2d3142)" fill-opacity="0.02" stroke="var(--magus-diagram-ink, #2d3142)" stroke-opacity="0.1" stroke-width="0.8"/><rect x="90" y="68" width="100" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="140" y="77" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WRITTEN BY HAND</text><path data-edge="external:Root magusfile->project" id="workspace-load-edge-external_3aRoot_20magusfile-project" d="M 248 124 L 284 124 Q 292 124 292 132 L 292 148 Q 292 156 300 156 L 336 156" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="external:Nested magusfiles->project" id="workspace-load-edge-external_3aNested_20magusfiles-project" d="M 248 204 L 284 204 Q 292 204 292 196 L 292 180 Q 292 172 300 172 L 336 172" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="project->types" id="workspace-load-edge-project-types" d="M 552 164 L 588 164 Q 596 164 596 172 L 596 308 Q 596 316 604 316 L 624 316" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/interp->types" id="workspace-load-edge-internal_2finterp-types" d="M 140 328 L 140 332 Q 140 340 148 340 L 624 340" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/interp->internal/cache" id="workspace-load-edge-internal_2finterp-internal_2fcache" d="M 248 300 L 336 300" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/describe->types" id="workspace-load-edge-internal_2fdescribe-types" d="M 248 380 L 572 380 Q 580 380 580 372 L 580 360 Q 580 352 588 352 L 624 352" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/cache->types" id="workspace-load-edge-internal_2fcache-types" d="M 552 300 L 572 300 Q 580 300 580 308 L 580 320 Q 580 328 588 328 L 624 328" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge=".->types" id="workspace-load-edge-_2e-types" d="M 248 460 L 588 460 Q 596 460 596 452 L 596 372 Q 596 364 604 364 L 624 364" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><rect x="260" y="102" width="64" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="292" y="111" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS .</text><rect x="254" y="214" width="76" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="292" y="223" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS DIR</text><rect x="358" y="350" width="44" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="380" y="359" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">TARGETS</text><rect x="382" y="390" width="60" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="412" y="399" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FOOTPRINTS</text><g data-node="external:Root magusfile"><rect x="32" y="96" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="96" width="216" height="56" rx="6" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="140" y="124" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Root magusfile</text><text x="140" y="140" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">declares project .</text></g><g data-node="external:Nested magusfiles"><rect x="32" y="176" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="176" width="216" height="56" rx="6" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><text x="140" y="204" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Nested magusfiles</text><text x="140" y="220" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">docs/, proto/, libs/*</text></g><g data-node="project" data-anchor="project"><rect x="336" y="136" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="336" y="136" width="216" height="56" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="444" y="164" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Projects</text><text x="444" y="180" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">discovery, Where(cwd)</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="32" y="272" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="272" width="216" height="56" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="140" y="300" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Evaluate</text><text x="140" y="316" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">export fun is a target</text></g><g data-node="internal/describe" data-anchor="internal/describe"><rect x="32" y="352" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="352" width="216" height="56" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="140" y="380" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Static read</text><text x="140" y="396" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">literal reads, writes, needs</text></g><g data-node="types" data-anchor="types"><rect x="624" y="304" width="216" height="72" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="624" y="304" width="216" height="72" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><text x="732" y="340" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Projects and targets</text><text x="732" y="356" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">sources, outputs, depends_on</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="336" y="272" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="336" y="272" width="216" height="56" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="444" y="300" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Cache key</text><text x="444" y="316" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">one step per target</text></g><g data-node="." data-anchor="."><rect x="32" y="432" width="216" height="56" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="432" width="216" height="56" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="140" y="460" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus describe</text><text x="140" y="476" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">targets, claims, the graph</text></g><line x1="32" y1="524" x2="856" y2="524" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="32" y="538" fill="var(--magus-diagram-muted, #4f5d75)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="544" width="10" height="10" rx="2" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="0.8"/><text x="50" y="553" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT EVERY READER READS</text><rect x="192" y="544" width="10" height="10" rx="2" fill="var(--magus-diagram-muted, #4f5d75)" fill-opacity="0.1" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="210" y="553" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONLY DECLARATIONS</text></g></svg>