<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 984 624" width="984" height="624" role="img" aria-labelledby="workspace-load-title workspace-load-desc" class="magus-diagram"><metadata>{"figure":"workspace-load","stamp":"sha256:3739394cdb229925fac986dd5e907e4512c6c0418aa85a0889f7ac2260e7dfdd"}</metadata><title id="workspace-load-title">A target exists because a magusfile exported it</title><desc id="workspace-load-desc">Discovery walks the tree from the root marker and registers one project per magusfile: the root's is project ., each nested one declares its own. Every magusfile is evaluated: its exported functions are its targets and magus\project layers policy on. A static read of each target body recovers ctx.readsFiles, ctx.writesFiles and cross-project ctx.needs as literals. The project model that results is what the cache keys, what describe answers from, and what a command resolves its project against from the current directory.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="workspace-load-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="workspace-load-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="workspace-load-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">WORKSPACE</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">A target exists because a magusfile exported it</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="184" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="90" y="68" width="100" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="140" y="77" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WRITTEN BY HAND</text><path data-edge="external:Root magusfile->project" id="workspace-load-edge-external_3aRoot_20magusfile-project" d="M 248 124 L 332 124 Q 340 124 340 132 L 340 184 Q 340 192 348 192 L 432 192" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="external:Nested magusfiles->project" id="workspace-load-edge-external_3aNested_20magusfiles-project" d="M 248 204 L 432 204" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="project->types" id="workspace-load-edge-project-types" d="M 648 204 L 684 204 Q 692 204 692 212 L 692 308 Q 692 316 700 316 L 720 316" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/interp->types" id="workspace-load-edge-internal_2finterp-types" d="M 140 328 L 140 332 Q 140 340 148 340 L 720 340" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/interp->internal/cache" id="workspace-load-edge-internal_2finterp-internal_2fcache" d="M 248 300 L 432 300" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/describe->project" id="workspace-load-edge-internal_2fdescribe-project" d="M 248 368 L 332 368 Q 340 368 340 360 L 340 348 A 8 8 0 0 1 340 332 L 340 308 A 8 8 0 0 1 340 292 L 340 224 Q 340 216 348 216 L 432 216" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/describe->types" id="workspace-load-edge-internal_2fdescribe-types" d="M 248 380 L 668 380 Q 676 380 676 372 L 676 360 Q 676 352 684 352 L 720 352" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/cache->types" id="workspace-load-edge-internal_2fcache-types" d="M 648 300 L 668 300 Q 676 300 676 308 L 676 320 Q 676 328 684 328 L 720 328" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge=".->types" id="workspace-load-edge-_2e-types" d="M 248 460 L 684 460 Q 692 460 692 452 L 692 372 Q 692 364 700 364 L 720 364" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><rect x="260" y="102" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="292" y="111" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS .</text><rect x="254" y="182" width="76" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="292" y="191" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS DIR</text><rect x="406" y="350" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="428" y="359" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">TARGETS</text><rect x="430" y="390" width="60" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="460" y="399" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FOOTPRINTS</text><g data-node="external:Root magusfile"><rect x="32" y="96" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="96" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="124" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Root magusfile</text><text x="140" y="140" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">declares project .</text></g><g data-node="external:Nested magusfiles"><rect x="32" y="176" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="176" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="204" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Nested magusfiles</text><text x="140" y="220" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">docs/, proto/, libs/*</text></g><g data-node="project" data-anchor="project"><rect x="432" y="176" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="432" y="176" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="540" y="204" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Projects</text><text x="540" y="220" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">discovery, Where(cwd)</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="32" y="272" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="272" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="300" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Evaluate</text><text x="140" y="316" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">export fun is a target</text></g><g data-node="internal/describe" data-anchor="internal/describe"><rect x="32" y="352" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="352" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="380" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Static read</text><text x="140" y="396" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">literal reads, writes, needs</text></g><g data-node="types" data-anchor="types"><rect x="720" y="304" width="216" height="72" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="720" y="304" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="828" y="340" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Projects and targets</text><text x="828" y="356" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sources, outputs, depends_on</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="432" y="272" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="432" y="272" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="540" y="300" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Cache key</text><text x="540" y="316" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">one step per target</text></g><g data-node="." data-anchor="."><rect x="32" y="432" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="432" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="460" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">magus describe</text><text x="140" y="476" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">targets, claims, the graph</text></g><line x1="32" y1="524" x2="952" y2="524" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="538" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="544" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="0.8"/><text x="50" y="553" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT EVERY READER READS</text><rect x="192" y="544" width="10" height="10" rx="2" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="0.8"/><text x="210" y="553" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONLY DECLARATIONS</text></g></svg>