<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 840" width="872" height="840" role="img" aria-labelledby="knowledge-graph-title knowledge-graph-desc" class="magus-diagram"><metadata>{"figure":"knowledge-graph","stamp":"sha256:8edbd3a48dfbb0ee0f4b482991694386a43fdbd7b4a0abcf5369b2b48ab0fafa"}</metadata><title id="knowledge-graph-title">Every source writes a shard; every reader asks one graph</title><desc id="knowledge-graph-desc">magus graph build assembles a shard per source: the registry and one per project from the magusfiles, the file adapters for Buzz, docs, directories, citations and CODEOWNERS, a lazy symbol shard per project from a SCIP index, git history and notes. The store fingerprints each shard and rewrites only the ones whose content changed, then merges them into one graph. The CLI and the MCP tools read that graph through the same query, explain, refs and path.</desc><defs><marker id="knowledge-graph-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="knowledge-graph-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="knowledge-graph-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">KNOWLEDGE GRAPH</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Every source writes a shard; every reader asks one graph</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="464" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.