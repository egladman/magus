monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">fingerprint, sync, merge</text></g><g data-node="." data-anchor="."><rect x="320" y="552" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="552" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="584" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">The four verbs</text><text x="428" y="600" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">query, explain, refs, path</text></g><g data-node="cmd/magus" data-anchor="cmd/magus"><rect x="32" y="552" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="552" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="40" y="560" width="48" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="64" y="569" fill="#5f6780" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">READER</text><text x="140" y="592" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus CLI</text><text x="140" y="608" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">text or -o json</text></g><g data-node="internal/handler/mcp" data-anchor="internal/handler/mcp"><rect x="32" y="640" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="640" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="40" y="648" width="48" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="64" y="657" fill="#5f6780" font-size="7" font-family="var(--pico-font-family-monospace