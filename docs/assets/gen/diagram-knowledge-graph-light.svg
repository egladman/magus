<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 664" width="872" height="664" role="img" aria-labelledby="knowledge-graph-title knowledge-graph-desc" class="magus-diagram"><title id="knowledge-graph-title">Every source writes a shard; every reader asks one graph</title><desc id="knowledge-graph-desc">magus graph build assembles a shard per source: the registry and one per project from the magusfiles, the file adapters for Buzz, docs, directories, citations and CODEOWNERS, a lazy symbol shard per project from a SCIP index, git history and notes. The store fingerprints each shard and rewrites only the ones whose content changed, then merges them into one graph. The CLI and the MCP tools read that graph through the same query, explain, refs and path.</desc><defs><marker id="knowledge-graph-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="knowledge-graph-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="knowledge-graph-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">KNOWLEDGE GRAPH</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Every source writes a shard; every reader asks one graph</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="464" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="80" y="68" width="120" height="12" rx="2" fill="#f5f5f5"/><text x="140" y="77" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">A SHARD PER SOURCE</text><path data-edge="core->store" id="knowledge-graph-edge-core-store" d="M 248 128 L 284 128 Q 292 128 292 136 L 292 272 Q 292 280 300 280 L 320 280" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="files->store" id="knowledge-graph-edge-files-store" d="M 248 216 L 268 216 Q 276 216 276 224 L 276 284 Q 276 292 284 292 L 320 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="symbols->store" id="knowledge-graph-edge-symbols-store" d="M 248 304 L 320 304" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="vcs->store" id="knowledge-graph-edge-vcs-store" d="M 248 392 L 268 392 Q 276 392 276 384 L 276 324 Q 276 316 284 316 L 320 316" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="notes->store" id="knowledge-graph-edge-notes-store" d="M 248 480 L 284 480 Q 292 480 292 472 L 292 336 Q 292 328 300 328 L 320 328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="store->graph" id="knowledge-graph-edge-store-graph" d="M 536 304 L 564 304 Q 572 304 572 312 L 572 376 Q 572 384 580 384 L 608 384" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="cli->graph" id="knowledge-graph-edge-cli-graph" d="M 536 396 L 608 396" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><path data-edge="mcp->graph" id="knowledge-graph-edge-mcp-graph" d="M 536 484 L 564 484 Q 572 484 572 476 L 572 416 Q 572 408 580 408 L 608 408" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#knowledge-graph-arrow-default)"/><g data-node="core" data-anchor="internal/graph/knowledge/assemble.go"><rect x="32" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Magusfiles + registry</text><text x="140" y="144" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">@registry, one per project</text></g><g data-node="files" data-anchor="internal/graph/knowledge/buzz.go"><rect x="32" y="184" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="184" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="216" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">File adapters</text><text x="140" y="232" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">buzz, docs, dirs, links, owners</text></g><g data-node="symbols" data-anchor="internal/graph/knowledge/symbols.go"><rect x="32" y="272" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="272" width="216" height="64" rx="6" fill="#4f5d75" fill-opacity="0.1" stroke="#7a8399" stroke-width="1.2"/><text x="140" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Symbols</text><text x="140" y="320" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">SCIP index, lazy shards</text></g><g data-node="vcs" data-anchor="internal/graph/knowledge/vcs.go"><rect x="32" y="360" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="360" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="392" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">History</text><text x="140" y="408" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">@vcs, from git</text></g><g data-node="notes" data-anchor="internal/graph/knowledge/notes.go"><rect x="32" y="448" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="448" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="480" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Notes</text><text x="140" y="496" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">@notes shared + private</text></g><g data-node="store" data-anchor="internal/graph/knowledge/store.go"><rect x="320" y="268" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="320" y="268" width="216" height="72" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Shard store</text><text x="428" y="320" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">fingerprint, sync, merge</text></g><g data-node="graph" data-anchor="internal/graph/knowledge"><rect x="608" y="364" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="608" y="364" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="716" y="396" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">One graph</text><text x="716" y="412" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">query, explain, refs, path</text></g><g data-node="cli" data-anchor="cmd/magus"><rect x="320" y="364" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="364" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="328" y="372" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="352" y="381" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">READER</text><text x="428" y="404" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus CLI</text><text x="428" y="420" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">text or -o json</text></g><g data-node="mcp" data-anchor="internal/handler/mcp"><rect x="320" y="452" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="452" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="328" y="460" width="48" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="352" y="469" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">READER</text><text x="428" y="492" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">MCP tools</text><text x="428" y="508" fill="#7a8399" font-size="9" font-family="va