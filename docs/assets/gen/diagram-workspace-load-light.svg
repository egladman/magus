<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 888 704" width="888" height="704" role="img" aria-labelledby="workspace-load-title workspace-load-desc" class="magus-diagram"><metadata>{"figure":"workspace-load","stamp":"sha256:034a4c302346c1c45b33537f84dc316a60fe049d5f52c371581da3a08434dbe3"}</metadata><title id="workspace-load-title">A target exists because a magusfile exported it</title><desc id="workspace-load-desc">Discovery walks the tree from the root marker and registers one project per magusfile: the root's is project ., each nested one declares its own. Every magusfile is evaluated: its exported functions are its targets and magus\project layers policy on. A static read of each target body recovers ctx.readsFiles, ctx.writesFiles and cross-project ctx.needs as literals. The project model that results is what the cache keys, what describe answers from, and what a command resolves its project against from the current directory.</desc><defs><marker id="workspace-load-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="workspace-load-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="workspace-load-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">WORKSPACE</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">A target exists because a magusfile exported it</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="184" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="90" y="68" width="100" height="12" rx="2" fill="#f5f5f5"/><text x="140" y="77" fill="#5f6780" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WRITTEN BY HAND</text><path data-edge="external:Root magusfile->project" id="workspace-load-edge-external_3aRoot_20magusfile-project" d="M 248 124 L 284 124 Q 292 124 292 132 L 292 148 Q 292 156 300 156 L 336 156" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="external:Nested magusfiles->project" id="workspace-load-edge-external_3aNested_20magusfiles-project" d="M 248 204 L 284 204 Q 292 204 292 196 L 292 180 Q 292 172 300 172 L 336 172" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="project->types" id="workspace-load-edge-project-types" d="M 552 164 L 588 164 Q 596 164 596 172 L 596 348 Q 596 356 604 356 L 624 356" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/interp->types" id="workspace-load-edge-internal_2finterp-types" d="M 248 300 L 572 300 Q 580 300 580 308 L 580 360 Q 580 368 588 368 L 624 368" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/describe->types" id="workspace-load-edge-internal_2fdescribe-types" d="M 248 380 L 624 380" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge="internal/cache->types" id="workspace-load-edge-internal_2fcache-types" d="M 248 460 L 572 460 Q 580 460 580 452 L 580 400 Q 580 392 588 392 L 624 392" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><path data-edge=".->types" id="workspace-load-edge-_2e-types" d="M 248 540 L 588 540 Q 596 540 596 532 L 596 412 Q 596 404 604 404 L 624 404" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#workspace-load-arrow-default)"/><rect x="260" y="102" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="111" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS .</text><rect x="254" y="214" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="223" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REGISTERS DIR</text><rect x="390" y="278" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="412" y="287" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">TARGETS</text><rect x="406" y="358" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="436" y="367" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FOOTPRINTS</text><g data-node="external:Root magusfile"><rect x="32" y="96" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="96" width="216" height="56" rx="6" fill="#4f5d75" fill-opacity="0.1" stroke="#5f6780" stroke-width="1.2"/><text x="140" y="124" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Root magusfile</text><text x="140" y="140" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">declares project .</text></g><g data-node="external:Nested magusfiles"><rect x="32" y="176" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="176" width="216" height="56" rx="6" fill="#4f5d75" fill-opacity="0.1" stroke="#5f6780" stroke-width="1.2"/><text x="140" y="204" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Nested magusfiles</text><text x="140" y="220" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">docs/, proto/, libs/*</text></g><g data-node="project" data-anchor="project"><rect x="336" y="136" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="336" y="136" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="444" y="164" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Projects</text><text x="444" y="180" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">discovery, Where(cwd)</text></g><g data-node="internal/interp" data-anchor="internal/interp"><rect x="32" y="272" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="272" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="300" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Evaluate</text><text x="140" y="316" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">export fun is a target</text></g><g data-node="internal/describe" data-anchor="internal/describe"><rect x="32" y="352" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="352" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Static read</text><text x="140" y="396" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">literal reads, writes, needs</text></g><g data-node="types" data-anchor="types"><rect x="624" y="344" width="216" height="72" rx="6" fill="#f5f5f5"/><rect x="624" y="344" width="216" height="72" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="732" y="380" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Projects and targets</text><text x="732" y="396" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">sources, outputs, depends_on</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="32" y="432" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="432" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="460" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Cache key</text><text x="140" y="476" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">one step per target</text></g><g data-node="." data-anchor="."><rect x="32" y="512" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="512" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="540" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus describe</text><text x="140" y="556" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">targets, claims, the graph</text></g><line x1="32" y1="604" x2="856" y2="604" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="618" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="624" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="633" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT EVERY READER READS</text><rect x="192" y="624" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.1" stroke="#5f6780" stroke-width="0.8"/><text x="210" y="633" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONLY DECLARATIONS</text></g></svg>