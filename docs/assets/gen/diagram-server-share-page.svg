ass="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">dashboard</text></g><g data-node="internal/server" data-anchor="internal/server"><rect x="320" y="240" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="240" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><rect x="328" y="248" width="40" height="12" rx="2" fill="none" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="348" y="257" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROUTE</text><text x="428" y="280" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">/api/v1/share</text><text x="428" y="296" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">loopback + bearer</text></g><g data-node="internal/share" data-anchor="internal/share"><rect x="616" y="240" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="616" y="240" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><rect x="624" y="248" width="64" height="12" rx="2" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="0.8"/><text x="656" y="257" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">EPHEMERAL</text><text x="724" y="280" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">LAN listener</text><text x="724" y="296" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">15m, read-only token</text></g><g data-node="external:Phone on the LAN"><rect x="32" y="328" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="328" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" class="magus-fill-paper magus-stroke-soft" stroke-width="1.2"/><rect x="40" y="336" width="48" height="12" rx="2" fill="none" stroke="#5f6780" class="magus-stroke-soft" stroke-width="0.8"/><text x="64" y="345" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="368" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Phone on the LAN</text><text x="140" y="384" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">same-origin viewer</text></g><g data-node="internal/handler/viewer" data-anchor="internal/handler/viewer"><rect x="616" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="616" y="64" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="724" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Shared read routes</text><text x="724" y="112" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">events, history metrics, outputs, output</text></g><g data-node="internal/handler/status" data-anchor="internal/handler/status"><rect x="616" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x=