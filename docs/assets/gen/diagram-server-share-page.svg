<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 864 616" width="864" height="616" role="img" aria-labelledby="server-share-title server-share-desc" class="magus-diagram"><metadata>{"figure":"server-share","stamp":"sha256:730553449f94c47d6b7e552c8d2c66f19b0540b81f0e71f6581fc47f3128ae25"}</metadata><title id="server-share-title">The only listener a second machine can reach</title><desc id="server-share-desc">Sharing from the dashboard posts to a loopback-only endpoint, which mints a time-boxed read-only token and opens an ephemeral LAN listener. The listener serves four JSON read routes and the read Connect services, and nothing else: the graph, the diff routes, the derived plan, the job store, /mcp and job control stay loopback only.</desc><defs><marker id="server-share-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-muted, #4f5d75)"/></marker><marker id="server-share-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-accent, #eb6c36)"/></marker><marker id="server-share-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--magus-diagram-link, #2e5aa8)"/></marker></defs><rect width="100%" height="100%" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="32" y="32" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="var(--magus-diagram-ink, #2d3142)" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">The only listener a second machine can reach</text><g transform="translate(0,40)"><path data-edge="external:Console->internal/server" id="server-share-edge-external_3aConsole-internal_2fserver" d="M 248 272 L 320 272" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="internal/server->internal/share" id="server-share-edge-internal_2fserver-internal_2fshare" d="M 536 272 L 616 272" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="internal/server->internal/handler/viewer" id="server-share-edge-internal_2fserver-internal_2fhandler_2fviewer" d="M 428 240 L 428 104 Q 428 96 436 96 L 616 96" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="internal/server->internal/handler/status" id="server-share-edge-internal_2fserver-internal_2fhandler_2fstatus" d="M 440 240 L 440 192 Q 440 184 448 184 L 616 184" fill="none" stroke="var(--magus-diagram-muted, #4f5d75)" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="external:Phone on the LAN->internal/share" id="server-share-edge-external_3aPhone_20on_20the_20LAN-internal_2fshare" d="M 248 360 L 568 360 Q 576 360 576 352 L 576 292 Q 576 284 584 284 L 616 284" fill="none" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2" marker-end="url(#server-share-arrow-accent)"/><rect x="266" y="250" width="36" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="284" y="259" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SHARE</text><rect x="544" y="250" width="64" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="576" y="259" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MINTS TOKEN</text><rect x="500" y="74" width="40" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="520" y="83" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MOUNTS</text><rect x="508" y="162" width="40" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="528" y="171" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MOUNTS</text><rect x="384" y="338" width="56" height="12" rx="2" fill="var(--magus-diagram-paper, #f5f5f5)"/><text x="412" y="347" fill="var(--magus-diagram-soft, #5f6780)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text><g data-node="external:Console"><rect x="32" y="240" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="240" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><rect x="40" y="248" width="28" height="12" rx="2" fill="none" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="54" y="257" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PWA</text><text x="140" y="280" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Console</text><text x="140" y="296" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">dashboard</text></g><g data-node="internal/server" data-anchor="internal/server"><rect x="320" y="240" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="320" y="240" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><rect x="328" y="248" width="40" height="12" rx="2" fill="none" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="348" y="257" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROUTE</text><text x="428" y="280" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">/api/v1/share</text><text x="428" y="296" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">loopback + bearer</text></g><g data-node="internal/share" data-anchor="internal/share"><rect x="616" y="240" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="616" y="240" width="216" height="64" rx="6" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="1.2"/><rect x="624" y="248" width="64" height="12" rx="2" fill="none" stroke="var(--magus-diagram-accent, #eb6c36)" stroke-width="0.8"/><text x="656" y="257" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">EPHEMERAL</text><text x="724" y="280" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">LAN listener</text><text x="724" y="296" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">15m, read-only token</text></g><g data-node="external:Phone on the LAN"><rect x="32" y="328" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="328" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2"/><rect x="40" y="336" width="48" height="12" rx="2" fill="none" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="0.8"/><text x="64" y="345" fill="var(--magus-diagram-soft, #5f6780)" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="368" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Phone on the LAN</text><text x="140" y="384" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">same-origin viewer</text></g><g data-node="internal/handler/viewer" data-anchor="internal/handler/viewer"><rect x="616" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="616" y="64" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="724" y="96" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Shared read routes</text><text x="724" y="112" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">events, insight, outputs, output</text></g><g data-node="internal/handler/status" data-anchor="internal/handler/status"><rect x="616" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="616" y="152" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="1.2"/><text x="724" y="184" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Shared Connect reads</text><text x="724" y="200" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">status, activity, metrics, insight</text></g><g data-node="internal/handler/graph" data-anchor="internal/handler/graph"><rect x="32" y="416" width="216" height="64" rx="6" fill="var(--magus-diagram-paper, #f5f5f5)"/><rect x="32" y="416" width="216" height="64" rx="6" fill="var(--magus-diagram-surface, #ffffff)" stroke="var(--magus-diagram-soft, #5f6780)" stroke-width="1.2" stroke-dasharray="4,3"/><text x="140" y="448" fill="var(--magus-diagram-ink, #2d3142)" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Never on a share</text><text x="140" y="464" fill="var(--magus-diagram-soft, #5f6780)" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">graph, diff, plan, job, /mcp</text></g><line x1="32" y1="516" x2="832" y2="516" stroke="var(--magus-diagram-rule, #e6e6e8)" stroke-width="0.8"/><text x="32" y="530" fill="var(--magus-diagram-muted, #4f5d75)" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="536" width="10" height="10" rx="2" fill="var(--magus-diagram-accent-tint, #f4eae6)" stroke="var(--magus-diagram-accent, #eb6c36)" 