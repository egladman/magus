agus-stroke-rule" stroke-width="0.8"/><text x="210" y="545" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">SERVED ON A SHARE</text><rect x="352" y="536" width="10" height="10" rx="2" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="0.8"/><text x="370" y="545" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LOOPBACK ONLY</text></g></svg>