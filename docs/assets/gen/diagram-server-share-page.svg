<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 528" width="856" height="528" role="img" aria-labelledby="server-share-title server-share-desc" class="magus-diagram"><metadata>{"figure":"server-share","stamp":"sha256:717bd5ebc083fbeebf765767f59a02e6c8e18d7cb75c3672cb39172889b65692"}</metadata><title id="server-share-title">The only listener a second machine can reach</title><desc id="server-share-desc">Sharing from the dashboard posts to a loopback-only endpoint, which mints a time-boxed read-only token and opens an ephemeral LAN listener. The listener serves four JSON read routes and the read Connect services, and nothing else. Every other handler in the console's handler layer stays loopback only: the graph, the diff routes, the derived plan, the job store, /mcp and job control.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="server-share-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="server-share-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="server-share-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">MAGUS SERVER</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">The only listener a second machine can reach</text><g transform="translate(0,40)"><path data-edge="external:Console->internal/server" id="server-share-edge-external_3aConsole-internal_2fserver" d="M 248 184 L 320 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="internal/server->internal/share" id="server-share-edge-internal_2fserver-internal_2fshare" d="M 536 196 L 564 196 Q 572 196 572 204 L 572 252 Q 572 260 580 260 L 608 260" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="internal/server->internal/handler/viewer" id="server-share-edge-internal_2fserver-internal_2fhandler_2fviewer" d="M 428 152 L 428 104 Q 428 96 436 96 L 608 96" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="internal/server->group:Shared Connect reads" id="server-share-edge-internal_2fserver-group_3aShared_20Connect_20reads" d="M 536 184 L 608 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><path data-edge="external:Phone on the LAN->internal/share" id="server-share-edge-external_3aPhone_20on_20the_20LAN-internal_2fshare" d="M 248 272 L 608 272" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="1.2" marker-end="url(#server-share-arrow-accent)"/><path data-edge="group:Never on a share->internal/share" id="server-share-edge-group_3aNever_20on_20a_20share-internal_2fshare" d="M 248 360 L 564 360 Q 572 360 572 352 L 572 292 Q 572 284 580 284 L 608 284" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#server-share-arrow-default)"/><rect x="266" y="162" width="36" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="284" y="171" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SHARE</text><rect x="498" y="228" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="530" y="237" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MINTS TOKEN</text><rect x="496" y="74" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="516" y="83" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MOUNTS</text><rect x="400" y="250" width="56" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="428" y="259" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">READ-ONLY</text><g data-node="external:Console"><rect x="32" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><rect x="40" y="160" width="28" height="12" rx="2" fill="none" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="54" y="169" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">PWA</text><text x="140" y="192" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Console</text><text x="140" y="208" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">dashboard</text></g><g data-node="internal/server" data-anchor="internal/server"><rect x="320" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><rect x="328" y="160" width="40" height="12" rx="2" fill="none" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="348" y="169" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROUTE</text><text x="428" y="192" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">/api/v1/share</text><text x="428" y="208" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">loopback + bearer</text></g><g data-node="internal/share" data-anchor="internal/share"><rect x="608" y="240" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="240" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><rect x="616" y="248" width="64" height="12" rx="2" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="0.8"/><text x="648" y="257" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">EPHEMERAL</text><text x="716" y="280" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">LAN listener</text><text x="716" y="296" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">15m, read-only token</text></g><g data-node="external:Phone on the LAN"><rect x="32" y="240" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="240" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#5f6780" class="magus-fill-paper magus-stroke-soft" stroke-width="1.2"/><rect x="40" y="248" width="48" height="12" rx="2" fill="none" stroke="#5f6780" class="magus-stroke-soft" stroke-width="0.8"/><text x="64" y="257" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">CLIENT</text><text x="140" y="280" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Phone on the LAN</text><text x="140" y="296" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">same-origin viewer</text></g><g data-node="internal/handler/viewer" data-anchor="internal/handler/viewer"><rect x="608" y="64" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="64" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="716" y="96" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Shared read routes</text><text x="716" y="112" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">events, history metrics, outputs, output</text></g><g data-node="group:Shared Connect reads"><rect x="608" y="152" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="152" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="716" y="184" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Shared Connect reads</text><text x="716" y="200" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">status, activity, metrics, history metrics</text></g><g data-node="group:Never on a share"><rect x="32" y="328" width="216" height="64" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="328" width="216" height="64" rx="6" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="1.2" stroke-dasharray="4,3"/><text x="140" y="360" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Never on a share</text><text x="140" y="376" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">every other handler: graph, diff, plan, job, /mcp</text></g><line x1="32" y1="428" x2="824" y2="428" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="442" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="448" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="0.8"/><text x="50" y="457" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">REACHABLE OFF-MACHINE</text><rect x="192" y="448" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="0.8"/><text x="210" y="457" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">SERVED ON A SHARE</text><rect x="352" y="448" width="10" height="10" rx="2" fill="#ffffff" stroke="#5f6780" class="magus-fill-fill magus-stroke-soft" stroke-width="0.8"/><text x="370" y="457" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LOOPBACK ONLY</text></g></svg>