<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 872 672" width="872" height="672" role="img" aria-labelledby="inputs-outputs-title inputs-outputs-desc" class="magus-diagram"><metadata>{"diagram":"inputs-outputs","stamp":"sha256:91c7841a00a1528869acbd1208e3c47578f878b2a149da5cc64da89888ae30e5"}</metadata><title id="inputs-outputs-title">An output stops at a nested project; an input does not</title><desc id="inputs-outputs-desc">A target's input and output globs resolve from its own project. An input glob matches nested files too, so the root's **/*.go keys every nested Go file. An output glob claims a nested project's file only when rooted there, and a write that lands there anyway fails as MGS3001. A nested project reads the root's tree through workspace\file.</desc><defs><marker id="inputs-outputs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="inputs-outputs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="inputs-outputs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">INPUTS AND OUTPUTS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">An output stops at a nested project; an input does not</text><g transform="translate(0,40)"><rect x="16" y="64" width="248" height="200" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="92" y="68" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="140" y="77" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ROOT PROJECT .</text><rect x="16" y="288" width="536" height="112" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="230" y="292" width="108" height="12" rx="2" fill="#f5f5f5"/><text x="284" y="301" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">A NESTED PROJECT</text><rect x="304" y="424" width="536" height="112" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="540" y="428" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="572" y="437" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE CACHE</text><path data-edge="external:readsFiles([&quot;**/*.go&quot;])->internal/cache" id="inputs-outputs-edge-external_3areadsFiles_28_5b_22_2a_2a_2f_2a_2ego_22_5d_29-internal_2fcache" d="M 248 216 L 268 216 Q 276 216 276 224 L 276 480 Q 276 488 284 488 L 320 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="external:writesFiles([&quot;**/gen/*test/*.go&quot;])->internal/audit" id="inputs-outputs-edge-external_3awritesFiles_28_5b_22_2a_2a_2fgen_2f_2atest_2f_2a_2ego_22_5d_29-internal_2faudit" d="M 248 120 L 296 120 Q 304 120 304 128 L 304 344 Q 304 352 312 352 L 320 352" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="external:writesFiles([&quot;**/gen/*test/*.go&quot;])->internal/cache" id="inputs-outputs-edge-external_3awritesFiles_28_5b_22_2a_2a_2fgen_2f_2atest_2f_2a_2ego_22_5d_29-internal_2fcache" d="M 248 136 L 284 136 Q 292 136 292 144 L 292 468 Q 292 476 300 476 L 320 476" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="external:workspace\file(...)->internal/cache" id="inputs-outputs-edge-external_3aworkspace_5cfile_28_2e_2e_2e_29-internal_2fcache" d="M 248 352 L 256 352 Q 264 352 264 360 L 264 492 Q 264 500 272 500 L 320 500" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-accent)"/><path data-edge="internal/cache->types" id="inputs-outputs-edge-internal_2fcache-types" d="M 536 488 L 608 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><rect x="234" y="296" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="250" y="305" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SRC:</text><rect x="260" y="98" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="107" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">STRAY WRITE</text><rect x="302" y="392" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="328" y="401" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SNAPSHOT</text><rect x="240" y="510" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="276" y="519" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">+ DEPENDS_ON</text><g data-node="external:readsFiles([&quot;**/*.go&quot;])"><rect x="32" y="184" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="184" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="40" y="192" width="36" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="58" y="201" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROOT</text><text x="140" y="224" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">readsFiles([&quot;**/*.go&quot;])</text><text x="140" y="240" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">matches nested files too</text></g><g data-node="external:writesFiles([&quot;**/gen/*test/*.go&quot;])"><rect x="32" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="40" y="104" width="36" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="58" y="113" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROOT</text><text x="140" y="136" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">writesFiles([&quot;**/gen/*test/*.go&quot;])</text><text x="140" y="152" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the root's gen/ only</text></g><g data-node="external:workspace\file(...)"><rect x="32" y="320" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="320" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><rect x="40" y="328" width="36" height="12" rx="2" fill="none" stroke="#e6e6e8" stroke-width="0.8"/><text x="58" y="337" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">DOCS</text><text x="140" y="360" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">workspace\file(...)</text><text x="140" y="376" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the root's tree, as upstream</text></g><g data-node="internal/audit" data-anchor="internal/audit"><rect x="320" y="320" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="320" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="428" y="352" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Descendant audit</text><text x="428" y="368" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">MGS3001 on a write inside</text></g><g data-node="internal/cache" data-anchor="internal/cache"><rect x="320" y="456" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="456" width="216" height="64" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="428" y="488" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Cache key</text><text x="428" y="504" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">files and tool versions</text></g><g data-node="types" data-anchor="types"><rect x="608" y="456" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="608" y="456" width="216" height="64" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="716" y="488" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Output claim</text><text x="716" y="504" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">stops at a nested dir</text></g><line x1="32" y1="572" x2="840" y2="572" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="586" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="592" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="601" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT A HIT IS KEYED ON</text></g></svg>