<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1456 716" width="1456" height="716" role="img" aria-labelledby="inputs-outputs-title inputs-outputs-desc" class="magus-diagram"><title id="inputs-outputs-title">An output stops at a nested project; an input does not</title><desc id="inputs-outputs-desc">A target's ctx.readsFiles and ctx.writesFiles globs resolve from its own project's directory. The source walk matches every file a glob names, so the root's **/*.go keys every nested Go file too. An output glob claims a file inside a nested project only when the glob is rooted there; the snapshot, the replay and the drift gate all ask the same rule, and a write that lands there anyway fails the run as MGS3001. A nested project reads the root's tree through a project handle, workspace\file, which also makes the root its upstream. The matched files and the probed tool versions are the key; an input nobody declared never reaches it.</desc><defs><marker id="inputs-outputs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="inputs-outputs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="inputs-outputs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">INPUTS AND OUTPUTS</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">An output stops at a nested project; an input does not</text><g transform="translate(0,40)"><rect x="16" y="64" width="536" height="112" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="230" y="68" width="108" height="12" rx="2" fill="#f5f5f5"/><text x="284" y="77" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">A NESTED PROJECT</text><rect x="16" y="200" width="248" height="200" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="92" y="204" width="96" height="12" rx="2" fill="#f5f5f5"/><text x="140" y="213" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">ROOT PROJECT .</text><rect x="16" y="424" width="1408" height="156" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="688" y="428" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="720" y="437" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE CACHE</text><path data-edge="reads->walk" id="inputs-outputs-edge-reads-walk" d="M 248 352 L 268 352 A 8 8 0 0 1 284 352 L 284 352 Q 292 352 292 360 L 292 472 A 8 8 0 0 0 292 488 L 292 488 Q 292 496 300 496 L 320 496" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="handle->walk" id="inputs-outputs-edge-handle-walk" d="M 248 128 L 268 128 Q 276 128 276 136 L 276 472 Q 276 480 284 480 L 320 480" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-accent)"/><path data-edge="walk->key" id="inputs-outputs-edge-walk-key" d="M 536 488 L 608 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="probe->key" id="inputs-outputs-edge-probe-key" d="M 248 532 L 564 532 Q 572 532 572 524 L 572 508 Q 572 500 580 500 L 608 500" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="writes->snapshot" id="inputs-outputs-edge-writes-snapshot" d="M 248 264 L 268 264 A 8 8 0 0 1 284 264 L 856 264 Q 864 264 864 272 L 864 468 Q 864 476 872 476 L 904 476" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="key->snapshot" id="inputs-outputs-edge-key-snapshot" d="M 824 488 L 904 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="snapshot->claims" id="inputs-outputs-edge-snapshot-claims" d="M 1120 488 L 1192 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#inputs-outputs-arrow-default)"/><path data-edge="writes->audit" id="inputs-outputs-edge-writes-audit" d="M 248 252 L 268 252 A 8 8 0 0 1 284 252 L 284 252 Q 292 252 292 244 L 292 136 Q 292 128 300 128 L 320 128" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#inputs-outputs-arrow-default)"/><rect x="286" y="296" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="322" y="305" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">+ DEPENDS_ON</text><rect x="556" y="466" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="572" y="475" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SRC:</text><rect x="390" y="542" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="408" y="551" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">TOOL:</text><rect x="832" y="498" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="864" y="507" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">HIT REPLAYS</text><rect x="302" y="180" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="334" y="189" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">STRAY WRITE</text><g data-node="reads" data-anchor="magusfile.buzz"><rect x="32" y="320" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="320" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="40" y="328" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="58" y="337" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROOT</text><text x="140" y="360" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">readsFiles(&quot;**/*.go&quot;)</text><text x="140" y="376" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">matches nested files too</text></g><g data-node="writes" data-anchor="magusfile.buzz"><rect x="32" y="232" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="232" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="40" y="240" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="58" y="249" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">ROOT</text><text x="140" y="272" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">writesFiles(&quot;**/gen/mocks/*.go&quot;)</text><text x="140" y="288" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the root's gen/ only</text></g><g data-node="handle" data-anchor="docs/magusfile.buzz"><rect x="32" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><rect x="40" y="104" width="36" height="12" rx="2" fill="none" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="58" y="113" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">DOCS</text><text x="140" y="136" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">workspace\file(...)</text><text x="140" y="152" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the root's tree, as upstream</text></g><g data-node="audit" data-anchor="internal/audit"><rect x="320" y="96" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="96" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="128" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Descendant audit</text><text x="428" y="144" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">MGS3001 on a write inside</text></g><g data-node="walk" data-anchor="internal/cache/hash.go"><rect x="320" y="456" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="320" y="456" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="428" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Source walk</text><text x="428" y="504" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">every file a glob matches</text></g><g data-node="probe" data-anchor="run.go"><rect x="32" y="500" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="500" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="140" y="532" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Tool probe</text><text x="140" y="548" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the version, or UNPROBED</text></g><g data-node="key" data-anchor="internal/cache"><rect x="608" y="456" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="608" y="456" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="716" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Cache key</text><text x="716" y="504" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">src:, dep:, tool: lines</text></g><g data-node="snapshot" data-anchor="internal/cache/snapshot.go"><rect x="904" y="456" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="904" y="456" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1012" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Snapshot + replay</text><text x="1012" y="504" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">owned outputs only</text></g><g data-node="claims" data-anchor="types/workspace.go"><rect x="1192" y="456" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="1192" y="456" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1300" y="488" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Output claim</text><text x="1300" y="504" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">stops at a nested dir</text></g><line x1="32" y1="616" x2="1424" y2="616" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="630" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="636" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="645" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT A HIT IS KEYED ON</text></g></svg>