<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 544 1024" width="544" height="1024" role="img" aria-labelledby="buzz-compile-title buzz-compile-desc" class="magus-diagram"><metadata>{"diagram":"buzz-compile","stamp":"sha256:8cc1044f31b1feba1f54bdbb2e74bbdee7b59cc3d6cc2b6d663cb6f1685ade50"}</metadata><title id="buzz-compile-title">Imports run before the checker sees a name</title><desc id="buzz-compile-desc">Inside the gopherbuzz root package, source passes the parse cache, the parser, import resolution, the checker and the compiler, which emits a chunk. Import resolution runs every imported module through the same steps first, so its exports are bound before the checker looks names up. A fresh bytecode store skips every step.</desc><defs><marker id="buzz-compile-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="buzz-compile-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="buzz-compile-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">GOPHERBUZZ</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">Imports run before the checker sees a name</text><g transform="translate(0,40)"><path data-edge="external:Buzz source->external:Parse cache" id="buzz-compile-edge-external_3aBuzz_20source-external_3aParse_20cache" d="M 140 120 L 140 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Buzz source->external:Bytecode store" id="buzz-compile-edge-external_3aBuzz_20source-external_3aBytecode_20store" d="M 248 92 L 252 92 Q 260 92 260 100 L 260 788 Q 260 796 252 796 L 160 796 Q 152 796 152 804 L 152 832" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Parse cache->external:Parser" id="buzz-compile-edge-external_3aParse_20cache-external_3aParser" d="M 140 248 L 140 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Parser->external:Import resolution" id="buzz-compile-edge-external_3aParser-external_3aImport_20resolution" d="M 140 376 L 140 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Import resolution->external:Checker" id="buzz-compile-edge-external_3aImport_20resolution-external_3aChecker" d="M 140 504 L 140 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Checker->external:Compiler" id="buzz-compile-edge-external_3aChecker-external_3aCompiler" d="M 140 632 L 140 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><path data-edge="external:Compiler->external:Bytecode store" id="buzz-compile-edge-external_3aCompiler-external_3aBytecode_20store" d="M 140 760 L 140 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-compile-arrow-default)"/><rect x="176" y="774" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="204" y="783" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">FRESH HIT</text><rect x="150" y="276" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="172" y="285" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">[]TOKEN</text><rect x="150" y="404" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="186" y="413" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">*AST.PROGRAM</text><rect x="150" y="532" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="188" y="541" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXPORTS BOUND</text><rect x="150" y="660" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="178" y="669" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO ERRORS</text><rect x="94" y="788" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="112" y="797" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">SAVES</text><g data-node="external:Buzz source"><rect x="32" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="1.2"/><text x="140" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Buzz source</text><text x="140" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">a file or a snippet</text></g><g data-node="external:Parse cache" data-anchor="libs/gopherbuzz/parser.go"><rect x="32" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="192" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="220" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Parse cache</text><text x="140" y="236" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">token.Tokenize on a miss</text></g><g data-node="external:Parser" data-anchor="libs/gopherbuzz/parser.go"><rect x="32" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="348" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Parser</text><text x="140" y="364" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">recursive descent, *ast.Program</text></g><g data-node="external:Import resolution" data-anchor="libs/gopherbuzz/session.go"><rect x="32" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="448" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="140" y="476" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Import resolution</text><text x="140" y="492" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">runs each module first</text></g><g data-node="external:Checker" data-anchor="libs/gopherbuzz/checker.go"><rect x="32" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="576" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="604" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Checker</text><text x="140" y="620" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">types.Type, BZZ codes</text></g><g data-node="external:Compiler" data-anchor="libs/gopherbuzz/compiler.go"><rect x="32" y="704" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="704" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="732" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Compiler</text><text x="140" y="748" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">AST to *vm.Chunk</text></g><g data-node="external:Bytecode store" data-anchor="libs/gopherbuzz/bytecode_cache.go"><rect x="32" y="832" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="32" y="832" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="140" y="860" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Bytecode store</text><text x="140" y="876" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">.bo plus its import closure</text></g><line x1="32" y1="924" x2="512" y2="924" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="938" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="944" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="953" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHERE AN IMPORT RUNS</text><rect x="192" y="944" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="0.8"/><text x="210" y="953" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OPTIONAL, SET BY THE HOST</text><rect x="352" y="944" width="10" height="10" rx="2" fill="#4f5d75" stroke="#5f6780" fill-opacity="0.1" stroke-width="0.8"/><text x="370" y="953" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT A HOST HANDS IN</text></g></svg>