<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 504 640" width="504" height="640" role="img" aria-labelledby="harness-pyramid-title harness-pyramid-desc" class="magus-diagram"><metadata>{"figure":"harness-pyramid","stamp":"sha256:abd6dc7fa5d24a27b544993208844e8622b8fe4834e7d636722dab38f135503a"}</metadata><title id="harness-pyramid-title">The model proposes, the harness executes</title><desc id="harness-pyramid-desc">Four layers, top to bottom. The person writes the guard rules, forks the jobs and prompts the agent. The outer harness, magus, judges every call the inner harness makes and answers from the workspace record. The inner harness, the host's agent loop, sends the model its context and executes the tool calls the model proposes. The model only proposes.</desc><defs><marker id="harness-pyramid-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="harness-pyramid-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="harness-pyramid-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">DESIGN</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">The model proposes, the harness executes</text><g transform="translate(0,40)"><path data-edge="external:Person->external:Outer harness" id="harness-pyramid-edge-external_3aPerson-external_3aOuter_20harness" d="M 140 120 L 140 192" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-pyramid-arrow-default)"/><path data-edge="external:Person->external:Inner harness" id="harness-pyramid-edge-external_3aPerson-external_3aInner_20harness" d="M 248 92 L 252 92 Q 260 92 260 100 L 260 276 Q 260 284 252 284 L 160 284 Q 152 284 152 292 L 152 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-pyramid-arrow-default)"/><path data-edge="external:Outer harness->external:Inner harness" id="harness-pyramid-edge-external_3aOuter_20harness-external_3aInner_20harness" d="M 140 248 L 140 320" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-pyramid-arrow-default)"/><path data-edge="external:Inner harness->external:Model" id="harness-pyramid-edge-external_3aInner_20harness-external_3aModel" d="M 140 376 L 140 448" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#harness-pyramid-arrow-default)"/><rect x="150" y="148" width="64" height="12" rx="2" fill="#2d3142"/><text x="182" y="157" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RULES, JOBS</text><rect x="182" y="262" width="44" height="12" rx="2" fill="#2d3142"/><text x="204" y="271" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">PROMPTS</text><rect x="78" y="276" width="52" height="12" rx="2" fill="#2d3142"/><text x="104" y="285" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">VERDICTS</text><rect x="150" y="404" width="44" height="12" rx="2" fill="#2d3142"/><text x="172" y="413" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">CONTEXT</text><g data-node="external:Person"><rect x="32" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="64" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="140" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Person</text><text x="140" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">decides, pays</text></g><g data-node="external:Outer harness"><rect x="32" y="192" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="192" width="216" height="56" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="140" y="220" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Outer harness</text><text x="140" y="236" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">magus: guard, leases, jobs</text></g><g data-node="external:Inner harness"><rect x="32" y="320" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="320" width="216" height="56" rx="6" fill="#2d3142" stroke="#a9b1c2" stroke-width="1.2"/><text x="140" y="348" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Inner harness</text><text x="140" y="364" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">agent loop: Claude Code, Codex</text></g><g data-node="external:Model"><rect x="32" y="448" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="448" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="476" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Model</text><text x="140" y="492" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">proposes the next action</text></g><line x1="32" y1="540" x2="472" y2="540" stroke="#505466" stroke-width="0.8"/><text x="32" y="554" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="560" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="569" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">MAGUS</text><rect x="192" y="560" width="10" height="10" rx="2" fill="#393e53" stroke="#505466" stroke-width="0.8"/><text x="210" y="569" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">PROPOSES ONLY</text></g></svg>