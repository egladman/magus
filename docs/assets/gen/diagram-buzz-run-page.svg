<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 784" width="668" height="784" role="img" aria-labelledby="buzz-run-title buzz-run-desc" class="magus-diagram"><metadata>{"figure":"buzz-run","stamp":"sha256:21fd8a39c4e3b22c1aceda3c0e948ecdb21bbf557395864384cc0362c6d3fdbc"}</metadata><title id="buzz-run-title">Interpreter first, native code when the chunk allows it</title><desc id="buzz-run-desc">Session.runChunk makes a VM and calls VM.Run with the chunk and the session's environment. Run reserves the top-level register window and asks jitRun first. With the JIT on, the baseline JIT judges the chunk once and caches the verdict: depths() admits only the numeric subset, locals, constants, arithmetic, comparisons and jumps, and validates every operand, and compileJIT emits amd64 or arm64 code through golang-asm into executable pages. Only the chunk Run was handed can go native; a function it calls runs on the interpreter. There is one native tier and no hotness counter. A value the native code cannot handle deopts to the interpreter at the instruction it stopped on, with the stack depth checked; a chunk the JIT declines, or one with no slot locals, runs on the interpreter from the start. The interpreter's values are NaN-boxed 64-bit words, and heap objects are handles into one table the session releases when it closes.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="buzz-run-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="buzz-run-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="buzz-run-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">GOPHERBUZZ</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">Interpreter first, native code when the chunk allows it</text><g transform="translate(0,40)"><rect x="32" y="160" width="564" height="488" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="278" y="164" width="72" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="314" y="173" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">PACKAGE VM</text><path data-edge="libs/gopherbuzz->libs/gopherbuzz/vm" id="buzz-run-edge-libs_2fgopherbuzz-libs_2fgopherbuzz_2fvm" d="M 460 120 L 460 192" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="libs/gopherbuzz/vm->external:Baseline JIT" id="buzz-run-edge-libs_2fgopherbuzz_2fvm-external_3aBaseline_20JIT" d="M 460 248 L 460 320" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="libs/gopherbuzz/vm->external:Interpreter" id="buzz-run-edge-libs_2fgopherbuzz_2fvm-external_3aInterpreter" d="M 568 220 L 572 220 Q 580 220 580 228 L 580 404 Q 580 412 572 412 L 480 412 Q 472 412 472 420 L 472 448" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="external:Baseline JIT->external:Native code" id="buzz-run-edge-external_3aBaseline_20JIT-external_3aNative_20code" d="M 352 348 L 164 348 Q 156 348 156 356 L 156 448" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="external:Baseline JIT->external:Interpreter" id="buzz-run-edge-external_3aBaseline_20JIT-external_3aInterpreter" d="M 460 376 L 460 448" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="external:Native code->external:Interpreter" id="buzz-run-edge-external_3aNative_20code-external_3aInterpreter" d="M 264 476 L 352 476" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="1.2" marker-end="url(#buzz-run-arrow-accent)"/><path data-edge="external:Interpreter->external:Heap table" id="buzz-run-edge-external_3aInterpreter-external_3aHeap_20table" d="M 460 504 L 460 576" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><rect x="470" y="148" width="72" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="506" y="157" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">*CHUNK, *ENV</text><rect x="470" y="276" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="490" y="285" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JIT ON</text><rect x="502" y="390" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="524" y="399" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JIT OFF</text><rect x="226" y="326" width="52" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="252" y="335" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">COMPILED</text><rect x="398" y="404" width="52" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="424" y="413" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DECLINED</text><rect x="276" y="454" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="308" y="463" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DEOPT AT IP</text><rect x="470" y="532" width="56" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="498" y="541" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ALLOCATES</text><g data-node="libs/gopherbuzz" data-anchor="libs/gopherbuzz/session.go"><rect x="352" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="352" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="460" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Session</text><text x="460" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">runChunk</text></g><g data-node="libs/gopherbuzz/vm" data-anchor="libs/gopherbuzz/vm/vm.go"><rect x="352" y="192" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="352" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="460" y="220" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">VM.Run</text><text x="460" y="236" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">register window, inline caches</text></g><g data-node="external:Baseline JIT"><rect x="352" y="320" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="352" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="460" y="348" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Baseline JIT</text><text x="460" y="364" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">depths, then golang-asm</text></g><g data-node="external:Native code"><rect x="48" y="448" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="48" y="448" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="156" y="476" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Native code</text><text x="156" y="492" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-