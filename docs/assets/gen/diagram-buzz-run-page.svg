ative_20code-external_3aInterpreter" d="M 248 476 L 336 476" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="1.2" marker-end="url(#buzz-run-arrow-accent)"/><path data-edge="external:Interpreter->external:Heap table" id="buzz-run-edge-external_3aInterpreter-external_3aHeap_20table" d="M 444 504 L 444 576" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><rect x="454" y="148" width="72" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="490" y="157" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">*CHUNK, *ENV</text><rect x="454" y="276" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="474" y="285" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JIT ON</text><rect x="486" y="390" width="44" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="508" y="399" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JIT OFF</text><rect x="210" y="326" width="52" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="236" y="335" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">COMPILED</text><rect x="382" y="404" width="52" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="408" y="413" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DECLINED</text><rect x="260" y="454" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="292" y="463" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DEOPT AT IP</text><rect x="454" y="532" width="56" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="482" y="541" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ALLOCATES</text><g data-node="external:Compiled chunk"><rect x="336" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="336" y="64" width="216" height="56" rx="6" fill="#4f5d75" stroke="#5f6780" class="magus-fill-muted magus-stroke-soft" fill-opacity="0.1" stroke-width="1.2"/><text x="444" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Compiled chunk</text><text x="444" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">from Session.runChunk</text></g><g data-node="external:VM.Run" data-anchor="libs/gopherbuzz/vm/vm.go"><rect x="336" y="192" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="336" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="444" y="220" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">VM.Run</text><text x="444" y="236" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">register window, inline caches</text></g><g data-node="external:Baseline JIT" data-anchor="libs/gopherbuzz/vm/jit_shared.go"><rect x="336" y="320" 