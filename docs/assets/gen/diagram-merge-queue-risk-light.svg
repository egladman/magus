<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1064" width="640" height="1064" role="img" aria-labelledby="merge-queue-risk-title merge-queue-risk-desc" class="magus-diagram"><title id="merge-queue-risk-title">What a candidate's risk makes the queue run</title><desc id="merge-queue-risk-desc">For a conflicted file the queue asks the classifier which class the edit is and settles only a low-risk one, kicking code back, then gates the projects the magus SDK says the change reaches, or every project when that set is no proof.</desc><defs><marker id="merge-queue-risk-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="merge-queue-risk-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="merge-queue-risk-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">MERGE QUEUE</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">What a candidate's risk makes the queue run</text><g transform="translate(0,40)"><rect x="32" y="32" width="260" height="488" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="118" y="36" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="162" y="45" fill="#2d3142" fill-opacity="0.4" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE WORKSPACE</text><path data-edge="github->provider" id="merge-queue-risk-edge-github-provider" d="M 424 120 L 424 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="provider->queue" id="merge-queue-risk-edge-provider-queue" d="M 424 248 L 424 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="queue->risk" id="merge-queue-risk-edge-queue-risk" d="M 424 376 L 424 404 Q 424 412 416 412 L 176 412 Q 168 412 168 420 L 168 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="queue->gate" id="merge-queue-risk-edge-queue-gate" d="M 532 348 L 548 348 Q 556 348 556 356 L 556 672 Q 556 680 548 680 L 444 680 Q 436 680 436 688 L 436 728" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="sdk->risk" id="merge-queue-risk-edge-sdk-risk" d="M 156 120 L 156 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="sdk->gate" id="merge-queue-risk-edge-sdk-gate" d="M 264 92 L 268 92 Q 276 92 276 100 L 276 404 A 8 8 0 0 0 276 420 L 276 532 A 8 8 0 0 0 276 548 L 276 672 Q 276 680 284 680 L 404 680 Q 412 680 412 688 L 412 728" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="risk->low" id="merge-queue-risk-edge-risk-low" d="M 156 504 L 156 532 Q 156 540 164 540 L 416 540 Q 424 540 424 548 L 424 576" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-accent)"/><path data-edge="low->gate" id="merge-queue-risk-edge-low-gate" d="M 424 632 L 424 728" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="low->verdict" id="merge-queue-risk-edge-low-verdict" d="M 532 604 L 536 604 Q 544 604 544 612 L 544 672 A 8 8 0 0 0 544 688 L 544 812 Q 544 820 536 820 L 500 820 Q 492 820 492 828 L 492 856" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="gate->verdict" id="merge-queue-risk-edge-gate-verdict" d="M 424 784 L 424 812 Q 424 820 432 820 L 468 820 Q 476 820 476 828 L 476 856" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="verdict->github" id="merge-queue-risk-edge-verdict-github" d="M 592 884 L 600 884 Q 608 884 608 876 L 608 100 Q 608 92 600 92 L 532 92" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#merge-queue-risk-arrow-default)"/><rect x="434" y="148" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="470" y="157" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGE INTENT</text><rect x="434" y="276" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="456" y="285" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">CHANGES</text><rect x="290" y="390" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="399" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">A CONFLICT</text><rect x="464" y="658" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="496" y="667" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO CONFLICT</text><rect x="308" y="658" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="344" y="667" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ITS PROJECTS</text><rect x="292" y="518" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="320" y="527" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">THE CLASS</text><rect x="434" y="640" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="470" y="649" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES: SETTLED</text><rect x="462" y="798" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="500" y="807" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO: KICK BACK</text><rect x="400" y="830" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="432" y="839" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXIT STATUS</text><rect x="550" y="70" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="568" y="79" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">APPLY</text><g data-node="github"><rect x="316" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="316" y="64" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.2"/><text x="424" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">GitHub</text><text x="424" y="108" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">auto-merge or a label</text></g><g data-node="provider" data-anchor="internal/queue/provider"><rect x="316" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="316" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="424" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Forge provider</text><text x="424" y="236" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">github.buzz on a Buzz VM</text></g><g data-node="queue" data-anchor="internal/queue"><rect x="316" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="316" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="424" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Queue engine</text><text x="424" y="364" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">plan, validate, apply</text></g><g data-node="sdk" data-anchor="magus.go"><rect x="48" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="48" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="156" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus SDK</text><text x="156" y="108" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">asked via queue/client</text></g><g data-node="risk" data-anchor="internal/risk"><rect x="48" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="48" y="448" width="216" height="56" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="156" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Classify each path</text><text x="156" y="492" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">generated, prose, comment, code</text></g><g data-node="low"><polygon points="424,576 532,604 424,632 316,604" fill="#f5f5f5"/><polygon points="424,576 532,604 424,632 316,604" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="424" y="608" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">low risk?</text></g><g data-node="gate" data-anchor="tools/gha-queue.buzz"><rect x="316" y="728" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="316" y="728" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="424" y="756" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Gate the projects</text><text x="424" y="772" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">every one when unbounded</text></g><g data-node="verdict" data-anchor="internal/queue/verdicts.go"><rect x="376" y="856" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="376" y="856" width="216" height="56" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="484" y="884" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Verdict</text><text x="484" y="900" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">green, red or kicked back</text></g><line x1="32" y1="964" x2="608" y2="964" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="978" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="984" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="993" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">READS WHAT AN EDIT IS</text><rect x="192" y="984" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/><text x="210" y="993" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text><rect x="352" y="984" width="10" height="10" rx="2" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="370" y="993" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE QUEUE DECIDES</text></g></svg>