<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 1040" width="688" height="1040" role="img" aria-labelledby="merge-queue-risk-title merge-queue-risk-desc" class="magus-diagram"><metadata>{"figure":"merge-queue-risk","stamp":"sha256:e3f9d77dd562221ef0340f4da949721b333a08d9ba5bfc1a52194227b808527c"}</metadata><title id="merge-queue-risk-title">The queue settles a low-risk conflict and kicks code back</title><desc id="merge-queue-risk-desc">For a conflicted file the queue asks the classifier which class the edit is and settles only a low-risk one, kicking code back, then gates the projects the change reaches, or every project when that set is no proof.</desc><defs><marker id="merge-queue-risk-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="merge-queue-risk-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="merge-queue-risk-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">MERGE QUEUE</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" font-size="20" font-weight="600">The queue settles a low-risk conflict and kicks code back</text><g transform="translate(0,40)"><rect x="48" y="416" width="260" height="104" rx="8" fill="#2d3142" stroke="#2d3142" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="134" y="420" width="88" height="12" rx="2" fill="#f5f5f5"/><text x="178" y="429" fill="#5f6780" font-family="monospace" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE WORKSPACE</text><path data-edge="external:Queue workflows->internal/queue/provider" id="merge-queue-risk-edge-external_3aQueue_20workflows-internal_2fqueue_2fprovider" d="M 172 120 L 172 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="internal/queue/provider->group:Queue engine" id="merge-queue-risk-edge-internal_2fqueue_2fprovider-group_3aQueue_20engine" d="M 172 248 L 172 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="group:Queue engine->internal/risk" id="merge-queue-risk-edge-group_3aQueue_20engine-internal_2frisk" d="M 172 376 L 172 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="group:Queue engine->external:Gate the projects" id="merge-queue-risk-edge-group_3aQueue_20engine-external_3aGate_20the_20projects" d="M 280 348 L 284 348 Q 292 348 292 356 L 292 532 A 8 8 0 0 0 292 548 L 292 668 Q 292 676 300 676 L 348 676 Q 356 676 356 684 L 356 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="internal/risk->external:low risk?" id="merge-queue-risk-edge-internal_2frisk-external_3alow_20risk_3f" d="M 172 504 L 172 532 Q 172 540 180 540 L 432 540 Q 440 540 440 548 L 440 576" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-accent)"/><path data-edge="external:low risk?->external:Gate the projects" id="merge-queue-risk-edge-external_3alow_20risk_3f-external_3aGate_20the_20projects" d="M 332 604 L 328 604 Q 320 604 320 612 L 320 652 Q 320 660 328 660 L 364 660 Q 372 660 372 668 L 372 704" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="external:low risk?->external:Verdict" id="merge-queue-risk-edge-external_3alow_20risk_3f-external_3aVerdict" d="M 440 632 L 440 652 Q 440 660 448 660 L 476 660 Q 484 660 484 668 L 484 788 Q 484 796 476 796 L 440 796 Q 432 796 432 804 L 432 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="external:Gate the projects->external:Verdict" id="merge-queue-risk-edge-external_3aGate_20the_20projects-external_3aVerdict" d="M 364 760 L 364 788 Q 364 796 372 796 L 408 796 Q 416 796 416 804 L 416 832" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#merge-queue-risk-arrow-default)"/><path data-edge="external:Verdict->external:Queue workflows" id="merge-queue-risk-edge-external_3aVerdict-external_3aQueue_20workflows" d="M 316 860 L 40 860 Q 32 860 32 852 L 32 100 Q 32 92 40 92 L 64 92" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#merge-queue-risk-arrow-default)"/><rect x="182" y="148" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="218" y="157" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">MERGE INTENT</text><rect x="182" y="276" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="204" y="285" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">CHANGES</text><rect x="182" y="404" width="60" height="12" rx="2" fill="#f5f5f5"/><text x="212" y="413" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">A CONFLICT</text><rect x="284" y="686" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="316" y="695" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO CONFLICT</text><rect x="308" y="518" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="336" y="527" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">THE CLASS</text><rect x="332" y="638" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="368" y="647" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES: SETTLED</text><rect x="402" y="774" width="76" height="12" rx="2" fill="#f5f5f5"/><text x="440" y="783" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO: KICK BACK</text><rect x="340" y="806" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="372" y="815" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">EXIT STATUS</text><rect x="154" y="838" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="172" y="847" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">APPLY</text><g data-node="external:Queue workflows"><rect x="64" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="64" y="64" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#5f6780" stroke-width="1.2"/><text x="172" y="92" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Queue workflows</text><text x="172" y="108" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">queue-intent, queue, queue-apply</text></g><g data-node="internal/queue/provider" data-anchor="internal/queue/provider"><rect x="64" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="64" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="172" y="220" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Forge provider</text><text x="172" y="236" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">github.buzz on a Buzz VM</text></g><g data-node="group:Queue engine" data-drill="merge-queue-workflows"><rect x="64" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="64" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="172" y="348" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Queue engine</text><text x="172" y="364" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">plan, validate, apply; asks the SDK</text></g><g data-node="internal/risk" data-anchor="internal/risk"><rect x="64" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="64" y="448" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="172" y="476" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Classify each path</text><text x="172" y="492" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">generated, prose, comment, code</text></g><g data-node="external:low risk?"><polygon points="440,576 548,604 440,632 332,604" fill="#f5f5f5"/><polygon points="440,576 548,604 440,632 332,604" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="440" y="608" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">low risk?</text></g><g data-node="external:Gate the projects"><rect x="256" y="704" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="256" y="704" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="364" y="732" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Gate the projects</text><text x="364" y="748" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">every one when unbounded</text></g><g data-node="external:Verdict"><rect x="316" y="832" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="316" y="832" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="424" y="860" fill="#2d3142" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Verdict</text><text x="424" y="876" fill="#5f6780" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">green, red or kicked back</text></g><line x1="32" y1="940" x2="656" y2="940" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y="954" fill="#4f5d75" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="960" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="969" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">READS WHAT AN EDIT IS</text><rect x="192" y="960" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#5f6780" stroke-width="0.8"/><text x="210" y="969" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">OUTSIDE MAGUS</text><rect x="352" y="960" width="10" height="10" rx="2" fill="#ffffff" stroke="#e6e6e8" stroke-width="0.8"/><text x="370" y="969" fill="#5f6780" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE QUEUE DECIDES</text></g></svg>