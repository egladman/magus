<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" width="960" height="640" role="img" aria-labelledby="commit-generated-title commit-generated-desc" class="magus-diagram"><title id="commit-generated-title">Whether a generated file belongs in the repo</title><desc id="commit-generated-desc">A generated file is committed only when it is a pure function of committed sources, is not already produced by the build, is read by something that never runs the build, and is neither large nor churning.</desc><defs><marker id="commit-generated-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#646b79"/></marker><marker id="commit-generated-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bc4c00"/></marker><marker id="commit-generated-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><text x="32" y="32" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">CACHE</text><text x="32" y="60" fill="#373c44" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Whether a generated file belongs in the repo</text><g transform="translate(0,40)"><path d="M 480 120 L 480 152" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#commit-generated-arrow-default)"/><path d="M 480 224 L 480 256" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#commit-generated-arrow-default)"/><path d="M 480 328 L 480 360" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#commit-generated-arrow-default)"/><path d="M 480 432 L 480 464" fill="none" stroke="#646b79" stroke-width="1" marker-end="url(#commit-generated-arrow-default)"/><path d="M 408 188 L 312 188 Q 304 188 304