ont-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">generate is the gate</text><line x1="32" y1="808" x2="968" y2="808" stroke="#dce3eb" stroke-width="0.8"/><rect x="32" y="816" width="10" height="10" rx="2" fill="rgba(188,76,0,0.08)" stroke="#bc4c00" stroke-width="0.8"/><text x="50" y="825" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">NEEDS A DRIFT GATE</text></g></svg>