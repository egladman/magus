 stroke="#eb6c36" stroke-width="1.2"/><text x="140" y="732" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Commit it</text><text x="140" y="748" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">generate is the gate</text></g><line x1="32" y1="796" x2="516" y2="796" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="810" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="816" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="825" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">NEEDS A DRIFT GATE</text></g></svg>