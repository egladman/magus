ll="#ffffff"/><text x="320" y="327" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="324" y="430" width="24" height="12" rx="2" fill="#ffffff"/><text x="336" y="439" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="612" y="366" width="24" height="12" rx="2" fill="#ffffff"/><text x="624" y="375" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">YES</text><rect x="638" y="426" width="20" height="12" rx="2" fill="#ffffff"/><text x="648" y="435" fill="#7b8495" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NO</text><rect x="368" y="64" width="224" height="56" rx="6" fill="#ffffff"/><rect x="368" y="64" width="224" height="56" rx="6" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="480" y="96" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">A target writes a file</text><polygon points="480,152 552,188 480,224 408,188" fill="#ffffff"/><polygon points="480,152 552,188 480,224 408,188" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="480" y="192" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">pure function?</text><polygon points="480,256 552,292 480,328 408,292" fill="#ffffff"/><polygon points="480,256 552,292 480,328 408,292" fill="#f3f4f6" stroke="#dce3eb" stroke-width="1"/><text x="480" y="296" fill="#373c44" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">build