<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 956 912" width="956" height="912" role="img" aria-labelledby="agent-orchestration-title agent-orchestration-desc" class="magus-diagram"><metadata>{"diagram":"agent-orchestration","stamp":"sha256:625c41ed7e74ded8c129aaa93f85c8137ccd6420675538ebb81d69497d35d3a2"}</metadata><title id="agent-orchestration-title">Three roles, one store, and a guard at every boundary</title><desc id="agent-orchestration-desc">The orchestrator forks job rows into one store and waits on them. Each worker holds one row: its write paths, check and checkout. The integrator merges finished branches and runs the checks. The guard reads the row on every call, the sandbox narrows a run's writes to it, and the broker holds the machine's one build budget.</desc><style>.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#f5f5f5);--magus-diagram-paint-fill:var(--magus-diagram-fill,#ffffff);--magus-diagram-paint-ink:var(--magus-diagram-ink,#2d3142);--magus-diagram-paint-muted:var(--magus-diagram-muted,#4f5d75);--magus-diagram-paint-soft:var(--magus-diagram-soft,#5f6780);--magus-diagram-paint-rule:var(--magus-diagram-rule,#e6e6e8);--magus-diagram-paint-accent:var(--magus-diagram-accent,#eb6c36);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-diagram-paint-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-diagram-paint-paper:var(--magus-diagram-paper,#2d3142);--magus-diagram-paint-fill:var(--magus-diagram-fill,#393e53);--magus-diagram-paint-ink:var(--magus-diagram-ink,#f5f5f5);--magus-diagram-paint-muted:var(--magus-diagram-muted,#bfc0c0);--magus-diagram-paint-soft:var(--magus-diagram-soft,#a9b1c2);--magus-diagram-paint-rule:var(--magus-diagram-rule,#505466);--magus-diagram-paint-accent:var(--magus-diagram-accent,#f08a59);--magus-diagram-paint-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-diagram-paint-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-diagram-paint-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-diagram-paint-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-diagram-paint-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-diagram-paint-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-diagram-paint-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-diagram-paint-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-diagram-paint-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-diagram-paint-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-diagram-paint-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-diagram-paint-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-diagram-paint-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-diagram-paint-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-diagram-paint-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-diagram-paint-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-diagram-paint-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-diagram-paint-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-diagram-paint-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="agent-orchestration-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="agent-orchestration-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="agent-orchestration-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">ORCHESTRATION</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">Three roles, one store, and a guard at every boundary</text><g transform="translate(0,40)"><rect x="32" y="32" width="488" height="232" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="244" y="36" width="64" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="276" y="45" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">THE ROLES</text><rect x="544" y="32" width="380" height="744" rx="8" fill="#2d3142" stroke="#2d3142" class="magus-fill-ink magus-stroke-ink" fill-opacity="0.02" stroke-opacity="0.1" stroke-width="0.8"/><rect x="642" y="36" width="184" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="734" y="45" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="7" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">WHAT MAGUS HOLDS AND ENFORCES</text><path data-edge="external:Orchestrator->external:Worker" id="agent-orchestration-edge-external_3aOrchestrator-external_3aWorker" d="M 156 120 L 156 192" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#agent-orchestration-arrow-default)"/><path data-edge="external:Orchestrator->internal/job" id="agent-orchestration-edge-external_3aOrchestrator-internal_2fjob" d="M 264 92 L 268 92 Q 276 92 276 100 L 276 540 Q 