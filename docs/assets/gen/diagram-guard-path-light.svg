<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1736 380" width="1736" height="380" role="img" aria-labelledby="guard-path-title guard-path-desc" class="magus-diagram"><title id="guard-path-title">One command judges every call, and says what to run instead</title><desc id="guard-path-desc">The host's PreToolUse hook, wired by magus agent harness install, pipes the event to magus shell. The built-in rules judge it first, reading the job store for the lease the call acts as; the workspace's magus\guard.command rule sees only what they let through and can only add to the verdict. A deny carries its reason and a next: breadcrumb naming the command to run instead, and the hook renders it into the host's reply.</desc><defs><marker id="guard-path-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="guard-path-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="guard-path-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">GUARD</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">One command judges every call, and says what to run instead</text><g transform="translate(0,40)"><path data-edge="hook->shell" id="guard-path-edge-hook-shell" d="M 248 184 L 336 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="shell->builtin" id="guard-path-edge-shell-builtin" d="M 552 184 L 624 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="builtin->jobs" id="guard-path-edge-builtin-jobs" d="M 840 184 L 912 184" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="builtin->workspace" id="guard-path-edge-builtin-workspace" d="M 840 172 L 868 172 Q 876 172 876 164 L 876 116 Q 876 108 884 108 L 912 108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="policy->workspace" id="guard-path-edge-policy-workspace" d="M 248 96 L 912 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="builtin->verdict" id="guard-path-edge-builtin-verdict" d="M 732 216 L 732 220 Q 732 228 740 228 L 1156 228 Q 1164 228 1164 220 L 1164 116 Q 1164 108 1172 108 L 1200 108" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="workspace->verdict" id="guard-path-edge-workspace-verdict" d="M 1128 96 L 1200 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="verdict->hint" id="guard-path-edge-verdict-hint" d="M 1416 96 L 1488 96" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#guard-path-arrow-default)"/><path data-edge="verdict->hook" id="guard-path-edge-verdict-hook" d="M 1308 128 L 1308 236 Q 1308 244 1300 244 L 148 244 Q 140 244 140 236 L 140 216" fill="none" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#guard-path-arrow-default)"/><rect x="256" y="162" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="292" y="171" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ARGV + STDIN</text><rect x="858" y="194" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="876" y="203" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LEASE</text><rect x="802" y="132" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="834" y="141" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">LET THROUGH</text><rect x="1436" y="74" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="1452" y="83" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">NEXT</text><rect x="706" y="254" width="36" height="12" rx="2" fill="#f5f5f5"/><text x="724" y="263" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">REPLY</text><g data-node="hook" data-anchor="docs/guides/integrations/agents/magus-command.buzz"><rect x="32" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="152" width="216" height="64" rx="6" fill="#f5f5f5" stroke="#7a8399" stroke-width="1.2"/><rect x="40" y="160" width="60" height="12" rx="2" fill="none" stroke="#7a8399" stroke-width="0.8"/><text x="70" y="169" fill="#7a8399" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.08em">SETTINGS</text><text x="140" y="192" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Host hook</text><text x="140" y="208" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">PreToolUse, stdin JSON</text></g><g data-node="shell" data-anchor="cmd/magus/shell.go"><rect x="336" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="336" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="444" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">magus shell</text><text x="444" y="200" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">the guard with one door</text></g><g data-node="builtin" data-anchor="internal/guard"><rect x="624" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="624" y="152" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="732" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Built-in rules</text><text x="732" y="200" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">catalogued, run first</text></g><g data-node="policy" data-anchor="tools/policy/guard.buzz"><rect x="32" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="32" y="64" width="216" height="64" rx="6" fill="#4f5d75" fill-opacity="0.1" stroke="#7a8399" stroke-width="1.2"/><text x="140" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace rules file</text><text x="140" y="112" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">magus\guard.command</text></g><g data-node="workspace" data-anchor="internal/guard/workspace_rule.go"><rect x="912" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="912" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1020" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Workspace rule</text><text x="1020" y="112" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">can only add</text></g><g data-node="jobs" data-anchor="internal/job"><rect x="912" y="152" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="912" y="152" width="216" height="64" rx="6" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1020" y="184" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Job store</text><text x="1020" y="200" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">leases, write paths</text></g><g data-node="hint" data-anchor="internal/hint"><rect x="1488" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="1488" y="64" width="216" height="64" rx="6" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="1.2"/><text x="1596" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">next: breadcrumb</text><text x="1596" y="112" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">a command to run</text></g><g data-node="verdict" data-anchor="internal/guard/denial.go"><rect x="1200" y="64" width="216" height="64" rx="6" fill="#f5f5f5"/><rect x="1200" y="64" width="216" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/><text x="1308" y="96" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Verdict</text><text x="1308" y="112" fill="#7a8399" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">deny, advise or pass</text></g><line x1="32" y1="280" x2="1704" y2="280" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="32" y="294" fill="#4f5d75" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="300" width="10" height="10" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="0.8"/><text x="50" y="309" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">WHAT THE AGENT READS</text><rect x="192" y="300" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#7a8399" stroke-width="0.8"/><text x="210" y="309" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE HOST'S SIDE</text><rect x="352" y="300" width="10" height="10" rx="2" fill="#4f5d75" fill-opacity="0.1" stroke="#7a8399" stroke-width="0.8"/><text x="370" y="309" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THIS REPO'S RULES</text><rect x="512" y="300" width="10" height="10" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/><text x="530" y="309" fill="#7a8399" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DECLARED LEASES</text></g></svg>