<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 668 784" width="668" height="784" role="img" aria-labelledby="buzz-run-title buzz-run-desc" class="magus-diagram"><metadata>{"figure":"buzz-run","stamp":"sha256:10790b014d43fadc5f2d882c873aa363efb03cfc72ca10d17dcaa00d97f0142d"}</metadata><title id="buzz-run-title">Interpreter first, native code when the chunk allows it</title><desc id="buzz-run-desc">Session.runChunk makes a VM and calls VM.Run with the chunk and the session's environment. Run reserves the top-level register window and asks jitRun first. With the JIT on, the baseline JIT judges the chunk once and caches the verdict: depths() admits only the numeric subset, locals, constants, arithmetic, comparisons and jumps, and validates every operand, and compileJIT emits amd64 or arm64 code through golang-asm into executable pages. Only the chunk Run was handed can go native; a function it calls runs on the interpreter. There is one native tier and no hotness counter. A value the native code cannot handle deopts to the interpreter at the instruction it stopped on, with the stack depth checked; a chunk the JIT declines, or one with no slot locals, runs on the interpreter from the start. The interpreter's values are NaN-boxed 64-bit words, and heap objects are handles into one table the session releases when it closes.</desc><defs><marker id="buzz-run-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker><marker id="buzz-run-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker><marker id="buzz-run-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5"/><text x="32" y="32" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" letter-spacing="0.18em">GOPHERBUZZ</text><text x="32" y="60" fill="#2d3142" font-size="20" font-weight="600" font-family="var(--pico-font-family, sans-serif)">Interpreter first, native code when the chunk allows it</text><g transform="translate(0,40)"><rect x="32" y="160" width="564" height="488" rx="8" fill="#2d3142" fill-opacity="0.02" stroke="#2d3142" stroke-opacity="0.1" stroke-width="0.8"/><rect x="278" y="164" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="314" y="173" fill="#5f6780" font-size="7" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.14em">PACKAGE VM</text><path data-edge="libs/gopherbuzz->libs/gopherbuzz/vm" id="buzz-run-edge-libs_2fgopherbuzz-libs_2fgopherbuzz_2fvm" d="M 460 120 L 460 192" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="libs/gopherbuzz/vm->external:Baseline JIT" id="buzz-run-edge-libs_2fgopherbuzz_2fvm-external_3aBaseline_20JIT" d="M 460 248 L 460 320" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="libs/gopherbuzz/vm->external:Interpreter" id="buzz-run-edge-libs_2fgopherbuzz_2fvm-external_3aInterpreter" d="M 568 220 L 572 220 Q 580 220 580 228 L 580 404 Q 580 412 572 412 L 480 412 Q 472 412 472 420 L 472 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="external:Baseline JIT->external:Native code" id="buzz-run-edge-external_3aBaseline_20JIT-external_3aNative_20code" d="M 352 348 L 164 348 Q 156 348 156 356 L 156 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="external:Baseline JIT->external:Interpreter" id="buzz-run-edge-external_3aBaseline_20JIT-external_3aInterpreter" d="M 460 376 L 460 448" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><path data-edge="external:Native code->external:Interpreter" id="buzz-run-edge-external_3aNative_20code-external_3aInterpreter" d="M 264 476 L 352 476" fill="none" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#buzz-run-arrow-accent)"/><path data-edge="external:Interpreter->external:Heap table" id="buzz-run-edge-external_3aInterpreter-external_3aHeap_20table" d="M 460 504 L 460 576" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#buzz-run-arrow-default)"/><rect x="470" y="148" width="72" height="12" rx="2" fill="#f5f5f5"/><text x="506" y="157" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">*CHUNK, *ENV</text><rect x="470" y="276" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="490" y="285" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JIT ON</text><rect x="502" y="390" width="44" height="12" rx="2" fill="#f5f5f5"/><text x="524" y="399" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">JIT OFF</text><rect x="226" y="326" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="252" y="335" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">COMPILED</text><rect x="398" y="404" width="52" height="12" rx="2" fill="#f5f5f5"/><text x="424" y="413" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DECLINED</text><rect x="276" y="454" width="64" height="12" rx="2" fill="#f5f5f5"/><text x="308" y="463" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">DEOPT AT IP</text><rect x="470" y="532" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="498" y="541" fill="#5f6780" font-size="8" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">ALLOCATES</text><g data-node="libs/gopherbuzz" data-anchor="libs/gopherbuzz/session.go"><rect x="352" y="64" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="352" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="460" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Session</text><text x="460" y="108" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">runChunk</text></g><g data-node="libs/gopherbuzz/vm" data-anchor="libs/gopherbuzz/vm/vm.go"><rect x="352" y="192" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="352" y="192" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="460" y="220" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">VM.Run</text><text x="460" y="236" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">register window, inline caches</text></g><g data-node="external:Baseline JIT"><rect x="352" y="320" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="352" y="320" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="460" y="348" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Baseline JIT</text><text x="460" y="364" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">depths, then golang-asm</text></g><g data-node="external:Native code"><rect x="48" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="48" y="448" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" stroke-width="1.2"/><text x="156" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Native code</text><text x="156" y="492" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">int and float fast paths</text></g><g data-node="external:Interpreter"><rect x="352" y="448" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="352" y="448" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" stroke-width="1.2"/><text x="460" y="476" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Interpreter</text><text x="460" y="492" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">VM.Exec, one dispatch switch</text></g><g data-node="external:Heap table"><rect x="352" y="576" width="216" height="56" rx="6" fill="#f5f5f5"/><rect x="352" y="576" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" stroke-width="1.2"/><text x="460" y="604" fill="#2d3142" font-size="12" font-weight="600" font-family="var(--pico-font-family, sans-serif)" text-anchor="middle">Heap table</text><text x="460" y="620" fill="#5f6780" font-size="9" font-family="var(--pico-font-family-monospace, monospace)" style="font-variant-ligatures:none" text-anchor="middle">NaN-box handles, freed on Close</text></g><line x1="32" y1="684" x2="636" y2="684" stroke="#e6e6e8" stroke-width="0.8"/><text x="32" y=