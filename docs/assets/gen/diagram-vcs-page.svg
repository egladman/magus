<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1432 416" width="1432" height="416" role="img" aria-labelledby="vcs-title vcs-desc" class="magus-diagram"><metadata>{"figure":"vcs","stamp":"sha256:176608df600e3fc5450f7ae3e1c1e17c31efa75bef6b9d066eed6d454c0e640f"}</metadata><title id="vcs-title">One VCS interface answers git, Mercurial, Sapling and Jujutsu</title><desc id="vcs-desc">The vcs package names the revision, the branch, the dirty digest and the changed files for whichever backend the checkout uses, so no other package runs a VCS command. Job leases and the cache key read the revision, the session and activity records stamp it, and the landing code reads the branch and the merge base. The package reads files through internal/file, identifies itself with the build stamp and keeps its state in the XDG directories.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="vcs-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="vcs-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="vcs-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">VCS</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">One VCS interface answers git, Mercurial, Sapling and Jujutsu</text><g transform="translate(0,40)"><path data-edge="vcs->internal/file" id="vcs-edge-vcs-internal_2ffile" d="M 1004 144 L 1004 100 Q 1004 92 1012 92 L 1184 92" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="vcs->internal/stamp" id="vcs-edge-vcs-internal_2fstamp" d="M 1112 172 L 1184 172" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="vcs->libs/xdg" id="vcs-edge-vcs-libs_2fxdg" d="M 1004 200 L 1004 244 Q 1004 252 1012 252 L 1184 252" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Runs->vcs" id="vcs-edge-group_3aRuns-vcs" d="M 428 160 L 428 164 Q 428 172 436 172 L 896 172" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Runs->group:Records" id="vcs-edge-group_3aRuns-group_3aRecords" d="M 536 132 L 608 132" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Records->vcs" id="vcs-edge-group_3aRecords-vcs" d="M 824 132 L 852 132 Q 860 132 860 140 L 860 152 Q 860 160 868 160 L 896 160" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Landing->vcs" id="vcs-edge-group_3aLanding-vcs" d="M 140 160 L 140 176 Q 140 184 148 184 L 896 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><path data-edge="group:Landing->group:Runs" id="vcs-edge-group_3aLanding-group_3aRuns" d="M 248 132 L 320 132" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#vcs-arrow-default)"/><g data-node="vcs" data-anchor="vcs"><rect x="896" y="144" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="896" y="144" width="216" height="56" rx="6" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="1.2"/><text x="1004" y="172" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">VCS</text><text x="1004" y="188" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">revision, branch, dirty digest</text></g><g data-node="internal/file" data-anchor="internal/file"><rect x="1184" y="64" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1184" y="64" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1292" y="92" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">File helpers</text><text x="1292" y="108" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">reads and writes</text></g><g data-node="internal/stamp" data-anchor="internal/stamp"><rect x="1184" y="144" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1184" y="144" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1292" y="172" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Build stamp</text><text x="1292" y="188" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">who ran it</text></g><g data-node="libs/xdg" data-anchor="libs/xdg"><rect x="1184" y="224" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="1184" y="224" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="1292" y="252" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">XDG paths</text><text x="1292" y="268" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">state</text></g><g data-node="group:Runs"><rect x="320" y="104" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="320" y="104" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="428" y="132" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Runs</text><text x="428" y="148" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">leases, cache key, queue</text></g><g data-node="group:Records"><rect x="608" y="104" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="608" y="104" width="216" height="56" rx="6" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="1.2"/><text x="716" y="132" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Records</text><text x="716" y="148" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">sessions, activity</text></g><g data-node="group:Landing"><rect x="32" y="104" width="216" height="56" rx="6" fill="#f5f5f5" class="magus-fill-paper"/><rect x="32" y="104" width="216" height="56" rx="6" fill="#ffffff" stroke="#e6e6e8" class="magus-fill-fill magus-stroke-rule" stroke-width="1.2"/><text x="140" y="132" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="12" font-weight="600" text-anchor="middle">Landing</text><text x="140" y="148" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">settle, race, work</text></g><line x1="32" y1="316" x2="1400" y2="316" stroke="#e6e6e8" class="magus-stroke-rule" stroke-width="0.8"/><text x="32" y="330" fill="#4f5d75" font-family="monospace" class="magus-fill-muted magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="336" width="10" height="10" rx="2" fill="#f4eae6" stroke="#eb6c36" class="magus-fill-accent-tint magus-stroke-accent" stroke-width="0.8"/><text x="50" y="345" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE ONE INTERFACE</text><rect x="192" y="336" width="10" height="10" rx="2" fill="#f5f5f5" stroke="#e6e6e8" class="magus-fill-paper magus-stroke-rule" stroke-width="0.8"/><text x="210" y="345" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">APPEND-ONLY</text></g></svg>