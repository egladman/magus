<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 856 596" width="856" height="596" role="img" aria-labelledby="dry-run-title dry-run-desc" class="magus-diagram"><metadata>{"figure":"dry-run","stamp":"sha256:e91937cc0cd489a3e79ee64ab56eafc1be86efb973604ca84b7a5bfb265837d2"}</metadata><title id="dry-run-title">A dry run evaluates a magusfile with the host's effects stubbed</title><desc id="dry-run-desc">internal/dry loads a magusfile or a spell with every host call replaced by a recording stub, so the Buzz runs and nothing outside the process changes. It reads the spell registry and the wards to answer the same way a real run would, uses the generated host mirrors to type the stubs, and hands the recorded graph to the callers: doctor checks a workspace with it, the docs generator runs examples with it and the playground runs a script in a browser.</desc><defs><marker id="dry-run-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#bfc0c0"/></marker><marker id="dry-run-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f08a59"/></marker><marker id="dry-run-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6a95d8"/></marker></defs><rect width="100%" height="100%" fill="#2d3142"/><text x="32" y="32" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">DRY RUN</text><text x="32" y="60" fill="#f5f5f5" font-family="sans-serif" font-size="20" font-weight="600">A dry run evaluates a magusfile with the host's effects stubbed</text><g transform="translate(0,40)"><path data-edge="internal/dry->internal/spell" id="dry-run-edge-internal_2fdry-internal_2fspell" d="M 536 412 L 608 412" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><path data-edge="internal/dry->internal/ward" id="dry-run-edge-internal_2fdry-internal_2fward" d="M 428 376 L 428 100 Q 428 92 436 92 L 608 92" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><path data-edge="internal/dry->internal/interp/bindings/gen" id="dry-run-edge-internal_2fdry-internal_2finterp_2fbindings_2fgen" d="M 440 376 L 440 180 Q 440 172 448 172 L 608 172" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><path data-edge="internal/dry->internal/interp/bindings/ffi" id="dry-run-edge-internal_2fdry-internal_2finterp_2fbindings_2fffi" d="M 452 376 L 452 260 Q 452 252 460 252 L 608 252" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><path data-edge="internal/dry->libs/figure" id="dry-run-edge-internal_2fdry-libs_2ffigure" d="M 464 376 L 464 340 Q 464 332 472 332 L 608 332" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><path data-edge="internal/playground->internal/dry" id="dry-run-edge-internal_2fplayground-internal_2fdry" d="M 248 252 L 284 252 Q 292 252 292 260 L 292 380 Q 292 388 300 388 L 320 388" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><path data-edge="internal/doctor->internal/dry" id="dry-run-edge-internal_2fdoctor-internal_2fdry" d="M 248 412 L 320 412" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><path data-edge="internal/doctor->internal/spell" id="dry-run-edge-internal_2fdoctor-internal_2fspell" d="M 140 440 L 140 452 Q 140 460 148 460 L 564 460 Q 572 460 572 452 L 572 432 Q 572 424 580 424 L 608 424" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><path data-edge="cmd/magus-docs->internal/dry" id="dry-run-edge-cmd_2fmagus-docs-internal_2fdry" d="M 248 332 L 268 332 Q 276 332 276 340 L 276 392 Q 276 400 284 400 L 320 400" fill="none" stroke="#bfc0c0" stroke-width="1.2" marker-end="url(#dry-run-arrow-default)"/><g data-node="internal/dry" data-anchor="internal/dry"><rect x="320" y="376" width="216" height="72" rx="6" fill="#2d3142"/><rect x="320" y="376" width="216" height="72" rx="6" fill="#403a44" stroke="#f08a59" stroke-width="1.2"/><text x="428" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Dry run</text><text x="428" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">stubbed host effects</text></g><g data-node="internal/spell" data-anchor="internal/spell"><rect x="608" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="384" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Spell registry</text><text x="716" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">ops as declared</text></g><g data-node="internal/ward" data-anchor="internal/ward"><rect x="608" y="64" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="64" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="92" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Ward</text><text x="716" y="108" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">kind checks still apply</text></g><g data-node="internal/interp/bindings/gen" data-anchor="internal/interp/bindings/gen"><rect x="608" y="144" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="144" width="216" height="56" rx="6" fill="#2d3142" stroke="#505466" stroke-width="1.2"/><text x="716" y="172" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host mirrors</text><text x="716" y="188" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">types the stubs</text></g><g data-node="internal/interp/bindings/ffi" data-anchor="internal/interp/bindings/ffi"><rect x="608" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Host calls</text><text x="716" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">what a stub replaces</text></g><g data-node="libs/figure" data-anchor="libs/figure"><rect x="608" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="608" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="716" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Figures</text><text x="716" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">the recorded graph drawn</text></g><g data-node="internal/playground" data-anchor="internal/playground"><rect x="32" y="224" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="224" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="252" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Playground</text><text x="140" y="268" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">a script in a browser</text></g><g data-node="internal/doctor" data-anchor="internal/doctor"><rect x="32" y="384" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="384" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="412" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Doctor</text><text x="140" y="428" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">checks a workspace</text></g><g data-node="cmd/magus-docs" data-anchor="cmd/magus-docs"><rect x="32" y="304" width="216" height="56" rx="6" fill="#2d3142"/><rect x="32" y="304" width="216" height="56" rx="6" fill="#393e53" stroke="#505466" stroke-width="1.2"/><text x="140" y="332" fill="#f5f5f5" font-family="sans-serif" font-size="12" font-weight="600" text-anchor="middle">Docs generator</text><text x="140" y="348" fill="#a9b1c2" font-family="monospace" font-size="9" style="font-variant-ligatures:none" text-anchor="middle">runs the examples</text></g><line x1="32" y1="496" x2="824" y2="496" stroke="#505466" stroke-width="0.8"/><text x="32" y="510" fill="#bfc0c0" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">LEGEND</text><rect x="32" y="516" width="10" height="10" rx="2" fill="#403a44" stroke="#f08a59" stroke-width="0.8"/><text x="50" y="525" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">THE DRY RUN</text><rect x="192" y="516" width="10" height="10" rx="2" fill="#2d3142" stroke="#505466" stroke-width="0.8"/><text x="210" y="525" fill="#a9b1c2" font-family="monospace" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.06em">GENERATED OUTPUT</text></g></svg>