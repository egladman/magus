<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1144 576" width="1144" height="576" role="img" aria-labelledby="buzz-engine-title buzz-engine-desc" class="magus-diagram"><metadata>{"figure":"buzz-engine","stamp":"sha256:ce4d018f2e0d984c5d8dcca7be38f73cf392346e1a1be6a4c471290d817b6314"}</metadata><title id="buzz-engine-title">One pipeline, and the modules each host registers</title><desc id="buzz-engine-desc">Every Buzz program magus touches goes through the same gopherbuzz pipeline: lex, parse, check, compile, run. Hosts differ only in the modules they register first. The host bindings attach to the magusfile engine at init and provide every magus host module, each through the trampoline generated from its descriptor. The browser playground runs the dry evaluator, which installs only the trampolines marked WASM, pure compute with no filesystem, process or network access, and records host calls instead of running them. Both also install the Buzz stdlib.</desc><style>.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#f5f5f5);--magus-figure-fill:var(--magus-diagram-fill,#ffffff);--magus-figure-ink:var(--magus-diagram-ink,#2d3142);--magus-figure-muted:var(--magus-diagram-muted,#4f5d75);--magus-figure-soft:var(--magus-diagram-soft,#5f6780);--magus-figure-rule:var(--magus-diagram-rule,#e6e6e8);--magus-figure-accent:var(--magus-diagram-accent,#eb6c36);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#f4eae6);--magus-figure-link:var(--magus-diagram-link,#2e5aa8)}@media (prefers-color-scheme: dark){.magus-diagram{--magus-figure-paper:var(--magus-diagram-paper,#2d3142);--magus-figure-fill:var(--magus-diagram-fill,#393e53);--magus-figure-ink:var(--magus-diagram-ink,#f5f5f5);--magus-figure-muted:var(--magus-diagram-muted,#bfc0c0);--magus-figure-soft:var(--magus-diagram-soft,#a9b1c2);--magus-figure-rule:var(--magus-diagram-rule,#505466);--magus-figure-accent:var(--magus-diagram-accent,#f08a59);--magus-figure-accent-tint:var(--magus-diagram-accent-tint,#403a44);--magus-figure-link:var(--magus-diagram-link,#6a95d8)}}.magus-diagram .magus-fill-paper{fill:var(--magus-figure-paper)}.magus-diagram .magus-stroke-paper{stroke:var(--magus-figure-paper)}.magus-diagram .magus-fill-fill{fill:var(--magus-figure-fill)}.magus-diagram .magus-stroke-fill{stroke:var(--magus-figure-fill)}.magus-diagram .magus-fill-ink{fill:var(--magus-figure-ink)}.magus-diagram .magus-stroke-ink{stroke:var(--magus-figure-ink)}.magus-diagram .magus-fill-muted{fill:var(--magus-figure-muted)}.magus-diagram .magus-stroke-muted{stroke:var(--magus-figure-muted)}.magus-diagram .magus-fill-soft{fill:var(--magus-figure-soft)}.magus-diagram .magus-stroke-soft{stroke:var(--magus-figure-soft)}.magus-diagram .magus-fill-rule{fill:var(--magus-figure-rule)}.magus-diagram .magus-stroke-rule{stroke:var(--magus-figure-rule)}.magus-diagram .magus-fill-accent{fill:var(--magus-figure-accent)}.magus-diagram .magus-stroke-accent{stroke:var(--magus-figure-accent)}.magus-diagram .magus-fill-accent-tint{fill:var(--magus-figure-accent-tint)}.magus-diagram .magus-stroke-accent-tint{stroke:var(--magus-figure-accent-tint)}.magus-diagram .magus-fill-link{fill:var(--magus-figure-link)}.magus-diagram .magus-stroke-link{stroke:var(--magus-figure-link)}.magus-diagram .magus-sans{font-family:var(--pico-font-family,sans-serif)}.magus-diagram .magus-mono{font-family:var(--pico-font-family-monospace,monospace)}</style><defs><marker id="buzz-engine-arrow-default" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75" class="magus-fill-muted"/></marker><marker id="buzz-engine-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36" class="magus-fill-accent"/></marker><marker id="buzz-engine-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8" class="magus-fill-link"/></marker></defs><rect width="100%" height="100%" fill="#f5f5f5" class="magus-fill-paper"/><text x="32" y="32" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" letter-spacing="0.18em">BUZZ</text><text x="32" y="60" fill="#2d3142" font-family="sans-serif" class="magus-fill-ink magus-sans" font-size="20" font-weight="600">One pipeline, and the modules each host registers</text><g transform="translate(0,40)"><path data-edge="internal/interp/bindings->internal/interp" id="buzz-engine-edge-internal_2finterp_2fbindings-internal_2finterp" d="M 248 96 L 320 96" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings->internal/interp/bindings/gen" id="buzz-engine-edge-internal_2finterp_2fbindings-internal_2finterp_2fbindings_2fgen" d="M 140 128 L 140 132 Q 140 140 148 140 L 572 140 Q 580 140 580 148 L 580 164 Q 580 172 588 172 L 608 172" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings/opencode->group:gopherbuzz" id="buzz-engine-edge-internal_2finterp_2fbindings_2fopencode-group_3agopherbuzz" d="M 248 408 L 556 408 Q 564 408 564 400 L 564 292 Q 564 284 572 284 L 608 284" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings/opencode/wasm->internal/interp/bindings/opencode" id="buzz-engine-edge-internal_2finterp_2fbindings_2fopencode_2fwasm-internal_2finterp_2fbindings_2fopencode" d="M 140 304 L 140 376" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp->group:gopherbuzz" id="buzz-engine-edge-internal_2finterp-group_3agopherbuzz" d="M 536 96 L 556 96 Q 564 96 564 104 L 564 132 A 8 8 0 0 0 564 148 L 564 176 A 8 8 0 0 0 564 192 L 564 252 Q 564 260 572 260 L 608 260" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/interp/bindings/gen->std" id="buzz-engine-edge-internal_2finterp_2fbindings_2fgen-std" d="M 824 184 L 896 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="external:Browser playground->internal/dry" id="buzz-engine-edge-external_3aBrowser_20playground-internal_2fdry" d="M 248 184 L 320 184" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/dry->group:gopherbuzz" id="buzz-engine-edge-internal_2fdry-group_3agopherbuzz" d="M 428 216 L 428 264 Q 428 272 436 272 L 608 272" fill="none" stroke="#4f5d75" class="magus-stroke-muted" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-default)"/><path data-edge="internal/dry->internal/interp/bindings/gen" id="buzz-engine-edge-internal_2fdry-internal_2finterp_2fbindings_2fgen" d="M 536 184 L 608 184" fill="none" stroke="#eb6c36" class="magus-stroke-accent" stroke-width="1.2" marker-end="url(#buzz-engine-arrow-accent)"/><rect x="264" y="74" width="40" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="284" y="83" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">INIT()</text><rect x="268" y="162" width="32" height="12" rx="2" fill="#f5f5f5" class="magus-fill-paper"/><text x="284" y="171" fill="#5f6780" font-family="monospace" class="magus-fill-soft magus-mono" font-size="8" style="font-variant-ligatures:none" text-anchor="middle" letter-spacing="0.06em">RUNS</text><g data-node="internal/interp/bindings" data-anchor="internal/interp/bindings"><rect x="32" y="64" width="216" height="64" rx="6" fill="#f5f