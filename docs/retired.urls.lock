# MGS2009 retired with the network-egress audit log. The hook observed only the
# http.* Buzz binding - not magus's own traffic, not any subprocess - so the code
# documented a coverage that never existed. No successor page: there is no network
# sandbox to describe.
reference/codes/sandbox/MGS2009/

# `magus tail` was removed in v0.4.0. It streamed the most recent cached log for a
# project, which `magus query output <ref>` already does from the run's own output
# reference - the narrower command earned its own subcommand, flag surface, and man
# page for a view you could already get. No successor page: the capability did not
# move, it was folded into an existing verb.
reference/manpage/magus-tail/

# Renamed to testsprawl before its first tag. "Orphan" means "no owner" everywhere else
# here (locks, graph nodes, blobs) and this rule reports the opposite: a test file that
# HAS an owner and narrows its name. Now at development/libs-testlayout/. Not aliased -
# the module was never published and the page was a day old.
development/libs-orphanator/

# The encoding module split into encoding/base64, encoding/hex, encoding/json,
# encoding/url, encoding/xml and encoding/yaml, so the single combined page and its
# generated Buzz reference no longer exist. Not aliased: there is no one successor
# page to send a reader to, and each codec now has its own.
modules/encoding/
reference/buzz/encoding/

# A tag earns a page only when more than one page carries it (tags.buzz's count > 1).
# These two lost their second declaring page twice over: the platform notes were folded
# into setup, and docs/download.md became the hand-built site/download.buzz, whose tags
# live in its search record rather than the tag index. Each fell to a single page
# (setup/macos/ and setup/windows/ respectively) and stopped generating. Retired rather
# than aliased: a tag page listing one link is worse than the guide it would have pointed
# at, and that guide is what search already returns.
tags/macos/
tags/windows/
tags/analysis/
tags/hotspots/
tags/symbols/
tags/volatility/

# Each skill page tags itself with its own name, so renaming a skill retires its
