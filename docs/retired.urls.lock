# `magus ledger` became `magus job`: a JOB is the unit of delegated work and a LEASE
# is the grant a holder takes on one, so the verb that read the store was renamed with
# the noun. A manpage page is generated per command and has no source file to carry a
# redirect, so this retires rather than aliases, the same way the folded magus-sessions
# pages above did; the successor carries every verb at reference/manpage/magus-job/.
reference/manpage/magus-ledger/

# The two tag pages naming the retired verb go with it. `leases` follows the count > 1
# rule above instead: the tag is now carried by one page (guides/integrations/agents/leases/),
# so it stays reachable as a search chip there and generates no index of its own.
tags/leases/
tags/ledger/
tags/magus-ledger/

# The buzz spell's ops (buzz-check, buzz-test, magus-buzz) had no caller left once
# the lua/teal interpreter they were written against was deleted, so they are gone
# and the spell no longer registers. Not aliased: the root magusfile and
# libs/diagram now declare "**/*.buzz"/"*.buzz" as a plain source instead of
# through a spell, so there is no successor spell page to send a reader to.
concepts/spells/buzz/
reference/codes/sandbox/MGS3015/
# The pinning tag is down to one page, reference/remote-spells.md; a one-page tag gets no
# index, as with the tags above.
tags/pinning/

# MAGUS_NO_WAIT was removed when a held lock or budget began refusing at once; its tag
# index went with the pages that documented it.
tags/magus-no-wait/

# The ci-watch rule left the shipped guard: how a repository waits on CI is its own
