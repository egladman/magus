# The root project's analyzer policy, typed by a person. Each project root
# holds its own analyzers.yaml, and an analyzer reads only the file of the
# project that owns the path it judges: a nested project never falls back to
# this one, and a project with none gets the strict defaults. Paths are
# relative to the project root.
#
# One top-level key per analyzer, plus zones:
#   settings  the analyzer's knobs
#   baseline  today's violations; it may only shrink, and a stale entry fails
#   exits     a permanent exception; each one carries a reason
# An agent's job never lists this file in its write paths, so the guard denies
# an agent's edit to it.

accessorclone:
  settings:
    hint: "do not add a baseline entry or a //nolint: only a person types one into analyzers.yaml"
  # file: [Recv.Name or Name]
  baseline: {}
  # - {path, symbol, reason}
  exits: []

exhaustive-switch:
  # Functions that may still hold a switch over a closed set that misses a member or keeps a default
  # arm. A count may only shrink; a function holding fewer switches than its row fails.
  baseline:
    - {path: internal/guard/adoption.go, symbol: classifyCommandLine}
    - {path: internal/guard/apply_patch.go, symbol: judgePatchRest}
    - {path: internal/guard/copy_write.go, symbol: judgeCopyWrites}
    - {path: internal/guard/cost.go, symbol: callerContext}
    - {path: internal/guard/credential.go, symbol: denyTokenStateCommand}
    - {path: internal/guard/deviation.go, symbol: denyDeviationCommand}
    - {path: internal/guard/dialect.go, symbol: ParseDialect}
    - {path: internal/guard/dialect.go, symbol: variant}
    - {path: internal/guard/guard.go, symbol: Judge, count: 2}
    - {path: internal/guard/heredoc.go, symbol: judgeHeredocWrites}
    - {path: internal/guard/hook_checkout.go, symbol: judgedBy}
    - {path: internal/guard/hook_verdict.go, symbol: writeVerdict}
    - {path: internal/guard/lease.go, symbol: workerVCSDenial}
    - {path: internal/guard/load_restore.go, symbol: loadRestore}
    - {path: internal/guard/policy.go, symbol: recordedRule}
    - {path: internal/guard/push.go, symbol: gateCoverageAt}
    - {path: internal/guard/push.go, symbol: readGateOutcome}
    - {path: internal/guard/push.go, symbol: readUngated, count: 2}
    - {path: internal/guard/push_coverage.go, symbol: admits}
    - {path: internal/guard/root.go, symbol: budgetFigures}
    - {path: internal/guard/root.go, symbol: resultFigures}
    - {path: internal/guard/script.go, symbol: judgeScript}
    - {path: internal/guard/search.go, symbol: judgeSearch}
    - {path: internal/guard/search.go, symbol: placeSearch}
    - {path: internal/guard/search.go, symbol: searchVerdictAt}
    - {path: internal/guard/search_pattern.go, symbol: splitAlternation}
    - {path: internal/guard/stall.go, symbol: observeStall}
    - {path: internal/guard/step.go, symbol: stepDecisionRank}
    - {path: internal/guard/step.go, symbol: stepRuleJudgment}
    - {path: internal/guard/write.go, symbol: sayUnchecked}
  # Switches a person accepted, each with the reason it stays.
  exits: []

clikitmain:
  settings:
    hint: "declare the command as a libs/clikit command.Command, each flag storing into its Target, and run it with command.Main"
  # file: count of hand-parsed reads (a flag defined or parsed through package flag, or os.Args)
  baseline:
    # magus parses through its generated binders (cmd/magus/gen) but still binds
    # some flags, its FlagSets and its early os.Args peeks by hand; moving it onto
    # command.Execute is its own change.
    cmd/magus/affected.go: 1
    cmd/magus/agent.go: 3
    cmd/magus/attention.go: 1
    cmd/magus/broker.go: 3
    cmd/magus/checkpoint.go: 1
    cmd/magus/detach.go: 1
    cmd/magus/diff.go: 1
    cmd/magus/doctor.go: 2
    cmd/magus/drift.go: 3
    cmd/magus/globals.go: 12
    cmd/magus/helpers.go: 1
    cmd/magus/init.go: 2
    cmd/magus/job.go: 13
    cmd/magus/job_grant.go: 4
    cmd/magus/main.go: 20
    cmd/magus/notes.go: 11
    cmd/magus/notify.go: 1
    cmd/magus/query.go: 1
    cmd/magus/refs.go: 2
    cmd/magus/run.go: 2
    cmd/magus/server.go: 1
    cmd/magus/session.go: 5
    cmd/magus/shell.go: 1
    cmd/magus/spell.go: 8
    cmd/magus/vcs.go: 2
    cmd/magus/watch.go: 1
    cmd/magus/where.go: 6
    cmd/magus/x.go: 1
  # - {path, reason}
  exits: []

no-throw:
  exits:
    - path: spells/harness/opencode/plugins/magus.js
      scope: MagusGuard
      reason: a throw from the plugin entry is OpenCode's only way to refuse to load the guard
  # construct: {file: count}
  baseline:
    throw: {}
    buzz-error-signature:
      hack/dev/bootstrap-checkout.buzz: 2
      magusfiles/quality/advisories.buzz: 3
      hack/dev/modules/bootstrap-timing.buzz: 2
      magusfiles/release/changelog.buzz: 3
      magusfiles/quality/drift.buzz: 1
      magusfiles/build/index.buzz: 1
      magusfiles/release/releases.buzz: 10
      magusfiles/quality/ruledocs.buzz: 2
      magusfiles/quality/run-golangci.buzz: 2
      hack/policy/guard.buzz: 2
      hack/policy/stale.buzz: 1
      spells/golang/golangci.buzz: 2

# An engineered zone: a path in this project whose complexity a measurement
# licenses. reason is spec, performance or security; evidence names the files
# that license it; budgets are the anchors the zone holds in place of the
# strict ones, stated below today's outliers. An item already past its anchor
# may not grow, in a zone or out of one. A path with no zone gets the strict
# budgets. No rule reads zones yet: the size and growth rules will.
zones:
  - path: internal/guard/**
    reason: security
    # Built by the guard-security-zone job; until those files exist the claim is
    # unproven and the strict budgets apply.
    evidence:
      - docs/design/guard-threat-model.md
      - internal/guard/*_fuzz_test.go
      - internal/guard/testdata/bypass/
    # The anchors this zone holds in place of the strict 167 and 1500, set below
    # today's outliers (Judge at 957 lines, lease.go at 4407) so neither becomes
    # legal: a function or file already past its anchor still may not grow.
    # Assumed values, for Eli to set.
    budgets:
      func-lines: 250
      file-lines: 2500

