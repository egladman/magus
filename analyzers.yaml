# The root project's analyzer policy, typed by a person. Each project root
# holds its own analyzers.yaml, and an analyzer reads only the file of the
# project that owns the path it judges: a nested project never falls back to
# this one, and a project with none gets the strict defaults. Paths are
# relative to the project root.
#
# One top-level key per analyzer, plus zones:
#   settings  the analyzer's knobs
#   baseline  today's violations; it may only shrink, and a stale entry fails
#   exits     a permanent exception; each one carries a reason
# An agent's job never lists this file in its write paths, so the guard denies
# an agent's edit to it.

accessorclone:
  settings:
    hint: "do not add a baseline entry or a //nolint: only a person types one into analyzers.yaml"
  # file: [Recv.Name or Name]
  baseline: {}
  # - {path, symbol, reason}
  exits: []

exhaustive-switch:
  # Functions that may still hold a switch over a closed set that misses a member or keeps a default
  # arm. A count may only shrink; a function holding fewer switches than its row fails.
  baseline:
    - {path: internal/guard/adoption.go, symbol: classifyCommandLine}
    - {path: internal/guard/apply_patch.go, symbol: judgePatchRest}
    - {path: internal/guard/copy_write.go, symbol: judgeCopyWrites}
    - {path: internal/guard/cost.go, symbol: callerContext}
    - {path: internal/guard/credential.go, symbol: denyTokenStateCommand}
    - {path: internal/guard/deviation.go, symbol: denyDeviationCommand}
    - {path: internal/guard/dialect.go, symbol: ParseDialect}
    - {path: internal/guard/dialect.go, symbol: variant}
    - {path: internal/guard/guard.go, symbol: Judge, count: 2}
    - {path: internal/guard/heredoc.go, symbol: judgeHeredocWrites}
    - {path: internal/guard/hook_checkout.go, symbol: judgedBy}
    - {path: internal/guard/hook_verdict.go, symbol: writeVerdict}
    - {path: internal/guard/lease.go, symbol: workerVCSDenial}
    - {path: internal/guard/load_restore.go, symbol: loadRestore}
    - {path: internal/guard/policy.go, symbol: recordedRule}
    - {path: internal/guard/push.go, symbol: gateCoverageAt}
    - {path: internal/guard/push.go, symbol: readGateOutcome}
    - {path: internal/guard/push.go, symbol: readUngated, count: 2}
    - {path: internal/guard/push_coverage.go, symbol: admits}
    - {path: internal/guard/root.go, symbol: budgetFigures}
    - {path: internal/guard/root.go, symbol: resultFigures}
    - {path: internal/guard/script.go, symbol: judgeScript}
    - {path: internal/guard/search.go, symbol: judgeSearch}
    - {path: internal/guard/search.go, symbol: placeSearch}
    - {path: internal/guard/search.go, symbol: searchVerdictAt}
    - {path: internal/guard/search_pattern.go, symbol: splitAlternation}
    - {path: internal/guard/shell.go, symbol: GradeEdit}
    - {path: internal/guard/shell.go, symbol: fileOperands}
    - {path: internal/guard/shell.go, symbol: filterWithoutInputDeny}
    - {path: internal/guard/stall.go, symbol: observeStall}
    - {path: internal/guard/step.go, symbol: stepDecisionRank}
    - {path: internal/guard/step.go, symbol: stepRuleJudgment}
    - {path: internal/guard/workspace_shell.go, symbol: matchWorkspaceShell}
    - {path: internal/guard/write.go, symbol: sayUnchecked}
  # Switches a person accepted, each with the reason it stays.
  exits: []

clikitmain:
