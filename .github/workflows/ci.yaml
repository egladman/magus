name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2
  # PRs may read the cache but cannot publish to it.
  MAGUS_CACHE_IMMUTABLE: ${{ github.event_name == 'pull_request' }}
  MAGUS_CACHE_REMOTE_INSECURE: 'true'
  MAGUS_CACHE_REMOTE_TRUSTED_KEYS: ${{ vars.MAGUS_CACHE_PUBLIC_KEY }}
  MAGUS_CI_MAX_SHARDS: '2'

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix:        ${{ steps.plan.outputs.matrix }}
      count:         ${{ steps.plan.outputs.count }}
      max_parallel:  ${{ steps.plan.outputs.max_parallel }}
    steps:
      - name: Set history path
        run: echo "MAGUS_HISTORY_PATH=$RUNNER_TEMP/magus-history.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Commit graph in full, history's file contents left on the server: affected
          # needs a merge base, never an old blob. See docs/guides/integrations/ci.md.
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'
          install: false

      - name: Install pinned toolchain
        run: mise install

      # Builds the magus this very commit defines, from the checkout above, so a
      # change that magusfile.buzz needs is exercised by the run that introduces
      # it. NOT git-ref: ${{ github.sha }} - on a pull_request that expands to the
      # ephemeral refs/pull/N/merge commit, which is a descendant of main and so
      # is rejected by the action's reachable-from-main gate every single time.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus builds its bootstrap binary with actions/setup-go, which reads go.mod's
      # `go` directive and PREPENDS that toolchain to PATH. It outranks mise's pinned Go for
      # every later step, so without this the workspace is built, tested, and linted on a
      # different Go than mise.toml pins. GITHUB_PATH prepends, so re-adding mise's wins.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - name: Doctor
        run: magus doctor

      - name: Restore magus run history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MAGUS_HISTORY_PATH }}
          key: ${{ github.workflow }}-magus-history-v1-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-magus-history-v1-

      - id: plan
        name: Compute shard matrix
        run: magus affected ci --plan | magus run ci-shard:gha --no-default-charms

  ci:
    name: shard ${{ matrix.shard }}
    needs: preflight
    if: fromJSON(needs.preflight.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MAGUS_CACHE_SIGNING_KEY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.MAGUS_CACHE_SIGNING_KEY || '' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.preflight.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - name: Set history path
        run: echo "MAGUS_HISTORY_PATH=$RUNNER_TEMP/magus-history.json" >> "$GITHUB_ENV"

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Commit graph in full, history's file contents left on the server: affected
          # needs a merge base, never an old blob. See docs/guides/integrations/ci.md.
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'
          install: false

      - name: Install pinned toolchain
        run: mise install

      # Builds the magus this very commit defines, from the checkout above, so a
      # change that magusfile.buzz needs is exercised by the run that introduces
      # it. NOT git-ref: ${{ github.sha }} - on a pull_request that expands to the
      # ephemeral refs/pull/N/merge commit, which is a descendant of main and so
      # is rejected by the action's reachable-from-main gate every single time.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # See the preflight job: setup-magus's bootstrap toolchain outranks mise's on PATH.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - uses: crazy-max/ghaction-github-runtime@b3a9207c0e1ef41f4cf215303c976869d0c2c1c4 # v3.0.0

      - name: Install native build dependencies (webkit, codec)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev liblzma-dev libzstd-dev

      - name: Annotate affected projects
        continue-on-error: true
        run: |
          for p in ${{ matrix.projects }}; do
            magus describe -o 'template=::notice title=affected::{{.Project}} (base: {{.Base}})' "$p"
          done

      - name: Restore magus run history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MAGUS_HISTORY_PATH }}
          key: ${{ github.workflow }}-magus-history-v1-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-magus-history-v1-

      - name: Run CI for shard
        uses: ./.github/actions/magus
        with:
          command:  run ci --no-default-charms ${{ matrix.projects }}
          shard:    ${{ matrix.shard }}
          n-shards: ${{ needs.preflight.outputs.count }}

      - name: Upload shard history
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: magus-history-${{ matrix.shard }}
          path: ${{ env.MAGUS_HISTORY_PATH }}
          if-no-files-found: ignore
          retention-days: 7

  completions:
    name: shell completions
    needs: [preflight]
    # Not folded into the ci target: it needs a docker daemon, and a gate that
    # silently skips when one is missing is how a broken completion recipe ships.
    # Path-gated because the pwsh image is ~1GB - pulling it for a change that
    # cannot affect a completion script buys nothing.
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # The path gate below diffs against the base commit, which a shallow
          # checkout would not have; without this it always fails open and gates nothing.
          # --name-only compares tree entries, so the blobs it skips are never missed.
          fetch-depth: 0
          filter: blob:none
      - name: Did the shipped shell change?
        id: changed
        run: |
          set -euo pipefail
          base='${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}'
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo 'run=true' >> "$GITHUB_OUTPUT"   # no usable base: do not silently skip
            exit 0
          fi
          if git diff --name-only "$base" HEAD |
              grep -qE '^(cmd/magus/completions/|hack/completion-checks/)'; then
            echo 'run=true' >> "$GITHUB_OUTPUT"
          else
            echo 'run=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-magus
        if: steps.changed.outputs.run == 'true'
        with:
          installation-strategy: source
          source-path: .

      - name: Exercise each completion script in its shell's official image
        if: steps.changed.outputs.run == 'true'
        run: magus run completion-test .

  deploy-build:
    name: deploy build
    needs: [preflight]
    # Separate from `magus affected ci` on purpose: affected ci shards per-project
    # correctness, and the deploy is a workspace-level composition no single project owns.
    #
    # It exists because the publish workflow runs only on main, so without this the first
    # run of the deploy build for a change was after that change merged - "the merge is the
    # first time a step runs" (docs/concepts/targets/ci.md).
    #
    # Unfiltered by path for the same reason the publish workflow is: the input set spans
    # the docs and console trees, root Markdown, assets, releases, embedded skills, and the
    # Go packages the content generators read. A stale filter would skip the smoke test
    # silently, which is the hole this closes.
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      # Matches the publish workflow: page footers read `git log`, so a shallow clone would
      # exercise a different render than the one that ships.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'
          install: false

      - name: Install pinned toolchain
        run: mise install

      # A source build, matching publish-site.yaml. This mirrored the publish workflow on
      # the released binary so a source build could not test a magus the deploy never
      # runs - but that pairing breaks for the whole window between a breaking magusfile
      # change and the release carrying it. The built-in spells were renamed (md ->
      # markdown, ...) and the magusfile updated to match, so the newest release cannot
      # load this workspace at all. publish-site.yaml made the same move; the two stay
      # matched, just on source rather than on the release.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks the mise-pinned Go. Re-adding mise's puts it back in
      # front. Same step the preflight and ci jobs already carry.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # deploy-generate throws when either tree lacks its index.html, so it is the
      # assertion. Nothing is uploaded: this proves the build, it does not publish.
      - name: Render the docs site
        run: magus run generate docs

      - name: Build the console app
        run: magus run build console

      - name: Assemble the deploy tree
        run: magus run deploy-generate .

  image-snapshot:
    name: publish snapshot container image
    needs: [preflight, ci]
    # Merges to main only, and only once `ci` has actually passed - not `always()`.
    # A pull request must never reach this job: a fork PR would otherwise push an
    # image and mint a Sigstore signature off unreviewed code, and a snapshot of a
    # commit that never landed is not something anyone can go back and `docker run`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless (OIDC) signing
    steps:
      # Full history + tags: the image bakes version()/commit()/build_date() in via
      # ldflags, and git describe has to be able to reach the nearest tag.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'
          install: false

      - name: Install pinned toolchain
        run: mise install # cosign, for the signing step inside image-build

      # Built from source, NOT the pinned release: the image-* targets below call
      # magus\secret.read, which no published release has yet. On a release binary that
      # namespace is missing, resolvable()'s try/catch swallows the failure, and the job
      # reports "no usable credentials" while the tokens are sitting right there in env.
      # Move this back to git-ref once a release carries the secret provider.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same magusfile-driven login as cd.yaml, under the snapshot charm instead - which
      # lists GHCR alone, so no Docker Hub secret is needed or read here.
      - name: Verify registry credentials
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: magus run image-registries:snapshot,verify --no-default-charms

      - name: Log in to image registries
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: magus run image-login:snapshot --no-default-charms

      # Static variant only, tagged with the short commit. A snapshot reproduces one
      # commit, so it gets neither the CGO variant nor a moving tag, and it is signed
      # under THIS workflow's certificate identity - ci.yaml, not cd.yaml - which is
      # what makes the release verify command in
      # docs/guides/download/container-image.md reject a snapshot.
      - name: Build, push, and sign the snapshot image
        run: magus run image-build:snapshot --no-default-charms

      # No summary step here on purpose: image-build writes $GITHUB_STEP_SUMMARY itself,
      # from the references it actually pushed. A step that re-derived them would be
      # parsing magus's own output back out of a file magus wrote.

  merge-history:
    name: merge run history
    needs: [preflight, ci]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - uses: ./.github/actions/magus
        with:
          merge-history: 'true'

  postflight:
    name: insight report
    needs: [preflight, ci]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          # Commit graph in full, history's file contents left on the server: affected
          # needs a merge base, never an old blob. See docs/guides/integrations/ci.md.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .
      - name: Summarize CI outcome
        env:
          CI_RESULT: ${{ needs.ci.result }}
          SHARD_COUNT: ${{ needs.preflight.outputs.count }}
        run: |
          {
            echo '## CI outcome'
            case "$CI_RESULT" in
              success)
                echo "Passed across ${SHARD_COUNT} affected shard(s)."
                ;;
              skipped)
                echo 'No affected projects required a CI shard.'
                ;;
              failure|cancelled)
                echo "**${CI_RESULT}:** open the failed shard job above, then fetch its Magus output reference before retrying."
                echo
                echo 'Local triage: `magus affected ci` · [Affected CI guide](https://eli.gladman.cc/magus/guides/affected/) · [CI target guide](https://eli.gladman.cc/magus/concepts/targets/ci/)'
                ;;
              *)
                echo "CI reported an unexpected result: \`$CI_RESULT\`. Open the workflow jobs above for the failing step."
                ;;
            esac
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Insight report to step summary
        run: |
          {
            echo "## Insight report"
            magus insight report --workspace -o markdown
          } >> "$GITHUB_STEP_SUMMARY"
