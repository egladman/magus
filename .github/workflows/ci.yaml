name: CI

# Validates a change. Nothing here ships or pushes: its artifacts are the magus the plan
# builds for the jobs after it, and a red shard's logs. The top-level default
# is contents: read; the advisor holds pull-requests: write for its comment.
#
# Cache rule: a job holding a secret, a write token or id-token restores no UNVERIFIED
# cache. main's cache scope is writable by any main-scoped run, the merge queue's
# validation included, and that runs pull-request code. What such a job does restore is
# signed by main's key and checked against the trust set before a byte of it is used.
#
# Four workflows, one trigger each, and the name says which: ci.yaml validates (pull
# request), cd.yaml ships what a merge produces (main push), release.yaml cuts a release
# (v* tag), audit.yaml runs the expensive out-of-band checks (cron).
#
# ci also runs on main pushes, and that is not a publish step: the push run is what
# populates the shared cache and the run-duration history a pull request may only read.
# See MAGUS_CACHE_REMOTE_WRITE_ENABLED below.
#
# workflow_dispatch lets a person rerun main's checks by hand; the merge queue's merges
# push main like any other. Every check below that means "a main run" is therefore
# `!= 'pull_request'`, not `== 'push'`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# On a PR the newest push supersedes the ones before it, so cancelling is right: the only
# verdict anyone acts on is the one for the head commit.
#
# On main every commit must get its own verdict, and the GROUP is what buys that.
# cancel-in-progress: false is not enough: it protects the running run, while GitHub queues
# at most one run per group, so a third merge cancels the second while it is still pending.
# Measured 2026-09-07: 7 of the last 25 main runs cancelled against 15 succeeded.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2
  # PRs read both cache tiers and write only the local tier, which the shard job carries
  # to the PR's next push. Declared false rather than left to the missing signing key.
  #
  # main leaves it unset rather than declaring true: declared true makes a remote-tier
  # write REQUIRED, so an Actions cache hiccup would fail main. Unset, main writes the
  # remote tier because it holds the signing key, degrades to the local tier when the
  # remote tier fails, and backfills the remote tier from local-tier hits whose key the
  # remote tier lacks, so an entry a failed upload missed is stored by the next main run.
  MAGUS_CACHE_REMOTE_WRITE_ENABLED: ${{ github.event_name == 'pull_request' && 'false' || '' }}
  # The trust set is what wires the shared cache (see the `if` at magusfile.buzz's
  # cache.remote block) AND what verifies it. MAGUS_CACHE_REMOTE_INSECURE used to be
  # set here too, which was the whole configuration doing two wrong things at once:
  # it was the only thing turning the cache ON, and remoteCacheSigningOpts returns
  # WithInsecureRemote before it ever reads a trust set - so the trusted_keys in
  # magus.yaml were never consulted and CI replayed unsigned artifacts.
  #
  # Unset this variable and the cache is simply not wired: no error, no remote hits.
  # Setting it is what turns on both the cache and its verification, together.
  MAGUS_CACHE_REMOTE_TRUSTED_KEYS: ${{ vars.MAGUS_CACHE_PUBLIC_KEY }}
  # -1 is unlimited, bounded by the affected project count. Nothing here picks a number:
  # `magus affected ci --plan` warns when fewer shards would finish just as fast and names
  # the count to cap at, so that decision gets made against a measurement instead of in
  # this file. Unset would mean 8, which is a number nobody measured either.
  #
  # Capping is also what creates memory risk, because co-location is what puts two peaks on
  # one runner. It lives here rather than in magus.yaml because it sizes a runner pool, and
  # a local plan spawns no runners.
  MAGUS_CI_MAX_SHARDS: '-1'
  # Stream every target's output live instead of withholding it until something
  # fails. magus collapses on success by default, which is right on a terminal you
  # are sitting at and wrong in a log nobody reads until it goes red: a green run
  # printed nothing at all, and a failing one opened with "221 log line(s)
  # omitted". Neither leaves a record of what the run was DOING when a shard was
  # killed mid-target - which is the case that sent us looking.
  #
  # Set here rather than defaulted inside magus on GITHUB_ACTIONS, so the choice is
  # visible in the file a reader is already looking at, and magus behaves the same
  # everywhere. -s/--silent still overrides it.
  #
  # The cost is real: output from concurrently running projects interleaves, so
  # read a shard log by target rather than top to bottom.
  MAGUS_LOG_STREAM: '1'
  # Wires the github-actions CI provider in magusfile.buzz: job-log groups, annotations,
  # and the last green run `affected ci --plan` inherits a verdict from. Same reason as
  # the line above: magus is told it runs under Actions, never detects it.
  CI_PROVIDER: github-actions

jobs:
  plan:
    name: magus plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The runs API behind last_green_run. Read-only: it looks up run history.
      actions: read
    outputs:
      matrix:        ${{ steps.plan.outputs.matrix }}
      count:         ${{ steps.plan.outputs.count }}
      max_parallel:  ${{ steps.plan.outputs.max_parallel }}
      # 'true' when the plan inherited the verdict of this branch's last green run
      # because every path changed since it classifies low-risk. magus decides that
      # and publishes the report; the two `if:` guards below only consume the answer.
      inherit:       ${{ steps.plan.outputs.inherit }}
      # Doctor's verdict, carried to the gate rather than failing this job. See the step.
      doctor:        ${{ steps.doctor.outcome }}
      # The magus every later job runs, and the digest each verifies it against. A job
      # output, never a file in the artifact: the artifact is what is being checked.
      magus_artifact: ${{ steps.magus.outputs.artifact }}
      magus_sha256:   ${{ steps.magus.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # Builds the magus this very commit defines, from the checkout above, so a
      # change that magusfile.buzz needs is exercised by the run that introduces
      # it. NOT git-ref: ${{ github.sha }} - on a pull_request that expands to the
      # ephemeral refs/pull/N/merge commit, which is a descendant of main and so
      # is rejected by the action's reachable-from-main gate every single time.
      #
      # Built once per run and published for every later job, which verifies it. First,
      # ahead of mise-action: the binary reaches the shards, which hold the cache signing
      # key on main, and the advisor, which holds pull-requests: write, so it is built
      # before this job restores any cache. The history restore inside the action runs
      # after the upload.
      #
      # The history is what last-passed reads on main. It is unsigned, so a main-scoped
      # run can plant one; the worst it buys is a main run that gates less. This job holds
      # no secret and no write token.
      - id: magus
        uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .
          publish-artifact: magus-${{ github.run_attempt }}
          restore-history: 'true'

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      #
      # No cache on main: this plan's matrix becomes the argv of the shard job that holds
      # the cache signing key, so a poisoned toolchain here reaches that key.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache: ${{ github.event_name == 'pull_request' }}

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH. Re-adding mise's puts the pinned toolchain in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # Reported to the gate instead of failing this job, which is not leniency: the run
      # still goes red, and it goes red with the shard results in hand.
      #
      # Doctor asks about workspace CONFIGURATION, and by this point the shard matrix is
      # already proof the workspace loads and the graph resolves. Those shards are what
      # says whether the code works, and a failed plan job skips every one of them. Four
      # runs in a row reported a guard-wiring problem and said nothing whatever about the
      # tests, and the work was merged with them still unrun. A check that costs you the
      # answer you came for is charging too much for the answer it gives.
      #
      # The hard failures below keep failing hard: uncommitted generated output and a
      # non-deterministic generator both mean the tree under test is not the tree in the
      # commit, and a shard result from it describes nothing.
      - name: Doctor
        id: doctor
        continue-on-error: true
        run: magus doctor

      # last-passed on a push, the configured default on a pull request.
      #
      # A push to main has no useful default base: magus's is origin/main, which on main
      # IS the commit being pushed, so the diff is empty. Every main push planned
      # `projects=0 shards=0`, the `count > 0` guard skipped every shard, and the run
      # gated nothing - which is also why no shard ever uploaded a history, `report`
      # logged "no shard histories; nothing to merge", and every pull request since
      # planned its shards with no duration data at all.
      #
      # last-passed reads the run log for the commit this branch last passed `ci` at, so
      # a run that was cancelled or failed leaves its commits in the NEXT run's diff
      # instead of being stepped over. A pull request needs none of it: origin/main
      # already IS its merge base, and an empty value falls through to that default.
      #
      # --preflight generate fails the run before a single shard starts: it runs every
      # planned project's generate first, and a drifted tree prints no plan, so nothing
      # fans out. ci strips rw, so generate compares against HEAD and fails on drift,
      # which is the gate. It covers the PLANNED projects, which is narrower than a bare
      # `magus run generate` fan-out: six projects declare index-generate output that is
      # a function of the WHOLE knowledge graph, and affected does not select them for
      # every change that feeds it (a docs markdown change selects {docs} alone). A step
      # narrowed that way once let three projects carry stale indexes from 6b4402e49
      # until 5e32e73fa.
      #
      # Before the replay step, which runs under rw and would rewrite a drifted file
      # before this gate could compare it.
      - id: plan
        name: Compute shard matrix
        env:
          MAGUS_VCS_BASE_REF: ${{ github.event_name != 'pull_request' && 'last-passed' || '' }}
          # Read by the github spell's last_green_run alone. Unset, it answers null
          # and the plan fans out as it always has.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Provider glue, and nothing else: the plan is computed once into a file, then
        # rendered from it twice, its outputs into $GITHUB_OUTPUT and its summary into
        # $GITHUB_STEP_SUMMARY. magus prints and this step redirects, so magus never learns
        # either file's name. `run --stdin --dry-run` runs nothing; it checks the saved
        # plan and renders it. `-e` stops at a failed plan, so nothing is published from a
        # partial file.
        shell: bash
        run: |
          magus affected ci --plan --preflight generate --no-default-charms --concurrency-profile aggressive > "$RUNNER_TEMP/plan.json"
          magus run --stdin --dry-run -o 'template={{range .outputs}}{{.name}}={{.value}}{{"\n"}}{{end}}' < "$RUNNER_TEMP/plan.json" >> "$GITHUB_OUTPUT"
          magus run --stdin --dry-run -o 'template={{.summary}}' < "$RUNNER_TEMP/plan.json" >> "$GITHUB_STEP_SUMMARY"

      # Determinism, in this job rather than its own: the saving is a runner and a from-source
      # magus build, not a generate pass.
      #
      # `--race=replay` rather than running the gate above twice. generate's drift check
      # compares against HEAD, so a generator that always emits different bytes fails a plain
      # pass as drift, with no way to say which of the two causes it was. Replay compares
      # run 1 against run 2, so it catches the oscillator every time and names it.
      #
      # `rw` is load-bearing, as in audit.yaml: without it the drift gate throws the moment a
      # generator rewrites a committed file, before the replay compares anything. The no-rw
      # gate above and the shard gates are what keep the drift question answered.
      #
      # audit.yaml keeps the whole-tree replay for the ambient case - a tool upgrade
      # destabilising a generator no diff touched. Replay under rw answers byte-stability
      # only; drift against HEAD is decided here and in the shards, nowhere else.
      - name: Replay every gated generator and compare declared outputs
        run: magus run generate:rw --race=replay --concurrency-profile aggressive

  ci:
    name: "magus shard ${{ matrix.shard }}: ${{ matrix.label }}"
    needs: plan
    if: fromJSON(needs.plan.outputs.count) > 0 && needs.plan.outputs.inherit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MAGUS_CACHE_SIGNING_KEY: ${{ (github.event_name != 'pull_request' && github.ref == 'refs/heads/main') && secrets.MAGUS_CACHE_SIGNING_KEY || '' }}
      # Caps the local tier, and so every saved store below, at 256 MiB: the saves share
      # the repository's Actions cache quota with the remote tier's entries, and an
      # unbounded one would evict them. A shard's entries uploaded 1.7 MiB at most on
      # main (run 35882427621), so the cap binds only on something unexpected.
      MAGUS_CACHE_SIZE_MB: '256'
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      #
      # Both restores are pull-request only: on main this job holds the cache signing key.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache: ${{ github.event_name == 'pull_request' }}

      # The magus the plan job built from this commit, verified against the digest the
      # plan recorded and the commit this job checked out.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: artifact
          artifact: ${{ needs.plan.outputs.magus_artifact }}
          artifact-sha256: ${{ needs.plan.outputs.magus_sha256 }}
          artifact-commit: ${{ github.sha }}
          restore-history: ${{ github.event_name == 'pull_request' }}

      # spells/github/actions reads these for the remote cache. The runner injects them
      # into an action's process but not into a `run:` step, and not into a composite's
      # run steps either, so re-exporting them takes a JS action.
      - name: Export the Actions cache service credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name]
              // Warn, not fail: the spell reports itself disabled and the shard still
              // builds, just without the cache.
              if (!value) {
                core.warning(`${name} is not set; the magus remote cache stays disabled for this job`)
                continue
              }
              if (name.endsWith('_TOKEN')) core.setSecret(value)
              core.exportVariable(name, value)
            }

      # internal/codec's cgo xz/zstd fast path is the only thing here that needs a
      # system library.
      - uses: ./.github/actions/codec-deps

      # `describe <noun> [name]` - the noun comes FIRST, and the template fields
      # are the -o json names. This previously read `describe -o template=... $p`
      # with {{.Project}} and {{.Base}}: the flag was parsed as the noun, so every
      # invocation died on `unknown noun "-o"`, and neither field exists on any
      # describe output anyway. It annotated nothing for as long as it has been
      # here, silently, because usage errors exited 0 and continue-on-error hid
      # what was left. Exit codes became meaningful in #22, which is what finally
      # made a step that never worked start saying so.
      #
      # The matrix comes from the plan job's output: env, never interpolated into the script.
      - name: Annotate affected projects
        continue-on-error: true
        env:
          PROJECTS: ${{ matrix.projects }}
        shell: bash
        run: |
          read -ra projects <<<"$PROJECTS"
          for p in "${projects[@]}"; do
            magus describe project "$p" -o 'template={{range .projects}}::notice title=affected::{{.path}}{{end}}'
          done

      # The local cache tier of a pull request, restored before the run and saved after
      # it. magus reads the local tier, then the remote tier, so this answers a rerun of
      # what only this pull request built, without the pull request writing the remote
      # tier. What main built needs no save here: main writes it to the remote tier, which
      # every pull request already reads.
      #
      # Pull requests only, so saves never compete with main's remote-tier entries for
      # the Actions cache quota beyond the 256 MiB cap each. A save is scoped to its pull
      # request's ref, so no other pull request, and not main, can restore it.
      #
      #   key:          CI-magus-store-v1-<os>-<shard label>-<run id>-<attempt>
      #   restore-keys: CI-magus-store-v1-<os>-<shard label>-   (this shard's newest)
      #                 CI-magus-store-v1-<os>-                 (any shard's newest)
      #
      # The attempt keeps a rerun's save from colliding with the first attempt's key,
      # which Actions refuses to overwrite.
      #
      # cas, manifests and logs carry a hit (docs/concepts/cache.md). mtimes stays out:
      # it keys on file mtime, which a fresh checkout resets, so a restored memo only misses.
      - name: Restore the local cache tier
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .magus/cas
            .magus/manifests
            .magus/logs
          key: ${{ github.workflow }}-magus-store-v1-${{ runner.os }}-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ github.workflow }}-magus-store-v1-${{ runner.os }}-${{ matrix.label }}-
            ${{ github.workflow }}-magus-store-v1-${{ runner.os }}-

      # Go's own build and module caches, from a bundle main signed, so a magus miss
      # recompiles only the packages that changed. It restores nothing that fails
      # verification, and a miss or a refusal leaves the build cold rather than red.
      # Main restores too: the bundle is verified, which is what the cache rule asks.
      - name: Restore the Go toolchain cache
        run: magus config cache import --toolchain go --remote

      - name: Run CI for shard
        uses: ./.github/actions/magus
        with:
          # ci:gha, not bare ci. The gha charm swaps a tool's reporter to GitHub's
          # inline annotation format, so a lint or test failure lands on the diff instead
          # of scrolling past in a log magus then truncates. It survives the ci gate (only
          # rw is stripped), and --no-default-charms drops the workspace default without
          # touching an explicitly named one. --concurrency-profile aggressive is the
          # explicit ask for the whole runner: magus reads no environment variable to
          # guess it is in CI, so every invocation that wants the machine says so itself.
          command:  run ci:gha --no-default-charms --concurrency-profile aggressive ${{ matrix.projects }}
          shard:    ${{ matrix.shard }}
          n-shards: ${{ needs.plan.outputs.count }}

      # Signed with MAGUS_CACHE_SIGNING_KEY, which only main holds. Only the shard that
      # runs the root module saves: the day's first bundle stands, and one from a shard
      # that compiled a corner of the tree would claim the key. --used-within drops the
      # restored entries this run never touched.
      - name: Save the Go toolchain cache
        if: success() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && contains(format(' {0} ', matrix.projects), ' . ')
        run: magus config cache export --toolchain go --remote --used-within 12h

      # Saved on a red shard too: what passed before the failure is a valid hit for the
      # rerun, the run that most needs it. Not on cancel, where the store may be half
      # written.
      - name: Save the local cache tier
        if: github.event_name == 'pull_request' && (success() || failure())
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .magus/cas
            .magus/manifests
            .magus/logs
          key: ${{ github.workflow }}-magus-store-v1-${{ runner.os }}-${{ matrix.label }}-${{ github.run_id }}-${{ github.run_attempt }}

      # The notes store's anchors, gated on the ONE finding worth blocking a merge for.
      #
      # --strict fails on a dangling anchor and on nothing else. A dangling anchor means a
      # rename or a delete in this very diff broke a pointer, and the fix is bounded and
      # obvious. Drift never fails: it asks a person to re-read prose against code and judge,
      # and a gate that blocks on a judgement call is one people permanently route around.
      #
      # Here rather than inside the `ci` target, and that is not a style choice. A magusfile
      # target cannot run this without shelling out to `./magus` from inside a magus run, and
      # the nested invocation regenerates the graph indexes mid-run - MGS4007, measured, three
      # MAGUS.md files rewritten by a target that declared them as sources.
      #
      # --shared only: the private store is machine-local by definition, so gating on it would
      # fail CI for files no runner can see. Runs on shard 1 alone; the store is workspace-wide
      # and checking it once per shard would report one dangling anchor N times.
      - name: Verify note anchors
        if: matrix.shard == 1
        uses: ./.github/actions/magus
        with:
          command: notes verify --strict --shared

      # magus truncates a failing target's captured output to "likely diagnostics"
      # in the console, which drops thousands of lines - including, repeatedly, the
      # assertion that actually failed. The full text is on disk in the run log, and
      # an ephemeral runner takes it to the grave unless it is uploaded. Without this
      # a red shard can only be diagnosed by guessing and re-running.
      # failure() alone is not enough: a shard that is CANCELLED - the runner dying, an
      # OOM kill, a superseded run - skips this step and takes the only explanation with
      # it. That is exactly the case where the console said nothing useful, so the logs
      # matter most precisely when the job did not fail in the ordinary way.
      - name: Upload magus run logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magus-logs-${{ matrix.shard }}
          path: .magus/logs/
          if-no-files-found: ignore
          retention-days: 7

  # The kernel sandbox's proof on a hosted runner. MAGUS_TEST_REQUIRE_LANDLOCK turns
  # its tests' skip into a failure, so green here means the ABI probe found landlock
  # and a confined child was denied. CGO_ENABLED=0 because a cgo binary cannot confine
  # every thread in process, and the shards' race build links cgo and skips that test.
  landlock:
    name: landlock
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Go alone: nothing else in mise.toml is on this job's path. No cache: this
      # install's key exists in no scope main writes, so each pull request saved a copy
      # of its own that only its reruns could read.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          install_args: go
          env: false
          cache: false

      - name: Test the kernel sandbox with landlock required
        env:
          CGO_ENABLED: '0'
          MAGUS_TEST_REQUIRE_LANDLOCK: '1'
        run: go test -count=1 ./internal/sandbox/...

  advice:
    # Non-blocking nudges about THIS PR - one step per check, each silent unless it has
    # something to say. Named for doctor's [advice] level so the CI surface and the tool
    # share one word for "worth knowing, never a gate". Opt out with the repository
    # variable MAGUS_PR_COMMENTS=false.
    #
    # Skipped on an inherited verdict: the advisors describe the delta against main,
    # which the last green run already commented on, and re-posting it says nothing new.
    name: magus advisor
    if: github.event_name == 'pull_request' && vars.MAGUS_PR_COMMENTS != 'false' && needs.plan.outputs.inherit != 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    # Two symbol indexes, this tree's and the merge base's. Measured locally at 30s each on
    # a warm build cache; a cold runner pays the Go compile for both.
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    # The symbol index needs a WRITABLE local cache tier, so never set
    # MAGUS_CACHE_WRITE_ENABLED false here. A scip run records its manifest in the cache and
    # the freshness probe reads it back; with nothing recorded, every index reads as
    # "predates the sources it covers" and ingestion drops it, silently costing this job
    # reach, public surface and the API delta.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      #
      # cache: false because this job holds pull-requests: write.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: artifact
          artifact: ${{ needs.plan.outputs.magus_artifact }}
          artifact-sha256: ${{ needs.plan.outputs.magus_sha256 }}
          artifact-commit: ${{ github.sha }}

      # Symbols, for BOTH sides. Without an index of this tree every file reads as surface
      # unknown and the api-surface advisor says nothing at all, which is what it has been
      # doing here; without one of the merge base there is nothing to compare a signature
      # against, so no bump can be computed.
      #
      # Built here rather than pulled from the published graph: that artifact is per main
      # commit, and a pull request's merge base need not have one yet.
      #
      # The base is indexed in a worktree of the SAME checkout, so both sides see the same
      # paths, the same toolchain and the same missing node_modules. Symmetry is the point:
      # a signature compared across two different environments moves for reasons the author
      # did not write.
      #
      # continue-on-error: an index that fails leaves the advisors reporting less, which is
      # what they do on any workspace with no index, and never fails a pull request.
      - name: Index this tree and the merge base
        id: baseline
        continue-on-error: true
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          magus graph build --no-sessions
          git worktree add "$RUNNER_TEMP/base" "$(git merge-base HEAD "origin/$BASE_REF")"
          magus --root "$RUNNER_TEMP/base" graph build --no-sessions
          magus --root "$RUNNER_TEMP/base" graph export --symbols -o json \
            --tee "$RUNNER_TEMP/base-graph.json" -q > /dev/null
          echo "path=$RUNNER_TEMP/base-graph.json" >> "$GITHUB_OUTPUT"

      # Every advisor, each silent unless it has something to say. They live in the
      # action so other workspaces get them with one `uses:` line; turn one off by name
      # (merge-conflicts: 'false') rather than by editing this step.
      #
      # No fixer and no fix label: a fixer runs the pull request's own generators beside a
      # token that can push. Regeneration for a merge is the queue's, from main's code.
      - uses: ./.github/actions/advice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          baseline: ${{ steps.baseline.outputs.path }}

  # One stable check name a branch rule can require, standing for the whole run.
  #
  # Neither existing job can be that name. `magus report` is GREEN on a red run, because
  # ci-outcome writes a summary and never exits non-zero. The shards are the real verdict,
  # but their names come from a matrix the plan sizes at run time, so requiring
  # "magus shard 1" blocks any pull request whose plan needed only one.
  gate:
    name: ci gate
    needs: [plan, ci]
    # always(), or a skipped or failed dependency would skip this job too - and a required
    # check that never reports blocks the pull request instead of failing it, which reads
    # as an infrastructure problem rather than a red build.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require the plan, doctor and every shard to have passed
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          DOCTOR_RESULT: ${{ needs.plan.outputs.doctor }}
          CI_RESULT: ${{ needs.ci.result }}
        run: |
          set -euo pipefail
          # Every verdict is reported before exiting, so one red run names everything that
          # is wrong. Exiting at the first one is what turned a fix into four rounds: each
          # run revealed exactly one more problem, and the next was invisible until the
          # previous one was pushed.
          failed=0
          if [ "$PLAN_RESULT" != "success" ]; then
            echo "::error::plan did not pass (${PLAN_RESULT}); nothing downstream is trustworthy"
            failed=1
          fi
          # Empty when the plan job never reached Doctor, which the plan check above owns.
          if [ -n "$DOCTOR_RESULT" ] && [ "$DOCTOR_RESULT" != "success" ]; then
            echo "::error::doctor did not pass (${DOCTOR_RESULT}); the workspace is misconfigured even where the shards are green"
            failed=1
          fi
          # skipped is a pass: an inherited verdict plans an empty shard matrix on purpose.
          case "$CI_RESULT" in
            success|skipped) echo "shards: ${CI_RESULT}" ;;
            *) echo "::error::shards did not pass (${CI_RESULT})"; failed=1 ;;
          esac
          exit "$failed"

  report:
    # One job for everything that runs AFTER the shards: the run summary always, and the
    # history merge only where there is a history to keep. They shared a checkout, a magus
    # install, and a trigger condition; two jobs meant two of each and two rows in the
    # checks list for one idea.
    name: magus report
    needs: [plan, ci]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # merge-history folds this run into the restored history. Holds only contents: read.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: artifact
          artifact: ${{ needs.plan.outputs.magus_artifact }}
          artifact-sha256: ${{ needs.plan.outputs.magus_sha256 }}
          artifact-commit: ${{ github.sha }}
          restore-history: 'true'

      # Outcome first: it describes the run that just finished, and the history merge
      # below changes what a later reader would see.
      - uses: ./.github/actions/ci-outcome
        with:
          ci-result: ${{ needs.ci.result }}
          shard-count: ${{ needs.plan.outputs.count }}

      # merge-history only on main: a pull request's shard histories describe a branch
      # that is about to disappear, and folding them into the kept history would skew it.
      #
      # always(), because a bare `if:` implies success() of every step before it, and the
      # runs whose timings the forecaster most needs are the ones that went red. This
      # used to be one composite step whose own merge steps carried always(); splitting
      # the summary out moved that guard up here.
      - if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/magus
        with:
          merge-history: 'true'
          ci-result: ${{ needs.ci.result }}
