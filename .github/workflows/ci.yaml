name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2
  # PRs may read the cache but cannot publish to it.
  MAGUS_CACHE_IMMUTABLE: ${{ github.event_name == 'pull_request' }}
  MAGUS_CACHE_REMOTE_INSECURE: 'true'
  MAGUS_CACHE_REMOTE_TRUSTED_KEYS: ${{ vars.MAGUS_CACHE_PUBLIC_KEY }}
  MAGUS_CI_MAX_SHARDS: '2'

jobs:
  preflight:
    name: magus preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      matrix:        ${{ steps.plan.outputs.matrix }}
      count:         ${{ steps.plan.outputs.count }}
      max_parallel:  ${{ steps.plan.outputs.max_parallel }}
      magus_version: ${{ steps.resolve_magus.outputs.tag }}
    steps:
      - name: Set history path
        run: echo "MAGUS_HISTORY_PATH=$RUNNER_TEMP/magus-history.json" >> "$GITHUB_ENV"

      # The newest published release: the compat job runs against it, and its job name
      # shows the version so a reader sees WHICH magus was checked. Before setup so the
      # tag is an output even if the install later fails.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Resolve magus release
        id: resolve_magus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo egladman/magus --json tagName -q .tagName)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'

      # Builds the magus this very commit defines, from the checkout above, so a
      # change that magusfile.buzz needs is exercised by the run that introduces
      # it. NOT git-ref: ${{ github.sha }} - on a pull_request that expands to the
      # ephemeral refs/pull/N/merge commit, which is a descendant of main and so
      # is rejected by the action's reachable-from-main gate every single time.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - name: Doctor
        run: magus doctor

      - name: Restore magus run history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MAGUS_HISTORY_PATH }}
          key: ${{ github.workflow }}-magus-history-v1-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-magus-history-v1-

      - id: plan
        name: Compute shard matrix
        run: magus affected ci --plan | magus run ci-shard:gha --no-default-charms

  ci:
    name: magus shard ${{ matrix.shard }}
    needs: preflight
    if: fromJSON(needs.preflight.outputs.count) > 0
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MAGUS_CACHE_SIGNING_KEY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.MAGUS_CACHE_SIGNING_KEY || '' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.preflight.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.preflight.outputs.matrix) }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - name: Set history path
        run: echo "MAGUS_HISTORY_PATH=$RUNNER_TEMP/magus-history.json" >> "$GITHUB_ENV"

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'

      # Builds the magus this very commit defines, from the checkout above, so a
      # change that magusfile.buzz needs is exercised by the run that introduces
      # it. NOT git-ref: ${{ github.sha }} - on a pull_request that expands to the
      # ephemeral refs/pull/N/merge commit, which is a descendant of main and so
      # is rejected by the action's reachable-from-main gate every single time.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - uses: crazy-max/ghaction-github-runtime@b3a9207c0e1ef41f4cf215303c976869d0c2c1c4 # v3.0.0

      - name: Install native build dependencies (webkit, codec)
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev liblzma-dev libzstd-dev

      - name: Annotate affected projects
        continue-on-error: true
        run: |
          for p in ${{ matrix.projects }}; do
            magus describe -o 'template=::notice title=affected::{{.Project}} (base: {{.Base}})' "$p"
          done

      - name: Restore magus run history
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ${{ env.MAGUS_HISTORY_PATH }}
          key: ${{ github.workflow }}-magus-history-v1-${{ github.run_id }}
          restore-keys: |
            ${{ github.workflow }}-magus-history-v1-

      - name: Run CI for shard
        uses: ./.github/actions/magus
        with:
          command:  run ci --no-default-charms ${{ matrix.projects }}
          shard:    ${{ matrix.shard }}
          n-shards: ${{ needs.preflight.outputs.count }}

      - name: Upload shard history
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: magus-history-${{ matrix.shard }}
          path: ${{ env.MAGUS_HISTORY_PATH }}
          if-no-files-found: ignore
          retention-days: 7

  compat:
    name: magus compatibility (${{ needs.preflight.outputs.magus_version }})
    # Second pass: can the magus users already have still drive this workspace? The
    # shards answer "does this change work"; this answers a different question.
    # Non-blocking - a failure means cut a release, not fix the PR.
    # Serial (needs: ci) to avoid paying for it when the source pass already failed.
    needs: [preflight, ci]
    if: always() && needs.ci.result == 'success'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'

      - name: Install codec build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev

      - uses: ./.github/actions/setup-magus
        id: magus
        with:
          installation-strategy: prebuilt
          git-ref: ${{ needs.preflight.outputs.magus_version }}

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # prebuilt, not automatic: a silent fallback to a source build would make this job
      # compare source against source and report compatibility it never checked.
      - name: Confirm a real release was installed
        shell: bash
        env:
          VERSION: ${{ steps.magus.outputs.version }}
          INSTALL_SOURCE: ${{ steps.magus.outputs.install-source }}
          COMMIT: ${{ steps.magus.outputs.commit }}
        run: |
          echo "magus $VERSION ($INSTALL_SOURCE, $COMMIT)" >> "$GITHUB_STEP_SUMMARY"
          [[ "$INSTALL_SOURCE" == "prebuilt" ]]

      # ls, not doctor: this asks only "can the release evaluate every magusfile", and ls
      # answers it by listing each project's targets. doctor is opinionated - it would
      # fail on workspace conventions that have nothing to do with the binary's version.
      - name: Load the workspace with magus ${{ needs.preflight.outputs.magus_version }}
        run: magus ls

      - name: Run ci with magus ${{ needs.preflight.outputs.magus_version }}
        run: magus affected ci --no-default-charms

  advice:
    # Non-blocking nudges about THIS PR - one step per check, each silent unless it has
    # something to say. Named for doctor's [advice] level so the CI surface and the tool
    # share one word for "worth knowing, never a gate". Opt out with the repository
    # variable MAGUS_PR_COMMENTS=false.
    name: magus advisor
    if: github.event_name == 'pull_request' && vars.MAGUS_PR_COMMENTS != 'false'
    needs: [preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # Every advisor, each silent unless it has something to say. They live in the
      # action so other workspaces get them with one `uses:` line; turn one off by name
      # (merge-conflicts: 'false') rather than by editing this step.
      - uses: ./.github/actions/advice

  site-build:
    name: magus site build
    needs: [preflight]
    # Separate from `magus affected ci` on purpose: affected ci shards per-project
    # correctness, and the deploy is a workspace-level composition no single project owns.
    #
    # It exists because the publish workflow runs only on main, so without this the first
    # run of the deploy build for a change was after that change merged - "the merge is the
    # first time a step runs" (docs/concepts/targets/ci.md).
    #
    # Unfiltered by path for the same reason the publish workflow is: the input set spans
    # the docs and console trees, root Markdown, assets, releases, embedded skills, and the
    # Go packages the content generators read. A stale filter would skip the smoke test
    # silently, which is the hole this closes.
    if: needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'

      # The docs render drives its generators through `go run`, which compiles
      # internal/codec with cgo and needs liblzma/libzstd.
      - name: Install codec build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev

      # Matches the publish workflow: page footers read `git log`, so a shallow clone would
      # exercise a different render than the one that ships.
      # A source build, matching publish-site.yaml. This mirrored the publish workflow on
      # the released binary so a source build could not test a magus the deploy never
      # runs - but that pairing breaks for the whole window between a breaking magusfile
      # change and the release carrying it. The built-in spells were renamed (md ->
      # markdown, ...) and the magusfile updated to match, so the newest release cannot
      # load this workspace at all. publish-site.yaml made the same move; the two stay
      # matched, just on source rather than on the release.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # deploy-generate throws when either tree lacks its index.html, so it is the
      # assertion. Nothing is uploaded: this proves the build, it does not publish.
      - name: Render the docs site
        run: magus run generate docs

      - name: Build the console app
        run: magus run build console

      - name: Assemble the deploy tree
        run: magus run deploy-generate .

  image-snapshot:
    name: magus image snapshot
    needs: [preflight, ci]
    # Merges to main only, and only once `ci` has actually passed - not `always()`.
    # A pull request must never reach this job: a fork PR would otherwise push an
    # image and mint a Sigstore signature off unreviewed code, and a snapshot of a
    # commit that never landed is not something anyone can go back and `docker run`.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless (OIDC) signing
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'

      # Full history + tags: the image bakes version()/commit()/build_date() in via
      # ldflags, and git describe has to be able to reach the nearest tag.
      # Full history + tags (the composite's default): the image bakes
      # version()/commit()/build_date() in via ldflags, and git describe must reach the
      # nearest tag. mise brings cosign for the signing step inside image-build.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same magusfile-driven login as cd.yaml, under the snapshot charm instead - which
      # lists GHCR alone, so no Docker Hub secret is needed or read here.
      - name: Verify registry credentials
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: magus run image-registries:snapshot,verify --no-default-charms

      - name: Log in to image registries
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: magus run image-login:snapshot --no-default-charms

      # Static variant only, tagged with the short commit. A snapshot reproduces one
      # commit, so it gets neither the CGO variant nor a moving tag, and it is signed
      # under THIS workflow's certificate identity - ci.yaml, not cd.yaml - which is
      # what makes the release verify command in
      # docs/guides/download/container-image.md reject a snapshot.
      - name: Build, push, and sign the snapshot image
        run: magus run image-build:snapshot --no-default-charms

      # No summary step here on purpose: image-build writes $GITHUB_STEP_SUMMARY itself,
      # from the references it actually pushed. A step that re-derived them would be
      # parsing magus's own output back out of a file magus wrote.

  report:
    # One job for everything that runs AFTER the shards: the run summary always, and the
    # history merge only where there is a history to keep. They shared a checkout, a magus
    # install, and a trigger condition; two jobs meant two of each and two rows in the
    # checks list for one idea.
    name: magus report
    needs: [preflight, ci]
    if: always() && needs.preflight.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # One step for the whole job. merge-history only on main: a pull request's shard
      # histories describe a branch that is about to disappear, and folding them into the
      # kept history would skew it.
      - uses: ./.github/actions/magus
        with:
          report: 'true'
          ci-result: ${{ needs.ci.result }}
          shard-count: ${{ needs.preflight.outputs.count }}
          merge-history: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
