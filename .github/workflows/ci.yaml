name: CI

# Validates a change. Nothing here publishes an artifact, and no job asks for a write
# scope beyond the pull-request comment the advisor posts - the top-level default is
# contents: read and every job keeps it.
#
# Four workflows, one trigger each, and the name says which: ci.yaml validates (pull
# request), cd.yaml ships what a merge produces (main push), release.yaml cuts a release
# (v* tag), audit.yaml runs the expensive out-of-band checks (cron).
#
# ci also runs on main pushes, and that is not a publish step: the push run is what
# populates the shared cache and the run-duration history a pull request may only read.
# See MAGUS_CACHE_WRITE_ENABLED below.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# On a PR the newest push supersedes the ones before it, so cancelling is right: the only
# verdict anyone acts on is the one for the head commit.
#
# On main it is WRONG, and silently so. github.ref is refs/heads/main for every push, so
# one group holds them all and each merge cancelled the previous merge's run - two merges
# close together and the first one was never validated at all. That is how main comes to
# carry generated output nothing regenerates, and the bill lands on whoever opens the next
# pull request. Every commit on main gets its own verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2
  # PRs may read the cache but cannot publish to it.
  MAGUS_CACHE_WRITE_ENABLED: ${{ github.event_name != 'pull_request' }}
  # The trust set is what wires the shared cache (see the `if` at magusfile.buzz's
  # cache.remote block) AND what verifies it. MAGUS_CACHE_REMOTE_INSECURE used to be
  # set here too, which was the whole configuration doing two wrong things at once:
  # it was the only thing turning the cache ON, and remoteCacheSigningOpts returns
  # WithInsecureRemote before it ever reads a trust set - so the trusted_keys in
  # magus.yaml were never consulted and CI replayed unsigned artifacts.
  #
  # Unset this variable and the cache is simply not wired: no error, no remote hits.
  # Setting it is what turns on both the cache and its verification, together.
  MAGUS_CACHE_REMOTE_TRUSTED_KEYS: ${{ vars.MAGUS_CACHE_PUBLIC_KEY }}
  # A CEILING, not a target: the forecaster picks the count, and may raise it to
  # split a shard predicted to exceed the runner's memory. Held at 2 deliberately -
  # shard count is not runner spend, but it is runner *concurrency*, and the OOM
  # that made this knob interesting turned out to be one magusfile allocating 13GB,
  # not too much work on one machine. Raise it when a measurement asks for it.
  MAGUS_CI_MAX_SHARDS: '2'
  # Stream every target's output live instead of withholding it until something
  # fails. magus collapses on success by default, which is right on a terminal you
  # are sitting at and wrong in a log nobody reads until it goes red: a green run
  # printed nothing at all, and a failing one opened with "221 log line(s)
  # omitted". Neither leaves a record of what the run was DOING when a shard was
  # killed mid-target - which is the case that sent us looking.
  #
  # Set here rather than defaulted inside magus on GITHUB_ACTIONS, so the choice is
  # visible in the file a reader is already looking at, and magus behaves the same
  # everywhere. -s/--silent still overrides it.
  #
  # The cost is real: output from concurrently running projects interleaves, so
  # read a shard log by target rather than top to bottom.
  MAGUS_LOG_STREAM: '1'

jobs:
  plan:
    name: magus plan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      # The runs API behind last_green_run, and the only reason this job holds a
      # scope the others do not. Read-only: it looks up run history, never writes.
      actions: read
    outputs:
      matrix:        ${{ steps.plan.outputs.matrix }}
      count:         ${{ steps.plan.outputs.count }}
      max_parallel:  ${{ steps.plan.outputs.max_parallel }}
      # 'true' when the plan inherited the verdict of this branch's last green run
      # because every path changed since it classifies low-risk. magus decides that
      # and publishes the report; the two `if:` guards below only consume the answer.
      inherit:       ${{ steps.plan.outputs.inherit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      # Builds the magus this very commit defines, from the checkout above, so a
      # change that magusfile.buzz needs is exercised by the run that introduces
      # it. NOT git-ref: ${{ github.sha }} - on a pull_request that expands to the
      # ephemeral refs/pull/N/merge commit, which is a descendant of main and so
      # is rejected by the action's reachable-from-main gate every single time.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - name: Doctor
        run: magus doctor

      # Fails the run before a single shard starts. Six projects declare index-generate
      # output that is a function of the WHOLE knowledge graph, and affected does not
      # select them for every change that feeds it - measured with `affected ci --stdin
      # --plan`, a docs markdown change selects {docs} alone and a libs/diagnostics
      # change selects {libs/diagnostics} alone, while every project's MAGUS.md moves
      # with the graph. Shards own the rest of the drift question (a composed skip_cache
      # generator runs inside a shard's ci even on a cache hit, see
      # runComposedSkipCacheGates), but a shard that never runs cannot gate anything.
      # This step was narrowed once and three projects carried stale indexes from
      # 6b4402e49 until 5e32e73fa; the bare fan-out also measured FASTER than the
      # two-project form (17s against 27s), because root's graph regeneration dominates
      # either way.
      #
      # --skip docs is the deferral, stated inline: docs renders the whole site, minutes,
      # and its own shard runs generate anyway. console declares no generate target, so
      # the bare fan-out never reaches it. A --skip naming a project that stops existing
      # is a hard error, so the list cannot silently diverge from the workspace.
      #
      # No `rw`: under rw the drift compare is skipped and regenerated bytes are kept;
      # without it generate compares them against HEAD and fails on drift, which is the
      # gate. See docs/concepts/targets.md.
      - name: Fail fast on uncommitted generated output
        run: magus run generate --skip docs --no-default-charms

      # Determinism, in this job rather than its own: the saving is a runner and a from-source
      # magus build, not a generate pass.
      #
      # `--race=replay` rather than running the gate above twice. generate's drift check
      # compares against HEAD, so a generator that always emits different bytes fails a plain
      # pass as drift, with no way to say which of the two causes it was. Replay compares
      # run 1 against run 2, so it catches the oscillator every time and names it.
      #
      # `rw` is load-bearing, as in audit.yaml: without it the drift gate throws the moment a
      # generator rewrites a committed file, before the replay compares anything. The no-rw
      # gate above and the shard gates are what keep the drift question answered.
      #
      # audit.yaml keeps the whole-tree replay for the ambient case - a tool upgrade
      # destabilising a generator no diff touched. Replay under rw answers byte-stability
      # only; drift against HEAD is decided here and in the shards, nowhere else.
      - name: Replay every gated generator and compare declared outputs
        run: magus run generate:rw --skip docs --race=replay

      # last-passed on a push, the configured default on a pull request.
      #
      # A push to main has no useful default base: magus's is origin/main, which on main
      # IS the commit being pushed, so the diff is empty. Every main push planned
      # `projects=0 shards=0`, the `count > 0` guard skipped every shard, and the run
      # gated nothing - which is also why no shard ever uploaded a history, `report`
      # logged "no shard histories; nothing to merge", and every pull request since
      # planned its shards with no duration data at all.
      #
      # last-passed reads the run log for the commit this branch last passed `ci` at, so
      # a run that was cancelled or failed leaves its commits in the NEXT run's diff
      # instead of being stepped over. A pull request needs none of it: origin/main
      # already IS its merge base, and an empty value falls through to that default.
      - id: plan
        name: Compute shard matrix
        env:
          MAGUS_VCS_BASE_REF: ${{ github.event_name == 'push' && 'last-passed' || '' }}
          # Read by the github spell's last_green_run alone. Unset, it answers null
          # and the plan fans out as it always has.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: magus affected ci --plan | magus run ci-shard:gha --no-default-charms

  ci:
    name: magus shard ${{ matrix.shard }}
    needs: plan
    if: fromJSON(needs.plan.outputs.count) > 0 && needs.plan.outputs.inherit != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      MAGUS_CACHE_SIGNING_KEY: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/main') && secrets.MAGUS_CACHE_SIGNING_KEY || '' }}
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(needs.plan.outputs.max_parallel) }}
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      # Builds the magus this very commit defines, from the checkout above, so a
      # change that magusfile.buzz needs is exercised by the run that introduces
      # it. NOT git-ref: ${{ github.sha }} - on a pull_request that expands to the
      # ephemeral refs/pull/N/merge commit, which is a descendant of main and so
      # is rejected by the action's reachable-from-main gate every single time.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # spells/github/actions reads these for the remote cache. The runner injects them
      # into an action's process but not into a `run:` step, and not into a composite's
      # run steps either, so re-exporting them takes a JS action.
      - name: Export the Actions cache service credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name]
              // Warn, not fail: the spell reports itself disabled and the shard still
              // builds, just without the cache.
              if (!value) {
                core.warning(`${name} is not set; the magus remote cache stays disabled for this job`)
                continue
              }
              if (name.endsWith('_TOKEN')) core.setSecret(value)
              core.exportVariable(name, value)
            }

      # internal/codec's cgo xz/zstd fast path is the only thing here that needs a
      # system library, and these two are it. libgtk-3-dev and libwebkit2gtk-4.1-dev
      # used to be installed alongside them and were never needed: nothing in the tree
      # references webkit or gtk (the install line was their only mention in the whole
      # repository), no dependency pulls a webview, and the console is a PWA rather
      # than a native shell. They arrived in the bulk workflow replacement b31229bcc,
      # not in response to a build failure, and cost ~10-15s per shard. If some future
      # native target does need them, this step fails loudly at compile - which is a
      # better signal than installing them forever on the chance that it might.
      - name: Install native build dependencies (codec)
        # Install FIRST and update only if that fails, rather than the usual update-then-install.
        # `apt-get update` refreshes every configured source, and on these runners that is ~10MB of
        # indexes - universe, restricted, security, four Translation-en files, Microsoft, Chrome,
        # azure-cli, and arm64 lists on an amd64 box. It costs 9s on a good day and was measured at
        # 85s on both shards at once when azure.archive.ubuntu.com was slow, which is the correlated
        # stall that reads as a hang.
        #
        # None of it is needed. libzstd-dev already ships in the runner image, liblzma-dev is the one
        # package actually installed, and it comes from noble/main - whose index the image already
        # carries. So the cached index resolves both in about two seconds.
        #
        # The fallback is what keeps that honest: if the image ever ships without the lists, or its
        # index goes stale enough that the .deb 404s, the install fails and the update runs for real.
        # Languages=none drops the Translation files it would otherwise fetch, and Retries absorbs a
        # flaky mirror instead of stalling against it.
        run: |
          sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev \
            || { sudo apt-get update -o Acquire::Retries=3 -o Acquire::Languages=none \
                 && sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev; }

      # `describe <noun> [name]` - the noun comes FIRST, and the template fields
      # are the -o json names. This previously read `describe -o template=... $p`
      # with {{.Project}} and {{.Base}}: the flag was parsed as the noun, so every
      # invocation died on `unknown noun "-o"`, and neither field exists on any
      # describe output anyway. It annotated nothing for as long as it has been
      # here, silently, because usage errors exited 0 and continue-on-error hid
      # what was left. Exit codes became meaningful in #22, which is what finally
      # made a step that never worked start saying so.
      - name: Annotate affected projects
        continue-on-error: true
        run: |
          for p in ${{ matrix.projects }}; do
            magus describe project "$p" -o 'template={{range .projects}}::notice title=affected::{{.path}}{{end}}'
          done

      - name: Run CI for shard
        uses: ./.github/actions/magus
        with:
          # ci:gha, not bare ci. The gha charm swaps a tool's reporter to GitHub's
          # inline annotation format, so a lint or test failure lands on the diff instead
          # of scrolling past in a log magus then truncates. It survives the ci gate (only
          # rw is stripped), and --no-default-charms drops the workspace default without
          # touching an explicitly named one.
          command:  run ci:gha --no-default-charms ${{ matrix.projects }}
          shard:    ${{ matrix.shard }}
          n-shards: ${{ needs.plan.outputs.count }}

      # The notes store's anchors, gated on the ONE finding worth blocking a merge for.
      #
      # --strict fails on a dangling anchor and on nothing else. A dangling anchor means a
      # rename or a delete in this very diff broke a pointer, and the fix is bounded and
      # obvious. Drift never fails: it asks a person to re-read prose against code and judge,
      # and a gate that blocks on a judgement call is one people permanently route around.
      #
      # Here rather than inside the `ci` target, and that is not a style choice. A magusfile
      # target cannot run this without shelling out to `./magus` from inside a magus run, and
      # the nested invocation regenerates the graph indexes mid-run - MGS4007, measured, three
      # MAGUS.md files rewritten by a target that declared them as sources.
      #
      # --shared only: the private store is machine-local by definition, so gating on it would
      # fail CI for files no runner can see. Runs on shard 1 alone; the store is workspace-wide
      # and checking it once per shard would report one dangling anchor N times.
      - name: Verify note anchors
        if: matrix.shard == 1
        uses: ./.github/actions/magus
        with:
          command: notes verify --strict --shared

      # magus truncates a failing target's captured output to "likely diagnostics"
      # in the console, which drops thousands of lines - including, repeatedly, the
      # assertion that actually failed. The full text is on disk in the run log, and
      # an ephemeral runner takes it to the grave unless it is uploaded. Without this
      # a red shard can only be diagnosed by guessing and re-running.
      # failure() alone is not enough: a shard that is CANCELLED - the runner dying, an
      # OOM kill, a superseded run - skips this step and takes the only explanation with
      # it. That is exactly the case where the console said nothing useful, so the logs
      # matter most precisely when the job did not fail in the ordinary way.
      - name: Upload magus run logs on failure
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magus-logs-${{ matrix.shard }}
          path: .magus/logs/
          if-no-files-found: ignore
          retention-days: 7

  advice:
    # Non-blocking nudges about THIS PR - one step per check, each silent unless it has
    # something to say. Named for doctor's [advice] level so the CI surface and the tool
    # share one word for "worth knowing, never a gate". Opt out with the repository
    # variable MAGUS_PR_COMMENTS=false.
    #
    # Skipped on an inherited verdict: the advisors describe the delta against main,
    # which the last green run already commented on, and re-posting it says nothing new.
    name: magus advisor
    if: github.event_name == 'pull_request' && vars.MAGUS_PR_COMMENTS != 'false' && needs.plan.outputs.inherit != 'true'
    needs: [plan]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # Every advisor, each silent unless it has something to say. They live in the
      # action so other workspaces get them with one `uses:` line; turn one off by name
      # (merge-conflicts: 'false') rather than by editing this step.
      #
      # The fixers are not here: they write, and this job is contents: read. regenerate.yaml
      # runs them on the label - offer-fix-label is what tells the conflict comment that
      # workflow exists.
      - uses: ./.github/actions/advice
        with:
          offer-fix-label: 'true'

  report:
    # One job for everything that runs AFTER the shards: the run summary always, and the
    # history merge only where there is a history to keep. They shared a checkout, a magus
    # install, and a trigger condition; two jobs meant two of each and two rows in the
    # checks list for one idea.
    name: magus report
    needs: [plan, ci]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # Outcome first: it describes the run that just finished, and the history merge
      # below changes what a later reader would see.
      - uses: ./.github/actions/ci-outcome
        with:
          ci-result: ${{ needs.ci.result }}
          shard-count: ${{ needs.plan.outputs.count }}

      # merge-history only on main: a pull request's shard histories describe a branch
      # that is about to disappear, and folding them into the kept history would skew it.
      #
      # always(), because a bare `if:` implies success() of every step before it, and the
      # runs whose timings the forecaster most needs are the ones that went red. This
      # used to be one composite step whose own merge steps carried always(); splitting
      # the summary out moved that guard up here.
      - if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: ./.github/actions/magus
        with:
          merge-history: 'true'
          ci-result: ${{ needs.ci.result }}
