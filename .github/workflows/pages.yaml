name: Pages

# Render the docs site and build the console app, then publish both to GitHub Pages: the
# docs site at the root and the standalone console under /console/.
#
# This job used to be a `cp` of two committed gen/ trees. They are no longer committed, so
# it renders them here instead. The reason is not repository size (though the two trees were
# 27% of its blob history): every rendered page embeds the commit that last touched its
# source, so committing a source change immediately staled the output committed alongside it.
# That cost a second "refresh generated metadata" commit after every real one, and amending
# was not an escape - a new hash restales the footer it just recorded. Rendering at deploy
# time knows the final commit already, so the cycle cannot form.
#
# What it costs: the site can no longer be published by copying bytes, so a broken generator
# now blocks a deploy that a `cp` could never fail. The generate target carries the
# asset-integrity, orphan, and abandoned-URL gates, so a break here is a real break rather
# than a publish-time surprise.

on:
  push:
    branches: [main]
    # No paths filter, deliberately. It used to key off docs/gen/**, which was exact: the
    # published bytes were themselves in the diff. The INPUTS are not - they are the docs
    # tree, the console tree, README/CONTRIBUTING/CHANGELOG, assets, blog, releases/*.yaml,
    # the embedded skills, and every Go package the content generators read. A filter over
    # that set is a list to keep in sync, and its failure mode is silent: one missed path
    # ships a stale site with nothing to notice it. A few minutes per main push buys that
    # correctness back.
  workflow_dispatch:

# Least privilege: read the repo, mint the Pages OIDC token, write the deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# Serialize deploys; never cancel an in-flight publish mid-upload.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # fetch-depth: 0 is load-bearing here rather than incidental. Each page's "Last updated"
      # footer and its History disclosure come from `git log` over that page's source, so a
      # shallow checkout would publish a site with no provenance at all. filter: blob:none
      # keeps that affordable: the footers walk the commit graph and never read a historical
      # blob. See docs/guides/integrations/ci.md.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'
          install: false

      # Brings Go (the content generators run through `go run`), Node, pnpm, and esbuild.
      - name: Install pinned toolchain
        run: mise install

      - name: Resolve magus release
        id: resolve_magus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo egladman/magus --json tagName -q .tagName)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      # The released binary, not a source build: the dogfooding contract is that the magus
      # which builds this workspace is one users already have. See CONTRIBUTING.md.
      - uses: ./.github/actions/setup-magus
        with:
          git-ref: ${{ steps.resolve_magus.outputs.tag }}

      # Three target names, no logic. Each project builds its OWN tree - a root target that
      # wrote into docs/ trips MGS3001, because a parent writing into a descendant project
      # breaks the boundary the cache and affected set are computed over.
      #
      # generate docs renders derived Markdown, the esbuild bundles, the site itself, and the
      # integrity/orphan/abandoned-URL gates. TinyGo is NOT needed: the playground wasm and
      # its glue are committed under docs/vendor/playground/ and copied in by the render,
      # because they are the only published bytes CI cannot reproduce.
      - name: Render the docs site
        run: magus run generate docs

      - name: Build the console app
        run: magus run build console

      # Assembles gen/site: docs at the root of it, console under /console/. Reproduce the exact
      # published tree locally with the same three commands.
      - name: Assemble the deploy tree
        run: magus run deploy-generate .

      # enablement: true turns Pages on (with the Actions source) the first time this
      # runs, so no manual Settings -> Pages step is needed. If your org blocks
      # auto-enablement, enable it once with:
      #   gh api -X POST repos/egladman/magus/pages -f build_type=workflow
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gen/site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
