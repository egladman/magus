name: CD

# Ships what a merge to main produces: the docs site to GitHub Pages, and a container
# image of that commit to GHCR. One trigger, one file, one job per artifact. A v* tag is a
# deliberate release rather than continuous delivery, so it lives in release.yaml.
#
# No paths filter, deliberately, for either job. The inputs span the docs and console
# trees, root Markdown, assets, blog, releases/*.yaml, the embedded skills, and every Go
# package the content generators read. A filter over that set is a list to keep in sync
# whose failure mode is silent: one missed path ships a stale site with nothing to notice
# it. A few minutes per main push buys that correctness back.
#
# Both jobs build magus from the checkout. The site half used to pin the newest release
# instead, and had been red on every main push since 2026-08-04: this workspace renamed its
# `md` spell to `markdown`, which no published release knows, so the release binary could
# not load the magusfile it was being asked to build. Pinning a release makes every deploy
# wait on a release that carries the feature the magusfile already needs, which is a
# chicken-and-egg with a silent failure mode. Building this commit's magus from this
# commit's source has neither.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2

jobs:
  site:
    name: docs site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Least privilege: read the repo, mint the Pages OIDC token, write the deployment.
    permissions:
      contents: read
      pages: write
      id-token: write
    # Serialize deploys; never cancel an in-flight publish mid-upload. Job-level so a slow
    # Pages upload does not hold up the image job, which shares nothing with it.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # fetch-depth: 0 is load-bearing here rather than incidental. Each page's "Last
      # updated" footer and its History disclosure come from `git log` over that page's
      # source, so a shallow checkout would publish a site with no provenance at all.
      # filter: blob:none keeps that affordable: the footers walk the commit graph and
      # never read a historical blob. See docs/guides/integrations/ci.md.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'

      # The docs render drives its generators through `go run`, which compiles
      # internal/codec with cgo and needs liblzma/libzstd.
      - name: Install codec build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # Three target names, no logic. Each project builds its OWN tree - a root target
      # that wrote into docs/ trips MGS3001, because a parent writing into a descendant
      # project breaks the boundary the cache and affected set are computed over.
      #
      # generate docs renders derived Markdown, the esbuild bundles, the site itself, and
      # the integrity/orphan/abandoned-URL gates. TinyGo is NOT needed: the playground
      # wasm and its glue are committed under docs/vendor/playground/ and copied in by the
      # render, because they are the only published bytes CI cannot reproduce.
      - name: Render the docs site
        run: magus run generate docs

      - name: Build the console app
        run: magus run build console

      # Assembles gen/site: docs at the root of it, console under /console/. Reproduce the
      # exact published tree locally with the same three commands.
      - name: Assemble the deploy tree
        run: magus run deploy-generate .

      # enablement: true turns Pages on (with the Actions source) the first time this
      # runs, so no manual Settings -> Pages step is needed. If your org blocks
      # auto-enablement, enable it once with:
      #   gh api -X POST repos/egladman/magus/pages -f build_type=workflow
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gen/site

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

  image:
    name: container image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write # push to GHCR
      id-token: write # cosign keyless (OIDC) signing
    # One image per commit, and never cancel one mid-push: a cancelled run can leave a
    # manifest pushed with no signature against it.
    concurrency:
      group: cd-image-${{ github.ref }}
      cancel-in-progress: false
    steps:
      # Full history + tags: the image bakes version()/commit()/build_date() in via
      # ldflags, and git describe has to be able to reach the nearest tag.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # mise also brings cosign for the signing step inside image-build.
      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Same magusfile-driven login as release.yaml, minus the versioned charm -
      # which lists GHCR alone, so no Docker Hub secret is needed or read here.
      - name: Verify registry credentials
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: magus run image-registries:cd,verify --no-default-charms

      - name: Log in to image registries
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: magus run image-login:cd --no-default-charms

      # Static variant only, tagged with the short commit. A per-commit image reproduces one
      # commit, so it gets neither the CGO variant nor a moving tag, and it is signed
      # under THIS workflow's certificate identity - cd.yaml, not release.yaml - which is
      # what makes the release verify command in
      # docs/guides/download/container-image.md reject a per-commit image.
      - name: Build, push, and sign the per-commit image
        run: magus run image-build:cd --no-default-charms

      # No summary step here on purpose: image-build writes $GITHUB_STEP_SUMMARY itself,
      # from the references it actually pushed. A step that re-derived them would be
      # parsing magus's own output back out of a file magus wrote.
