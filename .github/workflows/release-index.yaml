name: Release index

# Rebuilds public/release/index.json from releases/*.yaml, signs it, and opens a pull
# request with the pair. release.yaml runs the same magusfile target at the end of a
# tag build; this file is the entry point for the cases that are not a release - a
# manifest corrected, a release yanked, a key rotated - where the served index has to
# change without a version being cut.
#
# Manual only, and that is the whole risk budget: this is the one workflow outside
# release.yaml that reads MAGUS_SIGNING_KEY, so it is reachable by nothing automatic.
#
# The whole flow (build, sign, regenerate the changelog's derived files, branch, push,
# open the pull request) is the magusfile's release-index target; see release_index()
# in magusfile.buzz. That target regenerates through magus, so this job builds the
# magus this commit defines rather than getting by on a bare Go toolchain.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Recover a release whose publish job failed after building: cut its manifest from
          the assets ALREADY PUBLISHED under this tag (e.g. v0.4.3). Leave empty to re-sign
          the index from the manifests already committed, which is the ordinary case.
        required: false
        default: ''

# The same GOEXPERIMENT ci.yaml sets, because this job REGENERATES committed output and
# the encoder is part of what it writes: v1 escapes the three HTML-significant characters
# to their \u00XX form and jsonv2 leaves them as typed, so one label differs in bytes
# between the two. mise.toml carries the setting for a laptop, but mise-action runs with
# env: false here as everywhere else, so nothing exports it to the steps - and v0.4.3's
# index branch was published with 336 lines of gen/knowledge-graph.json in the v1 spelling,
# which the next gate read as drift.
env:
  GOEXPERIMENT: jsonv2

permissions:
  contents: read

jobs:
  publish:
    name: Sign the index and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the branch the pull request is opened from
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # release-index runs `generate:rw docs`, whose preflight execs pnpm. This job is
      # the manual escape hatch for a failed publish, so it had to be fixed alongside
      # release.yaml rather than after it: both were missing the toolchain, which is why
      # v0.4.2's index was never republished by hand either.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # release.yaml cuts the manifest one step before it publishes the index, so a failure
      # in between - v0.4.3 died on a missing pnpm - leaves the tag built and published with
      # no manifest anywhere: the cut ran on the runner and went away with it. Rerunning the
      # release job cannot fix that, because a rerun executes the workflow file from the
      # TAG's tree, which is the tree that lacks whatever fix was just merged. That left
      # rewriting a published tag as the only apparent exit, and rebuilding binaries under a
      # tag people can already download is not one.
      #
      # So the cut is available here too, against the assets the release ALREADY published.
      # The digests then describe what people can actually download rather than a rebuild,
      # which is the property a rebuild cannot give at any price.
      #
      # The tag rides the environment and is never interpolated into the command, as in
      # release.yaml. runCut is idempotent, so a rerun of THIS job converges rather than
      # tripping over the manifest it wrote.
      - name: Cut the manifest from a published release
        if: inputs.tag != ''
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --dir dist --clobber
          # Verify before hashing anything into a manifest. A partial download hashes
          # perfectly well and would pin digests that match nothing, in the one file whose
          # job is telling a client what it may fetch. SHA256SUMS carries a `version:`
          # header that is not a checksum line, so it is stripped rather than passed to a
          # checker that would reject the file for it.
          grep -v '^version:' dist/SHA256SUMS > "$RUNNER_TEMP/sums"
          (cd dist && sha256sum -c "$RUNNER_TEMP/sums")
          go run ./cmd/magus-utils cut -version "$TAG" -artifacts ./dist -changelog ./CHANGELOG.md -out ./releases
          go run ./cmd/magus-utils generate-changelog -releases ./releases -changelog ./CHANGELOG.md
          rm -rf dist

      - name: Publish the release index
        env:
          MAGUS_SIGNING_KEY: ${{ secrets.MAGUS_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: ${{ inputs.tag != '' && format('recovering the {0} release', inputs.tag) || 'a manual refresh' }}
        run: magus run release-index:cd --no-default-charms -- "$REASON"
