name: Release index

# Rebuilds public/release/index.json from releases/*.yaml, signs it, and opens a pull
# request with the pair. release.yaml runs the same magusfile target at the end of a
# tag build; this file is the entry point for the cases that are not a release - a
# manifest corrected, a release yanked, a key rotated - where the served index has to
# change without a version being cut.
#
# Manual only, and that is the whole risk budget: this is the one workflow outside
# release.yaml that reads MAGUS_SIGNING_KEY, so it is reachable by nothing automatic.
#
# The whole flow (build, sign, regenerate the changelog's derived files, branch, push,
# open the pull request) is the magusfile's release-index target; see release_index()
# in magusfile.buzz. That target regenerates through magus, so this job builds the
# magus this commit defines rather than getting by on a bare Go toolchain.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Sign the index and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the branch the pull request is opened from
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Publish the release index
        env:
          MAGUS_SIGNING_KEY: ${{ secrets.MAGUS_SIGNING_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REASON: a manual refresh
        run: magus run release-index:cd --no-default-charms -- "$REASON"
