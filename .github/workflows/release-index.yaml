name: Release index

# Rebuilds public/release/index.json from releases/*.yaml, signs it, and opens a pull
# request with the pair. release.yaml runs the same action at the end of a tag build;
# this file is the entry point for the cases that are not a release - a manifest
# corrected, a release yanked, a key rotated - where the served index has to change
# without a version being cut.
#
# Manual only, and that is the whole risk budget: this is the one workflow outside
# release.yaml that reads MAGUS_SIGNING_KEY, so it is reachable by nothing automatic.
#
# Nothing here builds magus. The index is derived from committed YAML by a Go program,
# so the job needs a toolchain and no workspace.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Sign the index and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the branch the pull request is opened from
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: ./.github/actions/release-index
        with:
          signing-key: ${{ secrets.MAGUS_SIGNING_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          reason: a manual refresh
