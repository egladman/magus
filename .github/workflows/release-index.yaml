name: Release index

# Rebuilds public/release/index.json from releases/*.yaml, signs it, and opens a pull
# request with the pair. A release reaches it through release.yaml's release-manifest,
# which stages the release's manifest on a branch off main and dispatches this workflow
# there, so the index is always main's releases plus the new one. Dispatched by hand, it
# covers the cases that are not a release - a manifest corrected, a release yanked, a key
# rotated - where the served index has to change without a version being cut.
#
# Dispatch only, and that is the whole risk budget: this is the one workflow outside
# release.yaml that reads MAGUS_SIGNING_KEY, and nothing starts it but a person or
# release.yaml's publish job, which holds that key already.
#
# The whole flow (build, sign, regenerate the manifests' derived files, branch, push,
# open the pull request) is the magusfile's release-index target; see release_index()
# in magusfile.buzz. That target regenerates through magus, so this job builds the
# magus this commit defines rather than getting by on a bare Go toolchain.

on:
  workflow_dispatch:
    inputs:
      reason:
        description: >-
          What produced this index, as a sentence fragment that names the commit and the
          pull request, e.g. "the v0.5.0 release". Empty reads "a manual refresh".
        required: false
        default: ''

# This job runs a bare `go run` and regenerates committed output, so it needs the encoder
# ci.yaml also pins. mise.toml carries it for a laptop, but mise-action runs with
# env: false here as everywhere else and exports nothing to the steps.
env:
  GOEXPERIMENT: jsonv2
  # Wires the github-actions CI provider in magusfile.buzz (job-log groups and
  # annotations). magus is told it runs under Actions, never detects it.
  CI_PROVIDER: github-actions

permissions:
  contents: read

jobs:
  publish:
    name: Sign the index and open a pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write        # push the branch the pull request is opened from
      pull-requests: write
      packages: write        # graph-generate:cd publishes the knowledge graph to GHCR
    steps:
      - name: Check required credentials before setup
        env:
          MAGUS_SIGNING_KEY: &index_signing_key ${{ secrets.MAGUS_SIGNING_KEY }}
          GHCR_USERNAME: &index_ghcr_username ${{ github.actor }}
          GHCR_TOKEN: &index_ghcr_token ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in MAGUS_SIGNING_KEY GHCR_USERNAME GHCR_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Release index credential $name is not available" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # release-index runs `generate:rw docs`, whose preflight execs pnpm. This job is
      # the manual escape hatch for a failed publish, so it had to be fixed alongside
      # release.yaml rather than after it: both were missing the toolchain, which is why
      # v0.4.2's index was never republished by hand either.
      #
      # cache: false: this job holds MAGUS_SIGNING_KEY, and main's cache scope is writable
      # by any main-scoped run, the merge queue's validation of pull-request code included.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - name: Publish the release index
        env:
          MAGUS_SIGNING_KEY: *index_signing_key
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: *index_ghcr_username
          GHCR_TOKEN: *index_ghcr_token
          REASON: ${{ inputs.reason || 'a manual refresh' }}
        run: magus run release-index:cd --no-default-charms --concurrency-profile aggressive -- "$REASON"
