name: Queue advice

# The merge-queue advisor: names the label that queues an approved pull request, and
# retracts it once the pull request is queued, merged or closed. Its own workflow because
# what it reads changes on labels, reviews and auto-merge, events ci.yaml does not run on
# and pr.yaml must not: a skipped required check on a label event would read as passing.
# The same events rerender the pinned "Merge queue" issue (the dashboard job).
#
# It runs main's advisor with main's magus and executes no pull-request code. A step whose
# script main lacks yet (a pull request that moves it) is skipped with a notice.

on:
  pull_request:
    types: [opened, reopened, synchronize, edited, labeled, unlabeled, closed, auto_merge_enabled, auto_merge_disabled]
  pull_request_review:
    types: [submitted, dismissed]
  # CI and PR finishing on a pull request change what its merge-queue status says; only
  # the waiting job runs on them.
  workflow_run:
    workflows: [CI, PR]
    types: [completed]

concurrency:
  group: queue-advice-${{ github.event.pull_request.number || github.event.workflow_run.id }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2

jobs:
  advice:
    name: queue advice
    # A fork is never queued, so there is nothing to name or retract.
    if: vars.MAGUS_PR_COMMENTS != 'false' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # The whole history, without blobs until a comparison reads one: `magus queue
      # reviews` walks from each approved commit and the head back to where they left main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # No restore either: this job holds pull-requests: write, and a pull request run
      # restores main's cache scope, which the queue's validation can write.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - uses: ./.github/actions/advice
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          merge-queue: 'true'
          merge-conflicts: 'false'
          target-outputs: 'false'
          doctor: 'false'
          version-floor: 'false'
          trusted-script-moved: 'false'
          blast-radius: 'false'
          unclaimed: 'false'
          skip-cache: 'false'
          conformance: 'false'
          missing-target: 'false'
          exported-api: 'false'
          change-risk: 'false'
          first-contribution: 'false'

  # merge-queue is main's only required status, and the queue posts it only once a pull
  # request is queued. This job posts it as pending on every other pull request, saying
  # why it waits, so an unqueued one reads "not queued: CI has not passed" or "ready: ..."
  # instead of "Expected" forever.
  #
  # statuses: write is safe here for two reasons. The job checks out main and runs
  # main's pull-requests.buzz, which posts nothing but pending and executes none of the
  # pull request's code. And the ruleset pins merge-queue to the queue app, so a status
  # the Actions token posts, of any state, never satisfies the requirement: a pull request
  # that edited this file to post success would still not merge.
  waiting:
    name: queue waiting status
    if: >-
      (github.event_name != 'workflow_run' &&
       github.event.pull_request.head.repo.full_name == github.repository) ||
      (github.event_name == 'workflow_run' &&
       (github.event.workflow_run.path == '.github/workflows/ci.yaml' || github.event.workflow_run.path == '.github/workflows/pr.yaml') &&
       github.event.workflow_run.event == 'pull_request' &&
       github.event.workflow_run.head_repository.full_name == github.repository &&
       github.event.workflow_run.pull_requests[0] != null)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read # check out main
      pull-requests: read # every open pull request, for its checks and a stack's labels
      checks: read # their checks, which say whether CI passed
      statuses: write # post merge-queue as pending, the only state it posts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Note whether main's hack/ci/pull-requests.buzz has the waiting step yet
        id: main
        run: |
          if grep -q 'step == "waiting"' hack/ci/pull-requests.buzz; then
            echo "waiting=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::main's hack/ci/pull-requests.buzz has no waiting step yet; this job resumes once the change that adds it merges"
          fi

      # A workflow_run names every pull request the run was for; a pull request event, one.
      - name: Post merge-queue as pending, saying why each pull request waits
        if: steps.main.outputs.waiting == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN: ${{ github.event.repository.default_branch }}
          PRS: ${{ github.event.pull_request.number || join(github.event.workflow_run.pull_requests.*.number, ' ') }}
        run: |
          set --
          for n in $PRS; do set -- "$@" --pr "$n"; done
          magus buzz hack/ci/pull-requests.buzz -- waiting --base "$MAIN" "$@"

  # queue-apply.yaml's dashboard job, run on the events that change a pull request's
  # place in the queue (a label, a review, auto-merge), so the pinned issue shows them
  # within a minute instead of after the next validation. Its own job, so issues: write
  # reaches no step that runs an advisor.
  dashboard:
    name: queue dashboard
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: queue-dashboard
      cancel-in-progress: true
    permissions:
      contents: read # check out main; read its tip
      pull-requests: read # every open and recently merged pull request
      checks: read # their checks, which say green
      statuses: read # the merge-queue status, which says why one waits
      actions: read # queue.yaml's running validation jobs
      issues: write # the pinned issue's body
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Note that main has no hack/ci/pull-requests.buzz yet
        if: hashFiles('hack/ci/pull-requests.buzz') == ''
        run: echo "::notice::hack/ci/pull-requests.buzz is not on main yet; this job runs main's copy and resumes once the change that adds it merges"

      # MAGUS_QUEUE_DASHBOARD_ISSUE names the pinned issue; unset, the empty --issue is refused.
      - name: Render the merge queue into the run summary and the pinned issue
        if: hashFiles('hack/ci/pull-requests.buzz') != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN: ${{ github.event.repository.default_branch }}
          ISSUE: ${{ vars.MAGUS_QUEUE_DASHBOARD_ISSUE }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: magus buzz hack/ci/pull-requests.buzz -- dashboard --all --base "$MAIN" --out "$GITHUB_STEP_SUMMARY" --issue "$ISSUE" --run-url "$RUN_URL"
