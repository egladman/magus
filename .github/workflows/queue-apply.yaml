name: Queue apply

# The merge queue's apply half: merges what a Queue run validates, each pull request as
# its own commit through the GitHub API with its own merge method, authored by its
# author, the moment its candidate and every candidate beneath it in its partition are
# green.
#
# workflow_run on `requested` rather than `completed`: this job starts beside validation
# and `magus queue apply run:<owner>/<name>/runs/<id>` follows it, downloading each
# verdict artifact as its validation job uploads it, so a green change merges while
# slower ones are still validating. `completed` would wait for the slowest job of the
# whole run. workflow_run always runs this file as main has it, with its own token and
# secrets.
#
# That does NOT make the run it follows trusted. workflow_run matches workflows by name,
# and fires for every run of one: a pull request's event runs the pull request's own
# copy of queue.yaml (a fork's included), and any file named Queue triggers it, so such a
# run can upload any plan and any verdict. planned and apply therefore follow only a run
# of .github/workflows/queue.yaml that a push or a dispatch started on the default branch
# of this repository, and `magus queue apply` checks the same of the run it reads
# (--base, --workflow) before it downloads anything. For a same-repository pull
# request's run, dispatch waits for its intent job and starts queue.yaml on main instead,
# with a token that can do nothing else.
#
# It never executes pull-request code: it builds magus, which runs the queue, from main,
# reads only verdicts and bundles from the artifacts, and rebuilds each candidate itself
# from the change's head. Where a merge needs generated files regenerated, it runs main's
# own regeneration in magus's sandbox once the workspace proves the change touches none
# of that regeneration's code; otherwise it takes the regenerated candidate validation
# bundled beside the verdict, only once it checks that commit is the one validation
# gated, sits on its own merge of the head, and differs from it only in files main's
# workspace declares as outputs. Anything else goes back to its author. Before
# each merge it re-checks approval, merge intent, base and merge method, and that its
# rebuild is the candidate validation gated; after each, it stops unless main carries the
# tree it predicted.
#
# The write credential is the queue's own GitHub App (the MAGUS_QUEUE_APP_CLIENT_ID
# variable and the magus-queue environment's MAGUS_QUEUE_APP_PRIVATE_KEY secret), and
# nothing bypasses a rule. Without the app both jobs that need a token fail: a run the
# Actions token dispatches starts no workflow_run, and a merge it makes starts no
# workflow, so the queue would validate and merge nothing.
#
# merge-queue is main's only required status; the queue posts success on it right before
# a merge, once main is still at the tip the merge was predicted onto, and GitHub's
# auto-merge then merges the pull request on behalf of whoever enabled it. Only when
# GitHub has not merged it within a minute does the queue merge it itself, as the app.
# Either merge pushes main and starts its workflows, the queue's next run included.
#
# The environment's branch policy releases the key to main alone, and a pull_request
# run is evaluated against its merge ref, so no pull request's workflow can read it. A
# repository without the environment gets it created empty on the first run.

# Queue's `requested` drives dispatch, planned and apply; CI's `completed` drives
# ci-completed. The trigger takes both actions of both workflows, so every job names the
# one it answers, and the other two combinations run nothing.
on:
  workflow_run:
    workflows: [Queue, CI]
    types: [requested, completed]

# One apply at a time. Any other run gets a group of its own, so it can never take the
# pending place of an apply waiting its turn.
concurrency:
  group: >-
    ${{ (github.event.action == 'requested' &&
    github.event.workflow_run.path == '.github/workflows/queue.yaml' &&
    github.event.workflow_run.head_repository.full_name == github.repository &&
    github.event.workflow_run.head_branch == github.event.repository.default_branch &&
    (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')) &&
    'queue-apply' || format('queue-apply-other-{0}-{1}', github.event.workflow_run.id, github.event.action) }}
  cancel-in-progress: false

# apply's own token only checks out main: every write is the queue app's.
permissions:
  contents: read

env:
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2

jobs:
  # Runs for a same-repository pull request's Queue run, which apply never follows: once
  # its intent job ran, it starts queue.yaml on main, which plans and validates the whole
  # queue. The intent job is the pull request's own file, so it is a hint; the worst a
  # forged one does is start one more run on main.
  dispatch:
    name: queue dispatch
    if: >-
      github.event.action == 'requested' &&
      github.event.workflow_run.path == '.github/workflows/queue.yaml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'pull_request' || github.event.workflow_run.event == 'pull_request_review')
    runs-on: ubuntu-latest
    # For the queue app's key: a run the Actions token dispatches starts no workflow_run,
    # so this file would never follow the validation it asked for and nothing would merge.
    environment: magus-queue
    timeout-minutes: 20
    permissions:
      contents: read # check out main's gha-queue.buzz
      actions: write # read the run's jobs, dispatch queue.yaml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # Scoped to dispatching, unlike apply's: this job needs nothing else. With no app the
      # step fails, since a dispatch on any other token is one apply never follows.
      - id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAGUS_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAGUS_QUEUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write

      - name: Start a validation run on main once the pull request's run saw merge intent
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          RUN: ${{ github.event.workflow_run.id }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: magus buzz tools/gha-queue.buzz -- dispatch --run "$RUN" --base "$MAIN"

  # Runs when CI finishes for a same-repository pull request. A queued change whose
  # required checks were running, or ran again on an update commit the queue pushed,
  # waits for exactly this, and no other event starts the queue once they report: this
  # starts queue.yaml on main when the run's head is still the head of a pull request
  # that carries merge intent. GitHub lists no pull request for a fork's run.
  ci-completed:
    name: queue after ci
    if: >-
      github.event.action == 'completed' &&
      github.event.workflow_run.path == '.github/workflows/ci.yaml' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0] != null
    runs-on: ubuntu-latest
    # For the queue app's key, as dispatch's: only a dispatch on it is one apply follows.
    environment: magus-queue
    timeout-minutes: 20
    permissions:
      contents: read # check out main's gha-queue.buzz
      actions: read # read the CI run
      pull-requests: read # read whether its pull requests carry merge intent
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - id: ci
        name: Read whether CI finished on a queued pull request's head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.event.workflow_run.id }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: magus buzz tools/gha-queue.buzz -- ci-queued --run "$RUN" --base "$MAIN"

      # Scoped to dispatching, as dispatch's is, and minted only when there is one to make.
      - id: app
        if: steps.ci.outputs.queued == 'true'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.MAGUS_QUEUE_APP_CLIENT_ID }}
          private-key: ${{ secrets.MAGUS_QUEUE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: write

      - name: Start a validation run on main
        if: steps.ci.outputs.queued == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: magus buzz tools/gha-queue.buzz -- start --base "$MAIN"

  # Follows only a run main's own queue.yaml made: a push or a dispatch, on main, of this
  # repository. Queue's plan job is skipped on a run cancelled before it started, and
  # apply is skipped with it, outside the magus-queue environment, so such a run records
  # no deployment.
  planned:
    name: queue planned
    if: >-
      github.event.action == 'requested' &&
      github.event.workflow_run.path == '.github/workflows/queue.yaml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      actions: read
    outputs:
      ran: ${{ steps.plan.outputs.ran }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - id: plan
        name: Wait for validation's plan to run or be skipped
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN: ${{ github.event.workflow_run.id }}
        run: magus buzz tools/gha-queue.buzz -- planned --run "$RUN"

  apply:
    name: queue apply
    needs: planned
    # planned's condition again, so the job holding the write credential never rests on
    # another job's alone.
    if: >-
      needs.planned.outputs.ran == 'true' &&
      github.event.action == 'requested' &&
      github.event.workflow_run.path == '.github/workflows/queue.yaml' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.head_branch == github.event.repository.default_branch &&
      (github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: magus-queue
    # Validation's own ceiling plus the plan job's.
    timeout-minutes: 150
    steps:
      # No credential persists: the queue's token is minted below, and the credential
      # helper hands it to git. A full clone, as queue.yaml's validate job has, since
      # apply rebuilds each candidate the same way.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      # main's source, never the pull request's: this checkout is the default branch.
      - id: magus
        uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .
          queue-app-client-id: ${{ vars.MAGUS_QUEUE_APP_CLIENT_ID }}
        env:
          MAGUS_QUEUE_APP_PRIVATE_KEY: ${{ secrets.MAGUS_QUEUE_APP_PRIVATE_KEY }}

      # git pushes a regeneration to a queued branch with whatever GITHUB_TOKEN the
      # pushing step holds: the app's, so the push starts the branch's workflows rather
      # than waiting for approval.
      - name: Let git push with the step's token
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main's regeneration runs `magus`, which runs `go` off PATH: the pinned toolchain,
      # not the one setup-magus's source build prepended.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - name: Require the queue app
        if: steps.magus.outputs.queue-token == ''
        run: |
          echo "::error::the merge queue needs its GitHub App: set the MAGUS_QUEUE_APP_CLIENT_ID variable and the magus-queue environment's MAGUS_QUEUE_APP_PRIVATE_KEY secret" >&2
          exit 1

      - name: Merge each change as it goes green
        env:
          GITHUB_TOKEN: ${{ steps.magus.outputs.queue-token }}
          MERGEQUEUE_TOKEN: ${{ steps.magus.outputs.queue-token }}
          RUN: ${{ github.event.workflow_run.id }}
          MAIN: ${{ github.event.repository.default_branch }}
          APP: ${{ steps.magus.outputs.queue-app-slug }}
          COMMITTER: ${{ steps.magus.outputs.queue-committer }}
        run: magus buzz tools/gha-queue.buzz -- apply --run "$RUN" --base "$MAIN" --app "$APP" --committer "$COMMITTER"
