name: Queue apply

# The merge queue's apply half: merges what a Queue run validates, each pull request as
# its own commit through the GitHub API with its own merge method, authored by its
# author, the moment its candidate and every candidate beneath it in its partition are
# green.
#
# workflow_run on `requested` rather than `completed`: this job starts beside validation
# and `magus queue apply run:<owner>/<name>/runs/<id>` follows it, downloading each
# verdict artifact as its validation job uploads it, so a green change merges while
# slower ones are still validating. `completed` would wait for the slowest job of the
# whole run. workflow_run always runs this file as main has it, with its own token and
# secrets, which a pull request cannot reach.
#
# It never executes pull-request code: it builds magus, which runs the queue, from main,
# reads only verdicts from the artifacts, and rebuilds each candidate itself from the
# change's head. Where a merge needs generated files regenerated, it runs main's own
# regeneration in magus's sandbox, and only after the workspace proves the change touches
# none of that regeneration's code; otherwise the change goes back to its author. Before
# each merge it re-checks approval, merge intent, base and merge method, and that its
# rebuild is the candidate validation gated; after each, it stops unless main carries the
# tree it predicted.
#
# The write credential is this job's own Actions token unless the magus-queue
# environment holds the queue's own GitHub App (the MAGUS_QUEUE_APP_CLIENT_ID variable
# and the MAGUS_QUEUE_APP_PRIVATE_KEY secret), and nothing bypasses a rule either way.
# merge-queue is main's only required status; the queue posts success on it right before
# a merge, once main is still at the tip the merge was predicted onto, and GitHub's
# auto-merge then merges the pull request on behalf of whoever enabled it, which starts
# main's workflows. Only when GitHub has not merged it within a minute does the queue
# merge it itself. The Actions token's merges start no workflow, so on it the job then
# dispatches ci.yaml, cd.yaml and the queue's next run on main; the app's merges and
# pushes start them themselves, so on it nothing is dispatched.
#
# The environment's branch policy releases the key to main alone, and a pull_request
# run is evaluated against its merge ref, so no pull request's workflow can read it. A
# repository without the environment gets it created empty on the first run.

on:
  workflow_run:
    workflows: [Queue]
    types: [requested]

concurrency:
  group: queue-apply
  cancel-in-progress: false

permissions:
  contents: write # merge, and push a regeneration onto a queued branch
  pull-requests: write # comment on a kick-back and disable its auto-merge
  statuses: write # merge-queue
  actions: write # follow the validation run, download its artifacts, dispatch main's runs

env:
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2

jobs:
  apply:
    name: queue apply
    runs-on: ubuntu-latest
    environment: magus-queue
    # Validation's own ceiling plus the plan job's.
    timeout-minutes: 150
    steps:
      # No credential persists: the queue's token is minted below, and the credential
      # helper hands it to git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      # main's source, never the pull request's: this checkout is the default branch.
      - id: magus
        uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .
          queue-app-client-id: ${{ vars.MAGUS_QUEUE_APP_CLIENT_ID }}
        env:
          MAGUS_QUEUE_APP_PRIVATE_KEY: ${{ secrets.MAGUS_QUEUE_APP_PRIVATE_KEY }}

      # git pushes a regeneration to a queued branch with whatever GITHUB_TOKEN the
      # pushing step holds: the app's token when there is one, so the push starts the
      # branch's workflows rather than waiting for approval.
      - name: Let git push with the step's token
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # main's regeneration runs `magus`, which runs `go` off PATH: the pinned toolchain,
      # not the one setup-magus's source build prepended.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # On the Actions token, also dispatches main's runs once the queue merged anything
      # itself, even when applying then failed.
      - name: Merge each change as it goes green
        env:
          QUEUE_STEP: apply
          GITHUB_TOKEN: ${{ steps.magus.outputs.queue-token || secrets.GITHUB_TOKEN }}
          MERGEQUEUE_TOKEN: ${{ steps.magus.outputs.queue-token || secrets.GITHUB_TOKEN }}
          COMMITTER: ${{ steps.magus.outputs.queue-committer }}
          APP: ${{ steps.magus.outputs.queue-app-slug }}
          DISPATCH: ${{ steps.magus.outputs.queue-token == '' }}
          RUN: ${{ github.event.workflow_run.id }}
          MAIN: ${{ github.event.repository.default_branch }}
        run: magus buzz tools/gha-queue.buzz
