name: Queue

# The merge queue's validation half. A pull request joins the queue when auto-merge is
# enabled on it. `magus vcs queue` stages every queued pull request approved at its head
# on main plus the changes ahead of it in its partition, and gates the stages with
# `magus affected ci`, several at once. It writes a manifest and the staged commits;
# queue-land.yaml lands them.
#
# This job executes pull-request code, so its token reads and nothing more. Nothing here
# posts a status, comments or merges: that is queue-land.yaml, which holds the write
# credential and executes no pull-request code.
#
# The verb, not a magusfile target: the queue runs nested `magus run` and `magus affected`
# over whatever projects a change reaches, and a target holding a project's lock is refused
# those (MGS3007), the same reason ci.yaml verifies note anchors outside a target.

on:
  pull_request:
    branches: [main]
    # auto_merge_enabled is the entry; synchronize and a review can make a queued pull
    # request ready without enabling auto-merge again.
    types: [auto_merge_enabled, synchronize]
  pull_request_review:
    types: [submitted]
  # Every landing moves the base the rest of the queue waits on. The landing credential
  # is not the Actions token, so its merges start this.
  push:
    branches: [main]
  workflow_dispatch:

# One validation at a time; a newer event waits rather than cancelling a run that may be
# about to hand its manifest to landing.
concurrency:
  group: magus-queue-validate
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2

jobs:
  validate:
    name: magus queue validate
    # A fork's pull request is never staged: the queue cannot push its regeneration.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.auto_merge != null)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      # main, never the pull request: the queue plans with main's declarations and runs
      # main's magus. It checks out each staged change in a worktree of its own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # cache_save: false because the stages run queued pull requests' code.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache_save: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # Pull request refs are fetched over the checkout's remote, which carries no
      # credential; the repository is public, so the read needs none.
      - name: Validate the queue
        uses: ./.github/actions/magus
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          command: vcs queue --out ${{ runner.temp }}/queue -- --no-default-charms

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magus-queue
          path: ${{ runner.temp }}/queue
          if-no-files-found: ignore
          retention-days: 1
