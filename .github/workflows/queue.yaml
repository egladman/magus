name: Queue

# The merge queue's validation half, run by the mergequeue CLI (libs/mergequeue). A pull
# request joins the queue when auto-merge is enabled on it. The plan job lists the queue,
# checks approval at each head and partitions it by the affected sets
# `magus affected ci --plan --stdin` reports; each stage job then validates one change on
# main plus the changes ahead of it in its partition, gated with `magus affected ci`
# against the stage it was built onto. Every stage uploads its verdict the moment it finishes, and
# queue-land.yaml, already running, lands it.
#
# This workflow executes pull-request code, so its token reads and nothing more. Nothing
# here posts a status, comments or merges: that is queue-land.yaml, which holds the write
# credential and executes no pull-request code. It cannot post statuses either, which is
# why verdicts travel as artifacts: a job running pull-request code with statuses: write
# could set the very status branch protection requires.

on:
  pull_request:
    branches: [main]
    # auto_merge_enabled is the entry; synchronize and a review can make a queued pull
    # request ready without enabling auto-merge again.
    types: [auto_merge_enabled, synchronize]
  pull_request_review:
    types: [submitted]
  # Every landing moves the base the rest of the queue waits on. Landing merges with the
  # Actions token, which starts no workflow, so queue-land.yaml dispatches this instead;
  # push covers a merge made any other way.
  push:
    branches: [main]
  workflow_dispatch:

# One validation at a time; a newer event waits rather than cancelling a run whose
# verdicts landing is already following.
concurrency:
  group: magus-queue-validate
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2

jobs:
  plan:
    name: queue plan
    # The provider lists forks too and the plan refuses them by name; skipping the event
    # here only saves a run nobody's change can use.
    if: >-
      github.event_name == 'push' || github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.event.pull_request.auto_merge != null)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      # main, never the pull request: the plan uses main's declarations and main's magus.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache_save: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Build mergequeue
        run: |
          echo "$(mise where go)/bin" >> "$GITHUB_PATH"
          "$(mise where go)/bin/go" -C libs/mergequeue build -o "$RUNNER_TEMP/bin/mergequeue" ./cmd/mergequeue
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - id: plan
        name: Plan the queue
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPTH: '3'
        run: |
          q="$RUNNER_TEMP/queue"
          mkdir -p "$q"
          mergequeue list --provider github --base main > "$q/changes.json"
          mergequeue plan --changes "$q/changes.json" --provider github --depth "$DEPTH" \
            --affected 'magus affected ci --plan --stdin' --out "$q/plan.json"
          # Speculation depth: the first DEPTH changes of each partition get a stage job;
          # the rest wait for the run the next landing starts.
          matrix=$(jq -c '{include: [.depth as $d | (.partitions // [])[] | .[:$d][] | {change: .id}]}' "$q/plan.json")
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "count=$(jq '.include | length' <<<"$matrix")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magus-queue-plan
          path: ${{ runner.temp }}/queue/plan.json
          retention-days: 1

  stage:
    name: queue stage #${{ matrix.change }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # cache_save: false because the stages run queued pull requests' code.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache_save: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Build mergequeue
        run: |
          echo "$(mise where go)/bin" >> "$GITHUB_PATH"
          "$(mise where go)/bin/go" -C libs/mergequeue build -o "$RUNNER_TEMP/bin/mergequeue" ./cmd/mergequeue
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: magus-queue-plan
          path: ${{ runner.temp }}/queue

      # Pull request refs are fetched over the checkout's remote, which carries no
      # credential; the repository is public, so the read needs none.
      - name: Validate #${{ matrix.change }}
        env:
          CHANGE: ${{ matrix.change }}
          # Each stage is a worktree of its own; one cache lets a stage replay what the
          # stages below it already ran.
          MAGUS_CACHE_DIR: ${{ github.workspace }}/.magus
        run: |
          q="$RUNNER_TEMP/queue"
          # The hooks' variables are for mergequeue to set, so they stay single-quoted.
          # shellcheck disable=SC2016
          mergequeue validate --plan "$q/plan.json" --only "$CHANGE" --verdicts "$q/verdicts" \
            --gate 'magus affected ci --base "$MERGEQUEUE_ONTO" --no-default-charms' \
            --regenerate 'magus affected generate:rw --base "$MERGEQUEUE_ONTO"'

      # The directory's contents become the artifact's root: verdict.json and, for a green
      # change, stage.bundle.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: magus-queue-verdict-${{ matrix.change }}
          path: ${{ runner.temp }}/queue/verdicts/${{ matrix.change }}
          if-no-files-found: error
          retention-days: 1
