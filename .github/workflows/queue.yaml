name: Queue

# The merge queue's validation half, run by `magus queue` (internal/queue). A pull
# request joins the queue when auto-merge is enabled on it, or when a "merge-queue:
# <method>" label is on it or on its stack's top. The plan job lists the queue, checks
# approval at each head and partitions it by the affected sets the magus workspace
# reports through the Go SDK; each validate job then validates one change on main plus
# the changes ahead of it in its partition, gated with `magus affected ci` against the
# candidate it was built onto. Every job uploads its verdict the moment it finishes, and
# queue-apply.yaml, already running, merges it.
#
# This workflow executes pull-request code, so its token reads and nothing more. Nothing
# here posts a status, comments or merges: that is queue-apply.yaml, which holds the write
# credential and executes no pull-request code. It cannot post statuses either, which is
# why verdicts travel as artifacts: a job running pull-request code with statuses: write
# could set the very status branch protection requires.
#
# Only a run on main started by a push or a dispatch plans and validates. A pull request
# event runs the pull request's own copy of this file, which could upload any plan and any
# verdict, so apply follows no such run: there the intent job alone runs, and
# queue-apply.yaml answers it by dispatching this workflow on main.

on:
  # No branches filter: a stacked pull request targets the branch below it, not main.
  pull_request:
    # auto_merge_enabled is the entry, and a "merge-queue: <method>" label; synchronize
    # and a review can make a queued pull request ready without either again.
    types: [auto_merge_enabled, labeled, synchronize]
  pull_request_review:
    types: [submitted]
  # Every merge moves the base the rest of the queue waits on, and every merge pushes
  # main, the queue app's included.
  push:
    branches: [main]
  # queue-apply.yaml's dispatch job starts a validation here for a pull request's intent.
  workflow_dispatch:

# One validation at a time; a newer event waits rather than cancelling a run whose
# verdicts apply is already following. A pull request event validates nothing, so it
# waits on no validation.
concurrency:
  group: >-
    ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && 'queue-validate' ||
    format('queue-intent-{0}', github.run_id) }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2
  # Wires the github-actions CI provider in magusfile.buzz (job-log groups and
  # annotations). magus is told it runs under Actions, never detects it.
  CI_PROVIDER: github-actions

jobs:
  # Runs where a pull request event carries merge intent. queue-apply.yaml reads whether
  # it ran and dispatches a run on main; it is a hint, never a verdict. The provider lists
  # forks too and the plan refuses them by name; skipping them here only saves a run
  # nobody's change can use. Only a method's label is intent: the queue's status labels
  # share the prefix.
  intent:
    name: queue intent
    if: >-
      github.event_name != 'push' && github.event_name != 'workflow_dispatch' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.auto_merge != null && github.event.pull_request.base.ref == 'main') ||
       contains(fromJSON('["merge-queue: squash", "merge-queue: rebase", "merge-queue: merge"]'), github.event.label.name) ||
       contains(github.event.pull_request.labels.*.name, 'merge-queue: squash') ||
       contains(github.event.pull_request.labels.*.name, 'merge-queue: rebase') ||
       contains(github.event.pull_request.labels.*.name, 'merge-queue: merge'))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Merge intent; queue-apply.yaml starts the run on main that validates it
        run: 'true'

  plan:
    name: queue plan
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
    steps:
      # main, never the pull request: the plan uses main's declarations and main's magus.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # No restore and no save: main's cache scope is writable by a validate job's
      # escaped hook, and the plan decides what apply merges.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. magus runs `go` off PATH, so re-adding mise's
      # puts the pinned toolchain back in front for the plan's workspace.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # Every step's logic is tools/gha-queue.buzz, one subcommand each.
      # Speculation depth 8: the first eight changes of each partition get a validate job;
      # the rest wait for the run the next merge starts. Nearly every change here touches
      # the root project, so the queue is one partition, and at 3 it validated three
      # changes per run while the rest waited a full run each.
      - id: plan
        name: Plan the queue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: magus buzz tools/gha-queue.buzz -- plan --depth 8

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mergequeue-plan
          path: ${{ runner.temp }}/queue/plan.json
          retention-days: 1

  validate:
    name: queue validate #${{ matrix.change }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      # A full clone: the queue builds each candidate by merging in a checkout of this
      # one, and refuses a partial clone, where git can ask the remote for a blob the
      # merge just wrote.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      # No save: validation runs queued pull requests' code. No restore either: an entry
      # an earlier run's hook planted would decide this verdict. cache_save: false alone
      # stops only the action's own save, not a hook holding the runtime token.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache: false

      # The gate runs the same `ci` a shard does, compress-cgo-test included.
      - uses: ./.github/actions/codec-deps

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      # The gate and the regeneration run `magus`, which runs `go` off PATH: the pinned
      # toolchain, not the one setup-magus's source build prepended.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mergequeue-plan
          path: ${{ runner.temp }}/queue

      # `queue validate --remote-cache-read` reads these to serve hooks main's signed
      # magus cache through a read-only loopback proxy; the hooks get a stand-in token and
      # never these. The runner injects them into an action's process but not into a
      # `run:` step, so re-exporting them takes a JS action, as in ci.yaml. Missing, the
      # validate step refuses to start rather than running cold.
      - name: Export the Actions cache service credentials
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            for (const name of ['ACTIONS_RESULTS_URL', 'ACTIONS_RUNTIME_TOKEN']) {
              const value = process.env[name]
              if (!value) continue
              if (name.endsWith('_TOKEN')) core.setSecret(value)
              core.exportVariable(name, value)
            }

      # Pull request refs are fetched over the checkout's remote, which carries no
      # credential; the repository is public, so the read needs none.
      # Every hook keeps its caches in its own candidate's scratch directory
      # (tools/gha-queue.buzz), so no change beneath this one can plant a cache entry its
      # gate replays as green. The remote cache it reads is main's, verified against
      # MAGUS_CACHE_REMOTE_TRUSTED_KEYS, which the queue pins for every hook.
      # Candidates are checked out under TMPDIR, outside the workspace mise-action
      # trusts, so the trust list names both; hooks receive it through magus.yaml's
      # sandbox passthrough.
      - name: Validate #${{ matrix.change }}
        env:
          CHANGE: ${{ matrix.change }}
          MAGUS_CACHE_REMOTE_TRUSTED_KEYS: ${{ vars.MAGUS_CACHE_PUBLIC_KEY }}
          TMPDIR: ${{ runner.temp }}
          MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}:${{ runner.temp }}
        run: magus buzz tools/gha-queue.buzz -- validate --change "$CHANGE"

      # The directory's contents become the artifact's root: verdict.json, and
      # candidate.bundle when the regeneration committed anything.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mergequeue-verdict-${{ matrix.change }}
          path: ${{ runner.temp }}/queue/verdicts/${{ matrix.change }}
          if-no-files-found: error
          retention-days: 1
