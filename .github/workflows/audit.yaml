name: Audit

# The out-of-band checks: expensive, non-blocking, and answering a question that only
# moves when something OUTSIDE this branch does - a new magus release, a model provider's
# behaviour, a generator that stopped being deterministic. Nothing here gates a merge or
# publishes. That is why they are off the PR path rather than continue-on-error, which is
# where `compat` used to live: a check that never blocks and never changes with the diff
# is noise on a pull request and a real signal on a schedule.

on:
  schedule:
    # Monday, so the answer is waiting at the start of the week. :17 keeps it off the
    # top-of-hour rush GitHub delays hardest.
    - cron: '17 5 * * 1'
  workflow_dispatch:

# Newest wins: cron and a hand dispatch overlap in practice, and an older run's answer to
# "is this still true" is worthless once a newer one starts.
concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # PR-controlled mise.toml must not execute config hooks or plugins.
  MISE_SAFE: '1'
  GOEXPERIMENT: jsonv2

jobs:
  compat:
    # Can the magus users already have still drive this workspace? The CI shards answer
    # "does this change work", built from this commit's source; this answers a different
    # question against the newest published release, and it changes when a RELEASE ships,
    # not when a diff lands. A failure means cut a release, not fix a branch.
    name: magus compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      # install stays ON (the default). With install: false the action adds the shims
      # directory to PATH and computes the exported PATH BEFORE any tool exists, so a
      # later `mise install` step put pnpm and node somewhere no subsequent step could
      # see - `os.exec pnpm: exit -1`, the child never launching. Letting the action do
      # the install also re-enables its cache: it only saves when it installed.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      - name: Install codec build dependencies
        # Install first, update only on failure; see the note in ci.yaml for why update is the
        # expensive half and why the image's cached index already satisfies both packages.
        run: |
          sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev \
            || { sudo apt-get update -o Acquire::Retries=3 -o Acquire::Languages=none \
                 && sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev; }

      - name: Resolve magus release
        id: resolve_magus
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="$(gh release view --repo egladman/magus --json tagName -q .tagName)"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-magus
        id: magus
        with:
          installation-strategy: prebuilt
          git-ref: ${{ steps.resolve_magus.outputs.tag }}

      # setup-magus's source build provisions its own Go via actions/setup-go, which
      # PREPENDS to PATH and outranks mise's. Re-adding mise's puts it back in front.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # prebuilt, not automatic: a silent fallback to a source build would make this job
      # compare source against source and report compatibility it never checked.
      - name: Confirm a real release was installed
        shell: bash
        env:
          VERSION: ${{ steps.magus.outputs.version }}
          INSTALL_SOURCE: ${{ steps.magus.outputs.install-source }}
          COMMIT: ${{ steps.magus.outputs.commit }}
        run: |
          echo "magus $VERSION ($INSTALL_SOURCE, $COMMIT)" >> "$GITHUB_STEP_SUMMARY"
          [[ "$INSTALL_SOURCE" == "prebuilt" ]]

      # ls, not doctor: this asks only "can the release evaluate every magusfile", and ls
      # answers it by listing each project's targets. doctor is opinionated - it would
      # fail on workspace conventions that have nothing to do with the binary's version.
      - name: Load the workspace with the released magus
        run: magus ls

      - name: Run ci with the released magus
        run: magus affected ci --no-default-charms

  determinism:
    # Byte-stability is an invariant drift gating, cache replay, and regenerate-to-resolve
    # merges all rest on; see docs/concepts/generated-files.md.
    #
    # The WHOLE-TREE sweep, which is the half of the question this file's charter covers: a
    # generator that stopped being deterministic because a TOOL moved, in a project no diff
    # touched. No pull request can be expected to find that, which is what makes a schedule
    # the right trigger.
    #
    # The other half - a generator the diff destabilised - lives in ci.yaml's `plan` job,
    # which replays every generate-declaring project except docs. Do not fold them back together:
    # this job ran red for two days in its first outing with nobody assigned, which is what a
    # check on the wrong side of that line looks like.
    name: generator determinism
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      - name: Install codec build dependencies
        # Install first, update only on failure; see the note in ci.yaml for why update is the
        # expensive half and why the image's cached index already satisfies both packages.
        run: |
          sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev \
            || { sudo apt-get update -o Acquire::Retries=3 -o Acquire::Languages=none \
                 && sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev; }

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # rw is load-bearing: without it generate's own drift gate throws the moment a
      # generator rewrites a committed file, killing the run before replay compares
      # anything. Children still run; ctx.needs precedes the charm check.
      - name: Replay every generator and compare declared outputs
        run: magus run generate:rw --race=replay

  release-smoke:
    # Does the release path still produce an asset the release upload would collect?
    #
    # v0.3.0 to v0.4.0 saw ZERO release.yaml runs, so the combined library+root flow had
    # never executed end to end when it was asked to publish, and it published nothing.
    # Every other layer here checks the path; this runs it, on a cadence.
    #
    # Not on the PR path, which is the real choice. release-build is a full cross-compile
    # plus a THIRD-PARTY-NOTICES pass reading every dependency's license out of the module
    # cache, so it costs minutes per run to answer a question almost no diff moves. What it
    # protects against is STALENESS, and a weekly run bounds that to seven days against the
    # six months this went unrun.
    #
    # Its own job rather than folded into `determinism` despite sharing a trigger: that
    # job's charter is generator byte-stability, and a release build is not a generator, so
    # a red X there would misname what broke.
    #
    # The cost, stated: audit is non-blocking by trigger, so a regression merges and is
    # caught up to a week later. The blocking half is the release preflight, which runs
    # before the tag exists. That stops a bad release; this finds a rotting build path.
    name: release build smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history and tags, because version() names the asset and resolving it is
          # half of what this job checks.
          fetch-depth: 0
          filter: blob:none

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      # The host platform only. The invariant does not vary by platform: the version names
      # the asset, and goos and goarch are fixed tokens. One archive covers the build, the
      # notices pass, and the naming.
      #
      # --no-default-charms because magus.yaml sets `default_charms: [rw]`, and this is a
      # read-only question.
      - name: Build one release asset
        run: magus run release-build --no-default-charms

      # The same glob release.yaml uploads with, asserted against the names magus computed.
      # A green build writing an archive the upload cannot see is what shipped as v0.4.0.
      - uses: ./.github/actions/assert-release-assets
        with:
          assets-glob: dist/magus_*.tar.gz

  toolchain:
    # Has anything this workspace runs been superseded upstream? Squarely this
    # workflow's shape: it changes when a THIRD PARTY cuts a tag, never when a diff
    # lands, so on the PR path it would be noise that fires on unrelated changes.
    #
    # It reports and never fails. tools/toolchain.buzz makes no selection and keeps no
    # state by design - there is no "move to this version" here and no first-seen file,
    # because that is a lockfile with another name. So the job's value is the log, and
    # a red X would be claiming an authority the tool deliberately does not take.
    # continue-on-error keeps a `git ls-remote` against someone else's host from
    # colouring the run.
    #
    # The blocking half is elsewhere and needs no network: the `tools` window in
    # magusfile.buzz, checked against the version magus already probes.
    name: toolchain currency
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false

      # source-path, not git-ref: this runs the magus THIS commit defines, so a
      # magusfile change that adds or renames a wired tool is exercised by the same run
      # that introduces it.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Report installed versions against upstream tags
        run: magus run toolchain-report .
