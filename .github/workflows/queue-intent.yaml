name: Queue intent

# The pull request half of the merge queue's trigger. A pull request event runs the pull
# request's own copy of a workflow, so this file plans, validates and posts nothing: its
# one job marks the events that carry merge intent, and queue-apply.yaml, which follows
# every run of it through workflow_run, answers with main's code. Its dispatch job starts
# queue.yaml on main once the intent job ran, and its reviews job reclassifies approvals
# on every run. Kept apart from queue.yaml so a pull request shows one check here, not
# queue.yaml's plan and validate jobs skipped.
#
# A pull request joins the queue when auto-merge is enabled on it, or when a "merge-queue:
# <method>" label is on it or on its stack's top.

on:
  # No branches filter: a stacked pull request targets the branch below it, not main.
  pull_request:
    # auto_merge_enabled is the entry, and a "merge-queue: <method>" label; synchronize
    # and a review can make a queued pull request ready without either again.
    # hack/ci/merge-queue.buzz's tests hold these to the actions intent's if: weighs.
    types: [auto_merge_enabled, labeled, synchronize]
  pull_request_review:
    types: [submitted]

concurrency:
  group: queue-intent-${{ github.run_id }}
  cancel-in-progress: false

permissions: {}

jobs:
  # queue-apply.yaml reads whether this ran and dispatches a run on main; it is a hint,
  # never a verdict. The provider lists forks too and the plan refuses them by name;
  # skipping them here only saves a run nobody's change can use. Each action counts only
  # for what it adds: a label only for a method's (the queue's own marks fire labeled
  # too), a review only once it approves, auto-merge only where no method label already
  # queued the pull request. A synchronize counts wherever intent stands.
  intent:
    name: queue intent
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository && (
        (github.event.action == 'labeled' &&
         contains(fromJSON('["merge-queue: squash", "merge-queue: rebase", "merge-queue: merge"]'), github.event.label.name)) ||
        (github.event.action == 'auto_merge_enabled' && github.event.pull_request.base.ref == 'main' &&
         !contains(github.event.pull_request.labels.*.name, 'merge-queue: squash') &&
         !contains(github.event.pull_request.labels.*.name, 'merge-queue: rebase') &&
         !contains(github.event.pull_request.labels.*.name, 'merge-queue: merge')) ||
        ((github.event.action == 'synchronize' ||
          (github.event.action == 'submitted' && github.event.review.state == 'approved')) &&
         ((github.event.pull_request.auto_merge != null && github.event.pull_request.base.ref == 'main') ||
          contains(github.event.pull_request.labels.*.name, 'merge-queue: squash') ||
          contains(github.event.pull_request.labels.*.name, 'merge-queue: rebase') ||
          contains(github.event.pull_request.labels.*.name, 'merge-queue: merge'))))
    runs-on: ubuntu-latest
    timeout-minutes: 1
    permissions: {}
    steps:
      - name: Merge intent; queue-apply.yaml starts the run on main that validates it
        run: 'true'
