name: Release

# Releases the BINARIES: cross-compiled archives, container images, and their
# signatures, on a v* tag. Everything a main push publishes is in cd.yaml.
#
# STATIC ONLY by default. `magus run release-build:dynamic` still produces the
# dynamically linked build and is fully supported for anyone who wants it - it is simply
# not published unless someone asks, via the `include_dynamic_builds` dispatch input
# below. The reason is that a dynamic archive is only useful where its libraries resolve:
# on darwin the linker bakes in the build machine's Homebrew prefix (/opt/homebrew/...),
# which no other Mac has, and Windows has the same shape through MSYS2. Only Linux
# resolves them by SONAME. Rather than publish an artifact that works on one platform of
# three, the whole cgo toolchain here - MSYS2, mingw packages, the codec dev headers - is
# gated behind that input.
#
# The static build takes `-tags noffi`, and that is not optional: purego's
# cgo_import_dynamic would otherwise give a "static" binary a PT_INTERP and a libc
# dependency, so the archive would not run on a musl or scratch host.
#
# Renamed from cd.yaml, because a v* tag is a deliberate release and not continuous
# delivery - cd.yaml now holds the thing that actually is. The rename is not free:
# cosign pins the workflow PATH as the certificate identity, so every image published
# before it carries `.github/workflows/cd.yaml` and no longer verifies against the
# command in docs/guides/setup/container-image.md. That was an accepted cost while
# this project has no users; it will not be once it does. Treat this filename as frozen
# from the first release published under it.

on:
  push:
    tags:
      - 'v*'
  # Dispatch on main with a tag to rerun its release under the workflow main carries.
  # Every unit is write-once (release-publish, release-manifest, spell-publish and
  # image-build in magusfile.buzz): a rerun publishes what is missing and keeps what is
  # already published, so finishing an interrupted release and rerunning a finished one
  # are the same command.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to (re)run; empty runs the tag this was dispatched on'
        type: string
        required: false
        default: ''
      immutable:
        description: 'Keep what is already published; uncheck to replace it'
        type: boolean
        default: true
      include_dynamic_builds:
        description: 'Include dynamically linked prebuilt binaries'
        type: boolean
        default: false

# One live CD run per tag. Re-pushing a tag (e.g. to pick up a CD fix before the
# release publishes) cancels the previous run so duplicate release jobs never race
# for runners or the publish step. Keyed on the ref, so different tags still run
# independently.
concurrency:
  group: cd-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read  # default; publish overrides to write

env:
  # Wires the github-actions CI provider in magusfile.buzz (job-log groups and
  # annotations). magus is told it runs under Actions, never detects it.
  CI_PROVIDER: github-actions
  # Stamped into every binary as `magus version`'s built_by, and matched against the
  # job_workflow_ref a keyless signature carries. magusfile.buzz reads this rather
  # than the runner's GITHUB_WORKFLOW_REF, so only a build told its pedigree claims one.
  BUILT_BY: ${{ github.workflow_ref }}

jobs:
  preflight:
    name: Resolve the release
    runs-on: ubuntu-latest
    permissions:
      contents: read  # read the tag and its GitHub Release
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      commit: ${{ steps.release.outputs.commit }}
      build: ${{ steps.release.outputs.build }}
      charms: ${{ steps.release.outputs.charms }}
    steps:
      # Keep these values linked to the steps that use them. A check with different
      # wiring could pass while publication still lacks a credential.
      - name: Check required credentials before building
        env:
          MAGUS_SIGNING_KEY: &release_signing_key ${{ secrets.MAGUS_SIGNING_KEY }}
          GHCR_USERNAME: &release_ghcr_username ${{ github.actor }}
          GHCR_TOKEN: &release_ghcr_token ${{ secrets.GITHUB_TOKEN }}
        run: |
          for name in MAGUS_SIGNING_KEY GHCR_USERNAME GHCR_TOKEN; do
            if [ -z "${!name}" ]; then
              echo "::error::Release credential $name is not available" >&2
              exit 1
            fi
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          filter: blob:none
          persist-credentials: false

      # The one decision this file makes: whether the archives need building. A published
      # release spends no runner minutes being rebuilt. It is a shortcut, never the guard:
      # every publishing target checks what is published for itself.
      #
      # mutable only on a dispatch that unchecked immutable. On a tag push inputs are empty,
      # and an empty input compared to false would read as unchecked.
      - id: release
        name: Resolve the tag, its commit and what is published
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
          MUTABLE: ${{ github.event_name == 'workflow_dispatch' && !inputs.immutable }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          # A release ships reviewed code: its tag must be on main.
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git merge-base --is-ancestor HEAD origin/main
          charms="cd"
          build=false
          if [ "$MUTABLE" = true ]; then charms="cd,mutable"; fi
          if [ "$MUTABLE" = true ] || ! gh release view "$TAG" >/dev/null 2>&1; then build=true; fi
          {
            echo "tag=$TAG"
            echo "commit=$(git rev-parse HEAD)"
            echo "build=$build"
            echo "charms=$charms"
          } >> "$GITHUB_OUTPUT"

  # One job per native runner. Each builds its own platform's static binary, and the
  # dynamically-linked one too when include_dynamic_builds is set. Static cross-compiles
  # trivially (no C toolchain needed), so there's no reason to farm it out to a separate
  # job. cgo needs a real C toolchain plus libzstd/liblzma for that exact platform, which
  # is why every step supplying those is gated on the same input.
  # contents: read only; none of these see MAGUS_SIGNING_KEY.
  release-linux-amd64:
    name: Build release artifacts (linux/amd64)
    if: ${{ needs.preflight.outputs.build == 'true' }}
    needs: preflight
    runs-on: ubuntu-latest
    permissions:
      contents: read  # publish is the only job that creates the Release/uploads assets
    outputs:
      magus_artifact: ${{ steps.magus.outputs.artifact }}
      magus_sha256: ${{ steps.magus.outputs.sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          # Full history + tags so the release-build target's version() (git describe
          # --tags) resolves the tag and build_date() reads the commit date. Both walk the
          # commit graph only, so blob:none keeps them working on a fraction of the fetch.
          # Do NOT shallow these jobs: git describe needs to reach the nearest tag.
          fetch-depth: 0
          filter: blob:none
      # Publish the exact tag's bootstrap binary before any cache restore. Publish
      # consumes this same-run artifact, checked against the digest and commit.
      - id: magus
        uses: ./.github/actions/setup-magus
        with:
          # CD must bootstrap from the commit it's releasing, not a pinned
          # older tag - magusfile.buzz can legitimately need host-module code
          # newer than the last release.
          installation-strategy: source
          git-ref: ${{ needs.preflight.outputs.tag }}
          publish-artifact: release-magus-${{ github.run_attempt }}
      - uses: ./.github/actions/codec-deps
        if: ${{ inputs.include_dynamic_builds }}
      # No remote-cache env is set in CD on purpose: a release builds clean off the
      # cache. magusfile.buzz leaves the backend unbound without it, so there is zero
      # chance of replaying a cached (unsigned) artifact into a release.
      # No 32-bit ARM assets here yet, deliberately. release-build CAN produce them by
      # hand (`-- linux armv7`), and the magusfile folds those asset names back to
      # GOARCH=arm plus a GOARM level, but nothing has ever EXECUTED a 32-bit build of
      # this codebase - gopherbuzz did not even compile where `int` is 32 bits until
      # recently, and a cross-compile proves only that the linker ran. Publishing an
      # archive nobody has run is what this omission avoids. Re-add these once the
      # 32-bit plan has an executed test suite behind it.
      - name: Build release artifacts (static)
        run: magus run release-build --no-default-charms --concurrency-profile aggressive

      # The dynamic binary ships the cgo codecs, which only the extended suite tests.
      - name: Test the cgo codecs
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run compress-cgo-test . --no-default-charms

      - name: Build release artifacts (dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run release-build:dynamic --no-default-charms --concurrency-profile aggressive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-amd64
          path: |
            dist/magus_*.tar.gz
            dist/proofread_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release-linux-arm64:
    name: Build release artifacts (linux/arm64)
    if: ${{ needs.preflight.outputs.build == 'true' }}
    needs: preflight
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          # Full history + tags for git describe; blob:none because none of it is read.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ needs.preflight.outputs.tag }}
      - uses: ./.github/actions/codec-deps
        if: ${{ inputs.include_dynamic_builds }}
      - name: Build release artifacts (static)
        run: magus run release-build --no-default-charms --concurrency-profile aggressive

      # The dynamic binary ships the cgo codecs, which only the extended suite tests.
      - name: Test the cgo codecs
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run compress-cgo-test . --no-default-charms

      - name: Build release artifacts (dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run release-build:dynamic --no-default-charms --concurrency-profile aggressive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-arm64
          path: |
            dist/magus_*.tar.gz
            dist/proofread_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # arm64 only. Intel darwin has its own native job below, so this one no longer
  # cross-compiles the amd64 static binary the way the windows job still does.
  release-darwin-arm64:
    name: Build release artifacts (darwin/arm64)
    if: ${{ needs.preflight.outputs.build == 'true' }}
    needs: preflight
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          # Full history + tags for git describe; blob:none because none of it is read.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ needs.preflight.outputs.tag }}
      - name: Install codec build dependencies
        if: ${{ inputs.include_dynamic_builds }}
        run: brew install zstd xz
      - name: Build release artifacts (static)
        run: magus run release-build --no-default-charms --concurrency-profile aggressive

      # The dynamic binary ships the cgo codecs, which only the extended suite tests.
      - name: Test the cgo codecs
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run compress-cgo-test . --no-default-charms

      - name: Build release artifacts (dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run release-build:dynamic --no-default-charms --concurrency-profile aggressive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin-arm64
          path: |
            dist/magus_*.tar.gz
            dist/proofread_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # A NATIVE Intel runner, which this release used to do without. The old arrangement had
  # the arm64 job cross-compile a darwin/amd64 STATIC binary and ship no dynamic variant at
  # all, because cgo there would have needed x86_64 liblzma/libzstd an arm64 runner has no
  # way to supply. That trade existed to avoid macos-13, GitHub's free Intel pool, which
  # queued for hours and blocked the whole release.
  #
  # macos-13 has since been retired, and its replacement `macos-15-intel` is a STANDARD
  # runner (free and unlimited on public repos, unlike the billed `-large` variants), so the
  # queue that motivated the trade is not the same pool any more. Building natively is what
  # restores the cgo/dynamic variant for Intel Macs; if this job ever starts queueing badly
  # enough to hold up releases, the fallback is the old cross-compile line in the arm64 job
  # above plus dropping the dynamic asset again.
  release-darwin-amd64:
    name: Build release artifacts (darwin/amd64)
    if: ${{ needs.preflight.outputs.build == 'true' }}
    needs: preflight
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          # Full history + tags for git describe; blob:none because none of it is read.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ needs.preflight.outputs.tag }}
      - name: Install codec build dependencies
        if: ${{ inputs.include_dynamic_builds }}
        run: brew install zstd xz
      - name: Build release artifacts (static)
        run: magus run release-build --no-default-charms --concurrency-profile aggressive

      # The dynamic binary ships the cgo codecs, which only the extended suite tests.
      - name: Test the cgo codecs
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run compress-cgo-test . --no-default-charms

      - name: Build release artifacts (dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run release-build:dynamic --no-default-charms --concurrency-profile aggressive
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin-amd64
          path: |
            dist/magus_*.tar.gz
            dist/proofread_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # No separate windows-11-arm job: this runner cross-compiles the windows/arm64 STATIC binary
  # instead (CGO_ENABLED=0 pure-Go cross-compiles from any host), the same trade the darwin job
  # above makes for amd64. The windows/arm64 DYNAMIC variant is dropped because cgo would need
  # an aarch64 mingw/clang toolchain plus arm64 libzstd/liblzma, which MINGW64 here does not
  # have; MSYS2's CLANGARM64 environment is the only route and it is far less proven than the
  # x86_64 packages above. What is forgone is only internal/codec's zstd/xz fast path, which is
  # marginal. (This does NOT cost the Buzz JIT: it used to be excluded on Windows, but the same
  # change that added this job dropped that exclusion, so the arm64 backend runs here.)
  release-windows:
    name: Build release artifacts (windows amd64 + arm64-static)
    if: ${{ needs.preflight.outputs.build == 'true' }}
    needs: preflight
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          # Full history + tags for git describe; blob:none because none of it is read.
          fetch-depth: 0
          filter: blob:none

      # MSYS2 exists in this job ONLY for the cgo build, so it is gated with it. It ships
      # prebuilt mingw-w64 zstd/xz packages so internal/codec's cgo path links without
      # building those C libs from source. pkgconf is REQUIRED in the install set: without a
      # mingw pkg-config, cgo's `pkg-config --cflags` grabs Strawberry Perl's broken
      # pkg-config.bat off the runner PATH and fails. PKG_CONFIG below pins the exact binary
      # so PATH order can never reselect it.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        if: ${{ inputs.include_dynamic_builds }}
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zstd mingw-w64-x86_64-xz
          path-type: inherit
          # A tag run restores main's cache scope, and this toolchain links a binary
          # publish signs.
          cache: false

      - name: Point go build at the MSYS2 mingw toolchain
        if: ${{ inputs.include_dynamic_builds }}
        shell: msys2 {0}
        run: |
          echo "MAGUS_CGO_CC=$(cygpath -m /mingw64/bin/gcc.exe)" >> "$GITHUB_ENV"
          echo "MAGUS_CGO_PKG_CONFIG=$(cygpath -m /mingw64/bin/pkgconf.exe)" >> "$GITHUB_ENV"
          echo "MAGUS_CGO_PKG_CONFIG_PATH=$(cygpath -m /mingw64/lib/pkgconfig)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ needs.preflight.outputs.tag }}

      # shell: bash, not msys2 - the static builds must not depend on a toolchain that is
      # only installed when `include_dynamic_builds` is set. bash rather than the default pwsh because
      # setup-magus installs an EXTENSIONLESS `magus` (go build -o does not append .exe),
      # which pwsh will not resolve through PATHEXT.
      - name: Build release artifacts (amd64 + arm64, static)
        shell: bash
        run: |
          magus run release-build --no-default-charms --concurrency-profile aggressive
          GOOS=windows GOARCH=arm64 magus run release-build --no-default-charms --concurrency-profile aggressive

      - name: Build release artifacts (amd64 dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        shell: msys2 {0}
        run: magus run release-build:dynamic --no-default-charms --concurrency-profile aggressive

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: |
            dist/magus_*.tar.gz
            dist/proofread_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - preflight
      - release-linux-amd64
      - release-linux-arm64
      - release-darwin-arm64
      - release-darwin-amd64
      - release-windows
    # Skipped build jobs mean the release is already published; a failed one stops here.
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    # Job-scoped because only this job runs a bare `go run`; the release-build jobs above
    # reach the toolchain through magusfile.buzz, which sets this on every Go target.
    env:
      GOEXPERIMENT: jsonv2
    permissions:
      contents: write  # create the GitHub Release, push the manifest branch
      actions: write   # dispatch release-index.yaml on that branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          filter: blob:none

      # Go for release-manifest's `go run ./cmd/magus-utils cut`. It must stay AHEAD of
      # setup-magus so that job's actions/setup-go keeps outranking mise's Go, exactly as in
      # ci.yaml.
      #
      # cache: false: a tag run restores main's cache scope, which any main-scoped run can
      # write, the merge queue's validation of pull-request code included, and this job
      # holds MAGUS_SIGNING_KEY.
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          version: '2026.4.8'
          env: false
          cache: false

      # The binary the linux build job made from this tag when this run built the archives,
      # otherwise the published, signed binary for the tag.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: ${{ needs.preflight.outputs.build == 'true' && 'artifact' || 'prebuilt' }}
          git-ref: ${{ needs.preflight.outputs.tag }}
          artifact: ${{ needs.release-linux-amd64.outputs.magus_artifact }}
          artifact-sha256: ${{ needs.release-linux-amd64.outputs.magus_sha256 }}
          artifact-commit: ${{ needs.preflight.outputs.commit }}

      # The bare magus-utils call needs mise's pinned Go even when magus came from an
      # artifact or release and setup-magus did not install a Go toolchain.
      - name: Restore the mise-pinned Go toolchain
        run: echo "$(mise where go)/bin" >> "$GITHUB_PATH"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: ${{ needs.preflight.outputs.build == 'true' }}
        with:
          path: dist
          merge-multiple: true

      # Write-once: creates the GitHub Release from the archives above, or downloads and
      # verifies the published one into dist/. See release_publish() in magusfile.buzz.
      - name: Publish the GitHub Release
        env:
          MAGUS_SIGNING_KEY: *release_signing_key
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHARMS: ${{ needs.preflight.outputs.charms }}
        run: magus run "release-publish:$CHARMS" --no-default-charms

      # After the release, on purpose: the binaries are what a tag is for, and a failure to
      # publish the update index must not withhold them. Cuts the manifest in this tag's
      # tree and stages it on a branch off main, where release-index.yaml signs main's index
      # with it. See release_manifest() in magusfile.buzz.
      - name: Stage the release manifest for the index
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHARMS: ${{ needs.preflight.outputs.charms }}
        run: magus run "release-manifest:$CHARMS" --no-default-charms

  # Every spell the binary ships, one GHCR repository each, tagged with the release version.
  # After publish, so a spell never names a release that failed to go out. The artifacts are
  # packed from the signed binary published at this tag, the same bytes `magus spell pull
  # magus/spell/<name>` stamps a copy with. A new GHCR package is private until someone
  # makes it public in the package settings; magus cannot do that for you.
  spells:
    name: Publish spells
    needs: [preflight, publish]
    # !cancelled(): publish succeeds after skipped build jobs, and without it GitHub skips
    # every job downstream of a skipped one.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Tags, so spell-publish reads the release version off the tag HEAD sits on.
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: prebuilt
          git-ref: ${{ needs.preflight.outputs.tag }}

      # The credentials under the names GHCR_SPELLS declares. Each token reaches `magus
      # spell ls` and `magus spell push` on stdin, never an argv.
      - name: Publish spells
        env:
          GHCR_USERNAME: *release_ghcr_username
          GHCR_TOKEN: *release_ghcr_token
          CHARMS: ${{ needs.preflight.outputs.charms }}
        run: magus run "spell-publish:$CHARMS" --no-default-charms

  image:
    name: Publish container images
    needs: [preflight, publish]
    # !cancelled(): same as spells.
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR
      id-token: write  # cosign keyless (OIDC) signing

    # The whole build → push → sign flow lives in the magusfile's image-build
    # target (docker + cosign spells); `magus run image-build:cd,stable` builds the
    # static (multi-arch) and CGO (amd64) variants, pushes them to every registry,
    # and cosign-signs each pushed digest in each. The same command signs images
    # locally. cosign comes from mise (mise.toml); no cosign-specific action.
    #
    # Each variant is built ONCE for all registries: `image-build:cd,stable` passes every
    # tag across every registry to a single `docker buildx build --push`, so Docker
    # Hub costs an upload rather than a rebuild. Do not split this into a per-registry
    # step - a second buildx invocation on this runner starts from an empty BuildKit
    # cache and rebuilds every layer.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so version()/commit()/build_date() resolve.
          ref: ${{ needs.preflight.outputs.tag }}
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: prebuilt
          git-ref: ${{ needs.preflight.outputs.tag }}

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # v3+ defaults this true, which would export mise.toml's GOEXPERIMENT here. ci,
          # cd and audit set it at workflow level; this is the one job that does not.
          env: false
          # id-token and packages: write; see the publish job.
          cache: false

      # Both cache what they download in the Actions cache by default; this job holds
      # id-token and packages: write, so neither restores. The binfmt image runs privileged.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          cache-image: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          cache-binary: false

      # The runner logs docker in, not a magus target: docker owns its credential store, and
      # authenticating the tools a build drives is the environment's job, like checkout's
      # token. `magus run image-registries:cd,tagged` lists the registries this must cover.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # TODO: Docker Hub publishing is disabled - the magusfile's REGISTRIES no longer
      # lists DOCKERHUB. Once DOCKERHUB_USERNAME / DOCKERHUB_TOKEN exist as repository
      # secrets (the token is a Docker Hub access token with Read/Write scope, NOT the
      # account password), restore that registry and log in to docker.io beside GHCR.

      - name: Build, push, and sign images
        # :cd,tagged reads the channel off the tag itself: a stable semver takes `latest`,
        # a v0.5.0-rc.1 goes to the version tag alone, and an UNTAGGED commit is refused
        # outright rather than guessed at. The derivation lives in the magusfile's channel(),
        # not in YAML, beside release-publish's prerelease flag, so the two cannot disagree
        # about what is being shipped. gha adds the job summary of what was pushed.
        # The registry credentials list each repository's tags: a version tag already
        # published is kept, so a rerun pushes nothing unless the run is mutable.
        env:
          GHCR_USERNAME: *release_ghcr_username
          GHCR_TOKEN: *release_ghcr_token
          CHARMS: ${{ needs.preflight.outputs.charms }}
        run: magus run "image-build:$CHARMS,tagged,gha" --no-default-charms --concurrency-profile aggressive
