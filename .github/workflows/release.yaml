name: Release

# Releases the BINARIES: cross-compiled archives, container images, and their
# signatures, on a v* tag. Everything a main push publishes is in cd.yaml.
#
# STATIC ONLY by default. `magus run release-build:dynamic` still produces the
# dynamically linked build and is fully supported for anyone who wants it - it is simply
# not published unless someone asks, via the `include_dynamic_builds` dispatch input
# below. The reason is that a dynamic archive is only useful where its libraries resolve:
# on darwin the linker bakes in the build machine's Homebrew prefix (/opt/homebrew/...),
# which no other Mac has, and Windows has the same shape through MSYS2. Only Linux
# resolves them by SONAME. Rather than publish an artifact that works on one platform of
# three, the whole cgo toolchain here - MSYS2, mingw packages, the codec dev headers - is
# gated behind that input.
#
# The static build takes `-tags noffi`, and that is not optional: purego's
# cgo_import_dynamic would otherwise give a "static" binary a PT_INTERP and a libc
# dependency, so the archive would not run on a musl or scratch host.
#
# Renamed from cd.yaml, because a v* tag is a deliberate release and not continuous
# delivery - cd.yaml now holds the thing that actually is. The rename is not free:
# cosign pins the workflow PATH as the certificate identity, so every image published
# before it carries `.github/workflows/cd.yaml` and no longer verifies against the
# command in docs/setup/container-image.md. That was an accepted cost while
# this project has no users; it will not be once it does. Treat this filename as frozen
# from the first release published under it.

on:
  push:
    tags:
      - 'v*'
  # Run the whole pipeline on demand. Pick a TAG in the ref dropdown, not a branch: every
  # job passes `git-ref: ${{ github.ref_name }}` to setup-magus, whose reachable-from-main
  # gate rejects a feature branch, and version() is `git describe`, so an untagged ref would
  # name every asset after its distance past the last tag. Dispatching a tag exercises the
  # real release path rather than a special-cased rehearsal of it - which is the point,
  # since what breaks a release is the platform-specific last mile, not the trigger.
  workflow_dispatch:
    inputs:
      include_dynamic_builds:
        description: 'Include dynamically linked prebuilt binaries'
        type: boolean
        default: false

# One live CD run per tag. Re-pushing a tag (e.g. to pick up a CD fix before the
# release publishes) cancels the previous run so duplicate release jobs never race
# for runners or the publish step. Keyed on the ref, so different tags still run
# independently.
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read  # default; publish overrides to write

jobs:
  # One job per native runner. Each builds its own platform's static binary, and the
  # dynamically-linked one too when include_dynamic_builds is set. Static cross-compiles
  # trivially (no C toolchain needed), so there's no reason to farm it out to a separate
  # job. cgo needs a real C toolchain plus libzstd/liblzma for that exact platform, which
  # is why every step supplying those is gated on the same input.
  # contents: read only; none of these see MAGUS_SIGNING_KEY.
  release-linux-amd64:
    name: Build release artifacts (linux/amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read  # publish is the only job that creates the Release/uploads assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so the release-build target's version() (git describe
          # --tags) resolves the tag and build_date() reads the commit date. Both walk the
          # commit graph only, so blob:none keeps them working on a fraction of the fetch.
          # Do NOT shallow these jobs: git describe needs to reach the nearest tag.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-magus
        with:
          # CD must bootstrap from the commit it's releasing, not a pinned
          # older tag - magusfile.buzz can legitimately need host-module code
          # newer than the last release.
          installation-strategy: source
          git-ref: ${{ github.ref_name }}
      - name: Install codec build dependencies
        if: ${{ inputs.include_dynamic_builds }}
        # Install first, update only on failure; see the note in ci.yaml for why update is the
        # expensive half and why the image's cached index already satisfies both packages.
        run: |
          sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev \
            || { sudo apt-get update -o Acquire::Retries=3 -o Acquire::Languages=none \
                 && sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev; }
      # No remote-cache env is set in CD on purpose: a release builds clean off the
      # cache. magusfile.buzz leaves the backend unbound without it, so there is zero
      # chance of replaying a cached (unsigned) artifact into a release.
      # No 32-bit ARM assets here yet, deliberately. release-build CAN produce them by
      # hand (`-- linux armv7`), and the magusfile folds those asset names back to
      # GOARCH=arm plus a GOARM level, but nothing has ever EXECUTED a 32-bit build of
      # this codebase - gopherbuzz did not even compile where `int` is 32 bits until
      # recently, and a cross-compile proves only that the linker ran. Publishing an
      # archive nobody has run is what this omission avoids. Re-add these once the
      # 32-bit plan has an executed test suite behind it.
      - name: Build release artifacts (static)
        run: magus run release-build --no-default-charms

      - name: Build release artifacts (dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run release-build:dynamic --no-default-charms
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-amd64
          path: |
            dist/magus_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release-linux-arm64:
    name: Build release artifacts (linux/arm64)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags for git describe; blob:none because none of it is read.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ github.ref_name }}
      - name: Install codec build dependencies
        if: ${{ inputs.include_dynamic_builds }}
        # Install first, update only on failure; see the note in ci.yaml for why update is the
        # expensive half and why the image's cached index already satisfies both packages.
        run: |
          sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev \
            || { sudo apt-get update -o Acquire::Retries=3 -o Acquire::Languages=none \
                 && sudo apt-get install -y --no-install-recommends liblzma-dev libzstd-dev; }
      - name: Build release artifacts (static)
        run: magus run release-build --no-default-charms

      - name: Build release artifacts (dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run release-build:dynamic --no-default-charms
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-linux-arm64
          path: |
            dist/magus_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # arm64 only. Intel darwin has its own native job below, so this one no longer
  # cross-compiles the amd64 static binary the way the windows job still does.
  release-darwin-arm64:
    name: Build release artifacts (darwin/arm64)
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags for git describe; blob:none because none of it is read.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ github.ref_name }}
      - name: Install codec build dependencies
        if: ${{ inputs.include_dynamic_builds }}
        run: brew install zstd xz
      - name: Build release artifacts (static)
        run: magus run release-build --no-default-charms

      - name: Build release artifacts (dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run release-build:dynamic --no-default-charms
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin-arm64
          path: |
            dist/magus_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # A NATIVE Intel runner, which this release used to do without. The old arrangement had
  # the arm64 job cross-compile a darwin/amd64 STATIC binary and ship no dynamic variant at
  # all, because cgo there would have needed x86_64 liblzma/libzstd an arm64 runner has no
  # way to supply. That trade existed to avoid macos-13, GitHub's free Intel pool, which
  # queued for hours and blocked the whole release.
  #
  # macos-13 has since been retired, and its replacement `macos-15-intel` is a STANDARD
  # runner (free and unlimited on public repos, unlike the billed `-large` variants), so the
  # queue that motivated the trade is not the same pool any more. Building natively is what
  # restores the cgo/dynamic variant for Intel Macs; if this job ever starts queueing badly
  # enough to hold up releases, the fallback is the old cross-compile line in the arm64 job
  # above plus dropping the dynamic asset again.
  release-darwin-amd64:
    name: Build release artifacts (darwin/amd64)
    runs-on: macos-15-intel
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags for git describe; blob:none because none of it is read.
          fetch-depth: 0
          filter: blob:none
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ github.ref_name }}
      - name: Install codec build dependencies
        if: ${{ inputs.include_dynamic_builds }}
        run: brew install zstd xz
      - name: Build release artifacts (static)
        run: magus run release-build --no-default-charms

      - name: Build release artifacts (dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        run: magus run release-build:dynamic --no-default-charms
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-darwin-amd64
          path: |
            dist/magus_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  # No separate windows-11-arm job: this runner cross-compiles the windows/arm64 STATIC binary
  # instead (CGO_ENABLED=0 pure-Go cross-compiles from any host), the same trade the darwin job
  # above makes for amd64. The windows/arm64 DYNAMIC variant is dropped because cgo would need
  # an aarch64 mingw/clang toolchain plus arm64 libzstd/liblzma, which MINGW64 here does not
  # have; MSYS2's CLANGARM64 environment is the only route and it is far less proven than the
  # x86_64 packages above. What is forgone is only internal/codec's zstd/xz fast path, which is
  # marginal. (This does NOT cost the Buzz JIT: it used to be excluded on Windows, but the same
  # change that added this job dropped that exclusion, so the arm64 backend runs here.)
  release-windows:
    name: Build release artifacts (windows amd64 + arm64-static)
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags for git describe; blob:none because none of it is read.
          fetch-depth: 0
          filter: blob:none

      # MSYS2 exists in this job ONLY for the cgo build, so it is gated with it. It ships
      # prebuilt mingw-w64 zstd/xz packages so internal/codec's cgo path links without
      # building those C libs from source. pkgconf is REQUIRED in the install set: without a
      # mingw pkg-config, cgo's `pkg-config --cflags` grabs Strawberry Perl's broken
      # pkg-config.bat off the runner PATH and fails. PKG_CONFIG below pins the exact binary
      # so PATH order can never reselect it.
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2.32.0
        if: ${{ inputs.include_dynamic_builds }}
        with:
          msystem: MINGW64
          install: mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-zstd mingw-w64-x86_64-xz
          path-type: inherit

      - name: Point go build at the MSYS2 mingw toolchain
        if: ${{ inputs.include_dynamic_builds }}
        shell: msys2 {0}
        run: |
          echo "MAGUS_CGO_CC=$(cygpath -m /mingw64/bin/gcc.exe)" >> "$GITHUB_ENV"
          echo "MAGUS_CGO_PKG_CONFIG=$(cygpath -m /mingw64/bin/pkgconf.exe)" >> "$GITHUB_ENV"
          echo "MAGUS_CGO_PKG_CONFIG_PATH=$(cygpath -m /mingw64/lib/pkgconfig)" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ github.ref_name }}

      # shell: bash, not msys2 - the static builds must not depend on a toolchain that is
      # only installed when `include_dynamic_builds` is set. bash rather than the default pwsh because
      # setup-magus installs an EXTENSIONLESS `magus` (go build -o does not append .exe),
      # which pwsh will not resolve through PATHEXT.
      - name: Build release artifacts (amd64 + arm64, static)
        shell: bash
        run: |
          magus run release-build --no-default-charms
          GOOS=windows GOARCH=arm64 magus run release-build --no-default-charms

      - name: Build release artifacts (amd64 dynamic)
        if: ${{ inputs.include_dynamic_builds }}
        shell: msys2 {0}
        run: magus run release-build:dynamic --no-default-charms

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-windows
          path: |
            dist/magus_*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  publish:
    name: Publish release
    needs:
      - release-linux-amd64
      - release-linux-arm64
      - release-darwin-arm64
      - release-darwin-amd64
      - release-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the GitHub Release, upload assets, push the index branch
      pull-requests: write   # open the pull request carrying the signed release index
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-magus  # provides the Go toolchain for the magus-utils calls below
        with:
          installation-strategy: source
          git-ref: ${{ github.ref_name }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      # Every release-<platform> job wrote its own <asset>.sha256 sidecar
      # (sha256sum-compatible, one line) alongside each tarball, so no
      # cross-job aggregation is needed: just concatenate what's on disk.
      - name: Build combined manifest
        run: cat dist/*.sha256 > dist/SHA256SUMS

      # Signs dist/SHA256SUMS, then self-verifies against the embedded release pubkey
      # before the release goes out (safe here, unlike setup-magus, since this job has
      # the magus source checked out). See release_sign() in magusfile.buzz.
      - name: Sign and verify SHA256SUMS
        env:
          MAGUS_SIGNING_KEY: ${{ secrets.MAGUS_SIGNING_KEY }}
        run: magus run release-sign --no-default-charms

      # Whether this tag is a prerelease, decided by .github/actions/magus/prerelease.buzz
      # rather than by a workflow expression. `contains(github.ref_name, '-')` would call
      # v1.2.3+build-1 a prerelease - the hyphen is build metadata, which semver says is not
      # one. The script parses instead, using the same semver module the magusfile's
      # channel() uses for the image's floating tag, and its cases are covered by tests that
      # `magus run test` runs (via advice-test) - which a one-line shell expression here
      # could never be.
      #
      # The tag arrives through the environment, never interpolated into the command: a ref
      # name is attacker-influenceable on some triggers.
      - id: release
        name: Resolve prerelease from the tag
        env:
          TAG: ${{ github.ref_name }}
        run: echo "prerelease=$(magus buzz .github/actions/magus/prerelease.buzz)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          # Not inferred from the tag name: left to the default, v0.5.0-rc.1 would take the
          # repo's `latest` pointer, which audit's compat job and `magus self update` follow.
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        run: |
          set -euo pipefail
          ASSETS=(dist/magus_*.tar.gz dist/SHA256SUMS dist/SHA256SUMS.sig)
          # Re-runnable: a later step failing is the normal reason to be here twice, and a
          # bare `create` would die on "already exists" and block the retry.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; re-uploading assets"
            gh release upload "$TAG" --clobber "${ASSETS[@]}"
          else
            FLAGS=(--generate-notes)
            if [ "$PRERELEASE" = "true" ]; then FLAGS+=(--prerelease); fi
            gh release create "$TAG" "${FLAGS[@]}" "${ASSETS[@]}"
          fi

      # The two steps below are what `magus self update` needs and the GitHub Release
      # does not supply. Neither ran until now: `cut` and `release-index` were written,
      # tested, and called by nothing, so v0.3.0 shipped with no releases/v0.3.0.yaml
      # and the site served an index.json whose signature 404ed - self update exited 1
      # on every platform for every user.
      #
      # They run AFTER the release is created on purpose. The binaries are what a tag
      # is for; a failure to publish the update index must not withhold them.
      #
      # cut moves the CHANGELOG's [Unreleased] section into the manifest and empties it,
      # then generate-changelog folds the new version back in - the repo's CHANGELOG.md
      # is generated from releases/*.yaml, so both halves have to happen here or the
      # next drift gate on main fails.
      - name: Cut the release manifest
        env:
          TAG: ${{ github.ref_name }}
        run: |
          go run ./cmd/magus-utils cut -version "$TAG" -artifacts ./dist -changelog ./CHANGELOG.md -out ./releases
          go run ./cmd/magus-utils generate-changelog -releases ./releases -changelog ./CHANGELOG.md

      - uses: ./.github/actions/release-index
        with:
          signing-key: ${{ secrets.MAGUS_SIGNING_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          reason: the ${{ github.ref_name }} release

  image:
    name: Publish container images
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write  # push to GHCR
      id-token: write  # cosign keyless (OIDC) signing

    # The whole build → push → sign flow lives in the magusfile's image-build
    # target (docker + cosign spells); `magus run image-build:cd,stable` builds the
    # static (multi-arch) and CGO (amd64) variants, pushes them to every registry,
    # and cosign-signs each pushed digest in each. The same command signs images
    # locally. cosign comes from mise (mise.toml); no cosign-specific action.
    #
    # Each variant is built ONCE for all registries: `image-build:cd,stable` passes every
    # tag across every registry to a single `docker buildx build --push`, so Docker
    # Hub costs an upload rather than a rebuild. Do not split this into a per-registry
    # step - a second buildx invocation on this runner starts from an empty BuildKit
    # cache and rebuilds every layer.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history + tags so version()/commit()/build_date() resolve.
          fetch-depth: 0
          filter: blob:none

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ github.ref_name }}

      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          # v3+ defaults this true, which would export mise.toml's GOEXPERIMENT here. ci,
          # cd and audit set it at workflow level; this is the one job that does not.
          env: false

      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      # WHICH registries to authenticate against is not written here, and neither is
      # any parsing of them. image-login reads the same registry table image-build
      # does, so the login set cannot drift from the push set, and adding a registry
      # is a magusfile change with no matching edit in this file. It is also the
      # command you run on a laptop before `magus run image-build:cd,stable`.
      #
      # Only the secret VALUES stay in the workflow, and they have to: nothing outside
      # a workflow can read GitHub secrets. The names below are the ones the magusfile
      # declares; `magus run image-registries:cd,stable` prints them and says which are set.
      # image-login hands each token to docker on stdin, so no secret enters an argv
      # that magus would capture into the run log.
      #
      # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are repository secrets (Settings > Secrets
      # and variables > Actions). The token is a Docker Hub access token with Read/Write
      # scope, NOT the account password.
      # Preflight, and the answer to "where do these variable names come from?" - it
      # prints the registry-by-registry table this env block exists to satisfy, then
      # fails on a NAMED variable if any is unset. That happens here, before the build
      # steps below spend runner time on QEMU and a multi-arch compile.
      #
      # The env block is repeated on both steps rather than hoisted to the job, which
      # is deliberate: at job level the Docker Hub token would also be in scope for
      # every third-party setup action above. Step scope keeps it to the two steps
      # that have any business with it.
      - name: Verify registry credentials
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: magus run image-registries:cd,stable,verify --no-default-charms

      - name: Log in to image registries
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: magus run image-login:cd,tagged --no-default-charms

      - name: Build, push, and sign images
        # :cd,tagged reads the channel off the tag itself: a stable semver takes `latest`,
        # a v0.5.0-rc.1 goes to the version tag alone, and an UNTAGGED commit is refused
        # outright rather than guessed at. The derivation lives in the magusfile's channel(),
        # not in YAML, so this step and the prerelease flag on the release below cannot
        # disagree about what is being shipped.
        run: magus run image-build:cd,tagged --no-default-charms
