name: Skill evals

# MUTED 2026-08-03: the weekly cron is commented out, so this only runs when someone
# dispatches it by hand. It drives promptfoo against live models and costs real money.
# The evals `smoke` and `grid` targets it calls are commented out too, so a manual
# dispatch currently fails on an undefined target - uncomment both together to revive it.
on:
  workflow_dispatch:
  # schedule:
  #   - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    # Forks and keyless repositories must skip rather than fail: live model
    # calls are a measurement harness, never a normal CI requirement.
    if: secrets.ANTHROPIC_API_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'
          install: false

      - name: Install pinned toolchain
        run: mise install

      # See ci.yaml: build from the checkout, not git-ref, so a workflow_dispatch
      # off a branch is not rejected by the reachable-from-main gate.
      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          source-path: .

      - name: Run skill smoke matrix
        run: magus run smoke evals

      - name: Analyze paired results
        run: python3 evals/tools/analyze.py evals/results/smoke.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-eval-smoke-results
          path: evals/results/smoke.json
          if-no-files-found: error
          retention-days: 30
