name: Skill evals

on:
  workflow_dispatch:
  schedule:
    - cron: '0 5 * * 1'

permissions:
  contents: read

jobs:
  smoke:
    # Forks and keyless repositories must skip rather than fail: live model
    # calls are a measurement harness, never a normal CI requirement.
    if: secrets.ANTHROPIC_API_KEY != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOEXPERIMENT: jsonv2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: jdx/mise-action@c37c93293d6b742fc901e1406b8f764f6fb19dac # v2.4.4
        with:
          version: '2026.4.8'
          install: false

      - name: Install pinned toolchain
        run: mise install

      - uses: ./.github/actions/setup-magus
        with:
          installation-strategy: source
          git-ref: ${{ github.sha }}

      - name: Run skill smoke matrix
        run: magus run smoke evals

      - name: Analyze paired results
        run: python3 evals/tools/analyze.py evals/results/smoke.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: skill-eval-smoke-results
          path: evals/results/smoke.json
          if-no-files-found: error
          retention-days: 30
