name: Publish the release index
description: >
  Build docs/gen/public/release/index.json from releases/*.yaml, sign it into
  index.json.sig, and open a pull request carrying whatever changed.

  The pull request is the whole point. index.json only changes when a release is
  cut, and only a job holding MAGUS_SIGNING_KEY can sign it - which is why the
  file is tracked rather than rendered on every push to main. main's ruleset
  requires a pull request and bypasses only for the admin role, so a workflow
  cannot push the pair straight to the default branch.

inputs:
  signing-key:
    description: >
      Ed25519 private key as hex (secrets.MAGUS_SIGNING_KEY). release-index
      self-verifies the signature against the public key binaries embed, so a
      key the fleet cannot verify fails here rather than in the field.
    required: true

  github-token:
    description: Token used to push the branch and open the pull request.
    required: true

  reason:
    description: >
      What produced this index, as a sentence fragment - "the v0.4.0 release",
      "a manual refresh". Goes into the commit subject and the pull request.
    required: true

runs:
  using: composite
  steps:
    - name: Build and sign the release index
      shell: bash
      env:
        MAGUS_SIGNING_KEY: ${{ inputs.signing-key }}
      run: go run ./cmd/magus-utils release-index -releases ./releases -out ./docs/gen/public/release

    # git add names the directory, not the two files: .gitignore re-includes exactly
    # index.json and index.json.sig under it, so nothing else can be swept in.
    #
    # A pull request opened with GITHUB_TOKEN does not trigger workflow runs, so no
    # CI runs against this branch. Nothing here is reviewed by CI anyway - the bytes
    # are derived from committed manifests by a tool whose tests DID run - but that is
    # why the branch is a pull request rather than a merge.
    - name: Open a pull request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REASON: ${{ inputs.reason }}
      run: |
        set -euo pipefail
        paths=(releases docs/gen/public/release CHANGELOG.md)
        if [ -z "$(git status --porcelain -- "${paths[@]}")" ]; then
          echo "the signed index already matches releases/; nothing to publish"
          exit 0
        fi
        branch="release-index/$(git rev-parse --short HEAD)"
        git config user.name 'github-actions[bot]'
        git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
        git switch -c "$branch"
        git add -- "${paths[@]}"
        git commit -m "Publish the release index signed for $REASON"
        # Force, so a re-run of a failed publish job survives its own earlier push: the
        # branch name is derived from HEAD and owned by this action alone, and a re-run
        # regenerates the same content under a fresh commit.
        git push --force origin "$branch"
        if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
          echo "a pull request for $branch is already open"
          exit 0
        fi
        # A refused creation (repository Actions settings can forbid workflows from
        # opening pull requests) must not fail the job: the pushed branch is the
        # deliverable, later jobs gate on this one, and the warning carries the one
        # manual step left.
        gh pr create --base main --head "$branch" \
          --title "Publish the release index signed for $REASON" \
          --body "$(cat <<'BODY'
        Opened by `.github/actions/release-index`.

        `magus self update` fetches `public/release/index.json` and refuses to run
        without a matching `index.json.sig`, so the signed pair has to reach main
        before the site redeploys. Merging is what publishes it: the next push to
        main renders the docs site, which copies the tracked pair out verbatim
        rather than regenerating it.
        BODY
        )" || echo "::warning title=release-index::could not open the pull request; the signed branch is pushed - open it at https://github.com/$GITHUB_REPOSITORY/pull/new/$branch"
