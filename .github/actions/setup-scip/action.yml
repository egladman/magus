name: Setup SCIP indexers
description: Install the checkout's SCIP indexer and verify every indexer Magus declares.

runs:
  using: composite
  steps:
    # scip-go and scip-typescript come from the caller's pinned mise environment. scip-buzz
    # is built from this checkout so graph preparation and target execution use one indexer set.
    - name: Install and verify SCIP indexers
      shell: bash
      working-directory: libs/scipbuzz
      run: |
        go install ./cmd/scip-buzz
        scip-go --version
        scip-buzz --version
        scip-typescript --version
