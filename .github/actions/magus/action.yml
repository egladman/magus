name: magus
description: >
  Invoke a magus subcommand, or merge per-shard run histories.

  Three modes, all end-to-end CI work rather than three actions to wire up:
  a command, the run summary, and the per-shard history merge.

  Default mode (merge-history and report both false) runs `magus <command>`, setting
  MAGUS_SHARD/MAGUS_N_SHARDS first so shard-aware subcommands (e.g. `run`) emit
  ci.shard.total timing events without extra shell logic in the workflow. When `shard`
  is set it also uploads that shard's run history afterwards.

  Merge mode (merge-history: true) ignores `command` and instead folds every shard
  history this run uploaded into the prior one (freshest-wins) and saves the merged
  result for the next run — the aggregation step of a sharded CI run.

  Between this action and setup-magus the history round trip is complete and no
  caller writes any of it: setup-magus sets MAGUS_HISTORY_PATH and restores the
  prior history, default mode uploads each shard's, merge mode folds them back in.
  A workflow wires three `uses:` lines and gets shard forecasting; it does not copy
  a cache key, a path, or an artifact pattern, and cannot get one subtly wrong.

inputs:
  command:
    description: >
      Full magus argv after `magus`
      (e.g. "ci github", "run ci pkg-a pkg-b", "affected ci --base origin/main").
      Required unless merge-history is true.
    required: false
    default: ''
  shard:
    description: Shard ID within this CI matrix run (e.g. "0"). Maps to MAGUS_SHARD.
    required: false
    default: ''
  n-shards:
    description: Total number of shards in this matrix run. Maps to MAGUS_N_SHARDS.
    required: false
    default: ''
  merge-history:
    description: >
      When "true", ignore `command` and merge the per-shard run histories this
      run's shards uploaded as `magus-history-*` artifacts into the persisted
      history.
    required: false
    default: 'false'
  report:
    description: >
      When "true", write the run's outcome and the workspace's insight report to the
      GitHub step summary. Combines with merge-history: both are end-of-run work, and a
      caller that wants them wants them in one place.
    required: false
    default: 'false'
  ci-result:
    description: >
      With report, the result of the job that ran the CI shards
      (success | failure | cancelled | skipped).
    required: false
    default: ''
  shard-count:
    description: With report, how many shards the affected set produced.
    required: false
    default: '0'

runs:
  using: composite
  steps:
    # Report first: it describes the run that just finished, and the history merge below
    # changes what a later reader would see.
    - name: Summarize the run
      if: inputs.report == 'true'
      shell: bash
      env:
        BUZZ_INCLUDE_PATH: ${{ github.action_path }}
        CI_RESULT: ${{ inputs.ci-result }}
        SHARD_COUNT: ${{ inputs.shard-count }}
      run: magus buzz "$GITHUB_ACTION_PATH/ci-outcome.buzz"

    - name: Run magus
      if: inputs.merge-history != 'true' && inputs.report != 'true'
      shell: bash
      env:
        MAGUS_SHARD:       ${{ inputs.shard }}
        MAGUS_N_SHARDS:    ${{ inputs.n-shards }}
        # Via env, not interpolation: inputs.command comes from directory names;
        # shell metacharacters would execute if templated into the run line.
        INPUT_COMMAND: ${{ inputs.command }}
      # Passing the command through the environment rather than templating it into the
      # run line is what makes this safe, and it is sufficient on its own - an unquoted
      # expansion word-splits, it does not interpret `;` or `|` as operators, so
      # `version; echo PWNED` reaches magus as three arguments and is refused by argument
      # parsing. A shell-metacharacter reject used to sit here and could only ever have
      # rejected commands that were already safe.
      #
      # Word-split is intentional: INPUT_COMMAND is a space-separated argv.
      # shellcheck disable=SC2086
      run: magus $INPUT_COMMAND

    # The write half of the history round trip; setup-magus does the read half. A shard
    # that ran is a shard with timings worth keeping, so this is keyed on `shard` being
    # set rather than on an event or a ref: which histories get KEPT is the merge
    # step's decision (below), and a caller that folds in only main's still gets the
    # right answer. Uploading one small JSON per shard is the cost of that split.
    #
    # always(), because a shard that was cancelled or that failed still measured every
    # target it finished, and those are the runs whose timings the forecaster most needs.
    # if-no-files-found: ignore, because a shard killed mid-target never reached the end
    # of the run that writes the file - and for a run that did not finish, no history is
    # the honest answer rather than a partial one.
    - name: Upload this shard's history
      if: always() && inputs.shard != '' && inputs.merge-history != 'true' && inputs.report != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: magus-history-${{ inputs.shard }}
        path: ${{ runner.temp }}/magus-history.json
        if-no-files-found: ignore
        retention-days: 7

    # --- merge-history mode --------------------------------------------------
    # setup-magus already restored the prior history to this path, so this mode only
    # folds each shard's in (freshest-wins) and saves the result under the run's key.
    # It used to restore it again here; that step went when setup-magus took over the
    # read half, since two restores of the same key to the same path is one too many.
    #
    # always() on all three: they are the aggregation of a run that has already ended,
    # and the job-level `if: always()` that gets them scheduled does NOT reach the steps
    # inside a composite action - a bare `if:` here implies success(), so a failing
    # summarize step above would silently skip the merge. That is the case history
    # matters most in: the runs that go red are the ones whose timings the forecaster
    # needs, and losing them means the next plan plans blind.
    - name: Download shard histories
      if: always() && inputs.merge-history == 'true'
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: ${{ runner.temp }}/shard-history
        pattern: magus-history-*

    # Two writes, and the second must not be gated on the first. A run whose affected
    # set was empty uploads no shard history and still passed, and its commit has to be
    # recorded or `--base last-passed` pins itself to whichever commit last happened to
    # touch something and widens every later diff without bound.
    - name: Merge histories
      if: always() && inputs.merge-history == 'true'
      shell: bash
      env:
        CI_RESULT: ${{ inputs.ci-result }}
        REF: ${{ github.ref_name }}
        COMMIT: ${{ github.sha }}
      run: |
        shopt -s nullglob
        files=("$RUNNER_TEMP"/shard-history/*/magus-history.json)
        if [[ ${#files[@]} -gt 0 ]]; then
          magus config history import --history "$RUNNER_TEMP/magus-history.json" "${files[@]}"
        else
          echo "no shard histories; nothing to merge"
        fi
        # Only success and failure are outcomes of THIS commit. A cancelled run measured
        # nothing conclusive, and recording it as failed would be a lie that then keeps
        # every following diff wide; leaving it unrecorded is what makes the next run
        # pick these commits up, which is the entire point.
        case "$CI_RESULT" in
          success) STATUS=passed ;;
          failure) STATUS=failed ;;
          *)       echo "ci result '$CI_RESULT' is not an outcome; recording nothing"; exit 0 ;;
        esac
        magus config history passed \
          --history "$RUNNER_TEMP/magus-history.json" \
          --ref "$REF" --commit "$COMMIT" --status "$STATUS"

    - name: Save merged run history
      if: always() && inputs.merge-history == 'true'
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.temp }}/magus-history.json
        key: ${{ github.workflow }}-magus-history-v1-${{ github.run_id }}
