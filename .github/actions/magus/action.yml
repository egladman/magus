name: magus
description: >
  Invoke a magus subcommand, or merge per-shard run histories.

  Three modes, all end-to-end CI work rather than three actions to wire up:
  a command, the run summary, and the per-shard history merge.

  Default mode (merge-history and report both false) runs `magus <command>`, setting
  MAGUS_SHARD/MAGUS_N_SHARDS first so shard-aware subcommands (e.g. `run`) emit
  ci.shard.total timing events without extra shell logic in the workflow.

  Merge mode (merge-history: true) ignores `command` and instead restores the
  prior run history, folds in every shard history this run uploaded
  (freshest-wins), and saves the merged result for the next run — the
  aggregation step of a sharded CI run. It is self-contained: it keys the cache
  by run and stages files under the runner temp dir, so the caller needs no
  history plumbing of its own.

inputs:
  command:
    description: >
      Full magus argv after `magus`
      (e.g. "ci github", "run ci pkg-a pkg-b", "affected ci --base origin/main").
      Required unless merge-history is true.
    required: false
    default: ''
  shard:
    description: Shard ID within this CI matrix run (e.g. "0"). Maps to MAGUS_SHARD.
    required: false
    default: ''
  n-shards:
    description: Total number of shards in this matrix run. Maps to MAGUS_N_SHARDS.
    required: false
    default: ''
  merge-history:
    description: >
      When "true", ignore `command` and merge the per-shard run histories this
      run's shards uploaded as `magus-history-*` artifacts into the persisted
      history.
    required: false
    default: 'false'
  report:
    description: >
      When "true", write the run's outcome and the workspace's insight report to the
      GitHub step summary. Combines with merge-history: both are end-of-run work, and a
      caller that wants them wants them in one place.
    required: false
    default: 'false'
  ci-result:
    description: >
      With report, the result of the job that ran the CI shards
      (success | failure | cancelled | skipped).
    required: false
    default: ''
  shard-count:
    description: With report, how many shards the affected set produced.
    required: false
    default: '0'

runs:
  using: composite
  steps:
    # Report first: it describes the run that just finished, and the history merge below
    # changes what a later reader would see.
    - name: Summarize the run
      if: inputs.report == 'true'
      shell: bash
      env:
        BUZZ_INCLUDE_PATH: ${{ github.action_path }}
        CI_RESULT: ${{ inputs.ci-result }}
        SHARD_COUNT: ${{ inputs.shard-count }}
      run: magus buzz "$GITHUB_ACTION_PATH/ci-outcome.buzz"

    - name: Run magus
      if: inputs.merge-history != 'true' && inputs.report != 'true'
      shell: bash
      env:
        MAGUS_SHARD:       ${{ inputs.shard }}
        MAGUS_N_SHARDS:    ${{ inputs.n-shards }}
        # Via env, not interpolation: inputs.command comes from directory names;
        # shell metacharacters would execute if templated into the run line.
        INPUT_COMMAND: ${{ inputs.command }}
      run: |
        if [ -z "$INPUT_COMMAND" ]; then
          echo "::error::magus action: command is required unless merge-history is true"; exit 1
        fi
        # Belt-and-braces: reject shell metacharacters (env indirection is the real fix).
        case "$INPUT_COMMAND" in
          *[\;\&\|\`\$\(\)\<\>\!\\]*) echo "::error::magus action: command contains shell metacharacters: $INPUT_COMMAND"; exit 1 ;;
        esac
        # Headroom trace, backgrounded INSIDE this step on purpose.
        #
        # A shard has repeatedly ended as CANCELLED with "The runner has received a
        # shutdown signal" and no diagnostics whatsoever - the runner going away
        # mid-run, not a target failing. Nothing outlives that: every later step
        # reports conclusion=skipped, so an artifact upload cannot collect anything
        # however its `if:` is written, and magus never reaches the end of the
        # invocation where it prints the failure summary. The only channel that
        # survives is this log, because Actions streams it live - so the trace goes
        # to stdout, and it has to be started here rather than in its own step,
        # because a background writer loses its pipe once the step that spawned it
        # returns.
        #
        # It watches what a concurrency limit cannot. magus sizes itself
        # min(NumCPU,8) and `go test -p` follows GOMAXPROCS, so both scale on CORES,
        # while the two plausible killers scale on neither: the race detector's
        # shadow memory, and gopherbuzz's string intern table, which has no eviction
        # anywhere in the tree and grows for the life of the process. Disk is here
        # too, since a full disk takes a runner down just as quietly.
        # Plain stdout, not ::debug::, deliberately: a debug line is invisible unless
        # someone re-runs with debug logging on, and the whole point is to catch the
        # NEXT occurrence rather than ask for one.
        #
        # SAMPLE FAST, PRINT RARELY. This first shipped at one line per 30s, and that
        # interval cannot answer the question it was built for: a shard died 30s after
        # a sample that read 13.8GB free, so the trace showed "no pressure" while
        # saying nothing about the 30 seconds that actually killed the runner. A Go
        # test binary can allocate its way out of 14GB in well under that. So sample
        # every 2s and keep a LOW-WATER MARK, printing only when the floor drops by
        # more than 250MB - dense enough that a spike cannot hide between samples,
        # quiet enough that a healthy shard still costs a handful of lines. The
        # heartbeat every 60s distinguishes "nothing got worse" from "the tracer died".
        ( low=99999999; last_beat=0; beat=0
          while true; do
            avail=$(free -m 2>/dev/null | awk '/^Mem:/{print $7}')
            case "$avail" in ''|*[!0-9]*) avail=$low ;; esac
            if [ "$avail" -lt $((low - 250)) ]; then
              low=$avail
              printf '[headroom] %s NEW LOW mem_avail=%sMB disk_avail=%sMB\n' \
                "$(date -u +%H:%M:%S)" "$avail" \
                "$(df -m --output=avail / 2>/dev/null | tail -1 | tr -d ' ')"
            elif [ "$avail" -lt "$low" ]; then
              low=$avail
            fi
            beat=$((beat + 2))
            if [ $((beat - last_beat)) -ge 60 ]; then
              last_beat=$beat
              printf '[headroom] %s floor=%sMB now=%sMB disk_avail=%sMB\n' \
                "$(date -u +%H:%M:%S)" "$low" "$avail" \
                "$(df -m --output=avail / 2>/dev/null | tail -1 | tr -d ' ')"
            fi
            sleep 2
          done ) &
        headroom=$!
        trap 'kill "$headroom" 2>/dev/null || true' EXIT

        # Word-split is intentional here: INPUT_COMMAND is a space-separated argv.
        # shellcheck disable=SC2086
        magus $INPUT_COMMAND

    # --- merge-history mode --------------------------------------------------
    # Prior history is the base, then each shard's is folded in. The local path
    # is private to this action; the cache key (keyed by run) is what threads the
    # history from the shards through to the next run.
    - name: Restore previous run history
      if: inputs.merge-history == 'true'
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/magus-history.json
        key: ${{ github.workflow }}-magus-history-v1-${{ github.run_id }}
        restore-keys: |
          ${{ github.workflow }}-magus-history-v1-

    - name: Download shard histories
      if: inputs.merge-history == 'true'
      uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
      with:
        path: ${{ runner.temp }}/shard-history
        pattern: magus-history-*

    - name: Merge histories
      if: inputs.merge-history == 'true'
      shell: bash
      run: |
        shopt -s nullglob
        files=("$RUNNER_TEMP"/shard-history/*/magus-history.json)
        [[ ${#files[@]} -gt 0 ]] || { echo "no shard histories; nothing to merge"; exit 0; }
        magus config history import --history "$RUNNER_TEMP/magus-history.json" "${files[@]}"

    - name: Save merged run history
      if: inputs.merge-history == 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
      with:
        path: ${{ runner.temp }}/magus-history.json
        key: ${{ github.workflow }}-magus-history-v1-${{ github.run_id }}
