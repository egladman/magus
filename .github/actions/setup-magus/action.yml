name: Setup magus
description: >
  Install the magus binary into the runner tool cache ($RUNNER_TOOL_CACHE) and
  add it to PATH. Magus is installed either from a signed GitHub Release or by
  building from source.

inputs:
  installation-strategy:
    description: >
      Controls how magus is installed. automatic tries a signed release
      artifact for git-ref first; if none exists (no release for this git-ref,
      or none published for this OS/arch), it builds that SAME git-ref from
      source instead - the fallback never substitutes a different version.
      prebuilt requires a signed release artifact for git-ref and fails if one
      is unavailable, with no source fallback. source skips the
      release-artifact lookup entirely and always builds git-ref from source.
      Any source build off git-ref - whether automatic's fallback or an explicit
      source - additionally requires the resolved commit to be an ancestor of
      main (see the "Verify source commit is reachable from main" step below),
      so automatic can still fail if git-ref is a real but unmerged tag. Only
      source-path skips that gate.
      One of: automatic, prebuilt, source.
    required: false
    default: automatic

  git-ref:
    description: >
      Git reference identifying the magus revision to install: a release tag
      (for example v0.3.0), a branch name, or a commit SHA. Always fetched
      fresh from egladman/magus into an isolated directory, independent of
      anything already checked out in this job - callers that want to build
      the exact commit already on disk (e.g. a release workflow bootstrapping
      itself from the tag it is building) must pass that ref explicitly.
      Release tags are required for automatic and prebuilt; branches and
      commit SHAs only work with source. Ignored when source-path is set.
    required: false
    default: v0.3.0

  source-path:
    description: >
      Path to a magus source tree the caller has ALREADY checked out, relative
      to the workspace. When set, git-ref is ignored, nothing is cloned, and the
      reachable-from-main gate below does not apply - there is no foreign code
      being fetched to gate, only source the caller already put on disk and is
      already running its own workflow from. Requires installation-strategy:
      source.
      This is the dogfooding input: magus's own CI passes '.' so a pull request
      is tested against the magus built from that very pull request. Note that
      git-ref cannot express this - on a pull_request event github.sha is the
      ephemeral refs/pull/N/merge commit, a DESCENDANT of main, so the gate
      below rejects it every time.
      Callers installing magus as a dependency should leave this unset.
    required: false
    default: ''

outputs:
  version:
    description: >
      The version of the magus this action installed, read back from the binary
      itself (`magus version -o name`). Derived, not assumed: it is correct for a
      prebuilt release, a source build, and automatic's fallback between them, so a
      caller reports the magus it actually got rather than the one it asked for.
    value: ${{ steps.installed.outputs.version }}
  install-source:
    description: >
      How magus got here: `prebuilt` (a signed release artifact) or `source` (compiled
      here). Worth reading because `automatic` falls back from one to the other
      SILENTLY - today the only trace is a log notice - and a caller that means to test
      against a real release is otherwise testing source against source without knowing.
    value: ${{ steps.strategy.outputs.resolved }}
  commit:
    description: >
      The commit the installed binary was built from, as it reports itself. Pins what
      actually ran when `version` is a tag shared by rebuilds, or a describe string.
    value: ${{ steps.installed.outputs.commit }}

runs:
  using: composite
  steps:
    # source-path silently losing to a release install would be the worst
    # possible failure here: the job would look green while testing a magus
    # that is not the one on disk.
    - name: Reject source-path without a source build
      if: inputs.source-path != '' && inputs.installation-strategy != 'source'
      shell: bash
      run: |
        echo "::error::magus: source-path is set but installation-strategy is '${{ inputs.installation-strategy }}'; source-path builds the tree already on disk, so it only applies with installation-strategy: source" >&2
        exit 1

    - name: Sparse checkout install script
      if: inputs.installation-strategy != 'source'
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      with:
        repository: egladman/magus
        path: .setup-magus-install
        sparse-checkout: 'docs/gen/install'
        sparse-checkout-cone-mode: false

    - name: Install magus from release
      id: prebuilt
      if: inputs.installation-strategy != 'source'
      # Only automatic may fall through to a source build; under prebuilt this
      # step's failure must fail the job (enforced below), not be swallowed.
      continue-on-error: ${{ inputs.installation-strategy == 'automatic' }}
      shell: bash
      working-directory: .setup-magus-install
      env:
        MAGUS_RELEASE_PUBKEY_HEX: ffbb8fa6f36274defd12888093c6a322c2532bc545016f495ab4955decb66779
      run: |
        set -euo pipefail
        INSTALL_PREFIX="$RUNNER_TOOL_CACHE/magus"
        VERSION="${{ inputs.git-ref }}"
        if [ -z "${VERSION}" ]; then
          echo "::error::magus: installation-strategy '${{ inputs.installation-strategy }}' needs git-ref set to a release tag" >&2
          exit 1
        fi
        sh ./docs/gen/install

    # `automatic` picks at runtime, so resolve it ONCE here and let every step below ask
    # this instead of re-deriving it from the prebuilt step's outcome. A skipped prebuilt
    # step is not a success, so the explicit `source` strategy lands here too.
    - name: Resolve the install strategy
      id: strategy
      shell: bash
      run: echo "resolved=${{ steps.prebuilt.outcome == 'success' && 'prebuilt' || 'source' }}" >> "$GITHUB_OUTPUT"

    - name: Fail if prebuilt required but unavailable
      if: inputs.installation-strategy == 'prebuilt' && steps.strategy.outputs.resolved == 'source'
      shell: bash
      run: |
        echo "::error::magus: no signed release artifact for git-ref '${{ inputs.git-ref }}' on $(uname -s)/$(uname -m); installation-strategy is prebuilt, so no source fallback was attempted. Use automatic to fall back to a source build, or source to build git-ref directly." >&2
        exit 1

    # Visibility for automatic's silent (continue-on-error) prebuilt failure:
    # without this, the only sign a source build even happened is the absence
    # of the "installed prebuilt" log line above.
    - name: Note fallback to source build
      if: inputs.installation-strategy == 'automatic' && steps.strategy.outputs.resolved == 'source'
      shell: bash
      run: |
        echo "::notice::magus: no signed release artifact for git-ref '${{ inputs.git-ref }}' on $(uname -s)/$(uname -m); compiling from source instead, this step will take noticeably longer than a prebuilt install" >&2

    # Everything below only runs when there's no prebuilt binary. This action
    # never installs liblzma-dev/libzstd-dev/pkg-config: the bootstrap build
    # is CGO_ENABLED=0 (see "Build magus from source" below) and never
    # touches internal/codec's cgo path. A caller whose own downstream step
    # needs a real cgo build - cd.yaml's release-<platform> jobs, ci.yaml's
    # "ci" job - installs those itself. Keying that on installation-strategy
    # would be wrong: it has nothing to do with what the caller does after
    # this action returns.
    # Skipped entirely when source-path is set: the source is already on disk.
    # Otherwise checked out into an isolated subdirectory (path:), never the
    # workspace root: a caller may already have its own checkout there - CD's
    # release jobs need their full-history clone intact for `git describe --tags`
    # afterward - and checking out over it would shrink it to this action's
    # depth. fetch-depth: 0 because the ancestry check below needs main's
    # full commit graph - but only the graph: filter: blob:none leaves every
    # historical file content on the server and still lets merge-base --is-ancestor
    # answer. The checkout materializes git-ref's own blobs, which is what the
    # source build compiles.
    - name: Clone magus source code
      if: steps.strategy.outputs.resolved == 'source' && inputs.source-path == ''
      uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
      with:
        repository: egladman/magus
        ref: ${{ inputs.git-ref }}
        path: .setup-magus-src
        fetch-depth: 0
        filter: blob:none

    # setup-go reads the version from the source revision being installed. Clone
    # first: on an automatic fallback the caller's checkout can be a different
    # revision, and .setup-magus-src does not exist until the preceding step.
    - name: Setup Go
      if: steps.strategy.outputs.resolved == 'source'
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: ${{ inputs.source-path != '' && inputs.source-path || '.setup-magus-src' }}/go.mod
        # No cache: true here. The Go this step provisions is a one-shot,
        # transient toolchain used only for the magus source build below; the
        # workflow's primary Go comes from mise, and doubling up the GHA
        # actions/cache on ~/go/pkg/mod produced silent tar failures when HOME
        # changed between cache create and restore. Cold source build is
        # ~30s slower on the rare path; it is rare because the prebuilt
        # artifact is the normal install route.

    # Supply-chain gate: a source build has no signature to check (unlike the
    # prebuilt path above), so before compiling and running whatever git-ref
    # points at, require that its commit has actually been merged to main -
    # i.e. it went through review, not just pushed to some branch or tag. This
    # stops an attacker who can push refs but not rewrite main (a lesser
    # compromise than full repo takeover) from getting an unreviewed commit
    # built and executed with this job's permissions. It does not protect
    # against main itself being compromised.
    # Gates git-ref only. source-path skips this by construction: the caller
    # checked that tree out under its own workflow and is already executing it.
    - name: Verify source commit is reachable from main
      if: steps.strategy.outputs.resolved == 'source' && inputs.source-path == ''
      shell: bash
      working-directory: .setup-magus-src
      run: |
        set -euo pipefail
        git fetch origin main
        SHA="$(git rev-parse HEAD)"
        if git merge-base --is-ancestor "${SHA}" origin/main; then
          echo "magus: ${SHA} is reachable from main" >&2
          exit 0
        fi
        # A pull_request event's github.sha is the ephemeral refs/pull/N/merge
        # commit: parents are (main tip, PR head), so it is a DESCENDANT of main
        # and this gate rejects it 100% of the time. That is a caller mistake,
        # not a supply-chain finding, and it read as one for long enough to be
        # worth naming outright.
        if git rev-parse -q --verify "${SHA}^2" >/dev/null && git merge-base --is-ancestor "${SHA}^1" origin/main; then
          echo "::error::magus: git-ref '${{ inputs.git-ref }}' resolves to ${SHA}, a merge of an unmerged commit into main. This is what github.sha expands to on a pull_request event, and it is never reachable from main, so git-ref cannot express it. To build a pull request against its own magus, check the source out yourself and pass source-path instead of git-ref." >&2
          exit 1
        fi
        echo "::error::magus: git-ref '${{ inputs.git-ref }}' resolves to ${SHA}, which is not reachable from egladman/magus main. Refusing to build unreviewed source." >&2
        exit 1

    - name: Build magus from source
      if: steps.strategy.outputs.resolved == 'source'
      shell: bash
      working-directory: ${{ inputs.source-path != '' && inputs.source-path || '.setup-magus-src' }}
      # CGO_ENABLED=0: the bootstrap magus only orchestrates builds (it never needs
      # internal/codec's cgo xz/zstd fast path), so build it pure-Go. This keeps the
      # bootstrap off pkg-config/liblzma/libzstd entirely - on Windows the default
      # cgo build otherwise grabs Strawberry Perl's broken pkg-config and fails before
      # the real release-build (which sets up the mingw toolchain) ever runs.
      env:
        SOURCE_DESC: ${{ inputs.source-path != '' && format('source-path ''{0}''', inputs.source-path) || format('git-ref ''{0}''', inputs.git-ref) }}
      run: |
        if [ "${{ inputs.installation-strategy }}" = "source" ]; then
          echo "::notice::magus: installation-strategy is source; compiling ${SOURCE_DESC} instead of downloading a release" >&2
        fi
        mkdir -p "$RUNNER_TOOL_CACHE/magus/bin"
        CGO_ENABLED=0 go build -o "$RUNNER_TOOL_CACHE/magus/bin/magus" ./cmd/magus
        echo "magus: built ${SOURCE_DESC} from source (CGO_ENABLED=0 bootstrap)" >&2

    # A leftover magus checkout under the caller's workspace is a second
    # magusfile.buzz/spells tree; if the caller is magus's own repo, its next
    # `magus` invocation trips MGS1002 (duplicate spell sources) over it.
    # Never runs on the source-path route: that directory belongs to the caller
    # and nothing was cloned to clean up.
    - name: Remove magus source checkout
      if: always() && steps.strategy.outputs.resolved == 'source' && inputs.source-path == ''
      shell: bash
      run: rm -rf .setup-magus-src

    - name: Add magus to PATH
      shell: bash
      run: echo "$RUNNER_TOOL_CACHE/magus/bin" >> "$GITHUB_PATH"

    # No job here runs a daemon, so MCP/console have nothing to listen on.
    # Exported via GITHUB_ENV so every later `magus` call in the job picks
    # it up, not just this step. Otherwise magus doctor's console check
    # always fails (checks_mcp.go's probeBridgeReachability).
    - name: Disable console/MCP for CI
      shell: bash
      run: |
        echo "MAGUS_CONSOLE_ENABLED=false" >> "$GITHUB_ENV"
        echo "MAGUS_MCP_ENABLED=false" >> "$GITHUB_ENV"

    - name: Verify magus
      shell: bash
      run: magus version

    - name: Write job summary
      shell: bash
      run: |
        {
          if [ "${{ steps.strategy.outputs.resolved }}" = "prebuilt" ]; then
            echo "magus: installed prebuilt release, git-ref \`${{ inputs.git-ref }}\` (signature verified)"
          elif [ -n "${{ inputs.source-path }}" ]; then
            echo "magus: built from source, source-path \`${{ inputs.source-path }}\` (the caller's own checkout)"
          else
            echo "magus: built from source, git-ref \`${{ inputs.git-ref }}\` (verified reachable from main)"
          fi
          echo
          echo '```'
          magus version
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # magus emits the key=value lines itself.
    - name: Report the installed version
      id: installed
      shell: bash
      run: magus version -o 'template=version={{.version}}{{"\n"}}commit={{.commit}}{{"\n"}}' >> "$GITHUB_OUTPUT"
