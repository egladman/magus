name: magus summary
description: >
  Write the run's outcome, and the workspace's insight report, to the GitHub step
  summary.

  Separate from the advice action on purpose: a step summary belongs to ONE run and is
  rewritten by the next push, while advice belongs to the pull request and accumulates
  meaning across pushes. Mixing them puts always-changing content in a comment, which is
  how a bot gets muted.

  Requires magus on PATH - run egladman/magus/.github/actions/setup-magus first.

inputs:
  ci-result:
    description: The result of the job that ran the CI shards (success | failure | cancelled | skipped).
    required: true
  shard-count:
    description: How many shards the affected set produced.
    required: false
    default: '0'

runs:
  using: composite
  steps:
    - name: Summarize the run
      shell: bash
      env:
        BUZZ_INCLUDE_PATH: ${{ github.action_path }}
        CI_RESULT: ${{ inputs.ci-result }}
        SHARD_COUNT: ${{ inputs.shard-count }}
      run: magus buzz "$GITHUB_ACTION_PATH/ci-outcome.buzz"
