name: magus advice
description: >
  Post non-blocking review nudges on a pull request. Each advisor is silent unless it
  has something to say, and each is one input you can turn off by name; the read-only
  ones are on by default, so a new advisor arrives without a workflow edit.

  Named for doctor's [advice] level, so the CI surface and the tool share one word for
  "worth knowing, never a gate".

  All advisors write into ONE comment, each owning a section it replaces on every run
  and RETRACTS when it has nothing to say - so the comment is a current statement of
  what magus knows, not an accumulating thread.

  Requires magus on PATH - run egladman/magus/.github/actions/setup-magus first. Each
  advisor runs against the caller's checkout, so check out before this step. The
  read-only advisors never mutate the checkout: the conflict advisor merges in memory
  with `git merge-tree`, so there is no merge to abort and no half-merge to strand.

  The pull request comes from the event that triggered the workflow; an event carrying
  none leaves every advisor silent. The calling step must set GITHUB_TOKEN in its env
  (see the note above `runs`).

inputs:
  merge-conflicts:
    description: >
      Comment when this PR's merge conflicts land in files the workspace declares as
      generated. Those cannot be resolved in the web editor - the correct merge of build
      output is whatever regenerating produces - so the comment names the files and the
      command that settles them.
    required: false
    default: 'true'
  target-outputs:
    description: >
      Comment when the pull request adds a target that declares no outputs, which can
      never replay from cache. Only new targets; an existing one is a decision already made.
    required: false
    default: 'true'
  doctor:
    description: >
      Report what `magus doctor` finds about the workspace. Non-blocking by design, so a
      consumer who never wired doctor into their own pipeline still sees it.
    required: false
    default: 'true'
  version-floor:
    description: >
      Comment when the pull request raises `required_version`, which every contributor
      has to act on before they can load the workspace at all.
    required: false
    default: 'true'
  blast-radius:
    description: >
      Comment when a change reaches a large share of the workspace, naming the dependency
      chain that pulled each project in. Threshold is `fanout-share`, not a count: five
      projects is most of a small workspace and a rounding error in a large one.
    required: false
    default: 'true'
  fanout-share:
    description: Share of the workspace a change must reach before blast-radius comments.
    required: false
    default: '0.5'
  unclaimed:
    description: >
      Comment when the pull request changes files no project declares, which the checks
      therefore say nothing about.
    required: false
    default: 'true'
  skip-cache:
    description: >
      Comment when the pull request opts a target out of the cache, quoting the reason
      magus requires for it.
    required: false
    default: 'true'
  conformance:
    description: >
      Comment when the pull request adds a target whose name diverges from what the rest
      of the workspace already calls the same work, derived by grouping targets on the
      ops they invoke, or a symbol whose name or size diverges from declarations of the
      same shape. Silent unless a large cohort agrees overwhelmingly, so a workspace
      with no convention produces nothing.
    required: false
    default: 'true'
  conformance-min-cohort:
    description: >
      How many targets must share an op set before their naming counts as a convention.
      Below this, agreement is a coincidence rather than a norm.
    required: false
    default: '5'
  conformance-min-share:
    description: >
      Share of a cohort that must agree on a name before a divergence is worth raising.
      A near-even split is a workspace that has not decided, not a violation.
    required: false
    default: '0.8'
  missing-target:
    description: >
      Comment when the pull request touches a project missing a target that projects of
      the same kind overwhelmingly have. Cohorts are keyed on the SPELL set, so a schema
      project is only ever measured against other schema projects and never against a
      service that happens to have a test target.
    required: false
    default: 'true'
  missing-target-min-cohort:
    description: >
      How many projects of a kind must exist before what they expose counts as a norm.
    required: false
    default: '5'
  missing-target-min-share:
    description: >
      Share of a cohort that must expose a target before its absence elsewhere is worth
      raising.
    required: false
    default: '0.8'
  api-surface:
    description: >
      Comment when the pull request changes symbols a consumer can see: reachable from
      outside the project that defines them, or exported from the module. That is the
      version-bump conversation, and it is the one a reviewer usually has too late.

      States EVIDENCE and never a verdict. It reports who can see what you changed and
      does not decide whether it broke - deciding that needs signature compatibility
      against the base, which magus does not index.
    required: false
    default: 'true'
  first-contribution:
    description: >
      Welcome someone opening their first pull request here, with the two repository
      rules CI enforces. Retracts itself the moment they have a merged pull request, so
      a regular contributor never sees it.
    required: false
    default: 'true'
  merge-queue:
    description: >
      Name the label that queues an approved pull request, while it could join `magus
      queue` and has not: open, approved, targeting `merge-queue-base`, not from a fork,
      with neither auto-merge nor a queue label. The label and the merge methods come from
      `magus queue describe`. Retracts once the pull request is queued, merged or closed.

      OFF by default: it only makes sense where the queue runs, and it needs a workflow
      that reruns on labels and reviews, which the other advisors do not.
    required: false
    default: 'false'
  merge-queue-base:
    description: The branch the merge queue merges into.
    required: false
    default: ${{ github.event.repository.default_branch }}
  merge-queue-provider:
    description: The `magus queue` provider, a built-in name or a .buzz file.
    required: false
    default: 'github'
  fix-generated-drift:
    description: >
      Regenerate drifted generated files and PUSH the result to the pull request branch.

      OFF by default, because it is the one advisor that writes. Turning it on here is
      only half the consent: the pull request must ALSO carry the label named by
      `fix-label`, so the repository allows the capability and a human asks for it per
      change. Needs `contents: write` on the job, and cannot work on a fork PR (the
      token has no write access to the fork) - it says so in the comment rather than
      failing.
    required: false
    default: 'false'
  offer-fix-label:
    description: >
      Name `fix-label` in the merge-conflict comment, so the reader can hand the work to
      magus instead of doing it locally.

      Its own input rather than a consequence of `fix-merge-conflict`, because the two
      run in different jobs: the comment is written by a read-only advisor, and the fixer
      needs `contents: write` and the head branch checked out, so a repository that
      honours the label does so from a job this one cannot see. Set it where such a job
      exists - an offer nobody can accept is worse than no offer.
    required: false
    default: 'false'
  fix-merge-conflict:
    description: >
      Merge the base branch in and settle the resulting conflicts by regenerating, then
      PUSH the merge to the pull request branch. Applies only when every conflict is in a
      file the workspace declares as output; anything else is left for a human and named
      in the comment.

      OFF by default, for the same reason as fix-generated-drift: it writes. Same two-party
      consent - this input plus the `fix-label` label. Needs `contents: write`, and the
      job must check out the PR HEAD BRANCH by name, not the default ephemeral merge ref;
      the advisor refuses rather than pushing the wrong commit.
    required: false
    default: 'false'
  fix-label:
    description: >
      The label REQUESTING a fix. One label for both fixers: "magus, settle what you can
      here", not "run this script". STANDING - it is never retired, so the same PR is
      settled again the next time main breaks it. Remove it to stop.
    required: false
    default: 'magus:regenerate:requested'
  baseline:
    description: >
      A `magus graph export --symbols -o json` of the revision this pull request started
      from, which api-surface reads to say what each changed symbol did to the API and the
      smallest semver bump that proves, and conformance reads to tell a symbol the change
      adds, renames or re-signs from one it only edits.

      Signatures are compared as the indexer rendered them, so the base must be indexed with
      the same indexers as the head, and ideally in the same checkout: two environments
      render one declaration differently and every difference reads as a changed signature.

      Without it api-surface reports who can see the change and claims no bump, which is
      what it did before a baseline was possible, and conformance reads what is new from the
      patch, compares no re-signed symbol, and says so under its findings.
    required: false
    default: ''

# The token is never an input. The calling step sets GITHUB_TOKEN in its env from the
# workflow's secrets.GITHUB_TOKEN, and the step here inherits it; advise.buzz fails
# naming that fix when it is missing. No expression spells it out here: a composite
# action has no secrets context, and GitHub refuses to load one that names it.
#
# It reads and posts the comment, and pushes when a fixer is on, so it needs
# `pull-requests: write`, which GitHub withholds on a pull request from a fork.
runs:
  using: composite
  steps:
    # advise.buzz reads the pull request from the event payload and runs each enabled
    # advisor. BUZZ_INCLUDE_PATH is how the scripts find advice.buzz beside them: they run
    # from the CALLER's checkout, so the action's own directory is not on the search path
    # unless it is named here.
    - name: Advise
      shell: bash
      env:
        BUZZ_INCLUDE_PATH: ${{ github.action_path }}
        ADVICE_INPUTS: ${{ toJSON(inputs) }}
      run: magus buzz "$GITHUB_ACTION_PATH/advise.buzz"
