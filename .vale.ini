# Vale judges text magus extracts, never a source file: hack/prose writes each kind of
# text to a document whose extension picks the rules below. Each rule's cases sit
# beside it as <Rule>.test.yml; `vale test --coverage .vale/styles/Magus` runs them.
#
# Vale owns wording, filler, budgets and terminology. Go comment structure (name-first,
# period, restating, steps, commented-out code, asides, history) belongs to golangci and
# libs/coldread, and a pull request description's budget and shape to the guard.
StylesPath = .vale/styles
MinAlertLevel = suggestion

# Comments and names are plain text: Vale's Markdown spans drift where inline markup
# precedes a match (63 of 259 filler alerts landed on the wrong column), and the
# position table needs them exact.
[formats]
comments = txt
names = txt
commit = md
prtitle = md
pr = md

# Comment blocks, one paragraph each (hack/prose/comments.buzz).
[*.comments]
Magus.CommentBlock = YES
Magus.CommentSentence = YES
Magus.Filler = YES
Magus.Terms = YES

# Function and method names from the symbol indexes, one per line (hack/prose/names.buzz).
[*.names]
Magus.NameSuffix = YES

# A commit message: the subject as a heading, anything after it as body.
[*.commit]
Magus.SubjectLength = YES
Magus.CommitBody = YES
Magus.Lowercase = YES
Magus.Imperative = YES
Magus.Attribution = YES
Magus.Puffery = YES
Magus.ASCII = YES

# A pull request title, as a heading. pr-title's conventional rule owns its length and case.
[*.prtitle]
Magus.Imperative = YES
Magus.Attribution = YES
Magus.Puffery = YES
Magus.ASCII = YES

# A pull request description: wording only.
[*.pr]
Magus.Filler = YES
Magus.Terms = YES
Magus.Attribution = YES
Magus.Puffery = YES
Magus.ASCII = YES
